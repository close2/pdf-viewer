[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/example/pdf-viewer"

# Dependency versions are pinned once here and referenced as `dep.workspace = true`
# from member crates, so a version appears in exactly one place in the tree.
[workspace.dependencies]
# Internal. Each carries an explicit version as well as a path: a bare path
# dependency is a wildcard requirement, which the ban policy in deny.toml rejects, and
# which would also prevent publishing these crates.
pdf-spec = { path = "crates/pdf-spec", version = "0.1.0" }
pdf-syntax = { path = "crates/pdf-syntax", version = "0.1.0" }
pdf-model = { path = "crates/pdf-model", version = "0.1.0" }
pdf-font = { path = "crates/pdf-font", version = "0.1.0" }
pdf-render = { path = "crates/pdf-render", version = "0.1.0" }
pdf-sandbox = { path = "crates/pdf-sandbox", version = "0.1.0" }
render-cpu = { path = "crates/render-cpu", version = "0.1.0" }
render-gpu = { path = "crates/render-gpu", version = "0.1.0" }
raster-compare = { path = "crates/raster-compare", version = "0.1.0" }
test-scenes = { path = "crates/test-scenes", version = "0.1.0" }
pdfref = { path = "tools/pdfref", version = "0.1.0" }
conformance = { path = "tools/conformance", version = "0.1.0" }
viewer-core = { path = "crates/viewer-core", version = "0.1.0" }
render-quorra = { path = "crates/render-quorra", version = "0.1.0" }
viewer-accessibility = { path = "crates/viewer-accessibility", version = "0.1.0" }
confined-transport = { path = "crates/confined-transport", version = "0.1.0" }
viewer-confined = { path = "crates/viewer-confined", version = "0.1.0" }
viewer-host = { path = "crates/viewer-host", version = "0.1.0" }
viewer-gtk = { path = "crates/viewer-gtk", version = "0.1.0" }
viewer-qt = { path = "crates/viewer-qt", version = "0.1.0" }
viewer-ffi = { path = "crates/viewer-ffi", version = "0.1.0" }
pdf-transform = { path = "crates/pdf-transform", version = "0.1.0" }
pdf-vfs = { path = "crates/pdf-vfs", version = "0.1.0" }
# The population two confined sweeps share. `pdf-vfs`'s read walk and `viewer-confined`'s sweep
# ask different questions of two different confined programs and need the *same* documents to ask
# them of, so the roots, the stride and the ten classes are one crate rather than a helper in each
# (ADR 0879). A dev-dependency of both and a dependency of neither.
corpus-classes = { path = "crates/corpus-classes", version = "0.1.0" }

# External on purpose: the document renderer doc/RENDER_LIBRARY.md commissioned,
# developed against that brief in its own repository and wired in here at its final
# milestone. A git dependency rather than a path so that CI and a fresh checkout
# reach it; Cargo.lock pins the exact revision, and deny.toml names the source.
quorra-gpu = { git = "https://github.com/close2/quorra", version = "0.1.0" }
quorra-scene = { git = "https://github.com/close2/quorra", version = "0.1.0" }

# Error handling
thiserror = "2.0.19"

# Parallelism. Used for tile rasterisation, image decode and thumbnail grids —
# never for the parser, which is sequential over shared mutable document state.
rayon = "1.12.0"

# FlateDecode is on the hot path of essentially every PDF. The `zlib-rs` backend
# is a pure-Rust rewrite that is performance-competitive with C zlib-ng, so this
# costs no safety.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }

# CPU rasteriser. Chosen over vello_cpu for maturity: this backend is the
# correctness oracle and sits on the startup critical path, so predictability
# outranks sharing a scene model with the GPU backend. See doc/adr/0002.
tiny-skia = "0.12.0"

# GPU rasteriser. `vello` re-exports the exact `wgpu` it was built against as
# `vello::wgpu`; that re-export is used rather than a separate wgpu dependency, so
# version skew between the two is impossible by construction.
# `debug_layers` is on for one reason and it is not debugging: it is the only way to learn
# whether a render actually happened. Vello sizes its GPU working buffers from a table of
# constants — its own comment calls them "hand picked to accommodate the vello test scenes" — and
# a scene that needs more overflows them *on the device*, which sets a flag, stops filling, and
# leaves the target blank. `render_to_texture` cannot see that flag; the deprecated async variant
# returns it, and only downloads it when this feature is on (`let robust = cfg!(feature =
# "debug_layers")`). Without it a page of text at a high enough resolution is silently blank —
# page 6 of ISO 32000-2 at 1132x1600 was, on an AMD 890M (ADR 0127). The cost is one extra
# pipeline and one small buffer download per render: +0.8 ms on a 596x842 page, about 11%,
# measured four ways at ADR 0127. It also makes vello panic on a scene with no lines, which
# `render_gpu::keep_the_line_soup_non_empty` works around and ADR 0127 explains.
vello = { version = "0.9.0", features = ["debug_layers"] }
# Minimal block_on. wgpu's device setup is async but the rasteriser interface is
# synchronous, and pulling in a full async runtime for two awaits would violate the
# startup-cost rules in CLAUDE.md.
pollster = "0.4.0"
# Path dashing for `render-quorra`: quorra strokes but does not dash (its brief says
# dashing is settled on this side), and `kurbo::dash` is the dasher `render-gpu`
# already uses through vello — the same algorithm keeps the backends' dashes
# identical. Pinned to the version vello resolves so one copy is built.
kurbo = "0.13.1"
# Windowing. 0.30 is the current stable line; 0.31 is still a beta series.
#
# `wayland-csd-adwaita` is deliberately off. It draws Adwaita-style client-side
# decorations, and reaches them via ab_glyph -> owned_ttf_parser -> ttf-parser, which
# is unmaintained (RUSTSEC-2026-0192) with no safe upgrade. The advisory's recommended
# replacement is `skrifa`, which this project already uses for its own font work.
#
# The cost is no client-side decorations under a compositor that offers none. KDE's
# KWin provides server-side decorations, and the CSD fallback exists mainly for GNOME,
# so this is the right trade for a KDE-targeted viewer. If GNOME support matters later,
# the answer is decorations drawn with our own font stack rather than pulling an
# unmaintained parser back in.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }

# The software present path, and the only reason it is here: **`--cpu` has to mean *no graphics
# device*.** Until the three-hundred-and-eighty-fourth session the flag chose the rasteriser and
# nothing else — the presenter still loaded the driver, selected an adapter and made a device, and
# the processor's raster went back through that device because a surface was the only path pixels
# took to the screen. So a driver that faults while it is loading took `--cpu` down with it, which
# is what the project owner hit on Windows. Putting a raster on a window without a device is what
# this crate does and nothing else does; it is `rust-windowing`'s, beside `winit`, and shares
# `raw-window-handle` 0.6 with it.
#
# What it costs is written down in ADR 0221, including the part that is not the crate's own: its
# X11 backend reaches Xlib through `tiny-xlib`, which loads libX11 in a `ctor` — before `main`,
# on every launch, whether or not a software surface is ever made. That is measured there rather
# than assumed, and it is the one line of this dependency that argues against it.
#
# `kms` is **off**, and with it `drm` and `gbm`: a document viewer draws into a window, not onto
# a bare console framebuffer. The rest of the feature set is winit's own — X11 and Wayland, both
# dlopened rather than linked, so a binary built here still runs on a machine with only one of
# them.
softbuffer = { version = "0.4.8", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }

# The platform's clipboard, for the one host that has no toolkit to ask (ADR 0519). `winit`
# offers none deliberately — a clipboard is a *selection owner* that has to answer requests for
# as long as the program lives, which is a service rather than a window property — so the tier-2
# host is the only consumer in this tree that cannot reach the platform through something it
# already links. `viewer-gtk` asks `gdk::Clipboard` and `viewer-qt` asks `QClipboard`; neither
# names this crate, and `viewer-core` must never see it.
#
# **What it costs on this platform is one compiled package**, measured rather than assumed:
# `cargo add` locks four (`arboard`, `clipboard-win`, `error-code`, `objc2-app-kit`) and three of
# them are `cfg`-gated to Windows and macOS, while its Linux dependencies — `x11rb`,
# `parking_lot`, `percent-encoding` and `log` — were already in this lockfile through `winit` and
# `softbuffer`. `MIT OR Apache-2.0`, and `cargo deny` is what checks that rather than this line.
#
# **`image-data` is off**, which is the default feature and would bring the whole `image` crate to
# put a raster on the clipboard: what leaves this program is §14.8.2.5's *text*, and a page copied
# as a picture is a feature nobody asked for.
#
# **`wayland-data-control` is off, and that is a decision with a cost.** The feature adds six more
# packages — `wl-clipboard-rs`, `tree_magic_mini`, `nom`, `petgraph`, `fixedbitset`, `os_pipe`, a
# MIME sniffer and a graph library for the business of handing over a string — and it speaks
# `zwlr_data_control`, which is a wlroots protocol rather than a Wayland one. Without it `arboard`
# uses its X11 backend, which reaches a Wayland session through XWayland; where there is no
# XWayland the copy is **refused out loud** rather than silently dropped (trap 5), which is what
# `viewer_ui::clipboard` reports. Six packages for the compositors that offer the protocol is the
# wrong price, and the entry is worth revisiting if this program is ever asked to run without
# XWayland.
arboard = { version = "3.6.1", default-features = false }

# The first native host's toolkit (ADR 0244, `doc/todo/30`). `gtk4-rs` is the GNOME
# project's own binding: safe Rust over the C library, generated from GIR, with no C++
# bridge — which is why `doc/todo/30`'s order puts GTK4 first and Qt second.
#
# **Confined to `crates/viewer-gtk` and nowhere else.** Nothing under `crates/` that
# touches PDF bytes may name it, and the one crate `viewer-gtk` depends on that is also a
# host's — `viewer-host`, the toolkit-free half both native hosts share since the
# four-hundred-and-tenth session — names no toolkit at all, so `gtk4` reaches exactly one
# manifest. `viewer-gtk` itself keeps `#![forbid(unsafe_code)]`: the binding's `unsafe` is
# inside `gtk4-sys` and `glib`, and a host written against the safe layer needs none of its
# own. That is the property `cxx` does not have, and ADR 0246 records exactly what it costs
# instead: one hand-written `unsafe` token in `viewer-qt`, with a test on its position.
#
# What it costs, measured rather than asserted, is in ADR 0244: a link against the system
# GTK 4, GLib, Pango, cairo and graphene, and about 40 crates of bindings. It is dynamically
# linked against the platform's own libraries — this is a *native* host, so depending on the
# desktop being installed is the point rather than a cost.
#
# `v4_10` is the feature floor and is deliberate: it is what makes `gtk::ColumnView`,
# `gtk::DropDown` and `gtk::TreeListModel` available without reaching for the widgets GTK
# deprecated in that release (`GtkTreeView`, `GtkComboBoxText`), which would compile with a
# deprecation warning and this workspace turns warnings into errors.
#
# **`v4_12` was raised and put back in the six-hundred-and-seventy-eighth session, and the
# reason is worth a round's time to whoever reads this next** (ADR 0508). `doc/todo/30` recorded
# `viewer-gtk`'s one unobeyed clause — Table 234's `/TI` — as blocked on *this line*, because
# `GtkListView::scroll_to` is GTK 4.12. The floor was raised, the method was called, and it moved
# nothing: what it does is put an item *into view*, which is not Table 234's "first option
# visible", and its `GtkScrollInfo` argument carries only which axes may move rather than an
# alignment. Qt's `QAbstractItemView::PositionAtTop` has no GTK counterpart. The entry is obeyed
# through the `GtkScrolledWindow`'s own adjustment instead — `controls.rs::scroll_to_top_index` —
# which needs nothing this floor does not already have. **What a floor costs is a runtime
# requirement**, since these crates link dynamically against the platform's own GTK, so it is not
# raised for an API that does not answer the question.
gtk4 = { version = "0.11.4", features = ["v4_10"] }

# The second native host's bridge, and the only C++ in this tree. `doc/todo/30`'s order put Qt
# second precisely because it costs one: `cxx` generates the `extern "C"` shims that carry
# messages between Rust and a C++ Qt Widgets application, and `cxx-qt-build` is what finds Qt
# through `qmake6`, runs `moc` over the host's own headers and links the Qt modules.
#
# **Confined to `crates/viewer-qt` and nowhere else**, exactly as `gtk4` is confined to
# `crates/viewer-gtk`: nothing under `crates/` that touches PDF bytes names either, and every
# such crate keeps `#![forbid(unsafe_code)]`. That attribute is the one thing this host cannot
# have and `viewer-gtk` can — `#[cxx::bridge]` expands to `unsafe` blocks and `extern "C"`
# declarations, so the crate root is `#![deny(unsafe_code)]` with the exemption on the one
# generated module. ADR 0246 argues it and `no_unsafe_outside_the_bridge` enforces it.
#
# `cxx-qt` itself — the crate that makes a Rust type into a `QObject` — is deliberately *not*
# here. A Qt Widgets host subclasses `QAbstractItemModel` and `QWidget` in C++, where moc can
# see them; taking `cxx-qt` as well would add a QML-shaped runtime and two more initialisers to
# the link for nothing this host uses. ADR 0246.
cxx = "1.0.199"
cxx-qt-build = "0.9.1"

# Fonts. Memory-safe replacement for FreeType; covers OpenType/TrueType/CFF.
# Type1 and Type3 are handled in `pdf-font` because skrifa does not cover them.
skrifa = "0.45.1"

# skrifa's parsing layer, named directly only to turn on `agl`, which skrifa itself does
# not enable. The Adobe Glyph List maps a glyph name to the character it draws, and both
# halves of non-embedded font support need it: a substitute font is addressed through its
# `cmap`, which is keyed by character, while PDF addresses a simple font by glyph name;
# and text extraction needs the same mapping when a font has no `/ToUnicode`.
#
# The version is pinned to the one skrifa depends on so cargo unifies them into a single
# build rather than compiling two copies. Keep them in step when upgrading skrifa.
read-fonts = { version = "0.42.1", features = ["agl"] }

# ISO 32000-2 §14.7's logical structure, handed to a platform accessibility API. `CLAUDE.md`
# names AccessKit as this project's accessibility layer and this is it: the vocabulary crate
# is platform-free, dependency-light and used by the *mapping*, which builds and is tested on
# every platform.
accesskit = "0.24.1"

# The Linux adapter, and the one place in this tree an asynchronous runtime exists. It reaches
# AT-SPI through `zbus`, which is asynchronous, so it puts an `async-io` executor on a thread of
# its own; that thread connects to the session bus and every adapter stays *inactive* until
# `org.a11y.Status.IsEnabled` says an assistive technology is present. Sixty-one packages arrive
# with it, all MIT or Apache-2.0, and `memchr` is not among the ones that reach a shipped binary
# — which is the crate ADR 0186 declined `quick-xml` over.
#
# What confines it: only `viewer-accessibility` may name it, that crate is Linux-only in its own
# manifest, and `Bridge::new` is called *after* the first frame is presented, so nothing on the
# launch path touches D-Bus. Measured before and after in ADR 0214.
accesskit_unix = "0.22.1"

# §14.3.2's metadata streams are XMP, which is RDF/XML (ISO 16684-1), so reading one is an
# XML parser over untrusted bytes — 319 of the 974 corpus documents carry a stream. ADR 0186
# has the argument; the short form is that this is the smallest thing that can do the job:
# 2148 lines, `#![forbid(unsafe_code)]`, **no dependencies at all**, and a pull tokenizer that
# borrows from the input rather than building a tree.
#
# The security properties are the reason it is this crate and not a larger one. It resolves
# no entity — a `<!ENTITY>` declaration arrives as a token and is never substituted, so the
# billion-laughs expansion has nothing to expand; it opens no file and no socket, so an
# external entity or a DTD `SYSTEM` identifier is inert; and it is an iterator over a state
# machine rather than a recursive descent, so nesting costs no stack. What is left for
# `pdf_model::xmp` to bound is its own stack, which it does explicitly.
#
# The cost, written down: no unescaping is done for us, so the five predefined entities and
# numeric character references are expanded in `xmp.rs` and an undefined reference is kept
# verbatim; and the tokenizer takes `&str`, so ISO 16684-1's other two permitted encodings
# are decoded to UTF-8 before it sees them.
xmlparser = "0.13.6"

# Image codecs, pure Rust.
zune-jpeg = "0.5.15"
zune-png = "0.5.2"

# JBIG2 and JPEG 2000, the two codecs this project spent a year assuming it would have to
# wrap from C. Both are `#![forbid(unsafe_code)]`, and `default-features = false` is
# load-bearing rather than tidiness: it drops the `simd` feature, whose `fearless_simd`
# backend is the only `unsafe` either would otherwise reach, and with it the `image` and
# `moxcms` dependencies. What is left has no transitive dependencies at all beyond
# `hayro-ccitt`, which JBIG2 needs for MMR-coded regions.
#
# The cost of the choice is written down in doc/adr/0014: these are two decoders this
# project does not own, so a disagreement with ITU-T T.88 or T.800 is an issue to report
# rather than a defect to fix. Against that, they are 19 400 lines of the most error-prone
# code in the format, already validated against corpora far larger than this one.
# **Pinned to the same git revision as `hayro-jpeg2000` below, and for a bound rather than a
# defect.** 0.3.0 refuses a §7.4.7 text region declaring more than a flat 10 000 symbol
# instances — "[a]rbitrarily chosen, but we need some limit to prevent timeouts" — and a full
# page of scanned text has more: three crawled documents state 13 264, 22 043 and 4 794
# instances and three of them drew short or blank here. Upstream replaced the constant with
# pdfium's heuristic, `segment_data_len × 32`, in `1be7ab10` (#1278), which is a bound
# proportional to the bytes the segment actually carries and so cannot refuse a region a small
# segment could not have encoded. No release carries it — 0.3.0 is still the newest on
# crates.io — so this takes the commit, which `64efcaca` already contains.
#
# `hayro-ccitt` moves with it, because `hayro-jbig2` reaches MMR through it and two copies of
# one crate from two sources is a version nobody chose.
hayro-jbig2 = { git = "https://github.com/close2/hayro", rev = "64efcaca54cdc71cf8a1cd3bfd2333b1ce85cda2", version = "0.3.0", default-features = false, features = ["std"] }
# **Pinned to a git revision of a fork, and that is a departure with an expiry date.** Two
# defects, one clause. ISO/IEC 15444-1 E-6 reconstructs a nonzero coefficient at
# `r * 2 ^ (Mb - Nb)` above its decoded magnitude: 0.4.0 applied none of that term, and
# upstream `9cce046b` applies it except where `Mb - Nb` is zero — which is a coefficient that
# was *fully* decoded, where `2 ^ 0 = 1` makes the term `r` itself rather than nothing.
# `doc/JPEG2000_FEEDBACK.md` reported the first in the two-hundredth session and found the
# second in the three-hundred-and-eleventh, by bisecting on resolution. **Both are upstream
# now**: the second was merged as #1340, reimplemented rather than taken — `reconstructed()`
# carries an `irreversible: bool` and returns `f32` where our `2a1abd14` passed the
# quantisation style, which is the better shape because it puts the lossless case in the type.
# Against ISO/IEC 15444-5's reference software the worst sample error over the corpus falls
# from **87 levels to 1**, and 3.4 M differing samples to 5 900.
#
# **So one of the three is left, and it is why this `rev` still exists** — `doc/todo/24`'s
# step 0. A decode asked for a reduced resolution level still reserved a coefficient for every
# sample of the full-resolution image, which was 3.4 GB of address space for `issue19517.pdf`
# however small a raster was wanted and a dead worker inside `pdf_sandbox::lockdown`'s
# gigabyte. `pdf-sandbox` asks for a reduced level since the four-hundred-and-eighty-sixth
# session (ADR 0321), and that file draws. ADR 0233 and `doc/JPEG2000_FEEDBACK.md` §10 have
# the measurements.
#
# The `rev` is that fix rebased onto upstream `4aaabad7`, so the fork is now upstream's main
# plus exactly one commit rather than a divergent branch — the pull request in
# `doc/HAYRO_PR_REDUCED_RESOLUTION.md` is that commit and nothing else. Go back to crates.io
# the moment a release carries it; `deny.toml` says the same.
hayro-jpeg2000 = { git = "https://github.com/close2/hayro", rev = "64efcaca54cdc71cf8a1cd3bfd2333b1ce85cda2", version = "0.4.0", default-features = false, features = ["std"] }

# Cryptography, for ISO 32000-2 §7.6's standard security handler. Five primitives, all
# from RustCrypto, all named by the clause that needs them: RC4 and AES for §7.6.3.2's
# Algorithm 1 and §7.6.3.3's Algorithm 1.A, MD5 for §7.6.4.3.2's Algorithm 2, and
# SHA-256/384/512 for §7.6.4.3.4's Algorithm 2.B, which chooses among the three by a
# remainder modulo 3.
#
# Taking these rather than writing them is doc/adr/0031's decision and follows the same
# precedent ADR 0014 set for the image codecs: a widely-reviewed implementation of a
# published algorithm beats a fresh one, and cryptography is the domain where that argument
# is strongest. The alternative was about 700 lines of in-tree cipher code — all of it
# covered by published test vectors, none of it reviewed by anyone but us.
#
# `cbc` is the mode §7.6.3.2 step (d) names; ECB appears only for the 16-byte `/Perms`
# block of Algorithm 13, which is one block and so needs no mode wrapper at all.
aes = "0.9.2"
cbc = "0.2.1"
rc4 = "0.2.0"
md-5 = "0.11.0"
sha2 = "0.11.0"

# §12.8.3's signature values name six digest functions between Table 260 ("SHA1 ( PDF 1.3 )
# SHA256 (PDF 1.6) SHA384 (PDF 1.7) SHA512 (PDF 1.7) RIPEMD160 (PDF 1.7 )") and Table 256's
# `/DigestMethod`, which adds MD5. `sha2` and `md-5` above already cover four of them; these two
# are the remaining pair, from the same RustCrypto family, under the same MIT OR Apache-2.0 as
# every other hash here. Implementing five of six would leave the sixth silent rather than
# refused, which is the failure this project spends its rounds removing. ADR 0215.
sha1 = "0.11.0"
ripemd = "0.2.0"

# ISO/TS 32001:2022 section 5.1.1 adds four more: "the SHA3-256, SHA3-384, SHA3-512 and SHAKE256
# hash algorithms in the secure hash algorithm 3 (SHA-3) hash algorithm family as defined in FIPS
# PUB 202". The *line* these sit on is why they are these packages rather than others: `digest`
# 0.11, the same trait stack as `sha2`, `sha1`, `md-5` and `ripemd` above, so no second hash stack
# enters the tree — the shape ADRs 0229 and 0348 both declined.
#
# **Two packages rather than one, because upstream split them.** `sha3` 0.12.0 removed `Shake128`
# and `Shake256` into the `shake` crate, so the current line covers three of the standard's four
# in one package and the fourth in another; `sha3` 0.11.0 still has both and is superseded, which
# would buy two packages instead of four at the price of pinning to a dead minor. Four new
# compiled packages between them (`sha3`, `shake`, and the shared `keccak` and `sponge-cursor`),
# all `MIT OR Apache-2.0`, MSRV 1.85 against the pinned 1.97.1, all RustCrypto — the supplier of
# every cipher and digest already here. `sha3`'s default `oid` feature costs nothing (`const-oid`
# is already in this graph) and buys the corroboration `cms::Digest`'s identifier test uses;
# `shake` has no such feature, which is why SHAKE256's identifier has no second reading. ADR 0390.
sha3 = "0.12.0"
shake = "0.1.0"

# §12.8.3's signature verifications — RFC 8017's two RSA paddings and FIPS 186-4's DSA — run
# their modular arithmetic on this rather than on the in-tree limb arrays that preceded it
# (ADR 0331, an owner decision superseding ADR 0314's in-tree choice; the verifiers and their
# budgets stay in `pdf-model`, only the arithmetic moved). Same RustCrypto supplier as every
# cipher and digest above, `Apache-2.0 OR MIT` like them, three packages this tree did not
# already have (itself, `ctutils`, `cmov`). No default features: `alloc` is the one feature the
# heap-allocated `BoxedUint` needs, and the default `rand` would pull a random-number stack into
# code that only ever verifies public numbers.
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc"] }

# Table 260's third algorithm family, as ISO/TS 32002 section 5.1.3's Table 3 enumerates it:
# "P-256 … P-384 … P-521 … brainpoolP256r1 … brainpoolP384r1 … brainpoolP512r1". These are the
# first three, and the *arithmetic* is what ADR 0331's owner decision says to take rather than
# write — a curve crate's prime, base point and order are reviewed constants on exactly the
# footing `crypto-bigint`'s carry chains are (ADR 0532).
#
# **`default-features = false, features = ["ecdsa"]` is four defaults dropped and one kept.** The
# kept one pulls `arithmetic`, `ecdsa-core/algorithm` and the curve's own `sha2` hash binding —
# the whole of what `PrehashVerifier::verify_prehash` needs. Dropped: `pem` and `std`, which a
# verifier reading DER out of a PDF never reaches; and `precomputed-tables`, which trades binary
# size for scalar-multiplication speed and is the wrong side of that trade here — a signature is
# verified at most a handful of times per document, on the document's own thread, never on the
# launch path, while every byte of a table is in the image a launch pages in.
#
# **Brainpool is not here and it is not an oversight.** `bp256` and `bp384`'s current line is
# 0.14.0-rc.15 — this tree takes no pre-release — their stable 0.6 is the old `digest` line, and
# **brainpoolP512r1 has no crate on crates.io at all**. All three reach a reader as the curve
# identifier the certificate states rather than as a silence; `ecdsa.rs` names them by the
# constants `const-oid` carries. Re-measured 2026-08-23; ADR 0331 measured the same on 08-14.
#
# **`ecdsa` is named directly and costs nothing**: it is the same package the three curve crates
# already lock, and naming it is what lets `ecdsa.rs` write *one* generic verification over the
# three curves instead of three copies of a security-critical path.
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }

# ISO/TS 32002 section 5.1.2 adds an EdDSA row to Table 260 — "IETF RFC 8032, Edwards-curve
# Digital Signature Algorithm (EdDSA) (PDF 2.x) using the Ed25519 or Ed448 elliptic curves" — and
# its Table 4 pairs Ed25519 with SHA512. This is that curve, and it is a different group law from
# the three above rather than a fourth curve of the same shape, which is why it is a separate
# package rather than a fourth line there.
#
# **`BSD-3-Clause`, which `deny.toml` already allows** — no exception was added and none was
# needed. It and `curve25519-dalek` are the only two crates in this graph under it.
#
# **Its default features are both dropped and both for a reason.** `zeroize` wipes secret key
# material, and this program holds no secret: every number it touches came out of a file a
# stranger wrote. `fast` is `curve25519-dalek/precomputed-tables`, declined on the same
# size-against-speed reasoning as the three curves above.
#
# **What it costs that the others do not: `curve25519-dalek`'s SIMD backend carries `unsafe`.**
# On x86_64 its build script selects `simd` by default and that backend's field arithmetic is
# `#[unsafe_target_feature]` intrinsics. This is the same shape as what `sha2`, `cmov`,
# `block-buffer` and `hybrid-array` — all already on `pdf-model`'s path — do for the same reason,
# and `#![forbid(unsafe_code)]` remains what it always was: compiler-enforced over *this
# project's* source. `ed25519-dalek` itself carries `#![forbid(unsafe_code)]`. ADR 0532.
ed25519-dalek = { version = "3.0.0", default-features = false }

# **Zero new packages, and that is the whole reason this line exists.** `const-oid` is already in
# this graph as `digest` 0.11's dependency; naming it directly turns on its `db` feature, which is
# a compiled-in table of object identifiers grouped by the RFC that assigns each one.
#
# What it buys is principle 5's problem in `cms::Digest::oid`, solved for a whole family at once:
# the elliptic-curve identifiers — `id-ecPublicKey`, the three `namedCurve`s, the three Brainpool
# ones this tree refuses by name, `ecdsa-with-SHA*`, `id-ecdsa-with-sha3-*`, `id-Ed25519` and
# `id-Ed448` — are numbers no document under `doc/` prints, and this is a second party's reading
# of the registries that do. Nothing here is transcribed from memory.
#
# The table is `static` data, so it costs no parse time at launch (`CLAUDE.md`'s startup rule),
# and the linker keeps only the constants that are named: the `DB` name index is referenced by
# nothing in this tree and does not survive into the binary.
const-oid = { version = "0.10.2", default-features = false, features = ["db"] }

# §7.6.4.1 requires a password to be processed with the SASLprep profile (Internet RFC
# 4013) of stringprep (Internet RFC 3454) before it is used. That is Unicode normalisation,
# a character-class mapping and a BiDi check — data rather than algorithm, and exactly the
# kind of thing this project vendors rather than reimplements. It matters only for a
# non-ASCII password, on which SASLprep is not the identity; `saslprep-r6.pdf` and
# `pr6531_2.pdf` in the corpus are the two files that prove it.
stringprep = "0.1.5"

# §7.6.3.1's initialisation vector: "the initialization vector is a 16-byte random number
# that is stored as the first 16 bytes of the encrypted stream or string." That is the one
# place this project needs randomness, and it needs the cryptographic kind — a CBC
# initialisation vector an attacker can predict is a CBC mode without one.
#
# `getrandom` is the thinnest thing that provides it: no PRNG state, no `rand` ecosystem,
# one call to the platform's own source (`getrandom(2)` on Linux). Deriving the vector from
# the plaintext instead — the SIV construction — would need no dependency and would keep a
# save byte-for-byte reproducible, but it is not what the clause says, and it would leak
# that two objects in one update encrypt the same bytes. Exact conformance is the cheaper
# side of that trade. The cost is written down in doc/adr/0129: saving the same edit twice
# no longer produces identical bytes for an encrypted document, so the tests read the file
# back rather than compare it.
getrandom = "0.4.3"

# Group 3 and Group 4 fax, for `CCITTFaxDecode` (ISO 32000-2 §7.4.6). Named here rather
# than reached through `hayro-jbig2`: it has been in the tree since the seventh session as
# that crate's MMR dependency, and depending on a dependency's dependency is a version
# nobody chose. ADR 0021 has the argument, which is not the same one ADR 0014 made — T.4
# and T.6 are two pages of Huffman tables and a state machine, so "we could not write this"
# is untrue here, and what decides it is instead that a decoder already compiled into this
# binary and exercised by every MMR-coded JBIG2 region has been tested by more documents
# than a fresh one would be.
#
# **Pinned to the same git revision as `hayro-jbig2`**, and only because that crate is: the
# two are one dependency here, `hayro-jbig2` names `hayro-ccitt` by path inside its own
# workspace, and a crates.io `hayro-ccitt` beside a git one would be two crates with one name
# compiled into one binary. Nothing about `CCITTFaxDecode` asked for the move.
hayro-ccitt = { git = "https://github.com/close2/hayro", rev = "64efcaca54cdc71cf8a1cd3bfd2333b1ce85cda2", version = "0.3.0", default-features = false }

# The whole `hayro` renderer, used by `tools/hayro-compare` and by nothing else. It is the
# only other feature-complete pure-Rust PDF rasteriser, which makes it two things this
# project has not had: a fourth opinion for the oracle, and a speed baseline measured in the
# same language under the same safety rules. It is *not* an independent reference — see
# `Reference::Hayro` for the list of crates we share with it — and it never enters a shipped
# binary.
hayro = "0.7.1"

# Sandboxing. `rustix` is used for the resource limits and for polling the worker's pipe
# with a deadline; `libc` only for its system-call *numbers*, which are constants.
landlock = "0.4.6"
seccompiler = "0.5.0"
rustix = { version = "1.1.4", default-features = false, features = [
    "std",
    "process",
    "event",
] }
libc = "0.2.180"

# The logging *facade* wgpu, vello and naga already write to. Nothing in the tree writes a log
# record; what this buys is the ability to *receive* one. Without a `log::Log` installed, every
# message those three produce — a shader that would not compile, a device that was lost, a
# validation failure — is dropped on the floor, which is how a page that would not draw produced
# no output at all (ADR 0126). `viewer-ui` installs a twenty-line receiver behind `--trace`; no
# implementation crate depends on this and none logs.
log = { version = "0.4.33", features = ["std"] }

# Development-only. Cargo has no `workspace.dev-dependencies`; these are declared
# here and referenced from a member's `[dev-dependencies]` with `workspace = true`.
criterion = "0.8.2"
# Instruction-count benchmarking, through Valgrind. Wall-clock timings vary with CPU
# frequency, thermal state and whatever else the machine is doing — during this project's
# own work a change measured as both a 24% regression and an 8.5% improvement twenty
# minutes apart, purely from background build load. Counting instructions is deterministic,
# which is what a CI gate needs to be. Requires `valgrind`, and
# `cargo install iai-callgrind-runner` at a matching version.
iai-callgrind = "0.16.1"
proptest = "1.11.0"
# PNG encoding for test artefacts and, later, the comparison harness. Straight-alpha
# RGBA in, which matches `Raster`'s documented format with no conversion.
png = "0.18.1"

# Lints applied to every member via `[lints] workspace = true`.
#
# `unsafe_code` is deliberately NOT set here. It is declared per crate at the top
# of each `lib.rs`, so a reader sees a crate's safety posture in the crate itself
# rather than having to consult this file. See CLAUDE.md principle 3.
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every panicking path must be a deliberate, documented decision.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Arithmetic on untrusted input is a correctness and DoS concern, not a style one.
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Documentation quality.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "warn"

# What a person runs and what every performance number is taken from. Whole-graph
# link-time optimisation over one code generation unit is the slowest thing this
# workspace does — `viewer-ui`'s link is essentially single-threaded and is on its own
# the whole wall clock of `doc/todo/02` §5, every other binary finishing underneath it.
# `[profile.gates]` below is where the gates went instead.
#
# **It stays because it was measured, in the seven-hundred-and-fifty-second session, and
# not because the binaries here are what a launch is timed with** — which is what this
# comment used to argue and is a reason to keep the *profile*, not a reason to keep the
# setting. `doc/todo/43` §1 had asked since ADR 0222 what the fat link is *for*, naming
# `lto = "thin"` following the gates as the candidate. ADR 0666 ran it, on callgrind
# counters because instruction counts do not care what else is on the machine:
#
# | against this profile | `callgrind_open` | `callgrind_interpret` | `callgrind_rasterise` |
# |---|---|---|---|
# | `lto = "thin"`, `codegen-units = 16` | +12.30% | +1.65% | +4.07% |
# | `lto = "thin"`, `codegen-units = 1`  |  +4.06% | +1.84% | +0.67% |
# | `lto = "fat"`,  `codegen-units = 16` | +10.72% | -0.01% | -0.00% |
#
# Exactly reproducible, three passes each. **Both settings are load-bearing and on
# different paths**: cross-crate inlining is what the interpreter and the rasteriser
# gain, and the single code generation unit is what §7.5's cross-reference parse gains,
# so no cheaper combination reproduces this one. Binaries are also about a quarter
# smaller here than under the gates profile. Principle 2 makes startup a first-class
# requirement, so a 12.3% regression on the launch path's largest step is not a trade
# that buys back link time — especially since ADR 0428 made §5 run every fifth round
# rather than every round.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Two departures from Cargo's defaults, each measured in one tree and each with a cost
# written down. Both are ADR 0222's, and the round that made them ran the whole suite under
# each: **1308 tests and one doctest pass either way**, which is the same 1309 `cargo test
# --workspace` runs at `debug = 2, opt-level = 0`.
#
# `debug = "line-tables-only"` — line tables rather than full debug information. An
# incremental `cargo test --workspace --no-run` after touching one file in `pdf-model` falls
# from **12.9 s to 7.0 s** (three samples apiece), and a clean dev tree from **17 GB to
# 8 GB**: this workspace links about 120 test binaries against one large rlib graph, so what
# the linker copies into each of them is most of what it does. What it costs is a debugger's
# view of local variables. It does not cost a *backtrace*, which is what this project reads
# when a test fails — file and line survive, because they are what a line table is.
#
# `opt-level = 1` — the workspace's own crates optimised lightly. `cargo nextest run
# --workspace` falls from **76.6 s to 20.0 s** (two samples apiece), because this suite's
# critical path is one test that draws each of its scenes whole and again at 2, 3, 5, 8
# and 16 strips, and unoptimised rasterisation is most of what that costs. It is **not** a semantic change: `dev` keeps
# `debug-assertions` and `overflow-checks` on — they are their own profile keys — so an
# arithmetic overflow still panics and every `debug_assert!` still fires. What it costs is
# **a cold build, 40 s to 86 s**, which is a fresh clone and nothing a round does; the
# incremental case did not pay for it at all and came out slightly cheaper, 7.0 s to 5.5 s,
# because optimised code is smaller code to link 120 times. The other cost is that inlining
# merges frames, so a backtrace is less precise than the line tables above could be.
#
# `[profile.bench]` sets `debug = true` on its own line below, so profiling and the callgrind
# counters are unaffected by either.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# The corpus gates' profile: release-grade optimisation, cheap linking.
#
# Every gate in `doc/todo/02-every-round.md` §2 ran under `[profile.release]` until the
# three-hundred-and-eighty-fifth session, which measured what that cost: a round pays a
# whole-graph fat link *per gate binary*, eight of them, over a dependency graph that
# includes wgpu, vello and quorra. Fat LTO with one code generation unit has almost no
# parallelism to give 24 cores, so the wall clock is the LLVM pass list.
#
# Thin LTO over 16 units keeps the optimisation — it is still cross-crate, still inlining
# across the graph — and gives the machine something to do in parallel. Measured after
# touching one file in `pdf-model`, two samples apiece (ADR 0222):
#
# | | `release` | `gates` |
# |---|---|---|
# | the six `pdf-model` gate binaries | 90.7 s | 20.1 s |
# | `render-quorra`'s corpus gate | 52.6 s | 12.8 s |
# | `viewer-confined`'s two binaries | 31.4 s | 8.1 s |
#
# What it costs is written down rather than assumed. **A second profile is a second copy of
# the object graph**: 1.1 GB on disk and, once, 66 s of compilation that `release` had
# already done. And **the gates now measure a differently-optimised program than the one
# that ships**, which would be intolerable if they measured *speed* — they do not; they
# compare pixels and counts, and ADR 0222 ran all eight under both profiles and diffed the
# output rather than arguing that codegen cannot move a float. Anything that takes a
# *timing* — `cargo bench`, the callgrind examples, the launch measurements — stays on
# `release` and `bench`, which is where the fat link belongs.
[profile.gates]
inherits = "release"
lto = "thin"
codegen-units = 16

# Benchmarks and profiling need symbols with release-grade optimisation.
# `panic` is not set: Cargo ignores it for the bench profile, and a setting that has
# no effect is worse than no setting because it implies one.
[profile.bench]
inherits = "release"
debug = true

# Fuzzing and sanitiser runs: optimised, with overflow checks kept on so that
# arithmetic bugs surface as findings rather than silently wrapping.
[profile.fuzz]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
lto = "thin"
codegen-units = 16
panic = "unwind"
