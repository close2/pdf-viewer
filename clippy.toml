# Kept in step with `rust-version` in the workspace manifest, so Clippy will not
# suggest constructs newer than the pinned toolchain.
msrv = "1.97"

# Any type large enough to be worth passing by reference should be passed by
# reference; the default (128 bytes) is generous for a renderer whose hot loops pass
# geometry and paint structures.
trivial-copy-size-limit = 16

# `cognitive-complexity-threshold = 20` stood here for a lint no crate enables, with a comment
# promising that irreducible cases would get "an explicit `#[allow]`" — trap 7, in the one file
# that configures the linter. It is deleted rather than enabled, and the deletion was measured
# first: `doc/verify.md` carries the command that turns the lint on over the whole workspace, and
# what it prints is why. `clippy::cognitive_complexity` counts `if` expressions; a `match` of any
# width and a nesting of any depth both score nothing — which is what this tree's long functions
# are made of. A threshold for a lint that cannot see the shape it is aimed at is a number nobody
# can act on. ADR 1024.

# `.unwrap()` in tests is fine and idiomatic; the workspace lints deny it elsewhere.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# ICC's own tag names, quoted verbatim from ISO 32000-2 §8.6.5.5 in rustdoc: the "to CIE"
# (AToB) and "from CIE" (BToA) information a blending-space profile shall carry. A quotation
# may not gain backticks, so the words are declared rather than the lint silenced at each site.
# RFC 5035's two structure names, quoted verbatim in `pdf-signature`: §12.8.3.4.3 (f) names that
# RFC for the signing-certificate attributes, and its section 5.4 is the sentence that tells the
# two apart. Declared here for the reason above rather than backticked at each site, because the
# sentences they appear in are quotations.
doc-valid-idents = ["AToB", "BToA", "SigningCertificate", "SigningCertificateV2", ".."]
