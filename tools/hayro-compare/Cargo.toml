[package]
name = "hayro-compare"
description = "Renders with hayro, for the oracle's fourth opinion and for speed comparison."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A tool, not a library. Its two binaries are built by `cargo build --workspace` and are
# never part of the viewer: `hayro` and its forty transitive dependencies exist in this
# workspace only to be compared against, which is why they live behind a member nothing
# ships rather than in `pdf-model`'s dev-dependencies, where they would be rebuilt on every
# `cargo test -p pdf-model`.
[dependencies]
hayro.workspace = true
pdf-model.workspace = true
pdf-render.workspace = true
pdf-syntax.workspace = true
png.workspace = true
render-cpu.workspace = true

[lints]
workspace = true
