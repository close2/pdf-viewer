[package]
name = "portable-adapter"
description = "Answers the portable conformance suite's text and structure requests for this program, in the suite's own adapter protocol."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `pdf-model` holds every reading the suite asks about: §9.10's text as the drawing pass maps it,
# §12.3.2.4's named destinations, §12.4.2's page labels and §12.7.4's field values. Pages are
# drawn by `quorra-transform render`, the program a person runs, so no rasteriser is linked here
# (`portable-conformance/adapters/quorra`, ADR 3207). No argument-parsing or serialisation
# dependency: the protocol is three words and a line of plain text (RFC 0016 section 5).
[dependencies]
pdf-model.workspace = true
pdf-syntax.workspace = true

[lints]
workspace = true
