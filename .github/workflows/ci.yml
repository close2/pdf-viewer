name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings. The lint policy in Cargo.toml sets levels to `warn` so that a
  # local build stays usable; CI is where they become errors.
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting and lints before anything expensive runs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The Arlington PDF Model is a submodule and the object-model validation
          # layer is generated from it, so a shallow checkout without it would not
          # build.
          submodules: true

      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the version; this action reads it rather than
        # taking a version here, so the pin has exactly one home.
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The fourteen specification documents this project is written against. They are
      # free to obtain from the PDF Association and not free to redistribute, so the
      # repository carries them encrypted rather than in the clear: doc/specifications.zip,
      # opened with a repository secret (ADR 0187, NOTICE section 3). CI is a developer
      # like any other here -- it has to put the documents in doc/ before the gates that
      # read them will run. Without them `cargo test --workspace` fails: the conformance
      # gate checks 4033 citations against doc/md/, and four tests open a PDF.
      #
      # The secret is passed through the environment rather than interpolated into the
      # command, so that a password containing shell metacharacters cannot become one.
      - name: Unpack the specifications
        env:
          SPEC_ZIP_PASSWORD: ${{ secrets.SPEC_ZIP_PASSWORD }}
        run: |
          if [ -z "$SPEC_ZIP_PASSWORD" ]; then
            echo "SPEC_ZIP_PASSWORD is unset. It is a repository secret, and a pull" >&2
            echo "request from a fork does not receive it -- see NOTICE section 3." >&2
            exit 1
          fi
          unzip -q -o -P "$SPEC_ZIP_PASSWORD" doc/specifications.zip
          test -s doc/md/ISO_32000-2_sponsored_EC3.md

      # GitHub runners have no GPU and no display. lavapipe is Mesa's software
      # Vulkan implementation, which lets the GPU backend run its full pipeline --
      # including compute shaders -- entirely on the CPU. It is slow, but it makes
      # GPU-path correctness testable in CI at all, and it is deterministic across
      # runners in a way real drivers are not.
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - name: Reference renderers for the comparison harness
        run: sudo apt-get install -y poppler-utils mupdf-tools ghostscript

      - run: cargo test --workspace

  # Supply chain. Separated so that an advisory published upstream does not mask a
  # genuine test failure, and vice versa.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Miri and the fuzz build need nightly, which is why rust-toolchain.toml pins
  # stable and these ask for nightly explicitly.
  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until the parser exists and this earns its keep
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - uses: Swatinem/rust-cache@v2

      # Miri interprets rather than executes, so it cannot run the GPU backend or
      # anything else that touches a driver. It is pointed at the pure-Rust crates,
      # which are precisely the ones that parse untrusted input.
      #
      # `--skip flate` skips exactly two tests, and names a defect that is not this
      # tree's: zlib-rs 0.6.6 deallocates through a pointer other than the one its
      # allocation was made through, which BOTH aliasing models reject -- Stacked
      # Borrows with "deallocating while item is strongly protected", Tree Borrows with
      # "deallocation through the root of the allocation is forbidden". It is a
      # dependency's unsafe, in a crate this project chose for being pure Rust at C
      # speed, and Miri here exists to check this tree's code. doc/todo/52 holds the
      # upstream report; the other 56 pdf-syntax tests and all 82 of pdf-render's run.
      - name: Miri on the pure-Rust core
        run: cargo +nightly miri test -p pdf-render -p pdf-syntax --lib -- --skip flate

      # Building the fuzz targets every push is what stops them rotting: a target that no
      # longer compiles is discovered here rather than the next time someone wants to fuzz.
      - name: Build the fuzz targets
        run: |
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz build --dev

      # A short run on every push, seeded from the committed corpus. Not a substitute for a
      # long campaign, but it catches a regression that reintroduces an easily-reached crash.
      - name: Fuzz briefly
        run: |
          cargo +nightly fuzz run lexer -- -runs=50000 -max_len=1024
          cargo +nightly fuzz run object -- -runs=50000 -max_len=1024
          cargo +nightly fuzz run document -- -runs=20000 -max_len=4096

  # A rolling pre-release, retagged at every push to main that passes its gates.
  #
  # `needs` is the whole design decision here: a snapshot binary that fails the project's
  # own gates is worse than no snapshot, because someone will run it and report what it
  # does. So the release waits for fmt, clippy and the full test suite.
  #
  # LINUX ONLY, and by decision rather than by omission. `pdf-sandbox` confines the JBIG2
  # and JPEG 2000 decoders with seccomp-BPF and Landlock, and carries a `compile_error!`
  # for every other platform saying why there is no fallback: "a sandbox that silently does
  # nothing on another platform is worse than no sandbox". `viewer-ui` depends on it, so
  # macOS and Windows executables wait on a real confinement for each -- Windows job
  # objects and AppContainer, macOS's App Sandbox -- which is a security argument with an
  # ADR attached and not a matrix entry.
  snapshot:
    needs: [check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # `gh release` writes to the repository, and the default token is read-only.
      contents: write
    # Two pushes in quick succession would otherwise race to retag `snapshot`, and the
    # loser could publish the older commit's binaries. The newest push wins.
    concurrency:
      group: snapshot
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          # pdf-spec generates the object model's validation tables from the Arlington
          # submodule in build.rs, so a checkout without it does not build.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Both executables, and both is not a detail: `pdf_sandbox::WORKER_PROGRAM` is a
      # separate program the viewer spawns for JBIG2 and JPEG 2000, looked for beside the
      # running binary. A viewer without it refuses those images rather than decoding them
      # in process -- there is deliberately no in-process fallback -- so an archive
      # carrying only the viewer would ship a quietly reduced program.
      - name: Build both executables
        run: cargo build --release --bin pdf-viewer --bin pdf-sandbox-worker

      # LICENSE and NOTICE travel with the binaries because they have to: this program is
      # MIT and contains BSD-3-Clause font programs and SIL OFL 1.1 Liberation Sans, and
      # both licences oblige a binary distribution to carry their notices. `pdf-viewer
      # --licences` prints the same text, and a file beside the executable is what someone
      # unpacking a tarball can actually find.
      - name: Package
        run: |
          set -eu
          target=x86_64-unknown-linux-gnu
          stage="pdf-viewer-snapshot-$target"
          mkdir "$stage"
          cp target/release/pdf-viewer target/release/pdf-sandbox-worker "$stage"/
          strip "$stage"/pdf-viewer "$stage"/pdf-sandbox-worker
          cp LICENSE NOTICE "$stage"/
          cat > "$stage"/README <<'TXT'
          pdf-viewer -- a snapshot build. Not a release; built from whatever was on main.

          Two executables, and they must stay in the same directory. pdf-sandbox-worker is
          the confined process that decodes JBIG2 and JPEG 2000 images; the viewer looks
          for it beside itself and, not finding it, refuses those images rather than
          decoding them unconfined.

              ./pdf-viewer [file.pdf]

          Needs a Vulkan driver. Page one goes to the graphics device by design, so a
          machine with no working Vulkan will not draw one.
          TXT
          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          ls -l "$stage.tar.gz"

      # A moving tag: delete the release and its tag, then create both at this commit.
      # `gh` is on the runner, so this needs no third-party action -- which matters for a
      # step holding a token that can write to the repository.
      - name: Publish the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot ${GITHUB_SHA:0:8}" \
            --notes "Built from \`${GITHUB_SHA}\` on $(date -u '+%Y-%m-%d %H:%M UTC'), after fmt, clippy and the full test suite passed.

          **This is not a release.** It is whatever was on \`main\`, retagged at every push.

          \`pdf-viewer\` and \`pdf-sandbox-worker\`, x86_64 Linux, glibc as new as the CI runner's. Unpack both into one directory and keep them there: the viewer spawns the worker for JBIG2 and JPEG 2000 and refuses those images without it.

          macOS and Windows are absent by decision, not by omission -- \`pdf-sandbox\` confines those decoders with seccomp-BPF and Landlock and refuses to build where it cannot, rather than pretending to confine anything." \
            pdf-viewer-snapshot-*.tar.gz pdf-viewer-snapshot-*.tar.gz.sha256
