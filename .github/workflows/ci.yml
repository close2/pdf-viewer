name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So that a branch can be put through these jobs *before* it is merged, without opening a pull
  # request for it. A round works in a worktree off `main` and every gate it runs is a statement
  # about that worktree, so the first time this file sees a round's work is the push that has
  # already landed -- which is how five pushes in a row went red with nobody watching (ADR 0450).
  # GitHub only offers this trigger for a workflow that is on the default branch, so it is a
  # standing capability rather than something a red branch can reach for.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings. The lint policy in Cargo.toml sets levels to `warn` so that a
  # local build stays usable; CI is where they become errors.
  RUSTFLAGS: -D warnings

jobs:
  # Fast feedback: formatting and lints before anything expensive runs.
  check:
    runs-on: ubuntu-latest
    # A ceiling, because the runner's own apt mirrors stalled for six hours on 2026-08-19 and
    # GitHub's default is to let a job run until its six-hour maximum. Nothing here takes more
    # than a small fraction of these numbers on a healthy runner, so a job that reaches one has
    # hung rather than grown -- and a hang that ends in minutes is legible where one that ends at
    # the platform ceiling looks like a platform problem. ADR 0450.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The Arlington PDF Model is a submodule and the object-model validation
          # layer is generated from it, so a shallow checkout without it would not
          # build.
          submodules: true

      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the version; this action reads it rather than
        # taking a version here, so the pin has exactly one home.
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The two native hosts bind two platforms, and a platform's development files are a
      # package manager's job rather than a Rust target's. `cargo clippy --workspace` builds
      # `viewer-gtk` and `viewer-qt`, so both toolkits have to be here — GTK 4 for the first
      # (ADR 0244), and Qt 6 plus a C++ toolchain for the second, whose `build.rs` finds Qt
      # through `qmake6` and runs `moc` (ADR 0246). This step is what the two `-p` cross-target
      # checks in `doc/verify.md` deliberately do *not* need, because neither names these crates.
      - name: The two native hosts' toolkits
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev qt6-base-dev qt6-base-dev-tools

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # see `check` above
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A display for the tests that build a device. The software Vulkan driver is
      # installed further down and is what those tests draw with; this is for the moment
      # `wgpu` looks past it. `render-raster`'s three-backend comparison builds a device
      # per scene, and on the second one `wgpu-hal` reaches its GLES backend and calls
      # EGL, which answers `BadDisplay` on a headless runner and panics rather than
      # reporting that a backend is unavailable. `raster/`'s own workflow ran everything
      # that touches a device under `xvfb-run` for this reason; that workflow was dropped
      # as a duplicate of this one on 2026-09-06 and the display was not a duplicate.
      - name: A display, for the backend `wgpu` falls through to
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0

      # The fourteen specification documents this project is written against. They are
      # free to obtain from the PDF Association and not free to redistribute, so the
      # repository carries them encrypted rather than in the clear: doc/specifications.zip,
      # opened with a repository secret (ADR 0187, NOTICE section 3). CI is a developer
      # like any other here -- it has to put the documents in doc/ before the gates that
      # read them will run. Without them `cargo test --workspace` fails: the conformance
      # gate checks 4033 citations against doc/md/, and four tests open a PDF.
      #
      # The secret is passed through the environment rather than interpolated into the
      # command, so that a password containing shell metacharacters cannot become one.
      - name: Unpack the specifications
        env:
          SPEC_ZIP_PASSWORD: ${{ secrets.SPEC_ZIP_PASSWORD }}
        run: |
          if [ -z "$SPEC_ZIP_PASSWORD" ]; then
            echo "SPEC_ZIP_PASSWORD is unset. It is a repository secret, and a pull" >&2
            echo "request from a fork does not receive it -- see NOTICE section 3." >&2
            exit 1
          fi
          unzip -q -o -P "$SPEC_ZIP_PASSWORD" doc/specifications.zip
          test -s doc/md/ISO_32000-2_sponsored_EC3.md

      # GitHub runners have no GPU and no display. lavapipe is Mesa's software
      # Vulkan implementation, which lets the GPU backend run its full pipeline --
      # including compute shaders -- entirely on the CPU. It is slow, but it makes
      # GPU-path correctness testable in CI at all, and it is deterministic across
      # runners in a way real drivers are not.
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - name: Reference renderers for the comparison harness
        run: sudo apt-get install -y poppler-utils mupdf-tools ghostscript

      # As in the `check` job: `cargo test --workspace` builds both native hosts, and each binds
      # its platform's development files. ADRs 0244 and 0246.
      - name: The two native hosts' toolkits
        run: sudo apt-get install -y libgtk-4-dev qt6-base-dev qt6-base-dev-tools

      # Two `sfnt` faces, named because eleven `pdf-model` tests need them and a test's
      # requirement belongs to this file rather than to some other package's dependency graph.
      # A substituted composite font is reachable only by character (§9.7.4.2), so `pdf-font`
      # takes such a substitute from a machine face and never from the compiled-in ones, which
      # are name-keyed CFF and answer a glyph *name*; with no face the eleven skip with a
      # sentence instead of testing what they are about, and with these two none of them does.
      # Each answers a different half of the search:
      #
      # * `fonts-dejavu-core` carries `DejaVuSans` and `DejaVuSerif`, which are named in
      #   `substitute::PREFERENCES`' SansSerif and Serif lists. A font whose collection implies
      #   no script is looked for by *family*, so only a name on one of those lists answers it.
      # * `fonts-droid-fallback` carries hiragana. A font whose `/CIDSystemInfo` names
      #   `Adobe-Japan1` is looked for by *coverage* instead (`substituted::script_sample` asks
      #   for U+3042) and that search walks the whole catalogue, so any face carrying the
      #   character does.
      #
      # **Both are on the runner already and this step is a no-op there today** — `ghostscript`
      # pulls in `libgs10-common`, which *recommends* `fonts-droid-fallback`, and
      # `fontconfig-config` depends on an alternatives list whose first name is
      # `fonts-dejavu-core`. Neither is a guarantee: a recommend is dropped by
      # `--no-install-recommends` and an alternative is whichever apt picks, and both of those
      # can change without this repository being touched. If the droid package ever goes,
      # `fonts-misaki` (306 kB) and `fonts-sawarabi-mincho` (841 kB) are the smallest packages
      # in noble carrying hiragana in an `sfnt`; all three were checked by running these tests
      # against a mount namespace holding that package's files and nothing else.
      - name: Machine faces a composite font can be substituted from
        run: sudo apt-get install -y fonts-dejavu-core fonts-droid-fallback

      # `cargo test --workspace`, and not the `cargo nextest` a local round runs since the
      # three-hundred-and-eighty-fifth session. They are the same 1309 tests; nextest's advantage
      # is running 118 test binaries in one pool instead of one at a time, which is worth 214
      # seconds on a 24-core machine (ADR 0222) and very little on a two-core runner. Adding a
      # tool install to the job that gates the snapshot release is not worth that, and the
      # `--ignored` corpus gates -- the ones that moved to `--profile gates` -- do not run here at
      # all, so no job on this file uses that profile.
      # `WGPU_BACKEND=vulkan` because the runner has exactly one usable backend — Mesa's
      # software Vulkan driver, installed above — and `wgpu` reaches past it. Building a
      # second device makes `wgpu-hal` try its GLES backend, whose EGL call answers
      # `BadDisplay` and **panics** rather than reporting a backend it cannot use; a
      # virtual display does not help, which is how we learned that a display was not what
      # was missing. `render-raster` honours the variable on the one path every headless
      # caller takes, which is where a fact about *this machine* belongs.
      - run: cargo test --workspace
        env:
          WGPU_BACKEND: vulkan

  # Supply chain. Separated so that an advisory published upstream does not mask a
  # genuine test failure, and vice versa.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # see `check` above
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Miri and the fuzz build need nightly, which is why rust-toolchain.toml pins
  # stable and these ask for nightly explicitly.
  raster-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (software Vulkan), Xvfb and xwd
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers xvfb x11-apps libxkbcommon-x11-0

      # ADR 0060 of `raster/`, which came in with that sub-project on 2026-09-06. `cargo
      # test` neither builds nor runs an example, so every `assert!` under
      # `raster/crates/raster-gpu/examples/` is a comment until something executes it —
      # and one of them had been panicking on that project's `main` for two days when the
      # round that added this found it. Each example takes `--check`: the smallest
      # configuration that runs every assertion it makes.
      #
      # **The list below is a list, and a list drifts.** `raster-gpu`'s own
      # `tests/example_checks.rs` reads this file and fails naming any example that no
      # line here runs, so adding one to `examples/` and not to this step fails the build.
      # Two of them need a window, which is why the loop runs under Xvfb.
      - name: Every raster example's assertions execute (--check)
        run: |
          set -euo pipefail
          for example in \
              encode_threads floor function_compile function_paint lane_placement \
              outline_upload present_thread rect_lane residue_clip retained \
              startup surface_measure window_smoke zoom
          do
            echo "== $example --check =="
            xvfb-run -a cargo run --release -p raster-gpu --example "$example" -- --check
          done


  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until the parser exists and this earns its keep
    timeout-minutes: 60  # see `check` above
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - uses: Swatinem/rust-cache@v2

      # Miri interprets rather than executes, so it cannot run the GPU backend or
      # anything else that touches a driver. It is pointed at the pure-Rust crates,
      # which are precisely the ones that parse untrusted input.
      #
      # No `--skip` here, and its absence is the decision. This line used to carry
      # `-- --skip flate`, a name-substring filter standing in for "the tests that drive a
      # dependency's unsafe" -- and it was wrong in both directions. It took a third test
      # with it (`an_inflate_never_buys_a_buffer_past_the_bound` contains `flate` inside
      # `inflate`) while the note beside it said two; and it could only exclude what
      # somebody had thought to name here, so when a SECOND dependency's unsafe appeared --
      # crossbeam-epoch, reached through rayon from pdf-render's divided reduction -- the
      # job simply failed, for weeks, and this file could not say why.
      #
      # Each test that must not run under the interpreter now declines by itself, with the
      # dependency and the aliasing rule named beside it: `filter.rs`'s `mod tests` for
      # zlib-rs (doc/todo/52) and `paint.rs` for crossbeam-epoch. ADR 0450.
      - name: Miri on the pure-Rust core
        run: cargo +nightly miri test -p pdf-render -p pdf-syntax --lib

      # Building the fuzz targets every push is what stops them rotting: a target that no
      # longer compiles is discovered here rather than the next time someone wants to fuzz.
      - name: Build the fuzz targets
        run: |
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz build --dev

      # A short run on every push, seeded from the committed corpus. Not a substitute for a
      # long campaign, but it catches a regression that reintroduces an easily-reached crash.
      - name: Fuzz briefly
        run: |
          cargo +nightly fuzz run lexer -- -runs=50000 -max_len=1024
          cargo +nightly fuzz run object -- -runs=50000 -max_len=1024
          cargo +nightly fuzz run document -- -runs=20000 -max_len=4096


  # The two platforms whose confinement does not exist, built and checked rather than
  # assumed. `pdf-sandbox` compiles everywhere since the three-hundred-and-fifteenth session
  # (ADR 0194) and installs seccomp-BPF and Landlock only on Linux, so what these jobs are
  # for is the *other* half of that decision: that the code behind the `cfg` still compiles
  # and its platform-independent tests still pass, on a runner that is actually that platform.
  #
  # `--all-targets` is deliberately not used on Windows: `criterion` pulls `alloca`, whose
  # build script needs a C toolchain, and a benchmark is not what is being shipped.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    timeout-minutes: 45  # see `check` above
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build both executables
        run: cargo build --bin quorra --bin pdf-sandbox-worker

      # `pdf-sandbox` itself, whose tests off Linux are the protocol, the worker handshake
      # and the decoders — the kernel questions are `cfg`-gated out, because a platform with
      # no seccomp has no such question to answer — and `pdf-render`, which is the largest
      # crate that reads nothing from `doc/`. The rest of the suite needs the specification
      # documents, which are a repository secret and not what these two runners are for.
      - name: Test what needs neither a display nor the specifications
        run: cargo test -p pdf-sandbox -p pdf-render

  # A rolling pre-release, retagged at every push to main that passes its gates.
  #
  # `needs` is the whole design decision here: a snapshot binary that fails the project's
  # own gates is worse than no snapshot, because someone will run it and report what it
  # does. So the release waits for fmt, clippy and the full test suite.
  #
  # THREE PLATFORMS since the three-hundred-and-fifteenth session, and the change was a
  # decision rather than a matrix entry: `pdf-sandbox` used to carry a `compile_error!` for
  # every platform without seccomp-BPF and Landlock, on the argument that "a sandbox that
  # silently does nothing on another platform is worse than no sandbox". It no longer does
  # nothing *silently* — the worker process is still there, so a decoder panic still costs
  # one image rather than the viewer, and the viewer prints what this build cannot enforce
  # in its first line. ADR 0194 is the argument and doc/todo/35 is what a real confinement
  # for each would take.
  snapshot:
    needs: [check, test, platforms]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bins` is the whole per-platform decision, in the matrix rather than in a `case` in
          # the packaging script, so that what a target ships is read off one line. The list is
          # `doc/todo/02-every-round.md` §5's — what a person runs — minus what the target cannot
          # build, and each omission below was found by `cargo check --target <t> -p <crate>
          # --bins` rather than assumed (ADR 1152).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ''
            archive: tar.gz
            bins: quorra quorra-confined quorra-gtk quorra-qt quorra-transform quorra-retrieve quorrafs pdf-sandbox-worker pdf-view-worker pdf-vfs-worker
          # No `quorrafs`: `fuser`'s build script asks `pkg_config` for macFUSE, which is not on
          # the runner and is not a Rust dependency this workflow may install. No `quorra-gtk` or
          # `quorra-qt`: each binds a toolkit's development files, and Homebrew's GTK 4 and Qt 6
          # are minutes of installation for a host nobody asked this platform for.
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ''
            archive: tar.gz
            bins: quorra quorra-confined quorra-transform quorra-retrieve pdf-sandbox-worker pdf-view-worker pdf-vfs-worker
          # No `pdf-vfs-worker` either, and that one is the code's rather than a package's:
          # `pdf-vfs` hands an open document to its worker as a *descriptor* over a Unix socket,
          # so `FileBytes::descriptor` and `File: From<ReceivedDescriptor>` do not exist on
          # Windows and the crate does not compile there. RFC 0003's file-system faces are both
          # absent on this platform in consequence.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: '.exe'
            archive: zip
            bins: quorra quorra-confined quorra-transform quorra-retrieve pdf-sandbox-worker pdf-view-worker
    runs-on: ${{ matrix.os }}
    name: snapshot (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v5
        with:
          # pdf-spec generates the object model's validation tables from the Arlington
          # submodule in build.rs, so a checkout without it does not build.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The two native hosts bind two platforms' development files, exactly as the `check` and
      # `test` jobs above say. Only the Linux target builds them, so only it installs them.
      - name: The two native hosts' toolkits
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev qt6-base-dev qt6-base-dev-tools

      # Every program a person runs, and the workers are not a detail: each of them is a
      # separate executable that its program *spawns*, looked for beside the running binary and
      # then one directory above it (`confined_transport::program_beside_executable`). A viewer
      # without `pdf-sandbox-worker` refuses JBIG2 and JPEG 2000 rather than decoding them in
      # process -- there is deliberately no in-process fallback; `quorra-confined` without
      # `pdf-view-worker` has nothing to confine; `quorrafs` without `pdf-vfs-worker` will not
      # open a document. So the archive is flat, and everything in it stays in one directory.
      #
      # One invocation rather than one per binary: each is a whole-graph fat link and Cargo runs
      # them beside each other where separate commands run them one after another (ADR 0222).
      - name: Build every program this target ships
        shell: bash
        run: |
          set -eu
          flags=""
          for binary in ${{ matrix.bins }}; do flags="$flags --bin $binary"; done
          # Unquoted on purpose: the flags are a list, not one word.
          # shellcheck disable=SC2086
          cargo build --release $flags

      # RFC 0003's KIO face, which is deliberately outside the cargo workspace and needs KDE
      # Frameworks 6 to build at all -- "CI treats the shim as an optional artefact built where
      # KF6 exists" (RFC 0003 section 7). So this step is allowed to find nothing and say so:
      # every command that could be absent is guarded, and the job carries on without the
      # plugin. What the archive then holds is the half that does not need KF6 -- the C ABI
      # library and its header, which is what somebody rebuilding the plugin against their own
      # KDE links against, and the only honest thing to ship given that a KF6 plugin is bound to
      # the ABI of the KDE it was compiled against. ADR 1152.
      - name: The KIO worker, where the runner's KDE allows it
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          # Strict, because only the KF6 half of this step is allowed to be missing and both of
          # the ways it can be are guarded below by name.
          set -eu
          mkdir -p kio-stage
          cargo build --release -p pdf-vfs-ffi
          cp target/release/libpdf_vfs_ffi.so kio-stage/
          cp crates/pdf-vfs-ffi/include/quorra_vfs.h kio-stage/
          # Debian and Ubuntu have moved the KF6 development packages between names and series,
          # so the name is tried rather than asserted, and a miss is not a failure.
          sudo apt-get install -y extra-cmake-modules libkf6kio-dev \
            || sudo apt-get install -y extra-cmake-modules kf6-kio-dev \
            || echo "no KF6 development packages on this runner"
          if cmake -S kio -B kio-build \
               -DQUORRA_VFS_INCLUDE_DIR="$PWD/crates/pdf-vfs-ffi/include" \
               -DQUORRA_VFS_LIBRARY="$PWD/target/release/libpdf_vfs_ffi.so" \
             && cmake --build kio-build
          then
            cp kio-build/pdf.so kio-stage/
            echo "the KIO plugin was built"
          else
            echo "the KIO plugin was NOT built: KF6 is not on this runner." >&2
            echo "The C ABI library and header are packaged; kio/CMakeLists.txt builds the" >&2
            echo "plugin against a local KDE." >&2
          fi

      # LICENSE and NOTICE travel with the binaries because they have to: this program is
      # Apache-2.0 and contains BSD-3-Clause font programs and SIL OFL 1.1 Liberation Sans,
      # and all three licences oblige a binary distribution to carry their notices --
      # Apache-2.0 section 4 asks for the licence and for the NOTICE file itself. `quorra
      # --licences` prints the same text, and a file beside the executable is what someone
      # unpacking a tarball can actually find.
      #
      # One script for three platforms, in bash, which every runner has. What differs is
      # named in the matrix rather than branched on here: the executable suffix, the archive
      # format, the binary list, and -- because macOS has `shasum` where Linux has
      # `sha256sum` -- the digest command.
      #
      # The MANIFEST is written from what is actually in the staging directory rather than
      # from a list kept here, because a list kept here drifts from what was built: three of
      # `doc/todo/02-every-round.md` §5's names were pre-rename for months and nothing failed,
      # since the stale artefacts were still lying in the build directory. A manifest derived
      # from `ls` cannot name a file the archive does not hold (ADR 1152).
      - name: Package
        shell: bash
        run: |
          set -eu
          target=${{ matrix.target }}
          exe=${{ matrix.exe }}
          stage="quorra-snapshot-$target"
          mkdir "$stage"
          for binary in ${{ matrix.bins }}; do
            cp "target/release/$binary$exe" "$stage"/
          done
          # Stripping is Linux's here. macOS signs what it strips and Windows keeps its
          # symbols in a separate file, so a portable `strip` step would be three steps.
          if [ "$target" = x86_64-unknown-linux-gnu ]; then
            strip "$stage"/*
          fi
          if [ -d kio-stage ]; then
            mkdir "$stage/kio"
            cp kio-stage/* "$stage/kio"/
          fi
          cp LICENSE NOTICE "$stage"/
          confinement="seccomp-BPF and Landlock confine the decoder on this platform."
          if [ "$target" != x86_64-unknown-linux-gnu ]; then
            confinement="This build has NO kernel confinement: seccomp-BPF and Landlock are
          Linux interfaces. JBIG2 and JPEG 2000 are still decoded in a separate process, so a
          decoder failure costs one image rather than the viewer, and there is no
          address-space ceiling on that process. The viewer says so in its first line."
          fi
          # What each file is, in one line. A name with no answer here gets an empty one
          # rather than being left out, so an added binary shows up as an undescribed row
          # instead of vanishing from the manifest.
          describe() {
            case "$1" in
            quorra)             echo "the viewer" ;;
            quorra-confined)    echo "the viewer with document, interpreter and rasteriser in a confined process" ;;
            quorra-gtk)         echo "the GTK 4 host" ;;
            quorra-qt)          echo "the Qt 6 Widgets host" ;;
            quorra-transform)   echo "render, split, merge, optimise, redact, attachments, and 'archive' -- the PDF/A conversion" ;;
            quorra-retrieve)    echo "a document's text, outline, structure and annotations as JSON; 'archive-check' is the PDF/A validation" ;;
            quorrafs)           echo "mounts a PDF as a directory over FUSE (needs pdf-vfs-worker beside it)" ;;
            pdf-sandbox-worker) echo "worker: decodes JBIG2 and JPEG 2000 out of process" ;;
            pdf-view-worker)    echo "worker: the confined viewer that quorra-confined spawns" ;;
            pdf-vfs-worker)     echo "worker: the confined generator the file-system faces spawn" ;;
            libpdf_vfs_ffi.so)  echo "the C ABI over the file-system core, for the KIO plugin" ;;
            quorra_vfs.h)       echo "that ABI's header" ;;
            pdf.so)             echo "the KIO worker, built against this runner's KF6 -- a plugin is bound to the ABI of the KDE it was compiled against" ;;
            LICENSE|NOTICE|README|MANIFEST) echo "" ;;
            *)                  echo "" ;;
            esac
          }
          {
            echo "quorra snapshot -- $target"
            echo
            for file in "$stage"/*; do
              name=$(basename "$file")
              case "$name" in LICENSE|NOTICE|README|MANIFEST|kio) continue ;; esac
              printf '%-24s %s\n' "$name" "$(describe "${name%"$exe"}")"
            done
            if [ -d "$stage/kio" ]; then
              echo
              for file in "$stage"/kio/*; do
                name=$(basename "$file")
                printf 'kio/%-20s %s\n' "$name" "$(describe "$name")"
              done
            fi
          } > "$stage"/MANIFEST
          cat > "$stage"/README <<TXT
          quorra -- a snapshot build. Not a release; built from whatever was on main.

          MANIFEST names every file here. What the programs are:

          $(sed -n '3,$p' "$stage"/MANIFEST)

          KEEP THEM IN ONE DIRECTORY. The programs whose names end in -worker are not run
          directly: each is spawned by one of the others, looked for beside the running
          binary and then one directory above it. A viewer without pdf-sandbox-worker
          refuses JBIG2 and JPEG 2000 images rather than decoding them in process -- there
          is deliberately no in-process fallback.

          $confinement

              ./quorra$exe [file.pdf]

          Needs a Vulkan, Metal or DirectX device. Page one goes to the graphics device by
          design, so a machine with no working driver will not draw one. The programs that
          are not viewers need no device at all.

          NOT EVERY PROGRAM IS ON EVERY PLATFORM, and MANIFEST is the answer for this one.
          quorrafs is Linux's, because its FUSE dependency asks for a kernel interface the
          other two do not have; pdf-vfs-worker hands an open document across as a file
          descriptor over a Unix socket, so it is absent on Windows; and the two native hosts
          are built only where their toolkits' development files are installed.
          TXT
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$stage.zip" "$stage" > /dev/null
            archive="$stage.zip"
          else
            tar czf "$stage.tar.gz" "$stage"
            archive="$stage.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          ls -l "$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.target }}
          path: |
            quorra-snapshot-*.tar.gz
            quorra-snapshot-*.zip
            quorra-snapshot-*.sha256
          if-no-files-found: error

  # One job publishes, and that is the point of it being separate: three build jobs racing
  # to delete and recreate a moving tag would let the loser publish the older commit's
  # binaries under the newer one's name.
  publish-snapshot:
    needs: snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # `gh release` writes to the repository, and the default token is read-only.
      contents: write
    # Two pushes in quick succession would otherwise race to retag `snapshot`, and the
    # loser could publish the older commit's binaries. The newest push wins.
    concurrency:
      group: snapshot
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: snapshot-*
          merge-multiple: true

      # A moving tag: delete the release and its tag, then create both at this commit.
      # `gh` is on the runner, so this needs no third-party action -- which matters for a
      # step holding a token that can write to the repository.
      - name: Publish the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ls -l
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot ${GITHUB_SHA:0:8}" \
            --notes "Built from \`${GITHUB_SHA}\` on $(date -u '+%Y-%m-%d %H:%M UTC'), after fmt, clippy and the full test suite passed.

          **This is not a release.** It is whatever was on \`main\`, retagged at every push.

          Every program this tree builds for a person to run, for x86_64 Linux, aarch64 macOS and x86_64 Windows — the viewer \`quorra\` and its confined form \`quorra-confined\`, the transform suite \`quorra-transform\` (whose \`archive\` verb is the PDF/A conversion), \`quorra-retrieve\` (whose \`archive-check\` is the PDF/A validation), and on Linux the GTK 4 and Qt 6 hosts and the FUSE mount \`quorrafs\`. **Unpack an archive into one directory and keep it that way**: the three workers — \`pdf-sandbox-worker\`, \`pdf-view-worker\`, \`pdf-vfs-worker\` — are separate executables their programs spawn, looked for beside the running binary, and a program that cannot find its worker refuses the work rather than doing it unconfined.

          **Not every program is on every platform**, and each archive's \`MANIFEST\` is the answer for that archive: \`quorrafs\` is Linux's alone, \`pdf-vfs-worker\` passes a descriptor over a Unix socket and so is absent on Windows, and the two native hosts are built where their toolkits are. The Linux archive also carries \`kio/\` — RFC 0003's C ABI library and header, with the KIO plugin itself only where the runner's KDE could build it, because a KF6 plugin is bound to the ABI of the KDE it was compiled against.

          **The confinement is Linux's.** seccomp-BPF and Landlock restrict the image decoder's system calls and filesystem there; macOS and Windows have neither, so on those two the decoder runs in a separate process with no kernel confinement and no address-space ceiling — which the viewer prints in its first line rather than leaving to a release note. What a real confinement for each would take is in \`doc/todo/35\`." \
            quorra-snapshot-*.tar.gz quorra-snapshot-*.zip quorra-snapshot-*.sha256
