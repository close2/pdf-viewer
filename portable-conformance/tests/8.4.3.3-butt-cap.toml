id = "8.4.3.3-butt-cap"
clause = "8.4.3.3"
title = "Line cap 0, the butt cap, stops at the endpoint"
kind = "pixels"
quote = [
  "The stroke shall be squared off at the endpoint of the path. There shall be no projection beyond the end of the path.",
]
dpi = 144

# One horizontal stroke 40 units wide from (40, 50) to (60, 50), black on white. Every probe sits at
# least 2.6 units (5 pixels at 144 dpi) from the edge the clause fixes, so no scan-conversion rule of
# section 10.7 and no anti-aliasing can move an edge onto it.
[pdf]
object = [
  { body = "<< /Type /Catalog /Pages 2 0 R >>" },
  { body = "<< /Type /Pages /Kids [3 0 R] /Count 1 >>" },
  { body = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 100 100] /Contents 4 0 R >>" },
  { body = "<< >>", stream = "0 G 40 w 0 J 40 50 m 60 50 l S" },
]

[[check]]
type = "marked"
at = [44, 50]
why = "Inside the stroke, 4 units from its end."

[[check]]
type = "marked"
at = [50, 66]
why = "Inside the stroke, 4 units from its upper edge at y = 70 (half the line width above the path)."

[[check]]
type = "unmarked"
at = [36, 50]
why = "4 units beyond the start point: there shall be no projection beyond the end of the path."
