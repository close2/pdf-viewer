id = "8.4.3.3-round-cap"
clause = "8.4.3.3"
title = "Line cap 1, the round cap, is a semicircle of the line width's diameter"
kind = "pixels"
quote = [
  "A semicircular arc with a diameter equal to the line width shall be drawn around the endpoint and shall be filled in.",
]
dpi = 144

# One horizontal stroke 40 units wide from (40, 50) to (60, 50), black on white. Every probe sits at
# least 2.6 units (5 pixels at 144 dpi) from the edge the clause fixes, so no scan-conversion rule of
# section 10.7 and no anti-aliasing can move an edge onto it.
[pdf]
object = [
  { body = "<< /Type /Catalog /Pages 2 0 R >>" },
  { body = "<< /Type /Pages /Kids [3 0 R] /Count 1 >>" },
  { body = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 100 100] /Contents 4 0 R >>" },
  { body = "<< >>", stream = "0 G 40 w 1 J 40 50 m 60 50 l S" },
]

[[check]]
type = "marked"
at = [25, 50]
why = "15 units from the start point (40, 50), inside the arc of radius 20 by 5 units."

[[check]]
type = "unmarked"
at = [24, 34]
why = "22.6 units from the start point, outside the arc of radius 20 by 2.6 units; a projecting square cap would mark it."

[[check]]
type = "unmarked"
at = [16, 50]
why = "24 units from the start point, beyond the arc of radius 20 by 4 units."
