# What a page turn and a zoom step cost, page by page, and the bands they are held to.
#
# `CLAUDE.md` principle 2: "Perf gates run in CI: cold open, time-to-first-page, page-turn latency,
# memory high-water. A regression fails the build." `launch-path.toml` holds a turn inside one
# already-drawn document; this file holds the other end of the gesture — `doc/performance.md`
# section 3e's table, a turn onto a page whose outlines the device has not seen and one notch of
# zoom on it — which nothing held until three of its rows had doubled over two batches (ADR 1513).
# The one command:
#
#   cargo test --release -p render-raster --test turn_path -- --ignored --nocapture
#
# `crates/render-raster/tests/turn_path.rs` is the harness, and `tests/support/frame_cost.rs` is the
# method — the one `examples/frame_budget` prints the table with, so a band here and a row there are
# the same quantity. Each figure is the minimum of three pinned children of five rounds each.
#
# **The bands are derived the way `launch-path.toml`'s clock bands are**: `low` the smallest
# observed figure × 0.85 rounded down to a tenth, `high` the largest × 1.20 rounded up. Observed: eight
# runs of this gate and the three interleaved runs that re-took the table, on 2026-10-05, pinned,
# `release`, one-minute load averages 1.2 to 2.3, on the tree of ADR 1513. A regression of about a
# third fires; the doublings ADR 1513 found would each have fired twice over.
#
# **A figure out of the bottom fails too.** A page twice as fast is a win to re-band on purpose,
# with its reason written here, or an instrument that stopped drawing — and the `commands` witness
# beside each row, which no clock moves, says which.
#
# **A round that legitimately moves a row moves its band here and says why**, as
# `fixed-documents.toml` and `launch-path.toml` ask. A cost paid for exactness is a reason; a
# slowdown nobody chose is not.
#
# **Every round starts on warm cores** (`frame_cost::warm_the_cores`, ADR 1577): each core the
# child is pinned to is kept busy for 30 ms first. A light page's child is short enough to live its
# whole run at the clock it starts at, and after a second's idle that clock read the mesh page's
# turn at 11.2 to 11.7 ms on alternate runs of a quiet machine, past this file's band, where warm
# cores read 9.3 to 9.8; the probe below declined 24 of 90 children cold and 2 of 90 warm, and the
# heavy rows moved by under 5%. The bands below were derived from cold children; every warm
# figure is inside them, so none moved for the method.
#
# **`seventh_ms` is the turn again on a device that has lived** (ADR 1607): the same page, lane
# and interpretation drawn as the seventh frame of one device, after five page turns through the
# warm-up document and back to its first page. Every other figure here is drawn on a device made
# for its round, and a change whose cost depends on what the device has already done reads
# differently there than on the device a window keeps (trap 116). Its bands are this file's rule
# over three runs of five rounds in one sitting on 2026-10-07, pinned, warm cores, load 3.8 to 6.0,
# and two gate runs beside them at loads 1.2 to 1.7 — less the Type 3 page in the first of those,
# where all three of its rows read 13.0 to 14.5 ms, past its turn and step bands as well as this
# one, and a direct re-take of the same binary minutes later read 11.2 to 11.5: the busy end of
# trap 110, which no band here is widened for. A third gate run on these bands judged 33 of 33.
#
# The calibration probe is the launch gate's, the same work on the same document, run by every
# child after its rounds. Its band is its own, because these children read higher than the launch
# gate's (ADR 2259): over the 240 children of the runs above it read 0.659 to 0.802 ms, the one
# child past 0.78 being the first of a run. A child outside it is printed and not used.

machine = "AMD Ryzen AI 9 HX 370 (4 Zen 5 + 8 Zen 5c cores, 24 threads), 61 GiB, Radeon 890M through RADV, Linux 7.2"
profile = "release"
calibration_document = "doc/PDF20_AN001-BPC.pdf"
calibration_ms = 0.62 .. 0.78
# The device's busy share, read before each child and after it (`device_busy`): above this a child
# shares the graphics device with somebody else's work, which no processor load average counts
# (trap 101), and it is printed with the figure and not judged (ADR 1537). Calibrated on
# 2026-10-05 by `a_planted_busy_device_is_seen_as_busy`: the idle device and the compositor read
# IDLE, a planted compute loop PLANTED.
device_busy_percent = 20

# **No form page has a row, on purpose** (ADR 1670). This harness interprets with the widgets drawn and
# no `viewer-core`, so a row cannot see the field table a form's repaint builds; `opt_demo.pdf` and
# `xfa_filled_imm1344e.pdf` turned in 2.0 to 2.3 ms, under every row below, by a text page's stages.

