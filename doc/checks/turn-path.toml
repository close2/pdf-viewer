# What a page turn and a zoom step cost, page by page, and the bands they are held to.
#
# `CLAUDE.md` principle 2: "Perf gates run in CI: cold open, time-to-first-page, page-turn latency,
# memory high-water. A regression fails the build." `launch-path.toml` holds a turn inside one
# already-drawn document; this file holds the other end of the gesture — `doc/performance.md`
# section 3e's table, a turn onto a page whose outlines the device has not seen and one notch of
# zoom on it — which nothing held until three of its rows had doubled over two batches (ADR 1513).
# The one command:
#
#   cargo test --release -p render-raster --test turn_path -- --ignored --nocapture
#
# `crates/render-raster/tests/turn_path.rs` is the harness, and `tests/support/frame_cost.rs` is the
# method — the one `examples/frame_budget` prints the table with, so a band here and a row there are
# the same quantity. Each figure is the minimum of three pinned children of five rounds each.
#
# **The bands are derived the way `launch-path.toml`'s clock bands are**: `low` the smallest
# observed figure × 0.85 rounded down to a tenth, `high` the largest × 1.20 rounded up. Observed: eight
# runs of this gate and the three interleaved runs that re-took the table, on 2026-10-05, pinned,
# `release`, one-minute load averages 1.2 to 2.3, on the tree of ADR 1513. A regression of about a
# third fires; the doublings ADR 1513 found would each have fired twice over.
#
# **A figure out of the bottom fails too.** A page twice as fast is a win to re-band on purpose,
# with its reason written here, or an instrument that stopped drawing — and the `commands` witness
# beside each row, which no clock moves, says which.
#
# **A round that legitimately moves a row moves its band here and says why**, as
# `fixed-documents.toml` and `launch-path.toml` ask. A cost paid for exactness is a reason; a
# slowdown nobody chose is not.
#
# The calibration probe is the launch gate's, the same work on the same document, run by every
# child after its rounds; its band is `launch-path.toml`'s, and over the 240 children of the runs
# above it read 0.659 to 0.802 ms, the one child past 0.78 being the first of a run. A child outside
# it is printed and not used.

machine = "AMD Ryzen AI 9 HX 370 (4 Zen 5 + 8 Zen 5c cores, 24 threads), 61 GiB, Radeon 890M through RADV, Linux 7.2"
profile = "release"
calibration_document = "doc/PDF20_AN001-BPC.pdf"
calibration_ms = 0.62 .. 0.78

[[page]]
path = "doc/ISO_32000-2_sponsored_EC3.pdf"
page = 101
commands = 3007
# observed 7.20 .. 8.99 ms (turn), 1.57 .. 1.72 ms (step)
turn_ms = 6.1 .. 10.8
step_ms = 1.3 .. 2.1
why = "text, 3 007 commands: the turn is raster's encode of the glyphs, and it is the one row whose process-to-process spread is two modes (7.2 and 8.9 ms) rather than a scatter, so its band spans both"

