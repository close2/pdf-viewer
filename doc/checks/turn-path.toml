# seventh frame of a long-lived device (ADR 1607): observed 7.20 .. 8.10 ms
seventh_ms = 6.1 .. 9.8
step_ms = 1.3 .. 2.1
why = "text, 3 007 commands: the turn is raster's encode of the glyphs on the fan-out, which runs at the clock the processor gives the cores its threads wake on, so a child's figure is 7.2 to about 9.5 ms by that clock and not by the tree, and the band spans both ends (ADR 1519)"

