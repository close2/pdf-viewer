# The toolkit windows' launch figures, and the bands they are held to (ADR 2125).
#
# `CLAUDE.md` principle 2 makes time-to-first-page a gate and cold graphics bring-up "its own gate,
# separate from time-to-first-page, so that a regression in the driver, the adapter selection or
# the shader set is legible as itself rather than as a slower page". `launch-path.toml` holds that
# for `quorra`; this file holds it for `quorra-gtk` and `quorra-qt`, which draw page one on the
# device and read it back (ADRs 2070, 2071). The harness is `crates/viewer-host/tests/
# toolkit_launch/mod.rs`, whose module comment says what each figure contains, and each window's
# `tests/launch_path.rs` runs it. A clock, so it takes both lanes of the lock:
#
#   ulimit -u 8192; tools/bounded.sh --lock --clock --round <session> --tree 6 -- \
#       cargo test --release -p viewer-qt -p viewer-gtk --test launch_path -- --ignored --nocapture
#
# **Each figure is the minimum of nine fresh launches per lane, the lanes interleaved, each window
# pinned to the fastest cores on a display of the harness's own**, on `doc/PDF20_AN001-BPC.pdf` —
# the drive's small page, the one ADR 2071 measured on — with a warm page cache. A run above one
# runnable task per physical core prints its figures and judges none.
#
# **Every band is `launch-path.toml`'s clock rule over three runs of the gate in one hold**: the
# smallest of the three × 0.85 to the largest × 1.20, rounded outward to a tenth of a millisecond
# (ADR 1969's method). The runs are written above each band: four of the GTK window
# and three of the Qt window, taken on 2026-10-22 in one `--clock` hold at a one-minute load of 2.95
# to 3.21, two runs of the tree interleaved with two of HEAD's export measured by the same harness
# (`TOOLKIT_LAUNCH_BINARY`); HEAD and the tree read alike, and the first bands, taken at a load of 9.1
# to 10.4, had put the device page's floor above what the same programs read at a third of that load.
#
# **What the device lane costs, read from the two lanes' rows together** (ADR 2124): on Qt the
# window is 4 to 9 ms later on the device lane — its thread waits on the dynamic loader's lock
# while the device's thread loads the Vulkan driver and `libLLVM`, and runs a little slower beside
# it — and page one is about 6 ms dearer, so the first frame is 11 to 18 ms later; on GTK the
# window is not later, because GTK's own start loads Mesa's `libLLVM` too and the device's thread
# has loaded it first, and the first frame differs by the page. A regression in the toolkit's
# start moves both lanes' `window_ms`; one in the device's bring-up moves `device_up_ms` and,
# through the lock, `device_window_ms`; one in the page moves `page_one_ms`.

[[window]]
name = "quorra-gtk"
# 71.0, 69.0, 70.0, 70.0
device_window_ms = 58.6 .. 85.2
# 29.4, 28.1, 28.3, 28.1
device_up_ms = 23.8 .. 35.3
# 7.6, 7.5, 7.2, 7.5
device_page_one_ms = 6.1 .. 9.2
# 87.2, 85.9, 86.2, 86.0
device_first_frame_ms = 73.0 .. 104.7
# 81.0, 78.0, 78.0, 78.0
processor_window_ms = 66.3 .. 97.2
# 2.1, 2.3, 2.2, 2.1
processor_page_one_ms = 1.7 .. 2.8
# 91.1, 87.4, 87.9, 88.7
processor_first_frame_ms = 74.2 .. 109.4

[[window]]
name = "quorra-qt"
# 68.0, 67.0, 68.0
device_window_ms = 56.9 .. 81.6
# 38.5, 37.2, 38.8
device_up_ms = 31.6 .. 46.6
# 7.0, 7.0, 7.0
device_page_one_ms = 5.9 .. 8.4
# 82.9, 81.3, 82.5
device_first_frame_ms = 69.1 .. 99.5
# 63.0, 63.0, 64.0
processor_window_ms = 53.5 .. 76.8
# 2.2, 2.1, 2.3
