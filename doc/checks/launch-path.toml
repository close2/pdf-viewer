[[document]]
path = "doc/ISO_32000-2_sponsored_EC3.pdf"
pages = 1023
cold_open_ms = 19.2 .. 30.4
warm_open_ms = 11.1 .. 17.2
first_page_ms = 34.0 .. 57.3
# **The floor was 4.5 and is 3.8, because session 925 took 0.77 ms out of this document's page
# turn** and a floor derived from a slower program is a floor a faster one falls through. What
# went: `Viewer::announce_page` built a `Pages` and then the whole `Pages::indices` map — every
# node of §7.7.3's tree — once per turn, for the caption's section name; the document is
# immutable, so `Open` keeps the map and constructs no tree at all. Measured as an A/B in one
# binary (`examples/open_cost` prints both lines): `Pages::new` 0.245 ms gone, and the section
# 0.555 ms → 0.031. The new floor is the old one less that saving, rounded down; the ceiling did
# not move, because nothing about the slow end of a page turn changed. ADR 0890.
#
# The other two rows' floors are untouched: the same change is worth 0.06 ms on the 57-page
# document and 0.03 on the five-page one, which is inside their own spread.
turn_ms = 3.8 .. 7.2
peak_mib = 100 .. 215
open_peak_mib = 16 .. 20
read_kib = 4238 .. 4412
why = "the other end of that claim at two hundred times its pages — 1023 of them and 19 MB, the document every launch measurement in doc/performance.md is taken on. Its cold open is 36 times the five-page document's, which is the claim not holding of the open; its time to first page is inside the same band, which is the claim holding of the launch, because the graphics device is longer than either"

[[document]]
path = "doc/pdf.js/test/pdfs/bug1815476.pdf"
pages = 1
cold_open_ms = 0.32 .. 0.50
warm_open_ms = 0.23 .. 0.35
first_page_ms = 57.3 .. 85.4
turn_ms = none
peak_mib = 112 .. 231
open_peak_mib = 5 .. 9
read_kib = 83 .. 87
why = "the launch path's expensive case, and the one the other three rows cannot see: this page names a font it does not embed, so drawing it walks the machine's font directories (ADR 0870) — 23 files opened under share/fonts and 47 more directory listings than a document whose fonts are its own, and time to first page about twice theirs. `CLAUDE.md` principle 2's first bullet says `[n]o system font enumeration` flat, and this row is where that sentence meets the clock"
