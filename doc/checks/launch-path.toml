# The launch path's numbers, and the bands they are held to.
#
# `CLAUDE.md` principle 2 names four figures — cold open, time-to-first-page, page-turn latency,
# memory high-water — and makes cold graphics bring-up a fifth, "its own gate … so that a
# regression in the driver, the adapter selection or the shader set is legible as itself rather
# than as a slower page". This file is what each of them may be. The one command that runs them:
#
#   cargo build --release -p pdf-sandbox --bins     # trap 10: nothing else builds it
#   cargo test  --release -p viewer-ui --test launch_path -- --ignored --nocapture
#
# `crates/viewer-ui/tests/launch_path.rs` is the harness and its module comment says what each
# figure contains. Every paragraph below is worth reading before a band is moved; ADR 0884 is the
# argument in full, and ADRs 0910 and 0911 are why the memory figures are the ones they are.
#
# **Five of each row's figures cannot be moved by the machine, and those are judged on any
# machine.** How many bytes an open reads (`read_kib`), how many read calls it makes
# (`read_calls`), how many instructions it executes (`open_kinstructions`), what the open costs
# in memory (`open_peak_mib`) and how much this
# program has allocated when page one is drawn (`peak_anon_mib`) are properties of the reader
# rather than of the afternoon: the first three came back identical, or within a hundredth of a
# per cent, in every run the bands were derived from, and the fourth held to 30 KiB across a
# page-cache eviction that moved the process's whole resident high-water by 25%. They are what
# gates principle 2's own claims about *what* the launch path does, and no amount of neighbouring
# load excuses them.
#
# **`open_kinstructions` is the fourth and is round 938's**, and the reason it exists is the same
# reason `peak_anon_mib` exists: a gate should band a quantity that does not contain the mechanism
# that moves it. Principle 2 asks a cold-open gate one question — *did opening a document become
# more expensive* — and until this round the only instrument for it was a stopwatch on a machine
# three rounds share. An instruction count answers it without one. It is counted under callgrind,
# which this tree has used for exactly this reason since ADR 0180, on a child that opens the
# document and stops; five consecutive runs of each document at load averages between 3 and 12
# moved by at most 0.011% and the 1023-page one by 0.00017%. The bands are the observed range
# widened by one per cent on each side, rounded outwards — ninety times the measured spread, so
# that this program's own hash seeds cannot fire it, and forty times tighter than the clock bands
# beside it. About 976 thousand instructions of each figure are the process's own start, which is
# 26% of the smallest row and 0.5% of the largest.
#
# **`read_calls` is the fifth**, and it is the other half of what a cold open is made of. A cold
# open's elapsed time is the program's work plus one round trip to the disk for each read that
# misses the page cache, and the *duration* of a round trip is the machine's — measured on a quiet
# machine, this gate's own copies answer a cold read in 0.125 ms (one extent, 134 KB) and 0.199
# (two extents, 173 KB), against a `cold_open_ms` band a fifth of a millisecond wide. What belongs
# to the program is **how many trips it makes**, and `/proc/self/io`'s `syscr` counts them: 25, 31,
# 89 and 1077 for the four rows, identical on every one of five consecutive runs. A change that
# read the same bytes in ten times as many calls would cost ten round trips and would show here as
# a number rather than as an afternoon's impression.
#
# **A round that changes the open path moves these five numbers and says why**, exactly as it
# would for `read_kib`. That is not a cost of the figure, it is the figure working: a change to
# `Document::open`, to `Pages`, or to what `Command::Open` reads shows up here as a number rather
# than as an afternoon's impression.
#
# **The memory figure was the whole process's `VmHWM` for thirteen rounds and is not, and it took
# four recurrences to change it.** The history is the reason it is written here rather than in one
# round's file: the figure was derived identical over forty-four runs, fell about 12% an hour later
# on an idle machine (session 922, which demoted it out of the paragraph above), would not sit in
# its band for sessions 926 and 931, and fell about 13% again in session 933 under floors that had
# already been widened once for it. Session 932 met the same four rows on a parallel branch and
# measured the shape of it: two runs of one binary ten minutes apart read 108.9 and 99.3 MiB, and
# seven consecutive runs then sat within a megabyte of each other — stable *within* a plateau and
# stepping *between* them, which is what a page cache that holds and then changes produces. Its
# `doc/questions/Q32` asked whether the floor should go; `Q37` supersedes it, because the ceiling is
# no more a claim about this program than the floor was. **Four rounds in a row declined to widen
# the band**, correctly: a band is a claim about a machine, and widening one to admit whatever the
# machine is doing puts the machine into the claim.
#
# **What it was measuring, measured (session 935, ADR 0910).** A process that brings the graphics
# device up and does nothing else had a 108 MiB high-water of which **97 MiB was file-backed** —
# resident pages of mapped shared objects, and only 11 MiB was memory this program had asked for.
# The two largest are Mesa's: 52 MiB of `libLLVM.so`, which `libvulkan_radeon.so` links directly,
# and 26 MiB of `libgallium.so`, which arrives with `libEGL_mesa.so`. Neither is the software
# rasteriser's doing — restricting the Vulkan loader to the radeon driver alone
# (`VK_LOADER_DRIVERS_SELECT=*radeon*`) moves the whole figure by 2.5 MiB and the bring-up by
# about 2 ms — and neither is a fixed quantity: `libLLVM.so` is 163 MiB on disk, so *how much of
# it is resident* is the page cache's business rather than this program's. A fault on a mapping
# whose pages are already cached maps a whole fault-around window; a fault on one that has been
# evicted maps a single page. Measured by evicting those two libraries and changing nothing else,
# the same binary's high-water fell from 108.4 MiB to 81.2 MiB — 25% — while its anonymous total
# moved by 30 KiB; over one afternoon the whole-process figure was seen at 92 MiB and at 180 MiB
# with the anonymous one inside 4%. **A neighbouring round walking a corpus is exactly what
# evicts them**, which is why this fell away from its band three times with no clock in it and no
# probe able to decline it.
#
# So `peak_mib` is gone and `peak_anon_mib` is what each row states: the high-water less the
# resident pages of the files the process has mapped, which is what the allocator asked the kernel
# for. The whole-process figure is still measured and still printed on every run — beside the
# driver's share, so that a reader can see both — and it is banded nowhere.
#
# **What the gate no longer claims**, stated plainly because a gate that quietly narrows is worse
# than one that fails: it no longer says anything about how much memory the *process* occupies on
# this machine, so a regression that mapped a large file rather than allocating it — a document
# `mmap`ped whole instead of read incrementally — would not fail this line. `read_kib` is what
# gates the read side, and the printed `MiB resident` is what a person reads. What it claims
# instead is sharper than what it claimed before: the old band on `PDF20_AN001-BPC.pdf` was 82 MiB
# wide, three times the whole quantity now being judged, so a page one that allocated three
# mebibytes more than it does passed then and fails now.
#
# **Two more rounds measured this figure between session 933 and the change above, and both of
# their observations are explained by the paragraph before this one.** Session 932 lowered the four
# floors to 95, 100, 100 and 112 and asked `doc/questions/Q32`; the merge into `main` did not take
# them, because session 934 measured the same figure nine times on a machine with 29 GiB free and
# read **161 to 182 MiB on every document on every run** — inside every band — against 99 to 116 in
# the run that failed, on a binary no merge had touched a line of, with 19 GiB of swap in use.
# ADR 0909 read that as memory *pressure*, and it is right about the direction and one step short
# of the mechanism: pressure is what makes the kernel reclaim the resident pages of a mapped
# library, and eviction is what session 935 did deliberately, to two named libraries, with the same
# result and with the anonymous total unmoved. The two rounds' figures do not disagree — 161 to 182
# with memory free and 99 to 116 with swap in use is one quantity moving with the page cache.
#
# What ADR 0909 said was owed — a third probe, so that a pressed machine *declines* the memory
# figure rather than failing it — is therefore not owed: a figure that is a property of this
# program needs no probe, and a figure that is a property of the page cache should not be banded
# for a probe to rescue. `doc/todo/42` carries all three rounds' tables.
#
# **Every clock figure is the minimum of nine fresh processes, pinned to this machine's fastest
# cores.** Contention adds time and never removes it, so the fastest of nine is what a loaded
# machine can still say about a quiet one. The pinning is not tuning: this processor has four
# Zen 5 cores at 5.16 GHz and eight Zen 5c at 3.29, and an unpinned in-memory probe measured
# 0.75 ms and 1.50 ms on the same idle machine — a factor of two that no band can span. The gate
# derives the core list from `cpuinfo_max_freq` rather than naming CPUs, so a machine with one
# class of core is not pinned at all.
#
# **Two probes decide, per figure, whether the clock is judged.** The first is the same fixed,
# serial, in-memory work, run by *every child after its own phase*, so the question is whether the
# process that produced a figure had the machine to itself rather than whether the run began on a
# quiet one — a single probe taken once by the parent let two false failures through in five
# consecutive runs. The second is a cold read of a fixed file, timed beside every cold sample,
# because the first is CPU-bound and a cold open is mostly disk: this gate failed on a five-page
# document's cold open while its child's calibration sat dead centre in its band. Out of either
# band, the figure is printed and not judged and the run says so — which is the honest answer to
# the three false failures `doc/todo/02` section 2 records, and the reason the bands can be this
# tight. The calibration's own spread over sixteen consecutive quiet runs was 0.6%.
#
# **The bands are derived rather than chosen.** Forty-four runs on this machine at load averages
# between 1.6 and 5.0, pinned, `release` — thirty for the first three rows and fourteen for the
# fourth, which was added later: `low = the smallest observed × 0.85`, `high = the
# largest observed × 1.20`, rounded outwards — for the deterministic pair, the observed value
# ± max(2%, 2 units). The margins are about one observed spread wide (the clock figures' own
# spread over those runs was 2.7% to 22%), so a run at the edge of the measured distribution
# passes and a regression of about a third fires.
#
# **The `*_anon_mib` figures are session 935's and have a rule of their own**, because they are
# neither of the two above: they are steady like the deterministic pair — eleven consecutive
# samples spread 0.8% to 4.0%, and unmoved by an eviction that took a quarter off the
# whole-process figure — but they are not identical to the byte, because a transparent huge page
# is two mebibytes and one of them arriving or not is a step the program did not take. So the band
# is **the observed range widened by a tenth of the value on each side, rounded outwards to half a
# mebibyte**, which is one huge page's headroom on the smallest of them and a little more on the
# rest. Eleven samples at one-minute load averages between 4.0 and 11.2.
#
# **The figures with a clock in them are asked for rather than assumed, since round 938, and that
# is `doc/questions/Q29`'s option 2 as the owner answered it.** `doc/todo/02` section 2 runs this
# gate with no `PDFVIEWER_LAUNCH_CLOCKS` in the environment: it then measures one sample of each
# phase, counts the instructions, and judges the figures above — every one of which is a property
# of this program — in about two seconds, on any machine, under any load. `doc/verify.md` says to
# set the variable and run the whole thing when a round has the machine to itself, which is when a
# claim about a machine can be made at all.
#
# **And every duration below is elapsed time less the time its thread spent waiting for a
# processor**, which the kernel counts exactly per thread in `/proc/thread-self/schedstat` and
# which is somebody else's rather than this program's — round 938's subtraction, and round 935's
# in another unit. On a quiet machine it is zero and these bands mean exactly what they meant when
# they were derived. A figure whose thread waited for more than a tenth of its own elapsed time is
# **declined** rather than corrected, because a thread preempted that heavily also came back to
# caches somebody else had used, and that part cannot be subtracted.
#
# A round that legitimately changes one of these moves the number here and says why in its own
# history file, exactly as `fixed-documents.toml` asks. A figure that falls out of the *bottom* of
# its band is either that win or an instrument that stopped measuring, and the witnesses the run
# prints beside it — page count, command count, bytes read — are what tell those apart.

# What the bands are a claim about. The gate prints every figure on any machine and judges the
# clock ones only where the calibration probe says this is that machine.
machine = "AMD Ryzen AI 9 HX 370 (4 Zen 5 + 8 Zen 5c cores, 24 threads), 61 GiB, btrfs on NVMe, Radeon 890M through RADV, Linux 7.1"
profile = "release"

# The calibration probe: the smallest document opened from bytes already in memory and its first
# page interpreted, fifty times, the quickest — in a child of its own, pinned like every other.
# No I/O after the first read, no device, no subprocess.
#
# **Its upper edge was 0.82 and cost a false failure before this round ended, which is how it
# came to be 0.78.** A post-merge run at a load average of 39 read exactly 0.820, was admitted by
# a band that includes its own edge, and reported twelve clock figures out of band. Every quiet
# run recorded here reads 0.701 to 0.750 and every run whose figures were in band read at most
# 0.750, so the edge is now a little over 4% above the slowest good reading: this machine may be
# a twentieth slower than it was when the bands were taken and no more.
calibration_document = "doc/PDF20_AN001-BPC.pdf"
calibration_ms = 0.62 .. 0.78

# **And this probe answers only half of the question it is asked, which the nine-hundred-and-
# thirty-first session measured.** "Is this the machine" it answers very well — its spread over
# sixteen consecutive quiet runs is under a percent, which is what a fixed-work identity probe is
# for. "And is it busy" it cannot answer at all, because it is the quickest of fifty passes inside
# one process, taken after that process has run its own phase — by pass fifty the allocator, the
# caches, the branch predictors and the core's clock have been warmed by the forty-nine before it,
# while **every figure below is one first pass in a fresh process**. Over twelve consecutive runs
# on merged `main` this probe moved 1.3 % (0.703 to 0.749) while the figures it guards moved by
# factors of two: a five-page document's *warm* open, which has no disk in it, read 0.45 ms in
# nine of them and 1.01 in another, with the probe at 0.705 in both.
#
# So every child now reports its **first** pass as `calibration_first_ms` beside the fifty-pass
# minimum, and the run prints the smallest of them. It still has **no band here**, and round 938
# went to derive one on the idle machine it was given. What it found is why there is still none,
# and both halves are measurements rather than an excuse:
#
# - **The first pass carries no information the fifty-pass minimum lacks.** Its ratio to the
#   fifty-pass reading, taken per child, has a median of 1.64 on an idle machine, 1.50 at a load
#   average of 9, 1.40 with eight spinning processes on the SMT siblings of the pinned cores and
#   3.23 with eight on the pinned cores themselves — the quiet machine sitting *in the middle* of
#   the contended ones. A probe whose reading does not order the conditions it is meant to
#   separate cannot decline on them. 300 samples idle, 15 to 20 an arm otherwise.
# - **What the first-pass probe was invented for is now counted instead.** Session 931's evidence
#   was that the probe moved 1.3% while the figures moved by factors of two; round 938 measured
#   what those factors were — one warm open in fifteen at 3.947 ms of which **2.825 was its thread
#   waiting for a processor**, the other fourteen at 0.97 to 1.08 with a wait of exactly zero.
#   That is subtracted at the source now, and a sample too full of it is declined.
#
# **And the machine itself moved while this round measured, which is the third reason.** On
# 2026-09-04 the fifty-pass probe read 0.703 to 0.724 ms in this gate's own runs; on 2026-09-06,
# on an idle machine, the *same binary* read 0.849 to 0.951 over 300 consecutive samples — and a
# single busy thread pinned to a performance core reached 3.74 GHz where `cpuinfo_max_freq` and
# `scaling_max_freq` both say 5.16, at 63 °C, on the `performance` platform profile with
# `amd_pstate` active. The bands in this file are a claim about a processor doing 5.16 GHz. A band
# derived on the machine as it was that day would have been a claim about a different one, and
# five rounds have refused to put the machine into the claim. ADRs 0902, 0903, 0916, 0917.

# Principle 2's separate gate: a graphics device brought up in a process that has done nothing
# else. One per process, which is `examples/bring_up`'s rule — a second device in one process is
# measured with the driver's loader already warm. The run names the adapter beside the figure,
# because a machine that quietly fell back to a software rasteriser would otherwise report a
# different measurement wearing the same number.
bring_up_ms = 23.3 .. 41.9

# What the device costs in *allocated* memory, in the same process that has done nothing else.
#
# Principle 2 makes cold bring-up a gate of its own "so that a regression in the driver, the
# adapter selection or the shader set is legible as itself rather than as a slower page", and
# until session 935 the only thing that gate said was a duration. This is the driver's share of
# every row's `peak_anon_mib` below — about eleven mebibytes of the twenty-seven a five-page
# document's first page reaches — and it is judged on any machine, like the other memory figures.
# Its own spread over eleven consecutive samples was 0.8%; the band is the observed range widened
# by a tenth on each side and rounded outwards, which is the rule every `*_anon_mib` here uses and
# which is a transparent huge page's worth of headroom on the smallest of them.
bring_up_anon_mib = 9.5 .. 12.5

# The disk's *latency*, where `io_ms` below is its throughput, timed beside every cold sample.
#
# **A small document's cold open is round trips rather than bytes**, and until round 938 nothing
# here could see one: the probe below reads eight mebibytes at about 2.6 GB/s, a rate at which a
# hundred kibibytes would cost 0.04 ms, while this gate's own copies answer a cold read in 0.125
# to 0.199 ms — almost all of it the trip. Trap 34 in one more unit: a guard has to be made of the
# same stuff as the figure it guards. The probe is 128 KiB written in one piece, so it is one
# extent and answers with one trip. The band is the observed minimum less a sixth and the observed
# median times two and a half, which is the shape `io_ms` already has (it reads 2.8 against a
# ceiling of 7.0); forty samples on an idle machine read 0.086 min, 0.098 median, 0.401 max.
io_latency_ms = 0.073 .. 0.25

# The disk's own state, and the other half of the guard: a cold read of a fixed eight-mebibyte
# file of this gate's own, evicted the same way a document is, timed beside every *cold* sample.
# The calibration probe above is deliberately CPU-bound and in memory, so it cannot see a
# neighbour queueing the disk — and a cold open is mostly disk. This gate failed on a five-page
# document's cold open while its child's calibration sat dead centre in its band, which is what
# this line is for. Only the cold figures are held to it.
io_ms = 2.0 .. 7.0

