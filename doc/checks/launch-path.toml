# The launch path's numbers, and the bands they are held to.
#
# `CLAUDE.md` principle 2 names four figures — cold open, time-to-first-page, page-turn latency,
# memory high-water — and makes cold graphics bring-up a fifth, "its own gate … so that a
# regression in the driver, the adapter selection or the shader set is legible as itself rather
# than as a slower page". This file is what each of them may be. The one command that runs them:
#
#   cargo build --release -p pdf-sandbox --bins     # trap 10: nothing else builds it
#   cargo test  --release -p viewer-ui --test launch_path -- --ignored --nocapture
#
# `crates/viewer-ui/tests/launch_path.rs` is the harness and its module comment says what each
# figure contains. Four things about this file are worth reading before a band is moved; ADR 0884
# is the argument in full.
#
# **Two of each row's figures cannot be moved by the machine, and those are judged on any
# machine.** How many bytes an open reads (`read_kib`) and what the open costs in memory
# (`open_peak_mib`) came back identical in every one of the forty-four runs the bands were derived
# from — no spread at all — because they are properties of the reader rather than of the
# afternoon. They are what gates principle 2's own claims about *what* the launch path does, and
# no amount of neighbouring load excuses them.
#
# **`peak_mib` was in that group for most of a round and is not, and the demotion is a finding.**
# It is the high-water mark of a process that has brought a graphics device up, it was identical
# across all forty-four runs, and an hour later — same tree, same binary, idle machine — all four
# rows had fallen together by about 12%. What moved is the *driver's* allocation, which nothing in
# this process can see the reason for; the memory figure with no device in it did not move by a
# kilobyte. So its band spans what has been observed rather than one afternoon's value, and it is
# a coarse guard against a leak rather than a tight one — a first-page raster of any of these
# documents is larger than the whole margin.
#
# **The floors fell again in the nine-hundred-and-thirty-second session, and only the floors.**
# Every one of the four rows was below its `peak_mib` band on a tree whose only functional change
# is nine lines in `pdf_model::image` — and on `main` itself, with that change taken back out and
# the binary rebuilt, all four are still below (111.9, 116.2, 128.9, 140.6 against floors of 127,
# 131, 132 and 143). So it is not a round's change, and two runs of the *same* binary ten minutes
# apart read 108.9 and 99.3 for the first row: the figure moves by nine megabytes with nothing
# moving in the program at all. Seven consecutive runs then sat within a megabyte of each other at
# 98.5, 103.4, 103.8 and 116.4 — a fourth plateau for a figure that had already been demoted once
# for the same reason. The floors are set below the lowest of those with a few per cent of margin;
# **the ceilings are untouched**, because a high-water that falls is not a leak and the ceiling is
# what this figure is here to guard. Whether it should be a ceiling *only* — a band whose floor
# nothing in this process controls has now failed a gate for a reason no code can explain — is
# `doc/questions/Q32`.
#
# **Every clock figure is the minimum of nine fresh processes, pinned to this machine's fastest
# cores.** Contention adds time and never removes it, so the fastest of nine is what a loaded
# machine can still say about a quiet one. The pinning is not tuning: this processor has four
# Zen 5 cores at 5.16 GHz and eight Zen 5c at 3.29, and an unpinned in-memory probe measured
# 0.75 ms and 1.50 ms on the same idle machine — a factor of two that no band can span. The gate
# derives the core list from `cpuinfo_max_freq` rather than naming CPUs, so a machine with one
# class of core is not pinned at all.
#
# **Two probes decide, per figure, whether the clock is judged.** The first is the same fixed,
# serial, in-memory work, run by *every child after its own phase*, so the question is whether the
# process that produced a figure had the machine to itself rather than whether the run began on a
# quiet one — a single probe taken once by the parent let two false failures through in five
# consecutive runs. The second is a cold read of a fixed file, timed beside every cold sample,
# because the first is CPU-bound and a cold open is mostly disk: this gate failed on a five-page
# document's cold open while its child's calibration sat dead centre in its band. Out of either
# band, the figure is printed and not judged and the run says so — which is the honest answer to
# the three false failures `doc/todo/02` section 2 records, and the reason the bands can be this
# tight. The calibration's own spread over sixteen consecutive quiet runs was 0.6%.
#
# **The bands are derived rather than chosen.** Forty-four runs on this machine at load averages
# between 1.6 and 5.0, pinned, `release` — thirty for the first three rows and fourteen for the
# fourth, which was added later: `low = the smallest observed × 0.85`, `high = the
# largest observed × 1.20`, rounded outwards — for the deterministic pair, the observed value
# ± max(2%, 2 units). The margins are about one observed spread wide (the clock figures' own
# spread over those runs was 2.7% to 22%), so a run at the edge of the measured distribution
# passes and a regression of about a third fires.
#
# A round that legitimately changes one of these moves the number here and says why in its own
# history file, exactly as `fixed-documents.toml` asks. A figure that falls out of the *bottom* of
# its band is either that win or an instrument that stopped measuring, and the witnesses the run
# prints beside it — page count, command count, bytes read — are what tell those apart.

# What the bands are a claim about. The gate prints every figure on any machine and judges the
# clock ones only where the calibration probe says this is that machine.
machine = "AMD Ryzen AI 9 HX 370 (4 Zen 5 + 8 Zen 5c cores, 24 threads), 61 GiB, btrfs on NVMe, Radeon 890M through RADV, Linux 7.1"
profile = "release"

# The calibration probe: the smallest document opened from bytes already in memory and its first
# page interpreted, fifty times, the quickest — in a child of its own, pinned like every other.
# No I/O after the first read, no device, no subprocess.
#
# **Its upper edge was 0.82 and cost a false failure before this round ended, which is how it
# came to be 0.78.** A post-merge run at a load average of 39 read exactly 0.820, was admitted by
# a band that includes its own edge, and reported twelve clock figures out of band. Every quiet
# run recorded here reads 0.701 to 0.750 and every run whose figures were in band read at most
# 0.750, so the edge is now a little over 4% above the slowest good reading: this machine may be
# a twentieth slower than it was when the bands were taken and no more.
calibration_document = "doc/PDF20_AN001-BPC.pdf"
calibration_ms = 0.62 .. 0.78

# **And this probe answers only half of the question it is asked, which the nine-hundred-and-
# thirty-first session measured.** "Is this the machine" it answers very well — its spread over
# sixteen consecutive quiet runs is under a percent, which is what a fixed-work identity probe is
# for. "And is it busy" it cannot answer at all, because it is the quickest of fifty passes inside
# one process, taken after that process has run its own phase — by pass fifty the allocator, the
# caches, the branch predictors and the core's clock have been warmed by the forty-nine before it,
# while **every figure below is one first pass in a fresh process**. Over twelve consecutive runs
# on merged `main` this probe moved 1.3 % (0.703 to 0.749) while the figures it guards moved by
# factors of two: a five-page document's *warm* open, which has no disk in it, read 0.45 ms in
# nine of them and 1.01 in another, with the probe at 0.705 in both.
#
# So every child now reports its **first** pass as `calibration_first_ms` beside the fifty-pass
# minimum, and the run prints the smallest of them. It has **no band here**, which is
# `doc/todo/05`'s rule for a figure whose band has not been derived: deriving one needs a quiet
# machine and session 931 had none — one-minute load averages of 3.5 to 35.7, with two other
# rounds building and walking a corpus throughout. Adding a `calibration_first_ms = low .. high`
# line to this section is what makes the gate decline a loaded run instead of failing it, and it
# is the first of `doc/questions/Q29`'s three options. ADRs 0902 and 0903.

# Principle 2's separate gate: a graphics device brought up in a process that has done nothing
# else. One per process, which is `examples/bring_up`'s rule — a second device in one process is
# measured with the driver's loader already warm. The run names the adapter beside the figure,
# because a machine that quietly fell back to a software rasteriser would otherwise report a
# different measurement wearing the same number.
bring_up_ms = 23.3 .. 41.9

# The disk's own state, and the other half of the guard: a cold read of a fixed eight-mebibyte
# file of this gate's own, evicted the same way a document is, timed beside every *cold* sample.
# The calibration probe above is deliberately CPU-bound and in memory, so it cannot see a
# neighbour queueing the disk — and a cold open is mostly disk. This gate failed on a five-page
# document's cold open while its child's calibration sat dead centre in its band, which is what
# this line is for. Only the cold figures are held to it.
io_ms = 2.0 .. 7.0

[[document]]
path = "doc/PDF20_AN001-BPC.pdf"
pages = 5
cold_open_ms = 0.49 .. 0.80
warm_open_ms = 0.35 .. 0.57
first_page_ms = 30.3 .. 48.4
turn_ms = 3.4 .. 5.6
peak_mib = 95 .. 209
open_peak_mib = 5 .. 9
read_kib = 106 .. 112
why = "the five-page end of principle 2's own claim that a 500-page document must open no slower than a five-page one"

[[document]]
