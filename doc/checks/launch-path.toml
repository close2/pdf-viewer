# **The device is the longer thread on this row too since ADR 1557**, which unpacks a
# one-component image a byte at a time: page one's three one-bit CCITT stencils cost 244 M
# instructions by the per-sample route and 5.4 M by that one, and the page's interpretation 403 M
# and 128 M under callgrind. ADR 1544's timeline, three runs: page one interpreted at 20.3 to 20.9
# ms against a device up at 22.9 to 24.0, where it was 25.9 to 32.9 against 23.7 to 29.9. What is
# left on that thread is page one's own ink — the font catalogue a non-embedded font needs, a
# JPEG, the annotations — and none of it can be deferred. Re-taken on a quiet machine (ADR 1585,
# see the first row): 28.34, 30.12 and 28.44 ms, every frame's hash unchanged; the band is this
# file's clock rule over them.
#
# **`peak_anon_mib` rose with it, by the overlap and not by the bytes.** The stencils are decoded
# on the interpreter's thread and the page's other images ahead of their `Do` on the pool (ADR
# 1321); with the stencils quick the two now run side by side, so their transient buffers are
# held at once. Under valgrind, whose threads take turns, massif reads the same 27.65 MB peak in
# both arms; the interpretation alone at one rayon thread reads 36.4 against 35.7 MiB resident,
# and at two to eight 39.0 to 39.5 against 47.7 to 48.0. The three gate runs read 53.24, 53.24 and
# 53.46 MiB against 44.5 to 46.2 before, and the band is this file's allocation rule over them.
#
# **The floor was 47.5 and is 41.0, because the overlap is the scheduler's** (ADR 1647). Whether the
# stencils' and the images' transient buffers are held at once is decided by which thread gets
# where first, so the figure has two modes: sixteen gate runs on 2026-10-07 at a load of 0.96 to
# 2.87 read 52.81 to 55.60 MiB in fifteen and 45.91 in one, and forty children born after 1.5 s of
# idle read 53.5 to 54.7 in thirty-nine and 46.3 in the first. The low mode is the figure before
# the two ran side by side, 44.5 to 46.2. The floor is this file's allocation rule over the new
# smallest, 45.91 less a tenth, rounded down to half a mebibyte; the ceiling stays, 3.4 MiB above
# the largest reading of either mode.
first_page_ms = 24.0 .. 36.2
turn_ms = none
script_spawn_ms = none
script_first_run_ms = none
peak_anon_mib = 41.0 .. 59.0
open_peak_mib = 5 .. 9
