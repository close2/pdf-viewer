# Documents a round fixed, and the check that says so.
#
# **Appendable, and the merge round runs it.** The corpus, oracle and quorra gates walk
# `doc/pdf.js`; a fix found by ranking the SafeDocs crawl is measured once, by the round that
# makes it, in a tree that does not yet hold its neighbours' work — so two branches that touch
# no common line can defeat each other with every gate green. `doc/todo/03` states the rule and
# ADR 0458 has the session that paid for it.
#
# The one command that runs every row:
#
#   cargo build --profile gates -p pdf-sandbox --bins       # trap 10: nothing else builds it
#   cargo test  --profile gates -p pdf-model --test fixed_documents -- --ignored --nocapture
#
# A row states, for one page:
#
#   path      relative to the repository root
#   page      one-based
#   session   the round that fixed it; its `doc/history/` file is the argument
#   reports   substrings of `Interpretation::unsupported`. `[]` means the page reports
#             *nothing*, which is what most of these want; a listed substring must appear and
#             an unlisted report is a failure either way
#   ink       `low .. high` on the mean of `255 - luma` over page one at scale 1.0, this tree's
#             own raster and no reference in the room. Empty pins nothing, which is right where
#             a fix was about a report rather than about pixels
#   why       the defect, in one line, with its ADR and clause
#
# **The bands below are the value measured at seeding plus and minus 1.0 of 255.** Every defect
# they stand against moved a page by between 3.8 and 245 levels, so the band is about the defect
# rather than about antialiasing. A round that legitimately changes what these pages draw moves
# the number here and says why in its own history file — the same discipline as any ratchet in
# this tree, and the reason the row carries `why`.
#
# `corpus-cache/` is a machine-local crawl (`tools/safedocs`). Rows whose document is absent are
# skipped and counted; a run that finds none of them says so and fails.

