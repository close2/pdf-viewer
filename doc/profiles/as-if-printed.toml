# as-if-printed — archive what a printed copy would have carried.
#
# doc/rfc/0007 section 5a.3's second profile, and the project owner's own motivation for it:
#
#   this is a replacement for a previous paper archive. The logical structure is a nice to have,
#   but I would rather lose information I wouldn't have had as paper archive anyway, if this means
#   that I can convert this input file.
#
# Read that beside what a profile *is*, because the two together are the whole design. A profile
# is a list of refusal sites with an answer beside each — nothing more. It is not a mode in which
# the converter inspects each annotation's Print flag or each optional-content group's PrintState
# and decides per document what paper would have shown; that would be new behaviour. The printing
# question is the *author's yardstick*, asked once per class of thing while writing this file:
# would printing have lost this anyway? Attachments, scripts, multimedia, the metadata packet —
# each answered once, written down, and thereafter the converter does what it does for any other
# configuration.
#
# So the two choices compose rather than conflict. Choosing PDF/A-2a says: I want the logical
# structure where it exists. Choosing this profile says: do not refuse the whole document over
# something paper would have lost anyway. **It works with all six targets**, because every answer
# below leaves the output conforming to the target asked for, and because nothing here removes
# anything a document was not already being refused over.
#
# What is deliberately NOT here, and is a known, declined refinement: a narrowing predicate in
# doc/rfc/0007 section 4.7.2's sense — "discard only the annotations whose Print flag is clear".
# That is per-document behaviour. It belongs after the mechanism exists and somebody has asked.

[profile]
name = "as-if-printed"
sentence = "Discard what printing would not have carried; touch nothing it would."
catalogue = "doc/pdf-a-mitigations.md"
default = "stop"

# ---------------------------------------------------------------------------------------------
# Attachments. Paper carries none. Note that the answer is still `preserve` wherever preserving is
# free: a PDF attachment that converts costs nothing to keep, and this profile is about not being
# stopped, not about throwing things away.
# ---------------------------------------------------------------------------------------------

[site."embedded-files/embedded-file-is-itself-pdfa"]
remedy = "discard"

[site."embedded-files/embedded-file-is-itself-pdfa-in-the-plain-profile"]
remedy = "discard"

[site."embedded-files/embedded-file-is-itself-pdfa-in-the-plain-profile".target."4f"]
remedy = "preserve"
placement = "attach"        # 4f holds the original unchanged; nothing is lost, so nothing is
                           # discarded, and the yardstick never comes into it

[site."embedded-files/associated-file-media-type"]
remedy = "discard"         # an associated file with no declared type; paper had no attachments

# ---------------------------------------------------------------------------------------------
# Annotations. Table 167 bit 3 is the anchor: an annotation the file marks unprinted is something
# the user already accepted losing when they pressed print. Applied here once, per class.
# ---------------------------------------------------------------------------------------------

[site."annotations/subtype-defined-in-iso-32000-1"]
remedy = "discard"

[site."annotations/subtype-defined-in-iso-32000-2"]
remedy = "discard"

[site."annotations/three-dimensional-only-in-engineering-files"]
remedy = "discard"

[site."annotations/file-attachment-only-in-embedded-file-files"]
remedy = "discard"
keep-attachment = true     # the paperclip goes; its file stays in the name tree (ADR 2067)

[site."annotations/printable-and-visible"]
remedy = "discard"
# The profile's clearest case. A hidden or non-printing annotation is exactly what paper lost.

[site."annotations/flags-entry-present"]
remedy = "preserve"
# An annotation that states no F at all is kept and given the Print bit ISO 19005 section 6.3.2
# requires. Paper would have lost it (Table 167, Print clear), so discarding it is inside this
# profile's bound — but a profile is a lower bound on what may be lost, never an instruction to
# lose it, and keeping it is the closer copy: nothing on the screen changes (ADR 1942).

[site."annotations/appearance-dictionary-holds-only-normal"]
remedy = "discard"
# Rollover and pressed appearances never reached paper and never will reach an archive reader.

# ---------------------------------------------------------------------------------------------
# Behaviour. None of it prints.
# ---------------------------------------------------------------------------------------------

[site."forms/no-action-on-widget-or-field"]
remedy = "discard"

[site."forms/need-appearances-absent-or-false"]
remedy = "discard"
construct = true           # build the field appearances first, so the file shows what it shows;
                           # a printed form showed the reader's generated appearances

[site."forms/no-xfa-key"]
remedy = "discard"
dynamic = "stop"           # a dynamic form's pages are generated; paper had pages, and we do not

[site."forms/no-needs-rendering"]
remedy = "discard"

[site."actions/no-launch-multimedia-or-form-actions"]
remedy = "discard"

[site."actions/no-deprecated-set-state-or-no-op-actions"]
remedy = "discard"

[site."actions/no-javascript-action"]
remedy = "discard"

[site."actions/no-optional-content-or-view-action"]
remedy = "discard"

[site."actions/optional-content-or-view-action-only-in-engineering-files"]
remedy = "discard"

[site."actions/named-action-is-page-navigation"]
remedy = "discard"

[site."actions/no-additional-actions-dictionary"]
remedy = "discard"

[site."actions/additional-actions-outside-widgets-hold-only-annotation-triggers"]
remedy = "discard"

# ---------------------------------------------------------------------------------------------
# The document's own restrictions. A printed page carries no encryption and asserts no
# permissions. The password is not expressible here (doc/pdf-a-mitigations.md section 14, point
# 8): this site needs a per-document input, so it stops when one is not supplied.
# ---------------------------------------------------------------------------------------------

[site."file-structure/no-encryption"]
remedy = "discard"
on-missing-password = "stop"

[site."file-structure/crypt-filter-is-identity"]
remedy = "discard"

# One ink defined two ways. On the device this profile is named for the choice is immaterial:
# ISO 32000-2 8.6.6.4 has a subtractive device that has the colourant ignore the alternate space
# and the tint transform altogether. So `first` keeps the producer's own first statement of the
# ink, and what changes is only what a screen shows (ADR 1188).
[site."graphics/separations-of-one-name-agree"]
remedy = "supply"
winner = "first"

# An ICC profile this reader draws through and that lacks only its description or copyright tag
# is given one: no colour transform reads either, so no colour moves, and the words are this
# profile's, said in the report and in xmpMM:History as the operator's rather than the producer's
# (ADR 1990). A profile this reader cannot draw through is written as its Alternate space whatever
# this row says, a statement of what the page showed; one lacking a transform tag is refused.
[site."graphics/icc-profiles-carry-the-tags-a-permitted-edition-requires"]
remedy = "supply"
description = "This profile stated no description; this text was supplied when it was archived."
copyright = "This profile stated no copyright information; this text was supplied when it was archived."

# The same answer under part 4, which holds a profile to the edition its own header names (ADR 2006).
[site."graphics/icc-profiles-carry-the-tags-their-version-requires"]
remedy = "supply"
description = "This profile stated no description; this text was supplied when it was archived."
copyright = "This profile stated no copyright information; this text was supplied when it was archived."

# A configuration of the file's optional content that states no Name is given a label: the clause
# requires one, nothing in the file is it, and the wording is this profile's, said in the report
# and in xmpMM:History as the operator's rather than the producer's (ADR 1952). No page changes:
# the name labels a variant in a user interface and decides nothing about what is drawn.
[site."optional-content/configuration-names"]
remedy = "supply"
name-template = "Configuration {n}"

[site."file-structure/permissions-dictionary-keys"]
remedy = "discard"

[site."file-structure/document-signature-states-no-digest"]
remedy = "discard"

# ---------------------------------------------------------------------------------------------
# Metadata. A printed page carries none of it. `preserve` is still chosen where it is free.
# ---------------------------------------------------------------------------------------------

# **Built**: ISO 19005-2 clause 6.6.2.3.1's property comes out of the packet, which is
# `--authorise metadata-property` under another name. A printed page carries no XMP at all, so
# this profile's yardstick answers it without hesitating — and an archive that would rather keep
# the property should read `only-metadata-loss`, which sets the producer's packet on a page.
[site."metadata/properties-use-known-schemas"]
remedy = "discard"

[site."metadata/xmp-packets-well-formed"]
remedy = "preserve"
original = "page"
fresh-packet = true

[site."metadata/xmp-packets-state-one-rdf-element"]
remedy = "preserve"
original = "page"
fresh-packet = true

[site."metadata/xmp-packets-meet-the-xmp-data-model"]
remedy = "preserve"
original = "page"
fresh-packet = true

[site."metadata/extension-schemas-embedded"]
remedy = "preserve"
undeterminable = "discard"

[site."metadata/extension-schema-container-fields"]
remedy = "discard"

[site."metadata/identification-amendment-form"]
remedy = "discard"

[site."metadata/xmp-packet-header-attributes"]
remedy = "discard"

[site."file-structure/document-information-dictionary-holds-only-a-modification-date"]
remedy = "preserve"
unmapped = "discard"

[site."file-structure/document-information-dictionary-needs-piece-info"]
remedy = "preserve"
unmapped = "discard"

# ---------------------------------------------------------------------------------------------
# Language. A Lang entry is read by a screen reader and an indexer, never drawn. One that is not a
# language identifier is restated as ISO 32000-2 14.9.2.2's empty identifier, the language
# unknown; the producer's malformed spelling is what goes, and the report names each (ADR 2066).
# Binds PDF/A-2a alone.
# ---------------------------------------------------------------------------------------------

[site."logical-structure/catalog-language-identifier"]
remedy = "discard"

[site."logical-structure/element-and-property-list-language-identifiers"]
remedy = "discard"

# ---------------------------------------------------------------------------------------------
# Optional content. What printed is one state, and the document keeps the default configuration
# both parts require a reader to render anyway.
# ---------------------------------------------------------------------------------------------

[site."optional-content/no-automatic-states"]
remedy = "discard"

# ---------------------------------------------------------------------------------------------
# Transfer functions. Printing WOULD have carried one: ISO 32000-2 8.4.1's Table 52 has a reader
# initialise the transfer to a device dependent value, and a graphics state's TR replaces that
# value on a printer exactly as on a screen. The corpus's one witness, issue6931_reduced.pdf, draws
# its logo as a near-black negative without its function. So the yardstick says stop. A file whose
# every TR is Identity converts with nothing moved; an operator who accepts the loss says
# --authorise transfer-function, and the converter writes each function into the output's own
# xmpMM:History before removing it (doc/adr/1964).
# ---------------------------------------------------------------------------------------------

[site."graphics/no-transfer-function-in-a-graphics-state"]
remedy = "stop"

# ---------------------------------------------------------------------------------------------
# A font this viewer draws from a face of this machine's. ADR 0270 takes a machine's face of the
# same family where the document's encoding names characters the shipped face lacks; the file
# carries no face, ISO 32000-2 9.5's NOTE 5 leaves the face of such a font to the processor, and a
# printed copy is drawn in whatever face the machine that printed it had. So where the shipped face
# has a glyph for every code the pages show, embedding it keeps every character at its width and
# changes only the shapes, which paper made from another machine would have changed anyway. A
# shown code the shipped face lacks is still refused: that is a mark (doc/adr/2162).
# ---------------------------------------------------------------------------------------------

[site."fonts/font-programs-embedded"]
remedy = "discard"

# ---------------------------------------------------------------------------------------------
# What this profile deliberately leaves at `stop`, because printing WOULD have carried it:
#
#   graphics/no-transfer-function-in-a-graphics-state, second-transfer-function-is-default,
#   halftone-*                     a press applies these; an archived print master is kept for it
#                                  (TR above). A halftone phase HTP converts as a statement under
#                                  every profile: no base standard defines it (doc/adr/2035)
#   graphics/no-overprint-mode-one-under-icc-cmyk  a press composites DeviceCMYK marks by the
#                                  mode; one whose marks are all ICCBased converts as a statement
#                                  (doc/adr/1978)
#   graphics/rendering-intent-*    decides printed colour
#   graphics/destination-profile-* the output intent is the statement of what was printed to
#   fonts/*                        a printed page carried glyphs; every font refusal stays but
#                                  the machine's face above, which loses shapes and no glyph.
#                                  A TrueType code reached only by a mapping of the reader's
#                                  choosing needs no answer here: the converter names its glyph in
#                                  the encoding where the file says which it is (ADR 1942)
#   graphics/jpeg2000-*            the image printed
#   annotations/normal-appearance-shape   with no /AS, nothing says which state printed
#
# And the entries that need no answer at all, because their right answer loses nothing and is
# owed code rather than a choice: doc/pdf-a-mitigations.md section 13.3.
