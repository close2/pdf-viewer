# no-data-loss — no information is lost; a presentation loss is discarded and stated.
#
# doc/rfc/0014 section 7's profile, shipped on the owner's answer A706 (items 3 and 4). It reads
# doc/pdfa-remedies.md section 5's table by its class column: at a site whose loss is
# *information* — metadata, an attachment, an annotation's or a form's content, a page's text — it
# answers as keep-everything does (keep it in place, else keep it on an appended page, else stop),
# and at a site whose loss is *presentation or behaviour* — a hint, a press statement, an
# interactive behaviour — it answers append-statement: the loss is taken as discard takes it and
# stated on a page appended to the document, in the report and in xmpMM:History.
#
# It declares no program: an attachment nothing here can keep stops the conversion, and an
# operator who has a converter writes their own profile with base = "no-data-loss" and a
# derive:<tool>:attach row (doc/rfc/0014 section 6).
#
# At a presentation site the answer is try = ["append-statement", "discard"]. This version sets
# append-statement's page at the two embedded-file rows only (config/steps.rs), so at every other
# site the first step is passed over with its sentence and the loss is taken as discard takes it,
# named in the report and in xmpMM:History, until the page is built there. The three
# transfer-function sites keep keep-everything's answer, because a transfer function decides what
# a screen shows and no shipped profile authorises its removal (doc/adr/1964).

[profile]
name = "no-data-loss"
sentence = "No information is lost: it is kept, moved or written out on an appended page; a presentation loss is discarded and stated."
catalogue = "doc/pdfa-remedies.md"
default = "stop"

[site."embedded-files/embedded-file-is-itself-pdfa"]
remedy = "preserve"
placement = "append"
on-failure = "stop"

[site."embedded-files/embedded-file-is-itself-pdfa-in-the-plain-profile"]
remedy = "preserve"
placement = "append"
on-failure = "stop"

[site."embedded-files/associated-file-media-type"]
remedy = "supply"
media-types = { ".xml" = "application/xml", ".csv" = "text/csv", ".pdf" = "application/pdf" }
unlisted = "stop"

[site."annotations/subtype-defined-in-iso-32000-1"]
