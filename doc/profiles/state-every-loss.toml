# state-every-loss — keep what can be kept, and state every loss taken on an appended page.
#
# doc/rfc/0014 section 7's second new profile, shipped on the owner's answer A706 (item 4): the
# owner's sentence of 2026-10-27 ~20:25 — "a profile should be able to for instance say that it
# accepts the loss, but wants a page appended stating what had to be removed" — made a profile.
# It is no-data-loss with append-statement where no-data-loss stops: every presentation site
# discards and states, and where an information site's keeping step leaves an object it could not
# keep, that object is removed and stated. This version carries a second step out at the
# embedded-file rows only (doc/rfc/0014 section 3, config/steps.rs); every other information site
# keeps, else stops, until the executor carries the second step there.
#
# At a presentation site the answer is try = ["append-statement", "discard"]. This version sets
# append-statement's page at the two embedded-file rows and the three halftone rows
# (config/steps.rs, doc/adr/2562), where a page that cannot be composed hands its objects to
# discard; at every other site the first step is passed over with its sentence and the loss is
# taken as discard takes it, named in the report and in xmpMM:History, until the page is built there. The three
# transfer-function sites keep keep-everything's answer, because a transfer function decides what
# a screen shows and no shipped profile authorises its removal (doc/adr/1964).

[profile]
name = "state-every-loss"
sentence = "Convert whatever the window can show: keep what can be kept, and state every loss taken on an appended page."
catalogue = "doc/pdfa-remedies.md"
default = "stop"

[site."embedded-files/embedded-file-is-itself-pdfa"]
remedy = "preserve"
placement = "append"
on-failure = "append-statement"

[site."embedded-files/embedded-file-is-itself-pdfa-in-the-plain-profile"]
remedy = "preserve"
placement = "append"
on-failure = "append-statement"

[site."embedded-files/associated-file-media-type"]
remedy = "supply"
media-types = { ".xml" = "application/xml", ".csv" = "text/csv", ".pdf" = "application/pdf" }
unlisted = "stop"

[site."annotations/subtype-defined-in-iso-32000-1"]
remedy = "preserve"
placement = "append"
on-failure = "stop"

[site."annotations/subtype-defined-in-iso-32000-2"]
remedy = "preserve"
placement = "append"
on-failure = "stop"

[site."annotations/three-dimensional-only-in-engineering-files"]
