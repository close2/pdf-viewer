[site."annotations/three-dimensional-stream-format"]
remedy = "stop"

[site."annotations/file-attachment-only-in-embedded-file-files"]
remedy = "preserve"
placement = "append"
on-failure = "stop"
keep-attachment = true

[site."annotations/flags-entry-present"]
try = ["append-statement", "discard"]

[site."annotations/printable-and-visible"]
