[[clause]]
clause = "8.9.5"
title = "Image dictionaries"
status = "unreviewed"

[[clause]]
clause = "8.9.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "Table 87's entries, and which of them are read: `/Width`, `/Height`, `/ColorSpace` (any family but `Pattern`, which the table excludes), `/BitsPerComponent`, `/Decode`, `/ImageMask`, `/SMask`, `/SMaskInData`, `/Filter` and `/DecodeParms`. Not read: `/Alternates` (§8.9.5.4), `/Interpolate` was not until the eleventh session and now is (§8.9.5.3), `/Name`, `/StructParent`, `/ID`, `/OPI` and `/Metadata`. `/Mask` is read only to report it (§8.9.6.3, §8.9.6.4)."

[[clause]]
clause = "8.9.5.2"
title = "Decode arrays"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_decode_array_of_one_zero_reverses_the_stencil"]
note = "Table 88's defaults are implemented, and the eleventh session found that the `Indexed` row is not the same rule as the others: every space's default maps a sample onto 0.0 to 1.0 except `Indexed`, whose `[0 2^n - 1]` passes an index through unchanged. An index divided by 255 is index 0 for every sample but the last. What is *not* implemented is a general decode array: only the fully-inverted form `[1 0]` is applied, which is what real files write, and an arbitrary linear map is silently ignored. That silence is this row's debt — the formula is two multiplications and the reason it has not been done is that the device fast paths unpack `u8` without touching floating point."

[[clause]]
clause = "8.9.5.3"
title = "Image interpolation"
status = "implemented"
code = ["crates/pdf-render/src/paint.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs", "crates/render-cpu/tests/image_placement.rs"]
note = "Implemented in the eleventh session; before it `/Interpolate` was read nowhere and every image was filtered bilinearly. The clause makes interpolation a hint for the *magnified* case — an image \"whose resolution is significantly lower than that of the output device\" — with a default of false, so `Image::is_smoothed` filters a reduced image and draws a magnified one sample by sample unless the entry asks otherwise. `issue11124.pdf` blurs sixteen samples across a page where three references draw sixteen flat squares; it agreed with the consensus the moment this landed. The clause says nothing about reduction — but the standard does, in §10.7.4, which requires point sampling and forbids averaging over the pixel area. This note claimed for two sessions that reduction was unspecified; it is specified and departed from, which ADR 0025 records as a choice. `/Interpolate` itself is unaffected: it governs magnification only, and §10.7.4 is where the other half lives."

[[clause]]
clause = "8.9.5.4"
title = "Alternate images"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
note = "Not implemented. `/Alternates` is never selected from, which matters in exactly one of the clause's four steps: where a base image's `/OC` says it is not visible, step c) draws the first visible alternate in its place, and we draw nothing. That case now reports. Steps a), b) and d) need nothing — a visible base image is drawn, and `/DefaultForPrinting` addresses printing, which this viewer does not do. A citation of this clause on `/SMaskInData` was wrong and was corrected in the eleventh session: that entry is Table 87's."

[[clause]]
clause = "8.9.6"
title = "Masked images"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "Aggregate of the four below, and of the family the fourteenth session implemented. /ImageMask, /SMask and both forms of /Mask now apply; the row stays `partial` for §8.9.6.2's last sentence, which asks interpolation to smooth a low-resolution stencil's edges, and for the two image codecs §8.9.6.4 is refused on."

[[clause]]
clause = "8.9.6.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "Names four masking mechanisms. Three are implemented — /ImageMask (§8.9.6.2), /Mask in both its forms (§8.9.6.3 and §8.9.6.4, fourteenth session), and, from the transparent imaging model, /SMask and /SMaskInData. The fourth is the graphics state's own soft mask, which arrives as /SMask in an /ExtGState and is reported rather than applied on 28 corpus documents."

[[clause]]
clause = "8.9.6.2"
title = "Stencil masking"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_zero_sample_paints_the_current_colour_and_a_one_leaves_the_page_alone", "crates/pdf-model/tests/image_masks.rs::a_decode_array_of_one_zero_reverses_the_stencil"]
note = "The three differences the clause states are implemented: no /ColorSpace is consulted, /BitsPerComponent is forced to 1, and /Decode [0 1] against [1 0] decides which sample value marks the page. What is not implemented is the last sentence: interpolation (§8.9.5.3) should smooth a low-resolution stencil's edges, and /Interpolate is read nowhere in this tree."

[[clause]]
clause = "8.9.6.3"
title = "Explicit masking"
status = "implemented"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::an_explicit_mask_paints_the_base_image_only_where_it_marks", "crates/pdf-model/tests/image_masks.rs::a_mask_finer_than_its_image_keeps_its_own_resolution", "crates/pdf-model/tests/image_masks.rs::a_mask_that_is_not_an_image_mask_is_reported"]
note = "Implemented in the fourteenth session (ADR 0023). The mask is decoded by the ordinary image route, so a stencil behind CCITTFaxDecode works (`issue4379.pdf`), and §8.9.6.2 decides which sample marks — including any /Decode [1 0], which two of the corpus's six write. The clause's sentence that the two \"need not have the same resolution\" is the substance: they are combined on the finer of the two grids in each axis, nearest-neighbour, which discards nothing either raster carries. `issue4246.pdf` is the case that decides it, a 50x40 image under a 1000x800 stencil spelling three words. The true answer is a composite at device resolution, which this crate does not know; the choice and its cost are in `apply_explicit_mask`. Two refusals, both reported: a combined grid above 2^24 samples, and a /Mask stream that is not an image mask, which Table 87 and §8.9.6.2 both exclude — `issue6621.pdf` writes one and the two readings available for it are opposite."

[[clause]]
clause = "8.9.6.4"
title = "Colour key masking"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::colour_key_masking_removes_the_samples_inside_the_range", "crates/pdf-model/tests/image_masks.rs::the_colour_key_bounds_are_inclusive", "crates/pdf-model/tests/image_masks.rs::a_colour_key_array_of_the_wrong_length_is_reported"]
note = "Implemented in the fourteenth session (ADR 0023) for every image whose samples reach the unpacker unfiltered, which is both corpus instances. The range test is on the values \"before decoding with the Decode array\", so it lives inside `unpack` rather than filtering the RGBA that comes out of it; the bounds are inclusive, and an array whose length is not twice the component count is refused rather than applied to what fits. `partial` for the codec paths: a DCTDecode or JPXDecode image has become RGBA before the unpacker sees it, and the clause's own NOTE 2 names that pair as the one lossy coding makes unreliable. JBIG2 and CCITT are refused with them rather than special-cased, since a colour key over one-bit samples is a stencil written the long way. All four are reported."

[[clause]]
clause = "8.9.7"
title = "Inline images"
status = "implemented"
code = ["crates/pdf-model/src/inline_image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/inline_images.rs"]
note = "Implemented in the eleventh session (ADR 0019). Table 91's abbreviated keys and Table 92's abbreviated colour space and filter names are expanded into the dictionary an image `XObject` would have had, so one decoder serves both; entries the table does not list are dropped, as the clause requires. `/CS` naming a resource in the page's `/ColorSpace` subdictionary is resolved, and NOTE 3's rule that the device names never do is kept. Where the data ends is answered by `/L` where the file is PDF 2.0, by §8.9.3's sample layout where there is no filter, and by a search for a token-delimited `EI` otherwise. The one thing not honoured is the prohibition on `JPXDecode`, `JBIG2Decode` and `Crypt`: an inline image naming one is decoded rather than refused, which is leniency towards a malformed file and cannot mis-draw a valid one."

[[clause]]
clause = "8.10"
title = "Form XObjects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Aggregate of the four below, read as a family in the seventeenth session because a transparency group is a form XObject and §11.6.6 sends a reader here for the rest of it. A form is run inline with its /Matrix and its /Resources and — as of that session — clipped by its /BBox; a group XObject is composited as one object (§11.6.6); a reference XObject is drawn as the proxy §8.10.4.1 tells a processor that does not import to draw."

[[clause]]
clause = "8.10.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_forms_bounding_box_clips_what_it_draws"]
note = "The five actions Do performs on a form — save the state, concatenate /Matrix, clip to /BBox, paint the content, restore — and the sentence that the rest of the initial state is inherited. Step c) was the gap: this tree clipped an annotation's appearance to its box, where §12.5.5 made that unavoidable, and let a form invoked by Do paint outside its own. tracemonkey.pdf page 6 is what that cost — a form painting a white background beyond its box covered the figure above it, and four reference renderers draw the figure. A form with no /BBox is malformed, since Table 93 makes it required, and is drawn unclipped rather than deleted."

[[clause]]
clause = "8.10.2"
title = "Form dictionaries"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_forms_bounding_box_clips_what_it_draws"]
note = "Table 93's entries that decide what is drawn are read: /BBox as the clip, /Matrix, /Resources with §7.8.3's fallback to the page's, /Group (§8.10.3, §11.6.6) and /OC (§8.11.3.3). Not read: /FormType, whose only valid value is 1; /Ref, which is §8.10.4's; /Metadata, /PieceInfo, /LastModified, /StructParent, /StructParents, /OPI, /Name, /AF, /Measure and /PtData, none of which changes a mark on the page. Nothing here is silently approximated: the unread entries describe the form rather than its appearance."

[[clause]]
clause = "8.10.3"
title = "Group XObjects"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_form_becomes_a_group_only_for_the_transparency_subtype"]
note = "Table 94: a group XObject is a form with a /Group, and its /S names the subtype. The only subtype the specification defines is /Transparency, and the second half of §11.6.6's sentence is the one an implementation drops — a /Group with any other subtype shall not be subject to any grouping behaviour. Tested rather than assumed, because no corpus document writes another subtype."

[[clause]]
clause = "8.10.4"
title = "Reference XObjects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "Aggregate of the three below. Content is never imported from another document, and the clause names that case explicitly: a processor that does not recognise /Ref draws the proxy as an ordinary form XObject, which is what happens here. The gap is a feature not built rather than a requirement broken, and nothing is drawn wrong by it."

[[clause]]
clause = "8.10.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "\"PDF processors that do not recognise the Ref entry shall simply display or print the proxy as an ordinary form XObject.\" That is this renderer, and it is the clause's own provision rather than a shortcut — the same shape as §10.7.2's permission to ignore flatness. What is not implemented is Table 95: finding the target document by /F and /ID and drawing its /Page in the proxy's place. A document whose proxy is a grey box is drawn as a grey box, which is what the clause says a processor like this shall do, so there is nothing to report."

[[clause]]
clause = "8.10.4.2"
title = "Printing reference XObjects"
status = "inapplicable"
note = "What a processor may emit when printing a page holding a reference XObject. This renderer draws to a screen and prints nothing, and the clause is permissive in any case: it lists alternatives a processor may choose among rather than requiring one."

[[clause]]
clause = "8.10.4.3"
title = "Special considerations"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "Three considerations, all conditional on importing the target page: its annotation appearances must be rendered with it, its logical structure may be ignored, and the proxy's /Group applies to the imported page. None arises while the proxy is what is drawn (§8.10.4.1). The last is the one that would matter first, because this tree now composites a /Group on any form."

