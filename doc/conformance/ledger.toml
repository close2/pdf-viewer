note = "Table 46's collection item and Table 47's subitem, in `collection::item`, read from a `/CI` on a file specification or on a folder. The dictionary has no fixed entries — every key is one the writer chose and the schema names — so this is a map, and the *values* are kept as the objects the file wrote rather than as strings: \"[t]he type of each entry shall match the type of data identified by the collection field dictionary … referenced by the same key\", so the type is the schema's to say and a reader guessing from the object would disagree with it. A subitem's `/P` prefix is kept apart from its `/D` data because Table 47 makes them behave differently — the prefix is shown and \"is ignored when an interactive PDF processor sorts the items in the collection\". The clause's own EXAMPLE 2 is the test."

