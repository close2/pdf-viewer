title = "Reference XObjects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "Aggregate of the three below. Content is never imported from another document, and the clause names that case explicitly: a processor that does not recognise /Ref draws the proxy as an ordinary form XObject, which is what happens here. The gap is a feature not built rather than a requirement broken, and nothing is drawn wrong by it."

[[clause]]
clause = "8.10.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "\"PDF processors that do not recognise the Ref entry shall simply display or print the proxy as an ordinary form XObject.\" That is this renderer, and it is the clause's own provision rather than a shortcut — the same shape as §10.7.2's permission to ignore flatness. What is not implemented is Table 95: finding the target document by /F and /ID and drawing its /Page in the proxy's place. A document whose proxy is a grey box is drawn as a grey box, which is what the clause says a processor like this shall do, so there is nothing to report."

[[clause]]
clause = "8.10.4.2"
title = "Printing reference XObjects"
status = "inapplicable"
note = "What a processor may emit when printing a page holding a reference XObject. This renderer draws to a screen and prints nothing, and the clause is permissive in any case: it lists alternatives a processor may choose among rather than requiring one."

[[clause]]
clause = "8.10.4.3"
title = "Special considerations"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "Three considerations, all conditional on importing the target page: its annotation appearances must be rendered with it, its logical structure may be ignored, and the proxy's /Group applies to the imported page. None arises while the proxy is what is drawn (§8.10.4.1). The last is the one that would matter first, because this tree now composites a /Group on any form."

