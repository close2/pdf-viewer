code = ["crates/pdf-font/src/cmap.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_one_byte_codespace_range_makes_one_byte_one_code"]
note = "Table 118 in full, in the twentieth session (ADR 0029): the stream's data is parsed by `CMap::parse`, `/WMode` is read and checked against the file's, and `/UseCMap` is followed for a stream and refused for a predefined name whose data the tree lacks. A stream that states no codespace ranges, or no character mappings, is refused and named rather than drawn as a page of .notdef. §9.7.5.4 a)'s companion rule is enforced: a `usecmap` operator with no `/UseCMap` entry beside it names a CMap that cannot be found, so the font is refused."

[[clause]]
clause = "9.7.5.4"
title = "CMap example and operator summary"
status = "partial"
code = ["crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_bfchar_in_an_encoding_cmap_selects_a_cid"]
note = "Four of the clause's five constraints are honoured. a) a usecmap reference with no /UseCMap entry is refused. b) a font number other than 0 cannot arise, since only the first descendant is read. d) notdef mappings are implemented, and a notdefrange gives its whole range one CID rather than consecutive ones — which ISO 32000-2 leaves to Adobe Technical Note #5014 and §9.7.6.3's purpose for the mapping implies. e) `beginrearrangedfont` and `beginusematrix` are not implemented and no corpus CMap writes one; an unrecognised keyword ends the current section, so their operands are discarded rather than misread. The row stays `partial` for c): \"beginbfchar and endbfchar shall not appear in a CMap that is used as the Encoding entry of a Type 0 font\", and `bug920426.pdf` writes an Encoding CMap whose only mappings are bfchar lines. §9.7.6.2's own account of the decoding algorithm names bfchar among the character mappings, so the two subclauses disagree and the one describing what a processor does is followed: the destination is read as a character selector, and the page draws its sentence instead of nothing."

[[clause]]
clause = "9.7.6"
title = "Type 0 font dictionaries"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_one_byte_codespace_range_makes_one_byte_one_code"]
note = "Aggregate of the three below. Table 119's entries are read; the decoding algorithm and its undefined-character rules are implemented; what is missing is the predefined CMap data §9.7.5.2 owns."

[[clause]]
clause = "9.7.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_predefined_cmap_is_refused_by_name"]
note = "Table 119. `/Encoding` in both forms, `/DescendantFonts`' single element, and `/ToUnicode`. `/BaseFont` is deliberately unread for a Type 0 font: the clause's own NOTE calls it \"an arbitrary name, since there is no font program associated directly with a Type 0 font dictionary\", so the descendant's descriptor is what substitution is derived from."

[[clause]]
clause = "9.7.6.2"
title = "CMap mapping"
status = "implemented"
code = ["crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_utf8_shaped_codespace_yields_codes_of_several_lengths", "crates/pdf-font/src/cmap.rs::a_codespace_range_is_matched_byte_by_byte"]
note = "The whole algorithm, in the twentieth session (ADR 0029). Codespace ranges decide how many bytes the next code takes, shortest first; a code is matched against a range *byte by byte* rather than on its value, which is what makes a UTF-8-shaped CMap work and which no corpus document can distinguish — the numeric reading changes no page of the 1794 compared, so the synthetic test named above is the only thing holding the clause to its words. A code is then looked up \"in the character code mappings for codes of that length\", so `Code` carries its length and every table is indexed by it; failing that, in the notdef mappings. The font number is 0 by construction."

[[clause]]
clause = "9.7.6.3"
title = "Handling undefined characters"
status = "implemented"
code = ["crates/pdf-font/src/cmap.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/cmap.rs::an_unmatched_first_byte_consumes_the_shortest_code", "crates/pdf-font/src/cmap.rs::a_partial_match_consumes_that_ranges_length"]
note = "All four of the clause's rules. A code with no character mapping falls to the notdef mappings and then to CID 0; a CID whose glyph the CIDFont lacks does the same, which is also the clause's sentence about a /CIDToGIDMap stream too short for the CID. An *invalid* code — one matching no codespace range — skips the character mappings entirely, because the clause sends it straight to a substitute, and the modified algorithm decides how many bytes it consumes: the longest partial match, ties to the shortest codes, and the shortest codes outright where even the first byte matches nothing. That last rule is where two references depart from us: `issue11768_reduced.pdf` writes a one-byte `begincidchar <e0>` under a UTF-8 codespace that admits no one-byte code above 7F, so each `e0` is invalid and consumes the three bytes its partial match implies. mupdf and ghostscript take the mapping's own length and draw three hyphens; poppler and this tree follow the clause. The standard would not have written this recovery algorithm if a mapping's length were meant to override the codespace."

[[clause]]
clause = "9.8"
title = "Font descriptors"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero", "crates/pdf-font/src/lib.rs::the_symbolic_flag_changes_nothing_for_an_embedded_program"]
note = "The descriptor is read for the three things that decide a rendered page — which program is embedded, whether the font is symbolic, and what an uncovered code's width is — and for the four attributes that choose a substitute face. The dimensional metrics are read by nobody, because this tree selects an installed face rather than synthesising one from them. The clause's own restriction, that a descriptor shall not be used with a Type 0 font, is satisfied by construction: `load_composite` reads the *descendant's* descriptor and never the outer dictionary's."

[[clause]]
clause = "9.8.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero", "crates/pdf-font/src/lib.rs::a_stated_missing_width_is_the_width"]
note = "Of Table 120: `/Flags`, `/MissingWidth`, `/FontFile`, `/FontFile2`, `/FontFile3`, `/FontWeight` and `/ItalicAngle` are read. `/MissingWidth` had the wrong default — Table 120 says 0 and this tree assumed half an em, which opened six half-ems of invented space on `issue7439.pdf`, a page the reference consensus contradicted and now agrees with. Unread, and each because this tree picks an installed face rather than building one: `/FontFamily`, `/FontStretch`, `/FontBBox`, `/Ascent`, `/Descent`, `/Leading`, `/CapHeight`, `/XHeight`, `/StemV`, `/StemH`, `/AvgWidth`, `/MaxWidth`. `/CharSet` is deprecated in PDF 2.0 and states nothing a charset does not."

[[clause]]
clause = "9.8.2"
title = "Font descriptor flags"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/lib.rs::the_symbolic_flag_changes_nothing_for_an_embedded_program"]
note = "Table 121's Symbolic bit is the one that decides a rendered page, through §9.6.5.4, and this subclause is what settles a font that sets it *and* Nonsymbolic — which Table 121 forbids in the same sentence and `issue20232.pdf` does anyway: \"A PDF processor should always check the Symbolic flag to determine whether the state is Symbolic or NonSymbolic.\" `is_symbolic` reads bit 3 alone, which is that sentence. FixedPitch, Serif, Italic and ForceBold reach `substitute.rs`; Script, AllCap and SmallCap are read by nobody and would only refine a substitute's choice. ForceBold's own rule is a *may* about thickening at small sizes, which this device does not do."

[[clause]]
clause = "9.8.3"
title = "Font descriptors for CIDFonts"
status = "partial"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero"]
note = "A CIDFont's descriptor is read exactly as a simple font's is, for its embedded program and its flags — Table 120 governs both, which is what this subclause says before adding to it. See §9.8.3.1 for Table 122's four additional entries, none of which is read."

[[clause]]
clause = "9.8.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero"]
note = "Table 120 applies to a CIDFont's descriptor and is read as far as §9.8.1 records. None of Table 122's four entries is: `/Style` and `/FD` describe glyph classes for building a substitute, `/Lang` is a language tag nothing here consults, and `/CIDSet` is deprecated in PDF 2.0 and states which CIDs a subset holds — which the embedded program already states, by having them. For an embedded CIDFont, which is what every corpus CIDFont that draws is, none of the four can change a glyph."

[[clause]]
clause = "9.8.3.2"
title = "Style"
status = "silent"
code = ["crates/pdf-font/src/substitute.rs"]
note = "`/Style` has one defined entry, `/Panose`, and it is a twelve-byte classification of a typeface's shape. Nothing reads it. The debt is bounded and worth stating exactly: it can only change which installed face stands in for a CIDFont whose program is *not* embedded, never an embedded one, and `substitute.rs` chooses from Table 120's `/Flags`, `/FontWeight` and `/ItalicAngle` instead. Recorded as silent rather than as nothing owed, because a worse substitute is a different page and no report says so."

[[clause]]
clause = "9.8.3.3"
title = "FD"
status = "silent"
code = ["crates/pdf-font/src/lib.rs"]
note = "`/FD` overrides font-wide *metric* attributes for a class of glyphs, and the clause bounds it to that: \"This font descriptor shall contain entries for metric information only; it shall not include FontFile , FontFile2 , FontFile3\". Every metric it can override is one §9.8.1 records as unread here, because a glyph's advance comes from `/W` and `/DW` (§9.7.4.3) and its outline from the embedded program. So the debt is the same one §9.8.3.2 carries and no larger: a substitute chosen without it, with nothing said."

[[clause]]
clause = "9.9"
title = "Embedded font programs"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/type1.rs", "crates/pdf-font/src/cff.rs"]
test = ["crates/pdf-model/tests/type1.rs::a_symbolic_type1_program_draws_what_no_substitute_could", "crates/pdf-font/src/lib.rs::a_simple_fonts_subtype_selects_nothing"]
note = "All three of Table 124's keys are read and every format it lists is drawn: `/FontFile` (bare Type 1, from the thirtieth session), `/FontFile2` (TrueType), and `/FontFile3` in all three of its subtypes. Which reader applies is decided by the program's own leading bytes rather than by the key or by Table 125's `/Subtype`, because a signature cannot be mislabelled by a producer and the clause's pairings can."

[[clause]]
clause = "9.9.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/type1.rs"]
test = ["crates/pdf-model/tests/type1.rs::an_embedded_type1_program_puts_glyphs_on_the_page"]
note = "Table 124 in full; see §9.9. Two of the clause's rules are satisfied by having nothing that could break them: a Type 1 program's `PaintType` \"shall be ignored\" and the text rendering mode decides filling or stroking, which is where §9.3.6 already puts it; and the `vhea` and `vmtx` tables \"shall never be used by a PDF processor\", which nothing here reads. Table 125's `/Length1`, `/Length2` and `/Length3` are read by nobody: `read-fonts` finds the eexec boundary in the bytes, and the clause's one requirement on a processor — that a `/Length3` of 0 means the 512 zeros and `cleartomark` \"shall be added by the PDF processor\" — is about a fixed-content portion that holds no glyph description, so appending it would change no outline. That is the partial: a stated requirement not executed, with the reason it cannot show written down rather than assumed."

[[clause]]
clause = "9.9.2"
title = "Font subsets"
status = "implemented"
code = ["crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/substitute.rs::a_subset_prefix_is_removed_only_when_it_is_one"]
note = "The subset tag is what a `/BaseFont` means to a substitution request, and `strip_subset_prefix` applies the clause's rule exactly — \"exactly six uppercase letters\" followed by a plus sign — rather than splitting on the first `+`, so a face genuinely named with one keeps its name. Nothing else in the clause asks anything of a reader: recognising subsets to merge documents is a writer's job, and `.notdef`'s presence is a requirement on the file."

[[clause]]
clause = "9.10"
title = "Extraction of text content"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/tounicode.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs"]
note = "Text extraction, done here as a *readback of what was drawn*: `Interpretation::text` is accumulated by the same loop that places the glyphs, so it cannot describe a code the page did not show, and `text_extraction.rs` holds it to 100% of the words `pdftotext` finds over the fourteen specification PDFs. `partial` for the one of §9.10.2's three methods that needs Table 116's registered `CMap` data."

[[clause]]
clause = "9.10.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs"]
note = "The information content of text as against its rendered appearance — two questions, and the clause's insistence that they are two is what `Interpretation` follows in carrying `text` and `glyphs` as separate facts. A page can draw perfectly and extract nothing, which is also why the oracle asks the second when choosing a tolerance and got worse answers for eight sessions when it asked the first. The clause names one route this tree does not take: `/ActualText` on a marked-content sequence, which is §14.9.4's and belongs to tagged PDF."

[[clause]]
clause = "9.10.2"
title = "Mapping character codes to Unicode values"
status = "partial"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs::the_text_we_draw_agrees_with_an_independent_extractor_across_the_pdfjs_corpus"]
note = "Three methods \"in the priority given\", and `LoadedFont::text` is that list in that order. **Since the sixty-third session the whole pdf.js corpus is the test rather than the 14 specification PDFs**: 974 documents against `pdftotext`, 96.5% of its words found over the pages we draw completely, with 46 named and grouped — 31 of them fonts where all three methods fail and the clause says so in as many words, 7 right-to-left scripts read back in painting order, and 8 nobody has diagnosed. First `/ToUnicode`. Then, for a simple font, the glyph name the encoding selected, looked up in the Adobe Glyph List (`read_fonts::ps::agl`) — which is why `glyph_names` is kept after loading rather than discarded. The third is not implemented: it needs a predefined `CMap` from Table 116 *and* the matching `registry-ordering-UCS2` file, both registered third-party data, which is §9.7.5.2's licensing decision seen from the other end. **The priority is load-bearing and one page shows why.** `issue11740_reduced.pdf`'s `/ToUnicode` records the Windows-1251 *bytes* of its Russian text as Latin-1 code points, so method one returns mojibake where method two would have returned the characters — and the clause still puts the producer's own statement first. That is right for extraction and wrong for *drawing*, which is the distinction §9.10.1 draws and the reason a substitute addressed through `/ToUnicode` is now a last resort behind §9.7.4.2's own glyph route (ADR 0049). Where all three fail the clause does not stop there: it says \"there is no way to determine what the character code represents in which case a PDF processor may choose a character code of their choosing\", and the sixty-fourth session took that permission. `text_from_program` names the glyph the way the *program* does — the `post` table's name through the Adobe Glyph List, or the Unicode `cmap` subtable inverted — which is a choice made from the file's own data rather than a guess, and is the same instrument §9.6.5.4's last resort uses for the forward direction. It cannot invent text: a `post` of version 3.0 holds no names, `issue15910.pdf`'s version 2.0 holds 79 empty ones, and a name outside the list answers nothing. **Measured rather than assumed**: over the pdf.js corpus the readback went 96.5% to 97.8% of `pdftotext`'s words and no document moved the other way, which is what says this is not the fallback-that-fills-the-page. Three documents left the text gate's list. `partial` still, for the third method's registered data."

[[clause]]
clause = "9.10.3"
title = "ToUnicode CMaps"
status = "implemented"
code = ["crates/pdf-font/src/tounicode.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs"]
note = "`/ToUnicode` as a `CMap`: `beginbfchar` and `beginbfrange` in both of the latter's forms — a consecutive span and an explicit array — with values decoded as UTF-16BE including surrogate pairs, and each code's length taken from the codespace ranges, which the clause requires to be \"consistent with the encoding that the font uses\". Table 118's `/UseCMap` is read, and the clause calls it \"[t]he only pertinent entry\" in the stream dictionary. A `bfrange` is kept **as a range** rather than expanded, deliberately: one `<0000> <FFFF>` line would otherwise allocate sixty-five thousand strings from a few bytes, which is a decompression bomb wearing a font's clothes. A malformed `CMap` yields what was read before the damage, so extraction degrades to missing characters rather than to silence."

[[clause]]
clause = "10.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "Introductory, and its four steps are the map of this clause: convert to the device's native space (§10.3, §10.4), apply transfer functions (§10.5, deprecated and inapplicable here), scan-convert (§10.7), halftone if the device does (§10.6, inapplicable). Three of the four are answered in the rows below; the one this tree does is the first and the third."

[[clause]]
clause = "10.2"
title = "Raster output device native colour"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "This device's native colour space is RGB and it has no spot colourants, which is the fact §8.6.7 and §11.7.4's Table 146 are read against — see ADR 0028, where it makes overprinting Normal rather than a gap. \"Colours specified in any device or CIE-based colour space shall be rendered as process colours\" is `ColourSpace::to_rgb`, the one route from any space to a pixel."

[[clause]]
clause = "10.3"
title = "CIE-Based colour to device colour"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/icc.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The branch this tree is on. See §10.3.1 and §10.3.2."

[[clause]]
clause = "10.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/icc.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/src/icc.rs::a_real_cmyk_profile_agrees_with_independent_evaluators"]
note = "\"Conversion from a CIE-based source colour to a CIE-based destination colour shall be performed based on ISO 15076-1:2010 (ICC.1:2010)\", which is the A2B evaluator in `icc.rs`. The clause puts *establishing* the destination \"beyond the scope of this document\" and names output intents (§14.11.5) as one way — implemented — and its NOTE lists \"assumptions made by the PDF processor software\" as another, which is what `CMYK_CORNERS` is and where it is licensed from."

[[clause]]
clause = "10.3.2"
title = "Establishing CIE-based colour space definitions"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The sentence that authorises the `DeviceCMYK` fallback, and the thirty-third session's finding: a processor \"should establish CIE-based colour specifications for device colour spaces … when those device colour spaces do not match that of the raster output device\". A display's native space is not CMYK, so the remapping is asked of us; assuming standard process inks is the CIE-based specification established for it, and every source the document names — `/DefaultCMYK`, an output intent, an `ICCBased` space — outranks it. `DeviceGray` and `DeviceRGB` need no remapping on an RGB device."

[[clause]]
clause = "10.4"
title = "Conversions among device colour spaces"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "See §10.4.2.1: these are the algorithms an ICC-enabled processor is told to prefer §10.3 over, and this tree does. `DeviceGray` to `DeviceRGB` is §10.4.2.2's and is implemented; the rest are not used and are named as departures rather than gaps."

[[clause]]
clause = "10.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "Introductory; it names the three conversions the subclauses below define."

[[clause]]
clause = "10.4.2"
title = "Classic colour conversion methods"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "See §10.4.2.1 for the ranking and the individual rows for what is done."

[[clause]]
clause = "10.4.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause that ranks the two answers, and it is the one that had never been read: \"Although ICC enabled PDF processors should always follow the provisions and recommendations provided in 10.3 … a less-capable PDF processor may choose to use the algorithms specified in the following subclauses 10.4.2.2 through 10.4.2.5. These algorithms are, however, very simple and as perceived by a human viewer they produce only crude approximations of the original colours.\" This tree is on the §10.3 branch, which is a decision recorded here rather than an omission."

[[clause]]
clause = "10.4.2.2"
title = "Conversion between DeviceGray and DeviceRGB"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "`DeviceGray` to `DeviceRGB` is the clause's rule exactly — \"a gray level shall be equivalent to an RGB value with all three components the same\" — and it is the whole of `ColourSpace::Gray`'s conversion. The other direction, the NTSC weights that make an RGB colour grey, is for a monochrome device and is asked of nothing here."

[[clause]]
clause = "10.4.2.3"
title = "Conversion between DeviceGray and DeviceCMYK"
status = "inapplicable"
note = "Both directions are for a device whose native space is CMYK or grey. This one's is RGB (§10.2), so neither conversion is on any route to a pixel: a `DeviceGray` colour reaches RGB by §10.4.2.2 and a `DeviceCMYK` one by §10.3.2's established specification."

[[clause]]
clause = "10.4.2.4"
title = "Conversion from DeviceRGB to DeviceCMYK"
status = "inapplicable"
note = "`DeviceRGB` to `DeviceCMYK`, with the black-generation and undercolour-removal functions Table 57's `/BG`, `/BG2`, `/UCR` and `/UCR2` supply. Nothing on this device converts *to* CMYK, so the two functions are read by nobody and cannot change a pixel — which is why they are not a `silent` row. §11.7.5.3 is where they would matter, and it is about a CMYK blending space this tree already reports (§11.6.6)."

[[clause]]
clause = "10.4.2.5"
title = "Conversion from DeviceCMYK to DeviceRGB"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "**The clause this project spent thirty-two sessions asserting did not exist.** It states a `DeviceCMYK` to `DeviceRGB` conversion outright, and `CMYK_CORNERS`'s comment used to open \"ISO 32000-2 gives no conversion from DeviceCMYK to any other space\" on the evidence of §8.6.4.4 — true of that clause and false of the standard. It is not implemented, deliberately: §10.4.2.1 offers it to \"a less-capable PDF processor\" and calls the family's results \"crude approximations\", and §10.3 is what this tree follows instead. Measured rather than argued away — swapping the table for this formula moves the oracle from 802 agreeing and 88 contradicted to 800 and 90."

[[clause]]
clause = "10.5"
title = "Transfer functions"
status = "inapplicable"
note = "A transfer function \"compensates for the device's actual behaviour\", operates \"in the native colour space of the output device\", and its graphics-state entries `/TR` and `/TR2` are **deprecated in PDF 2.0**. A display's calibration is not a property this document may state, and this tree writes sRGB and stops. Not to be confused with §11.6.5.2's `/TR` inside a soft-mask dictionary, which is a different entry in a different dictionary and is implemented (ADR 0027)."

[[clause]]
clause = "10.6"
title = "Halftones"
status = "inapplicable"
note = "Halftoning approximates continuous tone with a pattern of dots on a device that cannot produce it. This one can: every component reaches the raster as eight bits. §10.1 makes the step conditional — \"if the raster output device supports PDF-defined halftoning\" — and it does not."

[[clause]]
clause = "10.6.1"
title = "General"
status = "inapplicable"
note = "See §10.6."

