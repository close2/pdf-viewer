note = "BDC /OC is honoured, including the rule that the operand must name a group listed in /OCProperties /OCGs or a membership dictionary. What is not implemented is the DP form: a DP marked-content point may force a reference to a group on a page that draws nothing in it, which affects a layer panel's ListMode /VisiblePages and nothing that is drawn."

