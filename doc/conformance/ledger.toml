[[clause]]
clause = "12.5.6.2"
title = "Markup annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_stored_appearance_ignores_the_annotations_opacity"]
note = "Table 172's /CA is read, as Table 166's entry of the same name. Nothing else in the clause marks the page by itself: /T, /Subj, /RC, /IRT, /RT, /IT and /ExData are a title, a subject, formatted text, a reply relationship, an intent and external data, all of which reach a comments pane rather than a raster, and /Popup is the window §12.5.6.14 excludes from the page. What is owed is the accessibility half — /Contents is what §14.9.3 extracts as an alternate description — and the interactive one."

[[clause]]
clause = "12.5.6.3"
title = "Annotation states"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_appearance_state_is_selected_by_as"]
note = "This clause is about /State and /StateModel on a reply annotation — Marked or Review, set by a user in a comments pane — and neither marks the page. It is not to be confused with §12.5.5's appearance *state*, which /AS selects and which is implemented; the two words are unrelated and the test named here is for the second. Nothing is owed for rendering; a review workflow is owed for a viewer with interaction."

[[clause]]
clause = "12.5.6.4"
title = "Text annotations"
status = "partial"
code = ["crates/pdf-model/src/icon.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::each_of_the_seven_standard_icon_names_draws_its_own_shape", "crates/pdf-model/tests/annotations.rs::table_166_s_colour_is_the_icon_s_background"]
note = "A text annotation 'shall appear as an icon' whose name comes from Table 175's /Name, and the clause requires a processor to 'provide predefined icon appearances for at least the following standard names: Comment, Key, Note, Help, NewParagraph, Paragraph, Insert' while stating what none of them looks like. **That sentence is a shall, and this row said reported for a hundred and nineteen sessions on the strength of the half of it that is a silence.** The three neighbouring icon clauses — §12.5.6.12, §12.5.6.15, §12.5.6.16 — say should, and being read as one population with this one is what hid the difference; refusing where a clause obliges is a conformance failure, not restraint. Since the hundred-and-twentieth session the seven names are drawn by crate::icon, whose artwork is this processor's invention and is documented there as a choice, with the two things the document does state read in crate::appearance: which icon (Table 175's /Name, default Note) and the colour behind it (Table 166's /C, 'The background of the annotation's icon when closed'). A /Name outside the seven is reported by name, because 'Additional names may be supported as well' is a permission and Table 175's default answers an absent entry rather than an unrecognised one. partial for three things the clause states and this does not do: the popup window /Open selects, which §12.5.6.14 does not draw for any subtype; the requirement that such an annotation 'shall not scale and rotate with the page; they shall behave as if the NoZoom and NoRotate annotation flags ... were always set', which is §12.5.3's recorded departure — a display list independent of resolution cannot state a size that depends on the view — so the icon is the size /Rect asks for, drawn on the largest square that fits so that a symbol in a rectangle of another shape is not distorted; and Table 175's /State and /StateModel, which §12.5.6.3 makes a review status rather than a mark. **No corpus document reaches any of this**: exactly one of the 974 carries a text annotation with no appearance stream and its /Rect has zero area, so it drew nothing before this change and draws nothing after it. The '1 corpus document' this row used to claim was a count of the annotation, not of a report."

[[clause]]
clause = "12.5.6.5"
title = "Link annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/link.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_link_border_is_drawn_inside_its_rectangle_in_its_own_colour", "crates/pdf-model/src/link.rs::quad_points_narrow_the_region_and_a_stray_one_is_ignored"]
note = "**Followed since the fifty-seventh session**: a click resolves the link under it through §12.3.2's destinations and turns the page, which is what §12.5.6.5's first sentence is about — a link \"represents either a hypertext link to a destination elsewhere in the document … or an action to be performed\". `/QuadPoints` bounds the activation region and Table 176's third condition is honoured exactly: coordinates that \"lie outside the region specified by Rect\" send the *whole* annotation back to its rectangle rather than widening it. `/H`'s highlighting mode is still a response to a mouse this program does not draw, and a link whose action is a URI or a launch leads nowhere here by design (principle 3). 54 corpus documents have a link on page one — 33 125 of them, 32 768 in one stress-test file — and 36 lead to a page of their own document. A link's visible part is its border, and this is the one subtype whose appearance is stated outside its own subclause: Table 166 makes /C 'a colour used for ... The border of a link annotation' and /Border the rounded rectangle it is drawn as, and §12.5.4 puts it inside /Rect. Both are implemented, including the corner radii and Table 176's /BS. A link with no /C draws nothing, which is a documented choice rather than a derivation — Table 166 gives an *empty* /C the meaning 'No colour; transparent' and states no default for an absent one, and inventing black would put a box around every link whose file says nothing about its colour. Not implemented, and not visible: /A, /Dest and /PA are navigation, /QuadPoints bounds the activation region rather than the drawing (with one exception this crate cannot reach, 'such as when applying an underline border style'), and Table 176's /H — the same highlighting mode §12.5.6.19 states for a widget, with four modes rather than five — is honoured since the hundred-and-thirty-eighth session, so a press on a link inverts its rectangle or its border where the file says to (ADR 0123). Four corpus pages are contradicted for drawing this border at all; oracle.rs's CONTRADICTED_LINK_BORDER has the analysis, and neither silent reference is reading the clause differently."

[[clause]]
clause = "12.5.6.6"
title = "Free text annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/variable_text.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_free_text_annotation_draws_its_contents"]
note = "A free text annotation \"display[s] text directly on the page\" out of `/Contents`, laid out by the `/DA` appearance string and `/Q` quadding of §12.7.4.3 — **which `appearance::free_text` does, and has since the twenty-third session.** This row said \"refused and named\" until the hundred-and-fifteenth, which is the ledger understating what the code does, and the four corpus documents it counted are refused for a different reason: their `/DA` names a font the `/DR` does not define, which is §12.7.4.3's malformed-file case. `/RD` insets the box, as §12.5.6.8's does. `partial` for the rest of Table 177: `/CL`'s callout line and `/IT`'s intent are unread, `/BS`'s border is reported because no clause states its colour, and `/RC` and `/DS` are XFA rich text, which principle 5 excludes."

[[clause]]
clause = "12.5.6.7"
title = "Line annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_line_annotations_leader_lines_put_the_line_where_the_clause_says", "crates/pdf-model/tests/annotations.rs::a_leader_line_has_an_offset_before_it_and_an_extension_beyond_it"]
note = "Table 178's `/L` drawn as a stroked segment in `/C` at the width and dash §12.5.4 gives, **with the leader lines the clause states**: `/LL` makes `/L` \"represent the endpoints of the leader lines rather than the endpoints of the line itself\" and then says exactly where the line goes — perpendicular, by `/LL`, in the direction \"that is clockwise when traversing the line from its starting point to its ending point\", with a negative value meaning the other side — so `/LLE`'s extension and `/LLO`'s offset complete a construction that needs nothing invented. It was refused until the eighty-fifth session on the true observation that `/L` is not the line, which is a reason to compute the line rather than to decline; the refusal also fired on the entry's presence rather than its value, so a document stating `/LL 0` — the clause's own \"no leader lines\" — was declined for asking for nothing. Two entries are still owed and each states a different kind of nothing: `/LE`'s endings are Table 179's nine named shapes with no dimension between them (re-read, and \"[t]wo short lines meeting in an acute angle\" is still not a size), and `/Cap` replicates `/Contents` as a caption, which needs a font no entry of a line annotation supplies. **Since the hundred-and-sixteenth session both are named beside the drawn line rather than instead of it**, which is the same correction the eighty-fifth session made to `/LL` one entry over: `/L` is required and both of these are optional and *additive*, so declining the whole annotation for either drew nothing where the clause states a line. `/IT`, `/Measure`, `/CP` and `/CO` are unread. The corpus's one witness cannot show the change — `issue13447.pdf`'s arrow-ended line states an `/L` outside its own `/Rect`, so §12.5.5 clips away the line it now draws, which is that file disagreeing with itself rather than anything this reader does."

[[clause]]
clause = "12.5.6.8"
title = "Square and circle annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_circle_is_an_ellipse_inscribed_in_its_rectangle"]
note = "'Square and circle annotations shall display, respectively, a rectangle or an ellipse on the page ... inscribed within the annotation rectangle', filled with Table 180's /IC and stroked in /C at §12.5.4's width — implemented, with /RD's four differences applied in the clause's own order of left, top, right, bottom. The ellipse is four cubic Béziers rather than a conic, which is an approximation this crate documents: PDF has no operator that draws an ellipse. /BE's cloudy border is refused and reported."

[[clause]]
clause = "12.5.6.9"
title = "Polygon and polyline annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_polygons_interior_colour_fills_it_and_a_polylines_does_not"]
note = "Table 181's /Vertices and PDF 2.0's /Path are both built — the second as the m, l and c operands it defines, superseding /Vertices as the table requires — and stroked in /C at §12.5.4's width, closed for a polygon and open for a polyline. /IC divides the two subtypes and the clause says how: 'For Polyline annotations, the value of the IC key is used to fill only the line ending. However, for Polygon annotations, the value of the IC key is used to fill the entire shape', so a polygon's fills it and a polyline's is left to the line endings this crate refuses. A non-None /LE is named beside the drawn shape rather than instead of it, since the hundred-and-sixteenth session; a cloudy /BE is still a whole refusal, and the difference is the point — an ending is an extra mark on a shape Table 181 makes required, while a cloudy border is a *different* border, so drawing a straight one would put a shape on the page the file did not describe. /IT and /Measure are not read."

[[clause]]
clause = "12.5.6.10"
title = "Text markup annotations"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::each_text_markup_draws_its_own_mark"]
note = "The four text markup subtypes are drawn, and **this row said they were refused for eighty sessions after they stopped being** — so did `appearance.rs`'s own module comment, and both were corrected in the hundred-and-fifteenth session. What the clause states is more than the first reading found (ADR 0043): the mark's kind — they \"shall appear as highlights, underlines, strikeouts (all PDF 1.3), or jagged (\"squiggly\") underlines\" — its region, Table 182's `/QuadPoints`, its orientation, \"[t]he text shall be oriented with respect to the edge connecting points ( x 1 , y 1 ) and ( x 2 , y 2 )\", and Table 166's `/C` for the colour. What it leaves is a *thickness*, and the quadrilateral supplies the only length there is: its own height, since it \"shall encompass a word or group of contiguous words\". A sixteenth of that for a bar, a twelfth and a third for a squiggle's amplitude and wavelength, and a strikeout across the middle — fractions rather than constants, so they are right at every font size. A highlight is filled under `Multiply`, which §11.3.5.2 makes the one blend mode whose \"result colour is always at least as dark as either of the two constituent colours\" and therefore the standard's own guarantee that the text under the wash survives it. The corpus is what says the thickness is a *choice*: three references draw three pictures of `annotation-highlight-without-appearance.pdf`."

[[clause]]
clause = "12.5.6.11"
title = "Caret annotations"
status = "reported"
note = "A caret annotation is 'a visual symbol that indicates the presence of text edits' and Table 183 adds only /RD, the difference between /Rect and 'the actual boundaries of the underlying caret', and /Sy naming a paragraph symbol. The symbol itself is not stated anywhere, so an appearance-less caret is refused and named. **Reconsidered in the hundred-and-twenty-fourth session against ADR 0109's rule, and the refusal stands.** The tempting reading is §12.5.6.10's, where the clause names the mark — 'shall appear as highlights, underlines, strikeouts … or jagged (\"squiggly\") underlines' — and leaves only a thickness; this clause never says the annotation shall appear as a caret. It says it *is* 'a visual symbol', indefinitely, and Table 183 then calls the thing whose boundaries /RD measures 'the caret'. A subtype name is not a statement of artwork, and the question ADR 0109 leaves is not 'may I fill this silence' but 'does a sentence around it require me to'. Nothing here does. All 6 corpus carets carry an /AP."

[[clause]]
clause = "12.5.6.12"
title = "Rubber stamp annotations"
status = "reported"
note = "A rubber stamp's appearance is an icon named by Table 184's /Name — Approved, Draft, Experimental and eleven more — and the clause states no artwork for any of them, exactly as §12.5.6.4 does not for its seven. **The modal verb is where the two part, which the hundred-and-twentieth session found by reading them side by side**: this table says 'PDF readers should provide predefined icon appearances', where §12.5.6.4 says shall. A should is a recommendation, and an invention with only a recommendation behind it puts a mark on the page that neither the document nor the standard asked for — so this stays refused and named while §12.5.6.4 is drawn. Table 184's /IT is unread; its StampImage and StampSnapshot values describe where an appearance came from rather than what it looks like. No corpus document reaches this without an /AP: all 19 stamps in the corpus carry one, counted, which is what a producer that cares about its stamp looking like anything has to do."

[[clause]]
clause = "12.5.6.13"
title = "Ink annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_ink_annotation_is_stroked_along_its_ink_list"]
note = "Table 185's /InkList is drawn as one stroked subpath per entry, in /C at §12.5.4's width, and PDF 2.0's /Path supersedes it as the table requires. The clause leaves this crate a choice and it is taken openly: 'When drawn, the points shall be connected by straight lines or curves in an implementation-dependent way' — straight lines, because a curve fitted through a digitiser's samples would be smoothing the document did not ask for. Nothing in the clause is unimplemented; the row is partial rather than implemented because /Path has no test of its own yet."

[[clause]]
clause = "12.5.6.14"
title = "Popup annotations"
status = "implemented"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "A popup is 'a window ... containing text' belonging to a parent markup annotation and displayed in response to it, so it is never part of the page's own rendering: it is skipped before any other question is asked, and its absence is not a gap. Table 166's /AP entry agrees from the other side, naming Popup as one of three subtypes a writer need not supply an appearance dictionary for. /Open and /Parent are the interactive half. The test named here is the nearest one: it pins that an annotation the document does not show reaches neither the display list nor the report, which is the property this clause needs."

[[clause]]
clause = "12.5.6.15"
title = "File attachment annotations"
status = "reported"
note = "A file attachment annotation displays 'an icon' from Table 187's /Name — Graph, PushPin, Paperclip, Tag — and the clause states none of them, so an appearance-less one is refused and named, as §12.5.6.12's icons are and as §12.5.6.4's no longer is: this table says a reader 'should provide predefined icon appearances', and that recommendation is the whole of the difference (see §12.5.6.4). /FS is the embedded file, which is not a rendering question. The corpus's one file attachment annotation carries an /AP."

[[clause]]
clause = "12.5.6.16"
title = "Sound annotations"
status = "reported"
note = "A sound annotation, deprecated in PDF 2.0, is one that 'shall behave like a text annotation in most ways, with a different icon', whose /Name Table 188 gives as Speaker or Mic. The artwork is unstated and the obligation is a should — 'PDF readers should provide predefined icon appearances' — so unlike §12.5.6.4, whose shall the hundred-and-twentieth session performed, this stays refused and named. Playing the /Sound stream is a media question, and principle 5's exclusion of clause 13 covers the engine; the icon is not excluded, it is unstated. The corpus's one sound annotation carries an /AP."

[[clause]]
clause = "12.5.6.17"
title = "Movie annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A movie annotation, deprecated in PDF 2.0, carries an /AP like any other annotation and it is drawn — which is the whole of what a still page can show of one. Table 188's /Movie, /A and /Aw are the player and its activation, which principle 5's clause-13 exclusion covers as a media engine; an appearance-less movie annotation is refused and named, because a poster frame is a decoded movie rather than a stated shape."

[[clause]]
clause = "12.5.6.18"
title = "Screen annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A screen annotation is a rectangle a media clip plays in, and its /AP is drawn like any other. Table 189's /MK is an appearance characteristics dictionary as a widget's is, but it reaches this crate only through /AP today, and /A, /AA and /P are activation. The clip itself is clause 13 and excluded by principle 5; an appearance-less screen annotation is refused and named."

[[clause]]
clause = "12.5.6.19"
title = "Widget annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_widget_draws_its_background_and_reports_its_field_value", "crates/pdf-model/tests/variable_text.rs::a_widgets_contents_turn_by_table_192s_r"]
note = "Table 192's /BG background and /BC border are constructed, at §12.5.4's width and style, which is what a widget looks like before its value is set. A widget stating neither and holding no value draws *nothing*, quietly, and that decision is worth as much as the drawing: Table 192 is where a widget's colours come from, so a field without one states no appearance at all, and reporting those named 23 corpus documents for a gap that is not one. What is owed is the value: a text field's /V, a check box's or radio button's state, and a push-button's /CA caption all need §12.7.4.3's variable text, so a widget holding one draws its frame and reports the rest — two true statements rather than one. Table 192's /R **is read and applied** as of the hundred-and-fifth session: \"[t]he number of degrees by which the widget annotation shall be rotated counterclockwise relative to the page\", written into the constructed stream as a `cm` rather than onto the appearance, because a constructed appearance is in the page's own space and §12.5.5's placement is the identity for it. The contents are laid out in a box at the origin whose sides are /Rect's swapped for a quarter turn — so §12.7.4.3's wrapping and auto-sizing see the width the text actually has — and the matrix brings that box back onto /Rect. A value that is not a multiple of 90, which the table forbids, is refused by name rather than rounded. No corpus widget states one, so the fixture is synthetic and measures the shape of the ink. /I, /RI, /IX and /IF are a push-button's icon and its fit; /Parent is followed for §12.7.4.1's inheritable entries. **Table 192's /H is implemented since the hundred-and-thirty-eighth session, and it is a gap that only opened when this program grew a pointer** (session 132). The entry is \"the visual effect that shall be used when the mouse button is pressed or held down inside its active area\", with five modes and a **default of I**: N draws nothing extra, I inverts the contents of the annotation rectangle, O inverts the border, P displays §12.5.5's down appearance, and T is P. All five are honoured: N draws nothing extra, P and T show §12.5.5's down appearance, and I and O draw a white shape under §11.3.5.2's Difference blend — which *is* the clause's own arithmetic, `f(x) = 1 - x`, since `B(cb, cs) = |cb - cs|` with the source at 1 leaves `1 - cb`. A stated mode other than P overrides any down appearance, as the clause says. **The default is I and it is applied only where the annotation states no /D**, which is a reading rather than the sentence: taking the default flatly would make 95 of the corpus's page-one annotations state down artwork that could never be displayed, and every one of the 4 that state both a /D and an /H states /H P — so the corpus cannot decide between the two readings and the argument has to. Reachable only by a press, which no gate performs, so the tests are pixels: a red widget pressed with /H /I is cyan exactly. ADR 0123."

[[clause]]
clause = "12.5.6.20"
title = "Printer's mark annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A printer's mark annotation is a registration target, colour bar or cut mark added for production, and §14.11.3 is where it is discussed. Its /AP is drawn like any other annotation's. Table 190's /MN names the mark and §14.11.3 says nothing about what any name looks like, so an appearance-less one is refused and named. Whether such a mark belongs on a screen at all is a §14.11.3 question this row does not settle."

[[clause]]
clause = "12.5.6.21"
title = "Trap network annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A trap network annotation, deprecated in PDF 2.0, defines trapping for a marking device; §14.11.6 owns the subject. Its /AP is drawn like any other, and there is nothing else here a screen can show: trapping compensates for misregistration between printing plates, which a display does not have."

[[clause]]
clause = "12.5.6.22"
title = "Watermark annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A watermark annotation's appearance stream is drawn like any other annotation's. Table 191's /FixedPrint is what makes it a watermark rather than a stamp — a matrix and a size that keep the mark constant when the page is scaled or printed to another sheet — and it is neither applied nor reported, which is the same shape as §12.5.3's NoZoom and NoRotate: a resolution-independent display list cannot express a size that depends on the view."

[[clause]]
clause = "12.5.6.23"
title = "Redaction annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs"]
note = "A redaction annotation \"identifies content that is intended to be removed from the document\", and in the state this crate sees it — before removal — the clause says only that \"the user can see, move and redefine these annotations\". It is drawn from its `/AP` where it has one, and where it has none the clause states no artwork, exactly as §12.5.6.4's icons do not. **Table 195's other entries are not this annotation's appearance at all**, which the hundred-and-fifth session read and the row previously had backwards: `/IC` is \"the interior colour with which to fill the redacted region **after the affected content has been removed**\", `/OverlayText` is \"drawn over the redacted region **after the affected content has been removed**\", `/Repeat`, `/DA` and `/Q` say how, and `/RO` \"takes precedence over the IC, OverlayText, DA, and Q entries\" for the same moment. All six describe the *second* phase, which the clause makes a rewrite of the document — \"remove all content identified by the redaction annotation, as well as the annotation itself … If a portion of an image is contained in a redaction region, that portion of the image data shall be destroyed\" — and `CLAUDE.md` excludes writing files. So this program does not support redaction and correctly draws none of them. `/QuadPoints` names the region to be removed rather than anything to paint. The row previously cited \"Table 193\", which is the watermark annotation's table and an ISO 32000-1 number; the redaction table is 195."

[[clause]]
clause = "12.5.6.24"
title = "Projection annotations"
status = "implemented"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "A projection annotation 'is only valid within the context of an associated run-time environment, such as an activated 3D model', and saves a 3D measurement as markup. With clause 13 excluded by principle 5 there is no such environment here, so an appearance-less projection draws nothing and reports nothing — which Table 166 supports from the other side, naming Projection with Popup and Link as the three subtypes a writer need not give an appearance dictionary. One with an /AP is drawn like any other annotation. The test named here pins the property this row needs: an annotation that is not shown reaches neither the display list nor the report."

[[clause]]
clause = "12.5.6.25"
title = "3D and RichMedia annotations"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "3D and RichMedia annotations are defined by §13.6.2 and §13.7.2, which principle 5's closed list excludes as a media engine rather than a rendering question. Their appearance streams are drawn where they exist, like any other annotation's, because nothing in the placement path switches on subtype."

[[clause]]
clause = "12.6"
title = "Actions"
status = "partial"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/tests/actions.rs"]
note = "Actions — what a PDF *does* when something is triggered. `CLAUDE.md` splits this family down the middle: \"[f]ield *appearance* is not excluded; field *behaviour* is\", and \"JavaScript and script-driven form behaviour\" is on principle 5's closed exclusion list by name. Since the sixty-second session `action.rs` reads Table 196's dictionary and its `/Next` tree, and **the three types that change what a page displays are performed**: §12.6.4.2's go-to, §12.6.4.13's set-OCG-state and §12.6.4.11's hide. The other seventeen are recognised and each carries its own refusal by name. What performs them is `view.rs`'s `ViewState`, which is the first thing in this tree that is neither the document nor the page: a layer a click switched off is not in the file, so `interpret_with` takes it as a third input and `interpret` is that function at the state a document opens in."

[[clause]]
clause = "12.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/tests/actions.rs::a_set_ocg_state_action_changes_what_the_next_render_draws"]
note = "The framing: an action is performed in response to a trigger, and the entries that carry one are read where they are — a link annotation's `/A` (§12.5.6.5, `link.rs`), an outline item's (§12.3.3, `outline.rs`), and the catalog's `/OpenAction` (§7.7.2, `destination.rs`). Table 190's screen annotation and Table 249's FDF field are the two this tree does not reach, and both belong to families it excludes."

[[clause]]
clause = "12.6.2"
title = "Action dictionaries"
status = "implemented"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/src/action.rs::a_next_chain_is_flattened_in_execution_order", "crates/pdf-model/src/action.rs::a_cycle_of_next_entries_terminates"]
note = "Table 196 in full: `/Type` (optional and ignored), `/S` dispatching on Table 201's twenty names, and `/Next`, which is where the work is. NOTE 1 makes the chain a *tree* — \"[a]ctions within each Next array are executed in order, each followed in turn by any actions specified in its Next entry, and so on recursively\" — so `action::read` flattens it depth-first into the order it is performed in, which is also what lets a go-to buried under a sound reach `link.rs`. The clause's own robustness rule is the other half and it is a rule about *broken files*: \"self-referential actions ought not be executed more than once\", so each action object is visited once and the total is bounded. NOTE 2's advice not to modify an action tree while running it is a writer's."

[[clause]]
clause = "12.6.3"
title = "Trigger events"
status = "partial"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/view.rs", "crates/viewer-core/src/interact.rs"]
test = ["crates/pdf-model/tests/actions.rs::an_annotations_trigger_events_perform_their_actions", "crates/pdf-model/tests/actions.rs::an_annotations_own_action_takes_precedence_over_its_mouse_up_trigger", "crates/viewer-core/tests/headless.rs::the_pointer_raises_table_197s_events", "crates/viewer-core/tests/headless.rs::a_page_turn_raises_the_events_the_clause_orders", "crates/pdf-model/tests/actions.rs::the_corpus_states_these_page_scoped_triggers"]
note = "Table 197's ten annotation events and Table 198's two page events are read since the seventy-seventh session — `action::for_annotation` and `action::for_page` — and what they return is §12.6.2's flattened list, which `ViewState::perform_all` performs. Table 197's one precedence rule is applied where it belongs, on the entry it is stated about: \"[f]or backward compatibility, the A entry in an annotation dictionary, if present, takes precedence over\" `/AA /U`, so an annotation stating both performs its `/A` on mouse-up and never its `/U`. `/AA` on a page is read from the page's own dictionary, because §7.7.3.4 makes four entries inheritable and this is not among them. **Something raises them since the hundred-and-seventy-fourth session.** This row said \"[n]othing raises an event: entering, pressing and focusing are a window's business and this crate has no events\" — true when written, and false from the hundred-and-thirty-second, when `Command::Pointer` arrived. Forty-one sessions later a sweep for reasons of the shape \"this program has no\" found it. `viewer_core` now raises four of Table 197's ten from the pointer: `/E` and `/X` as the cursor crosses an activation region, `/D` on a press, and `/U` on a release over anything that is **not** the link being activated — the exclusion is Table 197's own precedence rule rather than a shortcut, since `interact::activate` performs a link's `/A` and `for_annotation` would return the same list again. The region is `view::annotation_at`, which is any subtype rather than a link or a widget, gated by `annotation::interacts`: §12.5.3's Hidden, NoView **and ReadOnly** each say \"or allow it to interact with the user\", and ReadOnly is about nothing else — read for the first time here, with the clause's own exception applied (\"[t]his flag shall be ignored for widget annotations\"). Deliberately *not* gated on whether the annotation renders ink: a link renders none and is the standing example of a region. Tables 199 and 200 are excluded rather than owed: every entry of both is an ECMAScript action, which is on principle 5's closed exclusion list, and saying so is the difference between an exclusion and an oversight. **And four more since the two-hundred-and-fourth**, together with both of Table 198's, on the same sweep's second finding: `/PO`, `/PC`, `/PV` and `/PI` were said to want \"a page-visibility model a one-page-at-a-time window does not have\", and a window that turns pages *is* one. `Viewer::page_events` raises them in the order the clause states — of `/PO`, \"[t]he action shall be executed after the O action in the page's additional -actions dictionary … and the OpenAction entry in the document Catalog … if such actions are present\", and of `/PC`, that it \"shall be executed before the C action\" — so a turn is the leaving page's annotations, the leaving page, the arriving page, then its annotations, and `action::for_page` finally has a caller. **`/PV` and `/PI` coincide with `/PO` and `/PC` here by derivation rather than by concession**: the clause says the pair exists because \"[a]t any one time, while more than one page may be visible, depending on the page layout\", and this layout has one page. NOTE 1 is honoured by not consulting Table 167 — \"the values of the flags specified by the annotation's F entry … have no bearing on whether a given trigger event occurs\" — so a hidden annotation's `/PO` is performed. Nothing cascades: an action that turns the page again does not raise a second round, because §12.6.2 bounds nothing and a document could otherwise walk itself. ADR 0164. `partial` now for `/Fo` and `/Bl` alone, which want keyboard focus — there is no focus model in `Command` at all, and adding one is a vocabulary change rather than a clause. 15 of the 974 corpus documents write an `/AA` at all, and the page-scoped population is measured by name: 3 pages of `doc_actions.pdf` state `/O` and `/C`, 1 annotation of `issue18305.pdf` states `/PO` and `/PC`, and **no document states `/PV` or `/PI`** — which is what the clause predicts of an entry that exists for multi-page layouts."

[[clause]]
clause = "12.6.4"
title = "Action types"
status = "partial"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/tests/actions.rs"]
note = "Table 201's twenty action types. The rows below take them one at a time; the summary is that **three are performed and they are the three that change what is displayed** — `/GoTo` (§12.6.4.2), `/SetOCGState` (§12.6.4.13) and `/Hide` (§12.6.4.11) — and the other seventeen are recognised and refused by name rather than ignored as a class. `/Trans` is the fourth that could change a mark and does not: §12.4.4's transition is an animation between two renders, and this viewer draws the second one."

[[clause]]
clause = "12.6.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/src/action.rs::a_name_the_table_does_not_hold_is_not_an_action"]
note = "The list of types, and the rule that a processor \"shall ignore\" an action whose `/S` it does not recognise — the same compatibility principle §7.8.2's `BX`/`EX` states for operators and Annex I for the file as a whole. Implemented as a *distinction* rather than a blanket: a name Table 201 holds becomes an `Action::Refused` carrying that name, and a name it does not hold produces nothing at all, because calling an unknown name a refused action would claim to know what was refused."

[[clause]]
clause = "12.6.4.2"
title = "Go-To actions"
status = "implemented"
code = ["crates/pdf-model/src/link.rs", "crates/pdf-model/src/outline.rs", "crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/src/link.rs::a_rectangle_is_the_region_and_it_has_edges", "crates/pdf-model/tests/links.rs::a_links_region_is_found_and_its_destination_resolves"]
note = "Go-To: \"a destination that shall be displayed\" in this document, which is Table 206's `/D` read as §12.3.2's destination. Every place the standard puts one is read — a link annotation's `/A`, an outline item's, and the catalog's `/OpenAction` — and each turns the page. The action *dictionary* is the whole of this subclause: what to do with the destination is §12.3.2's, and what a viewer does with the view within the page is stated on §12.3.2.1's row. `/SD`, the structure destination alternative, resolves through §12.3.2.3 like any other."

[[clause]]
clause = "12.6.4.3"
title = "Remote Go-To actions"
status = "reported"
code = ["crates/pdf-model/src/action.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/action.rs::a_name_the_table_does_not_hold_is_not_an_action"]
note = "Remote Go-To: a destination in *another* file, whose `page` is an integer index rather than a page object. Opening a second document is a `viewer-ui` question and a security one — §7.11's file specification can name any path. **Refused by name and said out loud**: `action.rs` answers \"GoToR: a destination in another file, which this reader has no filesystem to open\" and `viewer-ui` prints it when a click reaches one, so this is `reported` rather than `silent` — the row said `silent` while the code has named it since the sixty-second session."

[[clause]]
clause = "12.6.4.4"
title = "Embedded Go-To actions"
status = "partial"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/destination.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/action.rs::the_clauses_three_example_relationships_read_as_paths", "crates/pdf-model/src/action.rs::a_target_this_file_does_not_contain_is_named", "crates/pdf-model/tests/actions.rs::an_embedded_go_to_opens_the_document_inside_this_one"]
note = "**Performed.** This is the one action of Table 201's twenty that names another document and needs no filesystem to reach it: a `GoToR` names a file on a disk, a `GoToE` names a file *inside the one already open*, and §7.11.4's embedded file streams have been read since the eighty-sixth session (ADR 0076). Tables 204 and 205 whole — `/T` flattened into a path of steps, `/R /P` popping back to the document the walk descended from and `/R /C` opening a child by its `EmbeddedFiles` key or by the file attachment annotation Table 205's `/P` and `/A` name, in both spellings each. §12.6.4.4's NOTE asks for a cycle check and `MAX_TARGET_DEPTH` is it: the path is a finite list read once, and each step opens at most one document, with the parent's `Limits` inherited so a document nested three deep is bounded like the one a person opened. `/D` is deliberately left unresolved and read in the *target*, because §12.3.2.2 makes its first element a page **number** there — \"[t]he first page shall be numbered 0\" (Table 203) — and a named destination is looked up in the target's own tables; `Destination::page_index_in_target` is that difference. Table 204's `/NewWindow` is a *should* and this program has one window, so the target replaces the source and says so. Refused by name, each separately: an `/F` naming another root document, a `/R /P` from the document a person opened, and a child this file does not embed. Measured: `issue17056.pdf` states 30 of these actions, all of the child-by-name form, and all 30 open."

[[clause]]
clause = "12.6.4.5"
title = "GoToDp action"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/document_part.rs"]
test = ["crates/pdf-model/src/document_part.rs::a_leaf_begins_at_the_page_its_start_names", "crates/pdf-model/src/document_part.rs::a_node_begins_at_the_first_leaf_of_its_first_child"]
note = "GoToDp: \"changes the view to the Start page of a specified DPart\", performed since the hundred-and-eighteenth session. Table 206 has one entry, `/Dp`, \"[t]he indirect reference to a DPart dictionary to go to\", and it is kept as a *reference* because resolving it needs the page tree that turns Table 409's `/Start` into a number. **This row was `reported` on the ground that §14.12 \"is `unreviewed` in clause 14 and unbuilt\", and by the time anybody read it again §14.12 was `inapplicable` and the action still had nowhere to go** — which is `doc/HANDOVER.md`'s habit that an `inapplicable` row decays exactly as a `silent` one does, met for the second time. A `GoToDp` naming a *node* rather than a leaf is answered by §14.12.3's own sentence about depth-first order rather than by a guess."

[[clause]]
clause = "12.6.4.6"
title = "Launch actions"
status = "reported"
code = ["crates/pdf-model/src/action.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/action.rs::a_name_the_table_does_not_hold_is_not_an_action"]
note = "Launch: run an application or open a file. **The one action in this family whose absence is a security property rather than a gap**, and it should stay absent until somebody writes the argument — principle 3's sandbox exists so that a document cannot reach the machine, and this action is a document asking to. **Refused by name and said out loud**: `action.rs` answers \"Launch: running an application, which the sandbox withholds\" and `viewer-ui` prints it when a click reaches one, so this is `reported` rather than `silent` — the row said `silent` while the code has named it since the sixty-second session."

[[clause]]
clause = "12.6.4.7"
title = "Thread actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/src/action.rs::a_thread_action_names_its_thread_in_all_three_forms", "crates/pdf-model/src/action.rs::a_thread_in_another_file_is_refused_by_name"]
note = "Table 209 whole: `/D` in all three of its forms — a reference to a thread dictionary, an index into the catalog's `/Threads`, or a title from the thread information dictionary — with the clause's own tie-break for a repeated title, \"the one appearing first in the document catalog's Threads array shall be used\"; and `/B` in both of its forms, a reference or an index within the thread, defaulting to the thread's first bead where the optional entry is absent. Resolution is `ThreadJump::bead_in` against §12.4.3's articles, and the answer is a bead whose `/P` names a page, which is what a viewer turns to. A `/F` makes the thread another file's and is refused by name, for `GoToR`'s reason: Table 209 says \"[i]f this entry is absent, the thread is in the current file\", so the entry's presence is the whole test. No corpus document states a thread action, which follows from no corpus document stating a thread."

[[clause]]
clause = "12.6.4.8"
title = "URI actions"
status = "partial"
code = ["crates/pdf-model/src/uri.rs", "crates/pdf-model/src/action.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/uri.rs::rfc_3986_normal_examples", "crates/pdf-model/src/action.rs::a_partial_uri_is_resolved_against_the_documents_base", "crates/pdf-model/tests/actions.rs::a_uri_action_arrives_at_the_viewer_already_resolved"]
note = "Table 210's `/URI` and `/IsMap` and Table 211's `/Base`, which is the whole of what the clause states about a *document*. What the URI is gets decided here: the clause describes a URI \"in Internet RFC 3986\" and says a partial one is interpreted relative to `/Base`, so `uri.rs` is that RFC's section 5.2 reference transformation, with its own section 5.4 examples as the tests — the concatenation a reader reaches for first is wrong on four of them. `/IsMap` appends the cursor as EXAMPLE 1's arithmetic states it, measured from the *upper-left* corner of `/Rect`, which is the half that inverts. **What is not done is the resolving itself**: `viewer-ui` prints the URI rather than opening it, because handing a document-controlled string to a browser is a decision about this machine and not about the file. With no `/Base`, a partial URI is \"interpreted relative to the location of the document itself\", which this crate does not know — `Uri::relative` says so rather than a scheme being invented, which is what one corpus document (`pr19449.pdf`, `foo.bar.com`) would otherwise get. 217 URI actions in 8 of the 974 documents; one states a `/Base` and one states a partial reference, and they are different files."

[[clause]]
clause = "12.6.4.9"
title = "Sound actions"
status = "reported"
code = ["crates/pdf-model/src/action.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
