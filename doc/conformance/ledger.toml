[[clause]]
clause = "12.7.8.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/forms_data.rs"]
test = ["crates/pdf-model/src/forms_data.rs::what_is_not_applied_is_named", "crates/pdf-model/src/forms_data.rs::the_file_says_which_document_it_is_for_and_what_the_server_said"]
note = "Table 246 whole, read, with three entries named rather than applied and each for a stated reason: **`/Pages` is applied** — `read_pages` builds §12.7.8.3.3's page dictionaries and `named_page` adds their templates to the document, which has been true since §12.7.7's named pages landed in the hundred-and-first session and which this note went on saying was owed until the hundred-and-eighteenth — `/Annots` needs a second document's objects to reach the interpreter, `/JavaScript` is on principle 5's closed exclusion list, and `/Differences` carries the target document's own incremental updates, which applying would mean writing a PDF. `/F` and `/ID` are read and `FormsData::belongs_to` compares §14.4's permanent identifier, `/Status` is the server's message and is printed because the table says it \"shall be displayed\", and `/Encoding` decides how a value's bytes become characters — its default and its two Unicode values are §7.9.2.2's own three, and its four registered character sets are refused by name for Table 116's reason, per string rather than per file."

[[clause]]
clause = "12.7.8.3.2"
title = "FDF fields"
status = "partial"
code = ["crates/pdf-model/src/forms_data.rs", "crates/pdf-model/src/view.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/forms_data.rs::an_imported_value_is_the_one_that_is_drawn", "crates/pdf-model/src/forms_data.rs::ff_replaces_and_setff_modifies", "crates/pdf-model/src/forms_data.rs::a_kids_tree_flattens_to_fully_qualified_names"]
note = "Table 249, and the clause's one load-bearing sentence: \"importing a field causes the values of the entries in the FDF field dictionary to replace those of the corresponding entries in the field with the same fully qualified name in the target document\". Both halves are executed. *The same fully qualified name*: `/T` is concatenated down `/Kids` with §12.7.4.2's full stop, and the pairing runs through the same widget-by-name table §12.6.4.11 and §12.7.6.3 use. *Replace*: `ViewState::import` holds the new value beside the reset set, `Field::read` takes it instead of walking for `/V`, and a field stating no `/V` leaves the widget with none — which is what replacing with nothing means for a program that does not write to the file. The table's two flag triples are one arithmetic in `FlagChange`, with the table's own precedence: `/Ff` and `/F` replace, `/SetFf` and `/SetF` are applied before `/ClrFf` and `/ClrF`, and the modifying pair \"shall be ignored\" where the replacing entry is present. `/Opt` is read in both of the forms the table gives an element. Named and not applied: `/AP` and `/APRef`, a push-button's appearance streams in this or another file, `/IF`, the icon fit dictionary that would place them, `/A` and `/AA`, and `/RV`, which is XFA rich text and excluded."

[[clause]]
clause = "12.7.8.3.3"
title = "FDF pages"
status = "partial"
code = ["crates/pdf-model/src/forms_data.rs", "crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/tests/forms_data.rs::an_imported_template_adds_a_page_the_document_already_held", "crates/pdf-model/tests/forms_data.rs::a_template_this_document_cannot_reach_is_named", "crates/pdf-model/src/forms_data.rs::a_template_page_names_a_page_this_document_already_holds"]
note = "Tables 251, 252 and 253 read, and a template page **added**: the reference resolves through §12.7.7's name trees to a page this document already holds, so the whole operation is a name lookup and no page content crosses between files. Where the page is added is this program's choice and is written down — after the document's own, which §12.7.8.3.3 does not state and which is the only order leaving every existing page index meaning what it meant. Two refusals, each named: Table 253's `/F` puts the template in another file, which this reader has no filesystem to open, and a `/TRef` naming no page in either tree is a file asking for something the document does not contain. Table 252's `/Fields` is read and not applied, because it names fields of the *template's* own hierarchy rather than the target's `/AcroForm`; `/Rename` is read and cannot be applied by anybody, since the clause says outright that the flag \"does not define a renaming algorithm\" — and nothing here merges field trees for it to matter to. No corpus document states an FDF `/Pages` entry, because none carries an FDF file at all."

