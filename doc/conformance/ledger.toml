note = "Aggregate of the seven below, completed as a family in the fifteenth session (§11.6.4 was the fourteenth's). Blend modes, both alpha constants and an image's own soft mask are implemented; a graphics-state soft mask is reported; transparency groups are the silence, and §11.6.6 is where it is recorded."

[[clause]]
clause = "11.6.1"
title = "General"
status = "inapplicable"
note = "One sentence of scope: the subclauses before it describe the model abstractly and this one describes its representation in PDF. There is nothing to implement, and marking it `implemented` would claim code for a clause that asks for none."

[[clause]]
clause = "11.6.2"
title = "Specifying source and backdrop colours"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_filled_and_stroked_path_reports_only_where_it_can_show"]
note = "\"Portions of an object shall not be composited with one another\" — and `B` and its three relatives paint one object as a `Fill` and a `Stroke`, so the band a centred stroke shares with the fill composites twice. Reported as of the fifteenth session, on the pages where it can show: the paint composites, and both parts mark the page. 4 corpus documents, of which `alphatrans.pdf` is the one drawn wrong. Implementing it means compositing the two parts into one element, which is §11.4.6's groups again. The clause's other two examples cost nothing here: a self-intersecting path is filled once under one winding rule, and a mesh shading is one paint. Source colour and backdrop colour are as the clause states them."

[[clause]]
clause = "11.6.3"
title = "Specifying blending colour space and blend mode"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_blend_mode_array_takes_the_first_name_this_reader_knows"]
note = "All sixteen names of Tables 134 and 135 reach both backends, and the deprecated array form takes \"the first blend mode in the array that it recognizes (or Normal if it recognizes none of them)\" — which is not the first *name*, and was until the fifteenth session. The blending colour space is the other half of the clause and it defers to §11.6.6: we composite in the device space throughout, which is what a page with no group attributes dictionary asks for."

[[clause]]
