test = ["crates/pdf-model/tests/page_geometry.rs::a_page_tree_of_any_shape_yields_its_pages_in_the_order_its_kids_arrays_give"]
note = "\"Compliant PDF processors shall be prepared to handle any form of tree structure built of such nodes\", and `Pages::get` walks whatever it finds rather than assuming the flat or balanced shape the NOTE describes. Two bounds guard the walk against a tree that is not one: 64 levels of nesting — a balanced tree over a hundred thousand pages is about six — and a million nodes visited per lookup. The clause's own reason for the tree is why the walk is on demand: \"PDF readers using only limited memory, can quickly open a document containing thousands of pages\", which is also this project's time-to-first-page requirement."

[[clause]]
clause = "7.7.3.2"
title = "Page tree nodes"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_page_tree_of_any_shape_yields_its_pages_in_the_order_its_kids_arrays_give"]
note = "Table 30's `/Kids` is followed and `/Type` is not required of a *node*, because files omit it; the walk decides a leaf by the *absence* of `/Kids` rather than by the name, which is what lets a malformed tree still yield its pages. **Where the tree yields nothing at all, `/Type` on a page is asked instead** (hundred-and-seventh session): Table 31 makes it required of a page object and says it \"shall be Page\", so a document whose tree is broken can still be asked which of its objects declare themselves pages, with §7.7.3.4's inheritance applied up each one's own `/Parent` chain. Five corpus documents reach page one that way, in ascending object number — a documented choice, because §7.7.3.2's tree is where page *order* lives and a file whose tree is gone has not stated one. It runs only where the tree produced nothing, so no document that opens normally pays for it. **`/Count` is deliberately not trusted**, and the clause's own NOTE says why: it \"is redundant\", and \"the value of the Count key is consistent with the number of entries in the Kids array and its descendants which definitively determines the number of descendant pages\". Real files disagree with their own counts; the `Kids` arrays are what this reader counts."

[[clause]]
clause = "7.7.3.3"
title = "Page objects"
status = "partial"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs"]
note = "Table 31's entries that decide what is drawn: `/Resources`, `/MediaBox`, `/CropBox`, `/Rotate`, `/Contents` (one stream or an array \"concatenated with at least one white-space character added between the streams' data\", since a token may straddle the boundary), `/Annots` (§12.5), `/Group` (§11.4.7's page group) and — **as of the twenty-ninth session** — `/UserUnit`. That last is \"a positive number that shall give the size of default user space units, in multiples of 1/72 inch\", and it had been read nowhere: **all three of the oracle's page-geometry disagreements were this one entry**, two documents writing `/UserUnit 3` and one writing `/MediaBox [0 0 8.5 11]` with `/UserUnit 72`, which is a page stated in inches. `mutool` and `ghostscript` scale by it and `poppler` does not; the clause settles it rather than the vote. A value that is not positive is the default of 1.0, and values above 1000 are refused — the clause's \"range of supported values shall be implementation-dependent\", answered here. **This row's \"not read\" list was eighteen entries and eleven of them are read**, which is the understating shape ADR 0101 named and no gate can watch. Read since the sessions that built them: `/BleedBox`, `/TrimBox` and `/ArtBox` (§14.11.2's boundaries, which §12.2's viewer preferences select between), `/Thumb` (§12.3.4), `/B` (§12.4.3's articles), `/Dur`, `/Trans` and `/PresSteps` (§12.4.4's presentation), `/AA` (§12.6.3's triggers), `/StructParents` (§14.7.4) and `/VP` (§12.9's viewports). Genuinely not read: `/LastModified`, `/BoxColorInfo` (guideline colours for a production workflow), `/Metadata` (§14.3.2 parses no XMP), `/PieceInfo`, `/ID`, `/PZ`, `/SeparationInfo`, `/Tabs` and `/TemplateInstantiated`."

[[clause]]
clause = "7.7.3.4"
title = "Inheritance of page attributes"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_on_an_ancestor_is_not_inherited"]
note = "The four entries Table 31 marks inheritable — `/Resources`, `/MediaBox`, `/CropBox` and `/Rotate` — are overlaid on the way down the tree so that the nearest ancestor's value wins, which is what inheritance means here. The sentence that makes the *rest* of Table 31 a closed question is §7.7.3.3's rather than this one's — \"attributes that are not explicitly identified in the table as inheritable shall not be inherited\" — which is why `/UserUnit` is read from the page object alone even though reading it through the same path as `/MediaBox` would be one word's difference. \"All values shall be inherited as-is, without merging, even for composite data types\" is why a page's `/Resources` is the first dictionary found and not a union of the ones above it."

[[clause]]
clause = "7.7.4"
title = "Name dictionary"
status = "partial"
code = ["crates/pdf-model/src/attachment.rs", "crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_embedded_file_is_read_with_its_parameters"]
note = "The catalog's `/Names` name dictionary — Table 32's ten trees, each a §7.9.6 name tree. Two are read: `/Dests` (§12.3.2.4's named destinations, since the forty-ninth session) and `/EmbeddedFiles` (§7.11.4's attachments, since the eighty-sixth). The other eight are each owed to a feature rather than to this row: `/AP` to §12.7.4.3's appearance streams by name, `/JavaScript` to a clause principle 5 excludes, `/Pages` and `/Templates` to §12.7.7's named pages, `/IDS` and `/URLS` to web capture, `/AlternatePresentations` to a deprecated feature, and `/Renditions` to clause 13. `tree::name_pairs` is what a caller with no key to look up needs, and is the walk `number_pairs` already was for §7.9.7."

[[clause]]
clause = "7.8"
title = "Content streams and resources"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/content_streams.rs::a_compatibility_section_silences_an_unrecognised_operator"]
note = "Both halves: a content stream is lexed and executed sequentially, and its resources are resolved by name against the dictionary the clause associates with it. See §7.8.2 and §7.8.3."

[[clause]]
clause = "7.8.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/render_real_pdf.rs::every_specification_pdf_interprets"]
note = "Introductory. Its one claim — that a content stream and its resource dictionary \"in combination … form a self-contained entity\" — is the shape of `Interpreter::run`, which takes the two together and nothing else about the document except what a resource resolves to."

[[clause]]
clause = "7.8.2"
title = "Content streams"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-model/tests/content_streams.rs::the_silence_stops_at_the_matching_ex", "crates/pdf-model/tests/content_streams.rs::compatibility_sections_nest"]
note = "Every clause of it. The stream is lexed by §7.2's rules and executed in order; the five places the clause names as also being content streams — pages, form XObjects, patterns, Type 3 glyph descriptions and annotation appearances — all reach the same interpreter. \"An operand is a direct object belonging to any of the basic PDF data types except a stream … Indirect objects and object references shall not be permitted at all\" holds by construction: the content lexer has no reference token, so a `1 0 R` in a content stream lexes as two integers and an unrecognised operator. Table 33's `BX` and `EX` were matched and ignored for thirty-one sessions and are now the compatibility *section* the clause defines, kept as a nesting depth because \"these operators shall occur in pairs and may be nested\" — and it is the one place in this interpreter where unsupported input is deliberately silent, because the file has said in advance that ignoring it is appropriate. No corpus document exercises it: all nine that report an unrecognised operator report one no producer meant."

[[clause]]
clause = "7.8.3"
title = "Resource dictionaries"
status = "partial"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs", "crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_on_an_ancestor_is_not_inherited"]
note = "All four of the clause's ways a resource dictionary reaches a content stream: a page's `/Resources`, inherited through the page tree (§7.7.3.4); a Type 3 font's own; a form XObject's, a pattern's and an appearance stream's; and the fourth, for files \"written obeying earlier versions of PDF\" that omit it — \"All resources that are referenced from those forms and fonts shall be inherited from the resource dictionary of the page\", which is why every resource lookup falls back to the enclosing dictionary rather than failing. **A resource name is scoped to the dictionary that defines it, and for thirty-one sessions the font cache was not.** The interpreter keyed loaded fonts by the name a `Tf` used, so a form XObject's `/F1` was answered with whatever `/F1` the page had loaded — wrong glyphs, in silence, on two corpus documents (ADR 0115, hundred-and-twenty-seventh session). It is keyed by the font dictionary's object identity now, which is what `shading::Cache` had been doing for the same reason since the seventy-third. Of Table 34's eight resource types, seven are read; `/ProcSet` is deprecated in PDF 2.0 and §14.2 makes it advisory, so nothing looks at it. The partial is `/Properties`, which is read only for `/OC` (§8.11.3.3) and not for §14.6.2's marked-content property lists in general — which is clause 14's gap rather than this one's."

[[clause]]
clause = "7.9"
title = "Common data structures"
status = "partial"
code = ["crates/pdf-syntax/src/text_string.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_surrogate_pair_is_one_character"]
note = "The two of the clause's structures a rendered page needs: §7.9.2's string object types and §7.9.5's rectangles. Dates, text streams, name trees and number trees belong to features this tree does not have yet; see their rows."

[[clause]]
clause = "7.9.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_surrogate_pair_is_one_character"]
note = "Introductory. Its claim — that these structures are \"built from the basic types described in 7.3\" and carry conventional meanings — is the reason `text_string.rs` and `annotation::rectangle` exist as functions rather than as a rule repeated at each use."

[[clause]]
clause = "7.9.2"
title = "String object types"
status = "partial"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_string_with_no_prefix_is_pdfdocencoded"]
note = "Three of the four string object types are read where they are used. §7.9.2.2's text string is `text_string`, compiled against Table D.3; §7.9.2.4's byte string is the lexer's own output, which is what every other reader of a `/String` takes; §7.9.2.3's PDFDocEncoded string shares Table D.3 with the text string type and differs only in admitting no Unicode prefix, which no entry this tree reads distinguishes. What is not here is the *typing*: the object model carries one string type and each reader decides which of the four it holds, so a text string read as bytes is a defect nothing in this crate can catch."

[[clause]]
clause = "7.9.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/object.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_string_with_no_prefix_is_pdfdocencoded"]
note = "The clause's whole content is a statement about the object model: 'PDF supports one fundamental string object' and 'the string object shall be further qualified as a text string, ASCII string, or byte string'. This crate holds exactly that — one `Object::String` of bytes, qualified by whoever reads it. Figure 7's containment is why `text_string` can be applied to any string and why an ASCII string needs no decoder."

[[clause]]
clause = "7.9.2.2"
title = "Text string type"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_string_with_no_prefix_is_pdfdocencoded", "crates/pdf-syntax/src/text_string.rs::a_utf16be_marker_selects_utf16be", "crates/pdf-syntax/src/text_string.rs::a_utf8_marker_selects_utf8"]
note = "All three encodings the clause names, chosen by the prefix it states, with Annex D's Table D.3 compiled in — and since the hundred-and-thirty-fifth session the *write* side of two of them: `encode_text_string` produces `PDFDocEncoding` where the table covers the string and UTF-16BE with the clause's prefix otherwise, which is what a field value a person typed has to become before §12.7.4.3 can lay it out. UTF-8 is not produced: it is the PDF 2.0 form, and a file this program writes into has to stay readable by whatever could read what it was written into. The reason it exists is §12.7.4.3: a field's `/V` and a free text annotation's `/Contents` are text strings and have to become characters before they can become glyphs. Table D.3 is not ISO Latin 1 and the differences decide pages — 0xA0 is EURO SIGN, 0x18 to 0x1F are accents, 0x80 to 0x9E are punctuation — so a Latin 1 decode would draw the wrong character with nothing reported."

[[clause]]
clause = "7.9.2.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_surrogate_pair_is_one_character", "crates/pdf-syntax/src/text_string.rs::the_table_is_not_latin_1", "crates/pdf-syntax/src/text_string.rs::an_undefined_code_point_is_the_replacement_character"]
note = "The prefix rule and all three encodings, including the clause's requirement that a reader 'shall be prepared to handle supplementary characters' — UTF-16BE is decoded by pairing surrogates rather than by taking each code unit as a character, which its NOTE 5 is there to warn against. A code Table D.3 marks Undefined becomes U+FFFD, so it reaches the layout as a character no font encodes and is reported there rather than dropped."

[[clause]]
clause = "7.9.2.2.2"
title = "Text string language escape sequences"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_language_escape_sequence_shows_nothing", "crates/pdf-syntax/src/text_string.rs::a_lone_escape_does_not_swallow_the_rest_of_the_string"]
note = "Both shapes the clause states — U+001B, a two-letter language code, an optional two-letter country code, U+001B — are removed from a Unicode text string, because the sequence marks a language and carries no character to display. Only from the two Unicode forms: the clause states the byte sequences for UTF-16BE and UTF-8 and not for PDFDocEncoding. A U+001B with no closing one is left where it stands rather than swallowing the rest of the value. What is *not* done with it is anything: the sequence overrides §14.9.2's hierarchy, which the sixtieth session built, so the language a `/Lang` states now reaches a caller and the one an escape sequence states is still dropped with the escape. Closing that means carrying a language *inside* a decoded text string, which changes the return type of every text-string read in the tree for a construct no corpus document writes."

[[clause]]
clause = "7.9.2.3"
title = "PDFDocEncoded string type"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::the_table_is_not_latin_1"]
note = "The same Table D.3 as §7.9.2.2, which is the whole of the type: 'a character string in which the characters shall be represented in a single byte using PDFDocEncoding'. No entry this tree reads is typed as one rather than as a text string, and the two differ only in whether a Unicode prefix is honoured, so the table has one reader."

[[clause]]
clause = "7.9.2.4"
title = "Byte string type"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::hex_strings_ignore_junk_and_pad_an_odd_digit"]
note = "A byte string is what the lexer produces for every `/String`: 'binary data that shall be represented as a series of bytes, where each byte may be any value representable in 8 bits'. The two places the tree needs it as such are §7.6's `/O`, `/U`, `/OE`, `/UE` and `/Perms` and §14.4's file identifier, both of which take the bytes unchanged."

[[clause]]
clause = "7.9.3"
title = "Text streams"
status = "reported"
note = "A text *stream*, whose \"unencoded bytes shall meet the same requirements as a text string with respect to encoding, byte order, and lead bytes\". Nothing here reads one, and the reason is worth stating precisely rather than approximately: **every entry ISO 32000-2 types `text string or text stream` is excluded by principle 5** — `/RV` on Table 228 and Table 249 and `/RC` on Tables 172 and 174 are XFA rich text, and `/JS` and the FDF ECMAScript dictionary's `/Before`, `/After`, `/AfterPermsReady` and `/Doc` are scripts. Each is refused by name where it is met, which is what makes this row `reported` rather than `silent`. The decoder it would need already exists — `text_string` is the same rule one level down — so this closes the day an entry in scope uses the type. (A metadata stream is *not* one: §14.3.2 makes it XML.)"

[[clause]]
clause = "7.9.4"
title = "Dates"
status = "implemented"
code = ["crates/pdf-syntax/src/date.rs"]
test = ["crates/pdf-syntax/src/date.rs::the_clauses_own_example_parses_to_what_it_says_it_means", "crates/pdf-syntax/src/date.rs::every_field_but_the_year_may_be_absent_and_the_clause_states_its_default", "crates/pdf-model/tests/dates.rs::every_date_string_in_the_corpus_is_measured_against_the_clause"]
note = "`D:YYYYMMDDHHmmSSOHH'mm` in full, with every default the clause states — MM and DD both 01, everything else zero — so `D:1998` is a conforming date and parses. NOTE 2's older terminating apostrophe and NOTE 3's `Z` followed by zero offsets are both accepted, and a `Z` followed by *non*-zero offsets is refused as a file contradicting itself. An absent zone is GMT, which the clause decides rather than leaves open, and `Date::offset` still records that the producer claimed nothing. Every range the clause states is enforced and nothing is clamped; a non-conforming string stays available as the bytes the file wrote. The ordering is by the instant, which is what §12.3.5.1's Table 156 collection sort over a `/Subtype /D` field needs and what a string comparison gets wrong across time zones. **Audited over the whole corpus**: 1514 of 1545 date-shaped strings conform (97.99%), and all 31 that do not break a rule the clause states in as many words — 26 of them one producer writing an offset minute of 112, 144, 208, 224 or 240 against `mm (00-59)`."

[[clause]]
clause = "7.9.5"
title = "Rectangles"
status = "implemented"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_scales_the_page_and_its_contents"]
note = "\"Although rectangles are conventionally specified by their lower-left and upper-right corners, it is acceptable to specify any two diagonally opposite corners.\" `annotation::rectangle` normalises every rectangle it reads to lower-left and upper-right by taking the minimum and maximum of each axis, which is that sentence, and it is the one route to `/Rect`, `/BBox`, `/MediaBox`, `/CropBox` and `/RD`. A rectangle with fewer than four numbers, or any that is not finite, is refused rather than filled in."

[[clause]]
clause = "7.9.6"
title = "Name trees"
status = "implemented"
code = ["crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-syntax/src/tree.rs::a_key_is_found_through_intermediate_nodes"]
note = "Name trees: a root with `/Names` or `/Kids`, intermediate and leaf nodes with `/Limits`, keys that are *strings* and are ordered. `tree.rs` answers this clause and §7.9.7 with one walk, because the two differ only in the key type and in whether the pairs are called `/Names` or `/Nums`. **The `/Limits` are read as a hint rather than as a gate**: a node whose limits exclude the key is skipped and a node with none is searched, so a producer that got them wrong loses speed rather than entries. The clause's own reason for the structure is `CLAUDE.md` principle 2 written by ISO — the pairs \"can be looked up efficiently without requiring the entire data structure to be read from the PDF file\" — which is why the lookup descends rather than flattening."

[[clause]]
clause = "7.9.7"
title = "Number trees"
status = "implemented"
code = ["crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-syntax/src/tree.rs::a_number_trees_pairs_come_back_in_order"]
note = "Number trees, which §7.9.7 defines by difference: \"similar to a name tree … except that its keys shall be integers instead of strings and shall be sorted in ascending numerical order\", with `/Nums` in place of `/Names`. `TreeKey` is that difference and nothing else. Two entry points, for two shapes of question: `lookup` descends for one key, and `number_pairs` walks the whole tree — which §12.4.2 needs, because a labelling range runs from its own key to the *next* one and no single lookup produces a neighbour."

[[clause]]
clause = "7.10"
title = "Functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::every_width_table_39_lists_is_read_and_no_other", "crates/pdf-model/tests/shadings.rs"]
note = "All four function types, which this tree needs more than most readers do: §8.7's shadings evaluate one per sample, §8.6.6's `Separation` and `DeviceN` tint transforms are functions, and §10.5's transfer functions and §11.5's `/TR` are too. **1501 of 1501 functions in the corpus parse**, which the corpus gate asserts by name. The clause's own framing is what makes them cacheable: \"[f]unctions in PDF represent static, self-contained numerical transformations\" — no state, so `Ramp` can sample one 256 times and keep the answers."

[[clause]]
clause = "7.10.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::an_exponential_function_interpolates_between_its_endpoints", "crates/pdf-model/tests/shadings.rs"]
note = "The framing, `/Domain` and `/Range`, and the clipping rule they carry: an input outside `/Domain` is clipped to it before evaluation and an output outside `/Range` is clipped after. Both are applied to every type here, which is where a first implementation loses a shading's end colours."

[[clause]]
clause = "7.10.2"
title = "Type 0 (sampled) functions"
status = "partial"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::every_width_table_39_lists_is_read_and_no_other", "crates/pdf-model/tests/shadings.rs"]
note = "Type 0, sampled: `/Size`, `/BitsPerSample`, `/Encode`, `/Decode` and the samples themselves. **This row said `implemented` and named a whole test file, and auditing that population in the hundred-and-eighth session found two things wrong with it.** It said \"all five of Table 39's sample widths\"; the table says \"[v]alid values shall be 1 , 2 , 4 , 8 , 12 , 16 , 24 , and 32\", which is **eight**, and the code reads all eight — now checked by a test that encodes two samples at each width and reads both ends back. And Table 39's `/Order` is **not read at all**: \"[v]alid values shall be 1 and 3, specifying linear and cubic spline interpolation\", and this tree interpolates multilinearly whatever the entry says. That is a departure rather than a refusal, because the clause names a *cubic spline* and states no spline — refusing would lose a valid document over an entry whose algorithm the standard does not give. Measured over the corpus: **956 type-0 functions in 26 documents, 955 at 8 bits and 1 at 16, and not one states `/Order 3`** — so the departure is invisible in every file we have, which is why it is recorded here rather than reported per page."

[[clause]]
clause = "7.10.3"
title = "Type 2 (exponential interpolation) functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::an_exponential_function_interpolates_between_its_endpoints", "crates/pdf-model/tests/shadings.rs"]
note = "Type 2, exponential interpolation: `/C0`, `/C1` and `/N`, which is the two-colour ramp most axial and radial shadings are made of. One line of arithmetic and the most frequently evaluated function in the corpus."

[[clause]]
clause = "7.10.4"
title = "Type 3 (stitching) functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::a_nested_stitching_functions_steps_map_to_the_outer_domain", "crates/pdf-model/tests/shadings.rs"]
note = "Type 3, stitching: `/Functions`, `/Bounds` and `/Encode`, a one-input function assembled from a row of others. The subclause's own edge — a subdomain of zero width, where two bounds coincide — is what a naive implementation divides by."

[[clause]]
clause = "7.10.5"
title = "Type 4 (PostScript calculator) functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::arithmetic_follows_postscript_stack_order", "crates/pdf-model/tests/shadings.rs"]
note = "Type 4, the PostScript calculator: a small language, evaluated here rather than approximated. It is what `Separation` and `DeviceN` tint transforms are usually written in, and `postscript_type4_many_outputs.pdf` is the corpus's controlled experiment on it (see `oracle.rs`'s `CONTRADICTED_DEVICE_CMYK_CONVERSION`, which used it to prove something about `DeviceCMYK` instead)."

[[clause]]
clause = "7.10.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::a_program_with_an_unknown_operator_is_refused", "crates/pdf-model/tests/shadings.rs"]
note = "The framing: a program in braces, with the input on the stack and the output taken from the top."

[[clause]]
clause = "7.10.5.2"
title = "Operators and operands"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::stack_operators_move_what_they_say", "crates/pdf-model/tests/shadings.rs"]
note = "Table 42's operators, which is the whole language: arithmetic, the relational and boolean set, `if` and `ifelse`, and the stack operators `dup`, `exch`, `pop`, `copy`, `index` and `roll`. The clause bounds the stack at 100 entries, which is a bound this tree applies rather than a suggestion — a program that pushes without limit is a decompression bomb written in another notation."

[[clause]]
clause = "7.10.5.3"
title = "Type 4 function dictionary"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/src/function.rs::a_tint_transform_shaped_program_evaluates", "crates/pdf-model/tests/shadings.rs"]
note = "The type 4 function's own dictionary, which is a stream: `/Domain`, `/Range` and the program as the stream's data. `/Range` is *required* here and is not for every type, and it is what says how many of the stack's values are outputs — which `postscript_type4_many_outputs.pdf` is named after, since its program leaves more values than its `/Range` takes."

[[clause]]
clause = "7.11"
title = "File specifications"
status = "implemented"
code = ["crates/pdf-model/src/file_spec.rs", "crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/file_spec.rs::a_relative_specification_replaces_the_containing_files_name", "crates/pdf-model/src/file_spec.rs::the_unicode_name_is_used_instead_of_the_byte_string"]
note = "Aggregate of the ten below. **A file specification is now read whole and opened never** (hundred-and-fourteenth session): `file_spec.rs` is §7.11.1's two forms, §7.11.2's string format, Table 43 and §7.11.5's URL form, and the sentence the family turns on is still §7.11.1's — a file specification refers to a file \"external to the PDF file\" *in either case*, embedded or not. `CLAUDE.md` principle 3 gives the renderer no filesystem and no network, so *following* one stays refused by architecture; what this row used to record as unread was the difference between refusing a file and being unable to name it. Every path in this tree that meets a specification now names it out of one reader rather than three: §7.3.8's external stream data, §8.10.4's reference XObject drawn as its proxy, §12.5.6.15's file attachment icon, §12.6.4.4's embedded go-to and §12.7.6.4's import."

[[clause]]
clause = "7.11.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/file_spec.rs"]
test = ["crates/pdf-model/src/file_spec.rs::the_unicode_name_is_used_instead_of_the_byte_string"]
note = "The two forms — a simple specification as a string or a dictionary, a full one as a dictionary only — read by `FileSpec::parse`, which answers `None` for an object that is neither. The sentence this family turns on is \"[t]he file is considered external to the PDF file in either case\", so an *embedded* file is still an external file with its bytes carried along, which is why reading one is an attachment feature and never a rendering one. Refusals, not silence: see §7.11's row for the places this tree meets a specification and names it."

[[clause]]
clause = "7.11.2"
title = "File specification strings"
status = "implemented"
code = ["crates/pdf-model/src/file_spec.rs"]
test = ["crates/pdf-model/src/file_spec.rs::a_escaped_solidus_is_part_of_a_component_rather_than_a_separator", "crates/pdf-model/src/file_spec.rs::an_absolute_specification_starts_at_the_root"]
note = "Aggregate of the two below: how a simple file specification's string spells a path, in `FileSpec::components`, `is_absolute` and `resolve_against`."

[[clause]]
clause = "7.11.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/file_spec.rs"]
test = ["crates/pdf-model/src/file_spec.rs::a_escaped_solidus_is_part_of_a_component_rather_than_a_separator", "crates/pdf-model/src/file_spec.rs::an_empty_component_is_a_component"]
note = "The string form: SOLIDUS as \"a generic component separator\", a literal SOLIDUS escaped by REVERSE SOLIDUS, empty components kept because \"[a]ny of the components may be empty\", and the clause's own EXAMPLE `(in\\/out)` as the test. **The closing sentence is what decides the type**: \"[t]he component substrings shall be stored as bytes and shall be passed to the operating system without interpretation or conversion of any sort\", so `components` is `Vec<Vec<u8>>` and stays that way. `FileSpec::display_name` is the one place a `/F` becomes text, which is a *display* decision made where it can be seen — three call sites in `pdf-model` used to make it silently, and this row warned against exactly that before anybody read it."

[[clause]]
clause = "7.11.2.2"
title = "Absolute and relative file specifications"
status = "implemented"
code = ["crates/pdf-model/src/file_spec.rs"]
test = ["crates/pdf-model/src/file_spec.rs::a_relative_specification_replaces_the_containing_files_name", "crates/pdf-model/src/file_spec.rs::two_periods_cancel_the_component_before_them", "crates/pdf-model/src/file_spec.rs::a_relative_url_specification_may_be_a_path_and_nothing_else"]
note = "Absolute and relative specifications, and the clause states its answers rather than only its rules — both of its EXAMPLEs are tests. `resolve_against` removes the containing file's own name and appends, and cancels a `..` against the component before it \"when the component immediately preceding .. is not another . .\"; a `..` with nothing to cancel is *kept*, a documented choice, because dropping it would silently move the target to the root. The URL half is `crate::uri`'s RFC 3986 rather than this module's, and what is stated here is the restriction on top of it: a URL-based relative specification \"shall be limited to paths\", with \"[t]he scheme, network location/login, fragment identifier, query information, and parameter sections\" not allowed — **a security rule wearing a syntax rule's clothes**, checked by `is_valid_relative_url` rather than assumed."

[[clause]]
clause = "7.11.3"
title = "File specification dictionaries"
status = "partial"
code = ["crates/pdf-model/src/file_spec.rs", "crates/pdf-model/src/attachment.rs", "crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/file_spec.rs::the_unicode_name_is_used_instead_of_the_byte_string"]
note = "Table 43, read across three modules that each own what they point at: `file_spec.rs` reads `/FS`, `/F`, `/UF`, the three deprecated platform keys, `/ID`, `/V`, `/Desc` and the *presence* of `/EF`; `attachment.rs` reads `/EF`, `/RF` and `/AFRelationship`; `collection.rs` reads `/CI`. The requirement a first implementation inverts is honoured and tested — \"[a] PDF reader shall use the value of the UF key, when present, instead of the F key\" — and it matters because `/UF` is a *text string* by §7.9.2.2 and `/F` a byte string, so the two are not interchangeable. `partial` for two entries nothing consumes: `/Thumb`, which §12.3.4's thumbnail reader could decode for a specification but is only defined for a *page*, and `/EP`, §7.6.7's encrypted payload, which needs a cryptographic filter this tree refuses by name."

[[clause]]
clause = "7.11.4"
title = "Embedded file streams"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs", "crates/pdf-syntax/src/tree.rs", "crates/viewer-ui/src/chrome.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_embedded_file_is_read_with_its_parameters", "crates/pdf-model/src/attachment.rs::a_stated_checksum_is_answered_against_the_bytes", "crates/viewer-core/tests/headless.rs::an_embedded_file_comes_out_of_the_document", "crates/viewer-ui/tests/panel.rs::the_file_tab_names_what_is_embedded_and_says_when_nothing_is"]
note = "Embedded file streams, which are the one part of §7.11 that needs no filesystem: the bytes are inside the document. `attachment::attachments` lists what the `/EmbeddedFiles` tree names — the tree's key, Table 43's `/UF` or `/F` and `/Desc`, Table 44's `/Subtype`, and Table 45's `/Size`, dates and `/CheckSum` — and §7.11.4.2's `/RF` is read too, in `attachment::related`. **This row said `/RF` was unread for as long as it has existed and §7.11.4.2's own row said `implemented`**; the second was right. **The list reached a person in the hundred-and-sixty-seventh session** and the *bytes* in the hundred-and-sixty-ninth: `Command::Extract` names a file by its tree key, undoes §7.4's filters, and hands the file to the host to write — rule 2, the same division `Command::Save` makes. Table 45's `/CheckSum` is checked *there*, which is the only place in the program holding the decoded bytes the clause's definition is about, and a mismatch is said and not acted on because the clause calls it \"strictly a checksum, and … not used for security purposes\". 10 of the 974 corpus documents carry such a tree, 23 files between them; two of the 23 are in encrypted documents and refuse to decode, which §7.6.6 makes the stream's answer rather than the file's — and the refusal is now reported by name rather than being a list nobody could act on."

[[clause]]
