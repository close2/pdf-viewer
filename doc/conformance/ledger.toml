note = "Steps a) and b) — the base state over every group, then the array opposite to it — are implemented, and the clause calls their result the initial state used by all PDF processors. The paragraph after it is now half implemented too: \"[t]he user may manipulate optional content group states manually or by triggering set-OCG-state actions\", and since the sixty-second session §12.6.4.13's action does exactly that against a `ViewState` the file cannot see, which is what the same sentence's \"[m]anual changes shall override the states that were set automatically\" requires. Still owed: usage application dictionaries for the Print and Export events, whose changes \"persist only for the duration\" of an operation this program does not perform, and a layer panel for the manual half. See §8.11.4.4."

[[clause]]
clause = "9.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs"]
note = "The clause's own map of itself: a text object, a font, an encoding, a glyph, a position. Every subclause it names is reviewed, and the two families it separates are kept separate in code — `content.rs` owns §9.3's text state and §9.4's operators, `pdf-font` owns §9.6 and §9.7's route from a code to an outline, and neither knows the other's rules. That separation is the clause's rather than a convenience: it puts a glyph's *selection* and its *painting* on opposite sides, which is why §9.3.6's rendering modes belong to the interpreter and §9.6.5's encodings to the font."

[[clause]]
clause = "9.2"
title = "Organisation and use of fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Organisation and metrics. See §9.2.2's font dictionaries, which are clause 9's other families, and §9.2.4's two sets of metrics, both of which this tree now reads."

[[clause]]
clause = "9.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Introductory. Its division — a font is \"a graphical description of a set of glyphs\" and the font *dictionary* is what a content stream names — is the boundary between `pdf-font`, which knows programs and encodings, and `pdf-model`, which knows where a glyph goes."

[[clause]]
clause = "9.2.2"
title = "Basics of showing text"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::mode_3_paints_nothing_and_still_extracts_its_text"]
note = "The four things the clause says showing text requires — the font, the size, the position and the other text state parameters — are §9.3's Table 102 and are all read. `Tf` selects the first two and §8.4.5's Table 57 `/Font` is the other route to them (ADR 0042)."

[[clause]]
clause = "9.2.3"
title = "Achieving special graphical effects"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::mode_7_clips_what_follows_and_paints_nothing"]
note = "The two effects the clause names are both implemented and both belong to §9.3.6's rendering modes: glyphs painted with any colour or pattern the graphics state holds, and glyphs added to the clipping path so that other content shows through them. A Type 3 font, which the clause names as the third route, is §9.6.4."

[[clause]]
clause = "9.2.4"
title = "Glyph positioning and metrics"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics", "crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances"]
note = "Both writing modes, from the thirty-sixth session. Mode 0's displacement is `/Widths` or `/W`; mode 1's is §9.7.4.3's `/W2` and `/DW2`, and the clause's two constraints on the vectors are stated where they are used — `w1`'s horizontal component is 0 and `v`'s horizontal component is half the glyph's width when `/W2` does not give one. \"Glyph space\" is one thousandth of text space for every font but a Type 3, whose `/FontMatrix` says otherwise, and both routes are in `show_text`. The glyph bounding box is read by nobody, which the clause permits: §9.6.4's Table 111 says a processor may make no assumptions from a Type 3 font's, and no other clause asks for one."

[[clause]]
clause = "9.3"
title = "Text state parameters and operators"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs", "crates/pdf-model/tests/text_render_modes.rs"]
note = "Reviewed as a family in the thirteenth session. Eight of Table 102's nine text state parameters are implemented and tested one clause at a time; the ninth, text knockout, is §9.3.8, which was this tree's third `silent` row until the fourteenth session made it report. All seven of Table 103's operators are executed, and the clause's rule that they \"may appear outside text objects, and the values they set are retained across text objects in a single content stream\" falls out of their living in the graphics state rather than in the text object."

[[clause]]
clause = "9.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::zero_sized_text_neither_marks_nor_clips", "crates/pdf-model/tests/text_state.rs::a_negative_font_size_draws_and_reads_normally"]
note = "Table 103's seven operators — Tc, Tw, Tz, TL, Tf, Tr, Ts — are all executed with the initial values the table states, and they sit in the graphics state so that q/Q saves them and a page starts from the defaults. Two sentences here are load-bearing and tested: \"Zero sized text shall not mark or clip any pixels (depending on text render mode)\", which is a guard on both the marking and the clipping path rather than only the first; and the NOTE that \"Negative text font size is permitted\", which draws a flipped glyph advancing leftwards. Partial only because of Tk, whose absence is §9.3.8."

[[clause]]
clause = "9.3.2"
title = "Character spacing"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_the_character_spacing_too"]
note = "Tc is added to each glyph's horizontal displacement and is then scaled by Th, which the clause requires — it is \"specified in unscaled text space units (although it shall be subject to scaling by the Th parameter if the writing mode is horizontal)\". The vertical branch does not exist because no writing mode 1 does; see §9.2.4."

[[clause]]
clause = "9.3.3"
title = "Word spacing"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_state.rs::word_spacing_moves_the_glyph_after_a_simple_fonts_space", "crates/pdf-model/tests/text_state.rs::word_spacing_does_not_reach_a_two_byte_code_32"]
note = "Corrected by this review. The clause states the rule about the code's *encoding*, not its value — word spacing applies to \"every occurrence of the single-byte character code 32 … when using a simple font (including Type 3) or a composite font that defines code 32 as a single-byte code\" and \"shall not apply to occurrences of the byte value 32 in multiple-byte codes\" — and this tree applied it to any code numerically equal to 32, so an Identity-H string containing 00 20 was pushed right by Tw for every one. `LoadedFont::has_single_byte_codes` answers it per font, which is exact for every mapping this crate builds because each is wholly one-byte or wholly two-byte; a general CMap may mix lengths, and when embedded CMap streams land it has to become a property of the code."

[[clause]]
clause = "9.3.4"
title = "Horizontal scaling"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_the_character_spacing_too", "crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_a_tj_adjustment"]
note = "Th is a factor rather than the percentage the operator takes, and it reaches all four things the clause lists: the glyph's shape, its horizontal displacement, the spacing parameters Tc and Tw, and \"any positioning adjustments performed by the TJ operator\". The last three are the ones a plausible implementation misses, which is why each has a test."

[[clause]]
clause = "9.3.5"
title = "Leading"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::leading_moves_the_next_line_downwards"]
note = "Tl is used by exactly the four operators Table 103 names — TD, T*, ' and \" — and by nothing else. TD sets it to the negation of its second operand and T* moves by its negation, which is the sign the clause explains in Table 106: leading is \"expressed as a positive number\" and going to the next line decreases y."

[[clause]]
clause = "9.3.6"
title = "Text rendering mode"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs", "crates/pdf-model/tests/render_real_pdf.rs::a_real_documents_text_clip_reaches_what_it_paints_afterwards"]
note = "All eight of Table 104's modes, thirteenth session, ADR 0022. The three operations are independent: a fill in the non-stroking colour, a stroke in the stroking colour whose parameters are read \"in user space rather than in text space\" — so the outline is moved into user space rather than the width divided by the font size — and an accumulation of outlines that becomes one non-zero-filled clip at ET and lasts until Q. Four of the clause's own exceptions are implemented and tested rather than inferred: an accumulator holding no outlines sets no clip at all (\"If no glyphs are shown or if the only glyphs shown have no outlines … no clipping shall occur\"); modes 2 and 6 fill and stroke glyph by glyph, giving \"the appearance of stacked opaque glyphs\"; a Type 3 glyph is rendered for every mode but 3 and 7 and adds nothing to the clipping path; and modes 3 and 7 still advance Tm. A hidden optional-content layer suppresses the marking and not the clip, because §8.11.3.1 puts clipping among the graphics state operations that \"shall still be applied\". A Tr operand outside 0..7 is reported and ignored rather than silently blanking the text object."

[[clause]]
clause = "9.3.7"
title = "Text rise"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::text_rise_is_not_scaled_by_the_font_size"]
note = "Trise is the f component of the glyph-space-to-text-space matrix, so it moves the baseline in unscaled text space units — not multiplied by the font size, which is the reading that would make a superscript's height depend on the point size. It applies to the vertical coordinate regardless of writing mode, which is trivially true here because only mode 0 exists."

[[clause]]
clause = "9.3.8"
title = "Text knockout"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::text_knockout_becomes_a_group_only_where_the_two_models_differ", "crates/pdf-model/tests/text_state.rs::text_knockout_still_reports_where_a_glyph_blends", "crates/pdf-model/tests/text_state.rs::a_text_knockout_set_inside_a_text_object_is_ignored"]
note = "Was this tree's third `silent` row; `reported` from the fourteenth session; drawn since the seventy-second. Tk has no operator and arrives only as /TK in an /ExtGState, which is read — including the clause's rule that a value installed between BT and ET \"shall be ignored\". Its initial value is true, and the clause says what that means: \"the behaviour shall be equivalent to treating the entire text object as if it were a non-isolated knockout transparency group … where each glyph is an individual element in that group's transparency stack\", after which \"the group results shall be composited with the backdrop, using the Normal blend mode and alpha and soft mask values of 1.0\". So a text object becomes one `Command::Group` with `knockout` set, alpha 1, no mask and the Normal blend mode, and its glyphs keep the state they were shown under — the clause's first additional rule, that parameters are inherited and not reset, is the difference from §11.6.6's group XObject and is why nothing is initialised here. The group is built only where both of the older conditions hold — the paint composites at all, and two glyphs of the object overlap — so an ordinary page of opaque text is not wrapped in a buffer for a difference it cannot show. What still reports is the non-isolated half: a glyph that *blends* needs the group's own backdrop, which §11.4.4's NOTE 3 cancels only under Normal. 2 corpus documents drew this and both are complete now."

[[clause]]
clause = "9.4"
title = "Text objects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs", "crates/pdf-model/tests/text_render_modes.rs"]
note = "Reviewed as a family in the thirteenth session. BT and ET, all four positioning operators and all four showing operators are implemented; §9.4.4 stays partial because the vertical branch of the displacement formula has no writing mode 1 to reach it. The clause's constraints on a *writer* — that text objects shall not be nested, that the showing operators shall only appear within one, and that q…Q must nest separately from BT…ET — are recovered from rather than enforced, which is what a reader owes a malformed file."

[[clause]]
clause = "9.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::a_text_clip_survives_et_and_ends_at_q"]
note = "The three parameters the clause says \"may be specified only within a text object and shall not persist from one text object to the next\" are the `TextObject` struct, so BT resets all of them in one line and q/Q cannot save them: Tm and Tlm are fields, and Trm \"is actually just an intermediate result\" recomputed per glyph. Table 105's BT initialises both matrices to the identity. A second BT before an ET is malformed; it restarts the text object, and an ET that never arrives is reported."

[[clause]]
clause = "9.4.2"
title = "Text-positioning operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::leading_moves_the_next_line_downwards"]
note = "All four of Table 106: Td translates Tlm and copies it to Tm, TD does the same after setting the leading to the negation of ty, Tm replaces both rather than concatenating onto either, and T* is 0 -Tl TD. Tlm is tracked separately from Tm, which is what makes a run of Td or T* operators land on evenly spaced lines rather than accumulating the showing operators' advances."

[[clause]]
clause = "9.4.3"
title = "Text-showing operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_a_tj_adjustment", "crates/pdf-model/tests/text_extraction.rs"]
note = "All four of Table 107. TJ's numeric elements are subtracted in thousandths of a unit of text space and scaled by Tfs and Th; ' is T* then Tj; \" sets Tw and Tc first. The clause's \"Showing multiple glyphs with one invocation … shall produce the same results as showing them with a separate invocation for each\" holds because nothing here is per-string except the decoding into codes. A string is split into codes by the font — one byte for a simple font, two for the composite encodings this tree reads — which is §9.6.5 and §9.7 rather than this clause."

[[clause]]
clause = "9.4.4"
title = "Text space details"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/type3.rs::a_width_advances_through_the_font_matrix"]
note = "The text rendering matrix and the horizontal displacement are implemented for both kinds of font, size and horizontal scaling and rise included, with word spacing applied to a single-byte code 32. The vertical branch is not: ty is always 0, because nothing here reads a vertical writing mode (see §9.2.4)."

[[clause]]
clause = "9.5"
title = "Introduction to font data structures"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cff.rs", "crates/pdf-font/src/type1.rs"]
test = ["crates/pdf-font/src/lib.rs::a_code_for_a_character_means_that_character"]
note = "The introduction to font data structures, and the distinction it draws is the one `pdf-font` is built on: a *font dictionary* is PDF's and a *font program* is not. So Table 124's five program formats are read by `read-fonts` and by this crate's own Type 1 reader, and which reader applies is decided by the program's leading bytes rather than by the dictionary's `/Subtype` — the clause's own separation, taken literally, and the reason a `CIDFont` embedding a bare Type 1 program is read at all (ADR 0049). Every font type the clause lists exists here: Type 1, TrueType, Type 3, Type 0 and the CIDFonts under it."

[[clause]]
clause = "9.6"
title = "Simple fonts"
status = "partial"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances"]
note = "All three of the clause's properties hold: a simple font's codes are single bytes, each glyph has one horizontal set of metrics, and the descriptor is read where there is one. `LoadedFont::load` sends everything that is not Type0 or Type3 down one path and decides by the *program* the descriptor embeds rather than by `/Subtype`, which is what makes an `OpenType`-wrapped CFF in a `/Type1` dictionary work. Partial only because the bare Type 1 format of `/FontFile` is not read (reported, and no corpus page one reaches one)."

[[clause]]
clause = "9.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-font/src/cmap.rs::code_length_comes_from_the_codespace_ranges"]
note = "A simple font's codes are one byte each — `Code::single_byte`, against §9.7's variable-length codes — and there is one width per code and no writing mode 1, which is the clause's second property. The third, that a font descriptor is required except for Type 3 and certain standard Type 1 fonts, is why an absent descriptor is not an error but a substitution request."

[[clause]]
clause = "9.6.2"
title = "Type 1 fonts"
status = "implemented"
code = ["crates/pdf-font/src/cff.rs", "crates/pdf-font/src/type1.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_simple_fonts_subtype_selects_nothing", "crates/pdf-model/tests/type1.rs::a_symbolic_type1_program_draws_what_no_substitute_could"]
note = "Type 1 and MMType1 dictionaries are read and their programs drawn in both of the formats §9.9's Table 124 allows for them: the Compact Font Format of `/FontFile3 /Type1C`, and — from the thirtieth session — the original format of `/FontFile`. Both are name-keyed, which is why one encoding algorithm serves both (§9.6.5.2, `crate::name_keyed`)."

[[clause]]
clause = "9.6.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/type1.rs"]
test = ["crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances", "crates/pdf-model/tests/type1.rs::an_embedded_type1_program_puts_glyphs_on_the_page"]
note = "Table 109's entries that decide a rendered page: `/BaseFont` (as the substitution request), `/FirstChar` with `/Widths`, `/FontDescriptor`, `/Encoding` and `/ToUnicode`. `/Name` is deprecated in PDF 2.0 and read by nobody, which is what the deprecation asks for. The clause's closing paragraph — that a processor shall supply glyph widths and font descriptor data for the standard 14 when the entries are absent — is `standard_metrics.rs`. NOTE 1's observation that a CFF is a \"functionally equivalent representation of a Type 1 font program\" is load-bearing here rather than incidental: it is the argument for one encoding algorithm over two readers."

[[clause]]
clause = "9.6.2.2"
title = "Standard Type 1 fonts (standard 14 fonts) (PDF 1.0-1.7)"
status = "implemented"
code = ["crates/pdf-font/src/standard_metrics.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/standard_metrics.rs::known_widths_are_what_the_specification_says", "crates/pdf-font/src/standard_metrics.rs::the_metrics_agree_with_an_independently_drawn_metric_clone"]
note = "All fourteen names, with their published metrics compiled in, so a document that omits `/Widths` is laid out from the specification rather than from whichever face this machine happens to install. The clause asks for \"these fonts, or their font metrics and suitable substitution fonts\"; this is the second reading, and `substitute.rs` is the only machine-dependent code in the tree."

[[clause]]
clause = "9.6.2.3"
title = "Multiple master fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_simple_fonts_subtype_selects_nothing"]
note = "Nothing distinguishes an MMType1 dictionary from a Type 1 one here, and the clause is why: an embedded multiple-master instance \"shall be an ordinary Type 1 font program\", a snapshot with the design coordinates already chosen. `/Subtype` is not consulted for a simple font at all, so the entry costs no code. The BaseFont naming convention the clause describes is explicitly \"not prescribed as part of this specification\", so nothing parses design coordinates out of a name."

[[clause]]
clause = "9.6.3"
title = "TrueType fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_symbol_subtable_is_addressed_through_the_high_byte_of_its_range", "crates/pdf-font/src/lib.rs::a_unicode_subtable_is_reached_through_the_adobe_glyph_list"]
note = "Both formats the clause requires — `TrueType` and `OpenType` (ISO/IEC 14496-22) — through `skrifa`, which reads glyf and CFF outlines from an sfnt alike. The clause's own content beyond that is the three differences from Table 109, and the load-bearing one is a pointer to §9.6.5.4. `/BaseFont` is used only as a substitution request, so the two ways the clause says to derive it are the producer's problem rather than a reader's."

[[clause]]
clause = "9.6.4"
