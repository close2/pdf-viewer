[[clause]]
clause = "12.7"
title = "Forms"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/variable_text.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "The display half of the clause is built and the behaviour half is not, which is the division principle 5's exclusions draw. A field's appearance is constructed where §12.7.4.3 states how — its value, its caption, its quadding, its font — and read from `/AP` otherwise. What a field *does* is absent: no actions, no calculation order, no validation, no submission, and ECMAScript is excluded outright."

[[clause]]
clause = "12.7.1"
title = "General"
status = "inapplicable"
note = "Two definitions and a NOTE warning that an interactive form is not a form XObject. No requirement on a processor."

[[clause]]
clause = "12.7.2"
title = "Interactive Forms"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "The clause states the hierarchy — terminal and non-terminal fields, widgets as children, and the merged single-widget dictionary — and one requirement that reaches a page: 'If such an object defines an appearance stream, the appearance shall be consistent with the object's current value as a field.' That sentence is what Table 224's `/NeedAppearances` admits is false, and it is why `appearance::regenerates` sets a stored stream aside for the two field types whose text §12.7.4.3 has a processor lay out. The merged dictionary is handled by reading a widget and its field from the same dictionary, which is what `Field::read` does when the `/Parent` chain is empty. The hierarchy itself is walked upward only; `/Kids` is never followed downward, because nothing that draws needs to."

[[clause]]
clause = "12.7.3"
title = "Interactive form dictionary"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "Three of Table 224's entries reach the page and the rest do not. `/DR` is the resource dictionary of every appearance constructed here (§12.7.4.3) and of every `/DA` string's font, including a free text annotation's; `/DA` and `/Q` are read as the document-wide defaults the table calls them, after the field's own and its ancestors'; `/NeedAppearances` decides whether a stored appearance is rewritten. Not read: `/Fields`, because drawing walks `/Annots` rather than the field tree; `/SigFlags` and `/CO`, which are signature and calculation behaviour; and `/XFA`, which principle 5 excludes by name."

[[clause]]
clause = "12.7.4"
title = "Field dictionaries"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "Family head. §12.7.4.1's inheritance and §12.7.4.3's variable text are implemented; §12.7.4.2's field names are read nowhere, because nothing that draws needs a field's name."

[[clause]]
clause = "12.7.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "Table 226's inheritance is implemented and is what makes a merged widget work: `/FT`, `/Ff` and `/V` are taken from the nearest ancestor that states them, in one walk of the `/Parent` chain rather than one per key. **The clause forbids the bound that walk carries** — 'An interactive PDF processor shall not limit the range of inheritance for field dictionaries' — and it is bounded at 32 anyway, because a `/Parent` chain in a hostile file can be a cycle and principle 3's resource budgets outrank a depth no legitimate form approaches; reaching it is reported rather than read as 'no value'. Table 227's three flags are behaviour: ReadOnly and Required constrain interaction, NoExport constrains submission, and none changes a mark. `/T`, `/TU` and `/TM` are names, `/Kids` is the hierarchy walked the other way, `/AA` is a trigger, and `/DV` matters only to §12.7.6.3's reset."

[[clause]]
clause = "12.7.4.2"
title = "Field names"
status = "inapplicable"
note = "A field's partial and fully qualified names, the PERIOD that separates them, and the rule that a dictionary with no `/T` 'shall not be considered a field but simply a Widget annotation'. Names identify a field for export, scripting and the user interface, none of which decides a mark; the widget rule is honoured by construction rather than by code, since drawing reads `/FT` up the `/Parent` chain and never asks whether a dictionary is a field. The requirement that two fields with the same fully qualified name share `/FT`, `/V` and `/DV` is on the writer."

[[clause]]
clause = "12.7.4.3"
title = "Variable text"
status = "partial"
code = ["crates/pdf-model/src/variable_text.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box", "crates/pdf-model/tests/variable_text.rs::a_zero_size_is_auto_sized_until_the_value_fits", "crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "The clause's operation, both of its forms. Where there is no appearance stream one is written: Table 228's `/DA` is parsed for its `Tf`, its colour and its text state, the font is resolved in `/DR`, the value is measured and positioned by `/Q`, and the marks go inside the `/Tx BMC` … `EMC` pair the clause's EXAMPLE shows. Where there is one, the clause's closing paragraph is a *splice* rather than a rebuild — the region from `/Tx BMC` to the matching `EMC` is replaced and everything outside it survives, with `/DR`'s resources copied in behind the stream's own. A size of 0 is auto-sized and at most one `Tm` is honoured with its translation replaced. **Three things the clause hands back are choices and are recorded as such**: where a baseline sits, how far apart two lines are (13/12 of the size, which is §12.7.5.3's own EXAMPLE), and what auto-sizing picks. Not implemented: `/DS` and `/RV`, which are XFA rich text and excluded by principle 5; a composite `/DA` font, which needs a `CMap` inverted and is refused by name; and a `/DA` naming a font `/DR` does not define, which the clause requires the writer to avoid and which is reported rather than guessed at. 5 corpus documents report the last of those. ADR 0032."

[[clause]]
clause = "12.7.5"
title = "Field types"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "Family head. All four field types are recognised and each is taken to whatever §12.7.4.3 can lay out for it: a button's caption, a text field's value, a combo box's selection. A list box and a signature field are the two that state no appearance this tree can build."

[[clause]]
clause = "12.7.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "The four field types the family defines, which `FieldKind::of` reads from Table 226's `/FT` and subdivides by each type's own flags. A fifth name is not a field type and is refused rather than guessed at."

[[clause]]
clause = "12.7.5.2"
title = "Button fields"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "Family head. Bits 15, 16, 17 and 26 divide the type; three of them are read and RadiosInUnison is not, because it describes what happens when a button is clicked. What a button *shows* is its `/AP` state or Table 192's caption, and both are drawn."

[[clause]]
clause = "12.7.5.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_does_not_reach_a_button"]
note = "The three kinds of button field, separated by Table 229's Pushbutton and Radio flags. The clause's requirement that 'an interactive PDF processor shall follow the intended behaviour' is about behaviour; what it decides here is whether a value has an on state at all, which is what `FieldKind::Button`'s `toggling` carries."

[[clause]]
clause = "12.7.5.2.2"
title = "Push-buttons"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_does_not_reach_a_button"]
note = "One sentence with a rendering consequence: a push-button 'retains no permanent value' and 'shall not use the V and DV entries'. So a push-button shows Table 192's caption unconditionally rather than a value, and §12.7.4.3's regeneration does not reach it — there is no text 'not known until viewing time' to regenerate. Table 192's `/RC` and `/AC` are the rollover and down captions, which need a pointer; `/I`, `/RI`, `/IX`, `/IF` and `/TP` are an icon and its fit, and are unread."

[[clause]]
clause = "12.7.5.2.3"
title = "Check boxes"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on", "crates/pdf-model/tests/variable_text.rs::a_check_box_with_nothing_to_draw_says_so"]
note = "The clause locates a check box's appearance and settles which entry selects it, and both are implemented. Each state 'shall be defined by an appearance stream in the appearance dictionary', so `/AP` is where a box's tick comes from and §12.7.4.3's regeneration is not applied to one. Of `/V` and `/AS` the clause is explicit: 'If they are not equal, then the value of the AS key shall be used instead of the V key' — `annotation::normal_appearance` reads `/AS` and never `/V`, which is that rule and was already right before it was read. A box with no `/AP` shows Table 192's caption if it has one and is reported if it does not, because a document saying a box is on while stating no mark for it is worth naming. Not implemented: Table 230's `/Opt`, whose purpose is export values and non-Latin on-state names, and which changes no mark this tree makes."

[[clause]]
clause = "12.7.5.2.4"
title = "Radio buttons"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "A radio button and a check box differ nowhere in what is drawn: both have two states, both take the on state's appearance from `/AP` by `/AS`, both may carry Table 192's caption, and this clause repeats §12.7.5.2.3's `/AS`-over-`/V` sentence verbatim. What is specific to a radio button is all behaviour — NoToggleToOff, the mutual exclusion, RadiosInUnison — and none of it reaches a page. `Off` as the default value is honoured by treating any state but `Off` as on."

[[clause]]
clause = "12.7.5.3"
title = "Text fields"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/variable_text.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_multiline_value_wraps_into_lines_that_run_down_the_box", "crates/pdf-model/tests/variable_text.rs::a_comb_field_spreads_one_character_per_cell", "crates/pdf-model/tests/variable_text.rs::a_password_field_does_not_echo_its_value"]
note = "The clause's own sentence is the implementation: the value 'shall be used to construct an appearance stream for displaying the field, as described under 12.7.4.3' and 'shall be presented in a single style'. Three of Table 231's flags change the layout and all three are read — Multiline wraps, Comb divides the box into Table 232's `/MaxLen` cells and puts one character in each, Password echoes bullets instead of the value. This clause's own EXAMPLE is where the line spacing this tree uses comes from: two lines at `/Ti 12 Tf` set `0 -13 Td` apart. Not read: DoNotScroll and DoNotSpellCheck, which constrain typing; FileSelect, which makes the value a pathname to submit; and RichText, which is XFA and excluded — a `RichText` field's `/V` is laid out as plain text, which the clause's own conventions paragraph says is not what `/RV` describes."

[[clause]]
clause = "12.7.5.4"
title = "Choice fields"
status = "reported"
code = ["crates/pdf-model/src/appearance.rs"]
note = "Half the clause draws and half is refused. A combo box shows its value, which the clause makes a text string — or the first of an array where several are selected — and that goes through §12.7.4.3 like a text field's. A **list box** does not: the clause says which items are selected and states nothing about how a selection *looks*, no highlight colour and no rule, so it is refused and named rather than drawn as unmarked text. Table 234's `/Opt`, `/TI` and `/I` are read nowhere for the same reason — they order and index a list nothing draws. No corpus document reaches either path with no appearance stream, so the refusal is currently a statement about the clause rather than about any page."

[[clause]]
clause = "12.7.5.5"
title = "Signature fields"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "A signature field is drawn from its `/AP` and from nothing else, which is what the clause describes: its value is a signature dictionary rather than text, and signing 'entails updating at least the V entry and usually also the AP entry'. So §12.7.4.3's regeneration does not reach one and a signature field with no appearance stream states nothing to draw. The clause's two visibility rules are already satisfied elsewhere: a zero-size annotation rectangle draws nothing (`annotation::decide`), and Table 167's Hidden and NoView bits are honoured there too. Table 235's `/Lock` and `/SV` are signing behaviour, and validating a signature is §12.8's."

