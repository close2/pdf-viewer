note = "The reader's obligations are implemented: try the default user password first, accept either password, and preprocess a revision 6 password with SASLprep before converting to UTF-8 and truncating to 127 bytes. What is not is the sentence that follows the permissions list — \"PDF readers shall respect the intent of the document creator by restricting user access\" — which is an obligation on copying, printing and editing rather than on drawing; `Document::permissions` carries Table 22's flags up to an application that has none of those operations yet. The clause's own preceding sentence says why this is a requirement about the application and not about this crate: \"There is nothing inherent in PDF encryption that enforces the document permissions.\""

