[[clause]]
clause = "7.6.6"
title = "Crypt filters"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::an_identity_stream_filter_leaves_streams_alone", "crates/pdf-syntax/tests/encryption.rs::a_document_whose_attachment_alone_is_encrypted_still_opens"]
note = "Table 25's V2, AESV2 and AESV3 and Table 26's Identity are implemented, /CF, /StmF and /StrF are read with Identity as the stated default, and a stream's own /Crypt filter overrides /StmF through its /DecodeParms /Name. /CFM /None is refused by name, because it \"allows the security handler to do its own decryption\" and there is no such handler here. The clause's binding of a failed authorization to the *data* rather than to the file is implemented and is the reason `encrypted-attachment.pdf` and `auth-event-ef-open.pdf` display: both write /StmF /Identity /StrF /Identity with a StdCF reached only through /EFF, and neither authenticates against any known password. `partial` because the /EFF path itself is unexercised — no embedded file's bytes are ever read — and because /AuthEvent is read only far enough to know it does not gate the body."

[[clause]]
clause = "7.6.7"
title = "Unencrypted wrapper document"
status = "writer-side"
note = "Every normative sentence here addresses a producer: the wrapper \"shall include a Collection dictionary\", \"shall include the file specification dictionary … in the EmbeddedFiles name tree\", \"shall include the AFRelationship key\". The one sentence about readers is descriptive and describes what this viewer already does — \"PDF processors without the custom security handler will present the unencrypted wrapper document with helpful instructions to the user\" — because a wrapper is an ordinary unencrypted PDF and draws as one. Presenting the payload instead would need §12.3.5 collections and a handler for whatever /EP names, and is that clause's work rather than this one's."

