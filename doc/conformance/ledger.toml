note = "One step, and it is §7.6.4.3.3 step (e)'s validation half."

[[clause]]
clause = "7.6.4.4.11"
title = "Algorithm 12: Authenticating the owner password (Security handlers of revision 6)"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::an_empty_password_may_be_the_owner_password"]
note = "One step, and it is §7.6.4.3.3 step (c). `pr6531_2.pdf` is opened by it: the empty password is that file's owner password, which is what `Permissions::owner` reports."

[[clause]]
clause = "7.6.4.4.12"
title = "Algorithm 13: Validating the permissions (Security handlers of revision 6)"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/src/crypt.rs::a_perms_block_yields_the_permissions_algorithm_10_stored"]
note = "Decrypts the 16-byte /Perms block with AES-256 over a single block, checks the \"adb\" marker, and takes the permissions and the metadata flag from it. The clause says they \"should match\" /P and §7.6.4.3.3 step (f) says they \"shall\"; where they disagree this tree follows the encrypted copy, because step (f) says the decrypted bytes *are* the user permissions and the encrypted copy is the one a file cannot be edited to change."

[[clause]]
clause = "7.6.5"
title = "Public-key security handlers"
status = "reported"
code = ["crates/pdf-syntax/src/crypt.rs"]
note = "Not implemented, and named at runtime: a /Filter that is not /Standard produces `SyntaxError::UnsupportedEncryption` quoting the name. What it would take is not a cipher but a public-key infrastructure — CMS enveloped data (RFC 5652) and X.509 certificates, plus access to the user's private keys — which is a dependency and a threat model of its own. No corpus document uses one."

[[clause]]
clause = "7.6.5.1"
