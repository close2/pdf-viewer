note = "The catalog's `/Requirements`: a document naming \"feature(s) of PDF beyond those commonly expected … required for correct handling\". Read in full — Table 273's `/S`, `/V` and `/Penalty`, Table 275's twenty-four types, Table 276's handlers — and `requirements::unmet` names each one this program cannot meet with the reason. What is `partial` is the *acting* on it: §12.11.6 says processing \"shall not continue\" when the requirements cannot be met, and this program draws the document and says what it could not promise. See §12.11.6 for why. **0 of the 974 corpus documents state one.**"


[[clause]]
clause = "12.11.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "Table 273's common entries, with the defaults the clause states: `/Penalty` is 100 unless the file says otherwise, and an absent `/V` means the requirement is judged \"without regard to version number\". A dictionary with no `/S` states no requirement and is dropped, since the entry is required and is the whole content of the statement. Table 274's `/Encrypt` and `/DigSig` are the two type-specific entries; neither is read, because the requirements they belong to are ones this program declares unmet by type alone."


