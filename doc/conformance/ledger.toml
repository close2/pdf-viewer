note = "\"Conversion from a CIE-based source colour to a CIE-based destination colour shall be performed based on ISO 15076-1:2010 (ICC.1:2010)\", which is the A2B evaluator in `icc.rs`. The clause puts *establishing* the destination \"beyond the scope of this document\" and names output intents (§14.11.5) as one way — implemented — and its NOTE lists \"assumptions made by the PDF processor software\" as another, which is what `CMYK_CORNERS` is and where it is licensed from."

[[clause]]
clause = "10.3.2"
title = "Establishing CIE-based colour space definitions"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
