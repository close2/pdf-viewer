[[clause]]
clause = "11.6.4.2"
title = "Object shape and opacity"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "Every clause of the list holds here. A path or a glyph has shape 1 inside and 0 outside, which is what filling an outline does; an image has shape 1 inside its rectangle \"further modified by an explicit or colour key mask\", which became true in the fourteenth session (§8.9.6.3, §8.9.6.4); an image mask has shape 1 where it paints; a pattern's shape is constrained by the objects that define it, which falls out of replaying a tiling pattern's content stream. The last one is worth naming because it is satisfied by *absence*: the shape of an `sh` is its geometry \"disregarding the Background entry in the shading dictionary\", and nothing in this tree reads /Background at all. The intrinsic opacity of 1.0 everywhere is likewise structural — opacity enters only through `ca`, `CA` and a mask."

[[clause]]
clause = "11.6.4.3"
title = "Mask shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_soft_mask_overrides_an_explicit_mask"]
note = "The clause's precedence is implemented as of the fourteenth session, and it was read here rather than in §8.9: an image's /SMask, and a non-zero /SMaskInData, \"shall override any explicit or colour key mask specified by the image dictionary's Mask entry\". Before that a file writing both would have had the loser applied. The graphics state's own /SMask is reported rather than applied (28 corpus documents) and /None is the only value that needs nothing. What is not read is /AIS: its default of false is what this renderer assumes, and a document setting it true asks for the constant and the mask to be *shape* rather than opacity values, which §11.3.7.2 distinguishes only in how a transparency group accumulates them — so it cannot show until §11.4.6 exists. No corpus document writes it."

[[clause]]
clause = "11.6.4.4"
title = "Constant shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::the_two_alpha_constants_reach_stroking_and_non_stroking_paint_separately", "crates/pdf-model/tests/transparency.rs::an_object_drawn_without_a_constant_is_opaque"]
note = "`ca` and `CA` are two scalars in the graphics state, applied to non-stroking and stroking paint respectively, which is the clause, and which no test isolates — they reach the page through the corpus and the oracle. Two sentences are not: \"The nonstroking alpha constant shall also be applied when painting a transparency group's results onto its backdrop\", which needs groups (§11.4.6), and the /AIS flag, which decides whether the constants are shape or opacity — see §11.6.4.3 for why that cannot show here yet."

[[clause]]
clause = "11.6.5"
title = "Specifying soft masks"
status = "implemented"
