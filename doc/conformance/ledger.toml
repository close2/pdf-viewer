[[clause]]
clause = "11.4"
title = "Transparency groups"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Aggregate of the eight below, read as a family in the seventeenth session with transparency groups as the demand item. A group's elements are composited onto a transparent backdrop and the result painted once under the constant alpha and blend mode in force at Do — §11.4.5's isolated, non-knockout group, which is what both backends express natively. §11.4.7's page group is implemented and was the session's largest finding. Knockout (§11.4.6) is reported, and so is a non-isolated group whose elements blend, which is the only case where §11.4.4's backdrop removal does not cancel."

[[clause]]
clause = "11.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "A group is \"collected together and composited to produce a single colour, shape, and opacity at each point\" and the result treated as one object, which is what Command::Group asks a backend for. Of the four further attributes this clause lists three are here — the compositing inputs applied to the group as a whole, isolation, knockout — and the fourth is §11.5's: a group's result used as a source of shape or opacity for a soft mask, still reported rather than built."

[[clause]]
clause = "11.4.2"
title = "Notation for group compositing computations"
status = "inapplicable"
note = "Notation, and Table 138's renaming of §11.3's variables so that §11.4.4 can state its recurrences. There is no requirement to implement; marking it implemented would claim code for a clause that asks for none, which is the reading §11.6.1 already has."

[[clause]]
clause = "11.4.3"
title = "Group structure and nomenclature"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "The three backdrops this clause distinguishes. The group backdrop is what is already on the page; the initial backdrop is transparent here, which is the isolated choice (§11.4.5); the immediate backdrop is what a group's own buffer accumulates, and is right because the elements are drawn into that buffer in order. Its last requirement — \"A PDF processor shall ensure that the backdrop's contribution to the overall result is applied only once\" — holds by construction, since a transparent initial backdrop has no contribution to remove. What is absent is the non-isolated reading of the same sentence; see §11.4.4."

[[clause]]
clause = "11.4.4"
title = "Group compositing computations"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_non_isolated_group_reports_only_when_an_element_blends"]
note = "The recurrence for a non-isolated, non-knockout group, and NOTE 3's backdrop removal at the end of it. With every element blending Normal the removal is exact and the backdrop cancels, so the isolated computation both backends perform is this one — §11.6.7's NOTE 1 states that equivalence for the same formulas applied to a pattern cell. What is not implemented is a non-isolated group holding an element with another blend mode, where NOTE 2 makes the backdrop the whole point; that is reported, on 9 corpus documents. Table 140's separate group shape and group alpha are not maintained either: this renderer holds one alpha per pixel, which is §11.3.7.3's row."

[[clause]]
clause = "11.4.5"
title = "Isolated groups"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "\"α0 = 0.0 if the group is isolated\" — a transparent buffer, which is what a tiny-skia pixmap and a Vello layer both start as. The consequence the clause spends its length on follows from it: an element's blend mode inside the group sees only what the group itself painted. Its closing sentence, about which rendering intent converts the group's colours into the backdrop's space, has nothing to convert here — there is one blending space, device RGB, and a group asking for another is reported (§11.6.6)."

[[clause]]
clause = "11.4.6"
title = "Knockout groups"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_knockout_group_reports_only_where_the_two_models_differ"]
note = "Was this tree's first `silent` row, from the ninth session; reported since the seventeenth, and still owed. A knockout group's elements are composited with the group's initial backdrop rather than with each other, so at any point the topmost object wins. This renderer composites them with each other. The report fires where the two models can differ — an element that composites overlapping one painted before it — which is 6 corpus documents rather than the 8 that write /K true. The reading is written down because it is the load-bearing part of the implementation nobody has written yet: for an isolated knockout group the initial backdrop is transparent, so §11.3.6's formula leaves each element its own colour and its blend mode has no effect at all, and the clause's two-stage average by source shape is then a Porter-Duff Source composite modulated by coverage. A non-isolated knockout group needs the group's backdrop, which is the same thing §11.4.4 lacks. knockout_*.pdf are the corpus's cases and sat in oracle.rs's CONTRADICTED_UNEXPLAINED until the report moved them out of the comparison."

[[clause]]
clause = "11.4.7"
title = "Page group"
status = "partial"
code = ["crates/pdf-render/src/backend.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::vello_hands_back_straight_alpha"]
note = "The seventeenth session's largest finding, and it was invisible until a group made it visible. Everything painted on a page belongs to a page group that \"shall be treated as an isolated group, whose results shall then be composited with a backdrop colour appropriate for the medium\" — so the page's own initial backdrop is transparent, and the medium's white is applied to the finished page. Both backends filled the raster with white and drew over it, which is a different picture for every blend mode: an object blending against an unpainted part of the page saw white where the standard says it sees nothing. transparency_group.pdf draws a Difference ellipse that four reference renderers show crimson over white, and this tree showed as its inverse. `impose_on_medium` in pdf-render is the composite, called by both backends so neither can differ about it. What is not implemented is the clause's second case, a page used as an element of another document's page through a reference XObject (§8.10.4), which needs importing before the page group's attributes can matter."

[[clause]]
clause = "11.4.8"
title = "Summary of group compositing computations"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "A restatement of §11.4.4's formulas with the subscript b that selects the backdrop — 0 in a knockout group, i-1 otherwise — and with isolation folded in. Its own NOTE says the formulas \"can be significantly simplified when some sources of shape and opacity are not present\" and that each kind of group cancels some of the terms; the isolated, non-knockout case is the one this tree evaluates, as a source-over composite of the group's buffer. The status follows §11.4.4's and §11.4.6's rather than adding anything: this clause introduces no requirement they do not."

[[clause]]
clause = "11.5"
title = "Soft masks"
status = "implemented"
code = ["crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs", "crates/pdf-render/src/soft_mask.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs", "crates/render-cpu/tests/soft_mask.rs", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_soft_mask"]
note = "Aggregate of the three below, and the eighteenth session's demand item. A soft mask is a transparency group evaluated for its opacity: `pdf-model` runs the group into a command list of its own, both backends rasterise it at device resolution, and `pdf_render::SoftMask::value` — one function, called by both — turns the pixels into mask values. Was `reported` on 28 corpus documents until §11.4's groups made it buildable. ADR 0027."

[[clause]]
clause = "11.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-render/src/soft_mask.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/render-cpu/tests/soft_mask.rs::a_constant_mask_interpolates_between_the_object_and_the_backdrop"]
note = "Introduces the mask shape and mask opacity a soft mask supplies. Its NOTE 2's soft clip is what the CPU backend literally builds — the mask becomes a `tiny_skia::Mask` multiplied into the clip mask, which is the NOTE's \"generalization of the hard clip\" as arithmetic. Shape and opacity are one alpha here (§11.3.7.1's `a = f x q`), so `/AIS` is immaterial and deliberately not read; see §11.6.4.3."

[[clause]]
clause = "11.5.2"
title = "Deriving a soft mask from group alpha"
status = "implemented"
code = ["crates/pdf-render/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs::an_alpha_mask_reads_the_groups_alpha_and_ignores_its_colour", "crates/pdf-render/src/soft_mask.rs::an_alpha_mask_reads_the_alpha_and_ignores_the_colour"]
note = "The group is drawn onto a fully transparent surface and its alpha channel taken, which is the clause's backdrop \"whose value does not contribute to the eventual result\" factored out by construction rather than by subtraction. Its NOTE 2 — the shape and alpha of an empty group is 0.0 — falls out of the same surface. `smask_alpha_bc.pdf`, `smask_alpha_oob.pdf` and `smask_alpha_oob_transfer.pdf` are the corpus's cases and all three now draw."

[[clause]]
clause = "11.5.3"
title = "Deriving a soft mask from group luminosity"
status = "partial"
code = ["crates/pdf-render/src/soft_mask.rs", "crates/pdf-model/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs::a_luminosity_mask_takes_the_groups_grey_and_the_backdrops_outside_it", "crates/pdf-render/src/soft_mask.rs::a_luminosity_mask_uses_the_clauses_own_coefficients"]
note = "The group is composited onto the opaque `/BC` backdrop and the luminosity of the result taken, by the clause's device branch: \"convert the colour to DeviceGray by implementation-defined means\", the means being EXAMPLE 2's Y = 0.30 R + 0.59 G + 0.11 B. Those coefficients and not a library's: `tiny_skia::MaskType::Luminance` is Rec. 709 and Vello's luminance mask is the SVG formula, and both are a fifth of the mask's range away on green. What is not done is the clause's *other* branch — a CIE-based group space converted to XYZ and its Y taken — because every colour here is converted to device RGB one at a time long before a mask is composited; that is §11.6.6's departure seen from this clause, and it is exact for the grey spaces (0.30 + 0.59 + 0.11 = 1) and reported for the rest. \"G may be any kind of group - isolated or not, knockout or not\" is honoured by reporting §11.4's two structural departures for a mask group exactly as for a painted one."

