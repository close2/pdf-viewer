note = "The base encodings, /Differences over them, and the symbolic/nonsymbolic distinction the clause turns on. MacExpertEncoding is the one named encoding absent: a font naming it is refused and reported rather than substituted. Every code the /Differences array names is kept even where the name is one no encoding defines, which is what §9.6.5.4's undefined-entry sentence does and does not say."

[[clause]]
clause = "9.6.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/encoding.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/encoding.rs::the_assignments_made_only_in_the_notes_are_present", "crates/pdf-font/src/lib.rs::differences_without_a_base_encoding_layer_over_the_programs_own", "crates/pdf-font/src/lib.rs::a_named_base_encoding_still_wins"]
note = "Table 112's encoding dictionary in full, and Annex D's tables for StandardEncoding, WinAnsiEncoding and MacRomanEncoding, extracted from the standard's own Table D.2 rather than written from memory. The thirtieth session found the *default* base encoding was being taken from the wrong sentence: Table 112 gives it three cases and the first is \"for a font program that is embedded in the PDF file, the default base encoding shall be the font program's built-in encoding\", with the Symbolic flag deciding only among the other two. A name-keyed embedded program was getting StandardEncoding whenever its descriptor was nonsymbolic. MacExpertEncoding is the one named encoding absent: a font naming it is refused and reported rather than substituted."

[[clause]]
clause = "9.6.5.2"
title = "Encodings for Type 1 fonts"
status = "partial"
code = ["crates/pdf-font/src/cff.rs", "crates/pdf-font/src/type1.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::an_uncovered_code_has_no_glyph_rather_than_a_guessed_one", "crates/pdf-font/src/lib.rs::a_font_with_no_encoding_entry_is_its_own", "crates/pdf-model/tests/type1.rs::a_symbolic_type1_program_draws_what_no_substitute_could"]
note = "Implemented for both Type 1 program formats, which since the thirtieth session is both of the ones Table 124 defines. The encoding's names are resolved through the program's charset, the font dictionary's `/Encoding` overrides the program's built-in one, and — the clause's second paragraph — a `/Differences` name is looked up in the charset whether or not any encoding references it. The clause's own sentence about the built-in encoding being \"an 'encoding' array that is part of the font program\" is read from the program in both formats. What is left is the closing sentence: .notdef \"shall be substituted\" when an encoding names a glyph the program lacks, and such a code reaches no glyph here — the same picture wherever .notdef is empty, a blank rather than a box where it is not, and it keeps `no character code maps to a glyph` able to fire. No corpus document distinguishes the two."

[[clause]]
clause = "9.6.5.3"
title = "Encodings for Type 3 fonts"
status = "implemented"
code = ["crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-model/tests/type3.rs::each_shown_code_runs_its_glyph_description", "crates/pdf-model/tests/type3.rs::a_code_with_no_glyph_description_paints_nothing_and_still_advances"]
note = "The mapping is taken entirely from the font's /Encoding, and there is no default glyph name — a code the encoding does not name reaches nothing, as the clause's NOTE requires. /BaseEncoding is read underneath /Differences because Table 112 defines it for any encoding dictionary; there is no built-in encoding to fall back on, since §9.6.5.1 excepts Type 3 fonts from having one."

[[clause]]
clause = "9.6.5.4"
title = "Encodings for TrueType fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_symbol_subtable_is_addressed_through_the_high_byte_of_its_range", "crates/pdf-font/src/lib.rs::a_unicode_subtable_is_reached_through_the_adobe_glyph_list", "crates/pdf-font/src/lib.rs::a_suffixed_glyph_name_reaches_the_program_rather_than_its_base_letter"]
note = "All five routes from a code to a glyph, implemented in the eighth session — see ADR 0015. The predecessor was one line that covered about one and a half of them and was worth 15 contradicted corpus pages. **The last of the five was reached by nothing until the forty-second session**, and both halves of the reason are worth keeping. The clause maps a glyph name to Unicode \"by consulting the Adobe Glyph List and Adobe Glyph List for New Fonts\", which are *lists*, and no entry in either contains a FULL STOP — but `read_fonts` implements the wider Adobe Glyph List *Specification*, whose algorithm for an unlisted name strips everything after the first period, so `o.sc` answered `o` and hid the clause's next sentence behind a real letter. And that next sentence names \"the font program's `post` table (if one is present)\", which a CFF-based OpenType does not have in any useful sense: `issue215.pdf`'s `OTTO` carries a version 3.0 `post`, which by definition holds no names, and names every glyph in its `CFF ` charset instead — the same structure by another name, §9.6.2.1's NOTE 1 again. With both read, the page draws the small capitals its own `/ToUnicode` says it means (ADR 0050)."

[[clause]]
clause = "9.7"
title = "Composite fonts"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::the_cid_widths_agree_with_the_font_programs_own_advances"]
note = "Aggregate of the seventeen rows below, reviewed as a family in the twentieth session (ADR 0029). A Type 0 font is two independent mappings and both are now read: §9.7.6.2's CMap from codes to CIDs, embedded (§9.7.5.3) or Identity, and §9.7.4.2's CID to glyph index, through a CID-keyed CFF's charset or a /CIDToGIDMap stream. What is left is data rather than code — Table 116's seventy-odd predefined CMaps, refused by name on 15 corpus fonts — and vertical writing, which is §9.2.4's missing /W2 metrics rather than this clause's."

[[clause]]
clause = "9.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_utf8_shaped_codespace_yields_codes_of_several_lengths"]
note = "The clause's one requirement of a processor is the sentence that separates a composite font from a simple one: \"for composite fonts, a sequence of one or more bytes are decoded to select a glyph from the descendant CIDFont\". `LoadedFont::decode` returns a `Code` carrying its own byte length for exactly that reason, and the one-descendant limitation the clause states is why only `/DescendantFonts`' first element is read."

[[clause]]
clause = "9.7.2"
title = "CID-Keyed fonts overview"
status = "inapplicable"
note = "Architecture rather than requirement: it introduces CIDs, character collections and the CMap/CIDFont split, and every normative sentence it contains is restated with effect in §9.7.3 to §9.7.6. Its one processor-facing statement — that a CMap's mapping \"yields a font number (which in PDF shall be 0)\" — is §9.7.6.2's, and is honoured there by reading only the first descendant."

[[clause]]
clause = "9.7.3"
title = "CIDSystemInfo dictionaries"
status = "inapplicable"
note = "`/CIDSystemInfo` identifies the character collection a CMap and a CIDFont share, and the clause's requirements are on the *file*: \"In order for a CIDFont and a CMap to be compatible, their Registry and Ordering values shall be the same.\" A renderer that takes both from the same file has nothing to decide — the CIDs it resolves come from that file's own CMap and are looked up in that file's own CIDFont, so a mismatch cannot change which glyph is drawn. It would matter for a *predefined* CMap, where the collection is external; that is §9.7.5.2's gap, and this row will need revisiting with it."

[[clause]]
clause = "9.7.4"
title = "CIDFonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Table 115's `CIDFont` in full for what it decides about a drawn page: both subtypes, both glyph-selection routes (§9.7.4.2), and both sets of metrics (§9.7.4.3). `/CIDSystemInfo` is read only to the extent §9.7.5.2's compatibility rule needs, since an embedded program's own charset is what actually selects the glyph."

[[clause]]
clause = "9.7.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::the_cid_widths_agree_with_the_font_programs_own_advances"]
note = "Table 115. `/Subtype`, `/CIDSystemInfo`, `/FontDescriptor`, `/DW`, `/W` and `/CIDToGIDMap` are read; `/DW2` and `/W2` are not, and a font whose CMap asks for vertical writing is refused before they would be needed. The clause's prohibitions are on the file rather than on a reader — a CIDFont \"may not be used as the operand of the Tf operator\" — and are satisfied by construction, because nothing reaches a descendant except through its Type 0 parent."

[[clause]]
clause = "9.7.4.2"
title = "Glyph selection in CIDFonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::the_cid_widths_agree_with_the_font_programs_own_advances"]
note = "All four routes, in the twentieth session (ADR 0029). A CID-keyed CFF goes through its charset; a CFF whose Top DICT has no CIDFont operators, and a TrueType with `/CIDToGIDMap /Identity` or none, take the CID as the glyph index; a `/CIDToGIDMap` stream is read as Table 115's two big-endian bytes at 2c. Two findings. The route is chosen by what the *program* is, not by `/Subtype`, because a CIDFontType0 may arrive as a CFF inside an OpenType wrapper. And an explicit `/CIDToGIDMap` stream outranks \"the CIDs shall be used directly as GID values\": Table 115 conditions the entry's presence on Type 2 and defines its meaning unconditionally, and `issue7901.pdf` — a CIDFontType0 wrapping a name-keyed CFF and carrying such a stream — drew garbage under the other reading where four renderers draw its sentence. The clause's own rule for a non-embedded program is honoured too: the entry \"shall be ignored\", and a substituted font reaches glyphs through `/ToUnicode` instead."

[[clause]]
clause = "9.7.4.3"
title = "Glyph metrics in CIDFonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Both arrays and both defaults. `/W` and `/DW` in the twentieth session, `/W2` and `/DW2` in the thirty-sixth — the same two formats one field wider, with Table 122's default `/DW2` of `[880 -1000]` and the clause's rule that `v`'s horizontal component is half the glyph's width. \"Specifying a given CID value more than once should not be done. In the case where it is done, the first specification is the one that shall be used\" holds for both, by `or_insert`."

[[clause]]
clause = "9.7.5"
title = "CMaps"
status = "partial"
code = ["crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_one_byte_codespace_range_makes_one_byte_one_code"]
note = "Aggregate of the four below. An embedded CMap file is read in full; the two Identity CMaps are built; the other predefined names are refused because their data is not in the tree."

[[clause]]
clause = "9.7.5.1"
title = "General"
status = "partial"
