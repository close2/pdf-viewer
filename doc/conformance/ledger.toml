[[clause]]
clause = "10.7"
title = "Scan conversion details"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs", "crates/pdf-render/src/paint.rs"]
note = "Reviewed in the sixteenth session, as the family ADR 0025's image resampling lives in — and nothing in this tree had cited §10.7 before that. The subclauses below split three ways: two parameters the clause lets a processor ignore and which are ignored (§10.7.2, §10.7.3), one set of rules this renderer deliberately departs from in three places because it draws to a display rather than to a marking device (§10.7.4), and one requirement that is neither implemented nor reported (§10.7.5). §10.7.1 is what licenses the departures and is quoted where they are taken."

[[clause]]
clause = "10.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-render/src/paint.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_basic_scene"]
note = "The one requirement is that scan conversion happens — \"the final step of rendering shall be scan conversion\" — and both backends are that step. The clause's substance for this project is its NOTE, which says the algorithm is not part of PDF: \"Different implementations can perform scan conversion in different ways; techniques that are appropriate for one device could be inappropriate for another.\" That sentence is what makes §10.7.4's departures choices rather than defects, and it is quoted in `Image::area_averaged` beside the rule it licenses departing from. Read it before concluding that any §10.7.4 rule is binding on a screen."

[[clause]]
clause = "10.7.2"
title = "Flatness tolerance"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "The normative content is a permission, and it is exercised: \"PDF processors may choose to ignore any flatness tolerance specified within a PDF file.\" The `i` operator is matched and discarded with `MP`, `DP`, `BX` and `EX`, and `/FL` in an `/ExtGState` is not read; no corpus document writes `/FL` in one at all. `tiny-skia` and Vello each flatten curves to their own tolerance, which the clause's NOTE 2 anticipates by warning that a large value makes the result \"unpredictable\" — so honouring a document's number could only ever make a curve worse. Nothing is owed and nothing is silent, because the clause itself grants the omission."

[[clause]]
clause = "10.7.3"
title = "Smoothness tolerance"
status = "implemented"
code = ["crates/pdf-render/src/shading.rs", "crates/pdf-model/src/content.rs", "crates/pdf-model/src/mesh.rs"]
test = ["crates/pdf-render/src/shading.rs::a_smoothness_tolerance_only_ever_asks_for_more_samples", "crates/pdf-render/src/shading.rs::a_finer_tolerance_reaches_the_stops_only_where_there_is_detail_to_find", "crates/pdf-render/src/shading.rs::a_triangle_inside_one_pixel_is_subpixel"]
note = "Table 57's `/SM` is read into the graphics state and decides how finely a shading's colour function is sampled — `Ramp::resolution_for`, since the seventy-fourth session. What the clause asks for is a bound on \"the allowable colour error between a shading approximated by piecewise linear interpolation and the true value\", and it moves the sampling in one direction only, which is the clause's own two sentences rather than a convenience: a tolerance is a *maximum* error, so a request coarser than this device's 1/256 is met by drawing finer, and \"each output device may have internal limits on the maximum and minimum tolerances attainable\" is what permits keeping ours rather than coarsening on request. A finer request is honoured up to 4096 samples, which is the internal limit the same sentence contemplates; 5 corpus documents state 0.002 and had been getting 1/256 in silence. A value outside 0..1 is not a fraction and is ignored, which one corpus document (`/SM 6`) needs. Note what a finer sampling does and does not buy, because it is not obvious: ADR 0068 drops every stop within half an eight-bit level of the line its neighbours draw, so extra samples of a *smooth* function are discarded again — the tolerance recovers detail narrower than 1/256 of the domain, which is a type 0 function with thousands of samples or a stitching function with narrow sub-domains. Meshes are the other half and need nothing: `MeshRaster` evaluates Gouraud interpolation per device pixel (ADR 0051), so there is no piecewise approximation left to bound, and `Triangle::is_subpixel` bounds the geometry rather than the colour."

[[clause]]
clause = "10.7.4"
title = "Scan conversion rules"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/pdf-render/src/paint.rs::a_block_of_samples_becomes_their_mean", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_deeply_reduced_image"]
note = "Three deliberate departures, all in one direction, and the sixteenth session is the first time any of them was written down. (1) \"A shape shall be scan-converted by painting any pixel whose half-open square region intersects the shape, no matter how small the intersection is\" — both backends anti-alias instead, so a partly covered pixel is partly painted. This has been true since the first commit and cited nothing. **It has a corpus witness as of the sixty-eighth session**: `colors.pdf` pages 1 and 2 are grids of flat swatches whose interiors every renderer agrees about to the byte, and whose boundaries put the five on a spectrum of edge softness — `poppler` hardest, then `ghostscript`, then `mupdf` and `hayro`, then us. The pair the oracle votes with is the pair nearest the clause, so the two pages are contradicted by the departure itself and are listed under it rather than chased. (2) The same rule's \"the area covered by painted pixels shall always be at least as large as the area of the original shape\" fails for the same reason. (3) \"There shall not be averaging over the pixel area\" — `Image::area_averaged` averages, which is ADR 0025 and what made `bug1001080.pdf` legible and `firefox_logo.pdf` and `french_diacritics.pdf` agree with the reference consensus. All three are licensed by §10.7.1's NOTE that the algorithm is not defined by PDF, and all three describe a device that quantises coverage to whole pixels, which a display does not. What *is* honoured: pixel boundaries on integers, half-open regions, a zero-width stroke drawn as the thinnest line the device can produce (the clause's own permission), and glyphs scan-converted by the font rasteriser's own algorithm, which the clause's last sentence allows. **One further choice the clause does not reach, recorded because it was a defect until the sixty-first session**: where a page whose size is not a whole number of pixels puts its spare fraction. `TargetSpec::for_page` rounds the raster *up* so it contains the page, and anchors the flip to the page's own top edge, so the spare fraction is at the bottom — where the x axis already puts its own, because nothing flips x. Anchoring it to the raster's last row instead put every mark on such a page a fraction of a row too low, which was 11 of the corpus's 76 contradicted pages (ADR 0064). How many pixels a fractional page *gets* is a separate question the standard also leaves open, and the four renderers here answer it two ways."

[[clause]]
clause = "10.7.5"
title = "Automatic stroke adjustment"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/render-cpu/tests/stroke_width.rs::stroke_adjustment_promotes_only_a_sub_half_pixel_line", "crates/pdf-model/tests/colour_paths.rs::stroke_adjustment_is_read_and_restored", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_thinnest_line_the_device_draws"]
note = "The clause has two requirements and the nineteenth session implemented the one a display can state exactly: \"If stroke adjustment is enabled and the requested line width, transformed into device space, is less than half a pixel, the stroke shall be rendered as a single-pixel line.\" `/SA` is read from Table 58 and carried on the `Stroke`, and `Stroke::device_width` makes such a stroke one device pixel — the same width the clause's NOTE says a zero width means, which is why both rules live in one function that both backends call. 49 corpus documents set the parameter true. Not implemented: the first requirement, that \"the line width and the coordinates of a stroke shall automatically be adjusted as necessary to produce lines of uniform thickness … no more than half a pixel different\". That is a grid-fitting of the *coordinates*, and the non-uniformity it exists to remove is an artefact of the binary scan conversion §10.7.4 describes — Figure 70 shows an aliased line — which this tree already departs from by anti-aliasing. An anti-aliased stroke's coverage-weighted thickness is the requested width at every position, so the clause's stated purpose is met by a different route; what is not met is uniformity of the *rasterised* line on a device that quantises coverage. That is a departure of the same family as §10.7.4's three, licensed by §10.7.1's NOTE, and nothing reports it because there is no page on which this device could do better. ADR 0028."

[[clause]]
clause = "10.8"
title = "Rendering for separations"
status = "inapplicable"
note = "Separations are one output per device colourant, \"usually as bitmaps\", for a press. See §10.8.3 for the one part of this subclause that could apply to a screen."

[[clause]]
clause = "10.8.1"
title = "General"
status = "inapplicable"
note = "\"Whether separations are produced is up to the processing software\", and this one produces a screen."

[[clause]]
clause = "10.8.2"
title = "Separations"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause states this tree's behaviour as the expected one: \"Alternate colour spaces are supplied for DeviceN and Separation colour spaces so that files prepared for generation of separations can be displayed on other devices and, in many cases, the overprint controls are ignored.\" Both halves are what happens here — the alternate space and its tint transform are evaluated, and overprinting is ignored on the argument ADR 0028 makes from §8.6.7. The clause's own worked example, cyan then yellow overprinting to green on a press and staying yellow on a screen, is the picture this device draws."

[[clause]]
clause = "10.8.3"
title = "Separation simulation"
status = "reported"
note = "Separation simulation — rendering a page as a press would, by making separations, converting each to flat XYZ against a white matte and multiply-blending them. Not implemented and not silent: it is a *simulation* a processor performs when asked to, and nothing in a PDF asks for it. The clause's own condition is \"if it is important … to more closely match those produced when using separations\", which is a user's request rather than a document's, and this viewer has no such control. Recorded here so that the day one exists, the algorithm is known to be stated."

[[clause]]
clause = "11.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency.rs::an_object_drawn_without_a_constant_is_opaque"]
note = "Introductory. Its one statement with a consequence here is that the transparent imaging model is an *extension* of the opaque one, so a page that uses none of clause 11 draws exactly as it did before — which is why alpha, blend mode and soft mask are graphics-state parameters with opaque defaults rather than a second pipeline."

[[clause]]
clause = "11.2"
title = "Overview of transparency"
status = "implemented"
code = ["crates/pdf-render/src/lib.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "The model's vocabulary — object, group, backdrop, shape, opacity, transparency stack — and this tree's display list is that stack: a flat sequence with `Command::Group` as the one nested command (ADR 0026). Alpha is one channel per pixel rather than shape and opacity separately, which §11.2 permits and ADR 0027 argues from `/AIS`: with one number, shape and opacity multiply to the same number."

[[clause]]
clause = "11.3"
title = "Basic compositing computations"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_blend_mode_array_takes_the_first_name_this_reader_knows"]
note = "The compositing arithmetic itself, which both rasterisers perform. See the subclauses; the load-bearing rows are §11.3.4's blending colour space and §11.3.5's sixteen modes."

[[clause]]
clause = "11.3.1"
title = "General"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency.rs::an_object_drawn_without_a_constant_is_opaque"]
note = "Introductory to the formulas. Its framing — that compositing is defined for one object against one backdrop and then applied recursively — is why `Command::Group` needs no more than a nested command list."

[[clause]]
clause = "11.3.2"
title = "Basic notation for compositing computations"
status = "inapplicable"
note = "Notation: the names the clause's formulas use for the backdrop, source and result colours and alphas. Nothing to implement; the formulas that use it are §11.3.3 and §11.3.5."

[[clause]]
clause = "11.3.3"
title = "Basic compositing formula"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency.rs::an_object_drawn_without_a_constant_is_opaque", "crates/render-cpu/tests/soft_mask.rs::a_constant_mask_interpolates_between_the_object_and_the_backdrop"]
note = "The union of the backdrop and source alphas, and the weighted blend between the backdrop colour and the blend function's result. Performed by `tiny-skia` and by Vello rather than here, and held to the clause by the closed-form check in `render-cpu/tests/soft_mask.rs` — trap 12's lesson, that the way to judge a composite is to write the clause's arithmetic down rather than to compare with a renderer."

[[clause]]
clause = "11.3.4"
title = "Blending colour space"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_resets_the_alpha_constants_and_the_blend_mode_for_its_elements"]
note = "The blending colour space is the device's three components, always. §11.6.6's `/CS` may name another and four corpus documents name `/DeviceCMYK`; those are reported rather than blended in the wrong space, because a second raster format is what honouring them means (ADR 0026). The clause's own requirement that the space be \"a device or CIE-based colour space\" and not a special one is therefore satisfied by construction."

[[clause]]
clause = "11.3.5"
title = "Blend mode"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/lib.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_blend_mode_array_takes_the_first_name_this_reader_knows"]
note = "All sixteen blend modes reach both backends, and §11.6.3's rule for choosing among an array of names is implemented — see §11.3.5.2 and §11.3.5.3 for the two families. The clause's own framing makes the twelve separable ones a rasteriser's parameter, since each is a function of one backdrop and one source component; the four of §11.3.5.3 are not, and §11.3.5.3's row is where the CPU backend's own compositing pass for them is recorded."

[[clause]]
clause = "11.3.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_blend_mode_array_takes_the_first_name_this_reader_knows"]
note = "The two families and the rule for naming one. §11.6.3's array form is implemented — the first name this reader knows wins — and a name it does not know is `Normal`, which is what the clause requires of an unrecognised name."

[[clause]]
clause = "11.3.5.2"
title = "Separable blend modes"
status = "implemented"
code = ["crates/pdf-render/src/lib.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_blend_mode_array_takes_the_first_name_this_reader_knows"]
note = "Table 134's twelve separable modes, each a function `B(cb, cs)` applied per component. One of them is load-bearing outside transparency: §12.5.6.10's highlight is a wash that must leave the text under it readable, and `Multiply` is the mode whose \"result colour is always at least as dark as either of the two constituent colours\" — the standard's own guarantee that what was under the wash survives it (ADR 0043)."

[[clause]]
clause = "11.3.5.3"
title = "Non-separable blend modes"
status = "implemented"
code = ["crates/render-cpu/src/blend.rs", "crates/render-gpu/src/lib.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_every_blend_mode", "crates/render-cpu/src/blend.rs::hue_of_red_over_blue_is_the_clauses_arithmetic"]
note = "Table 135's four non-separable modes — Hue, Saturation, Color, Luminosity — written from the clause's `Lum`, `ClipColor`, `SetLum` and `SetSat` in `render-cpu/src/blend.rs`, because three of the four were wrong when handed to `tiny-skia`: the thirty-seventh session's cross-backend scene found `Hue`, `Color` and `Luminosity` 113 of 255 from Vello, and the clause settled which was right rather than leaving a tie. Red over blue in `Hue` is `SetLum(SetSat(Cs, Sat(Cb)), Lum(Cb))`, which after `ClipColor` is 0.367; `tiny-skia` produced 0.81, the value before the clip. All sixteen modes now agree between the backends to the channel, which is two independent implementations of the clause's own arithmetic rather than one checked against itself — the functions stay in `render-cpu` for exactly that reason (ADR 0047). `ClipColor` is defined only where `Lum(C)` is itself in range, which the clause supplies by reaching it solely through `SetLum`."

[[clause]]
clause = "11.3.6"
title = "Interpretation of alpha"
status = "partial"
code = ["crates/pdf-render/src/backend.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "The weighted average of backdrop, source and blended colour that both backends evaluate through their rasterisers, and the sentence that decides three things this session leaned on: \"An alpha value of αs = 0.0 or αb = 0.0 results in no blend mode effect\". That is why §11.4.7's transparent page group changes every blend mode over an unpainted area — the backdrop alpha is zero there, so the blend collapses to the source colour — and why an element's blend mode has no effect inside an isolated knockout group (§11.4.6). NOTE 2's undefined colour at zero result alpha is what a premultiplied raster represents naturally. For the twelve separable modes the formula is tiny-skia's and Vello's rather than this tree's, and what is implemented here is the choice of what they composite onto; for §11.3.5.3's four it is `render-cpu/src/blend.rs`, which evaluates this clause's weighted average itself with the premultiplication folded in (ADR 0047). `partial` for the first half."

[[clause]]
clause = "11.3.7"
title = "Shape and opacity computations"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/transparency.rs", "crates/pdf-model/tests/image_masks.rs"]
note = "Aggregate of the three below, read as a family in the fifteenth session because an image's masks are where shape and opacity meet in this tree. Alpha is the product of shape and opacity, which is what `image::combine_on_the_finer_grid` computes when a stencil's shape multiplies a soft mask's opacity, and what a `Color`'s alpha carries everywhere else. What is absent is the distinction: this renderer holds one alpha per paint, and only a transparency group can tell shape from opacity (§11.3.7.3, §11.4.6)."

[[clause]]
clause = "11.3.7.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_soft_mask_finer_than_its_image_keeps_its_own_resolution"]
note = "One sentence: alpha is shape times opacity. Held where the two are separately known — an image mask's shape multiplied by an `/SMask`'s opacity — and structurally elsewhere, since a paint carries one alpha and every source of it multiplies in. The clause's NOTE about anti-aliased edges being *shape* rather than opacity is the rasterisers' business and both treat coverage as shape."

[[clause]]
clause = "11.3.7.2"
title = "Source shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/transparency.rs", "crates/pdf-model/tests/image_masks.rs"]
note = "Six sources, three of shape and three of opacity. Object shape is what filling an outline does, and an explicit mask's \"1.0 in the unmasked portions\" is applied as of the fourteenth session (§8.9.6.3); mask opacity is an image's own `/SMask` (§11.6.5.2) and is reported for the graphics state's (§11.6.5.1); both constants are `ca` and `CA`. Missing: the shape of a *group*, which is the union of what it contains and needs §11.4.6, and `/AIS`, which decides whether a mask and the constants are read as shape or as opacity."

[[clause]]
clause = "11.3.7.3"
title = "Result shape and opacity"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "The union formulas for the shape and opacity a compositing step leaves behind. The alpha half is what every raster here carries, and a transparency group's result is now that union rather than nothing (§11.4.1). What is still absent is the separation: this renderer holds one alpha per pixel, the product of shape and opacity, where the clause keeps two. §11.4.6 names the one construction that needs them apart — \"The separate shape value shall be computed in any group that is subsequently used as an element of a knockout group\" — and that is reported rather than silent since the seventeenth session, which is why this row is no longer `silent` either."

[[clause]]
clause = "11.3.8"
title = "Summary of basic compositing computations"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs"]
test = ["crates/render-cpu/tests/soft_mask.rs::a_constant_mask_interpolates_between_the_object_and_the_backdrop"]
note = "A summary of §11.3.3 through §11.3.7, restating them with the group cases folded in. Nothing new is required of a reader; the rows above are where each of its lines is answered."

[[clause]]
clause = "11.4"
title = "Transparency groups"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Aggregate of the eight below, read as a family in the seventeenth session with transparency groups as the demand item. A group's elements are composited onto a transparent backdrop and the result painted once under the constant alpha and blend mode in force at Do — §11.4.5's isolated, non-knockout group, which is what both backends express natively. §11.4.7's page group is implemented and was the session's largest finding. Knockout (§11.4.6) is reported, and so is a non-isolated group whose elements blend, which is the only case where §11.4.4's backdrop removal does not cancel."

[[clause]]
clause = "11.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "A group is \"collected together and composited to produce a single colour, shape, and opacity at each point\" and the result treated as one object, which is what Command::Group asks a backend for. Of the four further attributes this clause lists three are here — the compositing inputs applied to the group as a whole, isolation, knockout — and the fourth is §11.5's: a group's result used as a source of shape or opacity for a soft mask, still reported rather than built."

[[clause]]
clause = "11.4.2"
title = "Notation for group compositing computations"
status = "inapplicable"
note = "Notation, and Table 138's renaming of §11.3's variables so that §11.4.4 can state its recurrences. There is no requirement to implement; marking it implemented would claim code for a clause that asks for none, which is the reading §11.6.1 already has."

[[clause]]
clause = "11.4.3"
title = "Group structure and nomenclature"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "The three backdrops this clause distinguishes. The group backdrop is what is already on the page; the initial backdrop is transparent here, which is the isolated choice (§11.4.5); the immediate backdrop is what a group's own buffer accumulates, and is right because the elements are drawn into that buffer in order. Its last requirement — \"A PDF processor shall ensure that the backdrop's contribution to the overall result is applied only once\" — holds by construction, since a transparent initial backdrop has no contribution to remove. What is absent is the non-isolated reading of the same sentence; see §11.4.4."

[[clause]]
clause = "11.4.4"
title = "Group compositing computations"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_non_isolated_group_reports_only_when_an_element_blends"]
note = "The recurrence for a non-isolated, non-knockout group, and NOTE 3's backdrop removal at the end of it. With every element blending Normal the removal is exact and the backdrop cancels, so the isolated computation both backends perform is this one — §11.6.7's NOTE 1 states that equivalence for the same formulas applied to a pattern cell. What is not implemented is a non-isolated group holding an element with another blend mode, where NOTE 2 makes the backdrop the whole point; that is reported, on 9 corpus documents. Table 140's separate group shape and group alpha are not maintained either: this renderer holds one alpha per pixel, which is §11.3.7.3's row."

[[clause]]
clause = "11.4.5"
title = "Isolated groups"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "\"α0 = 0.0 if the group is isolated\" — a transparent buffer, which is what a tiny-skia pixmap and a Vello layer both start as. The consequence the clause spends its length on follows from it: an element's blend mode inside the group sees only what the group itself painted. Its closing sentence, about which rendering intent converts the group's colours into the backdrop's space, has nothing to convert here — there is one blending space, device RGB, and a group asking for another is reported (§11.6.6)."

[[clause]]
clause = "11.4.6"
title = "Knockout groups"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_knockout_group_paints_only_its_topmost_element", "crates/pdf-model/tests/transparency_groups.rs::a_knockout_group_reports_only_where_the_two_models_differ", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_knockout_group"]
note = "Was this tree's first `silent` row, from the ninth session; `reported` from the seventeenth; drawn since the seventy-first. A knockout group's elements are composited with the group's initial backdrop rather than with each other, so at any point the topmost object wins. The reading this row carried for fifty-four sessions is the implementation: for an isolated knockout group the initial backdrop is transparent, so §11.3.6's formula leaves each element its own colour and its blend mode has no effect at all, and the clause's two-stage average by source shape is a Porter-Duff Source composite modulated by coverage. `render-cpu` says that to `tiny-skia` as a per-draw blend mode; Vello has no per-draw blend and its `Compose::Copy` runs over a layer's whole bounding box, so `render-gpu` empties the shape with `Compose::DestOut` and paints over it — measured against the CPU backend at a diagonal edge, mean 0.0039 over the scene. `partial` for what the clause itself says cannot be done with one alpha channel: \"[t]he existence of the knockout feature is the main reason for maintaining a separate shape value rather than only a single alpha\", so an element carrying a soft mask, an image or shading with per-sample alpha, or a nested group keeps the report — its shape and its opacity are the same number here. A non-isolated knockout group whose elements blend keeps it too, because the initial backdrop is then the group's own, which is the same thing §11.4.4 lacks; where nothing blends the backdrop cancels by §11.4.4's NOTE 3 and the group is drawn. Corpus: 2 of the 7 documents that reported this now draw with nothing reported, `knockout_isolated_overlap.pdf` agrees with the reference consensus, and `knockout_groups_test.pdf` page 2 came from mean 5.07 to 3.08 while staying contradicted."
[[clause]]
clause = "11.4.7"
title = "Page group"
status = "partial"
code = ["crates/pdf-render/src/backend.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::vello_hands_back_straight_alpha"]
note = "The seventeenth session's largest finding, and it was invisible until a group made it visible. Everything painted on a page belongs to a page group that \"shall be treated as an isolated group, whose results shall then be composited with a backdrop colour appropriate for the medium\" — so the page's own initial backdrop is transparent, and the medium's white is applied to the finished page. Both backends filled the raster with white and drew over it, which is a different picture for every blend mode: an object blending against an unpainted part of the page saw white where the standard says it sees nothing. transparency_group.pdf draws a Difference ellipse that four reference renderers show crimson over white, and this tree showed as its inverse. `impose_on_medium` in pdf-render is the composite, called by both backends so neither can differ about it. What is not implemented is the clause's second case, a page used as an element of another document's page through a reference XObject (§8.10.4), which needs importing before the page group's attributes can matter."

[[clause]]
clause = "11.4.8"
title = "Summary of group compositing computations"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "A restatement of §11.4.4's formulas with the subscript b that selects the backdrop — 0 in a knockout group, i-1 otherwise — and with isolation folded in. Its own NOTE says the formulas \"can be significantly simplified when some sources of shape and opacity are not present\" and that each kind of group cancels some of the terms; the isolated, non-knockout case is the one this tree evaluates, as a source-over composite of the group's buffer. The status follows §11.4.4's and §11.4.6's rather than adding anything: this clause introduces no requirement they do not."

[[clause]]
clause = "11.5"
title = "Soft masks"
status = "implemented"
code = ["crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs", "crates/pdf-render/src/soft_mask.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs", "crates/render-cpu/tests/soft_mask.rs", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_soft_mask"]
note = "Aggregate of the three below, and the eighteenth session's demand item. A soft mask is a transparency group evaluated for its opacity: `pdf-model` runs the group into a command list of its own, both backends rasterise it at device resolution, and `pdf_render::SoftMask::value` — one function, called by both — turns the pixels into mask values. Was `reported` on 28 corpus documents until §11.4's groups made it buildable. ADR 0027."

[[clause]]
clause = "11.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-render/src/soft_mask.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/render-cpu/tests/soft_mask.rs::a_constant_mask_interpolates_between_the_object_and_the_backdrop"]
note = "Introduces the mask shape and mask opacity a soft mask supplies. Its NOTE 2's soft clip is what the CPU backend literally builds — the mask becomes a `tiny_skia::Mask` multiplied into the clip mask, which is the NOTE's \"generalization of the hard clip\" as arithmetic. Shape and opacity are one alpha here (§11.3.7.1's `a = f x q`), so `/AIS` is immaterial and deliberately not read; see §11.6.4.3."

[[clause]]
clause = "11.5.2"
title = "Deriving a soft mask from group alpha"
status = "implemented"
code = ["crates/pdf-render/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs::an_alpha_mask_reads_the_groups_alpha_and_ignores_its_colour", "crates/pdf-render/src/soft_mask.rs::an_alpha_mask_reads_the_alpha_and_ignores_the_colour"]
note = "The group is drawn onto a fully transparent surface and its alpha channel taken, which is the clause's backdrop \"whose value does not contribute to the eventual result\" factored out by construction rather than by subtraction. Its NOTE 2 — the shape and alpha of an empty group is 0.0 — falls out of the same surface. `smask_alpha_bc.pdf`, `smask_alpha_oob.pdf` and `smask_alpha_oob_transfer.pdf` are the corpus's cases and all three now draw."

[[clause]]
clause = "11.5.3"
title = "Deriving a soft mask from group luminosity"
status = "partial"
code = ["crates/pdf-render/src/soft_mask.rs", "crates/pdf-model/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs::a_luminosity_mask_takes_the_groups_grey_and_the_backdrops_outside_it", "crates/pdf-render/src/soft_mask.rs::a_luminosity_mask_uses_the_clauses_own_coefficients"]
note = "The group is composited onto the opaque `/BC` backdrop and the luminosity of the result taken, by the clause's device branch: \"convert the colour to DeviceGray by implementation-defined means\", the means being EXAMPLE 2's Y = 0.30 R + 0.59 G + 0.11 B. Those coefficients and not a library's: `tiny_skia::MaskType::Luminance` is Rec. 709 and Vello's luminance mask is the SVG formula, and both are a fifth of the mask's range away on green. What is not done is the clause's *other* branch — a CIE-based group space converted to XYZ and its Y taken — because every colour here is converted to device RGB one at a time long before a mask is composited; that is §11.6.6's departure seen from this clause, and it is exact for the grey spaces (0.30 + 0.59 + 0.11 = 1) and reported for the rest. \"G may be any kind of group - isolated or not, knockout or not\" is honoured by reporting §11.4's two structural departures for a mask group exactly as for a painted one."

