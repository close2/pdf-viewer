[[clause]]
clause = "8.11"
title = "Optional content"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "Aggregate. The default configuration is honoured wherever it decides what is drawn; what is missing is everything that belongs to an interactive layer panel, and §8.11.4.4 is the row to read for the part that is missing in silence."

[[clause]]
clause = "8.11.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "Descriptive: it names the three subclauses below. Carries their aggregate."

[[clause]]
clause = "8.11.2"
title = "Optional content groups"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "Aggregate of §8.11.2.1 to §8.11.2.3."

[[clause]]
clause = "8.11.2.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_marked_section_belonging_to_a_group_that_is_off_is_not_drawn"]
note = "A group's state comes from the default configuration and its /Intent is honoured. Two Table 96 entries are read by nothing: /Name, which exists to be shown in a user interface, and /Usage, which feeds the automatic state setting of §8.11.4.4. The nesting rule — an outer level that hides content hides every inner level — falls out of the interpreter's hidden-section counter."

[[clause]]
clause = "8.11.2.2"
title = "Optional content membership dictionaries"
status = "implemented"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_membership_dictionary_can_show_content_when_its_group_is_off", "crates/pdf-model/tests/optional_content.rs::a_visibility_expression_outranks_the_policy_beside_it", "crates/pdf-model/tests/optional_content.rs::a_single_group_reference_is_read_without_losing_which_object_it_is"]
note = "/OCGs in both its shapes, all four /P policies, and /VE including nesting. /VE is used in preference to /OCGs and /P as the clause requires; a tree deeper than 32 is refused and reported rather than recursed."

[[clause]]
clause = "8.11.2.3"
title = "Intent"
status = "implemented"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_group_whose_intent_the_configuration_ignores_does_not_hide_anything"]
note = "Both directions: a group whose intents miss the configuration's has no effect on visibility, and a configuration whose /Intent is an empty array makes all content visible. /All is expanded as the set of all intents."

[[clause]]
clause = "8.11.3"
title = "Making graphical content optional"
status = "implemented"
code = ["crates/pdf-model/src/optional_content.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "Aggregate of §8.11.3.1 to §8.11.3.3."

[[clause]]
clause = "8.11.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_hidden_section_still_changes_the_graphics_state_it_leaves_behind"]
note = "Hiding suppresses marking and nothing else: the colour, transform and clip a hidden section sets outlive it, and the text position advances through hidden text. Form XObjects and annotations are skipped whole, which the clause permits because their state changes do not escape them."

[[clause]]
clause = "8.11.3.2"
title = "Optional content in content streams"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_marked_section_belonging_to_a_group_that_is_off_is_not_drawn", "crates/pdf-model/tests/optional_content.rs::a_group_missing_from_the_properties_dictionary_hides_nothing"]
note = "BDC /OC is honoured, including the rule that the operand must name a group listed in /OCProperties /OCGs or a membership dictionary. What is not implemented is the DP form: a DP marked-content point may force a reference to a group on a page that draws nothing in it, which affects a layer panel's ListMode /VisiblePages and nothing that is drawn."

[[clause]]
clause = "8.11.3.3"
title = "Optional content in XObjects and annotations"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_form_xobject_carrying_oc_is_skipped_when_its_group_is_off", "crates/pdf-model/tests/optional_content.rs::an_annotation_carrying_oc_is_not_drawn_when_its_group_is_off"]
note = "/OC on a form or image XObject and on an annotation, each combined with the visibility of the context it is invoked from. This is the entry point issue12007_reduced.pdf uses; implementing only §8.11.3.2 would have left it drawing a whole hidden screenshot."

[[clause]]
clause = "8.11.4"
title = "Configuring optional content"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "Aggregate of §8.11.4.1 to §8.11.4.5."

[[clause]]
clause = "8.11.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "Descriptive. Carries the aggregate of the four below."

[[clause]]
clause = "8.11.4.2"
title = "Optional content properties dictionary"
status = "implemented"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_document_with_no_properties_dictionary_draws_everything"]
note = "/OCProperties is read from the catalog, /OCGs gives the document's groups and /D the default configuration. A file with no /OCProperties has its optional content structures ignored entirely, which the clause makes decisive rather than a fallback."

[[clause]]
clause = "8.11.4.3"
title = "Optional content configuration dictionaries"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_base_state_of_off_hides_the_groups_the_on_array_does_not_name"]
note = "/BaseState, /ON, /OFF and /Intent are honoured. Six entries are not read: /Name and /Creator name the configuration for a user interface, /Order and /ListMode describe how to present the groups in one, /RBGroups and /Locked constrain how a user may change them, and /AS is §8.11.4.4's. None affects the initial state. /Configs is not read either: the alternate configurations exist to be chosen between, which needs someone to choose."

[[clause]]
clause = "8.11.4.4"
title = "Usage and usage application dictionaries"
status = "silent"
note = "Not implemented and not reported. A usage dictionary describes when a group should be on — by zoom level, by language, by whether the page is being printed — and §8.11.4.5 has an interactive processor apply the /AS array's View entries over the initial state. This viewer has a window, so those requirements do apply to it, and a layer that should switch itself off is drawn with nothing said. It is `silent` rather than `reported` because nothing in the tree looks at /Usage or /AS to have something to report."

[[clause]]
clause = "8.11.4.5"
title = "Determining the state of optional content groups"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_base_state_of_off_hides_the_groups_the_on_array_does_not_name"]
note = "Steps a) and b) — the base state over every group, then the array opposite to it — are implemented, and the clause calls their result the initial state used by all PDF processors. Everything after that sentence is about an interactive processor and is not: usage application dictionaries for View, Print and Export events, and manual overrides surviving reapplication. See §8.11.4.4."

