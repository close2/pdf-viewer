[[clause]]
clause = "7.6.6"
title = "Crypt filters"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::an_identity_stream_filter_leaves_streams_alone", "crates/pdf-syntax/tests/encryption.rs::a_document_whose_attachment_alone_is_encrypted_still_opens"]
note = "Table 25's V2, AESV2 and AESV3 and Table 26's Identity are implemented, /CF, /StmF and /StrF are read with Identity as the stated default, and a stream's own /Crypt filter overrides /StmF through its /DecodeParms /Name. /CFM /None is refused by name, because it \"allows the security handler to do its own decryption\" and there is no such handler here. The clause's binding of a failed authorization to the *data* rather than to the file is implemented and is the reason `encrypted-attachment.pdf` and `auth-event-ef-open.pdf` display: both write /StmF /Identity /StrF /Identity with a StdCF reached only through /EFF, and neither authenticates against any known password. `partial` because the /EFF path itself is unexercised — no embedded file's bytes are ever read — and because /AuthEvent is read only far enough to know it does not gate the body."

[[clause]]
clause = "7.6.7"
title = "Unencrypted wrapper document"
status = "writer-side"
note = "Every normative sentence here addresses a producer: the wrapper \"shall include a Collection dictionary\", \"shall include the file specification dictionary … in the EmbeddedFiles name tree\", \"shall include the AFRelationship key\". The one sentence about readers is descriptive and describes what this viewer already does — \"PDF processors without the custom security handler will present the unencrypted wrapper document with helpful instructions to the user\" — because a wrapper is an ordinary unencrypted PDF and draws as one. Presenting the payload instead would need §12.3.5 collections and a handler for whatever /EP names, and is that clause's work rather than this one's."

[[clause]]
clause = "7.7"
title = "Document structure"
status = "partial"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs", "crates/pdf-syntax/tests/real_documents.rs"]
note = "The object hierarchy from the trailer's `/Root` down to a page, reviewed as a family in the twenty-ninth session. What this reader needs of it — the catalog, the page tree and a page object's geometry, resources and content — is complete. What it does not read is everything the catalog holds for a *viewer* rather than a renderer, and the subclauses name each."

[[clause]]
clause = "7.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Descriptive. The object hierarchy is entered at the trailer's `/Root`, which `Document::catalog` resolves, with §7.5.5's recovery when the trailer is damaged."

[[clause]]
clause = "7.7.2"
title = "Document catalog dictionary"
status = "partial"
code = ["crates/pdf-syntax/src/document.rs", "crates/pdf-model/src/page.rs", "crates/pdf-model/src/optional_content.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs", "crates/pdf-model/tests/optional_content.rs"]
note = "Table 29's entries, and which of them this renderer reads: `/Pages` (the page tree), `/OCProperties` (§8.11's optional content, ADR 0017), `/AcroForm` (§12.7's interactive form, for a field's `/DR` and `/NeedAppearances`, ADR 0032), `/OutputIntents` (§14.11.5's `/DestOutputProfile`, ADR 0009) and `/Version`. Not read, and every one of them is a *viewer* feature rather than a rendering one: `/PageLabels`, `/Names`, `/Dests`, `/ViewerPreferences`, `/PageLayout`, `/PageMode`, `/Outlines`, `/Threads`, `/OpenAction`, `/AA`, `/URI`, `/StructTreeRoot`, `/MarkInfo`, `/Lang`, `/SpiderInfo`, `/Metadata`, `/PieceInfo`, `/Perms`, `/Legal`, `/Requirements`, `/Collection`, `/NeedsRendering`, `/DSS`, `/AF` and `/DPartRoot`. `CLAUDE.md` puts page labels, outlines and destinations in scope as things that *display*; none is started, and none affects a rendered page."

[[clause]]
clause = "7.7.3"
title = "Page tree"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs"]
note = "The tree, its nodes, a page object's entries and the inheritance between them. See the subclauses."

[[clause]]
clause = "7.7.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs"]
note = "\"Compliant PDF processors shall be prepared to handle any form of tree structure built of such nodes\", and `Pages::get` walks whatever it finds rather than assuming the flat or balanced shape the NOTE describes. Two bounds guard the walk against a tree that is not one: 64 levels of nesting — a balanced tree over a hundred thousand pages is about six — and a million nodes visited per lookup. The clause's own reason for the tree is why the walk is on demand: \"PDF readers using only limited memory, can quickly open a document containing thousands of pages\", which is also this project's time-to-first-page requirement."

[[clause]]
clause = "7.7.3.2"
title = "Page tree nodes"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs", "crates/pdf-model/tests/corpus.rs"]
note = "Table 30's `/Kids` is followed and `/Type` is not required of a node, because files omit it; the walk decides a leaf by the *absence* of `/Kids` rather than by the name, which is what lets a malformed tree still yield its pages. **`/Count` is deliberately not trusted**, and the clause's own NOTE says why: it \"is redundant\", and \"the value of the Count key is consistent with the number of entries in the Kids array and its descendants which definitively determines the number of descendant pages\". Real files disagree with their own counts; the `Kids` arrays are what this reader counts."

[[clause]]
clause = "7.7.3.3"
title = "Page objects"
status = "partial"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs"]
note = "Table 31's entries that decide what is drawn: `/Resources`, `/MediaBox`, `/CropBox`, `/Rotate`, `/Contents` (one stream or an array \"concatenated with at least one white-space character added between the streams' data\", since a token may straddle the boundary), `/Annots` (§12.5), `/Group` (§11.4.7's page group) and — **as of the twenty-ninth session** — `/UserUnit`. That last is \"a positive number that shall give the size of default user space units, in multiples of 1/72 inch\", and it had been read nowhere: **all three of the oracle's page-geometry disagreements were this one entry**, two documents writing `/UserUnit 3` and one writing `/MediaBox [0 0 8.5 11]` with `/UserUnit 72`, which is a page stated in inches. `mutool` and `ghostscript` scale by it and `poppler` does not; the clause settles it rather than the vote. A value that is not positive is the default of 1.0, and values above 1000 are refused — the clause's \"range of supported values shall be implementation-dependent\", answered here. Not read: `/LastModified`, `/BleedBox`, `/TrimBox`, `/ArtBox` and `/BoxColorInfo` (production and guideline boxes, §14.11.2), `/Thumb`, `/B`, `/Dur`, `/Trans`, `/AA`, `/Metadata`, `/PieceInfo`, `/StructParents`, `/ID`, `/PZ`, `/SeparationInfo`, `/Tabs`, `/TemplateInstantiated`, `/PresSteps` and `/VP`."

[[clause]]
clause = "7.7.3.4"
title = "Inheritance of page attributes"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_on_an_ancestor_is_not_inherited"]
note = "The four entries Table 31 marks inheritable — `/Resources`, `/MediaBox`, `/CropBox` and `/Rotate` — are overlaid on the way down the tree so that the nearest ancestor's value wins, which is what inheritance means here. The sentence that makes the *rest* of Table 31 a closed question is §7.7.3.3's rather than this one's — \"attributes that are not explicitly identified in the table as inheritable shall not be inherited\" — which is why `/UserUnit` is read from the page object alone even though reading it through the same path as `/MediaBox` would be one word's difference. \"All values shall be inherited as-is, without merging, even for composite data types\" is why a page's `/Resources` is the first dictionary found and not a union of the ones above it."

[[clause]]
clause = "7.7.4"
title = "Name dictionary"
status = "partial"
code = ["crates/pdf-model/src/attachment.rs", "crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_embedded_file_is_read_with_its_parameters"]
note = "The catalog's `/Names` name dictionary — Table 32's ten trees, each a §7.9.6 name tree. Two are read: `/Dests` (§12.3.2.4's named destinations, since the forty-ninth session) and `/EmbeddedFiles` (§7.11.4's attachments, since the eighty-sixth). The other eight are each owed to a feature rather than to this row: `/AP` to §12.7.4.3's appearance streams by name, `/JavaScript` to a clause principle 5 excludes, `/Pages` and `/Templates` to §12.7.7's named pages, `/IDS` and `/URLS` to web capture, `/AlternatePresentations` to a deprecated feature, and `/Renditions` to clause 13. `tree::name_pairs` is what a caller with no key to look up needs, and is the walk `number_pairs` already was for §7.9.7."


[[clause]]
clause = "7.8"
title = "Content streams and resources"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/content_streams.rs::a_compatibility_section_silences_an_unrecognised_operator"]
note = "Both halves: a content stream is lexed and executed sequentially, and its resources are resolved by name against the dictionary the clause associates with it. See §7.8.2 and §7.8.3."

[[clause]]
clause = "7.8.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/render_real_pdf.rs::every_specification_pdf_interprets"]
note = "Introductory. Its one claim — that a content stream and its resource dictionary \"in combination … form a self-contained entity\" — is the shape of `Interpreter::run`, which takes the two together and nothing else about the document except what a resource resolves to."

[[clause]]
clause = "7.8.2"
title = "Content streams"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-model/tests/content_streams.rs::the_silence_stops_at_the_matching_ex", "crates/pdf-model/tests/content_streams.rs::compatibility_sections_nest"]
note = "Every clause of it. The stream is lexed by §7.2's rules and executed in order; the five places the clause names as also being content streams — pages, form XObjects, patterns, Type 3 glyph descriptions and annotation appearances — all reach the same interpreter. \"An operand is a direct object belonging to any of the basic PDF data types except a stream … Indirect objects and object references shall not be permitted at all\" holds by construction: the content lexer has no reference token, so a `1 0 R` in a content stream lexes as two integers and an unrecognised operator. Table 33's `BX` and `EX` were matched and ignored for thirty-one sessions and are now the compatibility *section* the clause defines, kept as a nesting depth because \"these operators shall occur in pairs and may be nested\" — and it is the one place in this interpreter where unsupported input is deliberately silent, because the file has said in advance that ignoring it is appropriate. No corpus document exercises it: all nine that report an unrecognised operator report one no producer meant."

[[clause]]
clause = "7.8.3"
title = "Resource dictionaries"
status = "partial"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs", "crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_on_an_ancestor_is_not_inherited"]
note = "All four of the clause's ways a resource dictionary reaches a content stream: a page's `/Resources`, inherited through the page tree (§7.7.3.4); a Type 3 font's own; a form XObject's, a pattern's and an appearance stream's; and the fourth, for files \"written obeying earlier versions of PDF\" that omit it — \"All resources that are referenced from those forms and fonts shall be inherited from the resource dictionary of the page\", which is why every resource lookup falls back to the enclosing dictionary rather than failing. Of Table 34's eight resource types, seven are read; `/ProcSet` is deprecated in PDF 2.0 and §14.2 makes it advisory, so nothing looks at it. The partial is `/Properties`, which is read only for `/OC` (§8.11.3.3) and not for §14.6.2's marked-content property lists in general — which is clause 14's gap rather than this one's."

[[clause]]
clause = "7.9"
title = "Common data structures"
status = "partial"
code = ["crates/pdf-syntax/src/text_string.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_surrogate_pair_is_one_character"]
note = "The two of the clause's structures a rendered page needs: §7.9.2's string object types and §7.9.5's rectangles. Dates, text streams, name trees and number trees belong to features this tree does not have yet; see their rows."

[[clause]]
clause = "7.9.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_surrogate_pair_is_one_character"]
note = "Introductory. Its claim — that these structures are \"built from the basic types described in 7.3\" and carry conventional meanings — is the reason `text_string.rs` and `annotation::rectangle` exist as functions rather than as a rule repeated at each use."

[[clause]]
clause = "7.9.2"
title = "String object types"
status = "partial"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_string_with_no_prefix_is_pdfdocencoded"]
note = "Three of the four string object types are read where they are used. §7.9.2.2's text string is `text_string`, compiled against Table D.3; §7.9.2.4's byte string is the lexer's own output, which is what every other reader of a `/String` takes; §7.9.2.3's PDFDocEncoded string shares Table D.3 with the text string type and differs only in admitting no Unicode prefix, which no entry this tree reads distinguishes. What is not here is the *typing*: the object model carries one string type and each reader decides which of the four it holds, so a text string read as bytes is a defect nothing in this crate can catch."

[[clause]]
clause = "7.9.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/object.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_string_with_no_prefix_is_pdfdocencoded"]
note = "The clause's whole content is a statement about the object model: 'PDF supports one fundamental string object' and 'the string object shall be further qualified as a text string, ASCII string, or byte string'. This crate holds exactly that — one `Object::String` of bytes, qualified by whoever reads it. Figure 7's containment is why `text_string` can be applied to any string and why an ASCII string needs no decoder."

[[clause]]
clause = "7.9.2.2"
title = "Text string type"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_string_with_no_prefix_is_pdfdocencoded", "crates/pdf-syntax/src/text_string.rs::a_utf16be_marker_selects_utf16be", "crates/pdf-syntax/src/text_string.rs::a_utf8_marker_selects_utf8"]
note = "All three encodings the clause names, chosen by the prefix it states, with Annex D's Table D.3 compiled in. The reason it exists is §12.7.4.3: a field's `/V` and a free text annotation's `/Contents` are text strings and have to become characters before they can become glyphs. Table D.3 is not ISO Latin 1 and the differences decide pages — 0xA0 is EURO SIGN, 0x18 to 0x1F are accents, 0x80 to 0x9E are punctuation — so a Latin 1 decode would draw the wrong character with nothing reported."

[[clause]]
clause = "7.9.2.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_surrogate_pair_is_one_character", "crates/pdf-syntax/src/text_string.rs::the_table_is_not_latin_1", "crates/pdf-syntax/src/text_string.rs::an_undefined_code_point_is_the_replacement_character"]
note = "The prefix rule and all three encodings, including the clause's requirement that a reader 'shall be prepared to handle supplementary characters' — UTF-16BE is decoded by pairing surrogates rather than by taking each code unit as a character, which its NOTE 5 is there to warn against. A code Table D.3 marks Undefined becomes U+FFFD, so it reaches the layout as a character no font encodes and is reported there rather than dropped."

[[clause]]
clause = "7.9.2.2.2"
title = "Text string language escape sequences"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::a_language_escape_sequence_shows_nothing", "crates/pdf-syntax/src/text_string.rs::a_lone_escape_does_not_swallow_the_rest_of_the_string"]
note = "Both shapes the clause states — U+001B, a two-letter language code, an optional two-letter country code, U+001B — are removed from a Unicode text string, because the sequence marks a language and carries no character to display. Only from the two Unicode forms: the clause states the byte sequences for UTF-16BE and UTF-8 and not for PDFDocEncoding. A U+001B with no closing one is left where it stands rather than swallowing the rest of the value. What is *not* done with it is anything: the sequence overrides §14.9.2's hierarchy, which the sixtieth session built, so the language a `/Lang` states now reaches a caller and the one an escape sequence states is still dropped with the escape. Closing that means carrying a language *inside* a decoded text string, which changes the return type of every text-string read in the tree for a construct no corpus document writes."

[[clause]]
clause = "7.9.2.3"
title = "PDFDocEncoded string type"
status = "implemented"
code = ["crates/pdf-syntax/src/text_string.rs"]
test = ["crates/pdf-syntax/src/text_string.rs::the_table_is_not_latin_1"]
note = "The same Table D.3 as §7.9.2.2, which is the whole of the type: 'a character string in which the characters shall be represented in a single byte using PDFDocEncoding'. No entry this tree reads is typed as one rather than as a text string, and the two differ only in whether a Unicode prefix is honoured, so the table has one reader."

[[clause]]
clause = "7.9.2.4"
title = "Byte string type"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::hex_strings_ignore_junk_and_pad_an_odd_digit"]
note = "A byte string is what the lexer produces for every `/String`: 'binary data that shall be represented as a series of bytes, where each byte may be any value representable in 8 bits'. The two places the tree needs it as such are §7.6's `/O`, `/U`, `/OE`, `/UE` and `/Perms` and §14.4's file identifier, both of which take the bytes unchanged."

[[clause]]
clause = "7.9.3"
title = "Text streams"
status = "reported"
note = "A text *stream*, whose \"unencoded bytes shall meet the same requirements as a text string with respect to encoding, byte order, and lead bytes\". Nothing here reads one: the only places PDF 2.0 uses it are §12.7.4.3's `/RV` rich text, which principle 5's XFA exclusion covers and which `variable_text.rs` refuses by name, and metadata streams, which are clause 14 beyond this tree. The decoder it would need already exists — `text_string::decode` is the same rule one level down."

[[clause]]
clause = "7.9.4"
title = "Dates"
status = "reported"
note = "A date string, `D:YYYYMMDDHHmmSSOHH'mm`. Nothing here parses one, and nothing here needs to: every entry that holds a date — `/CreationDate`, `/ModDate`, an annotation's `/M`, a signature's `/M` — is displayed or compared rather than drawn, and this tree draws. It is `reported` rather than `inapplicable` because a viewer with a document-properties panel or a comment list owes it, and the day one exists this row is where to start."

[[clause]]
clause = "7.9.5"
title = "Rectangles"
status = "implemented"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_scales_the_page_and_its_contents"]
note = "\"Although rectangles are conventionally specified by their lower-left and upper-right corners, it is acceptable to specify any two diagonally opposite corners.\" `annotation::rectangle` normalises every rectangle it reads to lower-left and upper-right by taking the minimum and maximum of each axis, which is that sentence, and it is the one route to `/Rect`, `/BBox`, `/MediaBox`, `/CropBox` and `/RD`. A rectangle with fewer than four numbers, or any that is not finite, is refused rather than filled in."

[[clause]]
clause = "7.9.6"
title = "Name trees"
status = "implemented"
code = ["crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-syntax/src/tree.rs::a_key_is_found_through_intermediate_nodes"]
note = "Name trees: a root with `/Names` or `/Kids`, intermediate and leaf nodes with `/Limits`, keys that are *strings* and are ordered. `tree.rs` answers this clause and §7.9.7 with one walk, because the two differ only in the key type and in whether the pairs are called `/Names` or `/Nums`. **The `/Limits` are read as a hint rather than as a gate**: a node whose limits exclude the key is skipped and a node with none is searched, so a producer that got them wrong loses speed rather than entries. The clause's own reason for the structure is `CLAUDE.md` principle 2 written by ISO — the pairs \"can be looked up efficiently without requiring the entire data structure to be read from the PDF file\" — which is why the lookup descends rather than flattening."

[[clause]]
clause = "7.9.7"
title = "Number trees"
status = "implemented"
code = ["crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-syntax/src/tree.rs::a_number_trees_pairs_come_back_in_order"]
note = "Number trees, which §7.9.7 defines by difference: \"similar to a name tree … except that its keys shall be integers instead of strings and shall be sorted in ascending numerical order\", with `/Nums` in place of `/Names`. `TreeKey` is that difference and nothing else. Two entry points, for two shapes of question: `lookup` descends for one key, and `number_pairs` walks the whole tree — which §12.4.2 needs, because a labelling range runs from its own key to the *next* one and no single lookup produces a neighbour."

[[clause]]
clause = "7.10"
title = "Functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "All four function types, which this tree needs more than most readers do: §8.7's shadings evaluate one per sample, §8.6.6's `Separation` and `DeviceN` tint transforms are functions, and §10.5's transfer functions and §11.5's `/TR` are too. **1501 of 1501 functions in the corpus parse**, which the corpus gate asserts by name. The clause's own framing is what makes them cacheable: \"[f]unctions in PDF represent static, self-contained numerical transformations\" — no state, so `Ramp` can sample one 256 times and keep the answers."

[[clause]]
clause = "7.10.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "The framing, `/Domain` and `/Range`, and the clipping rule they carry: an input outside `/Domain` is clipped to it before evaluation and an output outside `/Range` is clipped after. Both are applied to every type here, which is where a first implementation loses a shading's end colours."

[[clause]]
clause = "7.10.2"
title = "Type 0 (sampled) functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "Type 0, sampled: `/Size`, `/BitsPerSample`, `/Encode`, `/Decode` and the samples themselves, with multilinear interpolation between them. All five of Table 39's sample widths are read, as §8.9.5.1's Table 87 widths are for an image, and for the same reason — a bit depth nobody writes is still a bit depth the clause permits."

[[clause]]
clause = "7.10.3"
title = "Type 2 (exponential interpolation) functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "Type 2, exponential interpolation: `/C0`, `/C1` and `/N`, which is the two-colour ramp most axial and radial shadings are made of. One line of arithmetic and the most frequently evaluated function in the corpus."

[[clause]]
clause = "7.10.4"
title = "Type 3 (stitching) functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "Type 3, stitching: `/Functions`, `/Bounds` and `/Encode`, a one-input function assembled from a row of others. The subclause's own edge — a subdomain of zero width, where two bounds coincide — is what a naive implementation divides by."

[[clause]]
clause = "7.10.5"
title = "Type 4 (PostScript calculator) functions"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "Type 4, the PostScript calculator: a small language, evaluated here rather than approximated. It is what `Separation` and `DeviceN` tint transforms are usually written in, and `postscript_type4_many_outputs.pdf` is the corpus's controlled experiment on it (see `oracle.rs`'s `CONTRADICTED_DEVICE_CMYK_CONVERSION`, which used it to prove something about `DeviceCMYK` instead)."

[[clause]]
clause = "7.10.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "The framing: a program in braces, with the input on the stack and the output taken from the top."

[[clause]]
clause = "7.10.5.2"
title = "Operators and operands"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "Table 42's operators, which is the whole language: arithmetic, the relational and boolean set, `if` and `ifelse`, and the stack operators `dup`, `exch`, `pop`, `copy`, `index` and `roll`. The clause bounds the stack at 100 entries, which is a bound this tree applies rather than a suggestion — a program that pushes without limit is a decompression bomb written in another notation."

[[clause]]
clause = "7.10.5.3"
title = "Type 4 function dictionary"
status = "implemented"
code = ["crates/pdf-model/src/function.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "The type 4 function's own dictionary, which is a stream: `/Domain`, `/Range` and the program as the stream's data. `/Range` is *required* here and is not for every type, and it is what says how many of the stack's values are outputs — which `postscript_type4_many_outputs.pdf` is named after, since its program leaves more values than its `/Range` takes."

[[clause]]
clause = "7.11"
title = "File specifications"
status = "reported"
note = "Aggregate of the ten below. **Nothing in this tree parses a file specification**, and the sentence that decides why is §7.11.1's: a file specification refers to a file \"external to the PDF file\" *in either case*, embedded or not. `CLAUDE.md` principle 3 gives the renderer no filesystem and no network, so following one is refused by architecture rather than unimplemented by accident — and every path in this tree that meets one already refuses out loud: §7.3.8's external stream data, §8.10.4's reference XObject drawn as its proxy, and §12.5.6.15's file attachment icon. What is owed in silence is on the two `silent` rows below, and it is a viewer's list of attachments rather than anything on a page."

[[clause]]
clause = "7.11.1"
title = "General"
status = "reported"
note = "The two forms — a simple specification as a string or a dictionary, a full one as a dictionary only — and the sentence this family turns on: \"[t]he file is considered external to the PDF file in either case.\" So an *embedded* file is still an external file with its bytes carried along, which is why reading one is an attachment feature and never a rendering one. Refusals, not silence: see §7.11's row for the three places this tree meets a specification and names it."

[[clause]]
clause = "7.11.2"
title = "File specification strings"
status = "reported"
note = "Aggregate of the two below: how a simple file specification's string spells a path."

[[clause]]
clause = "7.11.2.1"
title = "General"
status = "reported"
note = "The string form: SOLIDUS as \"a generic component separator that shall be mapped to the appropriate platform-specific separator\", a literal SOLIDUS escaped by REVERSE SOLIDUS, and components that \"shall be stored as bytes and shall be passed to the operating system without interpretation or conversion of any sort\". None of it is computed here, and the reason is one level up: this program never turns a specification into a path, because it has no filesystem to hand one to. The clause is worth having read for the last sentence — a reader that decoded these bytes as text would corrupt a file name in every locale where they are not UTF-8."

[[clause]]
clause = "7.11.2.2"
title = "Absolute and relative file specifications"
status = "reported"
note = "Absolute and relative specifications, RFC 3986's resolution for a URL-based file system, and the `..` rule for every other. Unimplemented for §7.11.2.1's reason, and worth one note for whoever implements it: the clause forbids more than it permits — a URL-based relative specification \"shall be limited to paths\", with \"[t]he scheme, network location/login, fragment identifier, query information, and parameter sections\" not allowed. That is a security rule wearing a syntax rule's clothes, and principle 3 would want it enforced rather than assumed."

[[clause]]
clause = "7.11.3"
title = "File specification dictionaries"
status = "reported"
note = "Table 43's dictionary — `/FS`, `/F`, `/UF`, the three deprecated platform keys, `/ID`, `/V`, `/EF`, `/RF`, `/Desc`, `/CI`, `/AFRelationship`. Unread, for §7.11's reason. One requirement is worth writing down before anybody reads it, because it is the kind a first implementation inverts: \"[a] PDF reader shall use the value of the UF key, when present, instead of the F key\" — `/UF` is a *text string* by §7.9.2.2 and `/F` a byte string, so the two are not interchangeable and the newer one wins."

[[clause]]
clause = "7.11.4"
title = "Embedded file streams"
status = "partial"
code = ["crates/pdf-model/src/attachment.rs", "crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_embedded_file_is_read_with_its_parameters"]
note = "Embedded file streams, which are the one part of §7.11 that needs no filesystem: the bytes are inside the document. `attachment::attachments` lists what the `/EmbeddedFiles` tree names — the tree's key, Table 43's `/UF` or `/F` and `/Desc`, Table 44's `/Subtype`, and Table 45's `/Size`, dates and `/CheckSum` — and hands the stream on without decoding it. Nothing is written anywhere: extracting an attachment is a person's decision, and this program has no dialogue to ask with. `/RF`'s related files (§7.11.4.2) are unread. 10 of the 974 corpus documents carry such a tree, 23 files between them; two of the 23 are in encrypted documents and refuse to decode, which §7.6.6 makes the stream's answer rather than the file's."


[[clause]]
clause = "7.11.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/attachment.rs", "crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_embedded_file_is_read_with_its_parameters"]
note = "Both of the clause's routes are readable and one is walked: the name dictionary's `/EmbeddedFiles` tree for the document as a whole, which `attachment::attachments` lists, and a file specification's own `/EF`, which `attachment::read` reads for whoever holds the specification — §12.5.6.15's file attachment annotations being the caller the clause names, and not yet built. Table 44 and Table 45 are read in full, with two entries deliberately not acted on: the `/CheckSum` is not verified, which would mean inflating every attachment for a value the clause says is \"strictly a checksum, and is not used for security purposes\", and the `/Size` is the document's claim rather than a measurement."


[[clause]]
clause = "7.11.4.2"
title = "Related files arrays"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::a_related_files_array_pairs_names_with_streams"]
note = "§7.11.4.2's related files array, in `attachment::related`. The shape is the part worth getting right: `/RF` is a dictionary keyed like `/EF` — `/F`, `/UF` and the platform keys — and each value is a *flat* array of `2 × n` elements alternating a name with an embedded file stream, not an array of pairs. The clause's own EXAMPLE is a DCS 1.0 set of five files behind one specification, and it is the test. Nothing extracts them, for `attachment.rs`'s stated reason: writing a file is what the sandbox exists to prevent. No corpus file specification carries a `/RF`, measured over every object of all 974 documents."

[[clause]]
clause = "7.11.5"
title = "URL specifications"
status = "reported"
note = "`/FS /URL` makes `/F` a uniform resource locator rather than a path. **This one is a security property rather than a gap**, in the same way §12.6.4.5's launch action is: principle 3 gives the renderer no network, so a document asking this program to fetch a URL gets nothing, and that is the intended answer rather than a missing feature. The clause's own encoding note is small and exact — 7-bit US-ASCII is a strict subset of PDFDocEncoding, so a URL is already a text string under §7.9.2.2's third encoding."

[[clause]]
clause = "7.11.6"
title = "Collection items"
status = "implemented"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::a_collection_subitem_keeps_its_prefix_apart_from_its_data", "crates/pdf-model/src/collection.rs::the_clauses_own_email_inbox_reads_as_five_columns"]
note = "Table 46's collection item and Table 47's subitem, in `collection::item`, read from a `/CI` on a file specification or on a folder. The dictionary has no fixed entries — every key is one the writer chose and the schema names — so this is a map, and the *values* are kept as the objects the file wrote rather than as strings: \"[t]he type of each entry shall match the type of data identified by the collection field dictionary … referenced by the same key\", so the type is the schema's to say and a reader guessing from the object would disagree with it. A subitem's `/P` prefix is kept apart from its `/D` data because Table 47 makes them behave differently — the prefix is shown and \"is ignored when an interactive PDF processor sorts the items in the collection\". The clause's own EXAMPLE 2 is the test."

[[clause]]
clause = "7.12"
title = "Extensions dictionary"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::extensions_are_read_under_their_registered_prefixes"]
note = "The catalog's `/Extensions`: which developer extensions a document was written against. Read into `requirements::Extensions`, keyed by the registered prefix name the clause makes the key, with §7.12.3's whole dictionary under it. Nothing *acts* on it, and nothing should: an extension level is a statement about which developer's additions a file uses, and this reader implements the standard rather than anybody's additions. 9 of the 974 corpus documents state one, all `/ADBE` at level 3 or 8 over a base version of 1.7."


[[clause]]
clause = "7.12.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::extensions_are_read_under_their_registered_prefixes"]
note = "The framing, and the two rules that decide how it is read: the keys other than `/Type` \"shall be names consisting of registered prefix names\", and the whole structure \"shall be direct objects\". The first is why `Extensions::by_prefix` is keyed by name; the second is a rule a file may break, so every part is resolved anyway — surviving it costs a reader nothing."


[[clause]]
clause = "7.12.2"
title = "Extensions dictionary"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::extensions_are_read_under_their_registered_prefixes"]
note = "Table 48: `/Type`, and one entry per registered prefix whose value is a developer extensions dictionary **or, since PDF 2.0, an array of them**. Both forms are read; the array is why one prefix maps to a list."


[[clause]]
clause = "7.12.3"
title = "Developer extensions dictionary"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::extensions_are_read_under_their_registered_prefixes"]
note = "Table 49: `/BaseVersion` and `/ExtensionLevel`, both required and both read, with PDF 2.0's optional `/URL` and `/ExtensionRevision`. A dictionary missing either required entry names no extension and is dropped rather than half-read — inventing a level would claim to know which of a developer's extensions this is."


[[clause]]
clause = "7.12.4"
title = "BaseVersion"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::extensions_are_read_under_their_registered_prefixes"]
note = "`/BaseVersion` is \"the name of the PDF version to which this extension applies\", kept as the name the file wrote. The clause's NOTE is the reason: \"[t]he value of BaseVersion is not to be interpreted as a real number but as two integers with a PERIOD (2Eh) between them\" — a reader that parsed it as a number would make 1.10 smaller than 1.7. The rule that it be no greater than the file's own version is a *writer's*, and this reader does not validate files."


[[clause]]
clause = "7.12.5"
title = "ExtensionLevel"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::extensions_are_read_under_their_registered_prefixes"]
note = "`/ExtensionLevel`, \"an integer defined by the developer to denote the extension being used\", read as one. Its ordering rule — that a developer's levels against one base version increase over time — is a statement about a developer's practice that a reader has nothing to check against."


[[clause]]
clause = "7.12.6"
title = "URL"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::extensions_are_read_under_their_registered_prefixes"]
note = "`/URL`, \"a URL that refers to the documentation for this extension\", read as the string it is and fetched by nobody: this reader has no network (ADR 0014), and the entry documents an extension to a human rather than to a program. §12.6.4.8's resolution is not applied to it either — that clause is about a URI *action*, and this is a citation."


[[clause]]
clause = "8.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/render_real_pdf.rs::every_specification_pdf_interprets"]
note = "Introductory to the imaging model. Its division — that clause 8 says what is painted and clause 10 how it reaches pixels — is the boundary between `pdf-render`'s display list and the two rasterisers."

[[clause]]
clause = "8.2"
title = "Graphics objects"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_move_overrides_the_move_before_it"]
note = "Table 32's five graphics objects and the state machine between them. All five are interpreted — path, text, external, inline image, shading — and the clause's rule that a path object is built and then painted by one operator is what `end_path` is. \"A content stream that is not a valid graphics object sequence\" is recovered from rather than refused, which the clause does not forbid and trap 5's rule requires be visible: an unbalanced `BT` is reported by name."

[[clause]]
clause = "8.3"
title = "Coordinate systems"
status = "implemented"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-render/src/lib.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_scales_the_page_and_its_contents"]
note = "See the subclauses. The one decision this tree makes about coordinate spaces is that the display list is stated in *page* space and the device transform is applied by the backend, which is what makes one list rasterisable at any scale."

[[clause]]
clause = "8.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-render/src/lib.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_scales_the_page_and_its_contents"]
note = "Introductory. Its claim that PDF's coordinate systems are all related by matrices is why `Transform` is the only geometry type that crosses a crate boundary here."

[[clause]]
clause = "8.3.2"
title = "Coordinate spaces"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_page_stated_in_inches_is_the_size_those_inches_are"]
note = "See §8.3.2.2 through §8.3.2.5."

[[clause]]
clause = "8.3.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_page_stated_in_inches_is_the_size_those_inches_are"]
note = "Names the spaces the subclauses below define."

[[clause]]
clause = "8.3.2.2"
title = "Device space"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/lib.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_basic_scene"]
note = "This device's space: y down, square pixels, origin at the top left, resolution decided by the `TargetSpec` the caller asks for. The clause's warning — that device spaces differ in origin, axis direction and resolution — is the reason the display list carries none of them and the backends carry all of them."

[[clause]]
clause = "8.3.2.3"
title = "User space"
status = "implemented"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_page_stated_in_inches_is_the_size_those_inches_are", "crates/pdf-model/tests/page_geometry.rs::a_user_unit_on_an_ancestor_is_not_inherited"]
note = "Every sentence of it is in `page.rs`: \"the CropBox entry in the page dictionary shall specify the rectangle of user space corresponding to the visible area\", the positive axes right and up \"subject to alteration by the Rotate entry\", and \"the length of a unit along both the x and y axes is set by the UserUnit entry\" with a default of one seventy-second of an inch (ADR 0038)."

[[clause]]
clause = "8.3.2.4"
title = "Other coordinate spaces"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/shadings.rs::a_shading_pattern_fills_only_the_path_it_paints"]
note = "The spaces defined relative to user space: glyph space (§9.2.4), text space (§9.4.4), image space, form space (§8.10) and pattern space (§8.7.3). All five are implemented, and the one that is easy to get wrong is pattern space — \"the pattern matrix maps pattern space to the default coordinate space of the page\", not to the space in force at the `scn`, which is why `Interpreter::base` exists."

[[clause]]
clause = "8.3.2.5"
title = "Relationships among coordinate spaces"
status = "implemented"
code = ["crates/pdf-render/src/lib.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_basic_scene"]
note = "The chain from glyph or image space through user space to device space, composed by matrix multiplication. Trap 2 is this subclause read the hard way: a paint is positioned in the space the *path* is stated in, so composing the page-to-device transform into a gradient's own matrix applies it twice."

[[clause]]
clause = "8.3.3"
title = "Common transformations"
status = "implemented"
code = ["crates/pdf-render/src/lib.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_diagonal_stroke"]
note = "Translation, scaling, rotation and skew, all four expressible by `Transform` and all four reached by the `cm` operator. Nothing constructs one from an angle here — a content stream states the six numbers — so the clause's formulas are read rather than implemented, and its NOTE 1 about the order mattering is the reason `Transform::then` is named for the order it applies in."

[[clause]]
clause = "8.3.4"
title = "Transformation matrices"
status = "implemented"
code = ["crates/pdf-render/src/lib.rs"]
test = ["crates/pdf-render/src/geom.rs::a_shear_stretches_more_than_its_determinant_says"]
note = "The six-number matrix and its arithmetic, `Transform`. One derived quantity is this crate's own and is worth naming here: `Transform::max_stretch` is the largest factor a matrix can scale a length by, which is **not** `determinant().abs().sqrt()` — a shear separates the singular values without changing the determinant — and it is what decides a stroke's device width (§8.4.3.2)."

[[clause]]
clause = "8.4"
title = "Graphics state"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_initial_values_are_table_51s"]
note = "The parent row for the graphics state, reviewed with §8.4.1 to §8.4.5 in the twenty-fourth session. Every parameter Table 51 lists is carried in `GraphicsState` and every one is saved and restored by `q`/`Q`. Table 52's device-dependent set is where this device declines: black generation, undercolour removal, transfer functions and halftones describe a marking device (§10.4, §10.5, §10.6), flatness is ignored by §10.7.2's own permission, smoothness is the one silence inside a partial row (§10.7.3), and overprint is answered by §8.6.7 rather than skipped. See those rows."

[[clause]]
clause = "8.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_initial_values_are_table_51s", "crates/pdf-model/tests/line_parameters.rs::a_miter_limit_below_one_is_clipped_into_range"]
note = "Table 51's initial values are `GraphicsState`'s and `Stroke`'s defaults, and are asserted rather than assumed. The clause's two general rules about parameter handling are both applied: a value must \\\"be of the correct type or have values that fall within a certain range\\\", which is why a line cap code outside Table 53's three is the initial value rather than a guess; and numeric values \\\"shall be clipped into valid range\\\" — the line width at 0, the miter limit at 1, the alpha constants at 0..1. The clause's own caution that a clipped value \\\"shall not be adjusted to reflect capabilities of the raster output device\\\" is why §8.4.3.2's one-device-pixel minimum lives in `Stroke::device_width`, applied at painting time, and is never stored back into the state. NOTE 1's \\\"either way\\\" is the sentence that found this session's silent gap: see §8.4.5."

[[clause]]
clause = "8.4.2"
title = "Graphics state stack"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_stack_saves_and_restores_them"]
note = "`q` pushes a clone of the whole `GraphicsState` and `Q` pops it, so every parameter — including the clip, the soft mask, the text state and the stroke's dash pattern — is saved and restored together, which is what \\\"a copy of the entire graphics state\\\" asks for. The clause's requirement that the two \\\"shall be balanced within a given content stream\\\" is a writer-side one: an unbalanced `Q` here pops nothing and an unbalanced `q` is discarded at the end of the stream, because a viewer that refused the file would show nothing. `MAX_STATE_DEPTH` bounds the stack against hostile input and *reports* on reaching it rather than truncating in silence."

[[clause]]
clause = "8.4.3"
title = "Details of graphics state parameters"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_operators_set_all_three", "crates/pdf-model/tests/line_parameters.rs::an_ext_gstate_sets_all_three_too"]
note = "A pointer row: the six parameters below are each in their own subclause, and all six are read. §8.4.3.1 is a sentence of introduction."

[[clause]]
clause = "8.4.3.1"
title = "General"
status = "inapplicable"
note = "One sentence introducing the subclauses below it, with no requirement of its own."

[[clause]]
clause = "8.4.3.2"
title = "Line width"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/render-cpu/tests/stroke_width.rs::a_zero_width_stroke_is_one_device_pixel_at_every_scale", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_thinnest_line_the_device_draws"]
note = "The `w` operator sets the width, and a width of 0 is drawn as \"the thinnest line that can be rendered at device resolution: 1 device pixel wide\". **This row was wrong for fifteen sessions and is the ledger's second known error**: it said a zero width \"reaches the rasteriser as the thinnest line it draws\", which was true of `tiny-skia`, whose hairline mode a zero width selects, and false of Vello, where `kurbo` expands a zero-width stroke into an empty outline and the line vanished. A row that names a *rasteriser's* convention has recorded that rasteriser rather than the clause. `Stroke::device_width` now states the minimum in `pdf-render`, where both backends read it, and the scene that would have caught the defect exists. The clause is also cited from `oracle.rs` for what it does *not* say, twice. It gives a stroke a device-resolution minimum and gives an image none, which is why `issue4436r.pdf`'s half-pixel-tall image mask is drawn at its coverage rather than snapped to a whole row. And it says the width \"shall be a non-negative number\" without saying what a *negative* one means: `issue19633.pdf` writes `-0.1 w`, this tree clamps into the domain and then applies the rule for zero, and every reference takes a different one of the three available readings — a **documented choice**, now written where it is made rather than left in a `.max(0.0)`. One operator in one of 974 documents, measured."

[[clause]]
clause = "8.4.3.3"
title = "Line cap style"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/degenerate.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_operators_set_all_three", "crates/pdf-model/tests/line_parameters.rs::an_ext_gstate_sets_all_three_too", "crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_is_a_disc_under_round_caps"]
note = "Table 53's three styles, set by `J` and — from the twenty-fourth session — by Table 57's `/LC`, which three corpus documents write and which reached nothing at all before. `line_cap` is the one place a code becomes a style, so the two routes cannot disagree. The clause's own scope is wider than an open subpath's ends: it says the style applies \\\"at both ends of open subpaths (and dashes 8.4.3.6)\\\", which is the sentence that makes a zero-length dash's cap a mark — see §8.5.3.2."

[[clause]]
clause = "8.4.3.4"
title = "Line join style"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/degenerate.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_operators_set_all_three", "crates/pdf-model/tests/line_parameters.rs::an_ext_gstate_sets_all_three_too"]
note = "Table 54's three styles, set by `j` and by Table 57's `/LJ`; the join geometry itself is each rasteriser's, and the cross-backend scenes hold them to the same pixels. Two sentences of this clause are not about joins at all and both are read elsewhere: \\\"[i]n a closed subpath that is dashed, if the first segment starts with an on-dash and the last segment ends within an on-dash, then they shall be joined\\\", which both dashers do; and the one that makes a zero-length dash on a zero-length subpath segment \\\"rendered in an implementation-dependent manner\\\" for a non-round cap, which is quoted in `degenerate.rs` as the licence for giving a square cap with no determinable direction the round cap's circle."

[[clause]]
clause = "8.4.3.5"
title = "Miter limit"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::a_miter_limit_below_one_is_clipped_into_range"]
note = "Set by `M` and by Table 57's `/ML`, clipped below at 1 because §8.4.3.5's own ratio `1 / sin(φ/2)` never goes below it. Both backends are told the limit explicitly rather than left to default, since `tiny-skia` and `kurbo` both default to 4.0 where Table 51's initial value is 10.0 — a difference that would have shown as differently bevelled corners on any document that never says `M`. \\\"When the line width is zero, the miter length is zero\\\" needs nothing: §8.4.3.2 substitutes a device pixel before any join is expanded."

[[clause]]
clause = "8.4.3.6"
title = "Line dash pattern"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_dash.rs::a_dash_array_reaches_the_stroke", "crates/pdf-model/tests/line_dash.rs::a_negative_phase_is_incremented_by_twice_the_arrays_sum", "crates/pdf-model/tests/line_dash.rs::an_odd_length_array_is_stated_as_pairs"]
note = "Implemented in the tenth session; before it, no dashed line in any document was dashed. The `d` operator was parsed and its array dropped, because the content lexer flattens an operator's array and the code read only the empty case. Both backends had implemented dashing all along. Now: the array, the phase, the negative-phase normalisation the clause states, and a degenerate array drawn solid. The per-subpath restart and the cap and join treatment are the rasteriser's, and both backends do it."

[[clause]]
clause = "8.4.4"
title = "Graphics state operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_operators_set_all_three", "crates/pdf-model/tests/line_parameters.rs::the_stack_saves_and_restores_them", "crates/pdf-model/tests/line_dash.rs::a_dash_array_reaches_the_stroke"]
note = "Table 56's ten operators. `q`, `Q`, `cm`, `w`, `J`, `j`, `M`, `d` and `gs` are executed. `ri` sets a rendering intent, which reaches colour conversion only through §8.6.5.9's black point compensation — `AbsoluteColorimetric` turns it off, and the other three intents select an ICC transform this tree does not yet choose between (see §8.6.5.8). `i` sets the flatness tolerance and is deliberately ignored: §10.7.2 says \\\"a PDF processor may ignore this parameter\\\", which is a permission rather than a gap."

[[clause]]
clause = "8.4.5"
title = "Graphics state parameter dictionaries"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::an_ext_gstate_sets_all_three_too", "crates/pdf-model/tests/line_parameters.rs::the_later_of_the_two_routes_wins"]
note = "Table 57's entries, and the clause that says a parameter \\\"can be set either with individual graphics state operators or with gs\\\". Read: `/LW`, `/LC`, `/LJ`, `/ML`, `/D`, `/RI`, `/SA`, `/BM`, `/SMask`, `/CA`, `/ca`, `/TK` and `/UseBlackPtComp`. The middle three of those were added in the twenty-fourth session — the operator half had been implemented since the interpreter's first commit (`dd857ed`) and the dictionary half read nothing, which is exactly the gap-inside-a-feature this ledger exists to find. Not read, and each for its own reason: `/BG`, `/BG2`, `/UCR`, `/UCR2`, `/TR`, `/TR2`, `/HT` and `/HTO` describe a marking device (§10.4 to §10.6); `/OP`, `/op` and `/OPM` are answered by §8.6.7 rather than skipped; `/FL` is ignored by §10.7.2's permission; `/SM` is the silence recorded under §10.7.3; `/AIS` is argued in ADR 0027. **`/Font` was the one owed entry and is implemented**: it selects a font by indirect reference rather than by resource name, so the font cache is keyed by `FontKey::Referenced(id)` as well as by name, and both text state parameters are set exactly as `Tf` sets them. `extgstate.pdf` — the one corpus document that writes it, and whose page says \"I should be courier!\" — draws with nothing reported. **This sentence said the entry was owed for several sessions after it landed**, which is the understatement a ledger has no gate against; it was found in the eighty-fifth session by reading the row against the code."

[[clause]]
clause = "8.5"
title = "Path construction and painting"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/degenerate.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_move_overrides_the_move_before_it", "crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_is_a_disc_under_round_caps"]
note = "The parent row for path construction and painting, reviewed as a family in the twenty-fourth session together with §8.4.3, because the two decide a stroke between them. The clause's own framing — construction operators, painting operators, clipping operators — is the shape of the interpreter's own dispatch. \\\"At the beginning of each page, the clipping path shall be initialised to the size of the MediaBox\\\" is where this renderer differs deliberately and says so under §14.11.2.1: it draws the *crop* box, which the oracle's third trap is about."

[[clause]]
clause = "8.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_segment_after_a_close_starts_where_the_close_returned_to"]
note = "The definitions the rest of the clause rests on, and two of them decide code. \\\"A pair of segments shall be said to connect only if they are defined consecutively\\\", so a subpath is a run of consecutive segments and the walker in `degenerate.rs` is built on exactly that. And `h` \\\"explicitly shall connect the end of a subpath back to its starting point; such a subpath is said to be closed\\\" — the open/closed distinction §8.5.3.2 then gives opposite answers to for a single-point subpath."

[[clause]]
clause = "8.5.2"
title = "Path construction operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_rectangle_is_the_five_operations_table_58_names"]
note = "A pointer row for the two subclauses below."

[[clause]]
clause = "8.5.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_move_overrides_the_move_before_it", "crates/pdf-model/tests/path_construction.rs::a_rectangle_overrides_the_move_before_it", "crates/pdf-model/tests/path_construction.rs::closing_a_closed_subpath_does_nothing", "crates/pdf-model/tests/path_construction.rs::a_rectangle_is_the_five_operations_table_58_names"]
note = "Table 58's seven operators, and three of its sentences that describe *removing* a command rather than adding one — all three implemented in the twenty-fourth session, none of which changed a pixel by itself. One `m` after another leaves \\\"no vestige of the previous m operation\\\", and because Table 58 states `re` as `x y m` and three `l`s and an `h`, an `re` overrides a preceding `m` too: six corpus documents write consecutive moves, `bug1743245.pdf` 205 of them on one page and `issue12810.pdf` 60 `m`/`re` pairs. `h` on an already-closed subpath \\\"shall do nothing\\\". They became load-bearing the moment §8.5.3.2's degenerate subpaths became marks, because each stray `m` would otherwise have been a dot the document never asked for. Not implemented, and reachable by no corpus first page: \\\"[m]ost operators that add a segment to the current path start at the current point; if the current point is undefined, an error shall be generated\\\" — such a path is passed to the rasteriser unclassified rather than refused."

[[clause]]
clause = "8.5.2.2"
title = "Cubic Bézier curves"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_implied_control_points_are_the_ones_the_clause_names"]
note = "`c`, `v` and `y`, whose difference is only which control point is implied — `v` takes the current point as the first, `y` the endpoint as the second. Cubic Béziers are the display list's only curve, so nothing is flattened or converted between here and either rasteriser; a TrueType quadratic is raised to the cubic through the same curve during glyph loading, and `render-cpu`'s `from_skia_path` raises one the same way where a dasher has produced it."

[[clause]]
clause = "8.5.3"
title = "Path-painting operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_starred_operators_are_the_even_odd_ones"]
note = "A pointer row for the three subclauses below."

[[clause]]
clause = "8.5.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_path_that_is_only_a_move_paints_nothing"]
note = "Table 59's ten painting operators, all executed: `S`, `s`, `f`, `F`, `f*`, `B`, `B*`, `b`, `b*` and `n`. `s` is `h S` and `b`/`b*` are `h B`/`h B*`, stated by calling the same `close_subpath` a written `h` calls. `B`'s NOTE — the fill and the stroke \\\"consult different values of several graphics state parameters\\\" — is why the two commands carry separate paints; §11.6.2's rule that they are nonetheless one object is a reported departure, see its row. Not implemented: \\\"[a]ttempting to execute a painting operator when the current path is undefined … shall generate an error\\\"; here it paints nothing, which is the recovery a viewer owes a malformed file."

[[clause]]
clause = "8.5.3.2"
title = "Stroking"
status = "implemented"
code = ["crates/pdf-render/src/degenerate.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_is_a_disc_under_round_caps", "crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_paints_nothing_under_butt_or_square_caps", "crates/render-cpu/tests/degenerate_subpath.rs::a_zero_length_dash_paints_a_cap_where_a_degenerate_subpath_paints_nothing", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_stroke_with_no_length"]
note = "Implemented in the twenty-fourth session, and it is the clause's *last paragraph* that had never been read. A degenerate subpath — \\\"a single-point closed path or … two or more points at the same coordinates\\\" — is a filled circle under round caps and \\\"no output\\\" under butt or projecting square ones, and a subpath that is only a trailing `m` is no output under any cap. Neither rasteriser answered that: `tiny-skia` painted a square where the clause asks for nothing, `kurbo` painted nothing where it asks for a circle, and a path of one `m` was an error on one backend and silence on the other. The rule is now `pdf-render`'s, stated once for both, with the circle this crate's own geometry rather than either round cap's. The paragraph's second half inverts the first for a *dash* of no length — \\\"the line caps shall always be painted, since their orientation is determined by the direction of the underlying path\\\" — so `[0 6] 0 d 1 J S` is a dotted line, which Vello drew as nothing at all, and a projecting square cap there faces along the path where Skia's dasher faces it upright. Four corpus first pages state marks with no length: 64 dots and 31 dotted strokes. The clause's remaining sentences are the rasterisers': what a stroke's sides are, which parameters it consults, and that \\\"[p]oints at which unconnected segments happen to meet or intersect receive no special treatment\\\"."

[[clause]]
clause = "8.5.3.3"
title = "Filling"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_starred_operators_are_the_even_odd_ones", "crates/render-cpu/tests/fill_rules.rs::the_even_odd_rule_leaves_the_hole_regardless_of_direction"]
note = "A pointer row for the three subclauses below."

[[clause]]
clause = "8.5.3.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_trailing_move_is_not_part_of_the_path"]
note = "`f` fills \\\"the entire region enclosed by the current path\\\" with the nonstroking colour, and \\\"the insides of all subpaths, considered together\\\" — one command over one path, so subpaths cannot be filled separately by construction. Open subpaths are implicitly closed by both rasterisers' fill. The exception is implemented as of the twenty-fourth session: \\\"if the last subpath in the path is a single-point open subpath (specified by a trailing m operator), it shall be disregarded and not considered to be part of the path\\\" — eleven corpus first pages end a path that way, and a path that was *only* such a subpath used to reach `tiny-skia`, which refuses it, and failed the whole page — four corpus pages, `annotation-text-without-popup.pdf`, `issue12810.pdf`, `issue6342.pdf` and `issue9017_reduced.pdf`, which were the whole of that failure class and now all four render. Partial for the sentence after it: a degenerate subpath \\\"shall be considered to enclose the single device pixel lying under that point\\\", and neither backend paints anything there. The clause calls that result \\\"device-dependent and not generally useful\\\" in the same breath, so what is owed is a pixel nothing asks to be able to see; it is recorded here rather than reported because a report would name pages on which no reader could tell."

[[clause]]
clause = "8.5.3.3.2"
title = "Non-zero winding number rule"
status = "implemented"
code = ["crates/pdf-render/src/paint.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-cpu/tests/fill_rules.rs::the_non_zero_rule_fills_a_nested_subpath_wound_the_same_way", "crates/render-cpu/tests/fill_rules.rs::the_non_zero_rule_leaves_a_hole_when_the_windings_oppose"]
note = "`FillRule::NonZero`, which both rasterisers implement natively — `tiny_skia::FillRule::Winding` and `peniko::Fill::NonZero`. It is the rule `f`, `B`, `b` and `W` use, and the display list carries it explicitly rather than by default so that a backend cannot substitute its own."

[[clause]]
clause = "8.5.3.3.3"
title = "Even-odd rule"
status = "implemented"
code = ["crates/pdf-render/src/paint.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-cpu/tests/fill_rules.rs::the_even_odd_rule_leaves_the_hole_regardless_of_direction"]
note = "`FillRule::EvenOdd`, for `f*`, `B*`, `b*` and `W*`, likewise native in both rasterisers."

[[clause]]
clause = "8.5.4"
title = "Clipping path operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_starred_operators_are_the_even_odd_ones", "crates/pdf-model/tests/path_construction.rs::a_clip_built_from_a_disregarded_path_admits_nothing", "crates/render-cpu/tests/empty_clip.rs::a_fill_inside_an_empty_clip_marks_nothing", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_clip_that_admits_nothing"]
note = "`W` and `W*` set a pending rule that the *following* painting operator applies, which is the clause's own timing: the operator \\\"shall not alter the clipping path at the point where it appears\\\" but modifies \\\"the effect of the succeeding painting operator\\\", and afterwards the clip is \\\"the intersection of the current clipping path and the newly constructed path\\\". A `Clip` is therefore a child of the current one rather than a replacement, and `q`/`Q` restore it with the rest of the state. \\\"[T]he same area that would be filled by the f operator is the area that would be used for a clip\\\" decides the edge this clause turned out to have: a path §8.5.3.3.1 has just disregarded down to nothing encloses no area, so the clip built from it **admits nothing**, and `Clip::admits_nothing` states that for both backends — `tiny-skia` refuses an empty path and `kurbo` clips to an empty region, two conventions where the clause has an answer. `issue9017_reduced.pdf` writes `568.938 673.022 m W n` around a shading; the page had never rendered at all, and the twenty-fourth session's own trailing-`m` rule is what made it visible enough to be found wrong. A `W` with *no* path in front of it is the other case — §8.5.3.1 calls it an error — and leaves the clip alone rather than blanking the rest of the stream. One edge is recorded rather than implemented: §8.11.3.1's hidden optional content still builds its clip, which is that clause's requirement rather than this one's."

[[clause]]
clause = "8.6"
