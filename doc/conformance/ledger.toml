status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/render-cpu/tests/stroke_width.rs::a_zero_width_stroke_is_one_device_pixel_at_every_scale", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_thinnest_line_the_device_draws"]
note = "The `w` operator sets the width, and a width of 0 is drawn as \"the thinnest line that can be rendered at device resolution: 1 device pixel wide\". **This row was wrong for fifteen sessions and is the ledger's second known error**: it said a zero width \"reaches the rasteriser as the thinnest line it draws\", which was true of `tiny-skia`, whose hairline mode a zero width selects, and false of Vello, where `kurbo` expands a zero-width stroke into an empty outline and the line vanished. A row that names a *rasteriser's* convention has recorded that rasteriser rather than the clause. `Stroke::device_width` now states the minimum in `pdf-render`, where both backends read it, and the scene that would have caught the defect exists. The clause is also cited from `oracle.rs` for what it does *not* say, twice. It gives a stroke a device-resolution minimum and gives an image none, which is why `issue4436r.pdf`'s half-pixel-tall image mask is drawn at its coverage rather than snapped to a whole row. And it says the width \"shall be a non-negative number\" without saying what a *negative* one means: `issue19633.pdf` writes `-0.1 w`, this tree clamps into the domain and then applies the rule for zero, and every reference takes a different one of the three available readings — a **documented choice**, now written where it is made rather than left in a `.max(0.0)`. One operator in one of 974 documents, measured."

[[clause]]
clause = "8.4.3.3"
title = "Line cap style"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/degenerate.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_operators_set_all_three", "crates/pdf-model/tests/line_parameters.rs::an_ext_gstate_sets_all_three_too", "crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_is_a_disc_under_round_caps"]
note = "Table 53's three styles, set by `J` and — from the twenty-fourth session — by Table 57's `/LC`, which three corpus documents write and which reached nothing at all before. `line_cap` is the one place a code becomes a style, so the two routes cannot disagree. The clause's own scope is wider than an open subpath's ends: it says the style applies \\\"at both ends of open subpaths (and dashes 8.4.3.6)\\\", which is the sentence that makes a zero-length dash's cap a mark — see §8.5.3.2."

[[clause]]
clause = "8.4.3.4"
title = "Line join style"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/degenerate.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_operators_set_all_three", "crates/pdf-model/tests/line_parameters.rs::an_ext_gstate_sets_all_three_too"]
note = "Table 54's three styles, set by `j` and by Table 57's `/LJ`; the join geometry itself is each rasteriser's, and the cross-backend scenes hold them to the same pixels. Two sentences of this clause are not about joins at all and both are read elsewhere: \\\"[i]n a closed subpath that is dashed, if the first segment starts with an on-dash and the last segment ends within an on-dash, then they shall be joined\\\", which both dashers do; and the one that makes a zero-length dash on a zero-length subpath segment \\\"rendered in an implementation-dependent manner\\\" for a non-round cap, which is quoted in `degenerate.rs` as the licence for giving a square cap with no determinable direction the round cap's circle."

[[clause]]
clause = "8.4.3.5"
title = "Miter limit"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::a_miter_limit_below_one_is_clipped_into_range"]
note = "Set by `M` and by Table 57's `/ML`, clipped below at 1 because §8.4.3.5's own ratio `1 / sin(φ/2)` never goes below it. Both backends are told the limit explicitly rather than left to default, since `tiny-skia` and `kurbo` both default to 4.0 where Table 51's initial value is 10.0 — a difference that would have shown as differently bevelled corners on any document that never says `M`. \\\"When the line width is zero, the miter length is zero\\\" needs nothing: §8.4.3.2 substitutes a device pixel before any join is expanded."

[[clause]]
clause = "8.4.3.6"
title = "Line dash pattern"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_dash.rs::a_dash_array_reaches_the_stroke", "crates/pdf-model/tests/line_dash.rs::a_negative_phase_is_incremented_by_twice_the_arrays_sum", "crates/pdf-model/tests/line_dash.rs::an_odd_length_array_is_stated_as_pairs"]
note = "Implemented in the tenth session; before it, no dashed line in any document was dashed. The `d` operator was parsed and its array dropped, because the content lexer flattens an operator's array and the code read only the empty case. Both backends had implemented dashing all along. Now: the array, the phase, the negative-phase normalisation the clause states, and a degenerate array drawn solid. The per-subpath restart and the cap and join treatment are the rasteriser's, and both backends do it."

[[clause]]
clause = "8.4.4"
title = "Graphics state operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::the_operators_set_all_three", "crates/pdf-model/tests/line_parameters.rs::the_stack_saves_and_restores_them", "crates/pdf-model/tests/line_dash.rs::a_dash_array_reaches_the_stroke"]
note = "Table 56's ten operators. `q`, `Q`, `cm`, `w`, `J`, `j`, `M`, `d` and `gs` are executed. `ri` sets a rendering intent, which reaches colour conversion only through §8.6.5.9's black point compensation — `AbsoluteColorimetric` turns it off, and the other three intents select an ICC transform this tree does not yet choose between (see §8.6.5.8). `i` sets the flatness tolerance and is deliberately ignored: §10.7.2 says \\\"a PDF processor may ignore this parameter\\\", which is a permission rather than a gap."

[[clause]]
clause = "8.4.5"
title = "Graphics state parameter dictionaries"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/line_parameters.rs::an_ext_gstate_sets_all_three_too", "crates/pdf-model/tests/line_parameters.rs::the_later_of_the_two_routes_wins"]
note = "Table 57's entries, and the clause that says a parameter \\\"can be set either with individual graphics state operators or with gs\\\". Read: `/LW`, `/LC`, `/LJ`, `/ML`, `/D`, `/RI`, `/SA`, `/BM`, `/SMask`, `/CA`, `/ca`, `/TK` and `/UseBlackPtComp`. The middle three of those were added in the twenty-fourth session — the operator half had been implemented since the interpreter's first commit (`dd857ed`) and the dictionary half read nothing, which is exactly the gap-inside-a-feature this ledger exists to find. Not read, and each for its own reason: `/BG`, `/BG2`, `/UCR`, `/UCR2`, `/TR`, `/TR2`, `/HT` and `/HTO` describe a marking device (§10.4 to §10.6); `/OP`, `/op` and `/OPM` are answered by §8.6.7 rather than skipped; `/FL` is ignored by §10.7.2's permission; `/SM` is the silence recorded under §10.7.3; `/AIS` is argued in ADR 0027. **`/Font` was the one owed entry and is implemented**: it selects a font by indirect reference rather than by resource name, so the font cache is keyed by `FontKey::Referenced(id)` as well as by name, and both text state parameters are set exactly as `Tf` sets them. `extgstate.pdf` — the one corpus document that writes it, and whose page says \"I should be courier!\" — draws with nothing reported. **This sentence said the entry was owed for several sessions after it landed**, which is the understatement a ledger has no gate against; it was found in the eighty-fifth session by reading the row against the code."

[[clause]]
clause = "8.5"
title = "Path construction and painting"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/degenerate.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_move_overrides_the_move_before_it", "crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_is_a_disc_under_round_caps"]
note = "The parent row for path construction and painting, reviewed as a family in the twenty-fourth session together with §8.4.3, because the two decide a stroke between them. The clause's own framing — construction operators, painting operators, clipping operators — is the shape of the interpreter's own dispatch. \\\"At the beginning of each page, the clipping path shall be initialised to the size of the MediaBox\\\" is where this renderer differs deliberately and says so under §14.11.2.1: it draws the *crop* box, which the oracle's third trap is about."

[[clause]]
clause = "8.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_segment_after_a_close_starts_where_the_close_returned_to"]
note = "The definitions the rest of the clause rests on, and two of them decide code. \\\"A pair of segments shall be said to connect only if they are defined consecutively\\\", so a subpath is a run of consecutive segments and the walker in `degenerate.rs` is built on exactly that. And `h` \\\"explicitly shall connect the end of a subpath back to its starting point; such a subpath is said to be closed\\\" — the open/closed distinction §8.5.3.2 then gives opposite answers to for a single-point subpath."

[[clause]]
clause = "8.5.2"
title = "Path construction operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_rectangle_is_the_five_operations_table_58_names"]
note = "A pointer row for the two subclauses below."

[[clause]]
clause = "8.5.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_move_overrides_the_move_before_it", "crates/pdf-model/tests/path_construction.rs::a_rectangle_overrides_the_move_before_it", "crates/pdf-model/tests/path_construction.rs::closing_a_closed_subpath_does_nothing", "crates/pdf-model/tests/path_construction.rs::a_rectangle_is_the_five_operations_table_58_names"]
note = "Table 58's seven operators, and three of its sentences that describe *removing* a command rather than adding one — all three implemented in the twenty-fourth session, none of which changed a pixel by itself. One `m` after another leaves \\\"no vestige of the previous m operation\\\", and because Table 58 states `re` as `x y m` and three `l`s and an `h`, an `re` overrides a preceding `m` too: six corpus documents write consecutive moves, `bug1743245.pdf` 205 of them on one page and `issue12810.pdf` 60 `m`/`re` pairs. `h` on an already-closed subpath \\\"shall do nothing\\\". They became load-bearing the moment §8.5.3.2's degenerate subpaths became marks, because each stray `m` would otherwise have been a dot the document never asked for. Not implemented, and reachable by no corpus first page: \\\"[m]ost operators that add a segment to the current path start at the current point; if the current point is undefined, an error shall be generated\\\" — such a path is passed to the rasteriser unclassified rather than refused."

[[clause]]
clause = "8.5.2.2"
title = "Cubic Bézier curves"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_implied_control_points_are_the_ones_the_clause_names"]
note = "`c`, `v` and `y`, whose difference is only which control point is implied — `v` takes the current point as the first, `y` the endpoint as the second. Cubic Béziers are the display list's only curve, so nothing is flattened or converted between here and either rasteriser; a TrueType quadratic is raised to the cubic through the same curve during glyph loading, and `render-cpu`'s `from_skia_path` raises one the same way where a dasher has produced it."

[[clause]]
clause = "8.5.3"
title = "Path-painting operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_starred_operators_are_the_even_odd_ones"]
note = "A pointer row for the three subclauses below."

[[clause]]
clause = "8.5.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_path_that_is_only_a_move_paints_nothing"]
note = "Table 59's ten painting operators, all executed: `S`, `s`, `f`, `F`, `f*`, `B`, `B*`, `b`, `b*` and `n`. `s` is `h S` and `b`/`b*` are `h B`/`h B*`, stated by calling the same `close_subpath` a written `h` calls. `B`'s NOTE — the fill and the stroke \\\"consult different values of several graphics state parameters\\\" — is why the two commands carry separate paints; §11.6.2's rule that they are nonetheless one object is a reported departure, see its row. Not implemented: \\\"[a]ttempting to execute a painting operator when the current path is undefined … shall generate an error\\\"; here it paints nothing, which is the recovery a viewer owes a malformed file."

[[clause]]
clause = "8.5.3.2"
title = "Stroking"
status = "implemented"
code = ["crates/pdf-render/src/degenerate.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_is_a_disc_under_round_caps", "crates/render-cpu/tests/degenerate_subpath.rs::a_single_point_closed_path_paints_nothing_under_butt_or_square_caps", "crates/render-cpu/tests/degenerate_subpath.rs::a_zero_length_dash_paints_a_cap_where_a_degenerate_subpath_paints_nothing", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_stroke_with_no_length"]
note = "Implemented in the twenty-fourth session, and it is the clause's *last paragraph* that had never been read. A degenerate subpath — \\\"a single-point closed path or … two or more points at the same coordinates\\\" — is a filled circle under round caps and \\\"no output\\\" under butt or projecting square ones, and a subpath that is only a trailing `m` is no output under any cap. Neither rasteriser answered that: `tiny-skia` painted a square where the clause asks for nothing, `kurbo` painted nothing where it asks for a circle, and a path of one `m` was an error on one backend and silence on the other. The rule is now `pdf-render`'s, stated once for both, with the circle this crate's own geometry rather than either round cap's. The paragraph's second half inverts the first for a *dash* of no length — \\\"the line caps shall always be painted, since their orientation is determined by the direction of the underlying path\\\" — so `[0 6] 0 d 1 J S` is a dotted line, which Vello drew as nothing at all, and a projecting square cap there faces along the path where Skia's dasher faces it upright. Four corpus first pages state marks with no length: 64 dots and 31 dotted strokes. The clause's remaining sentences are the rasterisers': what a stroke's sides are, which parameters it consults, and that \\\"[p]oints at which unconnected segments happen to meet or intersect receive no special treatment\\\"."

[[clause]]
clause = "8.5.3.3"
title = "Filling"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_starred_operators_are_the_even_odd_ones", "crates/render-cpu/tests/fill_rules.rs::the_even_odd_rule_leaves_the_hole_regardless_of_direction"]
note = "A pointer row for the three subclauses below."

[[clause]]
clause = "8.5.3.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::a_trailing_move_is_not_part_of_the_path"]
note = "`f` fills \\\"the entire region enclosed by the current path\\\" with the nonstroking colour, and \\\"the insides of all subpaths, considered together\\\" — one command over one path, so subpaths cannot be filled separately by construction. Open subpaths are implicitly closed by both rasterisers' fill. The exception is implemented as of the twenty-fourth session: \\\"if the last subpath in the path is a single-point open subpath (specified by a trailing m operator), it shall be disregarded and not considered to be part of the path\\\" — eleven corpus first pages end a path that way, and a path that was *only* such a subpath used to reach `tiny-skia`, which refuses it, and failed the whole page — four corpus pages, `annotation-text-without-popup.pdf`, `issue12810.pdf`, `issue6342.pdf` and `issue9017_reduced.pdf`, which were the whole of that failure class and now all four render. Partial for the sentence after it: a degenerate subpath \\\"shall be considered to enclose the single device pixel lying under that point\\\", and neither backend paints anything there. The clause calls that result \\\"device-dependent and not generally useful\\\" in the same breath, so what is owed is a pixel nothing asks to be able to see; it is recorded here rather than reported because a report would name pages on which no reader could tell."

[[clause]]
clause = "8.5.3.3.2"
title = "Non-zero winding number rule"
status = "implemented"
code = ["crates/pdf-render/src/paint.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-cpu/tests/fill_rules.rs::the_non_zero_rule_fills_a_nested_subpath_wound_the_same_way", "crates/render-cpu/tests/fill_rules.rs::the_non_zero_rule_leaves_a_hole_when_the_windings_oppose"]
note = "`FillRule::NonZero`, which both rasterisers implement natively — `tiny_skia::FillRule::Winding` and `peniko::Fill::NonZero`. It is the rule `f`, `B`, `b` and `W` use, and the display list carries it explicitly rather than by default so that a backend cannot substitute its own."

[[clause]]
clause = "8.5.3.3.3"
title = "Even-odd rule"
status = "implemented"
code = ["crates/pdf-render/src/paint.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-cpu/tests/fill_rules.rs::the_even_odd_rule_leaves_the_hole_regardless_of_direction"]
note = "`FillRule::EvenOdd`, for `f*`, `B*`, `b*` and `W*`, likewise native in both rasterisers."

[[clause]]
clause = "8.5.4"
title = "Clipping path operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs"]
test = ["crates/pdf-model/tests/path_construction.rs::the_starred_operators_are_the_even_odd_ones", "crates/pdf-model/tests/path_construction.rs::a_clip_built_from_a_disregarded_path_admits_nothing", "crates/render-cpu/tests/empty_clip.rs::a_fill_inside_an_empty_clip_marks_nothing", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_clip_that_admits_nothing"]
note = "`W` and `W*` set a pending rule that the *following* painting operator applies, which is the clause's own timing: the operator \\\"shall not alter the clipping path at the point where it appears\\\" but modifies \\\"the effect of the succeeding painting operator\\\", and afterwards the clip is \\\"the intersection of the current clipping path and the newly constructed path\\\". A `Clip` is therefore a child of the current one rather than a replacement, and `q`/`Q` restore it with the rest of the state. \\\"[T]he same area that would be filled by the f operator is the area that would be used for a clip\\\" decides the edge this clause turned out to have: a path §8.5.3.3.1 has just disregarded down to nothing encloses no area, so the clip built from it **admits nothing**, and `Clip::admits_nothing` states that for both backends — `tiny-skia` refuses an empty path and `kurbo` clips to an empty region, two conventions where the clause has an answer. `issue9017_reduced.pdf` writes `568.938 673.022 m W n` around a shading; the page had never rendered at all, and the twenty-fourth session's own trailing-`m` rule is what made it visible enough to be found wrong. A `W` with *no* path in front of it is the other case — §8.5.3.1 calls it an error — and leaves the clip alone rather than blanking the rest of the stream. One edge is recorded rather than implemented: §8.11.3.1's hidden optional content still builds its clip, which is that clause's requirement rather than this one's. **Two identical regions share one `ClipId`** since the hundred-and-forty-seventh session, which is a statement about \"the intersection of the current clipping path and the newly constructed path\" and not about drawing: page 6 of ISO 32000-2 states one region and wraps it round 303 text runs, and both backends key their per-chain work on the identifier. Exact comparison, so a producer whose rectangles differ in the last decimal place still gets two. 4.7x on that page's rasterisation, +1.22% on interpretation, and every oracle verdict unchanged. ADR 0132."

[[clause]]
clause = "8.6"
title = "Colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
