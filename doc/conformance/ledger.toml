note = "Table 75's `/PatternType`, `/Shading` and `/Matrix` are read, and the clause's closing paragraph — that a shading pattern paints a path, a glyph or an image mask alike, \"the geometry of the gradient fill is independent of that of the object being painted\" — is why the shading carries its own transform into the display list rather than the path's. **`/ExtGState` is not read**: a graphics state parameter dictionary \"to be put into effect temporarily while the shading pattern is painted\". No corpus document writes one, measured by walking every Type 2 pattern dictionary in all 974, which is why it is recorded here rather than reported."

