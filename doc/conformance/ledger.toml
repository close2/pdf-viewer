title = "Submit-form action"
status = "reported"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/src/action.rs::a_name_the_table_does_not_hold_is_not_an_action"]
note = "Refused by name, and named at runtime: `Action::Refused` carries \"SubmitForm: §12.7.6.2's submission, which needs a network\", and `viewer-ui` prints it when a click reaches one. Table 239's `/F` file specification and Table 240's flags describe a network request *a document* initiated, which belongs with `/Launch` and `/URI` on the far side of principle 3's boundary — the decision is about this machine, not about the file."

[[clause]]
clause = "12.7.6.3"
title = "Reset-form action"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/src/view.rs::a_reset_form_action_names_fields_to_reset_or_fields_to_spare", "crates/pdf-model/tests/variable_text.rs::a_reset_form_action_draws_the_default_value_instead_of_the_value"]
note = "Table 241 and Table 242 whole, and **performed**. The clause states the effect exactly — a processor \"shall set the value of the V entry in the field dictionary to that of the DV entry … If no default value is defined for a field, its V entry shall be removed\" — so `Field::read` reads `/DV` instead of `/V` up the same `/Parent` chain for a widget the action touched, and a field with no `/DV` anywhere draws nothing at all, which is what \"removed\" means for a program that does not write to the file. A check box answers from its `/DV` rather than its `/AS`, because the `/AS` in the file describes the state the action just replaced. `/Fields` is read in both of its forms and all three of the table's shapes: absent means \"all fields in the document's interactive form are reset\"; present with the flag clear means those fields and \"[a]ll descendants of the specified fields in the field hierarchy\", which §12.7.4.2's naming makes a prefix test; present with the flag set means everything except them. The reset set lives in `ViewState` beside §12.6.4.11's hidden annotations, for the same reason: nothing is written to the document. 3 corpus actions in 2 documents."

[[clause]]
clause = "12.7.6.4"
title = "Import-data action"
status = "partial"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs", "crates/viewer-core/src/interact.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/tests/forms_data.rs::an_import_data_action_names_its_file_and_its_format", "crates/pdf-model/tests/forms_data.rs::an_imported_value_is_the_one_that_is_drawn"]
note = "Read and performed, in the two halves §12.6.4.8's URI action is split into (ADR 0070). `action.rs` reads Table 243's `/F` in both the forms §7.11.3 gives a file specification and answers `Request::Import`; `viewer-core` asks its host for the named file (`Event::NeedsFile`) and applies what comes back through `FormsData::read` and `ViewState::import`; `viewer-ui` states the policy the clause deliberately does not — a single path component, resolved against the directory the open document is in, and nothing else — because a policy about files belongs to whoever owns the filesystem, and since the hundred-and-thirty-second session that is never the core. What is left is the clause's \"or any other data format that it supports\": ISO 19444-1's XFDF is the same data in XML and is declined by name, because an XML parser is a dependency and a decision rather than a clause. No corpus document carries this action."

[[clause]]
clause = "12.7.7"
