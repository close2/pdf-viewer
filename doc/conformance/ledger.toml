note = "`/FS /URL` makes `/F` a uniform resource locator rather than a path, which `FileSpec::url` returns and `FileSpec::components` refuses to split — a URL is not a path and applying §7.11.2.1's separator rule to one would invent components out of its scheme. **Reading it is not fetching it**: principle 3 gives the renderer no network, so a document asking this program to fetch a URL still gets nothing, and that is the intended answer rather than a missing feature — the same position §12.6.4.8's URI action takes, which resolves and prints rather than opens. The clause's own encoding note is small and exact — 7-bit US-ASCII is a strict subset of PDFDocEncoding, so a URL is already a text string under §7.9.2.2's third encoding."

[[clause]]
