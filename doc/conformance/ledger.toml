status = "implemented"
code = ["crates/pdf-model/src/type3.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/type3.rs::each_shown_code_runs_its_glyph_description", "crates/pdf-model/tests/type3.rs::a_width_advances_through_the_font_matrix", "crates/pdf-model/tests/type3.rs::a_code_with_no_glyph_description_paints_nothing_and_still_advances", "crates/pdf-model/tests/type3.rs::a_glyph_that_shows_itself_reaches_a_bound_and_stops"]
note = "Implemented in the tenth session; before it a Type 3 font was refused. All four of the clause's steps, the CTM it defines for a glyph description, the inherited graphics state, the font's /Resources with the page's as fallback, /Widths read through /FontMatrix, and both of Table 111's operators including d1's colour restriction. /FontBBox is read by nobody, which the clause permits — it says a processor may make no assumptions from it. A glyph description whose marks are an inline image draws nothing yet and reports, which is §8.9.7's gap rather than this one's: 10 corpus documents are in that position."

[[clause]]
clause = "9.6.5"
title = "Character encoding"
status = "partial"
code = ["crates/pdf-font/src/encoding.rs", "crates/pdf-font/src/lib.rs", "crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances", "crates/pdf-font/src/lib.rs::a_symbol_subtable_is_addressed_through_the_high_byte_of_its_range"]
note = "The base encodings, /Differences over them, and the symbolic/nonsymbolic distinction the clause turns on. MacExpertEncoding is the one named encoding absent: a font naming it is refused and reported rather than substituted. Every code the /Differences array names is kept even where the name is one no encoding defines, which is what §9.6.5.4's undefined-entry sentence does and does not say."

[[clause]]
clause = "9.6.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/encoding.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/encoding.rs::the_assignments_made_only_in_the_notes_are_present"]
note = "Table 112's encoding dictionary in full — /BaseEncoding, /Differences, and the defaults the clause gives when /BaseEncoding is absent — and Annex D's tables for StandardEncoding, WinAnsiEncoding and MacRomanEncoding, extracted from the standard's own Table D.2 rather than written from memory. MacExpertEncoding is absent and reported."

[[clause]]
clause = "9.6.5.2"
title = "Encodings for Type 1 fonts"
status = "partial"
code = ["crates/pdf-font/src/cff.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances", "crates/pdf-font/src/lib.rs::an_uncovered_code_has_no_glyph_rather_than_a_guessed_one"]
note = "Implemented for the Type 1 programs this tree reads, which are the CFF ones: names from the encoding are resolved through the program's charset, and the font dictionary's /Encoding overrides the program's built-in one as the clause requires. A bare Type 1 /FontFile is not read at all and is reported, so the clause's .notdef substitution sentence has no code to apply to yet — no corpus page one reaches one."

[[clause]]
clause = "9.6.5.3"
title = "Encodings for Type 3 fonts"
status = "implemented"
code = ["crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-model/tests/type3.rs::each_shown_code_runs_its_glyph_description", "crates/pdf-model/tests/type3.rs::a_code_with_no_glyph_description_paints_nothing_and_still_advances"]
note = "The mapping is taken entirely from the font's /Encoding, and there is no default glyph name — a code the encoding does not name reaches nothing, as the clause's NOTE requires. /BaseEncoding is read underneath /Differences because Table 112 defines it for any encoding dictionary; there is no built-in encoding to fall back on, since §9.6.5.1 excepts Type 3 fonts from having one."

[[clause]]
clause = "9.6.5.4"
title = "Encodings for TrueType fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_symbol_subtable_is_addressed_through_the_high_byte_of_its_range", "crates/pdf-font/src/lib.rs::a_unicode_subtable_is_reached_through_the_adobe_glyph_list"]
note = "All five routes from a code to a glyph, implemented in the eighth session — see ADR 0015. The predecessor was one line that covered about one and a half of them and was worth 15 contradicted corpus pages."

