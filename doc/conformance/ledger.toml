[[clause]]
clause = "10.7"
title = "Scan conversion details"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs", "crates/pdf-render/src/paint.rs"]
note = "Reviewed in the sixteenth session, as the family ADR 0025's image resampling lives in — and nothing in this tree had cited §10.7 before that. The subclauses below split three ways: two parameters the clause lets a processor ignore and which are ignored (§10.7.2, §10.7.3), one set of rules this renderer deliberately departs from in three places because it draws to a display rather than to a marking device (§10.7.4), and one requirement that is neither implemented nor reported (§10.7.5). §10.7.1 is what licenses the departures and is quoted where they are taken."

[[clause]]
clause = "10.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-render/src/paint.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_basic_scene"]
note = "The one requirement is that scan conversion happens — \"the final step of rendering shall be scan conversion\" — and both backends are that step. The clause's substance for this project is its NOTE, which says the algorithm is not part of PDF: \"Different implementations can perform scan conversion in different ways; techniques that are appropriate for one device could be inappropriate for another.\" That sentence is what makes §10.7.4's departures choices rather than defects, and it is quoted in `Image::area_averaged` beside the rule it licenses departing from. Read it before concluding that any §10.7.4 rule is binding on a screen."

[[clause]]
clause = "10.7.2"
title = "Flatness tolerance"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "The normative content is a permission, and it is exercised: \"PDF processors may choose to ignore any flatness tolerance specified within a PDF file.\" The `i` operator is matched and discarded with `MP`, `DP`, `BX` and `EX`, and `/FL` in an `/ExtGState` is not read; no corpus document writes `/FL` in one at all. `tiny-skia` and Vello each flatten curves to their own tolerance, which the clause's NOTE 2 anticipates by warning that a large value makes the result \"unpredictable\" — so honouring a document's number could only ever make a curve worse. Nothing is owed and nothing is silent, because the clause itself grants the omission."

[[clause]]
clause = "10.7.3"
title = "Smoothness tolerance"
status = "partial"
code = ["crates/pdf-render/src/shading.rs", "crates/pdf-model/src/mesh.rs"]
test = ["crates/pdf-render/src/shading.rs::a_triangle_inside_one_pixel_is_subpixel"]
note = "`/SM` is read nowhere. 23 corpus documents write one. What the clause asks for is a bound on \"the allowable colour error between a shading approximated by piecewise linear interpolation and the true value\", and this renderer has one fixed internal bound instead of a per-document one: a `Ramp` carries 256 samples, and `Triangle::is_subpixel` stops subdividing a mesh triangle smaller than a sample. The clause contemplates exactly that — \"each output device may have internal limits on the maximum and minimum tolerances attainable\" — so a document asking for a *coarser* shading than we draw is given a finer one, which cannot be a fidelity error. A document asking for finer than 1/256 of a component is not honoured and nothing says so, which is this row's silence and is why it is `partial` rather than `implemented`. It is the same shape as §8.9.5.2's `/Decode`: a clause half implemented and quiet about the other half."

[[clause]]
clause = "10.7.4"
title = "Scan conversion rules"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/pdf-render/src/paint.rs::a_block_of_samples_becomes_their_mean", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_deeply_reduced_image"]
note = "Three deliberate departures, all in one direction, and the sixteenth session is the first time any of them was written down. (1) \"A shape shall be scan-converted by painting any pixel whose half-open square region intersects the shape, no matter how small the intersection is\" — both backends anti-alias instead, so a partly covered pixel is partly painted. This has been true since the first commit and cited nothing. (2) The same rule's \"the area covered by painted pixels shall always be at least as large as the area of the original shape\" fails for the same reason. (3) \"There shall not be averaging over the pixel area\" — `Image::area_averaged` averages, which is ADR 0025 and what made `bug1001080.pdf` legible and `firefox_logo.pdf` and `french_diacritics.pdf` agree with the reference consensus. All three are licensed by §10.7.1's NOTE that the algorithm is not defined by PDF, and all three describe a device that quantises coverage to whole pixels, which a display does not. What *is* honoured: pixel boundaries on integers, half-open regions, a zero-width stroke drawn as the thinnest line the device can produce (the clause's own permission), and glyphs scan-converted by the font rasteriser's own algorithm, which the clause's last sentence allows."

[[clause]]
clause = "10.7.5"
title = "Automatic stroke adjustment"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/render-cpu/tests/stroke_width.rs::stroke_adjustment_promotes_only_a_sub_half_pixel_line", "crates/pdf-model/tests/colour_paths.rs::stroke_adjustment_is_read_and_restored", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_thinnest_line_the_device_draws"]
note = "The clause has two requirements and the nineteenth session implemented the one a display can state exactly: \"If stroke adjustment is enabled and the requested line width, transformed into device space, is less than half a pixel, the stroke shall be rendered as a single-pixel line.\" `/SA` is read from Table 58 and carried on the `Stroke`, and `Stroke::device_width` makes such a stroke one device pixel — the same width the clause's NOTE says a zero width means, which is why both rules live in one function that both backends call. 49 corpus documents set the parameter true. Not implemented: the first requirement, that \"the line width and the coordinates of a stroke shall automatically be adjusted as necessary to produce lines of uniform thickness … no more than half a pixel different\". That is a grid-fitting of the *coordinates*, and the non-uniformity it exists to remove is an artefact of the binary scan conversion §10.7.4 describes — Figure 70 shows an aliased line — which this tree already departs from by anti-aliasing. An anti-aliased stroke's coverage-weighted thickness is the requested width at every position, so the clause's stated purpose is met by a different route; what is not met is uniformity of the *rasterised* line on a device that quantises coverage. That is a departure of the same family as §10.7.4's three, licensed by §10.7.1's NOTE, and nothing reports it because there is no page on which this device could do better. ADR 0028."

