note = "Descriptive. Carries the aggregate of the four below."

[[clause]]
clause = "8.11.4.2"
title = "Optional content properties dictionary"
status = "implemented"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_document_with_no_properties_dictionary_draws_everything"]
note = "/OCProperties is read from the catalog, /OCGs gives the document's groups and /D the default configuration. A file with no /OCProperties has its optional content structures ignored entirely, which the clause makes decisive rather than a fallback."

[[clause]]
clause = "8.11.4.3"
title = "Optional content configuration dictionaries"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_base_state_of_off_hides_the_groups_the_on_array_does_not_name"]
note = "/BaseState, /ON, /OFF and /Intent are honoured. Six entries are not read: /Name and /Creator name the configuration for a user interface, /Order and /ListMode describe how to present the groups in one, /RBGroups and /Locked constrain how a user may change them, and /AS is §8.11.4.4's. None affects the initial state. /Configs is not read either: the alternate configurations exist to be chosen between, which needs someone to choose."

[[clause]]
clause = "8.11.4.4"
title = "Usage and usage application dictionaries"
status = "silent"
note = "Not implemented and not reported. A usage dictionary describes when a group should be on — by zoom level, by language, by whether the page is being printed — and §8.11.4.5 has an interactive processor apply the /AS array's View entries over the initial state. This viewer has a window, so those requirements do apply to it, and a layer that should switch itself off is drawn with nothing said. It is `silent` rather than `reported` because nothing in the tree looks at /Usage or /AS to have something to report."

[[clause]]
clause = "8.11.4.5"
title = "Determining the state of optional content groups"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_base_state_of_off_hides_the_groups_the_on_array_does_not_name"]
note = "Steps a) and b) — the base state over every group, then the array opposite to it — are implemented, and the clause calls their result the initial state used by all PDF processors. Everything after that sentence is about an interactive processor and is not: usage application dictionaries for View, Print and Export events, and manual overrides surviving reapplication. See §8.11.4.4."

