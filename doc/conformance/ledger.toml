note = "Steps (a) to (e), which Algorithm 6 runs at revisions 3 and 4. Step (f) appends \"16 bytes of arbitrary padding\", which is why Algorithm 6 compares only the first sixteen; the corpus's files write zeros there and nothing may depend on that."

[[clause]]
