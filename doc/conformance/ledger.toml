note = "Submit, reset and import. **Reset is performed**, because it is the one of the three whose whole effect is a display change: §12.7.6.3 sets a field's value to its `/DV`, and §12.7.4.3 draws whatever that value is. The other two are refused by name at runtime — a submission is a network request a document initiated, an import wants a filesystem — which is `reported` rather than `silent` on their own rows. `partial` for that split."

[[clause]]
