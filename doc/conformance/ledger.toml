[[clause]]
clause = "8.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
