note = "Both of the two the clause names, and in PDF 2.0 there are only two: \"an image XObject … represents a sampled visual image\" and \"a form XObject … is a self-contained description of an arbitrary sequence of graphics objects\". Table 86 says the same of `Do` — \"the effect of Do depends on the value of the XObject's Subtype entry, which may be Image … or Form\". PostScript XObjects are gone from this edition, so a `/Subtype` that is neither has no defined effect and is **reported by name** rather than ignored. This note said the opposite in its first draft, on the strength of a clause of an earlier edition; the code was checked and the note was wrong."

