note = "Introductory. Its one claim — that a content stream and its resource dictionary \"in combination … form a self-contained entity\" — is the shape of `Interpreter::run`, which takes the two together and nothing else about the document except what a resource resolves to."

[[clause]]
clause = "7.8.2"
title = "Content streams"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-model/tests/content_streams.rs::the_silence_stops_at_the_matching_ex", "crates/pdf-model/tests/content_streams.rs::compatibility_sections_nest"]
note = "Every clause of it. The stream is lexed by §7.2's rules and executed in order; the five places the clause names as also being content streams — pages, form XObjects, patterns, Type 3 glyph descriptions and annotation appearances — all reach the same interpreter. \"An operand is a direct object belonging to any of the basic PDF data types except a stream … Indirect objects and object references shall not be permitted at all\" holds by construction: the content lexer has no reference token, so a `1 0 R` in a content stream lexes as two integers and an unrecognised operator. Table 33's `BX` and `EX` were matched and ignored for thirty-one sessions and are now the compatibility *section* the clause defines, kept as a nesting depth because \"these operators shall occur in pairs and may be nested\" — and it is the one place in this interpreter where unsupported input is deliberately silent, because the file has said in advance that ignoring it is appropriate. No corpus document exercises it: all nine that report an unrecognised operator report one no producer meant."

[[clause]]
clause = "7.8.3"
title = "Resource dictionaries"
status = "partial"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs", "crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::a_user_unit_on_an_ancestor_is_not_inherited"]
note = "All four of the clause's ways a resource dictionary reaches a content stream: a page's `/Resources`, inherited through the page tree (§7.7.3.4); a Type 3 font's own; a form XObject's, a pattern's and an appearance stream's; and the fourth, for files \"written obeying earlier versions of PDF\" that omit it — \"All resources that are referenced from those forms and fonts shall be inherited from the resource dictionary of the page\", which is why every resource lookup falls back to the enclosing dictionary rather than failing. Of Table 34's eight resource types, seven are read; `/ProcSet` is deprecated in PDF 2.0 and §14.2 makes it advisory, so nothing looks at it. The partial is `/Properties`, which is read only for `/OC` (§8.11.3.3) and not for §14.6.2's marked-content property lists in general — which is clause 14's gap rather than this one's."

[[clause]]
clause = "7.9"
title = "Common data structures"
status = "partial"
