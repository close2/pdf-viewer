note = "Read in the lexer and, since §12.7.4.3's variable text, written as well: the appearance stream this tree constructs shows a field's value as a literal string, so the clause's escapes have to be produced rather than only consumed. `variable_text::show` escapes the two parentheses and the reverse solidus the clause names and writes every other non-printable byte as its three-digit octal escape, which is the same subclause's octal form. The reading side takes all eight escape sequences, the line continuation, and the rule that an unbalanced parenthesis is a lexical error."

[[clause]]
