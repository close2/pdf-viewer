[[clause]]
clause = "7.3.7"
title = "Dictionary objects"
status = "implemented"
code = ["crates/pdf-syntax/src/object.rs", "crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/src/parser.rs::a_repeated_key_keeps_the_first_value", "crates/pdf-syntax/src/parser.rs::a_null_value_reads_the_same_as_an_absent_key"]
note = "Keys are names and only names — a token of any other kind where a key belongs is skipped rather than being fatal, which loses one entry instead of the dictionary. Entries are unordered, which a `BTreeMap` makes true rather than claimed. \"A dictionary entry whose value is null shall be treated the same as if the entry does not exist\" holds without a rule for it: `Document::get_key` answers `Object::Null` for a key that is absent, so the two are the same value at every reader. \"Multiple entries in the same dictionary shall not have the same key\" is a requirement on the *file* and the clause states no recovery; the parser keeps the first, and `inline_image.rs` documents the one place that is decided differently and why. Annex C's implementation limits are `Limits::max_dict_len`."

