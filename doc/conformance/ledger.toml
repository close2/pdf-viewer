note = "Table 77's `/ShadingType` and `/ColorSpace` are required and read; a `Pattern` space is refused as the table requires. **`/BBox` landed in the twenty-eighth session** — \"applied as a temporary clipping boundary when the shading is painted, in addition to the current clipping path\", in the shading's *target* coordinate space, so it nests inside the state's clip and is carried by the caller's transform rather than the shading's own. Five corpus documents write one and not one changes by a pixel, so the fixture in `shadings.rs` is the whole of what defends it. Not implemented: `/Background`, which fills \"those portions of the area to be painted that lie outside the bounds of the shading object\" and only \"when the shading is used as part of a shading pattern, not when painted directly with the sh operator\" — 2 corpus documents write one. `/AntiAlias` is read nowhere and is a hint with a default of false, in the same class as §10.7.2's flatness; 19 documents set it."

[[clause]]
clause = "8.7.4.4"
title = "Colour space: special considerations"
status = "partial"
code = ["crates/pdf-model/src/shading.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/shadings.rs::a_shading_in_another_colour_space_is_converted"]
note = "The clause's licence to interpolate is what `Ramp` is: \"PDF processors may actually compute colour values only for some subset of the points in the target area, with the colours of the intervening points determined by interpolation\", bounded by §10.7.3's smoothness tolerance — which this tree fixes at 256 samples rather than reading, a silence recorded under §10.7.3. Types 2 and 3 always carry a `/Function`, and NOTE 3 exempts those from the rule about *where* interpolation happens, so sampling the function and converting each sample is exactly what the clause describes. **The departure is in the mesh types**: a Type 4 to 7 shading without a function interpolates between vertex colours, and the clause says that for a CIE-based space \"all gradient fill calculations shall be performed in that space\" with conversion \"only after all interpolation calculations have been performed\". Here a vertex colour is converted to device RGB when the mesh is read, so the interpolation happens in device RGB. An `Indexed` space's values are converted to the base space immediately, which the clause requires."

