[[clause]]
clause = "11.6.4.2"
title = "Object shape and opacity"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_zero_sample_paints_the_current_colour_and_a_one_leaves_the_page_alone", "crates/pdf-model/tests/image_masks.rs::an_explicit_mask_paints_the_base_image_only_where_it_marks"]
note = "Every clause of the list holds here. A path or a glyph has shape 1 inside and 0 outside, which is what filling an outline does; an image has shape 1 inside its rectangle \"further modified by an explicit or colour key mask\", which became true in the fourteenth session (§8.9.6.3, §8.9.6.4); an image mask has shape 1 where it paints; a pattern's shape is constrained by the objects that define it, which falls out of replaying a tiling pattern's content stream. The last one is worth naming because it is satisfied by *absence*: the shape of an `sh` is its geometry \"disregarding the Background entry in the shading dictionary\", and nothing in this tree reads /Background at all. The intrinsic opacity of 1.0 everywhere is likewise structural — opacity enters only through `ca`, `CA` and a mask."

[[clause]]
clause = "11.6.4.3"
title = "Mask shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_soft_mask_overrides_an_explicit_mask"]
note = "The clause's precedence is implemented as of the fourteenth session, and it was read here rather than in §8.9: an image's /SMask, and a non-zero /SMaskInData, \"shall override any explicit or colour key mask specified by the image dictionary's Mask entry\". Before that a file writing both would have had the loser applied. The graphics state's own /SMask is **applied** — `build_soft_mask` evaluates its group and every object painted while it is in force draws through it, since the eighteenth session (ADR 0027) — and only a mask this reader cannot use at all is reported. **This sentence said \"reported rather than applied (28 corpus documents)\" for a hundred and forty sessions after that stopped being true**, which is ADR 0101's shape and was found by the sweep for notes whose stated blocker has expired. What is not read is /AIS, and the reason is not the one this row used to give either. It said the distinction \"cannot show until §11.4.6 exists\"; §11.4.6 was built in the seventy-first session and the distinction still cannot show, because this renderer carries **one alpha per pixel** and §11.3.7.1 makes alpha the product `α = f × q` of shape and opacity — so a mask value multiplies the same alpha whichever of the two it is called. The places that would need them apart are knockout and non-isolated groups, and both are already reported as departures. `content.rs` has carried that argument in a comment beside the code the whole time; the row inherited a worse one. No corpus document writes /AIS."

[[clause]]
clause = "11.6.4.4"
title = "Constant shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
