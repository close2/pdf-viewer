test = ["crates/pdf-syntax/tests/encryption.rs::a_document_with_a_password_opens_with_it_and_not_without"]
note = "All three steps, including the twenty decryptions under keys XORed with a counter running from 19 down to 0 — the reverse of Algorithm 3's 1 to 19. No corpus document is known to be opened by its owner password at revision 4 or earlier, so this path is exercised only by files where both passwords are the same; the reverse counter order is stated by the clause and is not otherwise pinned."

[[clause]]
clause = "7.6.4.4.7"
title = "Algorithm 8: Computing the encryption d ictionary's U (user password) and UE (user encryption) values (Security handlers of revision 6)"
status = "writer-side"
note = "Computes the /U and /UE entries a writer stores. Their *format* is read by §7.6.4.3.3, whose row records that."

[[clause]]
clause = "7.6.4.4.8"
title = "Algorithm 9: Computing the encryption dictionary's O (owner password) and OE (owner encryption) values (Security handlers of revision 6)"
status = "writer-side"
note = "Computes the /O and /OE entries a writer stores; read by §7.6.4.3.3."

[[clause]]
clause = "7.6.4.4.9"
title = "Algorithm 10: Computing the encryption dictionary's Perms (p ermissions) value (Security handlers of revision 6)"
status = "writer-side"
note = "Computes the /Perms block a writer stores. Its layout — permissions in bytes 0 to 7 low-order first, /EncryptMetadata in byte 8, the \"adb\" marker in bytes 9 to 11 — is read by §7.6.4.4.12."

[[clause]]
clause = "7.6.4.4.10"
title = "Algorithm 11: Authenticating the user password (Security handlers of revision 6)"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
