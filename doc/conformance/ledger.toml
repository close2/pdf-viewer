note = "Not implemented, and named at runtime: a /Filter that is not /Standard produces `SyntaxError::UnsupportedEncryption` quoting the name. What it would take is not a cipher but a public-key infrastructure — CMS enveloped data (RFC 5652) and X.509 certificates, plus access to the user's private keys — which is a dependency and a threat model of its own. No corpus document uses one."

