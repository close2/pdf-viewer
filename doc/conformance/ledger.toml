status = "implemented"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_document_with_no_properties_dictionary_draws_everything"]
note = "/OCProperties is read from the catalog, /OCGs gives the document's groups and /D the default configuration. A file with no /OCProperties has its optional content structures ignored entirely, which the clause makes decisive rather than a fallback."

[[clause]]
clause = "8.11.4.3"
title = "Optional content configuration dictionaries"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs", "crates/viewer-ui/src/chrome.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_base_state_of_off_hides_the_groups_the_on_array_does_not_name", "crates/viewer-ui/tests/panel.rs::a_layer_switch_throws_unless_the_document_locked_it"]
note = "Table 99, all of it but two entries. `/BaseState`, `/ON`, `/OFF` and `/Intent` decide the initial state; `/AS` is §8.11.4.4's and is applied for the `View` event; `/RBGroups` reached the code in the sixty-second session when §12.6.4.13's `/PreserveRB` made it load-bearing; and `/Order`, `/ListMode`, `/Locked` and a group's `/Name` reached it in the sixty-seventh, which is the whole of what a layer panel reads. `/Order` is kept as a *tree* with the clause's own distinction preserved — a nested array with a leading text string is a label and \"not to communicate actual nesting\", one without is nesting — because a panel that drew both alike would tell a person that a heading is a layer. `/Locked` binds `ViewState::set_group` and deliberately not `Action::SetOcgState`, which is the clause's own division: a locked group \"cannot be changed through the user interface\", and a processor \"may allow the states … to be changed by means other than the user interface\". `partial` for two: `/ListMode`'s `VisiblePages` is carried and not acted on, because which pages are visible is a question about a window this crate does not have, and `/Configs` is unread — the alternate configurations exist to be chosen between, which needs someone to choose. `/Name` and `/Creator` on the *configuration* are unread for the same reason. **The panel `/Order` was read for arrived in the hundred-and-sixty-seventh session** — `viewer_ui::chrome`, which draws the tree with the clause's label-versus-nesting distinction intact and offers the switch on everything but a `/Locked` group — so the two `partial` reasons above are now the only ones."

[[clause]]
clause = "8.11.4.4"
title = "Usage and usage application dictionaries"
status = "partial"
code = ["crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_usage_application_dictionary_turns_a_group_off", "crates/pdf-model/tests/optional_content.rs::every_category_of_every_dictionary_has_to_agree", "crates/pdf-model/tests/optional_content.rs::a_zoom_category_is_answered_at_the_pages_stated_size"]
note = "**The ledger's last original `silent` row, closed in the thirty-fifth session.** Table 101's usage application dictionaries are applied for the `View` event, which §8.11.4.5 makes the only one a viewer runs — `Print` and `Export` apply \"for the duration of the print operation\" and of the export. Table 100's `View`, `Print`, `Export` and `Zoom` categories are answered, with both ANDs the clause states: across the categories of one dictionary and across every dictionary a group appears in. Partial for two categories that are questions about this *processor* rather than about the document — `User` matches \"the user's identification\" and `Language` \"the language and locale of the application\" — where the configuration's own state stands and the page reports what it could not answer, rather than taking the clause's \"otherwise OFF\" on a question nobody asked. `Zoom` is answered at a magnification of 1.0, the size a page is drawn at when nothing states otherwise, because a display list carries no magnification; that is a choice and it is recorded on `apply_auto_states`. Eight corpus documents carry an `/AS` and every one pairs a `View` event with the `View` category over groups that state `ON`, so the mechanism runs on all of them and changes nothing."

[[clause]]
clause = "8.11.4.5"
