status = "writer-side"
note = "Computes the /Perms block a writer stores. Its layout — permissions in bytes 0 to 7 low-order first, /EncryptMetadata in byte 8, the \"adb\" marker in bytes 9 to 11 — is read by §7.6.4.4.12."

[[clause]]
clause = "7.6.4.4.10"
