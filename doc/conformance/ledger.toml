[[clause]]
clause = "11.3.5.3"
title = "Non-separable blend modes"
status = "implemented"
code = ["crates/render-cpu/src/blend.rs", "crates/render-gpu/src/lib.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_every_blend_mode", "crates/render-cpu/src/blend.rs::hue_of_red_over_blue_is_the_clauses_arithmetic"]
note = "Table 135's four non-separable modes — Hue, Saturation, Color, Luminosity — written from the clause's `Lum`, `ClipColor`, `SetLum` and `SetSat` in `render-cpu/src/blend.rs`, because three of the four were wrong when handed to `tiny-skia`: the thirty-seventh session's cross-backend scene found `Hue`, `Color` and `Luminosity` 113 of 255 from Vello, and the clause settled which was right rather than leaving a tie. Red over blue in `Hue` is `SetLum(SetSat(Cs, Sat(Cb)), Lum(Cb))`, which after `ClipColor` is 0.367; `tiny-skia` produced 0.81, the value before the clip. All sixteen modes now agree between the backends to the channel, which is two independent implementations of the clause's own arithmetic rather than one checked against itself — the functions stay in `render-cpu` for exactly that reason (ADR 0047). `ClipColor` is defined only where `Lum(C)` is itself in range, which the clause supplies by reaching it solely through `SetLum`."

[[clause]]
clause = "11.3.6"
title = "Interpretation of alpha"
status = "partial"
code = ["crates/pdf-render/src/backend.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "The weighted average of backdrop, source and blended colour that both backends evaluate through their rasterisers, and the sentence that decides three things this session leaned on: \"An alpha value of αs = 0.0 or αb = 0.0 results in no blend mode effect\". That is why §11.4.7's transparent page group changes every blend mode over an unpainted area — the backdrop alpha is zero there, so the blend collapses to the source colour — and why an element's blend mode has no effect inside an isolated knockout group (§11.4.6). NOTE 2's undefined colour at zero result alpha is what a premultiplied raster represents naturally. For the twelve separable modes the formula is tiny-skia's and Vello's rather than this tree's, and what is implemented here is the choice of what they composite onto; for §11.3.5.3's four it is `render-cpu/src/blend.rs`, which evaluates this clause's weighted average itself with the premultiplication folded in (ADR 0047). `partial` for the first half."

[[clause]]
clause = "11.3.7"
title = "Shape and opacity computations"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/transparency.rs", "crates/pdf-model/tests/image_masks.rs"]
note = "Aggregate of the three below, read as a family in the fifteenth session because an image's masks are where shape and opacity meet in this tree. Alpha is the product of shape and opacity, which is what `image::combine_on_the_finer_grid` computes when a stencil's shape multiplies a soft mask's opacity, and what a `Color`'s alpha carries everywhere else. What is absent is the distinction: this renderer holds one alpha per paint, and only a transparency group can tell shape from opacity (§11.3.7.3, §11.4.6)."

[[clause]]
clause = "11.3.7.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_soft_mask_finer_than_its_image_keeps_its_own_resolution"]
note = "One sentence: alpha is shape times opacity. Held where the two are separately known — an image mask's shape multiplied by an `/SMask`'s opacity — and structurally elsewhere, since a paint carries one alpha and every source of it multiplies in. The clause's NOTE about anti-aliased edges being *shape* rather than opacity is the rasterisers' business and both treat coverage as shape."

[[clause]]
clause = "11.3.7.2"
title = "Source shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/transparency.rs", "crates/pdf-model/tests/image_masks.rs"]
note = "Six sources, three of shape and three of opacity. Object shape is what filling an outline does, and an explicit mask's \"1.0 in the unmasked portions\" is applied as of the fourteenth session (§8.9.6.3); mask opacity is an image's own `/SMask` (§11.6.5.2) and is reported for the graphics state's (§11.6.5.1); both constants are `ca` and `CA`. Missing: the shape of a *group*, which is the union of what it contains, and `/AIS`, which decides whether a mask and the constants are read as shape or as opacity. **The first of those used to say \"needs §11.4.6\", and that reason expired in the seventy-first session** when knockout groups were drawn — three sessions after this note was written, and unnoticed until a sweep for expired reasons in the hundred-and-fifty-first. What §11.4.6 needed was a shape *where the shape is the coverage*, which `tiny-skia` and Vello both supply through the same mask a fill uses; what this row still owes is a group's shape as a value in its own right, carried beside the colour, which no backend here has and which §11.4.6 turned out not to require. ADRs 0093, 0107, 0108's class."

[[clause]]
clause = "11.3.7.3"
title = "Result shape and opacity"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "The union formulas for the shape and opacity a compositing step leaves behind. The alpha half is what every raster here carries, and a transparency group's result is now that union rather than nothing (§11.4.1). What is still absent is the separation: this renderer holds one alpha per pixel, the product of shape and opacity, where the clause keeps two. §11.4.6 names the one construction that needs them apart — \"The separate shape value shall be computed in any group that is subsequently used as an element of a knockout group\" — and that is reported rather than silent since the seventeenth session, which is why this row is no longer `silent` either."

[[clause]]
clause = "11.3.8"
title = "Summary of basic compositing computations"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs"]
test = ["crates/render-cpu/tests/soft_mask.rs::a_constant_mask_interpolates_between_the_object_and_the_backdrop"]
note = "A summary of §11.3.3 through §11.3.7, restating them with the group cases folded in. Nothing new is required of a reader; the rows above are where each of its lines is answered."

[[clause]]
clause = "11.4"
title = "Transparency groups"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Aggregate of the eight below, read as a family in the seventeenth session with transparency groups as the demand item. A group's elements are composited onto a transparent backdrop and the result painted once under the constant alpha and blend mode in force at Do — §11.4.5's isolated, non-knockout group, which is what both backends express natively — **except where §11.4.4's NOTE 5 says no group is needed**, which is a non-isolated group composited with Normal, alpha 1.0 and no mask: its elements are drawn inline onto the page they were always going to composite onto, which is both correct and less work than the group it replaces. §11.4.7's page group is implemented and was the seventeenth session's largest finding. Knockout (§11.4.6) is reported where an element's shape is not the coverage it is drawn with, and so is the non-isolated group NOTE 5 cannot flatten whose elements blend."

[[clause]]
clause = "11.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "A group is \"collected together and composited to produce a single colour, shape, and opacity at each point\" and the result treated as one object, which is what Command::Group asks a backend for. Of the four further attributes this clause lists three are here — the compositing inputs applied to the group as a whole, isolation, knockout — and the fourth is §11.5's: a group's result used as a source of shape or opacity for a soft mask, still reported rather than built."

[[clause]]
clause = "11.4.2"
title = "Notation for group compositing computations"
status = "inapplicable"
note = "Notation, and Table 138's renaming of §11.3's variables so that §11.4.4 can state its recurrences. There is no requirement to implement; marking it implemented would claim code for a clause that asks for none, which is the reading §11.6.1 already has."

[[clause]]
clause = "11.4.3"
title = "Group structure and nomenclature"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "The three backdrops this clause distinguishes. The group backdrop is what is already on the page; the initial backdrop is transparent here, which is the isolated choice (§11.4.5); the immediate backdrop is what a group's own buffer accumulates, and is right because the elements are drawn into that buffer in order. Its last requirement — \"A PDF processor shall ensure that the backdrop's contribution to the overall result is applied only once\" — holds by construction, since a transparent initial backdrop has no contribution to remove. What is absent is the non-isolated reading of the same sentence; see §11.4.4."

[[clause]]
clause = "11.4.4"
title = "Group compositing computations"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_non_isolated_group_blends_with_the_page_behind_it", "crates/pdf-model/tests/transparency_groups.rs::a_non_isolated_group_reports_only_when_an_element_blends"]
note = "The recurrence for a non-isolated, non-knockout group, and NOTE 3's backdrop removal at the end of it. Two of the clause's own notes decide what a renderer has to build. NOTE 3: with every element blending Normal the removal is exact and the backdrop cancels, so the isolated computation both backends perform is this one — §11.6.7's NOTE 1 states that equivalence for the same formulas applied to a pattern cell. **NOTE 5 states when the group need not be built at all**: \"the effect of compositing objects as a group is the same as that of compositing them separately (without grouping)\" where the group is non-isolated with its parent's knockout attribute and its result is composited with the Normal blend mode and shape and opacity of 1.0. Such a group's elements are emitted inline as of the hundred-and-third session, so a blend mode inside one sees the backdrop this clause says it should — which took the corpus's incomplete count 89 → 86 and put two of those three pages in the oracle's agreeing set. What is left is a non-isolated group whose own `Do` states an alpha, a blend mode or a soft mask *and* holds a blending element, where the backdrop genuinely has to be removed afterwards: 6 corpus documents, reported. Table 140's separate group shape and group alpha are what that would need, and NOTE 4 says why — an opaque backdrop destroys the difference between the accumulated alpha and the group alpha, so the second cannot be recovered from one raster. §11.3.7.3 is the row for holding one alpha per pixel."

[[clause]]
clause = "11.4.5"
title = "Isolated groups"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object", "crates/pdf-model/tests/transparency_groups.rs::a_non_isolated_group_blends_with_the_page_behind_it"]
note = "\"α0 = 0.0 if the group is isolated\" — a transparent buffer, which is what a tiny-skia pixmap and a Vello layer both start as. The consequence the clause spends its length on follows from it: an element's blend mode inside the group sees only what the group itself painted, and `a_non_isolated_group_blends_with_the_page_behind_it` is the test that holds the two apart — the same content in an isolated and a non-isolated group now produces different pixels, which is what the flag means. Its closing sentence, about which rendering intent converts the group's colours into the backdrop's space, has nothing to convert here — there is one blending space, device RGB, and a group asking for another is reported (§11.6.6)."

[[clause]]
clause = "11.4.6"
title = "Knockout groups"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_knockout_group_paints_only_its_topmost_element", "crates/pdf-model/tests/transparency_groups.rs::a_knockout_group_reports_only_where_the_two_models_differ", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_knockout_group"]
note = "Was this tree's first `silent` row, from the ninth session; `reported` from the seventeenth; drawn since the seventy-first. A knockout group's elements are composited with the group's initial backdrop rather than with each other, so at any point the topmost object wins. The reading this row carried for fifty-four sessions is the implementation: for an isolated knockout group the initial backdrop is transparent, so §11.3.6's formula leaves each element its own colour and its blend mode has no effect at all, and the clause's two-stage average by source shape is a Porter-Duff Source composite modulated by coverage. `render-cpu` says that to `tiny-skia` as a per-draw blend mode; Vello has no per-draw blend and its `Compose::Copy` runs over a layer's whole bounding box, so `render-gpu` empties the shape with `Compose::DestOut` and paints over it — measured against the CPU backend at a diagonal edge, mean 0.0039 over the scene. `partial` for what the clause itself says cannot be done with one alpha channel: \"[t]he existence of the knockout feature is the main reason for maintaining a separate shape value rather than only a single alpha\", so an element carrying a soft mask, an image or shading with per-sample alpha, or a nested group keeps the report — its shape and its opacity are the same number here. A non-isolated knockout group whose elements blend keeps it too, because the initial backdrop is then the group's own, which is the same thing §11.4.4 lacks; where nothing blends the backdrop cancels by §11.4.4's NOTE 3 and the group is drawn. Corpus: 2 of the 7 documents that reported this now draw with nothing reported, `knockout_isolated_overlap.pdf` agrees with the reference consensus, and `knockout_groups_test.pdf` page 2 came from mean 5.07 to 3.08 while staying contradicted."

[[clause]]
clause = "11.4.7"
title = "Page group"
status = "partial"
code = ["crates/pdf-render/src/backend.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::vello_hands_back_straight_alpha"]
note = "The seventeenth session's largest finding, and it was invisible until a group made it visible. Everything painted on a page belongs to a page group that \"shall be treated as an isolated group, whose results shall then be composited with a backdrop colour appropriate for the medium\" — so the page's own initial backdrop is transparent, and the medium's white is applied to the finished page. Both backends filled the raster with white and drew over it, which is a different picture for every blend mode: an object blending against an unpainted part of the page saw white where the standard says it sees nothing. transparency_group.pdf draws a Difference ellipse that four reference renderers show crimson over white, and this tree showed as its inverse. `impose_on_medium` in pdf-render is the composite, called by both backends so neither can differ about it. What is not implemented is the clause's second case, a page used as an element of another document's page through a reference XObject (§8.10.4), which needs importing before the page group's attributes can matter."

[[clause]]
clause = "11.4.8"
title = "Summary of group compositing computations"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "A restatement of §11.4.4's formulas with the subscript b that selects the backdrop — 0 in a knockout group, i-1 otherwise — and with isolation folded in. Its own NOTE says the formulas \"can be significantly simplified when some sources of shape and opacity are not present\" and that each kind of group cancels some of the terms; the isolated, non-knockout case is the one this tree evaluates, as a source-over composite of the group's buffer. The status follows §11.4.4's and §11.4.6's rather than adding anything: this clause introduces no requirement they do not."

[[clause]]
