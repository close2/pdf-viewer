clause = "8.6.6"
title = "Special colour spaces"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "Aggregate of the six below, read as a family in the nineteenth session because §11.7.4's overprinting is stated in terms of the colourants a `Separation` or `DeviceN` space names, and this is the clause that says what those are. All four families are implemented. The reading produced two rules neither the code nor any earlier note had: §8.6.6.4's `/All` and `/None` colourants, which are decided before the alternate space rather than through it."

[[clause]]
clause = "8.6.6.1"
title = "General"
status = "inapplicable"
note = "Two sentences naming the four special families — Pattern, Indexed, Separation and DeviceN — all four of which are implemented under the subclauses below. No requirement of its own."

[[clause]]
clause = "8.6.6.2"
title = "Pattern colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/tiling.rs", "crates/pdf-model/tests/shadings.rs"]
note = "Three sentences: an area is painted with a pattern rather than a colour, the pattern is a tiling (Type 1) or a shading (Type 2) one, and §8.7 has the detail. Both types are implemented on both backends. `ColourSpace::Pattern` carries the *underlying* space this clause's second form names, because an uncoloured tiling pattern takes its colour there rather than in any of its own — which is §8.7.3.3's requirement reaching this clause's array."

[[clause]]
clause = "8.6.6.3"
title = "Indexed colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/src/colour.rs::an_indexed_space_reads_its_table", "crates/pdf-model/tests/inline_images.rs::a_colour_space_name_is_looked_up_in_the_resources"]
note = "The four-element array, both forms of the table (byte string and stream), `hival` clamping, and the initial colour of 0. The sentence that had not been applied is the scaling one: \"Each byte shall be an unsigned integer in the range 0 to 255 that shall be scaled to the range of the corresponding colour component in the base colour space\". Every byte was divided by 255, which is that scaling only where the base's components run 0 to 1 — `issue2761.pdf` indexes into a `Lab` base and drew a black square where four renderers draw a pale grey gradient. Fixed in the eleventh session, and only visible then because `Indexed` images did not unpack before it."

[[clause]]
clause = "8.6.6.4"
title = "Separation colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::the_none_colourant_marks_nothing", "crates/pdf-model/tests/colour_paths.rs::the_all_colourant_is_a_complemented_tint"]
note = "The four-element array, the tint in 0.0 to 1.0 treated subtractively, the initial value of 1.0, and the reversion to the alternate space through the tint transform. The reversion is not a fallback here but what the clause *requires* of this device: \"The preceding paragraph applies only to subtractive output devices such as printers and imagesetters. For an additive device such as a computer display, a Separation colour space never applies a process colourant directly; it always reverts to the alternate colour space as described below.\" That sentence is also what makes §11.7.3's soft-mask rule and §11.7.4's Table 146 collapse here, and it is a stronger citation for the choice than §11.7.3's own. Two rules were found missing by reading it in the nineteenth session, and both are now implemented: `/None`, which \"shall not produce any visible output\" and was painted through its tint transform like any other colourant, and `/All`, whose subtractive tint \"shall be complemented by subtracting from 1 before applying to all available colourants\" on an additive device and was likewise run through a transform the clause says to ignore. Both are decided before the alternate space and the tint transform are even parsed, because the clause requires those to be ignored \"although valid values shall still be provided\" — so an unreadable one cannot take the space with it. 2 corpus first pages set `/All`; none sets a `Separation` `/None`, which is trap 8 rather than evidence it is rare in the world."

[[clause]]
clause = "8.6.6.5"
title = "DeviceN colour spaces"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "The space's four elements are read and a colour is converted by running the tint transform into the alternate space, which is what the clause requires of a processor with none of the named colourants available — and this one has none, since it draws to a screen. `None` colourants are therefore passed to the tint transform rather than discarded, which is what the clause says for the reverting case. The all-`None` rule was the exception and is implemented as of the nineteenth session: \"A DeviceN colour space whose component colourant names are all None shall always discard its output, just the same as a Separation colour space for None; it shall never revert to the alternate colour space.\" Still not implemented: `/NChannel` and the `/Colorants` attributes dictionary, neither of which changes the reverting path — an `/NChannel` space's per-component reversion is the one requirement of the pair that could, and it needs a colourant this device has."

[[clause]]
clause = "8.6.6.6"
title = "Multitone examples"
status = "inapplicable"
code = ["crates/pdf-model/src/colour.rs"]
note = "Four worked examples of `Indexed` over `DeviceN` producing duotones, tritones and quadtones, all of them NOTEs and EXAMPLEs. There is no requirement here that the two clauses they compose do not already state, and both are implemented — `MAX_DEPTH` exists so that exactly this nesting resolves. Read and dismissed, which the ledger records rather than leaving blank."

[[clause]]
clause = "8.6.7"
title = "Overprint control"
status = "inapplicable"
code = ["crates/pdf-model/src/content.rs"]
note = "`/OP`, `/op` and `/OPM` are read nowhere, and this clause is why rather than an omission it excuses. Overprinting decides what happens to the device colourants a painting operation does *not* name: \"If the overprint parameter is false (the default value), painting a colour in any colour space shall cause the corresponding areas of unspecified colourants to be erased\", and if true \"and the output device supports overprinting, erasing actions shall not be performed\". This device has three additive process colourants and produces no separations, and the clause states what such a device does: \"Not all devices support overprinting. … If overprinting is not supported, the value of the overprint parameter shall be ignored\" (NOTE 1). The overprint *mode* is settled by a `shall not` in the clause's own body: \"It also shall not apply if the native colour space of the output device does not include CMYK device colourants; in that case, source colours shall be converted to the device's native colour space, and all components participate in the conversion, whatever their values.\" Conversion of every component whatever its value is exactly what `ColourSpace::to_rgb` does. §11.7.4 reaches the same answer for the transparent model by an independent route, and ADR 0028 has both arguments and the honest limit — the one configuration where overprinting would change a pixel here is a group whose blending space is `DeviceCMYK`, which §11.6.6 already reports."

