[[clause]]
clause = "8.4.3.2"
title = "Line width"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/paint.rs"]
test = ["crates/render-cpu/tests/stroke_width.rs::a_zero_width_stroke_is_one_device_pixel_at_every_scale", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_the_thinnest_line_the_device_draws"]
note = "The `w` operator sets the width, and a width of 0 is drawn as \"the thinnest line that can be rendered at device resolution: 1 device pixel wide\". **This row was wrong for fifteen sessions and is the ledger's second known error**: it said a zero width \"reaches the rasteriser as the thinnest line it draws\", which was true of `tiny-skia`, whose hairline mode a zero width selects, and false of Vello, where `kurbo` expands a zero-width stroke into an empty outline and the line vanished. A row that names a *rasteriser's* convention has recorded that rasteriser rather than the clause. `Stroke::device_width` now states the minimum in `pdf-render`, where both backends read it, and the scene that would have caught the defect exists. The clause is also cited from `oracle.rs` for what it does *not* say: it gives a stroke a device-resolution minimum and gives an image none, which is why `issue4436r.pdf`'s half-pixel-tall image mask is drawn at its coverage rather than snapped to a whole row."

