test = ["crates/pdf-model/tests/shadings.rs"]
note = "Table 78: `/Domain` defaulting to the unit square, `/Matrix` mapping the domain into the target space, and `/Function` evaluated over it. The `/Matrix` is composed ahead of the caller's transform so the display list carries one transform per shading — which is also why Table 77's `/BBox`, stated in the *target* space, is applied by the caller rather than here."

[[clause]]
clause = "8.7.4.5.3"
title = "Type 2 (axial) shadings"
status = "implemented"
code = ["crates/pdf-model/src/shading.rs"]
test = ["crates/pdf-model/tests/shadings.rs::an_axial_shading_runs_from_its_first_colour_to_its_second", "crates/pdf-model/tests/shadings.rs::a_shading_that_does_not_extend_paints_nothing_beyond_its_ends", "crates/render-cpu/tests/shading_placement.rs"]
note = "Table 79 in full: `/Coords` as the axis, `/Domain` defaulting to `[0 1]`, `/Function` sampled across it, and `/Extend` deciding what happens beyond each end — both halves independently, which is what the clause's two booleans mean and what a single flag would get wrong on one document in four. `shading_placement.rs` pins the geometry at three scales against this clause, and exists because both backends once applied the page transform to the paint as well as to the path (trap 2)."

[[clause]]
clause = "8.7.4.5.4"
title = "Type 3 (radial) shadings"
status = "implemented"
code = ["crates/pdf-model/src/shading.rs"]
test = ["crates/pdf-model/tests/shadings.rs::a_radial_shading_grades_between_its_two_circles"]
note = "Table 80: two circles from `/Coords`, `/Domain`, `/Function`, and `/Extend` for each end. The clause's blend of circles is computed rather than approximated by an axial gradient, which is what makes a sphere look like one."

[[clause]]
clause = "8.7.4.5.5"
title = "Type 4 (free-form Gouraud-shaded triangle mesh) shadings"
status = "partial"
code = ["crates/pdf-model/src/shading.rs", "crates/render-cpu/src/shading.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/shadings.rs::a_triangle_mesh_puts_its_corner_colours_at_its_corners", "crates/pdf-model/tests/shadings.rs::a_truncated_mesh_is_reported"]
note = "Table 81's `/BitsPerCoordinate`, `/BitsPerComponent`, `/BitsPerFlag`, `/Decode` and optional `/Function`, with the three vertex flags — a new triangle, or one sharing the previous triangle's second and third or first and third vertices. **The departure is how the interior is coloured.** The clause says \"a technique known as Gouraud interpolation is used to colour the interiors\", and neither `tiny-skia` nor Vello has a Gouraud primitive, so each triangle is subdivided until its corner colours agree to within a threshold below what an eight-bit channel can represent, then filled flat, with a measured 0.8-pixel overlap to close the seams. That leaves a faint lattice a per-pixel interpolation would not have. `mesh_shading_empty.pdf` is contradicted for exactly this and for nothing else — the twenty-eighth session measured it pixel by pixel: our colours are within a level of the references everywhere except a one-pixel column at the mesh's right edge, the failing metric is *structural* similarity at 0.972 against a bound of 0.990, and the difference is the subdivision lattice. `doc/HANDOVER.md` had recorded that page as \"the same mesh displaced horizontally\", which measurement refutes: the edges are in the same columns to the pixel. Closing it means a Gouraud rasteriser in *both* backends, since the cross-backend scenes hold them to identical pixels."

[[clause]]
