note = "The clause is two sentences and both are now answered. Non-interactive forms \"do not use widget annotations but are represented with page content\", which this tree draws as page content because that is all it is; and they \"are defined by the PrintField attribute (14.8.5.6) for repurposing and accessibility purposes\", which is read as of the ninety-fifth session. So what was recorded as a gap was the *accessibility* half, and closing §14.8.5.6 closed this row with it."

[[clause]]
clause = "12.8"
title = "Digital signatures"
status = "partial"
code = ["crates/pdf-model/src/signature.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it", "crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "Every signature the document states is read — Table 255 whole — and none is *verified*. §12.8.1 splits the work itself: a signature handler \"shall be determined and verified … to match with any of the validation parameters\", which is a certificate chain and a trust store (§7.6.5's refusal one clause over, ADR 0031), and then \"[t]he digest shall be recomputed and compared\". What a renderer can do on its own evidence needs no cryptography: §12.8.1 says a byte range \"should be the entire PDF file, including the signature dictionary but excluding the signature value itself\", so a `/ByteRange` that stops short names bytes **nobody signed**. `Signature::coverage` is that comparison, and `viewer-ui` prints who signed, why, how many bytes came after, and — as its own line — that nothing here verifies anything. Measured: 6 corpus documents carry a signature in a signature field, 4 ranges run to the end of their file, and 2 do not, of which `xfa_filled_imm1344e.pdf` is 2.5 MB of filled-in form appended after a certification signature whose `/P` permits exactly that."

[[clause]]
clause = "12.8.1"
title = "General"
status = "partial"
code = ["crates/pdf-syntax/src/document.rs", "crates/pdf-model/src/signature.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-syntax/src/document.rs::a_signature_dictionary_is_recognised_by_its_type", "crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it", "crates/pdf-model/src/signature.rs::an_unsigned_signature_field_holds_no_signature", "crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "Table 255 entire: `/Type`, `/Filter`, `/SubFilter`, `/ByteRange`, `/Name`, `/M`, `/Location`, `/Reason`, `/ContactInfo`, `/Changes`, and `/Reference`'s transform method — which is what tells the clause's three kinds apart, since a certification signature \"shall contain a signature reference dictionary … that has a DocMDP transform method\". Two of the clause's rules are applied rather than stored: a `/SubFilter` of `ETSI.CAdES.detached` or `ETSI.RFC3161` turns §12.8.1's \"should\" about the byte range into Table 255's \"shall\", and a signature field with no `/V` — or a `/V` with neither a `/ByteRange` nor a `/Contents` — is a field waiting to be signed rather than a signature, which is the common shape in a blank form. §7.6.2's exception is also here and predates the rest: a signature dictionary's `/Contents` \"shall be direct\" and is not encrypted, which `decrypt_dict` skips on a `/Type` of `/Sig` or `/DocTimeStamp`. `partial` because the digest is deliberately not computed: without the certificate half a matching hash proves only that the bytes are the bytes the *stored* hash was made from, and reporting it would invite a reader to hear \"valid\"."

[[clause]]
clause = "12.8.2"
title = "Transform methods"
status = "partial"
code = ["crates/pdf-model/src/signature.rs", "crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it", "crates/pdf-model/tests/forms_data.rs::a_certified_document_refuses_the_change_its_author_forbade"]
note = "Transform methods, as far as they say what a document permits. `DocMDP` is read and its `/P` level answered (§12.8.2.2); `FieldMDP` and `UR` are recognised where a `/Reference` names them and their parameters are not read. What no transform method can do here is its *purpose*, which §12.8.2.2.2 states: comparing the signed and current revisions needs the digest to establish the signed one first."

[[clause]]
clause = "12.8.2.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it"]
note = "The framing: a transform method is how modification detection is specified, with `/TransformParams` carrying its variable part. Which method a signature names is read; the comparison it asks for is §12.8.2.2.2's and is not done."

[[clause]]
clause = "12.8.2.2"
title = "DocMDP"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it", "crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "The `DocMDP` transform, read as what it is: an author's statement of \"what changes shall be permitted to be made to the document and what changes invalidate the author's signature\". Table 257's `/P` is read with its three values and its default of 2, and §12.8.6's `/Perms /DocMDP` is what makes it binding rather than advisory. `partial` for §12.8.2.2.2's validation, which needs the digest — **not** for the prevention half, which §12.8.2.2.1's row now holds. The corpus's one certification signature states `/P 2` and has 2.5 MB appended after it — a filled-in form, which is exactly what that level permits."

[[clause]]
clause = "12.8.2.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it"]
note = "Table 257's parameters as a statement: `/P` 1 means \"the document shall be final; that is, any changes shall invalidate the signature\", 2 and 3 \"permit modifications that are appropriate for form field or comment workflows\". Read, with the table's default, and answered by `Modification`. The clause's own restriction — \"[a] document can contain only one signature field that contains a DocMDP transform method\" — is a statement about a *document* and is not enforced, because enforcing it would mean refusing to draw a file over a claim about its signatures. **And the sentence in the parenthesis is a `shall` addressed to a processor that modifies, honoured since the hundred-and-ninety-first session**: \"(These changes to the document shall also be prevented if the signature dictionary is referred from the DocMDP entry in the permissions dictionary.)\" `ViewState::set_field` — what a person typed — is refused where §12.8.6's `/Perms /DocMDP` names a signature stating `/P` 1, and permitted at 2 and 3, which is Table 257's own \"filling in forms, instantiating page templates, and signing\". A `/P` outside 1..=3 permits, because refusing on a value the table does not define would let a malformed number lock a document a person is entitled to fill in. **It became a requirement without the clause changing**: the sentence binds a processor that modifies, and this one could not until form filling landed in the hundred-and-thirty-fifth session and saving in the hundred-and-thirty-sixth — the same shape as §7.6.3.2's initialisation vector (ADR 0129). One corpus document names a `/DocMDP` and it states `/P 2`, so nothing in the corpus changes; the fixture is hand-built, which is trap 8's rule."

[[clause]]
clause = "12.8.2.2.2"
title = "Validating signatures that use the DocMDP transform method"
status = "reported"
code = ["crates/pdf-model/src/signature.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "Validating a `DocMDP` signature is two steps and this program does neither: \"a PDF processor first shall verify the byte range digest. Next, it shall verify that any modifications that have been made to the document are permitted by the transform parameters.\" What it does instead is say so out loud, and give a person the two facts underneath: the `/P` level the author stated, and how many bytes were appended after the signed range. §12.8.2.2.2's own second paragraph is why those two are the useful pair — the comparison it describes is between the signed revision and the current one, and the tail is where that difference lives."

[[clause]]
clause = "12.8.2.3"
title = "UR"
status = "partial"
code = ["crates/pdf-model/src/signature.rs", "crates/pdf-model/src/view.rs", "crates/viewer-core/src/notes.rs"]
test = ["crates/pdf-model/tests/forms_data.rs::a_save_beyond_the_granted_usage_rights_withdraws_the_signature", "crates/pdf-model/tests/signatures.rs::no_corpus_documents_usage_rights_are_exceeded_by_what_this_program_does"]
note = "The `UR` transform: a usage rights signature granting \"features of a PDF processor that are not available by default\", deprecated in PDF 2.0. **Was `reported`, and the hundred-and-ninety-eighth session closed the half of it that binds this tree.** The granting half stays out of reach and is stated rather than silent: this program has no feature behind such a gate, so there is nothing for a valid usage rights signature to unlock. The clause's other sentence addresses a processor that *modifies* — \"A PDF processor that modifies a PDF, with a UR signature in excess of the rights that are granted by that signature, should remove that signature prior to writing the newly modified PDF.\" — and this one has modified since the hundred-and-thirty-fifth session. Table 258 is read into `signature::UsageRights`; `UsageRights::grants` answers for the two verbs this program has, `/Form /FillIn` and `/Document /FullSave`, honouring `/P` first (\"[i]f false , any possible restriction may be ignored\", which is the table's default) and then `/V` (\"[i]f an unknown version is present, no rights shall be enabled\"); and `ViewState::save` rewrites the permissions dictionary without its `/UR3` where a save would exceed them. What is removed is the entry rather than the object, because §7.5.6 appends and §12.8.6 makes a usage rights signature the one \"referred to from the UR3 entry in the permissions dictionary\". `notes.rs` says so when the document opens rather than when it is saved, which is while a person can still decide not to. **The condition has no members in the corpus and that was measured, not assumed**: all 4 documents carrying a `/UR3` grant both rights and all 4 come out `/P false`, so nothing this program can do to one exceeds it. §12.8.2.2.2's comparison of two revisions is still not done, which is what keeps this `partial`. ADR 0159."

[[clause]]
clause = "12.8.2.4"
title = "FieldMDP"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it"]
note = "`FieldMDP` names the fields a signature covers, and it is recognised where a `/Reference` states it. Its parameters are not read, for §12.8.2's reason: what they are *for* is deciding whether a later revision changed a field it should not have, which needs the digest and a comparison of revisions."

[[clause]]
clause = "12.8.3"
title = "Signature interoperability"
status = "reported"
code = ["crates/pdf-model/src/signature.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "Digital signatures — signature interoperability: which cryptographic containers a handler shall understand. Nothing in this tree validates a signature. Two things are worth stating once here rather than on every row. First, this is **not** clause 12's interactive half in the sense the others are: a signature's *appearance* is an ordinary widget annotation and is drawn by §12.5 like any other, so a signed document renders correctly and completely; what is missing is the assertion that it has not changed. Second, §7.6.2's signature exception is implemented — `document.rs` exempts a signature dictionary's `/Contents` from decryption, because that value is a digest over the file's own bytes — so the one place signatures touch *rendering* is already right, and it was measured: eight corpus documents carry a signature dictionary, twenty-six carry an `/Encrypt`, and the two sets are disjoint. **Said out loud rather than silently skipped**: `viewer-ui` prints who signed a document and, as its own line, that this program verifies nothing — so a person is told what is not being checked rather than left to assume it was."

