note = "All four ways a resource dictionary reaches a content stream: a page's own or inherited `/Resources` (§7.7.3.4), a Type 3 font's, a form `XObject`'s or pattern's own, and the pre-1.2 fallback where a form omits `/Resources` and inherits the page's. The last was implemented for form `XObject`s and not for *annotation appearances*, which are form `XObject`s too (§12.5.5) — an appearance with no `/Resources` was run against an empty dictionary, so every font and image it named was lost. Found by reading this clause in the eleventh session, and fixed. A tiling pattern still falls back to an empty dictionary rather than to the page's: the clause's inheritance sentence names forms and Type 3 fonts, so this is the letter of it, and a pattern that relies on the page's resources is malformed."

