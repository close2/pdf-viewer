test = ["crates/pdf-model/tests/optional_content.rs::a_hidden_section_still_changes_the_graphics_state_it_leaves_behind"]
note = "Hiding suppresses marking and nothing else: the colour, transform and clip a hidden section sets outlive it, and the text position advances through hidden text. Form XObjects and annotations are skipped whole, which the clause permits because their state changes do not escape them."

[[clause]]
clause = "8.11.3.2"
