test = ["crates/pdf-model/tests/shadings.rs"]
note = "Table 82's `/VerticesPerRow` with the same vertex encoding as Type 4 and no flags, triangulated between consecutive rows. `partial` for §8.7.4.5.5's interpolation departure, which it shares."

[[clause]]
clause = "8.7.4.5.7"
title = "Type 6 (Coons patch mesh) shadings"
status = "partial"
code = ["crates/pdf-model/src/shading.rs"]
test = ["crates/pdf-model/tests/shadings.rs"]
note = "Table 83's twelve control points and four corner colours per patch, with the four edge flags that let a patch share an edge and two colours with its predecessor. The surface is evaluated and triangulated here. `partial` for §8.7.4.5.5's interpolation departure and for one of its own: the clause defines the patch's interior by a bilinear surface between its Bézier boundaries, and a triangulation is an approximation of that surface whose fineness this tree fixes rather than deriving from §10.7.3's smoothness tolerance."

[[clause]]
