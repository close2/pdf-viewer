# The conformance ledger: one row per subclause of ISO 32000-2's technical clauses.

# GENERATED — the set of rows is. Their statuses are not: a status is a claim a person makes
# after reading the clause against this code, and `cargo run -p conformance --bin ledger`
# preserves every one of them. It only ever adds rows the standard has and this file lacks.

# Statuses, and what each is for. The vocabulary exists to keep five situations from wearing
# one word: the project choosing, the project not knowing, the project owing out loud, the
# project owing in silence, and the requirement having no meaning for a screen.

#   implemented   every normative requirement in the clause is executed; names code and test
#   partial       some are; the note says which, which are not, and what is reported
#   reported      not implemented yet, but detected and reported at runtime. Still owed
#   silent        not implemented, and nothing says so. A page is drawn wrong without a word
#   inapplicable  describes a marking device rather than a screen. Nothing is owed
#   writer-side   addresses a PDF writer; we do not create files
#   out-of-scope  covered by CLAUDE.md principle 5's closed exclusion list, which the row names
#   unreviewed    nobody has read this clause against this code

# `unreviewed` is debt, not absence: it says only that the question has not been asked.
# `silent` is the status worth hunting. Every missing subsystem here reports, because whoever
# decided not to build it wrote the report; what ships is the gap inside a feature that is
# already there, and only reading the clause finds one.

# See doc/PLAN.md §5a for the design, and tools/conformance for the checker that reads this.

[[clause]]
clause = "7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/lib.rs", "crates/pdf-model/src/lib.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Clause 7's own map, and the sentence that decides the crate boundary this project is built on: \"[a] PDF file is a data structure\", read here by `pdf-syntax`, whose meaning is clause 8's onward and lives in `pdf-model`. Every subclause of 7 is reviewed except §7.11's file specifications and §7.12's extensions dictionary, which are the two this tree does not read."

[[clause]]
clause = "7.2"
title = "Lexical conventions"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::every_byte_value_terminates"]
note = "The whole of tokenisation, which `lexer.rs` is. The clause's framing decides the crate's shape rather than any one function: \"a PDF file is a sequence of bytes\", grouped into tokens, assembled into objects — so the lexer works on `&[u8]` throughout and hands the parser tokens that carry no meaning. §7.2.3 is where the byte classes are; §7.2.4 is why skipping white space and skipping a comment are one function."

[[clause]]
clause = "7.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::every_byte_value_terminates"]
note = "Framing, and one sentence with a consequence: \"A PDF file is represented as a sequence of 8-bit bytes, some of which are interpreted as character codes in the ASCII character set and some of which are treated as arbitrary binary data depending upon the context.\" Decoding to `str` anywhere in the lexer would either reject a valid file or invent replacement characters, which is why `Name` and `Object::String` hold bytes and `Name::as_str` is fallible. The three contexts the clause then names are read elsewhere: §7.9.2's text strings, §7.3.8's stream data, and clause 9's character codes."

[[clause]]
clause = "7.2.2"
title = "Representation"
status = "writer-side"
note = "What a *file* may contain and how it shall be transported: tokens and standard keys in ASCII, string and stream data either ASCII or binary, and a binary file transported as a binary file. A reader implements none of it — it reads whatever bytes arrive. NOTE 2's warning that \"character\" here carries no logical meaning is the same distinction §7.9.2 draws for text strings and clause 9 for character codes, and both are read there."

[[clause]]
clause = "7.2.3"
title = "Character set"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::dictionary_and_array_delimiters_are_recognised", "crates/pdf-syntax/src/lexer.rs::every_byte_value_terminates"]
note = "Table 1's six white-space characters exactly, including NUL, and Table 2's ten delimiters including the two braces type 4 functions add. `is_regular` is the clause's own definition — neither of the other two. The end-of-line rule that a CARRIAGE RETURN followed by a LINE FEED is one marker is applied where it decides content: after `ID` in an inline image (§8.9.7) and after `stream` (§7.3.8.1). Elsewhere an EOL is white space, which the clause permits: \"EOL markers may be treated the same as any other white-space characters.\""

[[clause]]
clause = "7.2.4"
title = "Comments"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::every_byte_value_terminates"]
note = "\"PDF processors shall treat comments as single white-space characters for the purposes of lexical conversion … That is, a comment separates the token preceding it from the one following it.\" Which is why `Lexer::skip_whitespace` skips both and is the only skipping function: a caller that skipped white space without skipping a comment would join two tokens. A comment runs to the EOL marker and *not* through it, so the marker is then consumed as the white space §7.2.3 makes it. `%PDF-n.m` and `%%EOF` are §7.5's and are read there; every other comment has no semantics, as the clause says outright."

[[clause]]
clause = "7.3"
title = "Objects"
status = "implemented"
code = ["crates/pdf-syntax/src/object.rs", "crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::integers_and_reals_are_distinguished"]
note = "The object model, which is `object.rs`, built by `parser.rs`. Read as a family in the thirty-ninth session; the subclause rows hold what each one decided."

[[clause]]
clause = "7.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/object.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::keywords_are_returned_verbatim"]
note = "\"PDF syntax includes nine basic types of objects: boolean values, integers, real numbers, strings, names, arrays, dictionaries, streams, and the null object.\" `Object` has exactly those nine variants plus `Reference`, which the clause's next paragraph makes the labelling of any of them (§7.3.10). The module comment said *eight* for the project's whole life, having merged integer and real — the pair §7.3.3 keeps apart and `as_integer`/`as_number` keep apart in code."

[[clause]]
clause = "7.3.2"
title = "Boolean objects"
status = "implemented"
code = ["crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::keywords_are_returned_verbatim"]
note = "Two keywords. They arrive as `Token::Keyword`, because nothing lexical distinguishes `true` from `obj`, and the parser turns them into `Object::Boolean` — which is also why an unknown keyword where an object belongs is an error naming what it found rather than a silent `false`."

[[clause]]
clause = "7.3.3"
title = "Numeric objects"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs", "crates/pdf-syntax/src/object.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::malformed_numbers_salvage_a_leading_value"]
note = "Both numeric types, and the sentence that makes them one where it matters: \"Wherever a real number is expected, an integer may be used instead\", which is `Object::as_number` accepting either and is why nearly every caller uses it rather than `as_integer`. The clause's own forms are all lexed, including `4.` and `-.002`. Two deliberate departures from strictness, both toward reading files that exist: PostScript radix and exponential notation are forbidden to a *writer* and this lexer accepts the exponential form rather than rejecting it, and a malformed number such as `--5` or `1.2.3` is salvaged to its leading value rather than aborting the page. Annex C's ranges are `i64` and `f64`, both wider than the clause's typical limits."

[[clause]]
clause = "7.3.4"
title = "String objects"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::literal_strings_handle_nesting_and_escapes"]
note = "\"A string object shall consist of a series of zero or more bytes\" — bytes, so `Object::String` is `Arc<[u8]>` and never a `String`. The two written forms are §7.3.4.2 and §7.3.4.3. Annex C's implementation limit on length is `Limits::max_string_len`, and exceeding it is an error naming the limit rather than a truncated string."

[[clause]]
clause = "7.3.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs", "crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::hex_strings_ignore_junk_and_pad_an_odd_digit"]
note = "The two ways a string may be written, and the length limit. Both forms produce the same `Object::String`, which is what lets §7.9.2's text-string decoding be one function that never asks which syntax delivered the bytes."

[[clause]]
clause = "7.3.4.2"
title = "Literal strings"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs", "crates/pdf-model/src/variable_text.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::literal_strings_handle_nesting_and_escapes", "crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "Read in the lexer and, since §12.7.4.3's variable text, written as well: the appearance stream this tree constructs shows a field's value as a literal string, so the clause's escapes have to be produced rather than only consumed. `variable_text::show` escapes the two parentheses and the reverse solidus the clause names and writes every other non-printable byte as its three-digit octal escape, which is the same subclause's octal form. The reading side takes all eight escape sequences, the line continuation, and the rule that an unbalanced parenthesis is a lexical error."

[[clause]]
clause = "7.3.4.3"
title = "Hexadecimal strings"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::hex_strings_ignore_junk_and_pad_an_odd_digit"]
note = "Both of the clause's rules: every character outside `0`-`9`, `A`-`F` and `a`-`f` is ignored, and 'If the final digit of a hexadecimal string is missing … it shall behave as if a 0 (zero) followed the last digit.' Written as well as read, in one place — the §12.7.4.3 fuzz target puts its bytes into a `/DA` and a `/V` as hexadecimal strings so that no input can close the object around them."

[[clause]]
clause = "7.3.5"
title = "Name objects"
status = "implemented"
code = ["crates/pdf-syntax/src/lexer.rs", "crates/pdf-syntax/src/object.rs"]
test = ["crates/pdf-syntax/src/lexer.rs::names_resolve_hash_escapes"]
note = "Names, with `#xx` resolved at lex time so that `Name` holds the clause's own \"sequence of characters\" and a comparison against `Type` is a byte comparison — which is the clause's definition of distinctness: \"PDF name objects are considered distinct objects if, after all escaping is expanded, the resulting sequences of bytes are not an exact binary match.\" The empty name — \"The token SOLIDUS (a slash followed by no regular characters)\" — is a name, not an error. `Name::as_str` is the clause's UTF-8 sentence, and it is fallible because that sentence is a \"should\" about names that stand for text. Two lenient readings, both named: a name containing a null via `#00` is accepted where the clause excludes character code 0, and a `#` not followed by two hexadecimal digits is kept literally, since dropping it would turn one valid name into a different valid name."

[[clause]]
clause = "7.3.6"
title = "Array objects"
status = "implemented"
code = ["crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/tests/robustness.rs"]
note = "\"An array may have zero elements\", elements may be of any type, and higher dimensions are arrays of arrays — all of which `Vec<Object>` is without a rule. What needs a rule is the bound: Annex C's implementation limit is `Limits::max_array_len`, and reaching it is an error rather than a shortened array, because a truncated `TJ` array renders a wrong page and reports success (the operand cap that ended three sentences mid-word on the specification's own title page). **The clause's opening sentence became load-bearing in a *content* stream in the sixty-third session**: an array is \"a one-dimensional collection of objects arranged sequentially\", so a keyword between two of its elements is not an element, and §7.8.2 puts an operator after its operands rather than inside one — which makes it not an operator either. `operator-in-TJ-array.pdf` writes `[(Grandes) 0.0 Tc … ] TJ` and had been drawing one word of five, because the content interpreter flattens arrays and the `Tc` reached the operator dispatch. It is skipped and reported now: the file is malformed and no clause states a recovery, so drawing the text without saying so would be the silent fallback principle 3 forbids."

[[clause]]
clause = "7.3.7"
title = "Dictionary objects"
status = "implemented"
code = ["crates/pdf-syntax/src/object.rs", "crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/src/parser.rs::a_repeated_key_keeps_the_first_value", "crates/pdf-syntax/src/parser.rs::a_null_value_reads_the_same_as_an_absent_key", "crates/pdf-syntax/src/parser.rs::a_null_value_does_not_survive_beside_a_real_one"]
note = "Keys are names and only names — a token of any other kind where a key belongs is skipped rather than being fatal, which loses one entry instead of the dictionary. Entries are unordered, which a `BTreeMap` makes true rather than claimed. \"A dictionary entry whose value is null … shall be treated the same as if the entry does not exist\" is now enforced where a dictionary is built, rather than asserted through `Document::get_key` — which answers `Object::Null` for an absent key and so made the old test the implementation restated, while `Dictionary::get` still returned `Some(Null)`, `len` still counted the entry and §8.9.7's presence test for an abbreviated key could still see it. \"Multiple entries in the same dictionary shall not have the same key\" is a requirement on the *file* and the clause states no recovery — nor can one be derived, since the entries \"shall be unordered even though an arbitrary order may be imposed upon them when written in a file\" and \"[t]hat ordering shall be ignored\", so a rule preferring the first or the last reads the very order the clause discards. Keeping the first is therefore a **documented choice** rather than a derivation (principle 5); poppler agrees, which is evidence that it is unsurprising and is not a reason for it. `inline_image.rs` documents the one place that is decided differently and why. Annex C's implementation limits are `Limits::max_dict_len`."

[[clause]]
clause = "7.3.8"
title = "Stream objects"
status = "implemented"
code = ["crates/pdf-syntax/src/parser.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Stream objects: the syntax in §7.3.8.1 and the length rules in §7.3.8.2. Table 5's entries are read where they are used — `/Length` and `/Filter` and `/DecodeParms` by the parser and `Document::decoded_stream_data`, `/F` by `Document::is_external`, `/DL` nowhere, since it is \"only a hint\"."

[[clause]]
clause = "7.3.8.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/parser.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/src/document.rs::a_stream_whose_data_is_in_a_file_has_no_data_here", "crates/pdf-syntax/tests/real_documents.rs"]
note = "Stream objects are read: the dictionary, the `stream` keyword with its EOL, `/Length` including the indirect form, and `endstream`. Two sentences are load-bearing and only the first was read before. That `stream` is followed by CRLF or LF and not by CR alone is the same one-marker rule §8.9.7 applies after `ID`; a CR alone is tolerated anyway, because files write it. The second was a silent gap for the project's whole life: \"beginning with PDF 1.2, the bytes may be contained in an external file, in which case the stream dictionary specifies the file, and any bytes between stream and endstream shall be ignored by a PDF processor\" — and those bytes were being decoded and drawn. `Document::is_external` now refuses such a stream, which is the answer principle 3 leaves available, since the renderer has no filesystem to fetch the file from; Table 5's `/FFilter` and `/FDecodeParms` describe the external data and are unread for the same reason. **No corpus document writes one**, measured, so nothing but reading §7.3.8 could have found it. What is still not the clause's is the recovery for a wrong `/Length`: the parser scans for `endstream`, which is the same answer by a different route (§7.3.8.2)."

[[clause]]
clause = "7.3.8.2"
title = "Stream extent"
status = "implemented"
code = ["crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/tests/robustness.rs"]
note = "\"Every stream dictionary shall have a Length entry\", the filters are mostly self-limiting, and \"[a]ll of these constraints shall be consistent\". The parser takes `/Length` when it is a direct integer *and* `endstream` is where it says, and searches for `endstream` otherwise — which covers the indirect form the clause's own EXAMPLE 3 shows, and the wrong-`/Length` corruption. The clause's closing allowance is honoured in the same place: \"there may be an extra end-of-line marker in the PDF file before the keyword endstream\". Reading a filter's EOD to bound the data instead is a third route the clause offers and this tree does not take; it would only matter for a file where `/Length` is wrong *and* `endstream` cannot be found, which is a file with no stream in it."

[[clause]]
clause = "7.3.9"
title = "Null object"
status = "implemented"
code = ["crates/pdf-syntax/src/object.rs", "crates/pdf-syntax/src/parser.rs"]
test = ["crates/pdf-syntax/src/parser.rs::a_null_value_reads_the_same_as_an_absent_key"]
note = "One keyword, one value, and two rules that live elsewhere and both point here: an indirect reference to a nonexistent object is null (§7.3.10), and a dictionary entry whose value is null is an absent entry (§7.3.7). `Object::Null` is therefore what `Document::get_key` answers for every kind of nothing there is, which is what makes those two rules one behaviour rather than three."

[[clause]]
clause = "7.3.10"
title = "Indirect objects"
status = "implemented"
code = ["crates/pdf-syntax/src/parser.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Indirect objects and references. `obj` … `endobj` with an object and generation number, `R` references resolved on demand and cached, and the clause's own rule for a reference that goes nowhere: \"An indirect reference to an undefined object shall not be considered an error by a PDF processor; it shall be treated as a reference to the null object.\" That is what `Document::get` returns for a missing entry, and as of the twenty-second session also for a reference that is reached while the object containing it is still being loaded — a cycle is a reference that resolves to nothing."

[[clause]]
clause = "7.4"
title = "Filters"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs", "crates/pdf-model/tests/corpus.rs"]
note = "Table 6's ten standard filters, reviewed as a family in the twenty-seventh session, and **all ten decode** — `LZWDecode` was the last one absent and landed in that session. Four of them are stream filters implemented here, one is a pass-through for §7.6.6's crypt filters, and four are image codecs that belong to the image pipeline and answer `None` here so that a *content* stream naming one is visibly unsupported rather than silently empty."

[[clause]]
clause = "7.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/document.rs", "crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "`/Filter` and `/DecodeParms` in both their forms — one name or an array — with the array \"cascaded to form a pipeline that passes the stream through two or more decoding transformations in sequence\", applied in order, each stage taking the matching entry of a `/DecodeParms` array. Table 92's abbreviations are expanded for inline images by `pdf_model::inline_image`. Not implemented and named rather than left implicit: `/FFilter` and `/FDecodeParms`, which belong to an *external* stream — this reader does not follow `/F` to another file at all, so the parameters that would describe how to decode it are not the missing piece."

[[clause]]
clause = "7.4.2"
title = "ASCIIHexDecode filter"
status = "partial"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs::ascii_hex_decodes_and_stops_at_the_terminator", "crates/pdf-syntax/src/filter.rs::ascii_hex_pads_an_odd_final_digit"]
note = "\"One byte of binary data for each pair of ASCII hexadecimal digits\", white space ignored, `>` the EOD marker, and an odd final digit treated \"as if a 0 (zero) followed the last digit\" — all four implemented. `partial` for one sentence, deliberately: \"any other characters shall cause an error\", and this decoder skips them instead. That is a recovery rather than an oversight — a hex stream with a stray byte in it decodes to what its producer meant everywhere except at that byte, and refusing loses the whole stream — but it is a departure and belongs in a row rather than only in a comment."

[[clause]]
clause = "7.4.3"
title = "ASCII85Decode filter"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs::ascii85_round_trips_a_known_value"]
note = "The base-256 to base-85 relation, `!` to `u` plus `z` for four zero bytes, white space ignored, `~>` as EOD, and a partial final group of *n* characters yielding *n* − 1 bytes. All three of the clause's \"shall never occur\" conditions are refused rather than guessed at: a character outside the range fails the stream, a `z` inside a group fails it because `z` is outside `!`..=`u`, and a final group of one character yields nothing. An optional `<~` introduction is accepted, which the clause does not describe and PostScript does."

[[clause]]
clause = "7.4.4"
title = "LZWDecode and FlateDecode filters"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs::lzw_decodes_the_clauses_own_example"]
note = "Both, as of the twenty-seventh session; `FlateDecode` since the first parser and `LZWDecode` written from §7.4.4.2, which states the whole algorithm."

[[clause]]
clause = "7.4.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs::lzw_decodes_the_clauses_own_example"]
note = "Descriptive apart from naming the two methods and their references: LZW is Adobe TIFF Revision 6.0's, Flate is RFC 1950 and 1951. Flate is `flate2` with the pure-Rust `zlib-rs` backend, and accepts a raw deflate stream as well as a zlib-framed one because streams missing the two-byte header occur. NOTE 2's worst cases are why both decoders are bounded by `Limits::max_stream_len`: LZW \"provides a compression approaching 1365:1 for long files\", which is a bomb written in nine bits."

[[clause]]
clause = "7.4.4.2"
title = "Details of LZW encoding"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs::lzw_decodes_the_clauses_own_example", "crates/pdf-syntax/src/filter.rs::early_change_moves_the_width_increase_by_one_code", "crates/pdf-syntax/src/filter.rs::a_code_the_table_does_not_have_stops_rather_than_guessing"]
note = "The whole algorithm, and **the clause supplies its own test vector** — EXAMPLE 1's input, EXAMPLE 2's packed bytes — which is the rarest kind of expected value in this tree: one the standard states rather than one derived from a rule. Three details decide correctness and each is a sentence here: codes packed high-order bit first and straddling byte boundaries; the width growing \"following the creation of table entry 511\", moved one code earlier by Table 8's `/EarlyChange`; and a code naming the entry about to be created, which the standard's own example reaches on its third code. A code past the end of the table keeps what was decoded rather than inventing bytes, for the reason `flate` keeps a truncated inflate."

[[clause]]
clause = "7.4.4.3"
title = "LZWDecode and FlateDecode parameters"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs::early_change_moves_the_width_increase_by_one_code"]
note = "Table 8's five entries with the defaults it states: `/Predictor` 1, `/Colors` 1, `/BitsPerComponent` 8, `/Columns` 1, and `/EarlyChange` 1. The last is `LZWDecode` only and is the one entry in this table that changes what a *byte* decodes to rather than how bytes are rearranged, because it moves where the code width grows and desynchronises the bit stream from that point on."

[[clause]]
clause = "7.4.4.4"
title = "LZW and Flate predictor functions"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Both groups: TIFF Predictor 2, and the PNG group's five filter types with the per-row type byte ISO/IEC 15948 puts in front of each row. Predictors are applied *inside* the decode rather than beside it, which is trap 4 in `doc/HANDOVER.md`: the code once called this \"the caller's responsibility\" and then did not, so every cross-reference stream — which is compressed *and* PNG-predicted almost universally — failed with a misleading `/Root is not a dictionary`. A predictor code the clause does not define returns `None` rather than passing the data through, because unpredicted data read as predicted is silently wrong and for a cross-reference stream that means fabricated byte offsets."

[[clause]]
clause = "7.4.5"
title = "RunLengthDecode filter"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs"]
test = ["crates/pdf-syntax/src/filter.rs::run_length_expands_literal_and_repeated_runs"]
note = "A length byte and its run: 0 to 127 copies the following length + 1 bytes literally, 129 to 255 repeats the next byte 257 − length times, and 128 is EOD. All three arms and the boundary."

[[clause]]
clause = "7.4.6"
title = "CCITTFaxDecode filter"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-sandbox/src/decode.rs", "crates/pdf-sandbox/src/protocol.rs"]
test = ["crates/pdf-model/tests/ccitt.rs::black_is_1_gives_the_exact_complement", "crates/pdf-model/tests/ccitt.rs::a_scanned_page_comes_back_mostly_white", "crates/pdf-model/tests/corpus.rs"]
note = "Group 3 and Group 4 decode through `hayro-ccitt` in the sandboxed worker, twelfth session, and the clause's own content is Table 11 — the coding is ITU-T T.4 and T.6, which this clause says it does not describe. Seven of Table 11's eight entries are honoured with the defaults it states: `/K`'s sign selects among Group 4, Group 3 one-dimensional and Group 3 mixed (\"it shall not distinguish between different positive K values\"), `/Columns`, `/Rows`, `/EndOfLine`, `/EncodedByteAlign`, `/EndOfBlock` and `/BlackIs1`. Partial for `/DamagedRowsBeforeError`, which is error concealment the decoder has none of: a value above zero is refused and reported rather than decoded without it, since a producer that asks for concealment is one expecting damage. Two further readings of the clause that are decisions rather than code: a `/Columns` disagreeing with the image's `/Width` is refused, because the row stride the filter produces and the one §8.9.5.1 makes the unpacker read then differ and nothing here says which wins; and a stream whose data runs out before `/Rows` is legal — \"whichever occurs first\" — with the samples never delivered left blank, which the standard does not specify and `decode.rs::pad_to_height` records as a choice."

[[clause]]
clause = "7.4.7"
title = "JBIG2Decode filter"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-sandbox/src/decode.rs"]
test = ["crates/pdf-model/tests/jbig2.rs"]
note = "Decoded by `hayro-jbig2` in the confined worker (ADR 0014), with Table 12's `/JBIG2Globals` carrying the page-0 segments several images may share. The clause's own content beyond that is a set of *restrictions on the bit stream*, and they are worth listing because they are what a reader may assume: the embedded organisation of ISO/IEC 14492 Annex D.3, page 1 only, no colour palette segments (type 54) and `COLEXTFLAG` 0, and — the one this tree does not enforce — \"the JBIG2Decode filter shall not be used with inline images\". An inline image naming it is decoded rather than refused, which draws what the producer wrote; the strongest evidence the decode is right is not a reference renderer but the corpus's own invariant, 96 encodings of one image producing byte-identical pixels."

[[clause]]
clause = "7.4.8"
title = "DCTDecode filter"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "Baseline and progressive JPEG through `zune-jpeg`, in this process. **Table 13's `/ColorTransform` is not read**, and the twenty-seventh session sized that silence rather than guessing at it. The clause's rule has three cases: an Adobe APP14 marker wins outright; with no APP14 the dictionary entry governs; with neither, the default is 1 for three components and 0 otherwise. Four corpus documents write the entry and all four write 0. Two are single-component images, where the clause says the entry \"shall be ignored\". One is three-component with a JFIF marker. **One — `issue12841_reduced.pdf` — is three-component with neither marker, which is exactly the case where the clause says the dictionary decides, and obeying it would mean not transforming YCbCr to RGB.** All four reference renderers transform it, the photograph is plainly right when transformed, and the producer evidently did not mean what it wrote. So the entry stays unread and this row records *why*: implementing the sentence would break the only file that exercises it, which is a finding about the corpus and not a licence to ignore the clause. `/ColorTransform` on an image whose PDF colour space is `DeviceCMYK` cannot arise here, since `decode_jpeg` refuses a four-component codestream."

[[clause]]
clause = "7.4.9"
title = "JPXDecode filter"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-sandbox/src/decode.rs"]
test = ["crates/pdf-model/tests/corpus.rs"]
note = "Decoded by `hayro-jpeg2000` in the confined worker (ADR 0014). The clause inverts the usual relationship between an image dictionary and its data, and getting that backwards renders JPEG 2000 images in the wrong colours with nothing to say so: `/ColorSpace` is *optional* and where present overrides the codestream's, `/BitsPerComponent` is ignored either way, and `/Decode` is ignored unless `/ImageMask` is true. All three are implemented that way round. The channel types — ordinary, opacity, premultiplied opacity — reach §11.6.5.2 through `/SMaskInData`. `partial` for two things: the clause's restriction to JPX baseline plus colour spaces 12 and 19 is not checked, and **the decoder cannot be given a target resolution**, so `issue19517.pdf`'s 12608x16806 scan is refused for wanting gigabytes where NOTE 2's resolution progression is the format's own answer. \"This filter shall only be applied to image XObjects, and not to inline images\" is not enforced, as with §7.4.7."

[[clause]]
clause = "7.4.10"
title = "Crypt filter"
status = "implemented"
code = ["crates/pdf-syntax/src/filter.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs"]
note = "A pass-through here, and that is the whole of it: the filter \"allows the document-level security handler to determine which algorithms should be used to decrypt the input data\", so the decryption happens where an object's identity is known — `document.rs`, §7.6.2 — and by the time the filter chain runs the bytes are already plaintext. Table 14's `/Name` selects among §7.6.6's crypt filters and defaults to `Identity`; the clause's closing sentence, that a stream specifying a crypt filter is decrypted \"using the key as is\" rather than through Algorithm 1, is implemented in `crypt.rs` (ADR 0031). \"The Crypt filter shall be the first filter in the Filter array entry\" is a requirement on the writer that this reader does not need: a pass-through commutes with everything."

[[clause]]
clause = "7.5"
title = "File structure"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/robustness.rs::junk_before_the_header_shifts_every_offset_in_the_file"]
note = "The four elements of §7.5.1 and the two ways the last two of them may be written. `xref.rs` is all of it, and it is the crate's most defensive file for the clause's own reason: this is the structure real files corrupt. Linearized PDF (Annexes F and G) is read as what the clause makes it — an *access strategy*, not a different file — and this reader takes the clause's own advice, \"all PDF files should be read using the trailer and cross-reference table\"."

[[clause]]
clause = "7.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Header, body, cross-reference table, trailer — and the sentence that decides how they are read: \"Reading a non-linearized file in a serial manner is not reliable because of the way objects are to be processed after an incremental update.\" So the reader starts at the end and follows `startxref`; scanning for `N G obj` headers exists only for files whose table is unusable, and `XrefTable::recovered_by_scan` records when that happened rather than hiding it."

[[clause]]
clause = "7.5.2"
title = "File header"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/robustness.rs::junk_before_the_header_shifts_every_offset_in_the_file"]
note = "\"The PDF file begins with the 5 characters '%PDF -' and byte offsets shall be calculated from the PERCENT SIGN (25h).\" The second half of that sentence was **not implemented before the thirty-ninth session**, and it is not a tolerance: a file with bytes before its header — NOTE 1 permits any number of them — has a *correct* table whose every offset is short by the junk's length, and this reader fell through to scanning the whole file for object headers instead. `read_from_startxref` now adds the header's position to `startxref`, to `/Prev`, to `/XRefStm` and to every entry, which is zero for a file whose header is at zero. One corpus document has junk before its header (`issue6069.pdf`, which says so in its own page text). The version *number* is deliberately not enforced: the clause lists nine acceptable headers and Annex I's compatibility rules mean a reader that refused a tenth would refuse files it can draw."

[[clause]]
clause = "7.5.3"
title = "File body"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "\"The body of a PDF file shall consist of a sequence of indirect objects\", and since PDF 1.5 also of object streams (§7.5.7). Nothing here is a rule a reader applies: the body is reached through the cross-reference table, never sequentially, and `scan_for_objects` is the exception that proves it — it reads the body serially only when the table is gone."

[[clause]]
clause = "7.5.4"
title = "Cross-reference table"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/robustness.rs::a_subsection_counting_more_entries_than_it_has_still_finds_the_trailer"]
note = "Classic tables: the `xref` keyword, one or more subsections each introduced by a first object number and a count, and 20-byte `n` and `f` entries. Two of the clause's rules are deliberately not enforced, both because enforcing them loses documents rather than protecting anything. The 20-byte fixed width is read as *tokens* rather than as a fixed stride, because producers write 19- and 21-byte entries and the token reading accepts all three; and a subsection whose count exceeds the entries written stops at the `trailer` keyword rather than reading past it, which `outline_goto_action.pdf` needs. The free list is read only for its `f` marker: an object marked free names no object, and the linked list through the next free object's number is a *writer's* structure — nothing a reader resolves consults it."

[[clause]]
clause = "7.5.5"
title = "File trailer"
status = "partial"
code = ["crates/pdf-syntax/src/xref.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/robustness.rs::a_subsection_counting_more_entries_than_it_has_still_finds_the_trailer"]
note = "`startxref`, `%%EOF` and the trailer dictionary, read from the end as \"PDF processors should read a PDF file from its end\" asks. Table 15: `/Root` is required and its absence is fatal (`SyntaxError::TrailerMissing`), `/Prev` chains the sections, `/Encrypt` is §7.6's, `/ID` is read as §7.6.4.3.2 step (e) needs it and never encrypted, `/Info` is unread because §14.3.3 deprecates it. **`/Size` is a documented departure and it is measured.** The clause says \"[a]ny object in a cross-reference section whose number is greater than this value shall be ignored and defined to be missing by a PDF reader\"; enforcing that takes the corpus gate's \"no page one\" count from **11 to 77**, so 66 documents would lose their page tree to a `/Size` their producer understated. 68 of 974 documents write at least one entry beyond `/Size`. The rule protects nothing here — a number beyond `/Size` is looked up like any other and fails like any other if the offset is wrong — and it costs 66 documents, so it is not applied. `partial` for exactly that."

[[clause]]
clause = "7.5.6"
title = "Incremental updates"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "\"[T]he most recent copy of each object shall be the one accessed from the PDF file\", which is one line in `XrefTable::add`: sections are read newest first and an entry never overwrites one already present. That is the whole of incremental update from a reader's side — the clause's other paragraphs are instructions to a writer about what to append. The `/Prev` chain is bounded twice, by a visited set against cycles and by `MAX_XREF_SECTIONS` against a chain long enough to be an attack."

[[clause]]
clause = "7.5.7"
title = "Object streams"
status = "implemented"
code = ["crates/pdf-syntax/src/document.rs", "crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Object streams: Table 16's `/N` and `/First`, the header of object-number and offset pairs, and each object parsed at `/First` plus its offset — the clause's own instruction, \"[a] PDF processor shall rely on the First entry in the stream dictionary to locate the first object\", rather than on the pairs ending where the first object begins. NOTE 7's 2020 correction is why the objects are parsed by offset rather than by scanning for white space between them. **One sentence is satisfied by construction and is worth naming**: \"strings occurring anywhere in an object stream shall not be separately encrypted\" — `expand_object_stream` parses out of the already-decrypted stream data with a plain parser and never calls `decrypt_object`, so a second decryption is not something that was suppressed, it is something there is no path to. `/Extends` is unread and that is the clause: it groups streams into a collection for a *writer*, while a reader reaches a compressed object through the cross-reference entry, which names its stream directly. A generation number other than zero on a compressed object is a rule on the file; the reader does not check it, because the cross-reference entry is what it looks the object up by."

[[clause]]
clause = "7.5.8"
title = "Cross-reference streams"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Cross-reference streams, which most modern files use for everything. Read by the same function that reads a classic table, chosen by whether the `startxref` offset begins with the `xref` keyword — which is the only thing that distinguishes them, since a cross-reference stream is an ordinary indirect object."

[[clause]]
clause = "7.5.8.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "\"Each cross-reference stream contains the information equivalent to the cross-reference table … and trailer … for one cross-reference section\" — so the stream's own dictionary *is* the trailer, and `Section` carries one field for both cases rather than two. The value after `startxref` is the stream object's offset rather than an `xref` keyword's, which is what `read_section` tries second."

[[clause]]
clause = "7.5.8.2"
title = "Cross-reference stream dictionary"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Table 17: `/W`, `/Index` with its `[0 Size]` default, `/Size`, `/Prev`, and `/Type /XRef` unchecked because the offset already said what this object is. The clause's restriction that all of these \"shall be direct objects; indirect references shall not be permitted\" is what makes reading them with `Dictionary::get` rather than `Document::get_key` correct rather than lazy — the document is not open yet, so there is nothing to resolve an indirect value against, and the clause says there cannot be one. The same paragraph forbids a `/Crypt` filter here and requires the stream to be unencrypted, which is why the xref reader runs before `Document::authenticate`."

[[clause]]
clause = "7.5.8.3"
title = "Cross-reference stream data"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Table 18's three entry types, big-endian fields of the widths `/W` gives, with a zero width meaning the field is absent and takes its default — including the clause's special case that a zero first field defaults the *type* to 1. Type 0 is a free entry and names no object, type 1 is an offset, type 2 is an object stream and an index. \"Any other value shall be interpreted as a reference to the null object\", which here is simply not recording an entry: a number with no entry is null by §7.3.10, so the two sentences meet."

[[clause]]
clause = "7.5.8.4"
title = "Compatibility with applications that do not support compressed reference streams"
status = "implemented"
code = ["crates/pdf-syntax/src/xref.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs"]
note = "Table 19's `/XRefStm`, and the clause states the order rather than leaving it to be inferred: \"if an entry is not found in any given standard cross-reference section, the search shall proceed to a cross-reference stream specified by the XRefStm entry before looking in the previous cross-reference section\". `read_from_startxref` reads the hybrid stream immediately after its own section and before following `/Prev`, and `XrefTable::add` keeps the first writer — so the precedence is the clause's, produced by the order of two loops rather than by a comparison."

[[clause]]
clause = "7.6"
title = "Encryption"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs"]
note = "Aggregate of the thirty-three rows below, read as a family in the twenty-second session with encryption as the demand item (ADR 0031). The standard security handler is implemented at every revision §7.6.4.2 Table 21 specifies — 2, 3, 4 and 6 — over /V 1, 2, 4 and 5, with Table 25's V2, AESV2 and AESV3 methods and Table 26's Identity; 19 of the corpus's 26 encrypted documents open with the default user password and the other 7 with theirs. What is left is named rather than silent: §7.6.5's public-key handlers, /R 5, which Table 21 says shall not be used and states no algorithm for, and a revision 4 password outside ASCII, whose PDFDocEncoding bytes are Annex D data this crate does not hold."

[[clause]]
clause = "7.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs::every_specification_pdf_opens", "crates/pdf-syntax/tests/encryption.rs::each_revision_and_method_decrypts_to_a_readable_content_stream"]
note = "One requirement, and it is the one that decides whether any of the rest runs: \"The absence of this entry from the trailer dictionary means that a PDF processor shall consider the document to be not encrypted.\" `Document::authenticate` returns early on a trailer with no /Encrypt and does nothing else. A trailer whose /Encrypt is not a dictionary is refused rather than treated as absent, because a file that says it is encrypted and will not say how is not a file we can draw."

[[clause]]
clause = "7.6.2"
title = "Application of encryption"
status = "implemented"
code = ["crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::the_file_identifier_is_not_decrypted", "crates/pdf-syntax/tests/encryption.rs::strings_in_the_encryption_dictionary_are_not_decrypted"]
note = "All four exceptions. The trailer's /ID is read before the handler exists and never walked; the encryption dictionary is exempted by object number, recorded before authentication; objects inside an object stream are parsed out of already-decrypted bytes and not decrypted again, which is the third exception by construction; and a signature dictionary's /Contents is skipped by `decrypt_dict`, §12.8.1 Table 255 requiring that value to be the hexadecimal string the exception names. Table 20 adds two more, both here: a cross-reference stream and a stream naming its own /Crypt filter. The sentence about a stream that \"refers to an external file\" has no site — §7.3.8's external streams are not read at all — rather than being unimplemented here."

[[clause]]
clause = "7.6.3"
title = "General encryption algorithm"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::each_revision_and_method_decrypts_to_a_readable_content_stream"]
note = "Aggregate of the three below. Both algorithms are implemented in the decrypting direction, which is the only one a reader needs; encrypting is writer-side and the one place it appears is inside §7.6.4.3.4's hash."

[[clause]]
clause = "7.6.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::an_initialisation_vector_with_no_ciphertext_is_an_empty_stream"]
note = "Chooses the algorithm the way the clause does — \"When the value of the V key of the encryption dictionary is 1, 2, 3 or 4 … Algorithm 1 … When the value of the V key … is 5 … Algorithm 1.A\" — and implements RFC 8018's padding, MD5 for key generation at versions 1 to 4, and AES's fixed 16-byte block. The padding sentence is load-bearing in an unobvious direction: \"the pad is present when M is evenly divisible by 16\", so a stream of exactly 16 bytes is an initialisation vector with no message, which three corpus documents write for an empty page."

[[clause]]
clause = "7.6.3.2"
title = "Algorithm 1: Encryption of data using the RC4 or AES algorithms"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/src/crypt.rs::an_object_key_appends_the_bytes_the_clause_names", "crates/pdf-syntax/src/crypt.rs::an_aes_object_key_is_salted_and_the_rc4_one_is_not"]
note = "Steps (a) to (d), including the clause's own worked example for object 258 generation 7, the sAlT extension for AES and only for AES, and the cap at 16 bytes. Step (a)'s \"If the string is a direct object, use the identifier of the indirect object containing it\" is why decryption walks a whole object from its identifier rather than acting on strings where they are found."

[[clause]]
clause = "7.6.3.3"
title = "Algorithm 1.A: Encryption of data using the AES algorithms"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::each_revision_and_method_decrypts_to_a_readable_content_stream"]
note = "One step, and its content is the difference §7.6.3.1 names: the 32-byte file encryption key is used directly, with no per-object derivation. Also implemented here is the clause's closing paragraph, which decides *where* decryption sits: \"Stream data shall be encrypted after applying all stream encoding filters and shall be decrypted before applying any stream decoding filters\", so a stream is decrypted as its object is loaded and the filter chain above it needs no change."

[[clause]]
clause = "7.6.4"
title = "Standard security handler"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs"]
note = "Aggregate of the twelve rows below. Revisions 2, 3, 4 and 6 authenticate and derive keys; revision 5 is refused by name."

[[clause]]
clause = "7.6.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs", "crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::a_document_with_a_password_opens_with_it_and_not_without"]
note = "The reader's obligations are implemented: try the default user password first, accept either password, and preprocess a revision 6 password with SASLprep before converting to UTF-8 and truncating to 127 bytes. What is not is the sentence that follows the permissions list — \"PDF readers shall respect the intent of the document creator by restricting user access\" — which is an obligation on copying, printing and editing rather than on drawing; `Document::permissions` carries Table 22's flags up to an application that has none of those operations yet. The clause's own preceding sentence says why this is a requirement about the application and not about this crate: \"There is nothing inherent in PDF encryption that enforces the document permissions.\""

[[clause]]
clause = "7.6.4.2"
title = "Standard encryption dictionary"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::permissions_come_from_the_p_entry"]
note = "Table 21 and Table 22. /R, /O, /U, /OE, /UE, /P, /Perms and /EncryptMetadata are all read, the last only at /V 4 and 5 as the table says. Table 22's flags are read as an unsigned 32-bit quantity numbered from bit 1, and bit 10 is ignored because the table says to. /R 5 is refused here rather than guessed at: Table 21's entry for it is \"Shall not be used. This value was used by a deprecated proprietary Adobe extension\", so the standard states no algorithm and one corpus document, `issue21579.pdf`, writes it anyway."

[[clause]]
clause = "7.6.4.3"
title = "File encryption key algorithm"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::each_revision_and_method_decrypts_to_a_readable_content_stream"]
note = "Aggregate of the four below; the clause itself only says which algorithm each revision uses."

[[clause]]
clause = "7.6.4.3.1"
title = "General"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::each_revision_and_method_decrypts_to_a_readable_content_stream", "crates/pdf-syntax/tests/encryption.rs::a_document_with_a_password_opens_with_it_and_not_without"]
note = "One sentence, and it is the branch: Algorithm 2 for revision 4 and earlier, Algorithm 2.A for revision 6."

[[clause]]
clause = "7.6.4.3.2"
title = "Algorithm 2: Computing a file encryption key in order to encrypt a document (revision 4 and earlier)"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/src/crypt.rs::a_short_password_is_extended_from_the_start_of_the_padding_string", "crates/pdf-syntax/src/crypt.rs::an_empty_password_is_the_padding_string"]
note = "Steps (b) to (i) in full, including step (f)'s four 0xFF bytes when /EncryptMetadata is false at revision 4 or greater, and step (h)'s fifty rehashes of the first n bytes. Step (a) is where this is `partial`: it wants the password \"converted to PDFDocEncoding\", and this crate holds no Annex D table, so a character outside the ranges where PDFDocEncoding and Unicode provably agree — 0x20 to 0x7E and 0xA1 to 0xFF, since every code the encoding places elsewhere maps a character outside them — is refused by name rather than hashed as something else. No corpus document needs it. Step (a)'s padding rule is also the session's one real defect: appending \"the first 32 − n bytes of the padding string\" is not the same as overlaying the password on the padding string, and the two differ for every password except the empty one, which is the one every reader tries first."

[[clause]]
clause = "7.6.4.3.3"
title = "Algorithm 2.A: Retrieving the file encryption key from an encrypted document in order to decrypt it (revision 6 and later)"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::a_document_with_a_password_opens_with_it_and_not_without"]
note = "Steps (a) to (f), reading the 48-byte /O and /U as the hash, validation salt and key salt the clause describes. Step (f) is implemented as §7.6.4.4.12's Algorithm 13 and its result outranks the plaintext /P, because the clause says the decrypted bytes *are* the user permissions."

[[clause]]
clause = "7.6.4.3.4"
title = "Algorithm 2.B: Computing a hash (revision 6 and later)"
status = "implemented"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::a_document_with_a_password_opens_with_it_and_not_without"]
note = "Steps (a) to (f). The remainder modulo 3 is taken as the sum of E's first sixteen bytes, which is exact because 256 is congruent to 1 modulo 3 and avoids owning 128-bit arithmetic for one comparison. The loop carries a bound of 256 rounds against NOTE 3's \"between 65 and 80\", because its exit test reads a byte of ciphertext the document supplies; reaching it yields a key that does not authenticate, which surfaces as a wrong password rather than as a hang."

[[clause]]
clause = "7.6.4.4"
title = "Password algorithms"
status = "partial"
code = ["crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::a_document_with_a_password_opens_with_it_and_not_without"]
note = "Aggregate of the eleven below. Every algorithm a reader runs is implemented; the five that compute what a writer stores are writer-side, and two of those have their first four steps implemented anyway because Algorithms 6 and 7 reuse them."

[[clause]]
clause = "7.6.4.4.1"
title = "General"
