title = "General"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs", "crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_embedded_file_is_read_with_its_parameters", "crates/pdf-model/src/attachment.rs::a_stated_checksum_is_answered_against_the_bytes"]
note = "Both of the clause's routes are readable and one is walked: the name dictionary's `/EmbeddedFiles` tree for the document as a whole, which `attachment::attachments` lists, and a file specification's own `/EF`, which `attachment::read` reads for whoever holds the specification — §12.5.6.15's file attachment annotations being the caller the clause names, and not yet built. Table 44 and Table 45 are read in full. **The `/CheckSum` is verified since the hundred-and-sixty-ninth session**, and where: the clause's subject is \"the bytes of the uncompressed embedded file\", so the question could not be asked until something decoded a stream, and `Command::Extract` is the one path that does — the old reason here, that checking would mean inflating every attachment, was true of a *list* and expired the moment extraction existed. `/Size` stays the document's claim rather than a measurement, and the extraction test is where the two are compared."

[[clause]]
clause = "7.11.4.2"
title = "Related files arrays"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
