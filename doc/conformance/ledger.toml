note = "Sound: play a sound object. Adjacent to clause 13's exclusion and not covered by it, because §12.6.4.9 is in clause 12; recorded as debt, like §12.3.6's navigators. **Refused by name and said out loud**: `action.rs` answers \"Sound: clause 13's multimedia, excluded by CLAUDE.md principle 5\" and `viewer-ui` prints it when a click reaches one, so this is `reported` rather than `silent` — the row said `silent` while the code has named it since the sixty-second session."

[[clause]]
clause = "12.6.4.10"
