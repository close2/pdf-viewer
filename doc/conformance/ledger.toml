note = "Two ways to specify a soft mask, and both are implemented as of the eighteenth session: a soft-mask dictionary in the graphics state (§11.6.5.1) and a soft-mask image on an image XObject (§11.6.5.2), the latter including at a resolution of its own and with `/Matte` undone. What each of the two rows still owes is stated there."

[[clause]]
clause = "11.6.5.1"
title = "Soft-mask dictionaries"
status = "implemented"
code = ["crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs"]
note = "Table 142 entire. `/S` selects §11.5.2's or §11.5.3's derivation and any other name is refused and reported; `/G` is run as a transparency group with §11.6.6's initialisation, its own `/BBox` clipping it and its `/Matrix` concatenated with the transform in force at the `gs` — not at the painting operation, which is the sentence a later `cm` would otherwise break; `/BC` is read in the group's own `/CS`, so its component count is that space's, and defaults to the space's initial colour; `/TR` is sampled onto the 256 values an eight-bit mask value can take, exactly, and clamped as the clause requires. The value outside the group's bounding box is the transfer function of 0.0 or of the backdrop's luminosity, which falls out of drawing the group onto transparency rather than being a second code path. The over-report the previous note described is gone: §11.6.4.3's precedence is now read, so an image carrying its own mask is drawn with the graphics state's mask off."

[[clause]]
clause = "11.6.5.2"
title = "Soft-mask images"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "An `/SMask` sample-for-sample with its image supplies its alpha, and `/SMaskInData` is honoured for JPEG 2000. Table 143's `/Width` restriction is where the gap is: a mask's dimensions are \"independent\" of the parent's, and \"both images shall be mapped to the unit square in user space … regardless of whether the samples coincide individually\" — so a mask of a different size must still apply. We hold one raster per image and no device resolution, so combining them means choosing a grid: the image's loses the mask's detail, the mask's costs its area (`issue16263.pdf` gives a 2x2 image a 34862x4332 mask). Neither is a decision for an image decoder, so the mask is left unapplied and reported. 3 corpus documents. `/Matte` is not read, and is only meaningful where the dimensions match."

[[clause]]
clause = "11.6.6"
title = "Transparency group XObjects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Was `silent` — a /Group was read nowhere and a group XObject was drawn as an ordinary form — and is implemented as of the seventeenth session. Table 145's /S selects the subtype, /I and /K are read, and the four actions this clause adds to Do are performed: the initial backdrop, the initialisation of the blend mode and both alpha constants (NOTE 1's reason — those parameters belong to the group, and leaving them in force applies them twice), compositing the elements into the group, and painting the group's result into the parent under the state at Do. The requirement that each Do be treated as a separate group falls out, since nothing is cached. What is not implemented is the group colour space: /CS is read and named where compositing in it would differ from compositing in the device's three components, which is 4 corpus documents, all of them /DeviceCMYK. Honouring it means holding the group's raster in its own components, which is a second raster format rather than a colour conversion."

[[clause]]
clause = "11.6.7"
title = "Patterns and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_shading_carries_the_non_stroking_constant"]
note = "A shading pattern composites \"as if the shading dictionary were applied with the sh operator\", which is exactly how `paint_shading` and `fill_paint` treat it, and both carry §11.6.4.4's constant as of the fifteenth session. What is not honoured is the implicit group the clause wraps a pattern in: `tile` replays a tiling pattern's cell with the current blend mode and alpha constants inherited rather than reset to their defaults and applied once to the finished pattern. That is the closest available approximation while §11.4.6 does not exist — the constant reaches the cell's objects instead of the pattern's result — and it differs where a cell sets a constant of its own or where two tiles overlap. `/ExtGState` in a shading pattern dictionary is not read either."

[[clause]]
clause = "11.7"
title = "Colour space and rendering issues"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs", "crates/pdf-model/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs", "crates/pdf-model/tests/soft_masks.rs"]
note = "Aggregate of the five below, read as a family in the eighteenth session because §11.6.5.1's `/BC` is stated in a group's blending colour space and this is the clause that says what such a space is. Two of its five subclauses are satisfied and one is a departure this tree already reports. §11.7.4's overprinting was recorded as six `silent` rows by that reading and re-decided by the nineteenth session's reading of §8.6.6 and §8.6.7: Table 146's blend function is the source colour for every row a three-process-component group space with no spot colourants can reach, so four of its five subclauses are satisfied and the fifth is §11.6.2's already-reported gap. ADR 0028."

[[clause]]
clause = "11.7.1"
title = "General"
status = "inapplicable"
note = "One sentence introducing the subclauses below. There is no requirement to implement, and claiming one would put code against a clause that asks for none."

[[clause]]
clause = "11.7.2"
title = "Colour spaces for transparency groups"
status = "reported"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/soft_mask.rs"]
note = "Every compositing computation here happens on the three components of the device raster, so the group blending space this clause governs is device RGB whatever a `/CS` says. Three of its rules are therefore departures rather than gaps, and each is reported where it can change a pixel: a group whose `/CS` is not a three-component RGB space (§11.6.6, 4 corpus documents, all `/DeviceCMYK`), a soft-mask group whose `/CS` is not one either (§11.5.3, 7 documents), and the inheritance rules — a device space taking the nearest CIE-based ancestor's, a non-isolated group taking its nearest isolated ancestor's — which have nothing to inherit into. \"For the compositing computations to work in a device-independent way, the group's colour space should be CIE-based\" is a *should*, and this tree does not: it converts every colour once, into device RGB, which is trap 6's one-conversion rule and the reason the two backends cannot disagree about colour. Annex P's algorithm is the same subject and equally unimplemented."

[[clause]]
clause = "11.7.3"
title = "Spot colours and transparency"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "The clause offers two treatments for a spot colour inside a group — keep a component of its own, or \"be converted to its alternate colour space\" — and this tree always takes the second: a `Separation` or `DeviceN` colour goes through its tint transform into the alternate space at the moment it is read, before anything composites. That is conforming rather than a shortcut, and it makes the clause's one *shall* about soft masks true by construction: \"spot colours shall not be available in a transparency group XObject that is used to define a soft mask; the alternate colour space shall always be substituted in that case.\" What is given up is the first treatment's separation fidelity, which needs a raster per colourant and a device that has them."

[[clause]]
clause = "11.7.4"
title = "Overprinting and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "Aggregate of the five below, and **the ledger's six `silent` rows the eighteenth session opened, closed by reading Table 146 rather than by writing a blend mode**. Four of the five subclauses are satisfied here by derivation: this device's group colour space has three additive *process* components and no spot colourants, and every row of Table 146 that such a space can reach gives the blend function the source colour `C_s`, in all three of its `OP false` / `OP true, OPM 0` / `OP true, OPM 1` columns — which is the Normal blend function, and is what this tree composites through. §11.7.4.5 has the row-by-row working. The fifth, §11.7.4.4, is a gap and is `reported` under §11.6.2. The honest limit is one configuration: Table 146's first row needs the *group* space to be `DeviceCMYK`, which §11.6.6 and §11.7.2 already report as a departure on 4 corpus documents, so overprinting's one visible case here is a gap that is already named. ADR 0028."

[[clause]]
clause = "11.7.4.1"
title = "General"
status = "inapplicable"
note = "One paragraph describing overprinting in the *opaque* imaging model — §8.6.7's parameters — and two NOTEs. It states no requirement of its own, and the paragraph's own subject is settled by §8.6.7 on this device: overprinting deals with device colourants, and NOTE 2 says as much, \"it is best to think of transparency as taking place in appearance space, but overprinting of device colourants in device space\". This device produces no separations. The requirements are in the four subclauses below."

[[clause]]
clause = "11.7.4.2"
title = "Blend modes and overprinting"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause's requirement is what happens *without* the special blend mode, and this tree does it: \"For colour components whose value has not been specified, a source colour value of 1.0 shall be assumed; when objects are fully opaque and the Normal blend mode is used, this shall have the effect of erasing those components. This treatment is consistent with the behaviour of the opaque imaging model with the overprint parameter set to false.\" Every colour here is converted into all three components of the device raster and painted through Normal, so no component of the group space is ever left unspecified and there is nothing to erase. Its second half — that only separable, white-preserving blend modes apply to spot colours, and Normal is substituted otherwise — has no spot colourant to apply to (§8.6.6.4 requires an additive device to substitute the alternate space always), so it is true with nothing to do. The eighteenth session's note for this row quoted a sentence — \"the blend mode shall be replaced by the special overprinting blend mode, disregarding the current blend mode\" — that **is not in the standard**; the sentence it paraphrases is §11.7.4.3's, and that clause says *may*."

[[clause]]
clause = "11.7.4.3"
title = "Compatibility with opaque overprinting"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "This is where the special overprinting blend mode is defined, and the clause's own verb is permissive: \"a PDF processor **may** consider implementing a special blend mode that consults the overprint-related graphics state parameters\". What settles the row is not the permission but the mode's *value* here, which the clause gives in two bullets. The first needs both the current and the group colour space to be `DeviceCMYK`; this device's group space is three additive components, so the second applies: \"In all other cases, the value of B(Cb,Cs) shall be Cs for all colour components specified in the current colour space, otherwise Cb.\" §11.7.3 makes every object paint every *process* component of the group space, so all three are specified and the blend function is `Cs` — Normal. NOTE 2 closes the one route that might have escaped: for \"Separation and DeviceN spaces that revert to their alternate colour space\" the current colour space *is* the alternate, which §8.6.6.4 makes unconditional on an additive device, so a spot colour cannot reach the first bullet either. The implicit non-isolated group the clause asks for when the current blend mode is not Normal is therefore unnecessary by its own NOTE 3."

[[clause]]
clause = "11.7.4.4"
title = "Special path-painting considerations"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
note = "The one requirement of §11.7.4 that is *not* satisfied here, and it is not about overprinting. With overprinting disabled — which is this device's state always — the clause's second bullet applies unconditionally to `B`, `B*`, `b`, `b*` and text rendering modes 2 and 6: \"In all other cases, a non-isolated knockout group shall be established. Within the group, the fill and stroke shall be performed with their respective prevailing alpha constants and the prevailing blend mode. The group results shall then be composited with the backdrop, using an alpha value of 1.0 and the Normal blend mode.\" This tree emits a `Fill` and a `Stroke`, so the band they share composites twice. That is the same gap §11.6.2 owns and is reported on the same condition — the paint composites and both parts mark the page — on 4 corpus documents. Implementing it is §11.4.6's knockout groups, which is where the fix belongs."

[[clause]]
clause = "11.7.4.5"
title = "Summary of overprinting behavior"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "Table 146 is the whole of what an implementation executes, and it collapses on this device. Its nine rows are indexed by the source colour space and by which component *of the group space* is affected; here the group space is device RGB, three process components and no spot colourants. Row by row: the three `spot colourant` rows — the only ones whose `OP true` cells give the backdrop `C_b` — have no component to affect, because there are none. Row 1's `OPM 1` cell, the only other departure from `C_s`, applies to a `C, M, Y, or K` component of the *group* space, which §11.7.4.3's first bullet confirms by requiring both spaces to be `DeviceCMYK`. Row 2 (`DeviceCMYK` source, process component other than CMYK), row 4 (any process space, process component) and row 9 (a group) give `C_s` in all three columns. The `Separation`/`DeviceN` rows are unreachable, since §8.6.6.4 makes such a space revert to its alternate on an additive device and NOTE 2 of §11.7.4.3 says the reverted space is the current one. So `B(C_b,C_s) = C_s` everywhere, which is Normal. NOTE 2's rule that a group reverts to Normal is the same answer arriving for a second reason. What this derivation rests on is that the device has no spot colourants and three process components: a separations-capable device would owe the whole table, and this row is where that would be recorded."

[[clause]]
clause = "11.7.5"
title = "Rendering parameters and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "Aggregate of the three below: which rendering parameters apply where objects overlap. The halftone and transfer function half describes a marking device this tree does not have; the colour-conversion half is honoured trivially, because a colour is converted once, at the moment it is read, rather than at a group boundary."

[[clause]]
clause = "11.7.5.1"
title = "General"
status = "inapplicable"
note = "Prose dividing the rendering parameters into the two categories the two subclauses below treat. No requirement of its own."

[[clause]]
clause = "11.7.5.2"
title = "Halftone and transfer function"
status = "inapplicable"
code = ["crates/pdf-model/src/content.rs"]
note = "Requires an implementation to track the halftone and transfer function per *region* of the page, since the topmost fully opaque object at each point decides them. Both parameters describe a marking device — §10.5 and §10.6 — and this tree reads neither: `/HT`, `/TR`, `/TR2`, `/BG` and `/UCR` are named in `content.rs` only as the `/ExtGState` entries §8.6.8 forbids an uncoloured figure to set. With nothing to track, the tracking is inapplicable rather than owed. It becomes applicable the day a transfer function is honoured, and this row is where that will be recorded."

[[clause]]
clause = "11.7.5.3"
title = "Rendering intent, black point compensation and colour conversions"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause's subject is *when* a conversion happens: in the transparent model the target may be a group's colour space rather than the device's, so the intent and the black point compensation in force at that moment are the ones that apply. Here every colour is converted to device RGB at the moment it is read, so the parameters in force are always the object's own — which is what the clause asks for, by a route that makes the question unaskable. `/RI` and `/UseBlackPtComp` are read and reach that conversion (§8.6.5.9, ADR 0012). What is not done is the second half: black generation and undercolour removal \"shall be applied only during conversion from DeviceRGB to DeviceCMYK\", which this tree never performs, and the selection of an ICC profile's `A2B` table by intent, which §8.6.5.8 already records."

[[clause]]
clause = "12.1"
title = "General"
status = "silent"
note = "Clause 12's own map: annotations, forms, actions, navigation, digital signatures. This tree implements the parts that *put marks on a page* — §12.5's annotation appearances in full, §12.7.4's variable text, §8.11's optional content — and none of the parts that make a document interactive. `CLAUDE.md` states the split the other way round from the clause: \"everything that displays\" is in scope and *behaviour* is not, with JavaScript excluded by name. So this row is `silent` for the navigation and action families rather than for the whole clause, and the subclause rows say which is which."

[[clause]]
clause = "12.2"
title = "Viewer preferences"
status = "partial"
code = ["crates/pdf-model/src/viewer_preferences.rs", "crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/src/viewer_preferences.rs::table_147s_entries_are_read", "crates/pdf-model/tests/page_geometry.rs::view_area_and_view_clip_choose_what_is_displayed_and_what_is_clipped"]
note = "Every entry of Table 147 is read, and the two that decide pixels are applied. `/ViewArea` and `/ViewClip` name §14.11.2 boundaries — which of the five is displayed, and which the contents are clipped to — so a document may show the media box while clipping the ink to the trim box, and `Page::display_box` and `Page::clip_box` are those two answers. Both are deprecated in PDF 2.0 and both are read, for the reason §8.6.5.1's withdrawn `CalCMYK` is: deprecation tells a *writer* what to stop doing. The rest is data for a window this program does not have — hiding a tool bar, centring a window, a print dialogue's copy count — and `/PrintArea` and `/PrintClip` are read and unused for the same reason as `/Duplex`: nothing here prints. Two entries have conditions applied rather than stored: an unrecognised `/PrintScaling` \"shall\" be `AppDefault`, and Table 148 then forbids `/Enforce` naming it. **What is owed is `/DisplayDocTitle`**, which 22 corpus documents set and which needs §14.3.2's XMP `dc:title` — the entry is read and the title it names is not. 58 of 974 documents state a `/ViewerPreferences`; **none states any of the four boundary entries**, so the half of the clause that can change a pixel has no corpus witness and was written from the clause."

[[clause]]
clause = "12.3"
title = "Document-level navigation"
status = "partial"
code = ["crates/pdf-model/src/destination.rs", "crates/pdf-model/src/outline.rs", "crates/pdf-model/src/thumbnail.rs"]
test = ["crates/pdf-model/tests/destinations.rs::an_open_action_that_states_a_destination_names_a_page", "crates/pdf-model/tests/outlines.rs::a_stated_count_agrees_with_the_count_the_clause_defines", "crates/pdf-model/tests/thumbnails.rs::every_thumbnail_decodes_and_is_compared_with_the_page_it_stands_for"]
note = "Document-level navigation: an outline, thumbnails, destinations, collections and navigators. Three of the five are read — §12.3.2's destinations in all three spellings, §12.3.3's whole outline hierarchy, and §12.3.4's thumbnail images decoded with Table 87's insignificant entries dropped — and what is missing of each is a *panel*, which is `viewer-ui` rather than clause work. §12.3.5's collections and §12.3.6's navigators stay `silent` and are file-browser surfaces over §7.11's embedded files. **This row said \"[n]ot one of them is implemented\" for forty sessions after §12.3.2 and §12.3.3 landed**, which is the understated-parent shape §14.8.5.1 and §12.4 taught: a parent row is not maintained by the sessions that close its children."

[[clause]]
clause = "12.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/outline.rs", "crates/pdf-model/src/thumbnail.rs"]
test = ["crates/pdf-model/tests/outlines.rs::a_document_with_an_outline_produces_its_items", "crates/pdf-model/tests/thumbnails.rs::every_thumbnail_decodes_and_is_compared_with_the_page_it_stands_for"]
note = "The framing: an outline and a set of thumbnails, each item associated with a destination. Both are read as data and neither is a *surface* this program has — `viewer-ui` shows one page at a time, turns pages with the arrow keys, and puts the outline item covering the current page in the title bar. `partial` for the two panels, which §6.3.2.2's ranking and `CLAUDE.md`'s scope statement both make owed."

[[clause]]
clause = "12.3.2"
title = "Destinations"
status = "partial"
code = ["crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/tests/destinations.rs::an_open_action_that_states_a_destination_names_a_page"]
note = "Destinations, in all three of their spellings — the explicit array, the structure element and the name — read into one type by `Destination::read`, because every caller in the standard may be handed any of them. What a destination *names* is computed; what a *window* would do with it is not, and the split is stated on §12.3.2.1's row. One consumer exists, the catalog's `/OpenAction`, and it is the only destination a viewer must resolve without anybody clicking anything. The other three callers the clause names — an outline item, a link annotation and a go-to action — are `silent` on their own rows and each now needs only the gesture that reaches it."

[[clause]]
clause = "12.3.2.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/destination.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/tests/destinations.rs::an_open_action_that_states_a_destination_names_a_page"]
note = "The clause lists a destination's three items, and this row is `partial` because the tree answers exactly the first of them: \"[t]he page of the document that shall be displayed\" is a property of the document and `Destination::page_index` computes it; \"[t]he location of the document window on that page\" and \"[t]he magnification (zoom) factor\" are properties of a window with scrolling and zoom, which this program does not have — it fits a page to its surface. `View` carries Table 149's parameters exactly as the file states them and nothing acts on them. 55 of the 974 corpus documents state an `/OpenAction` and 49 name a page this reader finds; the viewer opens there."

[[clause]]
clause = "12.3.2.2"
title = "Explicit destinations"
status = "partial"
code = ["crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/src/destination.rs::every_form_table_149_lists_is_read", "crates/pdf-model/src/destination.rs::a_null_parameter_is_not_a_zero"]
note = "All eight of Table 149's forms are read, with the table's own distinction between an absent parameter and a zero one: \"[a] null value for any of the parameters left, top, or zoom specifies that the current value of that parameter shall be retained unchanged\", and \"[a] zoom value of 0 has the same meaning as a null value\" — so `View` carries `Option<f32>` and a stated zero coordinate stays a coordinate. The clause requires the first entry to be \"an indirect reference to a page object (except in a remote go-to action …)\", and the NOTE makes the integer form belong to another document, so `Target::Number` names nothing here; no corpus link uses it and one `/OpenAction` does, where the clause's fallback and the lenient reading agree on page one anyway. `partial` for the two things a window would do: the view is not applied, and \"the smallest rectangle enclosing all of its contents\" — the bounding box `/FitB`, `/FitBH` and `/FitBV` need — is not computed."

[[clause]]
clause = "12.3.2.3"
title = "Structure destinations"
status = "implemented"
code = ["crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/src/destination.rs::a_structure_destination_finds_its_page_through_the_kids", "crates/pdf-model/src/destination.rs::the_fallback_to_page_one_belongs_to_structure_destinations_only"]
note = "A destination whose first entry is a structure element, and the clause states the whole algorithm for getting back to a page: the kids in linear array order, a marked-content or object reference answering with its page, a child element recursed into, and \"[i]n the case where no page content is identified, then the page reference shall be assumed to be the first page in the document\". **It needs `/K` and `/Pg` and not the structure tree**, which is why this row closes while §14.7's stay `silent` — the row said the opposite for two sessions. The page a reference \"belongs to\" is Table 357's and Table 358's `/Pg`, falling back to the containing element's, which §14.7.5.3 states in as many words. The fallback to page one is a sentence about structure destinations and is not applied to any other unresolvable reference."

[[clause]]
clause = "12.3.2.4"
title = "Named destinations"
status = "implemented"
code = ["crates/pdf-model/src/destination.rs", "crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-model/src/destination.rs::a_named_destination_is_found_in_either_table", "crates/pdf-model/tests/destinations.rs::a_named_destination_resolves_when_its_document_defines_it"]
note = "Both of the clause's tables — the PDF 1.1 `/Dests` dictionary in the catalog and the PDF 1.2 `/Dests` name tree in the name dictionary — and both key forms, with the dictionary-valued destination's `/D` followed. Annex J.3.3 and J.3.4, which the clause requires the lookup to use, cost nothing here: both reduce to a binary comparison of the *decoded* bytes, which is what the lexer has already produced. The corpus measures the clause's own pairing and finds it exact: of 106 named destinations reachable from link annotations, the 22 that resolve are 2 names in a catalog dictionary and 20 strings in a name tree, not one crossing. The other 84 name keys their own document does not define — five files carry named links and no table at all — which is a fact about those files and is asserted as one."

[[clause]]
clause = "12.3.3"
title = "Document outline"
status = "partial"
code = ["crates/pdf-model/src/outline.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/outline.rs::the_visible_count_skips_a_closed_items_descendants", "crates/pdf-model/tests/outlines.rs::a_stated_count_agrees_with_the_count_the_clause_defines"]
note = "The whole hierarchy is read: Table 150's root, Table 151's items with `/Title` as a §7.9.2.2 text string, a destination from `/Dest` or from a go-to action's `/D`, Table 152's italic and bold bits, `/C` clamped to `DeviceRGB`, and the sign of `/Count` deciding whether an item is open. The walk follows `/First` and `/Next` only — `/Prev`, `/Last` and `/Parent` are redundant with what it already has and could only disagree — and refuses to visit an object twice, because all six links are indirect references a producer can get wrong. **`/Count` is stated as a three-step algorithm rather than as a number**, so a document states the same fact twice and can be checked against itself: 144 of the 146 corpus documents that state one over a non-empty outline agree with the steps run over their own items, and the two that do not contradict *themselves* — `nested_outline.pdf` marks three items open with `/Count 2` apiece, which makes nine visible, and says 3. `partial` because a viewer with no panel cannot show it: what `viewer-ui` uses is `section_at`, the innermost item covering the page being drawn, shown in the title bar. That mapping from a page back to an item is a **documented choice** — the clause describes a panel a person clicks and states nothing about it."

[[clause]]
clause = "12.3.4"
title = "Thumbnail images"
status = "partial"
code = ["crates/pdf-model/src/thumbnail.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/src/thumbnail.rs::only_the_five_significant_entries_of_table_87_survive", "crates/pdf-model/src/thumbnail.rs::an_ignored_soft_mask_does_not_reach_the_pixels", "crates/pdf-model/tests/thumbnails.rs::every_thumbnail_decodes_and_is_compared_with_the_page_it_stands_for"]
note = "A page's `/Thumb`, decoded into the same RGBA raster every other image becomes — and the clause's work is *subtraction*: \"only the Width , Height , ColorSpace , BitsPerComponent , and Decode entries are significant; all of the other entries listed in `Table 87 -Additional entries specific to an image dictionary` shall be ignored if present\". `thumbnail::significant` drops those eighteen, so a `/SMask` or a `/Mask` on a thumbnail reaches no pixel, while `/Filter`, `/DecodeParms` and `/Length` survive because they are **Table 5's** and the sentence names Table 87 — which the clause's own EXAMPLE requires, writing `/Filter [/ASCII85Decode /DCTDecode]`. The clause's two producer-side constraints are recorded rather than enforced: a `/Subtype` other than `Image`, and a colour space that is not `DeviceGray`, `DeviceRGB` or `Indexed` on one of them. 11 corpus documents state a thumbnail on page one, all 11 decode, one (`issue19517.pdf`) states an `ICCBased` space the clause does not permit. `partial` for the panel, which is `viewer-ui` work — and **generating** a missing thumbnail, which the clause permits and `CLAUDE.md` principle 2 forbids on the launch path."

[[clause]]
clause = "12.3.5"
title = "Collections"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::the_clauses_own_email_inbox_reads_as_five_columns", "crates/pdf-model/src/collection.rs::a_navigator_names_layouts_in_the_order_the_file_prefers_them", "crates/pdf-model/tests/collections.rs::no_corpus_document_is_a_portable_collection"]
note = "Table 153 whole, with Tables 154 to 158 behind it: the schema's fields with their two kinds of subtype, `/D`, `/View`, `/Sort`, `/Colors`, `/Split`, `/Navigator` and `/Folders`. Three of its rules are answered rather than stored, because each is a decision a reader makes: `Collection::initial_document` is §12.3.5.1's three fallbacks for `/D` — the container, the first file, or \"an empty preview window\" — as three values rather than an `Option`; `Sort::ascending` applies Table 156's single-boolean-or-array rule; and `FieldKind::is_in_the_item` is the clause's own division between fields whose data is in §7.11.6's `/CI` and \"file-related fields\" whose data is already in the file specification. `partial` for the sentence a viewer owes and this one cannot pay: \"[i]f this dictionary is present in a PDF document, the interactive PDF processor shall present the document as a portable collection\", which needs a file browser. **No corpus document states a `/Collection`**, so the clause's own EXAMPLE 1 — an email in-box of five columns — is the test."

[[clause]]
clause = "12.3.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::the_clauses_own_email_inbox_reads_as_five_columns"]
note = "The general clause and its tables, read in `collection.rs`. What makes a collection *presented* rather than merely described is §12.3.5.1's \"shall present the document as a portable collection\", which is a user interface; everything the interface would read is here. Table 153's `/View` defaults to `D`, and the one place the entry is load-bearing rather than a preference is §7.6.7's unencrypted wrapper document, where the clause requires `H` — a browser over the wrapper would hide the page that says the payload is encrypted."

[[clause]]
clause = "12.3.5.2"
title = "Collection hierarchical folders"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::a_files_folder_is_written_into_its_name_tree_key", "crates/pdf-model/src/collection.rs::a_folder_name_is_a_file_name_by_the_clauses_five_rules", "crates/pdf-model/src/collection.rs::a_navigator_names_layouts_in_the_order_the_file_prefers_them"]
note = "Table 159's folder tree, walked from `/Folders` along `/Child` and `/Next` with §12.3.3's defence — forward links only, each object once — and the two rules the clause states as prose rather than as entries. **A file's folder is written into its name-tree key**: `<3>report.pdf` is folder 3, one or more digits between the brackets, and a key that does not conform means the root folder rather than an error, which is `collection::folder_of`. **A folder name is a *file name***, which the clause defines by five requirements — a text string, no NUL, none of eight special characters, and not ending in a full stop — and `collection::is_file_name` answers it without refusing anything, because the clause leaves that open: \"[a]n interactive PDF processor may choose to support invalid names or not\". `partial` for the panel. The corpus's 23 embedded files are all plain keys, measured, so no document has folders."

[[clause]]
clause = "12.3.6"
title = "Navigators"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::a_navigator_names_layouts_in_the_order_the_file_prefers_them"]
note = "**This row was wrong for thirty-odd sessions** and its own note is the evidence: it said a navigator is \"supplied as SWF\" and that anyone widening `CLAUDE.md`'s exclusion list \"should start here, with an argument\". ISO 32000-2's §12.3.6 names no media format at all — a navigator dictionary holds `/Layout`, one or more of seven **named layouts** (`D`, `T`, `H`, `FilmStrip`, `FreeForm`, `Linear`, `Tree`), each described in the clause's own prose. The SWF navigator was an Adobe extension this standard replaced. So it is a reader's question and is read: `Navigator::preferred` is the clause's selection rule — \"an interactive PDF processor should present the first one it is capable of displaying in the order present in the array\" — which takes the layouts a *caller* can draw, since the answer depends on the viewer as much as on the file. `partial` because nothing draws one."

[[clause]]
clause = "12.4"
title = "Page-level navigation"
status = "partial"
code = ["crates/pdf-model/src/page_label.rs", "crates/pdf-model/src/article.rs", "crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/tests/page_labels.rs::the_clauses_own_example_produces_the_labels_it_states", "crates/pdf-model/src/article.rs::the_clauses_own_example_is_three_beads_on_two_pages", "crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "Page-level navigation: page labels, articles and presentations, and all three are now read. §12.4.2's labels are `implemented` and shown in the title bar; §12.4.3's articles are read as threads of beads and `partial` for the zoom a bead's `/R` asks for; §12.4.4's presentation is read entire and played by nobody. So the clause is `partial` for what a *window* would do with any of the three, which is the same sentence three subclauses say in three ways — this row was `silent` for eighty-eight sessions while two of its children were not, which is the understated-parent shape §14.8.5.1 taught."

[[clause]]
clause = "12.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/page_label.rs", "crates/pdf-model/src/article.rs", "crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/tests/page_labels.rs::the_clauses_own_example_produces_the_labels_it_states", "crates/pdf-model/src/article.rs::the_clauses_own_example_is_three_beads_on_two_pages", "crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "The framing: page-level navigation is what a reader does *within* a document once it is open, as against §12.3's overview of the whole of it. The clause names its three mechanisms — page labels, articles, presentations — and each has its own row; the framing itself states no requirement beyond naming them, and all three are read."

[[clause]]
clause = "12.4.2"
title = "Page labels"
status = "implemented"
code = ["crates/pdf-model/src/page_label.rs"]
test = ["crates/pdf-model/tests/page_labels.rs::the_clauses_own_example_produces_the_labels_it_states", "crates/pdf-model/tests/page_labels.rs::every_document_stating_labels_labels_its_first_page"]
note = "Page labels, in full: the catalog's `/PageLabels` number tree, Table 161's `/S`, `/P` and `/St`, and the rule that a range runs to the start of the next. Four things the clause states and a first implementation gets wrong: **there is no default numbering style**, so a range with a `/P` and no `/S` labels every one of its pages identically — the clause's own NOTE spells that out with `Contents`; **`/A` is not base 26**, it is \"A to Z for the first 26 pages, AA to ZZ for the next 26\", so the twenty-eighth page is `BB` and not `AB`; the Roman form is subtractive, which the clause's example fixes by running `i, ii, iii, iv` rather than `iiii`; and `/St` \"shall be greater than or equal to 1\", so a file writing zero gets the stated default. The prefix is a *text string*, decoded by §7.9.2.2's own function. **The clause's worked example is the test** — nine labels, `i ii iii iv 1 2 3 A-8 A-9` — because no corpus document exercises all three of its ranges, which is trap 8; 22 of the 974 do state labels and every one of them labels its first page. `viewer-ui` shows the label beside the index rather than instead of it, since a title reading `iv` cannot also say `of 320`."

[[clause]]
clause = "12.4.3"
title = "Articles"
status = "partial"
code = ["crates/pdf-model/src/article.rs"]
test = ["crates/pdf-model/src/article.rs::the_clauses_own_example_is_three_beads_on_two_pages", "crates/pdf-model/src/article.rs::the_ring_closes_and_following_it_wraps", "crates/pdf-model/tests/articles.rs::the_corpus_states_no_article"]
note = "The catalog's `/Threads`, Table 162's thread dictionaries with their `/I` information title, and Table 163's beads walked from `/F` along `/N`. **The chain is a ring**, which is what distinguishes this walk from §12.3.3's outline: `/N` \"[i]n the last bead … shall refer to the first bead\", so termination is a visited set rather than an absent entry, and following past the end wraps — which is what \"follow a thread from one bead to the next\" means at a thread's end. `/V` is deliberately unread, for the outline's reason: it is redundant with `/N` and could only disagree. Table 31's page `/B` is read *only* to be checked against the threads, since NOTE 2 says it \"can be created or recreated\" from them — and the two clauses disagree about its order (\"natural reading order\" in Table 31, \"in drawing order\" here), so the comparison is on the set, which is a documented choice and the only comparison both sentences license. `partial` for the one thing a viewer would do with a bead and this one cannot: `/R` is \"[a] rectangle specifying the location of this bead on the page\", which is a region to zoom to, and `viewer-ui` fits whole pages. **No corpus document states an article**: 2 catalogs carry a `/Threads` entry, one an empty array and one a null, and no page carries a `/B` — measured, and the clause's own EXAMPLE 2 is the test."

[[clause]]
clause = "12.4.4"
title = "Presentations"
status = "partial"
code = ["crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "Presentations: full-screen page transitions, `/Trans` on a page and `/Dur` for an automatic advance, and §12.4.4.2's sub-page navigation. All three are read as of the seventieth session and none is *played*: this program has no presentation mode, and a transition is an animation between two pages, which a display list cannot express and a window's event loop can. `partial` for that reason rather than for a missing reader. Table 164's twelve transition styles are animations, which is nearer clause 13's exclusion than anything else in clause 12 — but the exclusion list is closed and this is not on it, so it stays debt rather than becoming `out-of-scope` by convenience. (This row said \"Table 165's thirteen\" for sixteen sessions; the table is 164 and the styles are twelve.)"
[[clause]]
clause = "12.4.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/src/navigation.rs::the_clauses_own_example_page_states_a_split_and_five_seconds"]
note = "Table 164's transition dictionary and the page's `/Dur`, both read from the page's own dictionary — §7.7.3.4 makes four entries inheritable and neither of these is among them, so a `/Pages` node stating one states nothing. Every entry of Table 164 is read with the table's own default where the file states none: `/S` as twelve named styles plus a variant carrying a thirteenth name the file wrote, `/D`, `/Dm`, `/M`, `/Di` as degrees or the name `None`, `/SS` and `/B`. `R`'s row states an obligation rather than an appearance — \"the D entry shall be ignored\" — so a replacement's duration is zero whatever `/D` says. No `/Dur` at all is the clause's \"the page shall not advance automatically\" and not an advance of zero, which is why it answers `Option`. `partial` because nothing plays any of it: there is no presentation mode, no clock and no animation, and the row above says why that is a coherent place to stop. Demand measured over every page of all 964 openable corpus documents: **not one states a `/Trans` or a `/Dur`**. One finding about the sources rather than the code: `doc/md/`'s conversion of Table 164 drops `/Di`'s \"Default value: 0.\", which the standard's own PDF states — the conversion caveat, met in the wild."

[[clause]]
clause = "12.4.4.2"
title = "Sub-page navigation"
status = "implemented"
code = ["crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "Sub-page navigation: `/PresSteps` on a page, and Table 165's navigation nodes, which \"form a doubly linked list by means of their Next and Prev entries\". Each node is a pair of §12.6 actions, so what walking a page's states takes is the list and a `ViewState` to perform them against — and this row has said since the fifty-fourth session that it was \"the one presentation row whose missing piece is a control rather than a renderer\". The sixty-second and sixty-seventh sessions built the control and the sixty-ninth the list. Only `/Next` is walked: the clause makes the nodes one doubly linked list, so `/Prev` is the same order read backwards, and a file whose two chains disagree has stated two orders with no rule to choose between them. The ring a `/Next` chain may close is bounded by visiting each node once. **Nothing turns a presentation on** — NOTE 3 says nodes need be respected \"only when in presentation mode\", which this program has not got, so what is built is the list and a caller with a presentation mode drives it. NOTE 2's obligation to save and restore the optional content states across presentation mode is why `ViewState` is a value a caller owns and is `Clone`. Neither `PresSteps` nor `NavNode` occurs in the raw bytes of any of the 974 corpus documents."
[[clause]]
clause = "12.5"
title = "Annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_annotation_draws_over_the_page_content"]
note = "An annotation is drawn over the page content and in /Annots order, which is the only thing fixing its order because nothing in a content stream refers to it. Each entry is placed by §12.5.5 and drawn by the same machinery as any other form XObject, with §12.5.3's flags and §8.11.3.3's /OC deciding whether it appears at all. What is missing is everything that is not a mark on the page: no annotation responds to input, and §12.6's actions are not read."

[[clause]]
clause = "12.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_annotation_draws_over_the_page_content"]
note = "The clause's rendering content is that an annotation is associated with a location on a page and that a closed one 'appear[s] on the page in some distinctive form, such as an icon, a box, or a rubber stamp, depending on the specific annotation type' — which each subtype's clause then defines, or does not: see §12.5.6.4's icons. Everything else here is interaction that does not exist yet: opening an annotation to exhibit its object, and Table 31's /Tabs giving the keyboard a row, column or structure order to visit annotations in."

[[clause]]
clause = "12.5.2"
title = "Annotation dictionaries"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_stored_appearance_ignores_the_annotations_opacity"]
note = "Table 166's entries that decide what is drawn are read: /Subtype, /Rect (normalised, and an empty one draws nothing), /F, /AP, /AS, /Border, /C, /CA, /ca, /BM and /OC. The clause's closing rule is implemented and is what shapes crate::appearance — 'A PDF reader shall render the appearance dictionary without regard to any other keys and values in the annotation dictionary and shall ignore the values of the C, IC, Border, BS, BE, BM, CA, ca, H, DA, Q, DS, LE, LL, LLE, and Sy keys' — so those entries are read only where there is no appearance stream to ignore them for. That contradicts one sentence of §12.5.5, which has the appearance's group composited 'using the values of the BM, ca and CA entries'; this row's reading is Table 166's own, stated twice in the /CA and /ca entries, and the contradiction is recorded in §12.5.5's row. Not read: /Contents and /RC (text for a popup window, and §14.9.3's alternate description), /P, /NM, /M, /StructParent, /AF and /Lang — none of which marks the page."

[[clause]]
clause = "12.5.3"
title = "Annotation flags"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "Table 167's three flags that decide whether a screen shows the annotation are honoured: Hidden and NoView suppress it, and Invisible suppresses it only for a subtype outside Table 171, which is the condition the flag's own wording places on it. Print is a printing decision this viewer does not yet make, and the twenty-first session found that it is also the reason a reference renderer disagrees with us about four link borders: ghostscript renders for a printer, where 'If clear, never print the annotation, regardless of whether it is rendered on the screen' means a page with no /F draws no annotation at all. The flag's own next sentence would settle even that case in our favour — 'If the annotation does not contain any appearance streams this flag shall be ignored' — which matters for every appearance this crate constructs. NoZoom and NoRotate make an appearance's size or orientation depend on the view, which a resolution-independent display list cannot express — neither is applied nor reported. ReadOnly, Locked, ToggleNoView and LockedContents constrain user interaction, which does not exist yet."

[[clause]]
clause = "12.5.4"
title = "Border styles"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_link_border_is_drawn_inside_its_rectangle_in_its_own_colour"]
note = "Table 168's /W and /D and three of its five styles are implemented for a constructed appearance, with §12.5.4's own rule about where the border goes: 'If present, the border shall be drawn completely inside the annotation rectangle', so the stroked path is the rectangle inset by half the width. S is solid, D dashes by /D or by /Border's fourth element with the phase the clause fixes at 0, U is 'a single line along the bottom of the annotation rectangle'. B and I are drawn as S and reported: Table 168 calls each a 'simulated' embossed or engraved rectangle and states neither the highlight nor the shadow colour that would produce the illusion, and no corpus document writes either. Table 169's cloudy /BE is refused and reported for the same reason — 'a series of convex curved line segments' states no curve. An unrecognised style name falls back to S, which Table 168 requires. Where an appearance stream exists all of this is ignored, per §12.5.2."

[[clause]]
clause = "12.5.5"
title = "Appearance streams"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_appearance_is_scaled_and_translated_onto_the_annotation_rectangle", "crates/pdf-model/tests/annotations.rs::the_pointer_chooses_between_an_annotations_appearances"]
note = "The placement algorithm is implemented in all three steps, including the part that only a rotating /Matrix exercises: the transformed appearance box is measured around the mapped quadrilateral, and A maps its extreme corners onto /Rect's. /N is followed through an appearance subdictionary by /AS, and a state /AS names but the dictionary does not define draws nothing, which the clause gives as the specified 'reasonable behaviour'. §8.10.2's /BBox clip is applied, which this clause relies on. The requirement that an appearance with no /Group 'shall be treated as a non-isolated, non-knockout transparency group' is satisfied by construction rather than by code: with the annotation's own /BM, /ca and /CA ignored (§12.5.2), that group has alpha 1, the Normal blend mode and no soft mask, and §11.6.7's NOTE 1 makes it identical to painting the elements directly, which is what the interpreter does. **One sentence of this clause is not followed**: 'The transparency group shall be composited ... using the values of the BM, ca and CA entries in the annotation dictionary'. Table 166 says of each of /CA and /ca that it 'shall not be used if the annotation has an appearance stream ... in that case, the appearance stream shall specify any transparency', and §12.5.2 lists all three among the keys a reader shall ignore. Two statements against one, and the two explain the risk the one creates: highlight.pdf writes /CA 0.8 on the annotation and ca 0.8 inside the stream, so applying both would darken the highlight its producer specified. **Table 170's three appearances are chosen since the seventy-sixth session**: the clause states them as three situations rather than as a mode — normal \"when the annotation is not interacting with the user\", rollover when the cursor is in the active area, down \"when the mouse button is pressed or held down within\" it — so which one applies is a property of the pointer and lives in `view::ViewState`, beside §12.6.4's actions and for the same reason: a cursor is not in the document. Hit testing is the caller's, because the active area is a question about a window's coordinates. Table 170 requires only /N, so an annotation with no entry for the state it is in shows its normal appearance, which is also what printing asks for. Not implemented: the NoZoom and NoRotate scaling this clause defers to §12.5.3."

[[clause]]
clause = "12.5.6"
title = "Annotation types"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "Table 171's subtypes are all recognised. Where one carries an appearance stream it is drawn without regard to the subtype, which is what this clause's parent requires; where one does not, the subtype's own subclause decides, and the rows below say which are constructed, which are refused for stating no geometry, and which are excluded."

[[clause]]
clause = "12.5.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "Table 171's list of subtypes is what decides the Invisible flag's scope in §12.5.3 and nothing else here switches on it, which is this clause's own requirement read through §12.5.5: a processor with no native support for a type still renders its normal appearance."

[[clause]]
clause = "12.5.6.2"
title = "Markup annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_stored_appearance_ignores_the_annotations_opacity"]
note = "Table 172's /CA is read, as Table 166's entry of the same name. Nothing else in the clause marks the page by itself: /T, /Subj, /RC, /IRT, /RT, /IT and /ExData are a title, a subject, formatted text, a reply relationship, an intent and external data, all of which reach a comments pane rather than a raster, and /Popup is the window §12.5.6.14 excludes from the page. What is owed is the accessibility half — /Contents is what §14.9.3 extracts as an alternate description — and the interactive one."

[[clause]]
clause = "12.5.6.3"
title = "Annotation states"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_appearance_state_is_selected_by_as"]
note = "This clause is about /State and /StateModel on a reply annotation — Marked or Review, set by a user in a comments pane — and neither marks the page. It is not to be confused with §12.5.5's appearance *state*, which /AS selects and which is implemented; the two words are unrelated and the test named here is for the second. Nothing is owed for rendering; a review workflow is owed for a viewer with interaction."

[[clause]]
clause = "12.5.6.4"
title = "Text annotations"
status = "reported"
note = "A text annotation 'shall appear as an icon' whose name comes from Table 175's /Name, and the clause requires a processor to 'provide predefined icon appearances for at least the following standard names: Comment, Key, Note, Help, NewParagraph, Paragraph, Insert' while stating what none of them looks like. The artwork would be this processor's invention rather than the document's statement, so an appearance-less text annotation is refused and named, in crate::appearance. 1 corpus document. Two further requirements are recorded here rather than implemented: such an annotation 'shall not scale and rotate with the page; they shall behave as if the NoZoom and NoRotate annotation flags ... were always set', which §12.5.3 already owes for those flags, and /Open selects a popup window §12.5.6.14 does not draw."

[[clause]]
clause = "12.5.6.5"
title = "Link annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/link.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_link_border_is_drawn_inside_its_rectangle_in_its_own_colour", "crates/pdf-model/src/link.rs::quad_points_narrow_the_region_and_a_stray_one_is_ignored"]
note = "**Followed since the fifty-seventh session**: a click resolves the link under it through §12.3.2's destinations and turns the page, which is what §12.5.6.5's first sentence is about — a link \"represents either a hypertext link to a destination elsewhere in the document … or an action to be performed\". `/QuadPoints` bounds the activation region and Table 176's third condition is honoured exactly: coordinates that \"lie outside the region specified by Rect\" send the *whole* annotation back to its rectangle rather than widening it. `/H`'s highlighting mode is still a response to a mouse this program does not draw, and a link whose action is a URI or a launch leads nowhere here by design (principle 3). 54 corpus documents have a link on page one — 33 125 of them, 32 768 in one stress-test file — and 36 lead to a page of their own document. A link's visible part is its border, and this is the one subtype whose appearance is stated outside its own subclause: Table 166 makes /C 'a colour used for ... The border of a link annotation' and /Border the rounded rectangle it is drawn as, and §12.5.4 puts it inside /Rect. Both are implemented, including the corner radii and Table 176's /BS. A link with no /C draws nothing, which is a documented choice rather than a derivation — Table 166 gives an *empty* /C the meaning 'No colour; transparent' and states no default for an absent one, and inventing black would put a box around every link whose file says nothing about its colour. Not implemented, and not visible: /A, /Dest and /PA are navigation, /QuadPoints bounds the activation region rather than the drawing (with one exception this crate cannot reach, 'such as when applying an underline border style'), and /H's highlighting mode is a response to a mouse. Four corpus pages are contradicted for drawing this border at all; oracle.rs's CONTRADICTED_LINK_BORDER has the analysis, and neither silent reference is reading the clause differently."

[[clause]]
clause = "12.5.6.6"
title = "Free text annotations"
status = "reported"
note = "A free text annotation 'display[s] text directly on the page' out of /Contents, laid out by the /DA appearance string and /Q quadding of §12.7.4.3, with Table 177's /RC rich text, /DS default style, /CL callout line and /IT intent on top. The text is the annotation, so there is nothing to draw without §12.7.4.3's variable text: refused and named in crate::appearance. 4 corpus documents."

[[clause]]
clause = "12.5.6.7"
title = "Line annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_line_annotations_leader_lines_put_the_line_where_the_clause_says", "crates/pdf-model/tests/annotations.rs::a_leader_line_has_an_offset_before_it_and_an_extension_beyond_it"]
note = "Table 178's `/L` drawn as a stroked segment in `/C` at the width and dash §12.5.4 gives, **with the leader lines the clause states**: `/LL` makes `/L` \"represent the endpoints of the leader lines rather than the endpoints of the line itself\" and then says exactly where the line goes — perpendicular, by `/LL`, in the direction \"that is clockwise when traversing the line from its starting point to its ending point\", with a negative value meaning the other side — so `/LLE`'s extension and `/LLO`'s offset complete a construction that needs nothing invented. It was refused until the eighty-fifth session on the true observation that `/L` is not the line, which is a reason to compute the line rather than to decline; the refusal also fired on the entry's presence rather than its value, so a document stating `/LL 0` — the clause's own \"no leader lines\" — was declined for asking for nothing. Two entries are still refused and each states a different kind of nothing: `/LE`'s endings are Table 179's nine named shapes with no dimension between them (re-read, and \"[t]wo short lines meeting in an acute angle\" is still not a size), and `/Cap` replicates `/Contents` as a caption, which needs a font no entry of a line annotation supplies. `/IT` and `/Measure` change no mark. 3 corpus documents draw, 1 reports."


[[clause]]
clause = "12.5.6.8"
title = "Square and circle annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_circle_is_an_ellipse_inscribed_in_its_rectangle"]
note = "'Square and circle annotations shall display, respectively, a rectangle or an ellipse on the page ... inscribed within the annotation rectangle', filled with Table 180's /IC and stroked in /C at §12.5.4's width — implemented, with /RD's four differences applied in the clause's own order of left, top, right, bottom. The ellipse is four cubic Béziers rather than a conic, which is an approximation this crate documents: PDF has no operator that draws an ellipse. /BE's cloudy border is refused and reported."

[[clause]]
clause = "12.5.6.9"
title = "Polygon and polyline annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_polygons_interior_colour_fills_it_and_a_polylines_does_not"]
note = "Table 181's /Vertices and PDF 2.0's /Path are both built — the second as the m, l and c operands it defines, superseding /Vertices as the table requires — and stroked in /C at §12.5.4's width, closed for a polygon and open for a polyline. /IC divides the two subtypes and the clause says how: 'For Polyline annotations, the value of the IC key is used to fill only the line ending. However, for Polygon annotations, the value of the IC key is used to fill the entire shape', so a polygon's fills it and a polyline's is left to the line endings this crate refuses. A non-None /LE and a cloudy /BE are both refused and reported. /IT and /Measure are not read."

[[clause]]
clause = "12.5.6.10"
title = "Text markup annotations"
status = "reported"
note = "The four text markup subtypes are refused and named, and this row is the clearest case in the family of a clause that describes an appearance without stating it. §12.5.6.10 gives the /QuadPoints of Table 182 — each quadrilateral 'encompasses a word or group of contiguous words', oriented against the edge from (x1, y1) to (x2, y2) — and then says only that such annotations 'shall appear as highlights, underlines, strikeouts ... or jagged ('squiggly') underlines'. Nothing states an underline's thickness or offset, where in the quadrilateral a strikeout crosses, a squiggle's amplitude or period, or how a highlight keeps the text under it legible, and Table 182 does not even admit a /BS to take a width from. The corpus shows the guesses differ: on annotation-highlight-without-appearance.pdf the three reference renderers draw three different pictures. 13 corpus documents."

[[clause]]
clause = "12.5.6.11"
title = "Caret annotations"
status = "reported"
note = "A caret annotation is 'a visual symbol that indicates the presence of text edits' and Table 183 adds only /RD, the difference between /Rect and 'the actual boundaries of the underlying caret', and /Sy naming a paragraph symbol. The symbol itself is not stated anywhere, so an appearance-less caret is refused and named. No corpus document reaches it."

[[clause]]
clause = "12.5.6.12"
title = "Rubber stamp annotations"
status = "reported"
note = "A rubber stamp's appearance is an icon named by Table 184's /Name — Approved, Draft, Experimental and eleven more — and the clause states no artwork for any of them, exactly as §12.5.6.4 does not for its seven. Refused and named. No corpus document reaches it without an /AP; every stamp in the corpus carries one, which is what a producer that cares about its stamp looking like anything has to do."

[[clause]]
clause = "12.5.6.13"
title = "Ink annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_ink_annotation_is_stroked_along_its_ink_list"]
note = "Table 185's /InkList is drawn as one stroked subpath per entry, in /C at §12.5.4's width, and PDF 2.0's /Path supersedes it as the table requires. The clause leaves this crate a choice and it is taken openly: 'When drawn, the points shall be connected by straight lines or curves in an implementation-dependent way' — straight lines, because a curve fitted through a digitiser's samples would be smoothing the document did not ask for. Nothing in the clause is unimplemented; the row is partial rather than implemented because /Path has no test of its own yet."

[[clause]]
clause = "12.5.6.14"
title = "Popup annotations"
status = "implemented"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "A popup is 'a window ... containing text' belonging to a parent markup annotation and displayed in response to it, so it is never part of the page's own rendering: it is skipped before any other question is asked, and its absence is not a gap. Table 166's /AP entry agrees from the other side, naming Popup as one of three subtypes a writer need not supply an appearance dictionary for. /Open and /Parent are the interactive half. The test named here is the nearest one: it pins that an annotation the document does not show reaches neither the display list nor the report, which is the property this clause needs."

[[clause]]
clause = "12.5.6.15"
title = "File attachment annotations"
status = "reported"
note = "A file attachment annotation displays 'an icon' from Table 186's /Name — Graph, PushPin, Paperclip, Tag — and the clause states none of them, so an appearance-less one is refused and named, as §12.5.6.4's and §12.5.6.12's icons are. /FS is the embedded file, which is not a rendering question."

[[clause]]
clause = "12.5.6.16"
title = "Sound annotations"
status = "reported"
note = "A sound annotation, deprecated in PDF 2.0, 'shall be represented by an icon' whose /Name Table 187 gives as Speaker or Mic, with no artwork stated: refused and named. Playing the /Sound stream is a media question, and principle 5's exclusion of clause 13 covers the engine; the icon is not excluded, it is unstated."

[[clause]]
clause = "12.5.6.17"
title = "Movie annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A movie annotation, deprecated in PDF 2.0, carries an /AP like any other annotation and it is drawn — which is the whole of what a still page can show of one. Table 188's /Movie, /A and /Aw are the player and its activation, which principle 5's clause-13 exclusion covers as a media engine; an appearance-less movie annotation is refused and named, because a poster frame is a decoded movie rather than a stated shape."

[[clause]]
clause = "12.5.6.18"
title = "Screen annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A screen annotation is a rectangle a media clip plays in, and its /AP is drawn like any other. Table 189's /MK is an appearance characteristics dictionary as a widget's is, but it reaches this crate only through /AP today, and /A, /AA and /P are activation. The clip itself is clause 13 and excluded by principle 5; an appearance-less screen annotation is refused and named."

[[clause]]
clause = "12.5.6.19"
title = "Widget annotations"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_widget_draws_its_background_and_reports_its_field_value"]
note = "Table 192's /BG background and /BC border are constructed, at §12.5.4's width and style, which is what a widget looks like before its value is set. A widget stating neither and holding no value draws *nothing*, quietly, and that decision is worth as much as the drawing: Table 192 is where a widget's colours come from, so a field without one states no appearance at all, and reporting those named 23 corpus documents for a gap that is not one. What is owed is the value: a text field's /V, a check box's or radio button's state, and a push-button's /CA caption all need §12.7.4.3's variable text, so a widget holding one draws its frame and reports the rest — two true statements rather than one. Table 192's /R is not read and cannot yet matter: it rotates the widget's contents inside /Rect, which no background filling that rectangle and no border inside it can see. /I, /RI, /IX and /IF are a push-button's icon and its fit; /H is a response to a mouse; /Parent is followed for §12.7.4.1's inheritable entries."

[[clause]]
clause = "12.5.6.20"
title = "Printer's mark annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A printer's mark annotation is a registration target, colour bar or cut mark added for production, and §14.11.3 is where it is discussed. Its /AP is drawn like any other annotation's. Table 190's /MN names the mark and §14.11.3 says nothing about what any name looks like, so an appearance-less one is refused and named. Whether such a mark belongs on a screen at all is a §14.11.3 question this row does not settle."

[[clause]]
clause = "12.5.6.21"
title = "Trap network annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A trap network annotation, deprecated in PDF 2.0, defines trapping for a marking device; §14.11.6 owns the subject. Its /AP is drawn like any other, and there is nothing else here a screen can show: trapping compensates for misregistration between printing plates, which a display does not have."

[[clause]]
clause = "12.5.6.22"
title = "Watermark annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "A watermark annotation's appearance stream is drawn like any other annotation's. Table 191's /FixedPrint is what makes it a watermark rather than a stamp — a matrix and a size that keep the mark constant when the page is scaled or printed to another sheet — and it is neither applied nor reported, which is the same shape as §12.5.3's NoZoom and NoRotate: a resolution-independent display list cannot express a size that depends on the view."

[[clause]]
clause = "12.5.6.23"
title = "Redaction annotations"
status = "reported"
note = "A redaction annotation marks content for removal and, in the state this crate sees, is drawn from its /AP if it has one. Table 193's /OverlayText, /Q and /DA describe text painted over the redacted region, which needs §12.7.4.3's variable text, and /RO is an appearance stream to use *after* the redaction is applied — an operation that rewrites the document rather than renders it. /IC and /QuadPoints without /AP would be a guess of the same kind §12.5.6.10 refuses, so an appearance-less redaction is refused and named."

[[clause]]
clause = "12.5.6.24"
title = "Projection annotations"
status = "implemented"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "A projection annotation 'is only valid within the context of an associated run-time environment, such as an activated 3D model', and saves a 3D measurement as markup. With clause 13 excluded by principle 5 there is no such environment here, so an appearance-less projection draws nothing and reports nothing — which Table 166 supports from the other side, naming Projection with Popup and Link as the three subtypes a writer need not give an appearance dictionary. One with an /AP is drawn like any other annotation. The test named here pins the property this row needs: an annotation that is not shown reaches neither the display list nor the report."

[[clause]]
clause = "12.5.6.25"
title = "3D and RichMedia annotations"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "3D and RichMedia annotations are defined by §13.6.2 and §13.7.2, which principle 5's closed list excludes as a media engine rather than a rendering question. Their appearance streams are drawn where they exist, like any other annotation's, because nothing in the placement path switches on subtype."

[[clause]]
clause = "12.6"
title = "Actions"
status = "partial"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/tests/actions.rs"]
note = "Actions — what a PDF *does* when something is triggered. `CLAUDE.md` splits this family down the middle: \"[f]ield *appearance* is not excluded; field *behaviour* is\", and \"JavaScript and script-driven form behaviour\" is on principle 5's closed exclusion list by name. Since the sixty-second session `action.rs` reads Table 196's dictionary and its `/Next` tree, and **the three types that change what a page displays are performed**: §12.6.4.2's go-to, §12.6.4.13's set-OCG-state and §12.6.4.11's hide. The other seventeen are recognised and each carries its own refusal by name. What performs them is `view.rs`'s `ViewState`, which is the first thing in this tree that is neither the document nor the page: a layer a click switched off is not in the file, so `interpret_with` takes it as a third input and `interpret` is that function at the state a document opens in."
[[clause]]
clause = "12.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/tests/actions.rs::a_set_ocg_state_action_changes_what_the_next_render_draws"]
note = "The framing: an action is performed in response to a trigger, and the entries that carry one are read where they are — a link annotation's `/A` (§12.5.6.5, `link.rs`), an outline item's (§12.3.3, `outline.rs`), and the catalog's `/OpenAction` (§7.7.2, `destination.rs`). Table 190's screen annotation and Table 249's FDF field are the two this tree does not reach, and both belong to families it excludes."
[[clause]]
clause = "12.6.2"
title = "Action dictionaries"
status = "implemented"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/src/action.rs::a_next_chain_is_flattened_in_execution_order", "crates/pdf-model/src/action.rs::a_cycle_of_next_entries_terminates"]
note = "Table 196 in full: `/Type` (optional and ignored), `/S` dispatching on Table 201's twenty names, and `/Next`, which is where the work is. NOTE 1 makes the chain a *tree* — \"[a]ctions within each Next array are executed in order, each followed in turn by any actions specified in its Next entry, and so on recursively\" — so `action::read` flattens it depth-first into the order it is performed in, which is also what lets a go-to buried under a sound reach `link.rs`. The clause's own robustness rule is the other half and it is a rule about *broken files*: \"self-referential actions ought not be executed more than once\", so each action object is visited once and the total is bounded. NOTE 2's advice not to modify an action tree while running it is a writer's."
[[clause]]
clause = "12.6.3"
title = "Trigger events"
status = "partial"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/tests/actions.rs::an_annotations_trigger_events_perform_their_actions", "crates/pdf-model/tests/actions.rs::an_annotations_own_action_takes_precedence_over_its_mouse_up_trigger"]
note = "Table 197's ten annotation events and Table 198's two page events are read since the seventy-seventh session — `action::for_annotation` and `action::for_page` — and what they return is §12.6.2's flattened list, which `ViewState::perform_all` performs. Table 197's one precedence rule is applied where it belongs, on the entry it is stated about: \"[f]or backward compatibility, the A entry in an annotation dictionary, if present, takes precedence over\" `/AA /U`, so an annotation stating both performs its `/A` on mouse-up and never its `/U`. `/AA` on a page is read from the page's own dictionary, because §7.7.3.4 makes four entries inheritable and this is not among them. **Nothing raises an event**: entering, pressing and focusing are a window's business and this crate has no events, exactly as §12.5.5's rollover and down appearances are chosen by a `ViewState` a caller sets. That is why this is `partial` rather than `implemented` — the data and the execution are here and the *source* of the events is not. Tables 199 and 200 are excluded rather than owed: every entry of both is an ECMAScript action, which is on principle 5's closed exclusion list, and saying so is the difference between an exclusion and an oversight. 15 of the 974 corpus documents write an `/AA` at all."

[[clause]]
clause = "12.6.4"
title = "Action types"
status = "partial"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/tests/actions.rs"]
note = "Table 201's twenty action types. The rows below take them one at a time; the summary is that **three are performed and they are the three that change what is displayed** — `/GoTo` (§12.6.4.2), `/SetOCGState` (§12.6.4.13) and `/Hide` (§12.6.4.11) — and the other seventeen are recognised and refused by name rather than ignored as a class. `/Trans` is the fourth that could change a mark and does not: §12.4.4's transition is an animation between two renders, and this viewer draws the second one."
[[clause]]
clause = "12.6.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/action.rs"]
test = ["crates/pdf-model/src/action.rs::a_name_the_table_does_not_hold_is_not_an_action"]
note = "The list of types, and the rule that a processor \"shall ignore\" an action whose `/S` it does not recognise — the same compatibility principle §7.8.2's `BX`/`EX` states for operators and Annex I for the file as a whole. Implemented as a *distinction* rather than a blanket: a name Table 201 holds becomes an `Action::Refused` carrying that name, and a name it does not hold produces nothing at all, because calling an unknown name a refused action would claim to know what was refused."
[[clause]]
clause = "12.6.4.2"
title = "Go-To actions"
status = "implemented"
code = ["crates/pdf-model/src/link.rs", "crates/pdf-model/src/outline.rs", "crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/src/link.rs::a_rectangle_is_the_region_and_it_has_edges", "crates/pdf-model/tests/links.rs::a_links_region_is_found_and_its_destination_resolves"]
note = "Go-To: \"a destination that shall be displayed\" in this document, which is Table 206's `/D` read as §12.3.2's destination. Every place the standard puts one is read — a link annotation's `/A`, an outline item's, and the catalog's `/OpenAction` — and each turns the page. The action *dictionary* is the whole of this subclause: what to do with the destination is §12.3.2's, and what a viewer does with the view within the page is stated on §12.3.2.1's row. `/SD`, the structure destination alternative, resolves through §12.3.2.3 like any other."

[[clause]]
clause = "12.6.4.3"
title = "Remote Go-To actions"
status = "silent"
note = "Remote Go-To: a destination in *another* file, whose `page` is an integer index rather than a page object. Opening a second document is a `viewer-ui` question and a security one — §7.11's file specification can name any path."

[[clause]]
clause = "12.6.4.4"
title = "Embedded Go-To actions"
status = "silent"
note = "Embedded Go-To: a destination inside an embedded file, reached through a `/T` target chain of parent and child relationships. Needs §7.11.4's embedded file streams, which nothing here reads."

[[clause]]
clause = "12.6.4.5"
title = "GoToDp action"
status = "silent"
note = "GoToDp: navigate to a document part (§14.12), which is `unreviewed` in clause 14 and unbuilt."

[[clause]]
clause = "12.6.4.6"
title = "Launch actions"
status = "silent"
note = "Launch: run an application or open a file. **The one action in this family whose absence is a security property rather than a gap**, and it should stay absent until somebody writes the argument — principle 3's sandbox exists so that a document cannot reach the machine, and this action is a document asking to."

[[clause]]
clause = "12.6.4.7"
title = "Thread actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/src/action.rs::a_thread_action_names_its_thread_in_all_three_forms", "crates/pdf-model/src/action.rs::a_thread_in_another_file_is_refused_by_name"]
note = "Table 209 whole: `/D` in all three of its forms — a reference to a thread dictionary, an index into the catalog's `/Threads`, or a title from the thread information dictionary — with the clause's own tie-break for a repeated title, \"the one appearing first in the document catalog's Threads array shall be used\"; and `/B` in both of its forms, a reference or an index within the thread, defaulting to the thread's first bead where the optional entry is absent. Resolution is `ThreadJump::bead_in` against §12.4.3's articles, and the answer is a bead whose `/P` names a page, which is what a viewer turns to. A `/F` makes the thread another file's and is refused by name, for `GoToR`'s reason: Table 209 says \"[i]f this entry is absent, the thread is in the current file\", so the entry's presence is the whole test. No corpus document states a thread action, which follows from no corpus document stating a thread."

[[clause]]
clause = "12.6.4.8"
title = "URI actions"
status = "partial"
code = ["crates/pdf-model/src/uri.rs", "crates/pdf-model/src/action.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/uri.rs::rfc_3986_normal_examples", "crates/pdf-model/src/action.rs::a_partial_uri_is_resolved_against_the_documents_base", "crates/pdf-model/tests/actions.rs::a_uri_action_arrives_at_the_viewer_already_resolved"]
note = "Table 210's `/URI` and `/IsMap` and Table 211's `/Base`, which is the whole of what the clause states about a *document*. What the URI is gets decided here: the clause describes a URI \"in Internet RFC 3986\" and says a partial one is interpreted relative to `/Base`, so `uri.rs` is that RFC's section 5.2 reference transformation, with its own section 5.4 examples as the tests — the concatenation a reader reaches for first is wrong on four of them. `/IsMap` appends the cursor as EXAMPLE 1's arithmetic states it, measured from the *upper-left* corner of `/Rect`, which is the half that inverts. **What is not done is the resolving itself**: `viewer-ui` prints the URI rather than opening it, because handing a document-controlled string to a browser is a decision about this machine and not about the file. With no `/Base`, a partial URI is \"interpreted relative to the location of the document itself\", which this crate does not know — `Uri::relative` says so rather than a scheme being invented, which is what one corpus document (`pr19449.pdf`, `foo.bar.com`) would otherwise get. 217 URI actions in 8 of the 974 documents; one states a `/Base` and one states a partial reference, and they are different files."

[[clause]]
clause = "12.6.4.9"
title = "Sound actions"
status = "silent"
note = "Sound: play a sound object. Adjacent to clause 13's exclusion and not covered by it, because §12.6.4.9 is in clause 12; recorded as debt, like §12.3.6's navigators."

[[clause]]
clause = "12.6.4.10"
title = "Movie actions"
status = "silent"
note = "Movie: play a movie annotation. Deprecated in PDF 2.0 in favour of §13.2's screen annotations and rendition actions, which principle 5 *does* exclude — so this row is one deprecation away from being out of scope, and saying so is cheaper than arguing it."

[[clause]]
clause = "12.6.4.11"
title = "Hide actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/actions.rs::a_hide_action_stops_an_annotation_being_drawn", "crates/pdf-model/tests/actions.rs::a_show_action_clears_the_flag_the_file_set"]
note = "Hide, in both directions and in all three of Table 214's forms for `/T`: an indirect reference to an annotation, a fully qualified field name resolved through §12.7.4.2, or an array of either. `/H` defaults to true. **This one changes what is drawn** — the clause sets and clears the same Hidden flag §12.5.3 defines, so `/H false` shows an annotation whose own `/F` hides it, which is the half a reader gets wrong by treating the action as a filter laid over the file. The state lives in `ViewState` and not in the document, because this program does not write files. No corpus document states one: the sixty-second session walked every object of all 964 openable documents and found no `/Hide` at all."
[[clause]]
clause = "12.6.4.12"
title = "Named actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/action.rs::a_named_action_is_one_of_table_215s_four_page_commands", "crates/pdf-model/tests/actions.rs::a_named_action_asks_the_viewer_to_turn_the_page"]
note = "All four of Table 215's names, which are the whole of the table: `NextPage`, `PrevPage`, `FirstPage` and `LastPage`, each an `Action::Named` that reaches the viewer as a `view::Request::Page` and moves it. The movement is `Named::page_from`, clamped at both ends because no document has a page before its first. A name outside the four produces **no action at all** rather than a refusal, because the clause states that case itself — a processor that \"does not recognise the name … shall take no action\" — and the corpus's one instance is a `/Print`, which is a viewer command rather than a page. 3 of the 974 documents write a named action; 8 of their 9 are the four standard names."

[[clause]]
clause = "12.6.4.13"
title = "Set-OCG-state actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/actions.rs::a_set_ocg_state_action_changes_what_the_next_render_draws", "crates/pdf-model/src/view.rs::turning_a_radio_button_group_on_turns_its_siblings_off"]
note = "Set-OCG-state, with Table 217's `/State` processed left to right — each name applying \"to the subsequent groups until the next name is encountered\", a group set as many times as it appears, which is what the clause's EXAMPLE 2 turns on — and `/PreserveRB`, whose default of **true** is what made Table 99's `/RBGroups` load-bearing: a group turned on takes every other member of its radio-button collection off with it. `/RBGroups` had been recorded as unread for the whole project; it is read here and nowhere else, because §8.11.4.5 gives it no part in the *initial* state. **One corpus document states this action**, measured over every object of all 964 openable files."
[[clause]]
clause = "12.6.4.14"
title = "Rendition actions"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "Rendition actions control a media player — a rendition, a screen annotation and a playback state. Principle 5's closed list excludes \"Clause 13, multimedia and 3D — a media engine, not a rendering question\", and this action's whole subject is clause 13's; the clause number is in 12 only because that is where actions live."

[[clause]]
clause = "12.6.4.15"
title = "Transition actions"
status = "silent"
note = "Transition: run a page transition (§12.4.4) in the middle of a presentation. Debt, with §12.4.4."

[[clause]]
clause = "12.6.4.16"
title = "Go-To-3D-View actions"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "Go-To-3D-View sets the view of a 3D annotation, which is §13.6's. Excluded by the same entry as §12.6.4.14."

[[clause]]
clause = "12.6.4.17"
title = "ECMAScript actions"
status = "out-of-scope"
exclusion = "script-behaviour"
note = "ECMAScript actions run a script. Principle 5's closed list excludes \"JavaScript and script-driven form behaviour — a sandboxed script engine is a separate project with its own security argument\". This is the row that exclusion was written for, and the one place in clause 12 where being unimplemented is a decision rather than a debt."

[[clause]]
clause = "12.6.4.18"
title = "Rich-Media-Execute actions"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "Rich-Media-Execute sends a command to a rich media annotation's Flash or 3D content, which is §13.7's. Excluded by the multimedia entry."

[[clause]]
clause = "12.7"
title = "Forms"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/variable_text.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "The display half of the clause is built and the behaviour half is not, which is the division principle 5's exclusions draw. A field's appearance is constructed where §12.7.4.3 states how — its value, its caption, its quadding, its font — and read from `/AP` otherwise. What a field *does* is absent: no actions, no calculation order, no validation, no submission, and ECMAScript is excluded outright."

[[clause]]
clause = "12.7.1"
title = "General"
status = "inapplicable"
note = "Two definitions and a NOTE warning that an interactive form is not a form XObject. No requirement on a processor."

[[clause]]
clause = "12.7.2"
title = "Interactive Forms"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "The clause states the hierarchy — terminal and non-terminal fields, widgets as children, and the merged single-widget dictionary — and one requirement that reaches a page: 'If such an object defines an appearance stream, the appearance shall be consistent with the object's current value as a field.' That sentence is what Table 224's `/NeedAppearances` admits is false, and it is why `appearance::regenerates` sets a stored stream aside for the two field types whose text §12.7.4.3 has a processor lay out. The merged dictionary is handled by reading a widget and its field from the same dictionary, which is what `Field::read` does when the `/Parent` chain is empty. The hierarchy itself is walked upward only; `/Kids` is never followed downward, because nothing that draws needs to."

[[clause]]
clause = "12.7.3"
title = "Interactive form dictionary"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "Three of Table 224's entries reach the page and the rest do not. `/DR` is the resource dictionary of every appearance constructed here (§12.7.4.3) and of every `/DA` string's font, including a free text annotation's; `/DA` and `/Q` are read as the document-wide defaults the table calls them, after the field's own and its ancestors'; `/NeedAppearances` decides whether a stored appearance is rewritten. Not read: `/Fields`, because drawing walks `/Annots` rather than the field tree; `/SigFlags` and `/CO`, which are signature and calculation behaviour; and `/XFA`, which principle 5 excludes by name."

[[clause]]
clause = "12.7.4"
title = "Field dictionaries"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "Family head. §12.7.4.1's inheritance and §12.7.4.3's variable text are implemented; §12.7.4.2's field names are read nowhere, because nothing that draws needs a field's name."

[[clause]]
clause = "12.7.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "Table 226's inheritance is implemented and is what makes a merged widget work: `/FT`, `/Ff` and `/V` are taken from the nearest ancestor that states them, in one walk of the `/Parent` chain rather than one per key. **The clause forbids the bound that walk carries** — 'An interactive PDF processor shall not limit the range of inheritance for field dictionaries' — and it is bounded at 32 anyway, because a `/Parent` chain in a hostile file can be a cycle and principle 3's resource budgets outrank a depth no legitimate form approaches; reaching it is reported rather than read as 'no value'. Table 227's three flags are behaviour: ReadOnly and Required constrain interaction, NoExport constrains submission, and none changes a mark. `/T`, `/TU` and `/TM` are names, `/Kids` is the hierarchy walked the other way, `/AA` is a trigger, and `/DV` matters only to §12.7.6.3's reset."

[[clause]]
clause = "12.7.4.2"
title = "Field names"
status = "implemented"
code = ["crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/src/view.rs::a_hide_action_finds_a_field_by_its_fully_qualified_name", "crates/pdf-model/src/view.rs::one_field_name_may_reach_several_widgets"]
note = "A field's partial and fully qualified names, the PERIOD that separates them, and the rule that a dictionary with no `/T` \"shall not be considered a field but simply a Widget annotation\". **This row was `inapplicable` for eighteen sessions and the reasoning was sound and wrong**: names identify a field for export, scripting and the user interface, none of which decides a mark — until §12.6.4.11's hide action names one, and then a field name decides whether an annotation is drawn. `view.rs` builds the whole table from `/AcroForm /Fields`, appending each partial name to its parent's, and a kid with no `/T` joins its parent's name rather than starting one, so one name reaches every widget of its field. The requirement that two fields sharing a fully qualified name share `/FT`, `/V` and `/DV` is on the writer."
[[clause]]
clause = "12.7.4.3"
title = "Variable text"
status = "partial"
code = ["crates/pdf-model/src/variable_text.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box", "crates/pdf-model/tests/variable_text.rs::a_zero_size_is_auto_sized_until_the_value_fits", "crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "The clause's operation, both of its forms. Where there is no appearance stream one is written: Table 228's `/DA` is parsed for its `Tf`, its colour and its text state, the font is resolved in `/DR`, the value is measured and positioned by `/Q`, and the marks go inside the `/Tx BMC` … `EMC` pair the clause's EXAMPLE shows. Where there is one, the clause's closing paragraph is a *splice* rather than a rebuild — the region from `/Tx BMC` to the matching `EMC` is replaced and everything outside it survives, with `/DR`'s resources copied in behind the stream's own. A size of 0 is auto-sized and at most one `Tm` is honoured with its translation replaced. **Three things the clause hands back are choices and are recorded as such**: where a baseline sits, how far apart two lines are (13/12 of the size, which is §12.7.5.3's own EXAMPLE), and what auto-sizing picks. Not implemented: `/DS` and `/RV`, which are XFA rich text and excluded by principle 5; a composite `/DA` font, which needs a `CMap` inverted and is refused by name; and a `/DA` naming a font `/DR` does not define, which the clause requires the writer to avoid and which is reported rather than guessed at. 5 corpus documents report the last of those. ADR 0032."

[[clause]]
clause = "12.7.5"
title = "Field types"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "Family head. All four field types are recognised and each is taken to whatever §12.7.4.3 can lay out for it: a button's caption, a text field's value, a combo box's selection. A list box and a signature field are the two that state no appearance this tree can build."

[[clause]]
clause = "12.7.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "The four field types the family defines, which `FieldKind::of` reads from Table 226's `/FT` and subdivides by each type's own flags. A fifth name is not a field type and is refused rather than guessed at."

[[clause]]
clause = "12.7.5.2"
title = "Button fields"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "Family head. Bits 15, 16, 17 and 26 divide the type; three of them are read and RadiosInUnison is not, because it describes what happens when a button is clicked. What a button *shows* is its `/AP` state or Table 192's caption, and both are drawn."

[[clause]]
clause = "12.7.5.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_does_not_reach_a_button"]
note = "The three kinds of button field, separated by Table 229's Pushbutton and Radio flags. The clause's requirement that 'an interactive PDF processor shall follow the intended behaviour' is about behaviour; what it decides here is whether a value has an on state at all, which is what `FieldKind::Button`'s `toggling` carries."

[[clause]]
clause = "12.7.5.2.2"
title = "Push-buttons"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_does_not_reach_a_button"]
note = "One sentence with a rendering consequence: a push-button 'retains no permanent value' and 'shall not use the V and DV entries'. So a push-button shows Table 192's caption unconditionally rather than a value, and §12.7.4.3's regeneration does not reach it — there is no text 'not known until viewing time' to regenerate. Table 192's `/RC` and `/AC` are the rollover and down captions, which need a pointer; `/I`, `/RI`, `/IX`, `/IF` and `/TP` are an icon and its fit, and are unread."

[[clause]]
clause = "12.7.5.2.3"
title = "Check boxes"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on", "crates/pdf-model/tests/variable_text.rs::a_check_box_with_nothing_to_draw_says_so"]
note = "The clause locates a check box's appearance and settles which entry selects it, and both are implemented. Each state 'shall be defined by an appearance stream in the appearance dictionary', so `/AP` is where a box's tick comes from and §12.7.4.3's regeneration is not applied to one. Of `/V` and `/AS` the clause is explicit: 'If they are not equal, then the value of the AS key shall be used instead of the V key' — `annotation::normal_appearance` reads `/AS` and never `/V`, which is that rule and was already right before it was read. A box with no `/AP` shows Table 192's caption if it has one and is reported if it does not, because a document saying a box is on while stating no mark for it is worth naming. Not implemented: Table 230's `/Opt`, whose purpose is export values and non-Latin on-state names, and which changes no mark this tree makes."

[[clause]]
clause = "12.7.5.2.4"
title = "Radio buttons"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "A radio button and a check box differ nowhere in what is drawn: both have two states, both take the on state's appearance from `/AP` by `/AS`, both may carry Table 192's caption, and this clause repeats §12.7.5.2.3's `/AS`-over-`/V` sentence verbatim. What is specific to a radio button is all behaviour — NoToggleToOff, the mutual exclusion, RadiosInUnison — and none of it reaches a page. `Off` as the default value is honoured by treating any state but `Off` as on."

[[clause]]
clause = "12.7.5.3"
title = "Text fields"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/variable_text.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_multiline_value_wraps_into_lines_that_run_down_the_box", "crates/pdf-model/tests/variable_text.rs::a_comb_field_spreads_one_character_per_cell", "crates/pdf-model/tests/variable_text.rs::a_password_field_does_not_echo_its_value"]
note = "The clause's own sentence is the implementation: the value 'shall be used to construct an appearance stream for displaying the field, as described under 12.7.4.3' and 'shall be presented in a single style'. Three of Table 231's flags change the layout and all three are read — Multiline wraps, Comb divides the box into Table 232's `/MaxLen` cells and puts one character in each, Password echoes bullets instead of the value. This clause's own EXAMPLE is where the line spacing this tree uses comes from: two lines at `/Ti 12 Tf` set `0 -13 Td` apart. Not read: DoNotScroll and DoNotSpellCheck, which constrain typing; FileSelect, which makes the value a pathname to submit; and RichText, which is XFA and excluded — a `RichText` field's `/V` is laid out as plain text, which the clause's own conventions paragraph says is not what `/RV` describes."

[[clause]]
clause = "12.7.5.4"
title = "Choice fields"
status = "reported"
code = ["crates/pdf-model/src/appearance.rs"]
note = "Half the clause draws and half is refused. A combo box shows its value, which the clause makes a text string — or the first of an array where several are selected — and that goes through §12.7.4.3 like a text field's. A **list box** does not: the clause says which items are selected and states nothing about how a selection *looks*, no highlight colour and no rule, so it is refused and named rather than drawn as unmarked text. Table 234's `/Opt`, `/TI` and `/I` are read nowhere for the same reason — they order and index a list nothing draws. No corpus document reaches either path with no appearance stream, so the refusal is currently a statement about the clause rather than about any page."

[[clause]]
clause = "12.7.5.5"
title = "Signature fields"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "A signature field is drawn from its `/AP` and from nothing else, which is what the clause describes: its value is a signature dictionary rather than text, and signing 'entails updating at least the V entry and usually also the AP entry'. So §12.7.4.3's regeneration does not reach one and a signature field with no appearance stream states nothing to draw. The clause's two visibility rules are already satisfied elsewhere: a zero-size annotation rectangle draws nothing (`annotation::decide`), and Table 167's Hidden and NoView bits are honoured there too. Table 235's `/Lock` and `/SV` are signing behaviour, and validating a signature is §12.8's."

[[clause]]
clause = "12.7.6"
title = "Form actions"
status = "silent"
note = "Form actions: submit, reset and import. `CLAUDE.md` puts field *behaviour* outside what this tree builds while keeping field *appearance* inside it, and these three are behaviour in its purest form — they move a field's value somewhere or replace it. Unimplemented and unreported, which is what `silent` records; nothing here reads an `/A` on a widget at all (§12.6)."

[[clause]]
clause = "12.7.6.1"
title = "General"
status = "silent"
note = "The framing: these actions are triggered from a widget and act on the interactive form as a whole."

[[clause]]
clause = "12.7.6.2"
title = "Submit-form action"
status = "silent"
note = "Submit-form: Table 239's `/F` file specification and Table 240's flags, sending field values as FDF, HTML, XFDF or the whole PDF. A network request initiated by a document, so it belongs with `/Launch` and `/URI` — the missing feature is also a refusal, and principle 3's sandbox is the argument for keeping it one."

[[clause]]
clause = "12.7.6.3"
title = "Reset-form action"
status = "silent"
note = "Reset-form: set the named fields back to their `/DV` default values. **The one action in this family whose effect is entirely local and entirely visible**, and everything under it exists: §12.7.4.3's layout builds a field's appearance from its value, and `/NeedAppearances` already makes this tree rebuild one. What is missing is the value changing."

[[clause]]
clause = "12.7.6.4"
title = "Import-data action"
status = "silent"
note = "Import-data: fill the form from an FDF file (§12.7.8), which is `silent` with it."

[[clause]]
clause = "12.7.7"
title = "Named pages"
status = "silent"
note = "Named pages: `/Pages` in the name tree, used by an FDF `/Pages` entry to add a template page to a document. Needs the name tree §12.3.2.4 and §12.4.2 also need, which is this project's third row waiting on one data structure."

[[clause]]
clause = "12.7.8"
title = "Forms data format"
status = "silent"
note = "Forms data format: a whole file format, with its own header, body, trailer and catalog, carrying field values and annotations in and out of a document. Read by nothing here. Its subclauses are recorded individually rather than as one row because the format is a document type in its own right and the ledger's unit is a subclause."

[[clause]]
clause = "12.7.8.1"
title = "General"
status = "silent"
note = "The framing: FDF exchanges a form's data with a server or another document."

[[clause]]
clause = "12.7.8.2"
title = "FDF file structure"
status = "silent"
note = "An FDF file's structure, which is clause 7's with three differences the subclauses below name."

[[clause]]
clause = "12.7.8.2.1"
title = "General"
status = "silent"
note = "The framing. Worth one sentence for whoever builds it: an FDF file is read by the *same* lexer, parser and cross-reference machinery as a PDF, all of which exist here — what is missing is the semantics on top."

[[clause]]
clause = "12.7.8.2.2"
title = "FDF header"
status = "silent"
note = "The header is `%FDF-1.n` rather than `%PDF-n.m`. §7.5.2's rule that byte offsets are measured from the percent sign applies unchanged, and `xref.rs` implements that — but it recognises only `%PDF-`, so an FDF file would be scanned rather than read from its table."

[[clause]]
clause = "12.7.8.2.3"
title = "FDF body"
status = "silent"
note = "The body is one FDF catalog and the objects it reaches."

[[clause]]
clause = "12.7.8.2.4"
title = "FDF trailer"
status = "silent"
note = "The trailer's `/Root` names the FDF catalog. As §7.5.5, with one required key instead of several."

[[clause]]
clause = "12.7.8.3"
title = "FDF catalog"
status = "silent"
note = "The FDF catalog and its `/FDF` dictionary."

[[clause]]
clause = "12.7.8.3.1"
title = "General"
status = "silent"
note = "Table 243's entries: `/F` and `/ID` naming the document this data belongs to, `/Fields`, `/Pages`, `/Status`, `/Annots`, `/JavaScript`. That last is `out-of-scope` where it appears in a *PDF*; here it is one entry of a format this tree does not read at all, so the row records the whole format's absence rather than splitting the exclusion out."

[[clause]]
clause = "12.7.8.3.2"
title = "FDF fields"
status = "silent"
note = "Table 244's field dictionary: a fully qualified `/T`, a `/V`, and the same appearance-affecting entries §12.7.4 defines — which is why importing data would reach code that already exists, `variable_text.rs`, rather than needing new layout."

[[clause]]
clause = "12.7.8.3.3"
title = "FDF pages"
status = "silent"
note = "FDF pages: template pages to be added to the document. Needs §12.7.7's named pages."

[[clause]]
clause = "12.7.8.3.4"
title = "FDF annotation dictionaries"
status = "silent"
note = "FDF annotations: annotation dictionaries carried in the data file, with a `/Page` saying where each belongs. Their *appearances* are §12.5's and are implemented; what is missing is the route that would put them on a page."

[[clause]]
clause = "12.7.9"
title = "Non-interactive forms"
status = "silent"
note = "Non-interactive forms: a document that looks like a form and carries no `/AcroForm`, so its fields are ordinary page content. **Nothing is missing here at all** — such a document is drawn correctly by this tree because there is nothing interactive in it — but the clause states a *recommendation* to producers and a note about how a processor should treat one, and neither is implemented as a decision. Recorded rather than claimed."

[[clause]]
clause = "12.8"
title = "Digital signatures"
status = "silent"
note = "Digital signatures — the whole family, and this row carries the argument the subclauses share. Nothing in this tree validates a signature. Two things are worth stating once here rather than on every row. First, this is **not** clause 12's interactive half in the sense the others are: a signature's *appearance* is an ordinary widget annotation and is drawn by §12.5 like any other, so a signed document renders correctly and completely; what is missing is the assertion that it has not changed. Second, §7.6.2's signature exception is implemented — `document.rs` exempts a signature dictionary's `/Contents` from decryption, because that value is a digest over the file's own bytes — so the one place signatures touch *rendering* is already right, and it was measured: eight corpus documents carry a signature dictionary, twenty-six carry an `/Encrypt`, and the two sets are disjoint."

[[clause]]
clause = "12.8.1"
title = "General"
status = "partial"
code = ["crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/src/document.rs::a_signature_dictionary_is_recognised_by_its_type"]
note = "Read only as far as §7.6.2's exception needs: a signature dictionary's /Contents is a hexadecimal string that is not encrypted, which `decrypt_dict` skips on a /Type of /Sig or /DocTimeStamp. Nothing validates a signature or draws its appearance from anything but a stored /AP, and neither is reported — a document with an invalid signature looks exactly like one with a valid signature. That is a real gap in clause 12 rather than in this row's use of it."

