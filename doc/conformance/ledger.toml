note = "`ca` and `CA` are two scalars in the graphics state, applied to non-stroking and stroking paint respectively, which is the clause, and which no test isolates — they reach the page through the corpus and the oracle. Two sentences are not: \"The nonstroking alpha constant shall also be applied when painting a transparency group's results onto its backdrop\", which needs groups (§11.4.6), and the /AIS flag, which decides whether the constants are shape or opacity — see §11.6.4.3 for why that cannot show here yet."

[[clause]]
clause = "11.6.5"
title = "Specifying soft masks"
status = "implemented"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_soft_mask_overrides_an_explicit_mask", "crates/pdf-model/tests/soft_masks.rs::a_luminosity_mask_takes_the_groups_grey_and_the_backdrops_outside_it"]
note = "Two ways to specify a soft mask, and both are implemented as of the eighteenth session: a soft-mask dictionary in the graphics state (§11.6.5.1) and a soft-mask image on an image XObject (§11.6.5.2), the latter including at a resolution of its own and with `/Matte` undone. What each of the two rows still owes is stated there."

[[clause]]
clause = "11.6.5.1"
title = "Soft-mask dictionaries"
status = "implemented"
code = ["crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs::a_transfer_function_maps_every_mask_value_including_the_one_outside_the_box", "crates/pdf-model/tests/soft_masks.rs::the_masks_coordinate_system_is_the_one_in_force_at_the_gs", "crates/pdf-model/tests/soft_masks.rs::none_removes_the_mask"]
note = "Table 142 entire. `/S` selects §11.5.2's or §11.5.3's derivation and any other name is refused and reported; `/G` is run as a transparency group with §11.6.6's initialisation, its own `/BBox` clipping it and its `/Matrix` concatenated with the transform in force at the `gs` — not at the painting operation, which is the sentence a later `cm` would otherwise break; `/BC` is read in the group's own `/CS`, so its component count is that space's, and defaults to the space's initial colour; `/TR` is sampled onto the 256 values an eight-bit mask value can take, exactly, and clamped as the clause requires. The value outside the group's bounding box is the transfer function of 0.0 or of the backdrop's luminosity, which falls out of drawing the group onto transparency rather than being a second code path. The over-report the previous note described is gone: §11.6.4.3's precedence is now read, so an image carrying its own mask is drawn with the graphics state's mask off."

[[clause]]
clause = "11.6.5.2"
title = "Soft-mask images"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "An `/SMask` sample-for-sample with its image supplies its alpha, and `/SMaskInData` is honoured for JPEG 2000. Table 143's `/Width` restriction is where the gap is: a mask's dimensions are \"independent\" of the parent's, and \"both images shall be mapped to the unit square in user space … regardless of whether the samples coincide individually\" — so a mask of a different size must still apply. We hold one raster per image and no device resolution, so combining them means choosing a grid: the image's loses the mask's detail, the mask's costs its area (`issue16263.pdf` gives a 2x2 image a 34862x4332 mask). Neither is a decision for an image decoder, so the mask is left unapplied and reported. 3 corpus documents. **`/Matte` is read**, and this sentence said it was not: `image.rs` undoes §11.6.5.2's pre-blending where the arithmetic is exact and reports where it is not, which is one of trap 5's five deliberate report-and-draw cases. Corrected in the hundred-and-twenty-second session. The entry is only meaningful where the dimensions match, which is why it sits beside the gap above rather than in it."

[[clause]]
clause = "11.6.6"
title = "Transparency group XObjects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Was `silent` — a /Group was read nowhere and a group XObject was drawn as an ordinary form — and is implemented as of the seventeenth session. Table 145's /S selects the subtype, /I and /K are read, and the four actions this clause adds to Do are performed: the initial backdrop, the initialisation of the blend mode and both alpha constants (NOTE 1's reason — those parameters belong to the group, and leaving them in force applies them twice), compositing the elements into the group, and painting the group's result into the parent under the state at Do. The requirement that each Do be treated as a separate group falls out, since nothing is cached. What is not implemented is the group colour space: /CS is read and named where compositing in it would differ from compositing in the device's three components, which is 4 corpus documents, all of them /DeviceCMYK. Honouring it means holding the group's raster in its own components, which is a second raster format rather than a colour conversion."

[[clause]]
clause = "11.6.7"
title = "Patterns and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_shading_carries_the_non_stroking_constant", "crates/pdf-model/tests/tiling.rs::the_alpha_constant_applies_to_the_finished_pattern_rather_than_to_each_mark", "crates/pdf-model/tests/tiling.rs::a_pattern_that_composites_trivially_is_not_wrapped_in_a_group"]
note = "A shading pattern composites \"as if the shading dictionary were applied with the sh operator\", which is exactly how `paint_shading` and `fill_paint` treat it, and both carry §11.6.4.4's constant as of the fifteenth session. **The implicit group the clause wraps a *tiling* pattern in is built as of the hundred-and-seventeenth session.** \"The definition shall not inherit the current values of the graphics state parameters at the time it is evaluated; those parameters shall take effect only when the resulting pattern is later used to paint an object\" — so every cell runs with the blend mode, alpha constant and soft mask at their defaults, and the state's own are applied once to the finished tiling by one group over all the tiles, which is what NOTE 2 asks for: \"it is advisable to treat all tiles as a single transparency group. This avoids artifacts due to multiple marking of pixels along the boundaries between adjacent tiles.\" Until then each cell inherited them, so an `0.5 ca` was applied per mark rather than to the pattern and the graphics state's soft mask reached the tiling not at all. Where every one of the three is at its default no group is built, which is §11.4.4's NOTE 5 and is all 122 tiling paints in the corpus — so **no corpus page witnesses this and the rule is here on the clause's evidence**, measured. The group is *isolated* where the clause says non-isolated, which NOTE 1 makes exact wherever no element of the cell blends and which is reported where one does. `/ExtGState` in a shading pattern dictionary is not read, and a shading pattern's own implicit *knockout* group is not built: `sh` composites its result once already, so the two differ only where a shading paints a point twice, which a function of position cannot."

[[clause]]
clause = "11.7"
title = "Colour space and rendering issues"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs", "crates/pdf-model/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs", "crates/pdf-model/tests/soft_masks.rs"]
note = "Aggregate of the five below, read as a family in the eighteenth session because §11.6.5.1's `/BC` is stated in a group's blending colour space and this is the clause that says what such a space is. Two of its five subclauses are satisfied and one is a departure this tree already reports. §11.7.4's overprinting was recorded as six `silent` rows by that reading and re-decided by the nineteenth session's reading of §8.6.6 and §8.6.7: Table 146's blend function is the source colour for every row a three-process-component group space with no spot colourants can reach, so four of its five subclauses are satisfied and the fifth is §11.6.2's already-reported gap. ADR 0028."

[[clause]]
clause = "11.7.1"
title = "General"
status = "inapplicable"
note = "One sentence introducing the subclauses below. There is no requirement to implement, and claiming one would put code against a clause that asks for none."

[[clause]]
clause = "11.7.2"
title = "Colour spaces for transparency groups"
status = "reported"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/soft_mask.rs"]
note = "Every compositing computation here happens on the three components of the device raster, so the group blending space this clause governs is device RGB whatever a `/CS` says. Three of its rules are therefore departures rather than gaps, and each is reported where it can change a pixel: a group whose `/CS` is not a three-component RGB space (§11.6.6, 4 corpus documents, all `/DeviceCMYK`), a soft-mask group whose `/CS` is not one either (§11.5.3, 7 documents), and the inheritance rules — a device space taking the nearest CIE-based ancestor's, a non-isolated group taking its nearest isolated ancestor's — which have nothing to inherit into. \"For the compositing computations to work in a device-independent way, the group's colour space should be CIE-based\" is a *should*, and this tree does not: it converts every colour once, into device RGB, which is trap 6's one-conversion rule and the reason the two backends cannot disagree about colour. Annex P's algorithm is the same subject and equally unimplemented."

[[clause]]
clause = "11.7.3"
title = "Spot colours and transparency"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::the_all_colourant_is_a_complemented_tint", "crates/pdf-model/tests/shadings.rs::a_named_colour_space_is_resolved_against_the_resources_that_paint_it"]
note = "The clause offers two treatments for a spot colour inside a group — keep a component of its own, or \"be converted to its alternate colour space\" — and this tree always takes the second: a `Separation` or `DeviceN` colour goes through its tint transform into the alternate space at the moment it is read, before anything composites. That is conforming rather than a shortcut, and it makes the clause's one *shall* about soft masks true by construction: \"spot colours shall not be available in a transparency group XObject that is used to define a soft mask; the alternate colour space shall always be substituted in that case.\" What is given up is the first treatment's separation fidelity, which needs a raster per colourant and a device that has them."

[[clause]]
clause = "11.7.4"
title = "Overprinting and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "Aggregate of the five below, and **the ledger's six `silent` rows the eighteenth session opened, closed by reading Table 146 rather than by writing a blend mode**. Four of the five subclauses are satisfied here by derivation: this device's group colour space has three additive *process* components and no spot colourants, and every row of Table 146 that such a space can reach gives the blend function the source colour `C_s`, in all three of its `OP false` / `OP true, OPM 0` / `OP true, OPM 1` columns — which is the Normal blend function, and is what this tree composites through. §11.7.4.5 has the row-by-row working. The fifth, §11.7.4.4, is `partial`: both of its populations — the four combined path-painting operators and text rendering modes 2 and 6 — build the knockout group it asks for, and both keep one report. The honest limit is one configuration: Table 146's first row needs the *group* space to be `DeviceCMYK`, which §11.6.6 and §11.7.2 already report as a departure on 4 corpus documents, so overprinting's one visible case here is a gap that is already named. ADR 0028."

[[clause]]
clause = "11.7.4.1"
title = "General"
status = "inapplicable"
note = "One paragraph describing overprinting in the *opaque* imaging model — §8.6.7's parameters — and two NOTEs. It states no requirement of its own, and the paragraph's own subject is settled by §8.6.7 on this device: overprinting deals with device colourants, and NOTE 2 says as much, \"it is best to think of transparency as taking place in appearance space, but overprinting of device colourants in device space\". This device produces no separations. The requirements are in the four subclauses below."

[[clause]]
clause = "11.7.4.2"
title = "Blend modes and overprinting"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause's requirement is what happens *without* the special blend mode, and this tree does it: \"For colour components whose value has not been specified, a source colour value of 1.0 shall be assumed; when objects are fully opaque and the Normal blend mode is used, this shall have the effect of erasing those components. This treatment is consistent with the behaviour of the opaque imaging model with the overprint parameter set to false.\" Every colour here is converted into all three components of the device raster and painted through Normal, so no component of the group space is ever left unspecified and there is nothing to erase. Its second half — that only separable, white-preserving blend modes apply to spot colours, and Normal is substituted otherwise — has no spot colourant to apply to (§8.6.6.4 requires an additive device to substitute the alternate space always), so it is true with nothing to do. The eighteenth session's note for this row quoted a sentence — \"the blend mode shall be replaced by the special overprinting blend mode, disregarding the current blend mode\" — that **is not in the standard**; the sentence it paraphrases is §11.7.4.3's, and that clause says *may*."

[[clause]]
clause = "11.7.4.3"
title = "Compatibility with opaque overprinting"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "This is where the special overprinting blend mode is defined, and the clause's own verb is permissive: \"a PDF processor **may** consider implementing a special blend mode that consults the overprint-related graphics state parameters\". What settles the row is not the permission but the mode's *value* here, which the clause gives in two bullets. The first needs both the current and the group colour space to be `DeviceCMYK`; this device's group space is three additive components, so the second applies: \"In all other cases, the value of B(Cb,Cs) shall be Cs for all colour components specified in the current colour space, otherwise Cb.\" §11.7.3 makes every object paint every *process* component of the group space, so all three are specified and the blend function is `Cs` — Normal. NOTE 2 closes the one route that might have escaped: for \"Separation and DeviceN spaces that revert to their alternate colour space\" the current colour space *is* the alternate, which §8.6.6.4 makes unconditional on an additive device, so a spot colour cannot reach the first bullet either. The implicit non-isolated group the clause asks for when the current blend mode is not Normal is therefore unnecessary by its own NOTE 3."

[[clause]]
clause = "11.7.4.4"
title = "Special path-painting considerations"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_filled_and_stroked_path_is_one_object", "crates/pdf-model/tests/text_render_modes.rs::a_translucent_mode_2_glyph_is_one_knockout_group", "crates/pdf-model/tests/text_render_modes.rs::the_implicit_group_does_not_depend_on_the_text_knockout_parameter"]
note = "With overprinting disabled — which is this device's state always, §8.6.7 and ADR 0028 — the clause's first bullet cannot be reached and the second applies unconditionally: \"In all other cases, a non-isolated knockout group shall be established. Within the group, the fill and stroke shall be performed with their respective prevailing alpha constants and the prevailing blend mode. The group results shall then be composited with the backdrop, using an alpha value of 1.0 and the Normal blend mode.\" **The clause names two populations and this row described one of them for forty-nine sessions.** The path half — `B`, `B*`, `b`, `b*` — has been a knockout group since the seventy-second session under §11.6.2, and this row went on saying \"this tree emits a Fill and a Stroke\" and that implementing it \"needs §11.4.6's knockout groups\", which the seventy-first session drew. The other half is \"the painting of glyphs with text rendering mode 2 or 6\", and that was **neither implemented nor reported** until the hundred-and-twenty-first session: its NOTE 1 says the rule \"is independent of the text knockout parameter in the graphics state\", so §9.3.8's group — which needs `/TK` true *and* two glyphs overlapping — never stood in for it, and a single translucent outlined glyph got the double border NOTE 2 exists to prevent. Both halves now build the same `Command::Group`, and where §9.3.8's own group encloses the text object it holds the glyphs' parts flat, because a knockout group inside a knockout group computes the same picture and neither backend can state one. `partial` for the condition both halves keep: a portion whose shape is not the coverage it is drawn with, or an element that blends, is pushed flat and named (`knockout_is_drawable`). No corpus page reaches the text half — counted, by comparing every corpus page's display list either side of the change — and 2 documents still report the path half."

[[clause]]
clause = "11.7.4.5"
title = "Summary of overprinting behavior"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "Table 146 is the whole of what an implementation executes, and it collapses on this device. Its nine rows are indexed by the source colour space and by which component *of the group space* is affected; here the group space is device RGB, three process components and no spot colourants. Row by row: the three `spot colourant` rows — the only ones whose `OP true` cells give the backdrop `C_b` — have no component to affect, because there are none. Row 1's `OPM 1` cell, the only other departure from `C_s`, applies to a `C, M, Y, or K` component of the *group* space, which §11.7.4.3's first bullet confirms by requiring both spaces to be `DeviceCMYK`. Row 2 (`DeviceCMYK` source, process component other than CMYK), row 4 (any process space, process component) and row 9 (a group) give `C_s` in all three columns. The `Separation`/`DeviceN` rows are unreachable, since §8.6.6.4 makes such a space revert to its alternate on an additive device and NOTE 2 of §11.7.4.3 says the reverted space is the current one. So `B(C_b,C_s) = C_s` everywhere, which is Normal. NOTE 2's rule that a group reverts to Normal is the same answer arriving for a second reason. What this derivation rests on is that the device has no spot colourants and three process components: a separations-capable device would owe the whole table, and this row is where that would be recorded."

[[clause]]
clause = "11.7.5"
title = "Rendering parameters and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "Aggregate of the three below: which rendering parameters apply where objects overlap. The halftone and transfer function half describes a marking device this tree does not have; the colour-conversion half is honoured trivially, because a colour is converted once, at the moment it is read, rather than at a group boundary."

[[clause]]
clause = "11.7.5.1"
title = "General"
status = "inapplicable"
note = "Prose dividing the rendering parameters into the two categories the two subclauses below treat. No requirement of its own."

[[clause]]
clause = "11.7.5.2"
title = "Halftone and transfer function"
status = "inapplicable"
code = ["crates/pdf-model/src/content.rs"]
note = "Requires an implementation to track the halftone and transfer function per *region* of the page, since the topmost fully opaque object at each point decides them. Both parameters describe a marking device — §10.5 and §10.6 — and this tree reads neither: `/HT`, `/TR`, `/TR2`, `/BG` and `/UCR` are named in `content.rs` only as the `/ExtGState` entries §8.6.8 forbids an uncoloured figure to set. With nothing to track, the tracking is inapplicable rather than owed. It becomes applicable the day a transfer function is honoured, and this row is where that will be recorded."

[[clause]]
clause = "11.7.5.3"
title = "Rendering intent, black point compensation and colour conversions"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause's subject is *when* a conversion happens: in the transparent model the target may be a group's colour space rather than the device's, so the intent and the black point compensation in force at that moment are the ones that apply. Here every colour is converted to device RGB at the moment it is read, so the parameters in force are always the object's own — which is what the clause asks for, by a route that makes the question unaskable. `/RI` and `/UseBlackPtComp` are read and reach that conversion (§8.6.5.9, ADR 0012). What is not done is the second half: black generation and undercolour removal \"shall be applied only during conversion from DeviceRGB to DeviceCMYK\", which this tree never performs, and the selection of an ICC profile's `A2B` table by intent, which §8.6.5.8 already records."

[[clause]]
clause = "12.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/actions.rs::a_hide_action_stops_an_annotation_being_drawn", "crates/pdf-model/tests/links.rs::a_links_region_is_found_and_its_destination_resolves"]
note = "Clause 12's own map: annotations, forms, actions, navigation, digital signatures. `CLAUDE.md` states the split this row records — \"everything that displays\" is in scope and *behaviour* is not, with JavaScript excluded by name — and after twelve sessions on this clause **no row of it is `silent`**, which as of the hundred-and-first session is true of the whole ledger. Every row is `implemented`, `partial`, `reported`, `inapplicable` or `out-of-scope`: §12.2's preferences, §12.3's destinations, outline, thumbnails and collections, §12.4's labels, articles and presentations, §12.5's annotations and their constructed appearances, §12.6's twenty action types with eight performed, §12.7's field appearances, its reset action, §12.7.8's forms data format read whole and §12.7.7's named pages that its templates come from, §12.8's signatures read and never verified, §12.9's measurements, §12.10's geospatial dictionaries and §12.11's requirements. This row said \"[n]one of the parts that make a document interactive\" while a click had been following links since the fifty-seventh session."

[[clause]]
clause = "12.2"
title = "Viewer preferences"
status = "partial"
code = ["crates/pdf-model/src/viewer_preferences.rs", "crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/src/viewer_preferences.rs::table_147s_entries_are_read", "crates/pdf-model/tests/page_geometry.rs::view_area_and_view_clip_choose_what_is_displayed_and_what_is_clipped"]
note = "Every entry of Table 147 is read, and the two that decide pixels are applied. `/ViewArea` and `/ViewClip` name §14.11.2 boundaries — which of the five is displayed, and which the contents are clipped to — so a document may show the media box while clipping the ink to the trim box, and `Page::display_box` and `Page::clip_box` are those two answers. Both are deprecated in PDF 2.0 and both are read, for the reason §8.6.5.1's withdrawn `CalCMYK` is: deprecation tells a *writer* what to stop doing. The rest is data for chrome a *host* owns — hiding a tool bar, centring a window, a print dialogue's copy count. **Since the hundred-and-thirty-seventh session they are handed over rather than merely read**: `viewer-core`'s `Query::Preferences` answers with Table 147 whole, which is the most this crate can do about a window it has none of by construction. The reason this row used to give — \"a window this program does not have\" — expired in the hundred-and-thirty-second session when `pdf-viewer.rs` became a host, and the sweep that found it was looking for exactly that: a note whose *reason* has gone stale. Consumer #1 still hides nothing, because it has no tool bar to hide — and `/PrintArea` and `/PrintClip` are read and unused for the same reason as `/Duplex`: nothing here prints. Two entries have conditions applied rather than stored: an unrecognised `/PrintScaling` \"shall\" be `AppDefault`, and Table 148 then forbids `/Enforce` naming it. **`/DisplayDocTitle` is honoured with a documented departure since the hundred-and-seventy-third session.** Table 147 names \"the document title taken from the `dc:title` entry of the XMP metadata stream\"; this program reads no XMP (§14.3.2's row says why), so a document asking for its title gets §14.3.3's `/Info /Title` — which Table 349's own NOTE 1 calls the same fact in the other place, \"[t]he `dc:title` entry … **can be used to represent** the document's title\". The two can disagree and the standard ranks them nowhere, so the substitution is a *choice* and is printed once for each document that sets the flag and carries a stream. Measured over the 22 that set it: 8 state an `/Info /Title` and 18 carry a stream. 58 of 974 documents state a `/ViewerPreferences`; **none states any of the four boundary entries**, so the half of the clause that can change a pixel has no corpus witness and was written from the clause."

[[clause]]
clause = "12.3"
title = "Document-level navigation"
status = "partial"
code = ["crates/pdf-model/src/destination.rs", "crates/pdf-model/src/outline.rs", "crates/pdf-model/src/thumbnail.rs"]
test = ["crates/pdf-model/tests/destinations.rs::an_open_action_that_states_a_destination_names_a_page", "crates/pdf-model/tests/outlines.rs::a_stated_count_agrees_with_the_count_the_clause_defines", "crates/pdf-model/tests/thumbnails.rs::every_thumbnail_decodes_and_is_compared_with_the_page_it_stands_for"]
note = "Document-level navigation: an outline, thumbnails, destinations, collections and navigators. Three of the five are read — §12.3.2's destinations in all three spellings, §12.3.3's whole outline hierarchy, and §12.3.4's thumbnail images decoded with Table 87's insignificant entries dropped — and what is missing of each is a *panel*, which is `viewer-ui` rather than clause work. §12.3.5's collections and §12.3.6's navigators stay `silent` and are file-browser surfaces over §7.11's embedded files. **This row said \"[n]ot one of them is implemented\" for forty sessions after §12.3.2 and §12.3.3 landed**, which is the understated-parent shape §14.8.5.1 and §12.4 taught: a parent row is not maintained by the sessions that close its children."

[[clause]]
clause = "12.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/outline.rs", "crates/pdf-model/src/thumbnail.rs", "crates/viewer-ui/src/chrome.rs"]
test = ["crates/pdf-model/tests/outlines.rs::a_document_with_an_outline_produces_its_items", "crates/pdf-model/tests/thumbnails.rs::every_thumbnail_decodes_and_is_compared_with_the_page_it_stands_for"]
note = "The framing: an outline and a set of thumbnails, each item associated with a destination. Both are read as data, and **one of the two is now a surface**: since the hundred-and-sixty-sixth session `viewer-ui` draws §12.3.3's outline in a panel of its own, with `pdf-font`'s compiled-in Helvetica and a `pdf-render` display list, and a click on a title sends `Command::GoTo(PageTarget::Destination)`. `partial` for the thumbnail panel, which §6.3.2.2's ranking and `CLAUDE.md`'s scope statement both make owed, alone: §12.3.3 itself closed in the hundred-and-sixty-eighth session, when `Command::Activate` gave an outline item the other half of its sentence."

[[clause]]
clause = "12.3.2"
title = "Destinations"
status = "partial"
code = ["crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/tests/destinations.rs::an_open_action_that_states_a_destination_names_a_page"]
note = "Destinations, in all three of their spellings — the explicit array, the structure element and the name — read into one type by `Destination::read`, because every caller in the standard may be handed any of them. What a destination *names* is computed; what a *window* would do with it is not, and the split is stated on §12.3.2.1's row. The catalog's `/OpenAction` was the first consumer, and it is the only destination a viewer must resolve without anybody clicking anything. **All four callers the clause names now have their gesture**: a link annotation since the fifty-seventh session, a go-to action since the sixty-second, and an outline item since the hundred-and-sixty-sixth, where `PageTarget::Destination` carries one across the `viewer-core` boundary — a host cannot resolve one itself, because turning a page *object* into an index is a walk of the page tree."

[[clause]]
clause = "12.3.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/destination.rs", "crates/viewer-core/src/open.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/viewer-core/tests/headless.rs::an_open_action_states_where_to_look_at_the_page_and_how_large", "crates/viewer-core/tests/headless.rs::a_destinations_null_parameters_leave_what_they_do_not_state", "crates/pdf-model/tests/destinations.rs::an_open_action_that_states_a_destination_names_a_page"]
note = "The clause lists a destination's three items and all three are answered since the two-hundred-and-first session. \"[T]he page of the document that shall be displayed\" is a property of the document and `Destination::page_index` computes it. \"[T]he location of the document window on that page\" and \"[t]he magnification (zoom) factor\" are properties of a *window*, so `pdf-model` stops at carrying Table 149's parameters and `viewer_core::Open::apply_view` turns them into a zoom and a scroll — the one place with both a viewport and a display list, the second of which the three `/FitB` forms need. **This row said they were \"properties of a window with scrolling and zoom, which this program does not have\" and that reason expired in the hundred-and-thirty-second session**, sixty-nine before the sweep found it: `Command::Zoom` and `Command::Scroll` had been in the vocabulary the whole time. It is the capability shape §12.6.3 and §14.3.3 took, and the third instance of it. ADR 0162. 55 of the 974 corpus documents state an `/OpenAction` and 49 name a page this reader finds; the viewer opens there, at the magnification and on the part of the page the file asked for."

[[clause]]
clause = "12.3.2.2"
title = "Explicit destinations"
status = "partial"
code = ["crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/src/destination.rs::every_form_table_149_lists_is_read", "crates/pdf-model/src/destination.rs::a_null_parameter_is_not_a_zero"]
note = "All eight of Table 149's forms are read, with the table's own distinction between an absent parameter and a zero one: \"A null value for any of the parameters left , top , or zoom specifies that the current value of that parameter shall be retained unchanged.\", and \"[a] zoom value of 0 has the same meaning as a null value\" — so `View` carries `Option<f32>` and a stated zero coordinate stays a coordinate. The clause requires the first entry to be \"an indirect reference to a page object (except in a remote go-to action …)\", and the NOTE makes the integer form belong to another document, so `Target::Number` names nothing here; no corpus link uses it and one `/OpenAction` does, where the clause's fallback and the lenient reading agree on page one anyway. **Both of the things a window does are done since the two-hundred-and-first session** (ADR 0162): `viewer_core::Open::apply_view` turns each of the eight forms into a magnification and a point of the page put at the window's top-left corner, and \"the smallest rectangle enclosing all of its contents\" — the bounding box the three `/FitB` forms need, which no page dictionary states — is the union of `pdf_render::marked_bounds` over the display list's commands. Table 149's null rule is honoured separately for each parameter rather than for the destination as a whole, because that is what it says: \"A null value for any of the parameters left , top , or zoom specifies that the current value of that parameter shall be retained unchanged.\". A `/FitB` on a page whose commands cannot all be bounded falls back to the page box, which is stated in the code rather than hidden. This row stays `partial` for `Target::Number` alone."

[[clause]]
clause = "12.3.2.3"
title = "Structure destinations"
status = "implemented"
code = ["crates/pdf-model/src/destination.rs"]
test = ["crates/pdf-model/src/destination.rs::a_structure_destination_finds_its_page_through_the_kids", "crates/pdf-model/src/destination.rs::the_fallback_to_page_one_belongs_to_structure_destinations_only"]
note = "A destination whose first entry is a structure element, and the clause states the whole algorithm for getting back to a page: the kids in linear array order, a marked-content or object reference answering with its page, a child element recursed into, and \"[i]n the case where no page content is identified, then the page reference shall be assumed to be the first page in the document\". **It needs `/K` and `/Pg` and not the structure tree**, which is why this row closes while §14.7's stay `silent` — the row said the opposite for two sessions. The page a reference \"belongs to\" is Table 357's and Table 358's `/Pg`, falling back to the containing element's, which §14.7.5.3 states in as many words. The fallback to page one is a sentence about structure destinations and is not applied to any other unresolvable reference."

[[clause]]
clause = "12.3.2.4"
title = "Named destinations"
status = "implemented"
code = ["crates/pdf-model/src/destination.rs", "crates/pdf-syntax/src/tree.rs"]
test = ["crates/pdf-model/src/destination.rs::a_named_destination_is_found_in_either_table", "crates/pdf-model/tests/destinations.rs::a_named_destination_resolves_when_its_document_defines_it"]
note = "Both of the clause's tables — the PDF 1.1 `/Dests` dictionary in the catalog and the PDF 1.2 `/Dests` name tree in the name dictionary — and both key forms, with the dictionary-valued destination's `/D` followed. Annex J.3.3 and J.3.4, which the clause requires the lookup to use, cost nothing here: both reduce to a binary comparison of the *decoded* bytes, which is what the lexer has already produced. The corpus measures the clause's own pairing and finds it exact: of 106 named destinations reachable from link annotations, the 22 that resolve are 2 names in a catalog dictionary and 20 strings in a name tree, not one crossing. The other 84 name keys their own document does not define — five files carry named links and no table at all — which is a fact about those files and is asserted as one."

[[clause]]
clause = "12.3.3"
title = "Document outline"
status = "implemented"
code = ["crates/pdf-model/src/outline.rs", "crates/viewer-core/src/interact.rs", "crates/viewer-ui/src/chrome.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/outline.rs::the_visible_count_skips_a_closed_items_descendants", "crates/pdf-model/tests/outlines.rs::a_stated_count_agrees_with_the_count_the_clause_defines", "crates/viewer-ui/tests/panel.rs::closing_a_subtree_does_not_renumber_the_items_below_it", "crates/viewer-core/tests/headless.rs::an_outline_item_goes_to_the_page_its_destination_names", "crates/viewer-core/tests/headless.rs::an_outline_item_whose_action_is_a_uri_hands_it_over"]
note = "The whole hierarchy is read: Table 150's root, Table 151's items with `/Title` as a §7.9.2.2 text string, a destination from `/Dest` or from a go-to action's `/D`, Table 152's italic and bold bits, `/C` clamped to `DeviceRGB`, and the sign of `/Count` deciding whether an item is open. The walk follows `/First` and `/Next` only — `/Prev`, `/Last` and `/Parent` are redundant with what it already has and could only disagree — and refuses to visit an object twice, because all six links are indirect references a producer can get wrong. `/SE` is unread and the clause says why: \"[t]his value is not intended for navigation\". **`/Count` is stated as a three-step algorithm rather than as a number**, so a document states the same fact twice and can be checked against itself: 144 of the 146 corpus documents that state one over a non-empty outline agree with the steps run over their own items, and the two that do not contradict *themselves* — `nested_outline.pdf` marks three items open with `/Count 2` apiece, which makes nine visible, and says 3. **The three sentences the clause spends on a screen arrived in the hundred-and-sixty-sixth and -eighth sessions and this row closed with them.** The items appear \"in the order in which they occur in the linked list\"; \"[t]he user may interactively open and close individual items by clicking them\", which is a disclosure triangle whose initial state is the sign of `/Count`; \"[w]hen an item is closed, all of its descendants in the hierarchy shall be hidden\"; and \"[c]licking the text of any visible item activates the item, causing the interactive PDF processor to jump to a destination or trigger an action associated with the item\" — **both halves**, since `Command::Activate` hands the item's object to `viewer-core` and the whole of §12.6.2's chain runs, which is the same code a link click takes. Measured before it was built: of 281 corpus outline items carrying an `/A`, 249 are `GoTo`, 7 `URI`, 5 `Named`, 1 `SetOCGState`, 1 `GoToR` and 18 `JavaScript`, and every one of those is now performed or refused by name on the same terms a link gets. What a refused action costs is §12.6's rows and not this one. `section_at` stays beside the panel in the title bar, and that mapping from a page back to an item is a **documented choice** — the clause states nothing about it."

[[clause]]
clause = "12.3.4"
title = "Thumbnail images"
status = "partial"
code = ["crates/pdf-model/src/thumbnail.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/src/thumbnail.rs::only_the_five_significant_entries_of_table_87_survive", "crates/pdf-model/src/thumbnail.rs::an_ignored_soft_mask_does_not_reach_the_pixels", "crates/pdf-model/tests/thumbnails.rs::every_thumbnail_decodes_and_is_compared_with_the_page_it_stands_for"]
note = "A page's `/Thumb`, decoded into the same RGBA raster every other image becomes — and the clause's work is *subtraction*: \"only the Width , Height , ColorSpace , BitsPerComponent , and Decode entries are significant; all of the other entries listed in `Table 87 -Additional entries specific to an image dictionary` shall be ignored if present\". `thumbnail::significant` drops those eighteen, so a `/SMask` or a `/Mask` on a thumbnail reaches no pixel, while `/Filter`, `/DecodeParms` and `/Length` survive because they are **Table 5's** and the sentence names Table 87 — which the clause's own EXAMPLE requires, writing `/Filter [/ASCII85Decode /DCTDecode]`. The clause's two producer-side constraints are recorded rather than enforced: a `/Subtype` other than `Image`, and a colour space that is not `DeviceGray`, `DeviceRGB` or `Indexed` on one of them. 11 corpus documents state a thumbnail on page one, all 11 decode, one (`issue19517.pdf`) states an `ICCBased` space the clause does not permit. `partial` for the panel, which is `viewer-ui` work — and **generating** a missing thumbnail, which the clause permits and `CLAUDE.md` principle 2 forbids on the launch path."

[[clause]]
clause = "12.3.5"
title = "Collections"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::the_clauses_own_email_inbox_reads_as_five_columns", "crates/pdf-model/src/collection.rs::a_navigator_names_layouts_in_the_order_the_file_prefers_them", "crates/pdf-model/tests/collections.rs::no_corpus_document_is_a_portable_collection"]
note = "Table 153 whole, with Tables 154 to 158 behind it: the schema's fields with their two kinds of subtype, `/D`, `/View`, `/Sort`, `/Colors`, `/Split`, `/Navigator` and `/Folders`. Three of its rules are answered rather than stored, because each is a decision a reader makes: `Collection::initial_document` is §12.3.5.1's three fallbacks for `/D` — the container, the first file, or \"an empty preview window\" — as three values rather than an `Option`; `Sort::ascending` applies Table 156's single-boolean-or-array rule; and `FieldKind::is_in_the_item` is the clause's own division between fields whose data is in §7.11.6's `/CI` and \"file-related fields\" whose data is already in the file specification. `partial` for the sentence a viewer owes and this one cannot pay: \"[i]f this dictionary is present in a PDF document, the interactive PDF processor shall present the document as a portable collection\", which needs a file browser. **No corpus document states a `/Collection`**, so the clause's own EXAMPLE 1 — an email in-box of five columns — is the test."

[[clause]]
clause = "12.3.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::the_clauses_own_email_inbox_reads_as_five_columns"]
note = "The general clause and its tables, read in `collection.rs`. What makes a collection *presented* rather than merely described is §12.3.5.1's \"shall present the document as a portable collection\", which is a user interface; everything the interface would read is here. Table 153's `/View` defaults to `D`, and the one place the entry is load-bearing rather than a preference is §7.6.7's unencrypted wrapper document, where the clause requires `H` — a browser over the wrapper would hide the page that says the payload is encrypted."

[[clause]]
clause = "12.3.5.2"
title = "Collection hierarchical folders"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::a_files_folder_is_written_into_its_name_tree_key", "crates/pdf-model/src/collection.rs::a_folder_name_is_a_file_name_by_the_clauses_five_rules", "crates/pdf-model/src/collection.rs::a_navigator_names_layouts_in_the_order_the_file_prefers_them"]
note = "Table 159's folder tree, walked from `/Folders` along `/Child` and `/Next` with §12.3.3's defence — forward links only, each object once — and the two rules the clause states as prose rather than as entries. **A file's folder is written into its name-tree key**: `<3>report.pdf` is folder 3, one or more digits between the brackets, and a key that does not conform means the root folder rather than an error, which is `collection::folder_of`. **A folder name is a *file name***, which the clause defines by five requirements — a text string, no NUL, none of eight special characters, and not ending in a full stop — and `collection::is_file_name` answers it without refusing anything, because the clause leaves that open: \"[a]n interactive PDF processor may choose to support invalid names or not\". `partial` for the panel. The corpus's 23 embedded files are all plain keys, measured, so no document has folders."

[[clause]]
clause = "12.3.6"
title = "Navigators"
status = "partial"
code = ["crates/pdf-model/src/collection.rs"]
test = ["crates/pdf-model/src/collection.rs::a_navigator_names_layouts_in_the_order_the_file_prefers_them"]
note = "**This row was wrong for thirty-odd sessions** and its own note is the evidence: it said a navigator is \"supplied as SWF\" and that anyone widening `CLAUDE.md`'s exclusion list \"should start here, with an argument\". ISO 32000-2's §12.3.6 names no media format at all — a navigator dictionary holds `/Layout`, one or more of seven **named layouts** (`D`, `T`, `H`, `FilmStrip`, `FreeForm`, `Linear`, `Tree`), each described in the clause's own prose. The SWF navigator was an Adobe extension this standard replaced. So it is a reader's question and is read: `Navigator::preferred` is the clause's selection rule — \"an interactive PDF processor should present the first one it is capable of displaying in the order present in the array\" — which takes the layouts a *caller* can draw, since the answer depends on the viewer as much as on the file. `partial` because nothing draws one."

[[clause]]
clause = "12.4"
title = "Page-level navigation"
status = "partial"
code = ["crates/pdf-model/src/page_label.rs", "crates/pdf-model/src/article.rs", "crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/tests/page_labels.rs::the_clauses_own_example_produces_the_labels_it_states", "crates/pdf-model/src/article.rs::the_clauses_own_example_is_three_beads_on_two_pages", "crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "Page-level navigation: page labels, articles and presentations, and all three are now read. §12.4.2's labels are `implemented` and shown in the title bar; §12.4.3's articles are read as threads of beads and `partial` for the zoom a bead's `/R` asks for; §12.4.4's presentation is read entire and played by nobody. So the clause is `partial` for what a *window* would do with any of the three, which is the same sentence three subclauses say in three ways — this row was `silent` for eighty-eight sessions while two of its children were not, which is the understated-parent shape §14.8.5.1 taught."

[[clause]]
clause = "12.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/page_label.rs", "crates/pdf-model/src/article.rs", "crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/tests/page_labels.rs::the_clauses_own_example_produces_the_labels_it_states", "crates/pdf-model/src/article.rs::the_clauses_own_example_is_three_beads_on_two_pages", "crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "The framing: page-level navigation is what a reader does *within* a document once it is open, as against §12.3's overview of the whole of it. The clause names its three mechanisms — page labels, articles, presentations — and each has its own row; the framing itself states no requirement beyond naming them, and all three are read."

[[clause]]
clause = "12.4.2"
title = "Page labels"
status = "implemented"
code = ["crates/pdf-model/src/page_label.rs"]
test = ["crates/pdf-model/tests/page_labels.rs::the_clauses_own_example_produces_the_labels_it_states", "crates/pdf-model/tests/page_labels.rs::every_document_stating_labels_labels_its_first_page"]
note = "Page labels, in full: the catalog's `/PageLabels` number tree, Table 161's `/S`, `/P` and `/St`, and the rule that a range runs to the start of the next. Four things the clause states and a first implementation gets wrong: **there is no default numbering style**, so a range with a `/P` and no `/S` labels every one of its pages identically — the clause's own NOTE spells that out with `Contents`; **`/A` is not base 26**, it is \"A to Z for the first 26 pages, AA to ZZ for the next 26\", so the twenty-eighth page is `BB` and not `AB`; the Roman form is subtractive, which the clause's example fixes by running `i, ii, iii, iv` rather than `iiii`; and `/St` \"shall be greater than or equal to 1\", so a file writing zero gets the stated default. The prefix is a *text string*, decoded by §7.9.2.2's own function. **The clause's worked example is the test** — nine labels, `i ii iii iv 1 2 3 A-8 A-9` — because no corpus document exercises all three of its ranges, which is trap 8; 22 of the 974 do state labels and every one of them labels its first page. `viewer-ui` shows the label beside the index rather than instead of it, since a title reading `iv` cannot also say `of 320`."

[[clause]]
clause = "12.4.3"
title = "Articles"
status = "partial"
code = ["crates/pdf-model/src/article.rs"]
test = ["crates/pdf-model/src/article.rs::the_clauses_own_example_is_three_beads_on_two_pages", "crates/pdf-model/src/article.rs::the_ring_closes_and_following_it_wraps", "crates/pdf-model/tests/articles.rs::the_corpus_states_no_article"]
note = "The catalog's `/Threads`, Table 162's thread dictionaries with their `/I` information title, and Table 163's beads walked from `/F` along `/N`. **The chain is a ring**, which is what distinguishes this walk from §12.3.3's outline: `/N` \"[i]n the last bead … shall refer to the first bead\", so termination is a visited set rather than an absent entry, and following past the end wraps — which is what \"follow a thread from one bead to the next\" means at a thread's end. `/V` is deliberately unread, for the outline's reason: it is redundant with `/N` and could only disagree. Table 31's page `/B` is read *only* to be checked against the threads, since NOTE 2 says it \"can be created or recreated\" from them — and the two clauses disagree about its order (\"natural reading order\" in Table 31, \"in drawing order\" here), so the comparison is on the set, which is a documented choice and the only comparison both sentences license. `partial` for the one thing a viewer would do with a bead and this one cannot: `/R` is \"[a] rectangle specifying the location of this bead on the page\", which is a region to zoom to, and `viewer-ui` fits whole pages. **No corpus document states an article**: 2 catalogs carry a `/Threads` entry, one an empty array and one a null, and no page carries a `/B` — measured, and the clause's own EXAMPLE 2 is the test."

[[clause]]
clause = "12.4.4"
title = "Presentations"
status = "partial"
code = ["crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "Presentations: full-screen page transitions, `/Trans` on a page and `/Dur` for an automatic advance, and §12.4.4.2's sub-page navigation. All three are read as of the seventieth session. **A `/Dur` is acted on since the hundred-and-fiftieth**: `Command::Tick { millis }` is how a state machine with no clock is told that time passed, and a page shown for as long as it asked advances by itself, naming the page arrived at's `/Trans` as it goes. A transition is still not *played* — it is an animation between two pages, which a display list cannot express and a window's event loop can — and there is deliberately no presentation *mode* in this tree, because full screen is chrome and a host that is not presenting simply sends no ticks. ADR 0135. `partial` for that reason rather than for a missing reader. Table 164's twelve transition styles are animations, which is nearer clause 13's exclusion than anything else in clause 12 — but the exclusion list is closed and this is not on it, so it stays debt rather than becoming `out-of-scope` by convenience. (This row said \"Table 165's thirteen\" for sixteen sessions; the table is 164 and the styles are twelve.)"

[[clause]]
clause = "12.4.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/navigation.rs"]
test = ["crates/viewer-core/tests/headless.rs::a_page_stating_a_duration_advances_when_it_is_told_the_time", "crates/pdf-model/src/navigation.rs::the_clauses_own_example_page_states_a_split_and_five_seconds"]
note = "Table 164's transition dictionary and the page's `/Dur`, both read from the page's own dictionary — §7.7.3.4 makes four entries inheritable and neither of these is among them, so a `/Pages` node stating one states nothing. Every entry of Table 164 is read with the table's own default where the file states none: `/S` as twelve named styles plus a variant carrying a thirteenth name the file wrote, `/D`, `/Dm`, `/M`, `/Di` as degrees or the name `None`, `/SS` and `/B`. `R`'s row states an obligation rather than an appearance — \"the D entry shall be ignored\" — so a replacement's duration is zero whatever `/D` says. No `/Dur` at all is the clause's \"the page shall not advance automatically\" and not an advance of zero, which is why it answers `Option`. **Since the hundred-and-fiftieth session `/Dur` is acted on**: `Command::Tick { millis }` is how a state machine with no clock (rule 3) is told that time passed, and a page shown for as long as it asked advances by itself. The comparison is `>=` and every page turn restarts the clock, which is the entry's own word \"maximum\" and NOTE 1's \"[t]he user can advance the page manually before the specified time has expired\" met by one rule rather than two. The page arrived at is what names its `/Trans`, because the entry is \"the transition style that shall be used when moving to *this* page from another\" — read from the page tree rather than from the interpreted page, which at that moment is still the page just left. The last page does not advance and does not loop: the clause says nothing about what follows the end. `partial` because the transition is *named* and not played: there is still no animation, and a host with a clock is what plays a sequence of frames. There is deliberately no presentation *mode* in this crate — full screen is chrome, and a host that is not presenting simply sends no ticks. ADR 0135.  Demand measured over every page of all 964 openable corpus documents: **not one states a `/Trans` or a `/Dur`**. One finding about the sources rather than the code: `doc/md/`'s conversion of Table 164 drops `/Di`'s \"Default value: 0.\", which the standard's own PDF states — the conversion caveat, met in the wild."

[[clause]]
clause = "12.4.4.2"
title = "Sub-page navigation"
status = "implemented"
code = ["crates/pdf-model/src/navigation.rs"]
test = ["crates/pdf-model/src/navigation.rs::a_page_of_bullets_walks_its_states"]
note = "Sub-page navigation: `/PresSteps` on a page, and Table 165's navigation nodes, which \"form a doubly linked list by means of their Next and Prev entries\". Each node is a pair of §12.6 actions, so what walking a page's states takes is the list and a `ViewState` to perform them against — and this row has said since the fifty-fourth session that it was \"the one presentation row whose missing piece is a control rather than a renderer\". The sixty-second and sixty-seventh sessions built the control and the sixty-ninth the list. Only `/Next` is walked: the clause makes the nodes one doubly linked list, so `/Prev` is the same order read backwards, and a file whose two chains disagree has stated two orders with no rule to choose between them. The ring a `/Next` chain may close is bounded by visiting each node once. **Nothing turns a presentation on, and since the hundred-and-fiftieth session that is a decision rather than a gap** — NOTE 3 says nodes need be respected \"only when in presentation mode\", and this tree deliberately keeps no such mode: full screen is chrome, chrome is the host's, and a host that is presenting is one that sends `Command::Tick`. §12.4.4.1's `/Dur` is driven by those ticks (ADR 0135); these nodes are not, and a caller stepping through them is what is still missing. NOTE 2's obligation to save and restore the optional content states across presentation mode is why `ViewState` is a value a caller owns and is `Clone`. Neither `PresSteps` nor `NavNode` occurs in the raw bytes of any of the 974 corpus documents."

[[clause]]
clause = "12.5"
title = "Annotations"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_annotation_draws_over_the_page_content"]
note = "An annotation is drawn over the page content and in /Annots order, which is the only thing fixing its order because nothing in a content stream refers to it. Each entry is placed by §12.5.5 and drawn by the same machinery as any other form XObject, with §12.5.3's flags and §8.11.3.3's /OC deciding whether it appears at all. What is missing is everything that is not a mark on the page: no annotation responds to input, and §12.6's actions are not read."

[[clause]]
clause = "12.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_annotation_draws_over_the_page_content"]
note = "The clause's rendering content is that an annotation is associated with a location on a page and that a closed one 'appear[s] on the page in some distinctive form, such as an icon, a box, or a rubber stamp, depending on the specific annotation type' — which each subtype's clause then defines, or does not: see §12.5.6.4's icons. Everything else here is interaction that does not exist yet: opening an annotation to exhibit its object, and Table 31's /Tabs giving the keyboard a row, column or structure order to visit annotations in."

[[clause]]
clause = "12.5.2"
title = "Annotation dictionaries"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_stored_appearance_ignores_the_annotations_opacity"]
note = "Table 166's entries that decide what is drawn are read: /Subtype, /Rect (normalised, and an empty one draws nothing), /F, /AP, /AS, /Border, /C, /CA, /ca, /BM and /OC. The clause's closing rule is implemented and is what shapes crate::appearance — 'A PDF reader shall render the appearance dictionary without regard to any other keys and values in the annotation dictionary and shall ignore the values of the C, IC, Border, BS, BE, BM, CA, ca, H, DA, Q, DS, LE, LL, LLE, and Sy keys' — so those entries are read only where there is no appearance stream to ignore them for. That contradicts one sentence of §12.5.5, which has the appearance's group composited 'using the values of the BM, ca and CA entries'; this row's reading is Table 166's own, stated twice in the /CA and /ca entries, and the contradiction is recorded in §12.5.5's row. Not read, none of which marks the page: /RC (§14.9.3's alternate description), /P, /NM, /M, /StructParent, /AF and /Lang. **/Contents was in that list and is read**: §12.5.6.6's free-text appearance lays it out as the annotation's text, which is the one subtype whose clause makes the entry mark the page — so the list's own justification, \"none of which marks the page\", is what disqualified it."

[[clause]]
clause = "12.5.3"
title = "Annotation flags"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "Table 167's three flags that decide whether a screen shows the annotation are honoured: Hidden and NoView suppress it, and Invisible suppresses it only for a subtype outside Table 171, which is the condition the flag's own wording places on it. Print is a printing decision this viewer does not yet make, and the twenty-first session found that it is also the reason a reference renderer disagrees with us about four link borders: ghostscript renders for a printer, where 'If clear, never print the annotation, regardless of whether it is rendered on the screen' means a page with no /F draws no annotation at all. The flag's own next sentence would settle even that case in our favour — 'If the annotation does not contain any appearance streams this flag shall be ignored' — which matters for every appearance this crate constructs. NoZoom and NoRotate make an appearance's size or orientation depend on the view, which a resolution-independent display list cannot express — neither is applied nor reported. ReadOnly, Locked, ToggleNoView and LockedContents constrain user interaction, which does not exist yet."

[[clause]]
clause = "12.5.4"
title = "Border styles"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::a_link_border_is_drawn_inside_its_rectangle_in_its_own_colour"]
note = "Table 168's /W and /D and three of its five styles are implemented for a constructed appearance, with §12.5.4's own rule about where the border goes: 'If present, the border shall be drawn completely inside the annotation rectangle', so the stroked path is the rectangle inset by half the width. S is solid, D dashes by /D or by /Border's fourth element with the phase the clause fixes at 0, U is 'a single line along the bottom of the annotation rectangle'. B and I are drawn as S and reported: Table 168 calls each a 'simulated' embossed or engraved rectangle and states neither the highlight nor the shadow colour that would produce the illusion, and no corpus document writes either. Table 169's cloudy /BE is refused and reported for the same reason — 'a series of convex curved line segments' states no curve. An unrecognised style name falls back to S, which Table 168 requires. Where an appearance stream exists all of this is ignored, per §12.5.2."

[[clause]]
clause = "12.5.5"
title = "Appearance streams"
status = "partial"
code = ["crates/pdf-model/src/annotation.rs", "crates/pdf-model/src/content.rs", "crates/viewer-core/src/interact.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_appearance_is_scaled_and_translated_onto_the_annotation_rectangle", "crates/pdf-model/tests/annotations.rs::the_pointer_chooses_between_an_annotations_appearances"]
note = "The placement algorithm is implemented in all three steps, including the part that only a rotating /Matrix exercises: the transformed appearance box is measured around the mapped quadrilateral, and A maps its extreme corners onto /Rect's. /N is followed through an appearance subdictionary by /AS, and a state /AS names but the dictionary does not define draws nothing, which the clause gives as the specified 'reasonable behaviour'. §8.10.2's /BBox clip is applied, which this clause relies on. The requirement that an appearance with no /Group 'shall be treated as a non-isolated, non-knockout transparency group' is satisfied by construction rather than by code: with the annotation's own /BM, /ca and /CA ignored (§12.5.2), that group has alpha 1, the Normal blend mode and no soft mask, and §11.6.7's NOTE 1 makes it identical to painting the elements directly, which is what the interpreter does. An appearance stream with **no** `/BBox` is placed by §12.7.4.3's default box — \"[t]he lower-left corner of the bounding box ( BBox ) is set to coordinates (0, 0) in the form coordinate system. The box's top and right coordinates are taken from the dimensions of the annotation rectangle\" — and named, since the hundred-and-twenty-fifth session (ADR 0113). That sentence is written for a *constructed* appearance and applying it to a stored one is an extension rather than a reading; what makes it the right one is that the alternative discards the whole annotation over an entry this algorithm needs only for a *scale*. 1 corpus document. **The same rule the other way** since the hundred-and-twenty-sixth session: an annotation with no `/Rect` is placed where its appearance's own box, mapped through its `/Matrix`, puts it — the two operands are the same kind of thing and a missing one makes the map the identity. `issue14438.pdf` states four ink annotations with no `/Rect` and `/BBox [0 0 0 0]`, so the file has stated an appearance covering no area; that draws nothing by Table 166's own excuse, and reporting the missing rectangle named the one entry that could not have changed the picture. A `/Rect` is still refused where there is no stored stream, because every construction is written into one. ADR 0114. **One sentence of this clause is not followed**: 'The transparency group shall be composited ... using the values of the BM, ca and CA entries in the annotation dictionary'. Table 166 says of each of /CA and /ca that it 'shall not be used if the annotation has an appearance stream ... in that case, the appearance stream shall specify any transparency', and §12.5.2 lists all three among the keys a reader shall ignore. Two statements against one, and the two explain the risk the one creates: highlight.pdf writes /CA 0.8 on the annotation and ca 0.8 inside the stream, so applying both would darken the highlight its producer specified. **Table 170's three appearances are chosen since the seventy-sixth session**: the clause states them as three situations rather than as a mode — normal \"when the annotation is not interacting with the user\", rollover when the cursor is in the active area, down \"when the mouse button is pressed or held down within\" it — so which one applies is a property of the pointer and lives in `view::ViewState`, beside §12.6.4's actions and for the same reason: a cursor is not in the document. Hit testing is `viewer-core`'s since the hundred-and-thirty-second session: a pointer position in device pixels comes back through the centring, the magnification, the crop box's origin and §7.7.3.3's rotation, and the annotation it lands on is the one whose appearance changes. The state is only changed for an annotation that *states* the appearance in question, because changing it invalidates the page's display list and a cursor crossing a link with only an `/N` would otherwise re-interpret the page for a picture that cannot differ. Table 170 requires only /N, so an annotation with no entry for the state it is in shows its normal appearance, which is also what printing asks for. **An appearance stream is a form XObject, and §8.7.2's pattern rule follows from that** — \"if a pattern is used within a form XObject … the pattern matrix maps pattern space to the form's default user space\" — which `draw_appearance` did not apply until the hundred-and-ninety-ninth session, so a shading pattern in a stamp was placed by the page's default space (ADR 0160). Not implemented: the NoZoom and NoRotate scaling this clause defers to §12.5.3."

[[clause]]
clause = "12.5.6"
title = "Annotation types"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/annotations.rs::an_unknown_subtype_still_draws_its_normal_appearance"]
note = "Table 171's subtypes are all recognised. Where one carries an appearance stream it is drawn without regard to the subtype, which is what this clause's parent requires; where one does not, the subtype's own subclause decides, and the rows below say which are constructed, which are refused for stating no geometry, and which are excluded."

