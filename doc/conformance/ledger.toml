[[clause]]
clause = "14.11.2.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/render_real_pdf.rs::the_fixture_page_is_modelled_correctly"]
note = "The crop box is honoured: it is inherited down the page tree, defaults to the media box, is refused and replaced when degenerate, and gives the rendered page both its size and its origin — which is also what every reference renderer is asked for, see tools/pdfref. The media box is read as the crop box's default. The bleed, trim and art boxes are read by nothing: they bound a production process rather than a display, and a viewer's use for them would be to draw guides. /UserUnit, defined beside them in §7.7.3.3, is neither applied nor reported and costs 2 corpus documents their page size."

