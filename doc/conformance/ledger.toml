[[clause]]
clause = "7.7.2"
title = "Document catalog dictionary"
status = "partial"
code = ["crates/pdf-syntax/src/document.rs", "crates/pdf-model/src/page.rs", "crates/pdf-model/src/optional_content.rs", "crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/viewer_preferences.rs"]
test = ["crates/pdf-syntax/tests/real_documents.rs", "crates/pdf-model/tests/optional_content.rs", "crates/pdf-model/src/viewer_preferences.rs::table_29s_display_entries_are_not_table_147s"]
note = "Table 29's entries, and which of them this tree reads. **This row was wrong for a hundred and twenty sessions and its own list is the evidence**: it said \"[n]ot read, and every one of them is a *viewer* feature rather than a rendering one\" over twenty-five keys, and eighteen of the twenty-five are read — most of them by the session that built their clause, none of which came back here. `/PageLabels` (§12.4.2, session 48), `/Names` and `/Dests` (§12.3.2.4, 48 and 49), `/Outlines` (§12.3.3, 50), `/OpenAction` (§12.3.2, 49), `/Threads` (§12.4.3, 90), `/URI` (§12.6.4.8's base, 80), `/StructTreeRoot` and `/MarkInfo` (§14.7, 78), `/Lang` (§14.9.2, 60), `/ViewerPreferences` (§12.2, 81), `/Requirements` (§12.11, 84), `/Collection` (§12.3.5, 93), `/Perms`, `/Legal` and `/DSS` (§12.8, 98 and 99), `/Extensions` (§7.12, 84), `/OCProperties` (§8.11), `/AcroForm` (§12.7), `/OutputIntents` (§14.11.5), `/Pages` and `/Version`. The sentence \"`CLAUDE.md` puts page labels, outlines and destinations in scope as things that display; none is started\" was written before all three shipped and outlived them by a hundred and twenty sessions. **`/PageMode` and `/PageLayout` were read in the hundred-and-seventieth**, because the clause had become reachable: `/PageMode` names a *panel* — \"UseOutlines Document outline visible … UseOC Optional content group panel visible … UseAttachments Attachments panel visible\" — and until the sidebar existed there was nothing for three of its six values to name. `viewer-ui` obeys those three and says once what it cannot do for `UseThumbs` and `FullScreen`; `/PageLayout` is handed over and a window showing one page at a time says so for anything but `SinglePage`. Measured: 38 of 961 corpus catalogs state a `/PageMode` (22 `UseNone`, 11 `UseOutlines`, 4 `UseOC`, 1 the undefined `/Use0`) and 43 a `/PageLayout` (24 `SinglePage`, 19 `OneColumn`). **Genuinely unread, and each for a reason**: `/SpiderInfo` (§14.10's web capture, 5 documents), `/PieceInfo` (§14.5's private producer data, 5), `/NeedsRendering` (Annex K's XFA, deprecated in PDF 2.0 and on `CLAUDE.md`'s exclusion list, 3), `/DPartRoot` (§14.12 reads document parts from a jump's own reference rather than from here), the catalog's own `/AA` (§12.6.3's document-level triggers, 3) and `/AF` (§14.13 reads it wherever an object states one, 6), and `/Metadata` (§14.3.2's XMP, 319 documents, and what §12.2's `/DisplayDocTitle` is waiting for). `partial` for those seven."

