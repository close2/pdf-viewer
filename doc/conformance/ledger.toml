[[clause]]
clause = "8.6.2"
title = "Colour values"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "A colour value is \"one to four numbers\" whose meaning the space decides, and the clause's rule that a value outside the space's range \"shall be adjusted to the nearest valid value\" is `ColourSpace::component_range`'s clamp — the same one §8.9.5.2's `/Decode` map ends with."

[[clause]]
clause = "8.6.3"
title = "Colour space families"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::an_icc_space_prefers_its_stated_alternate"]
note = "The three groups — device, CIE-based and special — and Table 61's eleven families, all of which `colour::ColourSpace` has an arm for. §8.6.5.1's withdrawn `CalCMYK` is the twelfth name and the clause redirects it to `DeviceCMYK`, which is what happens here."

[[clause]]
clause = "8.6.4"
title = "Device colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_grey_is_the_same_however_it_is_drawn", "crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The three families, reviewed as one in the twenty-fifth session alongside §8.6.5. Two of them are what this device speaks, so they are the identity; the third is a conversion **§8.6.4.4 does not define and §10.4.2.5 does**, ranked below §10.3's ICC route by §10.4.2.1. This row said \"one conversion the standard does not define\" until the hundred-and-tenth session, which is the claim `CLAUDE.md` records as having been wrong for thirty-two sessions — the correction reached the code and this file's own principle 5 and never reached the ledger. See §8.6.4.4."

[[clause]]
clause = "8.6.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_default_colour_space_replaces_the_device_space"]
note = "Two normative sentences beyond the descriptive ones. The NOTE points at §8.6.5.6's remapping, which is implemented for every route including — as of the twenty-fifth session — an image's own `/ColorSpace`. The closing paragraph says device colour operators \"should be used only if device colour spaces have been remapped to CIE-based spaces\" inside a transparency group whose group space is CIE-based, and \"otherwise, the colour results are implementation-dependent and unpredictable\". That is advice to a *writer* about a configuration this reader already reports: §11.6.6's row names a group space that is not the device's three components, and there is nothing here for a reader to do that it does not already do."

[[clause]]
clause = "8.6.4.2"
title = "DeviceGray colour space"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs", "crates/pdf-model/tests/ccitt.rs::a_scanned_page_comes_back_mostly_white"]
note = "\"A grayscale value shall be represented by a single number in the range 0.0 to 1.0, where 0.0 corresponds to black, 1.0 to white\" — one component, passed through with no gamma, which is what `ColourSpace::Gray` does. All six operators the clause names are implemented and reach the same conversion: `CS`/`cs` with the `/DeviceGray` name, `SC`/`sc` with one operand, and `G`/`g` which set space and colour together. The clause's last sentence — setting the space initialises the colour to 0.0 — is applied where a colour space is selected, and its companion in §8.6.8's initial-state rules is what `colour.rs` cites at the initial-colour comment. Reviewed in the twelfth session because `CCITTFaxDecode`'s sense depends on it: a bilevel filter delivering 1 for white is only right because this clause says 1.0 is white."

[[clause]]
clause = "8.6.4.3"
title = "DeviceRGB colour space"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_grey_is_the_same_however_it_is_drawn", "crates/pdf-model/src/colour.rs::grey_and_rgb_pass_through_unchanged"]
note = "Three components, each \"a number in the range 0.0 to 1.0, where 0.0 shall denote the complete absence of a primary component and 1.0 shall denote maximum intensity\", passed through with no curve — which is the whole of the conversion, because the clause defines a component as an intensity of *this device's* primary and §8.6.5.7 NOTE 3 says nothing in a PDF describes that device's calibration. Applying a gamma here would assert a calibration the file does not state. All six operators reach it: `CS`/`cs`, `SC`/`sc`/`SCN`/`scn` with three operands, and `RG`/`rg`. The closing sentence — selecting the space initialises all three components to 0.0 — is `ColourSpace::initial_colour`."

[[clause]]
clause = "8.6.4.4"
title = "DeviceCMYK colour space"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn", "crates/pdf-model/src/colour.rs::the_process_inks_are_the_published_ink_appearances"]
note = "Four components, \"the concentrations of these process colourants\", and *this* clause stops there — but **the standard does not**, and this row said it did until the hundred-and-tenth session. §10.4.2.5 is titled \"Conversion from DeviceCMYK to DeviceRGB\" and states the formula outright; §10.4.2.1 offers it to \"a less-capable PDF processor\" as one of a set of \"crude approximations\", ranked below §10.3's ICC route, which §10.3.2 then *requires* of a processor whose device space is not the document's. So the question is answered twice and in an order, and this tree takes the higher branch: the fallback is a table of the sixteen ink corners interpolated, which is exact at the corners where §10.4.2.5's formula is up to 115 of 255 away, and the three sources that outrank even that are implemented — `/DefaultCMYK` (§8.6.5.6), an output intent's `/DestOutputProfile` (§14.11.5) and an `ICCBased` space's profile (§8.6.5.5). `partial` records a *documented choice between two answers the standard ranks* (ADRs 0009, 0042), not a silence: there is no sentence in this subclause left to implement. The closing sentence — cyan, magenta and yellow initialised to 0.0 and black to 1.0, which is black through the K channel rather than through zeroes — is `ColourSpace::initial_colour`, and it is the case a reader is most likely to get wrong by assuming every space starts at black-by-zeroes."

[[clause]]
clause = "8.6.5"
title = "CIE-Based colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/src/colour.rs::lab_maps_its_anchor_colours", "crates/pdf-model/src/colour.rs::calgray_is_a_luminance_and_must_be_encoded_for_the_display", "crates/pdf-model/src/colour.rs::calrgb_stating_srgbs_own_parameters_is_the_identity"]
note = "The family, reviewed as one in the twenty-fifth session. All four of its space families are read from the document and converted through CIE XYZ rather than approximated (ADR 0012), and there is exactly one route from XYZ to a pixel. The subclauses below carry what each one found."

[[clause]]
clause = "8.6.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/src/colour.rs::a_calcmyk_space_is_device_cmyk_and_its_dictionary_is_ignored", "crates/pdf-model/src/colour.rs::a_space_starts_at_the_colour_the_clause_gives_it"]
note = "Three requirements, and one of them was a refusal until this review. **`CalCMYK`**: \"A PDF reader shall ignore CalCMYK colour space attributes and render colours specified in this family as if they had been specified using DeviceCMYK\" — the family was withdrawn before it was ever completed, so the clause states the whole of what a reader does with one. It now parses to `DeviceCMYK`; before, such a file reported an unsupported colour space, which is a refusal where the standard gives an answer. No corpus document writes one. **The initial colour**: \"setting the current stroking or nonstroking colour space to any CIE-based colour space shall initialise all components of the corresponding current colour to 0.0\", with the nearest valid value substituted where 0.0 is out of range — `ColourSpace::initial_colour`, which §8.6.8 also asks for. **The two-stage model**: `Decode ABC` then `Matrix ABC` then `Decode LMN` then `Matrix LMN`; PDF states only spaces whose second stage is the identity, which is why the code has one stage and no more."

[[clause]]
clause = "8.6.5.2"
title = "CalGray colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/src/colour.rs::calgray_is_a_luminance_and_must_be_encoded_for_the_display", "crates/pdf-model/src/colour.rs::calgray_applies_its_gamma_before_the_white_point"]
note = "Table 62 in full: `/WhitePoint` required, `/BlackPoint` defaulting to black, `/Gamma` a positive number defaulting to 1. The table's constraint on the white point is \"[t]he numbers X_W and Z_W shall be positive, and Y_W shall be equal to 1.0\", and `white_point` enforces the first half only — a file stating a Y_W other than 1.0 is *accepted*, because the Bradford adaptation maps whatever white the space declares onto D50's and a scaled white therefore normalises itself, so refusing would lose a file this device can draw correctly. Positivity is enforced because a zero or negative component divides or inverts that adaptation. The hundred-and-tenth session corrected this note, which had read as though the whole sentence were checked. The clause's transformation is one stage — the A component decoded by the gamma function and multiplied by the white point to give L, M and N, which are X, Y and Z because there is no second stage — and that is what `to_rgb_at` computes. \"Component values falling outside that range shall be adjusted to the nearest valid value without error indication\" is `channel`, which clamps to 0.0..=1.0 and maps NaN to 0.0. `/BlackPoint` is read and *not* applied: ADR 0012 argues that a stretch built from it is undefined on input Table 62 permits, and §8.6.5.9 leaves black point compensation to the processor wherever `/UseBlackPtComp` is `Default`."

[[clause]]
clause = "8.6.5.3"
title = "CalRGB colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/src/colour.rs::calrgb_reads_its_matrix_one_column_per_component", "crates/pdf-model/src/colour.rs::calrgb_stating_srgbs_own_parameters_is_the_identity"]
note = "Table 63 in full: `/WhitePoint` as in Table 62, `/BlackPoint` defaulting to black, `/Gamma` an array of three defaulting to `[1 1 1]`, `/Matrix` nine numbers defaulting to the identity. The table's order is `[X_A Y_A Z_A X_B Y_B Z_B X_C Y_C Z_C]`, which is one *column* per triple rather than one row — the code's field comment says so, because reading it the other way is a plausible transposition that no page announces. Each component is decoded by its own gamma and the vector multiplied by the matrix, with no second stage. Clamping and `/BlackPoint` are as §8.6.5.2. The subclause's closing half — deriving `/Matrix` and `/WhitePoint` from phosphor chromaticities — is a writer's calculation and reaches no reader."

[[clause]]
clause = "8.6.5.4"
title = "Lab colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/src/colour.rs::lab_maps_its_anchor_colours"]
note = "`/WhitePoint`, `/BlackPoint` and `/Range` are read, and a Lab colour is converted through XYZ by the one route every CIE-based space takes (ADR 0012). Reviewed in the eleventh session for its component *ranges* rather than its conversion: L runs 0 to 100 and a and b take `/Range`'s bounds, which is what an `Indexed` space's colour table has to be scaled into (§8.6.6.3) and was not."

[[clause]]
clause = "8.6.5.5"
title = "ICCBased colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/icc.rs", "crates/pdf-model/src/colour.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::an_icc_image_is_converted_through_the_same_profile_as_a_fill", "crates/pdf-model/src/icc.rs::a_real_cmyk_profile_agrees_with_independent_evaluators"]
note = "The profile is parsed and evaluated by an A2B evaluator written in this tree, and it wins over `/Alternate` and `/N`, which is the clause's own order: the profile is the document's statement of what its numbers mean. `/Range` is read. **The twenty-fifth session closed the half that was silent**: a *fill* in an `ICCBased` space went through the profile and an *image* in the same space did not — `image.rs` reduced the space to a device one by its `/N` — which is trap 6's defect with an image on one side of it. 31 corpus documents carry 1037 such images and on 15 the two answers differed by 18 levels out of 255 for a mid grey. Closing it was a performance problem before it was a correctness one: an exact per-pixel conversion is dominated by transcendental functions (36% of one page in `libm`, by callgrind) and took the corpus gate from 1.7 s to 11.4 s. What ships is an *exact* per-image memo keyed on the raw sample tuple, which puts the gate at 1.8 s. ADR 0035."

[[clause]]
clause = "8.6.5.6"
title = "Default colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/image.rs", "crates/pdf-model/src/shading.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_default_colour_space_replaces_the_device_space", "crates/pdf-model/tests/colour_paths.rs::a_default_colour_space_replaces_an_images_device_space", "crates/pdf-model/tests/colour_paths.rs::a_default_space_outranks_the_output_intent"]
note = "`/DefaultGray`, `/DefaultRGB` and `/DefaultCMYK` are looked up in the resources whenever a device space is named, and the resolved space is used in its place — \"if such an entry is present, its value shall be used as the colour space for the operation currently being performed\". Because the lookup is inside `ColourSpace::by_name`, the clause's four indirect cases come free: a `Pattern`'s underlying space, an `Indexed` space's base and a `Separation` or `DeviceN`'s alternate all reach it by the same route. **The image half landed in the twenty-fifth session**: the clause requires the remapping of \"a colour space given as an entry in an image XObject, inline image, or shading dictionary\", and an image's space had been parsed against an *empty* resource dictionary. One corpus document names a default at all and its images state their space directly, so nothing in the corpus could have found it. Not implemented, and named here rather than left implicit: the clause's validity rules on what may *be* a default — not `Lab`, `Indexed` or `Pattern` — are not enforced, because a reader that honours a malformed one draws what the producer asked for and a reader that refuses draws nothing."

[[clause]]
clause = "8.6.5.7"
title = "Implicit conversion of CIE-Based colour spaces"
status = "inapplicable"
code = ["crates/pdf-model/src/colour.rs"]
note = "The clause is a permission to *skip* a conversion: where a source CIE-based space \"accurately represents the particular output device being used\", a processor should use the values directly rather than converting to XYZ and back. Its own NOTE 3 says the conditions \"cannot be specified in PDF, since nothing in PDF describes the calibration of the output device\". This device is an sRGB screen and every colour is converted to it at the moment it is read, so there is no four-to-three-to-four round trip for the clause to save and no place the shortcut would apply. The paragraph that would bind us if it did — that all the semantics of the device space then apply, including overprint mode and a `Separation` selecting a component of the group space — is answered by §8.6.7 and §11.7.4 for this device's three additive colourants (ADR 0028)."

[[clause]]
clause = "8.6.5.8"
title = "Rendering intents"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/icc.rs"]
test = ["crates/pdf-model/src/icc.rs::black_point_compensation_aligns_the_darkest_colour_the_profile_reaches"]
note = "Table 69's four names are recognised, and one of them changes what this renderer does: `AbsoluteColorimetric` turns black point compensation off, which §8.6.5.9 requires of it. `RelativeColorimetric`, `Saturation` and `Perceptual` are recorded and reach nothing further — selecting a profile's `A2B1` or `A2B2` table by intent is not done, so a perceptual intent renders colorimetrically. \"If a PDF processor does not recognise the specified name, it shall use the RelativeColorimetric intent by default\" is satisfied by construction rather than by a branch: everything that is not `AbsoluteColorimetric` takes the same path, which is what the clause asks a reader to do with a name it does not know. Both routes to the parameter are read, the `ri` operator and `/RI` in an `/ExtGState`; the third, an image dictionary's `/Intent`, is not."

[[clause]]
clause = "8.6.5.9"
title = "Use of black point compensation"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/icc.rs"]
test = ["crates/pdf-model/src/icc.rs::black_point_compensation_aligns_the_darkest_colour_the_profile_reaches"]
note = "`/UseBlackPtComp` is read with its three values, and `BlackPoint::applies` decides. `ON` compensates, `OFF` does not, and `Default` — \"the behaviour is left to the PDF processor to determine\" — compensates, which is this processor's determination and is written down as one. \"If the current render intent of an object is AbsColorimetric then the value of UseBlackPtComp shall be treated as OFF\" is implemented for both routes to the intent, and note the spelling: this clause writes `AbsColorimetric` where Table 69 writes `AbsoluteColorimetric`, and the code tests for the name a file may actually contain. What is `partial` is the `ON` half: the clause defers to ISO 18619 for what compensation *is*, and this tree does not have that document — what it implements is the black point stretch ADR 0012 describes, applied to an ICC profile's own black point, which is undefined on input Table 63 permits and is why `/BlackPoint` on a Cal space is read and not applied."

[[clause]]
clause = "8.6.6"
title = "Special colour spaces"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "Aggregate of the six below, read as a family in the nineteenth session because §11.7.4's overprinting is stated in terms of the colourants a `Separation` or `DeviceN` space names, and this is the clause that says what those are. All four families are implemented. The reading produced two rules neither the code nor any earlier note had: §8.6.6.4's `/All` and `/None` colourants, which are decided before the alternate space rather than through it."

[[clause]]
clause = "8.6.6.1"
title = "General"
status = "inapplicable"
note = "Two sentences naming the four special families — Pattern, Indexed, Separation and DeviceN — all four of which are implemented under the subclauses below. No requirement of its own."

[[clause]]
clause = "8.6.6.2"
title = "Pattern colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/tiling.rs::an_uncoloured_pattern_takes_its_colour_from_the_operator", "crates/pdf-model/tests/shadings.rs::a_shading_pattern_fills_only_the_path_it_paints"]
note = "Three sentences: an area is painted with a pattern rather than a colour, the pattern is a tiling (Type 1) or a shading (Type 2) one, and §8.7 has the detail. Both types are implemented on both backends. `ColourSpace::Pattern` carries the *underlying* space this clause's second form names, because an uncoloured tiling pattern takes its colour there rather than in any of its own — which is §8.7.3.3's requirement reaching this clause's array."

[[clause]]
clause = "8.6.6.3"
title = "Indexed colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/src/colour.rs::an_indexed_space_reads_its_table", "crates/pdf-model/tests/inline_images.rs::a_colour_space_name_is_looked_up_in_the_resources"]
note = "The four-element array, both forms of the table (byte string and stream), `hival` clamping, and the initial colour of 0. The sentence that had not been applied is the scaling one: \"Each byte shall be an unsigned integer in the range 0 to 255 that shall be scaled to the range of the corresponding colour component in the base colour space\". Every byte was divided by 255, which is that scaling only where the base's components run 0 to 1 — `issue2761.pdf` indexes into a `Lab` base and drew a black square where four renderers draw a pale grey gradient. Fixed in the eleventh session, and only visible then because `Indexed` images did not unpack before it."

[[clause]]
clause = "8.6.6.4"
title = "Separation colour spaces"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::the_none_colourant_marks_nothing", "crates/pdf-model/tests/colour_paths.rs::the_all_colourant_is_a_complemented_tint"]
note = "The four-element array, the tint in 0.0 to 1.0 treated subtractively, the initial value of 1.0, and the reversion to the alternate space through the tint transform. The reversion is not a fallback here but what the clause *requires* of this device: \"The preceding paragraph applies only to subtractive output devices such as printers and imagesetters. For an additive device such as a computer display, a Separation colour space never applies a process colourant directly; it always reverts to the alternate colour space as described below.\" That sentence is also what makes §11.7.3's soft-mask rule and §11.7.4's Table 146 collapse here, and it is a stronger citation for the choice than §11.7.3's own. Two rules were found missing by reading it in the nineteenth session, and both are now implemented: `/None`, which \"shall not produce any visible output\" and was painted through its tint transform like any other colourant, and `/All`, whose subtractive tint \"shall be complemented by subtracting from 1 before applying to all available colourants\" on an additive device and was likewise run through a transform the clause says to ignore. Both are decided before the alternate space and the tint transform are even parsed, because the clause requires those to be ignored \"although valid values shall still be provided\" — so an unreadable one cannot take the space with it. 2 corpus first pages set `/All`; none sets a `Separation` `/None`, which is trap 8 rather than evidence it is rare in the world."

[[clause]]
clause = "8.6.6.5"
title = "DeviceN colour spaces"
status = "partial"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "The space's four elements are read and a colour is converted by running the tint transform into the alternate space, which is what the clause requires of a processor with none of the named colourants available — and this one has none, since it draws to a screen. `None` colourants are therefore passed to the tint transform rather than discarded, which is what the clause says for the reverting case. The all-`None` rule was the exception and is implemented as of the nineteenth session: \"A DeviceN colour space whose component colourant names are all None shall always discard its output, just the same as a Separation colour space for None; it shall never revert to the alternate colour space.\" Still not implemented: `/NChannel` and the `/Colorants` attributes dictionary, neither of which changes the reverting path — an `/NChannel` space's per-component reversion is the one requirement of the pair that could, and it needs a colourant this device has."

[[clause]]
clause = "8.6.6.6"
title = "Multitone examples"
status = "inapplicable"
code = ["crates/pdf-model/src/colour.rs"]
note = "Four worked examples of `Indexed` over `DeviceN` producing duotones, tritones and quadtones, all of them NOTEs and EXAMPLEs. There is no requirement here that the two clauses they compose do not already state, and both are implemented — `MAX_DEPTH` exists so that exactly this nesting resolves. Read and dismissed, which the ledger records rather than leaving blank."

[[clause]]
clause = "8.6.7"
title = "Overprint control"
status = "inapplicable"
code = ["crates/pdf-model/src/content.rs"]
note = "`/OP`, `/op` and `/OPM` are read nowhere, and this clause is why rather than an omission it excuses. Overprinting decides what happens to the device colourants a painting operation does *not* name: \"If the overprint parameter is false (the default value), painting a colour in any colour space shall cause the corresponding areas of unspecified colourants to be erased\", and if true \"and the output device supports overprinting, erasing actions shall not be performed\". This device has three additive process colourants and produces no separations, and the clause states what such a device does: \"Not all devices support overprinting. … If overprinting is not supported, the value of the overprint parameter shall be ignored\" (NOTE 1). The overprint *mode* is settled by a `shall not` in the clause's own body: \"It also shall not apply if the native colour space of the output device does not include CMYK device colourants; in that case, source colours shall be converted to the device's native colour space, and all components participate in the conversion, whatever their values.\" Conversion of every component whatever its value is exactly what `ColourSpace::to_rgb` does. §11.7.4 reaches the same answer for the transparent model by an independent route, and ADR 0028 has both arguments and the honest limit — the one configuration where overprinting would change a pixel here is a group whose blending space is `DeviceCMYK`, which §11.6.6 already reports."

[[clause]]
clause = "8.6.8"
title = "Colour operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/type3.rs::a_d1_description_takes_its_colour_from_the_page_and_a_d0_one_does_not", "crates/pdf-model/tests/tiling.rs::an_uncoloured_cell_that_sets_a_colour_is_ignored", "crates/pdf-model/src/colour.rs::a_space_starts_at_the_colour_the_clause_gives_it"]
note = "All twelve operators of Table 73, and the clause's two further requirements, both of which were gaps found by reading it in the tenth session. The initial colour a `cs`/`CS` sets was black for every space; the clause gives six cases, of which a Separation's full ink, an Indexed space's entry 0 and a Pattern's paint-nothing were wrong. And the restriction on an uncoloured figure — a `d1` glyph description or an uncoloured tiling pattern, and everything either of them invokes — now ignores the listed operators, the two /ExtGState entries of the list this tree reads, and every image that is not an image mask."

[[clause]]
clause = "8.7"
title = "Patterns"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/shading.rs"]
test = ["crates/pdf-model/tests/tiling.rs::a_tiling_pattern_repeats_its_cell_across_the_filled_path", "crates/pdf-model/tests/shadings.rs::a_shading_pattern_fills_only_the_path_it_paints"]
note = "Both pattern types, reviewed as a family in the twenty-eighth session. A tiling pattern is a content stream replayed inside a clip; a shading pattern is a paint that travels into the display list as one. The two are drawn in completely different ways and the subclauses below say what each one reads."

[[clause]]
clause = "8.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/shading.rs"]
test = ["crates/pdf-model/tests/tiling.rs::a_tiling_pattern_repeats_its_cell_across_the_filled_path", "crates/pdf-model/tests/shadings.rs::a_shading_pattern_fills_only_the_path_it_paints"]
note = "Descriptive: patterns are Type 1 (tiling) or Type 2 (shading), and both are implemented."

[[clause]]
clause = "8.7.2"
title = "General properties of patterns"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/tiling.rs::a_pattern_inside_a_form_is_anchored_to_the_forms_space", "crates/pdf-model/tests/shadings.rs::a_pattern_in_an_annotation_appearance_is_placed_in_the_appearances_own_space", "crates/pdf-model/tests/shadings.rs::a_shading_pattern_fills_only_the_path_it_paints"]
note = "The sentence that decides where every gradient on a page lands: \"changes to the page's transformation matrix that occur within the page's content stream, such as rotation and scaling, have no effect on the pattern; it maintains its original relationship to the page no matter where on the page it is used\". So a pattern is positioned by its `/Matrix` composed with the *parent content stream's default* space, which the interpreter carries as `base`, and never with the transform in force at the fill. Inside a form XObject the parent is the form, \"that is, the form coordinate space at the time the form is painted with the Do operator\", and that is what `base` holds while a form is being run — **since the fifty-second session; this row claimed it for twenty sessions while `base` stayed the page's throughout**. `issue6231_1.pdf` is what found it: a TeX plot whose surface is a type 5 shading pattern inside a form, positioned 180 points below and 140 to the left of where it belonged, so every triangle fell outside the clip and the page drew its axes and nothing else, silently. The row now names a test that fails if the claim stops being true, which is what `FILE_ONLY_EVIDENCE_CEILING` is counting. **And the claim was wrong a second time, in the hundred-and-ninety-ninth session, one path over.** §12.5.5 makes an annotation's appearance stream a form XObject and `content.rs` says so in a comment, but `draw_appearance` is a second way into a form's content and it never set `base`, so a pattern inside an appearance was positioned by the *page's* default space. `issue7821.pdf` is a stamp whose rounded box is filled by a `PatternType 2` axial shading: the page's crop box starts at x 445.966 and the shading's `/Coords` run 163.729 to 315.349, so the axis fell entirely off the visible page and `/Extend [true true]` painted the box one flat colour that looked exactly like a fill anybody would believe. The lesson is the one the fifty-second session already paid for: **a rule about \"the parent content stream\" needs a test per way of becoming a parent**, and there were two. ADR 0160. `/PatternType` selects between the two kinds; the NOTE says PDF does not support PostScript's define-here-use-there, and neither does this."

[[clause]]
clause = "8.7.3"
title = "Tiling patterns"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/tiling.rs::a_glyph_filled_with_a_tiling_pattern_is_tiled", "crates/pdf-model/tests/tiling.rs::a_cell_is_clipped_to_its_bounding_box"]
note = "Both paint types, and — since the fifty-third session — every *fill* a tiling pattern can be the colour of, glyphs included: §8.7.2's \"All patterns shall be treated as colours\" makes text no different from a path, and `pattern_text_embedded_font.pdf` was drawing one of its two lines and leaving the other blank. `partial` for the half that is left: a **stroke** whose colour is a tiling pattern would be the cell replayed across the stroked outline, and that outline is the backends' to compute (§8.4.3, ADR 0028), so there is no path here to tile. One corpus document does it and is reported rather than stroked in whatever solid colour was last set. See the subclauses."

[[clause]]
clause = "8.7.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/tiling.rs::a_cell_is_clipped_to_its_bounding_box", "crates/pdf-model/tests/tiling.rs::a_rule_spanning_its_whole_cell_deposits_the_ink_its_geometry_states", "crates/pdf-model/tests/tiling.rs"]
note = "Table 74's entries: `/PaintType` selects coloured or uncoloured, `/BBox` clips the cell — **since the fifty-first session, and this row asserted it for twenty sessions while the code did not do it**; `Tiling` carried no box at all, and `tiling-pattern-large-steps.pdf` was contradicted by one tile differing 128 levels of 255 because a cell painting to x = 4000 inside a box ending at 3950 ran on to the end of the page. The sentence is one line — \"These boundaries shall be used to clip the pattern cell\" — and the clip is per *cell*, because content past one cell's box would otherwise spill into the next cell's or into the gap `/XStep` leaves between them. A note in this ledger is a claim; only a test makes it a fact. **And a clip that removes nothing is not applied, since the hundred-and-eighty-eighth session.** The clause's sentence is about *geometry*, and applying it where the cell draws nothing outside its box removes coverage rather than geometry: a clip mask is anti-aliased, so a mark lying on the boundary keeps a fraction of the boundary pixel and the neighbouring cell keeps the rest, and two fractions composite as `1 − (1−a)(1−b)` rather than adding. `issue16038.pdf` rules a grid with a line spanning exactly its own cell and lost **15% of the ink its geometry states** to that (`AMBIGUOUS_TILING_CELL_CLIP`, ADR 0155). The first cell decides for all of them — they are one figure translated — and it is decided *after* the cell is drawn, by `pdf_render::outline::marked_bounds`, because a cell's extent is not known until its content stream has run and running it twice would double the readback and the text layer. Conservative wherever it cannot tell: a command whose extent cannot be bounded, or whose clip is a chain the cell's own content built on the box, keeps the clip for the whole tiling. The clip stays where it is load-bearing, which `a_cell_is_clipped_to_its_bounding_box` is the standing check on. `/XStep` and `/YStep` space the tiles, `/Resources` names what the cell draws and `/Matrix` places it. The clause's four steps are what the interpreter does — save, install the state in force at the beginning of the parent content stream with the current transform altered by the pattern matrix, run the cell, restore. **`/TilingType` is not read**, and this row is `partial` for it: all three values describe *adjustments to the device pixel grid* — constant spacing by a multiple of a device pixel, no distortion, or constant spacing with more distortion allowed — and this renderer distorts nothing and snaps nothing, which is value 2's behaviour whatever the file asks for. 21 corpus documents ask for something else. A second departure is recorded here rather than hidden: the clause says `/XStep` and `/YStep` \"shall not be zero\", and a zero or absent step falls back to the cell's own size, because the alternative is an infinite loop or an unpainted area."

