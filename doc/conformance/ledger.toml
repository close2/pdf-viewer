clause = "12.8.1"
title = "General"
status = "partial"
code = ["crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/src/document.rs::a_signature_dictionary_is_recognised_by_its_type"]
note = "Read only as far as §7.6.2's exception needs: a signature dictionary's /Contents is a hexadecimal string that is not encrypted, which `decrypt_dict` skips on a /Type of /Sig or /DocTimeStamp. Nothing validates a signature or draws its appearance from anything but a stored /AP, and neither is reported — a document with an invalid signature looks exactly like one with a valid signature. That is a real gap in clause 12 rather than in this row's use of it."

