title = "Summary of basic compositing computations"
status = "unreviewed"

[[clause]]
clause = "11.4"
title = "Transparency groups"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Aggregate of the eight below, read as a family in the seventeenth session with transparency groups as the demand item. A group's elements are composited onto a transparent backdrop and the result painted once under the constant alpha and blend mode in force at Do — §11.4.5's isolated, non-knockout group, which is what both backends express natively. §11.4.7's page group is implemented and was the session's largest finding. Knockout (§11.4.6) is reported, and so is a non-isolated group whose elements blend, which is the only case where §11.4.4's backdrop removal does not cancel."

[[clause]]
clause = "11.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-render/src/display_list.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "A group is \"collected together and composited to produce a single colour, shape, and opacity at each point\" and the result treated as one object, which is what Command::Group asks a backend for. Of the four further attributes this clause lists three are here — the compositing inputs applied to the group as a whole, isolation, knockout — and the fourth is §11.5's: a group's result used as a source of shape or opacity for a soft mask, still reported rather than built."

[[clause]]
clause = "11.4.2"
title = "Notation for group compositing computations"
status = "inapplicable"
note = "Notation, and Table 138's renaming of §11.3's variables so that §11.4.4 can state its recurrences. There is no requirement to implement; marking it implemented would claim code for a clause that asks for none, which is the reading §11.6.1 already has."

[[clause]]
clause = "11.4.3"
title = "Group structure and nomenclature"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "The three backdrops this clause distinguishes. The group backdrop is what is already on the page; the initial backdrop is transparent here, which is the isolated choice (§11.4.5); the immediate backdrop is what a group's own buffer accumulates, and is right because the elements are drawn into that buffer in order. Its last requirement — \"A PDF processor shall ensure that the backdrop's contribution to the overall result is applied only once\" — holds by construction, since a transparent initial backdrop has no contribution to remove. What is absent is the non-isolated reading of the same sentence; see §11.4.4."

[[clause]]
clause = "11.4.4"
title = "Group compositing computations"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_non_isolated_group_reports_only_when_an_element_blends"]
note = "The recurrence for a non-isolated, non-knockout group, and NOTE 3's backdrop removal at the end of it. With every element blending Normal the removal is exact and the backdrop cancels, so the isolated computation both backends perform is this one — §11.6.7's NOTE 1 states that equivalence for the same formulas applied to a pattern cell. What is not implemented is a non-isolated group holding an element with another blend mode, where NOTE 2 makes the backdrop the whole point; that is reported, on 9 corpus documents. Table 140's separate group shape and group alpha are not maintained either: this renderer holds one alpha per pixel, which is §11.3.7.3's row."

[[clause]]
clause = "11.4.5"
title = "Isolated groups"
status = "implemented"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_group_is_composited_once_rather_than_object_by_object"]
note = "\"α0 = 0.0 if the group is isolated\" — a transparent buffer, which is what a tiny-skia pixmap and a Vello layer both start as. The consequence the clause spends its length on follows from it: an element's blend mode inside the group sees only what the group itself painted. Its closing sentence, about which rendering intent converts the group's colours into the backdrop's space, has nothing to convert here — there is one blending space, device RGB, and a group asking for another is reported (§11.6.6)."

[[clause]]
clause = "11.4.6"
title = "Knockout groups"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs::a_knockout_group_reports_only_where_the_two_models_differ"]
note = "Was this tree's first `silent` row, from the ninth session; reported since the seventeenth, and still owed. A knockout group's elements are composited with the group's initial backdrop rather than with each other, so at any point the topmost object wins. This renderer composites them with each other. The report fires where the two models can differ — an element that composites overlapping one painted before it — which is 6 corpus documents rather than the 8 that write /K true. The reading is written down because it is the load-bearing part of the implementation nobody has written yet: for an isolated knockout group the initial backdrop is transparent, so §11.3.6's formula leaves each element its own colour and its blend mode has no effect at all, and the clause's two-stage average by source shape is then a Porter-Duff Source composite modulated by coverage. A non-isolated knockout group needs the group's backdrop, which is the same thing §11.4.4 lacks. knockout_*.pdf are the corpus's cases and sat in oracle.rs's CONTRADICTED_UNEXPLAINED until the report moved them out of the comparison."

[[clause]]
clause = "11.4.7"
title = "Page group"
status = "partial"
code = ["crates/pdf-render/src/backend.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::vello_hands_back_straight_alpha"]
note = "The seventeenth session's largest finding, and it was invisible until a group made it visible. Everything painted on a page belongs to a page group that \"shall be treated as an isolated group, whose results shall then be composited with a backdrop colour appropriate for the medium\" — so the page's own initial backdrop is transparent, and the medium's white is applied to the finished page. Both backends filled the raster with white and drew over it, which is a different picture for every blend mode: an object blending against an unpainted part of the page saw white where the standard says it sees nothing. transparency_group.pdf draws a Difference ellipse that four reference renderers show crimson over white, and this tree showed as its inverse. `impose_on_medium` in pdf-render is the composite, called by both backends so neither can differ about it. What is not implemented is the clause's second case, a page used as an element of another document's page through a reference XObject (§8.10.4), which needs importing before the page group's attributes can matter."

[[clause]]
clause = "11.4.8"
title = "Summary of group compositing computations"
status = "partial"
code = ["crates/render-cpu/src/lib.rs", "crates/render-gpu/src/scene.rs"]
test = ["crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_transparency_group"]
note = "A restatement of §11.4.4's formulas with the subscript b that selects the backdrop — 0 in a knockout group, i-1 otherwise — and with isolation folded in. Its own NOTE says the formulas \"can be significantly simplified when some sources of shape and opacity are not present\" and that each kind of group cancels some of the terms; the isolated, non-knockout case is the one this tree evaluates, as a source-over composite of the group's buffer. The status follows §11.4.4's and §11.4.6's rather than adding anything: this clause introduces no requirement they do not."

[[clause]]
clause = "11.5"
title = "Soft masks"
status = "implemented"
code = ["crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs", "crates/pdf-render/src/soft_mask.rs", "crates/render-cpu/src/lib.rs", "crates/render-gpu/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs", "crates/render-cpu/tests/soft_mask.rs", "crates/render-gpu/tests/headless_gpu.rs::cpu_and_gpu_agree_on_a_soft_mask"]
note = "Aggregate of the three below, and the eighteenth session's demand item. A soft mask is a transparency group evaluated for its opacity: `pdf-model` runs the group into a command list of its own, both backends rasterise it at device resolution, and `pdf_render::SoftMask::value` — one function, called by both — turns the pixels into mask values. Was `reported` on 28 corpus documents until §11.4's groups made it buildable. ADR 0027."

[[clause]]
clause = "11.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-render/src/soft_mask.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/render-cpu/tests/soft_mask.rs::a_constant_mask_interpolates_between_the_object_and_the_backdrop"]
note = "Introduces the mask shape and mask opacity a soft mask supplies. Its NOTE 2's soft clip is what the CPU backend literally builds — the mask becomes a `tiny_skia::Mask` multiplied into the clip mask, which is the NOTE's \"generalization of the hard clip\" as arithmetic. Shape and opacity are one alpha here (§11.3.7.1's `a = f x q`), so `/AIS` is immaterial and deliberately not read; see §11.6.4.3."

[[clause]]
clause = "11.5.2"
title = "Deriving a soft mask from group alpha"
status = "implemented"
code = ["crates/pdf-render/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs::an_alpha_mask_reads_the_groups_alpha_and_ignores_its_colour", "crates/pdf-render/src/soft_mask.rs::an_alpha_mask_reads_the_alpha_and_ignores_the_colour"]
note = "The group is drawn onto a fully transparent surface and its alpha channel taken, which is the clause's backdrop \"whose value does not contribute to the eventual result\" factored out by construction rather than by subtraction. Its NOTE 2 — the shape and alpha of an empty group is 0.0 — falls out of the same surface. `smask_alpha_bc.pdf`, `smask_alpha_oob.pdf` and `smask_alpha_oob_transfer.pdf` are the corpus's cases and all three now draw."

[[clause]]
clause = "11.5.3"
title = "Deriving a soft mask from group luminosity"
status = "partial"
code = ["crates/pdf-render/src/soft_mask.rs", "crates/pdf-model/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs::a_luminosity_mask_takes_the_groups_grey_and_the_backdrops_outside_it", "crates/pdf-render/src/soft_mask.rs::a_luminosity_mask_uses_the_clauses_own_coefficients"]
note = "The group is composited onto the opaque `/BC` backdrop and the luminosity of the result taken, by the clause's device branch: \"convert the colour to DeviceGray by implementation-defined means\", the means being EXAMPLE 2's Y = 0.30 R + 0.59 G + 0.11 B. Those coefficients and not a library's: `tiny_skia::MaskType::Luminance` is Rec. 709 and Vello's luminance mask is the SVG formula, and both are a fifth of the mask's range away on green. What is not done is the clause's *other* branch — a CIE-based group space converted to XYZ and its Y taken — because every colour here is converted to device RGB one at a time long before a mask is composited; that is §11.6.6's departure seen from this clause, and it is exact for the grey spaces (0.30 + 0.59 + 0.11 = 1) and reported for the rest. \"G may be any kind of group - isolated or not, knockout or not\" is honoured by reporting §11.4's two structural departures for a mask group exactly as for a painted one."

[[clause]]
clause = "11.6"
title = "Specifying transparency in PDF"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/transparency.rs", "crates/pdf-model/tests/image_masks.rs"]
note = "Aggregate of the seven below, completed as a family in the fifteenth session (§11.6.4 was the fourteenth's). Blend modes, both alpha constants and an image's own soft mask are implemented; a graphics-state soft mask is reported; transparency groups are the silence, and §11.6.6 is where it is recorded."

[[clause]]
clause = "11.6.1"
title = "General"
status = "inapplicable"
note = "One sentence of scope: the subclauses before it describe the model abstractly and this one describes its representation in PDF. There is nothing to implement, and marking it `implemented` would claim code for a clause that asks for none."

[[clause]]
clause = "11.6.2"
title = "Specifying source and backdrop colours"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_filled_and_stroked_path_reports_only_where_it_can_show"]
note = "\"Portions of an object shall not be composited with one another\" — and `B` and its three relatives paint one object as a `Fill` and a `Stroke`, so the band a centred stroke shares with the fill composites twice. Reported as of the fifteenth session, on the pages where it can show: the paint composites, and both parts mark the page. 4 corpus documents, of which `alphatrans.pdf` is the one drawn wrong. Implementing it means compositing the two parts into one element, which is §11.4.6's groups again. The clause's other two examples cost nothing here: a self-intersecting path is filled once under one winding rule, and a mesh shading is one paint. Source colour and backdrop colour are as the clause states them."

[[clause]]
clause = "11.6.3"
title = "Specifying blending colour space and blend mode"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_blend_mode_array_takes_the_first_name_this_reader_knows"]
note = "All sixteen names of Tables 134 and 135 reach both backends, and the deprecated array form takes \"the first blend mode in the array that it recognizes (or Normal if it recognizes none of them)\" — which is not the first *name*, and was until the fifteenth session. The blending colour space is the other half of the clause and it defers to §11.6.6: we composite in the device space throughout, which is what a page with no group attributes dictionary asks for."

[[clause]]
clause = "11.6.4"
title = "Specifying shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_soft_mask_overrides_an_explicit_mask"]
note = "Aggregate of the four below, read as a family in the fourteenth session because §11.6.4.3 decides the precedence between the masks that session implemented. Two of the three sources §11.6.4.1 names are implemented — object shape and the constant — and the third, the mask, only where it is an image's own /SMask or /Mask."

[[clause]]
clause = "11.6.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs"]
note = "Lists the three sources of shape and opacity and defers each to a subclause. Object shape (§11.6.4.2) and the constants (§11.6.4.4) are implemented; a mask (§11.6.4.3) is implemented for an image's own entries and reported for the graphics state's."

[[clause]]
clause = "11.6.4.2"
title = "Object shape and opacity"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "Every clause of the list holds here. A path or a glyph has shape 1 inside and 0 outside, which is what filling an outline does; an image has shape 1 inside its rectangle \"further modified by an explicit or colour key mask\", which became true in the fourteenth session (§8.9.6.3, §8.9.6.4); an image mask has shape 1 where it paints; a pattern's shape is constrained by the objects that define it, which falls out of replaying a tiling pattern's content stream. The last one is worth naming because it is satisfied by *absence*: the shape of an `sh` is its geometry \"disregarding the Background entry in the shading dictionary\", and nothing in this tree reads /Background at all. The intrinsic opacity of 1.0 everywhere is likewise structural — opacity enters only through `ca`, `CA` and a mask."

[[clause]]
clause = "11.6.4.3"
title = "Mask shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_soft_mask_overrides_an_explicit_mask"]
note = "The clause's precedence is implemented as of the fourteenth session, and it was read here rather than in §8.9: an image's /SMask, and a non-zero /SMaskInData, \"shall override any explicit or colour key mask specified by the image dictionary's Mask entry\". Before that a file writing both would have had the loser applied. The graphics state's own /SMask is reported rather than applied (28 corpus documents) and /None is the only value that needs nothing. What is not read is /AIS: its default of false is what this renderer assumes, and a document setting it true asks for the constant and the mask to be *shape* rather than opacity values, which §11.3.7.2 distinguishes only in how a transparency group accumulates them — so it cannot show until §11.4.6 exists. No corpus document writes it."

[[clause]]
clause = "11.6.4.4"
title = "Constant shape and opacity"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::the_two_alpha_constants_reach_stroking_and_non_stroking_paint_separately", "crates/pdf-model/tests/transparency.rs::an_object_drawn_without_a_constant_is_opaque"]
note = "`ca` and `CA` are two scalars in the graphics state, applied to non-stroking and stroking paint respectively, which is the clause, and which no test isolates — they reach the page through the corpus and the oracle. Two sentences are not: \"The nonstroking alpha constant shall also be applied when painting a transparency group's results onto its backdrop\", which needs groups (§11.4.6), and the /AIS flag, which decides whether the constants are shape or opacity — see §11.6.4.3 for why that cannot show here yet."

[[clause]]
clause = "11.6.5"
title = "Specifying soft masks"
status = "implemented"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs", "crates/pdf-model/tests/soft_masks.rs"]
note = "Two ways to specify a soft mask, and both are implemented as of the eighteenth session: a soft-mask dictionary in the graphics state (§11.6.5.1) and a soft-mask image on an image XObject (§11.6.5.2), the latter including at a resolution of its own and with `/Matte` undone. What each of the two rows still owes is stated there."

[[clause]]
clause = "11.6.5.1"
title = "Soft-mask dictionaries"
status = "implemented"
code = ["crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs"]
note = "Table 142 entire. `/S` selects §11.5.2's or §11.5.3's derivation and any other name is refused and reported; `/G` is run as a transparency group with §11.6.6's initialisation, its own `/BBox` clipping it and its `/Matrix` concatenated with the transform in force at the `gs` — not at the painting operation, which is the sentence a later `cm` would otherwise break; `/BC` is read in the group's own `/CS`, so its component count is that space's, and defaults to the space's initial colour; `/TR` is sampled onto the 256 values an eight-bit mask value can take, exactly, and clamped as the clause requires. The value outside the group's bounding box is the transfer function of 0.0 or of the backdrop's luminosity, which falls out of drawing the group onto transparency rather than being a second code path. The over-report the previous note described is gone: §11.6.4.3's precedence is now read, so an image carrying its own mask is drawn with the graphics state's mask off."

[[clause]]
clause = "11.6.5.2"
title = "Soft-mask images"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "An `/SMask` sample-for-sample with its image supplies its alpha, and `/SMaskInData` is honoured for JPEG 2000. Table 143's `/Width` restriction is where the gap is: a mask's dimensions are \"independent\" of the parent's, and \"both images shall be mapped to the unit square in user space … regardless of whether the samples coincide individually\" — so a mask of a different size must still apply. We hold one raster per image and no device resolution, so combining them means choosing a grid: the image's loses the mask's detail, the mask's costs its area (`issue16263.pdf` gives a 2x2 image a 34862x4332 mask). Neither is a decision for an image decoder, so the mask is left unapplied and reported. 3 corpus documents. `/Matte` is not read, and is only meaningful where the dimensions match."

[[clause]]
clause = "11.6.6"
title = "Transparency group XObjects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Was `silent` — a /Group was read nowhere and a group XObject was drawn as an ordinary form — and is implemented as of the seventeenth session. Table 145's /S selects the subtype, /I and /K are read, and the four actions this clause adds to Do are performed: the initial backdrop, the initialisation of the blend mode and both alpha constants (NOTE 1's reason — those parameters belong to the group, and leaving them in force applies them twice), compositing the elements into the group, and painting the group's result into the parent under the state at Do. The requirement that each Do be treated as a separate group falls out, since nothing is cached. What is not implemented is the group colour space: /CS is read and named where compositing in it would differ from compositing in the device's three components, which is 4 corpus documents, all of them /DeviceCMYK. Honouring it means holding the group's raster in its own components, which is a second raster format rather than a colour conversion."

[[clause]]
clause = "11.6.7"
title = "Patterns and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_shading_carries_the_non_stroking_constant"]
note = "A shading pattern composites \"as if the shading dictionary were applied with the sh operator\", which is exactly how `paint_shading` and `fill_paint` treat it, and both carry §11.6.4.4's constant as of the fifteenth session. What is not honoured is the implicit group the clause wraps a pattern in: `tile` replays a tiling pattern's cell with the current blend mode and alpha constants inherited rather than reset to their defaults and applied once to the finished pattern. That is the closest available approximation while §11.4.6 does not exist — the constant reaches the cell's objects instead of the pattern's result — and it differs where a cell sets a constant of its own or where two tiles overlap. `/ExtGState` in a shading pattern dictionary is not read either."

[[clause]]
clause = "11.7"
title = "Colour space and rendering issues"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs", "crates/pdf-model/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs", "crates/pdf-model/tests/soft_masks.rs"]
note = "Aggregate of the five below, read as a family in the eighteenth session because §11.6.5.1's `/BC` is stated in a group's blending colour space and this is the clause that says what such a space is. Two of its five subclauses are satisfied, one is a departure this tree already reports, and §11.7.4's overprinting is not implemented and — as of this reading — the ledger's third `silent` row."

[[clause]]
clause = "11.7.1"
title = "General"
status = "inapplicable"
note = "One sentence introducing the subclauses below. There is no requirement to implement, and claiming one would put code against a clause that asks for none."

[[clause]]
clause = "11.7.2"
title = "Colour spaces for transparency groups"
status = "reported"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/soft_mask.rs"]
note = "Every compositing computation here happens on the three components of the device raster, so the group blending space this clause governs is device RGB whatever a `/CS` says. Three of its rules are therefore departures rather than gaps, and each is reported where it can change a pixel: a group whose `/CS` is not a three-component RGB space (§11.6.6, 4 corpus documents, all `/DeviceCMYK`), a soft-mask group whose `/CS` is not one either (§11.5.3, 7 documents), and the inheritance rules — a device space taking the nearest CIE-based ancestor's, a non-isolated group taking its nearest isolated ancestor's — which have nothing to inherit into. \"For the compositing computations to work in a device-independent way, the group's colour space should be CIE-based\" is a *should*, and this tree does not: it converts every colour once, into device RGB, which is trap 6's one-conversion rule and the reason the two backends cannot disagree about colour. Annex P's algorithm is the same subject and equally unimplemented."

[[clause]]
clause = "11.7.3"
title = "Spot colours and transparency"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "The clause offers two treatments for a spot colour inside a group — keep a component of its own, or \"be converted to its alternate colour space\" — and this tree always takes the second: a `Separation` or `DeviceN` colour goes through its tint transform into the alternate space at the moment it is read, before anything composites. That is conforming rather than a shortcut, and it makes the clause's one *shall* about soft masks true by construction: \"spot colours shall not be available in a transparency group XObject that is used to define a soft mask; the alternate colour space shall always be substituted in that case.\" What is given up is the first treatment's separation fidelity, which needs a raster per colourant and a device that has them."

[[clause]]
clause = "11.7.4"
title = "Overprinting and transparency"
status = "silent"
note = "Aggregate of the five below, and the ledger's third `silent` row. `/OP`, `/op` and `/OPM` are read nowhere in this tree, and 63 of the corpus's first-page `/ExtGState` dictionaries set one of the two booleans true. Under §11.7.4.2 an object painted with overprinting enabled composites through the *special overprinting blend mode* rather than through Normal, which leaves the backdrop's value in every colour component the source does not paint — so a document that enables it gets more ink than it asked for here, with nothing said. Sizing a report is the work this row is owed, and trap 11 is the reason it was not written this session: presence of the key is not the condition, since overprinting changes nothing where the source paints every component of the group's space, which is what an ordinary `rg` or `g` fill does."

[[clause]]
clause = "11.7.4.1"
title = "General"
status = "silent"
note = "Introduces the special overprinting blend mode and the two parameters that select it. Nothing here reads either; see §11.7.4."

[[clause]]
clause = "11.7.4.2"
title = "Blend modes and overprinting"
status = "silent"
note = "\"When overprinting is enabled, the blend mode shall be replaced by the special overprinting blend mode, disregarding the current blend mode\" — this tree keeps the current blend mode. Table 146's per-component rule is what an implementation owes: a component the source does not paint takes the backdrop's value under `OP true`, which is not expressible while compositing happens in three device components rather than in the group's colourants (§11.7.2)."

[[clause]]
clause = "11.7.4.3"
title = "Compatibility with opaque overprinting"
status = "silent"
note = "The rule that makes transparent overprinting agree with the opaque model where both apply. Unimplemented with the rest of §11.7.4."

[[clause]]
clause = "11.7.4.4"
title = "Special path-painting considerations"
status = "silent"
note = "A path filled *and* stroked under overprinting is one object whose two parts must not overprint each other. This tree emits two commands for `B` and already reports that under §11.6.2 for a paint that composites; the overprinting half of the same sentence is unreported because overprinting itself is."

[[clause]]
clause = "11.7.4.5"
title = "Summary of overprinting behavior"
status = "silent"
note = "Table 146, which is the whole of what an implementation of §11.7.4 has to execute, plus its NOTE 2's rule that a *group* reverts to Normal because nothing records which components its elements painted. Read, and not implemented."

[[clause]]
clause = "11.7.5"
title = "Rendering parameters and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "Aggregate of the three below: which rendering parameters apply where objects overlap. The halftone and transfer function half describes a marking device this tree does not have; the colour-conversion half is honoured trivially, because a colour is converted once, at the moment it is read, rather than at a group boundary."

[[clause]]
clause = "11.7.5.1"
title = "General"
status = "inapplicable"
note = "Prose dividing the rendering parameters into the two categories the two subclauses below treat. No requirement of its own."

[[clause]]
clause = "11.7.5.2"
title = "Halftone and transfer function"
status = "inapplicable"
code = ["crates/pdf-model/src/content.rs"]
note = "Requires an implementation to track the halftone and transfer function per *region* of the page, since the topmost fully opaque object at each point decides them. Both parameters describe a marking device — §10.5 and §10.6 — and this tree reads neither: `/HT`, `/TR`, `/TR2`, `/BG` and `/UCR` are named in `content.rs` only as the `/ExtGState` entries §8.6.8 forbids an uncoloured figure to set. With nothing to track, the tracking is inapplicable rather than owed. It becomes applicable the day a transfer function is honoured, and this row is where that will be recorded."

[[clause]]
clause = "11.7.5.3"
title = "Rendering intent, black point compensation and colour conversions"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause's subject is *when* a conversion happens: in the transparent model the target may be a group's colour space rather than the device's, so the intent and the black point compensation in force at that moment are the ones that apply. Here every colour is converted to device RGB at the moment it is read, so the parameters in force are always the object's own — which is what the clause asks for, by a route that makes the question unaskable. `/RI` and `/UseBlackPtComp` are read and reach that conversion (§8.6.5.9, ADR 0012). What is not done is the second half: black generation and undercolour removal \"shall be applied only during conversion from DeviceRGB to DeviceCMYK\", which this tree never performs, and the selection of an ICC profile's `A2B` table by intent, which §8.6.5.8 already records."

