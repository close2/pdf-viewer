clause = "8.6.8"
title = "Colour operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/type3.rs::a_d1_description_takes_its_colour_from_the_page_and_a_d0_one_does_not", "crates/pdf-model/tests/tiling.rs::an_uncoloured_cell_that_sets_a_colour_is_ignored", "crates/pdf-model/src/colour.rs::a_space_starts_at_the_colour_the_clause_gives_it"]
note = "All twelve operators of Table 73, and the clause's two further requirements, both of which were gaps found by reading it in the tenth session. The initial colour a `cs`/`CS` sets was black for every space; the clause gives six cases, of which a Separation's full ink, an Indexed space's entry 0 and a Pattern's paint-nothing were wrong. And the restriction on an uncoloured figure — a `d1` glyph description or an uncoloured tiling pattern, and everything either of them invokes — now ignores the listed operators, the two /ExtGState entries of the list this tree reads, and every image that is not an image mask."

