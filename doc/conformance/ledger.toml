note = "§7.11.4.2's related files array, in `attachment::related`. The shape is the part worth getting right: `/RF` is a dictionary keyed like `/EF` — `/F`, `/UF` and the platform keys — and each value is a *flat* array of `2 × n` elements alternating a name with an embedded file stream, not an array of pairs. The clause's own EXAMPLE is a DCS 1.0 set of five files behind one specification, and it is the test. Nothing extracts them, and the reason recorded here — \"writing a file is what the sandbox exists to prevent\" — was wrong: the host writes, not the renderer, which is what `Command::Extract` now does for `/EmbeddedFiles`. The true reason is that nothing asks: a related-files set belongs to whoever holds the specification, and no corpus file specification carries an `/RF`. No corpus file specification carries a `/RF`, measured over every object of all 974 documents."

[[clause]]
clause = "7.11.5"
