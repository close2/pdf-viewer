note = "Two ways to specify a soft mask, and both are implemented as of the eighteenth session: a soft-mask dictionary in the graphics state (§11.6.5.1) and a soft-mask image on an image XObject (§11.6.5.2), the latter including at a resolution of its own and with `/Matte` undone. What each of the two rows still owes is stated there."

[[clause]]
clause = "11.6.5.1"
title = "Soft-mask dictionaries"
status = "implemented"
code = ["crates/pdf-model/src/soft_mask.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/soft_masks.rs"]
note = "Table 142 entire. `/S` selects §11.5.2's or §11.5.3's derivation and any other name is refused and reported; `/G` is run as a transparency group with §11.6.6's initialisation, its own `/BBox` clipping it and its `/Matrix` concatenated with the transform in force at the `gs` — not at the painting operation, which is the sentence a later `cm` would otherwise break; `/BC` is read in the group's own `/CS`, so its component count is that space's, and defaults to the space's initial colour; `/TR` is sampled onto the 256 values an eight-bit mask value can take, exactly, and clamped as the clause requires. The value outside the group's bounding box is the transfer function of 0.0 or of the backdrop's luminosity, which falls out of drawing the group onto transparency rather than being a second code path. The over-report the previous note described is gone: §11.6.4.3's precedence is now read, so an image carrying its own mask is drawn with the graphics state's mask off."

[[clause]]
clause = "11.6.5.2"
title = "Soft-mask images"
status = "partial"
code = ["crates/pdf-model/src/image.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "An `/SMask` sample-for-sample with its image supplies its alpha, and `/SMaskInData` is honoured for JPEG 2000. Table 143's `/Width` restriction is where the gap is: a mask's dimensions are \"independent\" of the parent's, and \"both images shall be mapped to the unit square in user space … regardless of whether the samples coincide individually\" — so a mask of a different size must still apply. We hold one raster per image and no device resolution, so combining them means choosing a grid: the image's loses the mask's detail, the mask's costs its area (`issue16263.pdf` gives a 2x2 image a 34862x4332 mask). Neither is a decision for an image decoder, so the mask is left unapplied and reported. 3 corpus documents. `/Matte` is not read, and is only meaningful where the dimensions match."

[[clause]]
clause = "11.6.6"
title = "Transparency group XObjects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency_groups.rs"]
note = "Was `silent` — a /Group was read nowhere and a group XObject was drawn as an ordinary form — and is implemented as of the seventeenth session. Table 145's /S selects the subtype, /I and /K are read, and the four actions this clause adds to Do are performed: the initial backdrop, the initialisation of the blend mode and both alpha constants (NOTE 1's reason — those parameters belong to the group, and leaving them in force applies them twice), compositing the elements into the group, and painting the group's result into the parent under the state at Do. The requirement that each Do be treated as a separate group falls out, since nothing is cached. What is not implemented is the group colour space: /CS is read and named where compositing in it would differ from compositing in the device's three components, which is 4 corpus documents, all of them /DeviceCMYK. Honouring it means holding the group's raster in its own components, which is a second raster format rather than a colour conversion."

[[clause]]
clause = "11.6.7"
title = "Patterns and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/transparency.rs::a_shading_carries_the_non_stroking_constant"]
note = "A shading pattern composites \"as if the shading dictionary were applied with the sh operator\", which is exactly how `paint_shading` and `fill_paint` treat it, and both carry §11.6.4.4's constant as of the fifteenth session. What is not honoured is the implicit group the clause wraps a pattern in: `tile` replays a tiling pattern's cell with the current blend mode and alpha constants inherited rather than reset to their defaults and applied once to the finished pattern. That is the closest available approximation while §11.4.6 does not exist — the constant reaches the cell's objects instead of the pattern's result — and it differs where a cell sets a constant of its own or where two tiles overlap. `/ExtGState` in a shading pattern dictionary is not read either."

[[clause]]
clause = "11.7"
title = "Colour space and rendering issues"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs", "crates/pdf-model/src/soft_mask.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs", "crates/pdf-model/tests/soft_masks.rs"]
note = "Aggregate of the five below, read as a family in the eighteenth session because §11.6.5.1's `/BC` is stated in a group's blending colour space and this is the clause that says what such a space is. Two of its five subclauses are satisfied and one is a departure this tree already reports. §11.7.4's overprinting was recorded as six `silent` rows by that reading and re-decided by the nineteenth session's reading of §8.6.6 and §8.6.7: Table 146's blend function is the source colour for every row a three-process-component group space with no spot colourants can reach, so four of its five subclauses are satisfied and the fifth is §11.6.2's already-reported gap. ADR 0028."

[[clause]]
clause = "11.7.1"
title = "General"
status = "inapplicable"
note = "One sentence introducing the subclauses below. There is no requirement to implement, and claiming one would put code against a clause that asks for none."

[[clause]]
clause = "11.7.2"
title = "Colour spaces for transparency groups"
status = "reported"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/soft_mask.rs"]
note = "Every compositing computation here happens on the three components of the device raster, so the group blending space this clause governs is device RGB whatever a `/CS` says. Three of its rules are therefore departures rather than gaps, and each is reported where it can change a pixel: a group whose `/CS` is not a three-component RGB space (§11.6.6, 4 corpus documents, all `/DeviceCMYK`), a soft-mask group whose `/CS` is not one either (§11.5.3, 7 documents), and the inheritance rules — a device space taking the nearest CIE-based ancestor's, a non-isolated group taking its nearest isolated ancestor's — which have nothing to inherit into. \"For the compositing computations to work in a device-independent way, the group's colour space should be CIE-based\" is a *should*, and this tree does not: it converts every colour once, into device RGB, which is trap 6's one-conversion rule and the reason the two backends cannot disagree about colour. Annex P's algorithm is the same subject and equally unimplemented."

[[clause]]
clause = "11.7.3"
title = "Spot colours and transparency"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "The clause offers two treatments for a spot colour inside a group — keep a component of its own, or \"be converted to its alternate colour space\" — and this tree always takes the second: a `Separation` or `DeviceN` colour goes through its tint transform into the alternate space at the moment it is read, before anything composites. That is conforming rather than a shortcut, and it makes the clause's one *shall* about soft masks true by construction: \"spot colours shall not be available in a transparency group XObject that is used to define a soft mask; the alternate colour space shall always be substituted in that case.\" What is given up is the first treatment's separation fidelity, which needs a raster per colourant and a device that has them."

[[clause]]
clause = "11.7.4"
title = "Overprinting and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "Aggregate of the five below, and **the ledger's six `silent` rows the eighteenth session opened, closed by reading Table 146 rather than by writing a blend mode**. Four of the five subclauses are satisfied here by derivation: this device's group colour space has three additive *process* components and no spot colourants, and every row of Table 146 that such a space can reach gives the blend function the source colour `C_s`, in all three of its `OP false` / `OP true, OPM 0` / `OP true, OPM 1` columns — which is the Normal blend function, and is what this tree composites through. §11.7.4.5 has the row-by-row working. The fifth, §11.7.4.4, is a gap and is `reported` under §11.6.2. The honest limit is one configuration: Table 146's first row needs the *group* space to be `DeviceCMYK`, which §11.6.6 and §11.7.2 already report as a departure on 4 corpus documents, so overprinting's one visible case here is a gap that is already named. ADR 0028."

[[clause]]
clause = "11.7.4.1"
title = "General"
status = "inapplicable"
note = "One paragraph describing overprinting in the *opaque* imaging model — §8.6.7's parameters — and two NOTEs. It states no requirement of its own, and the paragraph's own subject is settled by §8.6.7 on this device: overprinting deals with device colourants, and NOTE 2 says as much, \"it is best to think of transparency as taking place in appearance space, but overprinting of device colourants in device space\". This device produces no separations. The requirements are in the four subclauses below."

[[clause]]
clause = "11.7.4.2"
title = "Blend modes and overprinting"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause's requirement is what happens *without* the special blend mode, and this tree does it: \"For colour components whose value has not been specified, a source colour value of 1.0 shall be assumed; when objects are fully opaque and the Normal blend mode is used, this shall have the effect of erasing those components. This treatment is consistent with the behaviour of the opaque imaging model with the overprint parameter set to false.\" Every colour here is converted into all three components of the device raster and painted through Normal, so no component of the group space is ever left unspecified and there is nothing to erase. Its second half — that only separable, white-preserving blend modes apply to spot colours, and Normal is substituted otherwise — has no spot colourant to apply to (§8.6.6.4 requires an additive device to substitute the alternate space always), so it is true with nothing to do. The eighteenth session's note for this row quoted a sentence — \"the blend mode shall be replaced by the special overprinting blend mode, disregarding the current blend mode\" — that **is not in the standard**; the sentence it paraphrases is §11.7.4.3's, and that clause says *may*."

[[clause]]
clause = "11.7.4.3"
title = "Compatibility with opaque overprinting"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "This is where the special overprinting blend mode is defined, and the clause's own verb is permissive: \"a PDF processor **may** consider implementing a special blend mode that consults the overprint-related graphics state parameters\". What settles the row is not the permission but the mode's *value* here, which the clause gives in two bullets. The first needs both the current and the group colour space to be `DeviceCMYK`; this device's group space is three additive components, so the second applies: \"In all other cases, the value of B(Cb,Cs) shall be Cs for all colour components specified in the current colour space, otherwise Cb.\" §11.7.3 makes every object paint every *process* component of the group space, so all three are specified and the blend function is `Cs` — Normal. NOTE 2 closes the one route that might have escaped: for \"Separation and DeviceN spaces that revert to their alternate colour space\" the current colour space *is* the alternate, which §8.6.6.4 makes unconditional on an additive device, so a spot colour cannot reach the first bullet either. The implicit non-isolated group the clause asks for when the current blend mode is not Normal is therefore unnecessary by its own NOTE 3."

[[clause]]
clause = "11.7.4.4"
title = "Special path-painting considerations"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
note = "The one requirement of §11.7.4 that is *not* satisfied here, and it is not about overprinting. With overprinting disabled — which is this device's state always — the clause's second bullet applies unconditionally to `B`, `B*`, `b`, `b*` and text rendering modes 2 and 6: \"In all other cases, a non-isolated knockout group shall be established. Within the group, the fill and stroke shall be performed with their respective prevailing alpha constants and the prevailing blend mode. The group results shall then be composited with the backdrop, using an alpha value of 1.0 and the Normal blend mode.\" This tree emits a `Fill` and a `Stroke`, so the band they share composites twice. That is the same gap §11.6.2 owns and is reported on the same condition — the paint composites and both parts mark the page — on 4 corpus documents. Implementing it is §11.4.6's knockout groups, which is where the fix belongs."

[[clause]]
clause = "11.7.4.5"
title = "Summary of overprinting behavior"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::overprinting_changes_nothing_on_a_three_component_device"]
note = "Table 146 is the whole of what an implementation executes, and it collapses on this device. Its nine rows are indexed by the source colour space and by which component *of the group space* is affected; here the group space is device RGB, three process components and no spot colourants. Row by row: the three `spot colourant` rows — the only ones whose `OP true` cells give the backdrop `C_b` — have no component to affect, because there are none. Row 1's `OPM 1` cell, the only other departure from `C_s`, applies to a `C, M, Y, or K` component of the *group* space, which §11.7.4.3's first bullet confirms by requiring both spaces to be `DeviceCMYK`. Row 2 (`DeviceCMYK` source, process component other than CMYK), row 4 (any process space, process component) and row 9 (a group) give `C_s` in all three columns. The `Separation`/`DeviceN` rows are unreachable, since §8.6.6.4 makes such a space revert to its alternate on an additive device and NOTE 2 of §11.7.4.3 says the reverted space is the current one. So `B(C_b,C_s) = C_s` everywhere, which is Normal. NOTE 2's rule that a group reverts to Normal is the same answer arriving for a second reason. What this derivation rests on is that the device has no spot colourants and three process components: a separations-capable device would owe the whole table, and this row is where that would be recorded."

[[clause]]
clause = "11.7.5"
title = "Rendering parameters and transparency"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs"]
note = "Aggregate of the three below: which rendering parameters apply where objects overlap. The halftone and transfer function half describes a marking device this tree does not have; the colour-conversion half is honoured trivially, because a colour is converted once, at the moment it is read, rather than at a group boundary."

[[clause]]
clause = "11.7.5.1"
title = "General"
status = "inapplicable"
note = "Prose dividing the rendering parameters into the two categories the two subclauses below treat. No requirement of its own."

[[clause]]
clause = "11.7.5.2"
title = "Halftone and transfer function"
status = "inapplicable"
code = ["crates/pdf-model/src/content.rs"]
note = "Requires an implementation to track the halftone and transfer function per *region* of the page, since the topmost fully opaque object at each point decides them. Both parameters describe a marking device — §10.5 and §10.6 — and this tree reads neither: `/HT`, `/TR`, `/TR2`, `/BG` and `/UCR` are named in `content.rs` only as the `/ExtGState` entries §8.6.8 forbids an uncoloured figure to set. With nothing to track, the tracking is inapplicable rather than owed. It becomes applicable the day a transfer function is honoured, and this row is where that will be recorded."

[[clause]]
clause = "11.7.5.3"
title = "Rendering intent, black point compensation and colour conversions"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "The clause's subject is *when* a conversion happens: in the transparent model the target may be a group's colour space rather than the device's, so the intent and the black point compensation in force at that moment are the ones that apply. Here every colour is converted to device RGB at the moment it is read, so the parameters in force are always the object's own — which is what the clause asks for, by a route that makes the question unaskable. `/RI` and `/UseBlackPtComp` are read and reach that conversion (§8.6.5.9, ADR 0012). What is not done is the second half: black generation and undercolour removal \"shall be applied only during conversion from DeviceRGB to DeviceCMYK\", which this tree never performs, and the selection of an ICC profile's `A2B` table by intent, which §8.6.5.8 already records."

