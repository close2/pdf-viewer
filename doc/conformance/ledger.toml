note = "The model's vocabulary — object, group, backdrop, shape, opacity, transparency stack — and this tree's display list is that stack: a flat sequence with `Command::Group` as the one nested command (ADR 0026). Alpha is one channel per pixel rather than shape and opacity separately, which §11.2 permits and ADR 0027 argues from `/AIS`: with one number, shape and opacity multiply to the same number."

