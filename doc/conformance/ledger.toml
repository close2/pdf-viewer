[[clause]]
clause = "8.9.3"
title = "Sample representation"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_zero_sample_paints_the_current_colour_and_a_one_leaves_the_page_alone"]
note = "The layout is implemented as stated: a continuous bit stream, high-order bit first, each row starting on a byte boundary with the padding ignored. What is missing is width: only 1- and 8-bit components are unpacked, and 2, 4 and 16 — all legal — are refused with an ImageError rather than guessed at, so an image using one is reported and not drawn."

