note = "\"Portions of an object shall not be composited with one another\" — and `B` and its three relatives paint one object as a `Fill` and a `Stroke`, so the band a centred stroke shares with the fill composited twice. `reported` from the fifteenth session; drawn since the seventy-second, by the construction the clause itself points at: §11.4.6's knockout, where \"at any given point, only the topmost object enclosing the point shall contribute\", the topmost portion being the stroke because `B` strokes second. The pair becomes one `Command::Group` with `knockout` set wherever the report used to fire — the paint composites and both parts mark the page — and keeps the report where a portion's shape is not the coverage it is drawn with, which is `knockout_is_drawable`. 2 of the 4 corpus documents that reported this now draw with nothing reported. The clause's other two examples cost nothing here: a self-intersecting path is filled once under one winding rule, and a mesh shading is one paint. Source colour and backdrop colour are as the clause states them."

