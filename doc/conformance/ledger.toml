note = "Digital signatures — revocation checking at a time in the past, which is what a DSS is for. Nothing in this tree validates a signature. Two things are worth stating once here rather than on every row. First, this is **not** clause 12's interactive half in the sense the others are: a signature's *appearance* is an ordinary widget annotation and is drawn by §12.5 like any other, so a signed document renders correctly and completely; what is missing is the assertion that it has not changed. Second, §7.6.2's signature exception is implemented — `document.rs` exempts a signature dictionary's `/Contents` from decryption, because that value is a digest over the file's own bytes — so the one place signatures touch *rendering* is already right, and it was measured: eight corpus documents carry a signature dictionary, twenty-six carry an `/Encrypt`, and the two sets are disjoint. **Said out loud rather than silently skipped**: `viewer-ui` prints who signed a document and, as its own line, that this program verifies nothing — so a person is told what is not being checked rather than left to assume it was."

[[clause]]
clause = "12.8.4"
title = "Long term validation of signatures"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_documents_own_declaration_can_be_held_against_it"]
note = "Long-term validation, counted rather than parsed. What §12.8.4 is *for* is making a signature checkable after its certificate expires, and what it stores is X.509 material: certificates, \"an array of all Certificate Revocation Lists (CRL) (see Internet RFC 5280 )\" and OCSP responses (RFC 6960). `SecurityStore` says how many of each the document carries and how many signatures have validation information — which is the one thing a program that cannot validate can usefully answer: **whether the document carries what a validator would need**. Parsing any of it is the trust decision §12.8 refuses."

[[clause]]
clause = "12.8.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_documents_own_declaration_can_be_held_against_it"]
note = "The framing, and the reason the counts matter: validation material is stored so that a signature outlives its certificate. Counted, not parsed."

[[clause]]
clause = "12.8.4.2"
title = "Introduction to the document security store (DSS)"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_documents_own_declaration_can_be_held_against_it"]
note = "The introduction to the DSS. Read as §12.8.4.3, which is where its entries are."

[[clause]]
clause = "12.8.4.3"
title = "Document Security Store (DSS)"
status = "implemented"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_documents_own_declaration_can_be_held_against_it"]
note = "Table 261 whole: `/Certs`, `/CRLs`, `/OCSPs` and `/VRI`, each counted. The `/VRI` keys are \"the base-16-encoded (uppercase) SHA-1 digest of the signature to which it applies\", which this reader does not compute — it counts the entries, since what a caller can act on is how many signatures somebody has already validated."

[[clause]]
clause = "12.8.4.4"
title = "Validation-related information (VRI)"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_documents_own_declaration_can_be_held_against_it"]
note = "Table 262's VRI dictionaries, counted per signature. The clause's own sentence is why the count means something rather than nothing: \"[a] signature VRI dictionary shall not be used to record the information used in an unsuccessful validation attempt\", so an entry is a record of a *successful* validation by somebody. The certificates it selects are the DSS's, and reading them is X.509."

[[clause]]
clause = "12.8.4.5"
title = "Usage of the DSS VRI"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_documents_own_declaration_can_be_held_against_it"]
note = "How a validator uses the VRI, which needs the validator. What is read is that the entries exist and for how many signatures."

[[clause]]
clause = "12.8.5"
title = "Document timestamp (DTS) dictionary"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it", "crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "A document timestamp \"is a standard signature dictionary as described in [Table 255]\", so it is read by the same code and told apart by its `/Type`: `Signature::timestamp`. Its `/ByteRange` \"shall cover the entire PDF file\", which `Signature::coverage` checks — the one requirement of this family a program without a trust store can hold a file to. The token itself is an RFC 3161 `TimeStampToken` and is not parsed."

[[clause]]
clause = "12.8.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it"]
note = "The framing — \"[a] document timestamp dictionary establishes the exact contents of the complete PDF file at the time indicated in the timestamp token\" — and the reading of it is Table 255's, with `/Type /DocTimeStamp` as the distinction."

[[clause]]
clause = "12.8.5.2"
title = "Initial document timestamp dictionary"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it", "crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "The initial timestamp: Table 255's dictionary with a token from \"a trusted timestamp authority\", whose byte range \"shall cover the entire PDF file, including the signature dictionary but excluding the Contents value\" — read and checked. The clause also says how a processor finds them, and this reader follows it: \"[t]he existence of one or more document timestamps shall be determined by examining signature fields\", which is the same walk `signatures` does. The token is RFC 3161's and is not parsed."

[[clause]]
clause = "12.8.5.3"
title = "Subsequent document timestamp dictionaries"
status = "partial"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it"]
note = "A later timestamp applied before the previous one's certificate expires, with the material to prove the chain in the DSS — which §12.8.4.3's row counts. Read as another timestamp signature; the *reasoning* about expiry is a validator's."

[[clause]]
clause = "12.8.6"
title = "Permissions"
status = "implemented"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_certification_signature_states_what_may_change_after_it", "crates/pdf-model/tests/signatures.rs::every_signed_corpus_document_says_what_it_signed"]
note = "Table 263's permissions dictionary: `/DocMDP`, whose `/P` level is read through the signature's `/Reference`, and `/UR3`, whose Table 258 rights are read through the same `/Reference` walk since the hundred-and-ninety-eighth session. **This row said such a feature did not exist here and it had since the hundred-and-thirty-fifth**: editing a field and saving the file are two of them, and §12.8.2.3 now names the obligation that follows and how `ViewState::save` meets it. The *granting* half remains out of reach — a usage rights signature enables \"features of a PDF processor that are not available by default\", which is a permission about a *program*, and this one gates nothing. `/DocMDP` is no longer read as a statement only — §12.8.2.2.1's parenthesis makes `/Perms /DocMDP` binding on a processor that modifies, and `ViewState::set_field` obeys it. §12.8.6 makes permissions independent of encryption — they are \"similar to those defined by security handlers … but do not require that the document be encrypted\" — and this reader answers them the same way it answers §7.6's: by saying what the document states. 4 corpus documents state a `/Perms`, all four with `/UR3` and one with a `/DocMDP`."

[[clause]]
clause = "12.8.7"
title = "Legal content attestations"
status = "implemented"
code = ["crates/pdf-model/src/signature.rs"]
test = ["crates/pdf-model/src/signature.rs::a_documents_own_declaration_can_be_held_against_it"]
note = "Table 264's legal attestation dictionary, read — and **checked against the document**. The clause exists because \"[t]he PDF language provides a number of capabilities that can make the rendered appearance of a PDF document vary\", and it asks an author certifying a document to declare how many of them are in it. Ten of those counts are things this reader can count itself, so `Legal::disagreements` names every entry where the author's number and the object graph's differ. It is a question rather than a verdict, and the note says why: the clause states no counting algorithm, and a producer that counts one shared action once where this counts two references is not lying. `/Attestation` is kept as the author's own words. No corpus document states a `/Legal`."

[[clause]]
clause = "12.9"
title = "Measurement properties"
status = "partial"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::the_last_viewport_containing_a_point_is_the_one_that_applies", "crates/pdf-model/src/measurement.rs::the_clauses_own_example_formats_the_string_it_states", "crates/pdf-model/tests/measurement.rs::the_corpus_states_one_viewport_and_it_reads"]
note = "Table 265's viewports and Table 266's measure dictionaries, read whole: a page's `/VP` array, each viewport's `/BBox`, `/Name` and `/Measure`, Table 267's rectilinear entries with their number format arrays, and Table 268's ten entries with the defaults the table states. The rule worth naming is the *selection*: viewports may overlap, the array is \"in drawing order\", and the clause searches it backwards — \"starting with the last one and iterating in reverse, and the first one whose `BBox` entry contains the point shall be chosen\" — so `Viewports::at` iterates in reverse, and a forward search would answer with the background scale inside every inset. A `/BBox` is kept exactly as stated rather than normalised, because Table 265 makes the corner order mean something: it \"shall determine the orientation of the measuring coordinate system\". `partial` because nothing *measures*: the clause exists for a person dragging between two points, and this viewer has no tools — what it can do is the arithmetic, which §12.9.2's row holds."

[[clause]]
clause = "12.9.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::the_last_viewport_containing_a_point_is_the_one_that_applies", "crates/pdf-model/tests/measurement.rs::the_corpus_states_one_viewport_and_it_reads"]
note = "The framing, and its load-bearing sentence is about a viewer rather than a page: users of such documents \"require information about the scale and units of measurement of the corresponding real-world objects and their relationship to units in PDF user space\". The data a measurement needs is read; the tool that would take two points from a person is not built, which is what keeps this `partial`."

[[clause]]
clause = "12.9.2"
title = "Algorithm: Use of a number format array to create a formatted text string"
status = "implemented"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::the_clauses_own_example_formats_the_string_it_states"]
note = "The five steps, in `measurement::format`. A number format array is units in descending granularity and the algorithm carries the *fractional remainder* from each into the next — step e), \"Multiply its C entry by the fractional result from the previous step\" — stopping at step c) when nothing is left over or at step d) when the units run out. Table 268's formatting entries all take part: `/RT` between orders of thousands, `/RD` as the decimal point, `/F` choosing decimal, fraction, round or truncate, `/D` as precision or denominator with its two different defaults, `/FD` keeping a denominator unreduced, and `/PS`, `/SS` and `/O` placing the label. **The clause's own worked example is the test**: 1.4505 miles through the example's own three dictionaries is `1 mi 2,378 ft 7 5/8 in`, and every part of the algorithm is load-bearing in that one string. No corpus document exercises it, which is trap 8 and is why the example matters."

[[clause]]
clause = "12.10"
title = "Geospatial features"
status = "partial"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::a_geospatial_measure_carries_the_earth_model_and_not_a_scale", "crates/pdf-model/tests/measurement.rs::the_corpus_states_one_viewport_and_it_reads"]
note = "Geospatial features, read as data. Table 269's geospatial measure dictionary, Tables 270 and 271's coordinate systems and Table 272's point data are all read; what is not done is the *transformation*, and the reason is that the standard states it by reference to two things outside itself — an EPSG reference code, whose database is \"administered by the International Association of Oil and Gas Producers (OGP)\", and a Well Known Text string, whose format \"is specified in ISO 19162\". Turning a page coordinate into a latitude means a geodesy library and that registry; guessing would produce coordinates that look right and are somewhere else. The one corpus witness — `bug1146106.pdf` — is a `GEO` viewport with a geographic system stated as 145 characters of WKT and four `/GPTS`–`/LPTS` registration points."

[[clause]]
clause = "12.10.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::a_geospatial_measure_carries_the_earth_model_and_not_a_scale"]
note = "The framing: PDF \"is a common delivery mechanism for map and satellite imagery data\", and PDF 2.0 adds a geospatial coordinate system to carry it. Every dictionary the clause introduces is read; the projection is not, for the reason §12.10's row gives."

[[clause]]
clause = "12.10.2"
title = "Geospatial measure dictionary"
status = "partial"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::a_geospatial_measure_carries_the_earth_model_and_not_a_scale"]
note = "Table 269 entire: `/Bounds` with the table's stated default of the whole unit square, `/GCS`, `/DCS`, `/PDU`, `/GPTS`, `/LPTS` and `/PCSM`. Two of the table's sentences are answered rather than stored: `Geospatial::registration` pairs `/GPTS` with `/LPTS`, which the table requires to hold \"the same number of number pairs as the GPTS array\", and `Geospatial::matrix_has_priority` is the table's own precedence — `/PCSM` \"has priority over GPTS\" where it is present, but \"should be ignored\" when `/GCS` is geographic, so the answer needs both entries. `partial` because a registration is not a projection: with a projected `/GCS` the points are eastings and northings, and converting them needs §12.10.3's external references."

[[clause]]
clause = "12.10.3"
title = "Geographic coordinate system dictionary"
status = "implemented"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::a_geospatial_measure_carries_the_earth_model_and_not_a_scale"]
note = "Table 270's three entries. `/EPSG` and `/WKT` exclude each other — each \"shall not be present if\" the other is — and §12.10.3's closing sentence requires one of them, which is `CoordinateSystem::is_stated`. The `/Type` is what tells a geographic system from §12.10.4's projected one, and both are one Rust type because the two tables hold the same entries and differ in meaning. The WKT string is kept and not parsed: its format is ISO 19162's, which is a different standard."

[[clause]]
clause = "12.10.4"
title = "Projected coordinate system dictionary"
status = "implemented"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::a_geospatial_measure_carries_the_earth_model_and_not_a_scale"]
note = "Table 271's three entries, read by the same code as Table 270's for the reason §12.10.3's row gives — the tables are identical in shape. What a projected system *means* is different and is recorded: its `/GPTS` \"contains values in a planar projected coordinate space as eastings and northings\" rather than degrees, and `CoordinateSystem::projected` is what a caller asks to find out which."

[[clause]]
clause = "12.10.5"
title = "Point data dictionary"
status = "implemented"
code = ["crates/pdf-model/src/measurement.rs"]
test = ["crates/pdf-model/src/measurement.rs::a_geospatial_measure_carries_the_earth_model_and_not_a_scale"]
note = "Table 272's point data, from either spelling of `/PtData` — \"a point data dictionary or an array of point data dictionaries\". `/Names` are, in the clause's words, \"in effect, column headers for the array of XPTS values\", so this is read as a table of named columns and tuples. The values are kept as objects rather than as numbers: only `LAT`, `LON` and `ALT` are predefined, and a name the standard does not define carries a type it does not define either."

[[clause]]
clause = "12.11"
title = "Document requirements"
status = "partial"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "The catalog's `/Requirements`: a document naming \"feature(s) of PDF beyond those commonly expected … required for correct handling\". Read in full — Table 273's `/S`, `/V` and `/Penalty`, Table 275's twenty-four types, Table 276's handlers — and `requirements::unmet` names each one this program cannot meet with the reason. What is `partial` is the *acting* on it: §12.11.6 says processing \"shall not continue\" when the requirements cannot be met, and this program draws the document and says what it could not promise. See §12.11.6 for why. **0 of the 974 corpus documents state one.**"

[[clause]]
clause = "12.11.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "Table 273's common entries, with the defaults the clause states: `/Penalty` is 100 unless the file says otherwise, and an absent `/V` means the requirement is judged \"without regard to version number\". A dictionary with no `/S` states no requirement and is dropped, since the entry is required and is the whole content of the statement. Table 274's `/Encrypt` and `/DigSig` are the two type-specific entries; neither is read, because the requirements they belong to are ones this program declares unmet by type alone."

[[clause]]
clause = "12.11.2"
title = "Requirement types"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "Table 275's twenty-four types, each an arm of `requirements::Kind`, and a name outside the table kept as `Kind::Other` because \"[a]dditional requirement types, including ones identifying vendor-specific features, may be registered\". `Kind::unmet` is this program's own answer per type — three met, twenty-one not, each with its reason — and it is **a claim about this tree rather than about the standard**, so it decays exactly as a ledger row does: a session that builds a layer panel has to come back and change `OCInteract`."

[[clause]]
clause = "12.11.3"
title = "Requirement penalty values"
status = "partial"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "`/Penalty` is read and clamped to the clause's [0, 100], with its two ends' meanings recorded: 0 is \"although the document uses this feature the need is optional\" and 100 is \"this document will not produce the author's intent unless the PDF processor can fully support this feature\". **The clause states no threshold** — intermediate values \"are available to weight the value of this feature among other features\" and against \"other documents in the choosing process\" — so there is no computation here to complete, and weighing them is left to a caller that has something to choose between."

[[clause]]
clause = "12.11.4"
title = "Requirement versions"
status = "implemented"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "`/V` in both forms: a name that \"specifies a version number, represented as two or more decimal integers separated by a period\", kept as the name for the reason the clause's NOTE gives; and an extensions dictionary, from which the registered prefix is kept, since the version it states belongs to a developer's extension rather than to PDF."

[[clause]]
clause = "12.11.5"
title = "Requirement handlers"
status = "partial"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "Table 276's alternative requirement handlers, whose whole purpose is to disable an ECMAScript that would otherwise check the same requirement — \"[t]raditionally, requirements handling has been accomplished with an ECMAScript segment\". This program runs no ECMAScript (principle 5), so there is nothing to disable and the `/RH` entry is read by nobody: the clause's `NoOp` handler type describes what this reader does with every requirement it cannot meet."

[[clause]]
clause = "12.11.6"
title = "Requirements processing"
status = "partial"
code = ["crates/pdf-model/src/requirements.rs"]
test = ["crates/pdf-model/src/requirements.rs::a_requirement_states_a_type_a_version_and_a_penalty"]
note = "The processing rule, and the one place this program departs from the clause on purpose. §12.11.6 says that when requirements cannot be met \"then the processing of the document shall not continue\"; this program draws the document and prints what it could not promise. Two reasons, and the first is the clause's own: the computation it refers to is §12.11.3's penalty, for which the standard states no threshold, so \"cannot be met\" is never made decidable. The second is a choice — refusing to open a file a person asked for is a worse failure for a viewer than showing it with its limits named. The clause's own next sentence is what makes that safe: \"[i]f the reader encounters an unsupported feature (whether or not that feature was declared as a requirement), it shall take the normal fallback actions\", and NOTE 1 says \"there is no formal connection between the requirement type and the operation of the associated feature(s)\" — so every feature is still reported where it is used."

