[[clause]]
clause = "12.6.4.11"
title = "Hide actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs", "crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/actions.rs::a_hide_action_stops_an_annotation_being_drawn", "crates/pdf-model/tests/actions.rs::a_show_action_clears_the_flag_the_file_set"]
note = "Hide, in both directions and in all three of Table 214's forms for `/T`: an indirect reference to an annotation, a fully qualified field name resolved through §12.7.4.2, or an array of either. `/H` defaults to true. **This one changes what is drawn** — the clause sets and clears the same Hidden flag §12.5.3 defines, so `/H false` shows an annotation whose own `/F` hides it, which is the half a reader gets wrong by treating the action as a filter laid over the file. The state lives in `ViewState` and not in the document, because this program does not write files. No corpus document states one: the sixty-second session walked every object of all 964 openable documents and found no `/Hide` at all."

[[clause]]
clause = "12.6.4.12"
title = "Named actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/view.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/action.rs::a_named_action_is_one_of_table_215s_four_page_commands", "crates/pdf-model/tests/actions.rs::a_named_action_asks_the_viewer_to_turn_the_page"]
note = "All four of Table 215's names, which are the whole of the table: `NextPage`, `PrevPage`, `FirstPage` and `LastPage`, each an `Action::Named` that reaches the viewer as a `view::Request::Page` and moves it. The movement is `Named::page_from`, clamped at both ends because no document has a page before its first. A name outside the four produces **no action at all** rather than a refusal, because the clause states that case itself — a processor that \"does not recognise the name … shall take no action\" — and the corpus's one instance is a `/Print`, which is a viewer command rather than a page. 3 of the 974 documents write a named action; 8 of their 9 are the four standard names."

[[clause]]
clause = "12.6.4.13"
title = "Set-OCG-state actions"
status = "implemented"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/optional_content.rs"]
test = ["crates/pdf-model/tests/actions.rs::a_set_ocg_state_action_changes_what_the_next_render_draws", "crates/pdf-model/src/view.rs::turning_a_radio_button_group_on_turns_its_siblings_off"]
note = "Set-OCG-state, with Table 217's `/State` processed left to right — each name applying \"to the subsequent groups until the next name is encountered\", a group set as many times as it appears, which is what the clause's EXAMPLE 2 turns on — and `/PreserveRB`, whose default of **true** is what made Table 99's `/RBGroups` load-bearing: a group turned on takes every other member of its radio-button collection off with it. `/RBGroups` had been recorded as unread for the whole project; it is read here and nowhere else, because §8.11.4.5 gives it no part in the *initial* state. **One corpus document states this action**, measured over every object of all 964 openable files."

[[clause]]
clause = "12.6.4.14"
title = "Rendition actions"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "Rendition actions control a media player — a rendition, a screen annotation and a playback state. Principle 5's closed list excludes \"Clause 13, multimedia and 3D — a media engine, not a rendering question\", and this action's whole subject is clause 13's; the clause number is in 12 only because that is where actions live."

[[clause]]
clause = "12.6.4.15"
title = "Transition actions"
status = "partial"
code = ["crates/pdf-model/src/action.rs", "crates/pdf-model/src/navigation.rs", "crates/viewer-ui/src/bin/pdf-viewer.rs"]
test = ["crates/pdf-model/src/action.rs::a_transition_action_carries_table_164s_dictionary"]
note = "**Read** as of the hundred-and-ninth session. Table 219 has exactly two entries and one of them is `/S`, so the action *is* Table 164's transition dictionary — the same one a page's own `/Trans` holds, read by the same function (§12.4.4, ADR 0071's neighbour). What §12.6.4.15 adds is *when*: a processor \"shall normally suspend drawing when such a sequence begins and resume drawing when it ends\", and a transition action in the middle of one says to show the page as the previous action left it. Suspending and resuming is a window's business, so `ViewState::perform` answers `Request::Transition` and the caller decides whether it has a presentation to play; `viewer-ui` names the style and the duration and says it draws the page without animating it. The clause's own effect happens anyway in this program, because every request in a `/Next` chain has already been performed by the time the transition is read. Debt with §12.4.4, which is read and played by nobody. No corpus document states a `/Trans` at all, on a page or in an action — measured over every object of all 964 openable ones."

[[clause]]
clause = "12.6.4.16"
title = "Go-To-3D-View actions"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "Go-To-3D-View sets the view of a 3D annotation, which is §13.6's. Excluded by the same entry as §12.6.4.14."

[[clause]]
clause = "12.6.4.17"
title = "ECMAScript actions"
status = "out-of-scope"
exclusion = "script-behaviour"
note = "ECMAScript actions run a script. Principle 5's closed list excludes \"JavaScript and script-driven form behaviour — a sandboxed script engine is a separate project with its own security argument\". This is the row that exclusion was written for, and the one place in clause 12 where being unimplemented is a decision rather than a debt."

[[clause]]
clause = "12.6.4.18"
title = "Rich-Media-Execute actions"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "Rich-Media-Execute sends a command to a rich media annotation's Flash or 3D content, which is §13.7's. Excluded by the multimedia entry."

[[clause]]
clause = "12.7"
title = "Forms"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs", "crates/pdf-model/src/variable_text.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "The display half of the clause is built and the behaviour half is not, which is the division principle 5's exclusions draw. A field's appearance is constructed where §12.7.4.3 states how — its value, its caption, its quadding, its font — and read from `/AP` otherwise. What a field *does* is absent: no actions, no calculation order, no validation, no submission, and ECMAScript is excluded outright."

[[clause]]
clause = "12.7.1"
title = "General"
status = "inapplicable"
note = "Two definitions and a NOTE warning that an interactive form is not a form XObject. No requirement on a processor."

[[clause]]
clause = "12.7.2"
title = "Interactive Forms"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "The clause states the hierarchy — terminal and non-terminal fields, widgets as children, and the merged single-widget dictionary — and one requirement that reaches a page: 'If such an object defines an appearance stream, the appearance shall be consistent with the object's current value as a field.' That sentence is what Table 224's `/NeedAppearances` admits is false, and it is why `appearance::regenerates` sets a stored stream aside for the two field types whose text §12.7.4.3 has a processor lay out. The merged dictionary is handled by reading a widget and its field from the same dictionary, which is what `Field::read` does when the `/Parent` chain is empty. The hierarchy itself is walked upward only; `/Kids` is never followed downward, because nothing that draws needs to."

[[clause]]
clause = "12.7.3"
title = "Interactive form dictionary"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "Three of Table 224's entries reach the page and the rest do not. `/DR` is the resource dictionary of every appearance constructed here (§12.7.4.3) and of every `/DA` string's font, including a free text annotation's; `/DA` and `/Q` are read as the document-wide defaults the table calls them, after the field's own and its ancestors'; `/NeedAppearances` decides whether a stored appearance is rewritten. `/Fields` is read, though not for drawing: **drawing walks `/Annots`**, which is why this row called the entry unread, and §12.8.1's signature scan walks the field tree from `/Fields` because a signature field need not be on any page. Not read: `/SigFlags` and `/CO`, which are signature and calculation *behaviour*; and `/XFA`, which principle 5 excludes by name."

[[clause]]
clause = "12.7.4"
title = "Field dictionaries"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "Family head. §12.7.4.1's inheritance and §12.7.4.3's variable text are implemented; §12.7.4.2's field names are read nowhere, because nothing that draws needs a field's name."

[[clause]]
clause = "12.7.4.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box"]
note = "Table 226's inheritance is implemented and is what makes a merged widget work: `/FT`, `/Ff` and `/V` are taken from the nearest ancestor that states them, in one walk of the `/Parent` chain rather than one per key. **The clause forbids the bound that walk carries** — 'An interactive PDF processor shall not limit the range of inheritance for field dictionaries' — and it is bounded at 32 anyway, because a `/Parent` chain in a hostile file can be a cycle and principle 3's resource budgets outrank a depth no legitimate form approaches; reaching it is reported rather than read as 'no value'. Table 227's three flags are behaviour: ReadOnly and Required constrain interaction, NoExport constrains submission, and none changes a mark. **A person may now put a value into a field** (`ViewState::set_field`, ADR 0120), which is the fourth statement about one beside Table 226's `/V`, §12.7.6.3's `/DV` and §12.7.8's imported value — applied to every widget of the field, because the clause makes the value the *field's* and §12.7.4.2's name is what identifies it. Nothing is written to the file: `CLAUDE.md` rule 1 makes the document immutable and an edit is a log beside it. **Table 227's ReadOnly is enforced against that edit and against nothing else**, which is the flag's own distinction: 'the user shall not be permitted to change the value of the field', and §12.7.6.3's reset and §12.7.8's import are the document changing its own value rather than a user. `/T`, `/TU` and `/TM` are names, `/Kids` is the hierarchy walked the other way, `/AA` is a trigger, and `/DV` matters only to §12.7.6.3's reset."

[[clause]]
clause = "12.7.4.2"
title = "Field names"
status = "implemented"
code = ["crates/pdf-model/src/view.rs"]
test = ["crates/pdf-model/src/view.rs::a_hide_action_finds_a_field_by_its_fully_qualified_name", "crates/pdf-model/src/view.rs::one_field_name_may_reach_several_widgets"]
note = "A field's partial and fully qualified names, the PERIOD that separates them, and the rule that a dictionary with no `/T` \"shall not be considered a field but simply a Widget annotation\". **This row was `inapplicable` for eighteen sessions and the reasoning was sound and wrong**: names identify a field for export, scripting and the user interface, none of which decides a mark — until §12.6.4.11's hide action names one, and then a field name decides whether an annotation is drawn. `view.rs` builds the whole table from `/AcroForm /Fields`, appending each partial name to its parent's, and a kid with no `/T` joins its parent's name rather than starting one, so one name reaches every widget of its field. The requirement that two fields sharing a fully qualified name share `/FT`, `/V` and `/DV` is on the writer."

[[clause]]
clause = "12.7.4.3"
title = "Variable text"
status = "partial"
code = ["crates/pdf-model/src/variable_text.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::quadding_moves_the_line_within_its_box", "crates/pdf-model/tests/variable_text.rs::a_zero_size_is_auto_sized_until_the_value_fits", "crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest", "crates/pdf-model/tests/saving.rs::a_text_widget_with_no_appearance_stream_is_given_one"]
note = "The clause's operation, both of its forms. Where there is no appearance stream one is written: Table 228's `/DA` is parsed for its `Tf`, its colour and its text state, the font is resolved in `/DR`, the value is measured and positioned by `/Q`, and the marks go inside the `/Tx BMC` … `EMC` pair the clause's EXAMPLE shows. Where there is one, the clause's closing paragraph is a *splice* rather than a rebuild — the region from `/Tx BMC` to the matching `EMC` is replaced and everything outside it survives, with `/DR`'s resources copied in behind the stream's own. A size of 0 is auto-sized and at most one `Tm` is honoured with its translation replaced. **Three things the clause hands back are choices and are recorded as such**: where a baseline sits, how far apart two lines are (13/12 of the size, which is §12.7.5.3's own EXAMPLE), and what auto-sizing picks. **A `/DA` naming a font `/DR` does not define is the writer breaking this clause's own `shall` — 'the specified font value shall match a resource name in the Font entry of the default resource dictionary' — and until the hundred-and-twenty-third session it drew nothing at all**, which on a free text annotation is a blank page: the text *is* the appearance. Since then the value is laid out in a stand-in and the report names the font `/DR` lacked, which is ADR 0106's rule and trap 5's sixth report-and-draw case. The stand-in carries the resource name through as a base font name — a hint, not a derivation, since a resource name is arbitrary — and **declines where it cannot draw the whole value**: `freetext_no_appearance.pdf`'s value is a paragraph of Arabic, and a Latin stand-in drew its spaces and full stops and nothing else. 6 corpus documents write such a `/DA`, 5 of them naming `/Helv`; 2 now draw their fields and 4 keep the blank because the stand-in cannot address their characters. Not implemented: `/DS` and `/RV`, which are XFA rich text and excluded by principle 5; and a composite `/DA` font, which needs a `CMap` inverted and is refused by name. **And a value this program replaced regenerates the appearance whatever Table 224 says**, since the hundred-and-thirty-fifth session: §12.7.2 obliges the *file* to keep its stored stream consistent with its own `/V`, and §12.7.6.3's reset, §12.7.8's import and a person typing all break that consistency at viewing time — the clause's strong form is one line on, for a `RichText` field, \"the entire annotation appearance shall be regenerated each time the value is changed\". Before that, a widget with a stored `/AP` in a document without the flag went on drawing the value it had before the import. No fixture caught it because the fixtures state no `/AP`, which is the path that constructs rather than splices. **And since the hundred-and-forty-fifth session the stream is *written into the file*** by §7.5.6's update, rather than left to the next reader behind Table 224's flag: the clause's \"[t]he new appearance stream becomes the normal appearance ( N ) in the appearance dictionary associated with the field's widget annotation\" is the same sentence whether the stream is built for one render or kept, and the bytes are the ones this program draws. A widget that had no `/AP` gets an object *added*, which §7.5.6's own \"changed, replaced, or deleted\" permits and §7.3.8.1 requires because a stream cannot be direct. `/NeedAppearances` is now written only for the widgets whose stream this program could not produce or could produce only part of. ADRs 0032, 0112, 0120, 0130."

[[clause]]
clause = "12.7.5"
title = "Field types"
status = "partial"
code = ["crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/variable_text.rs::a_check_box_shows_its_caption_only_when_it_is_on"]
note = "Family head. All four field types are recognised and each is taken to whatever §12.7.4.3 can lay out for it: a button's caption, a text field's value, a combo box's selection. A list box and a signature field are the two that state no appearance this tree can build."

[[clause]]
clause = "12.7.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/appearance.rs"]
