status = "partial"
code = ["crates/pdf-model/src/named_page.rs", "crates/pdf-model/src/view.rs", "crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/src/named_page.rs::both_trees_are_read_and_a_template_is_looked_up_first", "crates/pdf-model/src/named_page.rs::a_document_that_breaks_the_clauses_own_rule_is_named", "crates/pdf-model/tests/forms_data.rs::an_imported_template_adds_a_page_the_document_already_held"]
note = "Both name trees read, and the clause's own rule about them checked: a page in `/Pages` \"shall be left in the page tree\", and one in `/Templates` \"shall have an object type of Template rather than Page and shall have no Parent or B entry\" — four invariants, run by `NamedPages::disagreements` for §12.8.7's reason. The clause gives naming a page two purposes and only one of them is in scope: an import-data action adding it, which is §12.7.8.3.3 and is performed — `ViewState::appended_pages` holds what an import added and `Pages::detached` builds a template page without the `/Parent` it is forbidden to have. The other, a script adding it, is on principle 5's closed exclusion list. Measured over all 964 openable corpus documents: 1 names a page, `issue19389.pdf`, with one entry in `/Pages` and no disagreements; none states a `/Templates` tree."

