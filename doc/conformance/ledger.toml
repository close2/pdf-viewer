[[clause]]
clause = "14.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "The clause's own opening sentence is the one that decides how much of it this project owes: \"The features described in this clause do not affect the final appearance of a document.\" That is true of most of it and *false* of the two parts this tree implements, which is why they are implemented — §14.11.5's output intents supply a `DeviceCMYK` destination profile that changes every pixel a CMYK fill covers, and §14.11.2's page boundaries decide what is drawn at all. Everything else here is interchange: metadata, logical structure, tagged PDF, web capture, document parts and associated files. `CLAUDE.md` puts clause 14 in scope \"as far as accessibility needs it\", which is §14.7 and §14.8 rather than these rows."

[[clause]]
clause = "14.2"
title = "Procedure sets"
status = "inapplicable"
note = "Procedure sets, deprecated since PDF 1.4 and stated here only to say what `/ProcSet` was: names of PostScript language procedure sets that \"shall be used only when the content stream is printed to a PostScript language compatible output device\". This is a display, so the entry cannot decide anything — and §7.8.3's resource dictionary row already records that it is read past. Table 346's five names are not consulted; a content stream's operators are implemented by this program, not by a resource it names."

[[clause]]
clause = "14.3"
title = "Metadata"
status = "inapplicable"
note = "Metadata: information about the document as against its content. Nothing here reaches a page. §14.3.2's `/Metadata` streams are XMP and would be read by a viewer that showed document properties, which this is not yet; §14.3.3's information dictionary is deprecated in PDF 2.0 for everything but two dates. The one place metadata is not inapplicable is §14.3.2's `/EncryptMetadata`, which is Table 21's and belongs to §7.6."

[[clause]]
clause = "14.3.1"
title = "General"
status = "inapplicable"
note = "The distinction between document-level and object-level metadata, and nothing else. Both are interchange."

[[clause]]
clause = "14.3.2"
title = "Metadata streams"
status = "partial"
code = ["crates/pdf-syntax/src/document.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs::a_metadata_stream_is_in_the_clear_when_encrypt_metadata_is_false"]
note = "The metadata stream is not parsed — no XMP reaches anything — but its one interaction with clause 7 is implemented: Table 21's /EncryptMetadata false leaves this stream unencrypted in an otherwise encrypted document, so §7.6's handler skips a stream whose /Type is /Metadata. `partial` rather than `unreviewed` for that reason alone."

[[clause]]
clause = "14.3.3"
title = "Document information dictionary"
status = "inapplicable"
note = "Table 349's document information dictionary, reached from the trailer's `/Info`. Deprecated in PDF 2.0 for every entry except `/CreationDate` and `/ModDate`, and read by nothing here: the trailer is parsed and `/Info` is passed over, which §7.5.5's row records from the other side. A viewer with a document-properties panel would read it; this one has no panel."

[[clause]]
clause = "14.3.4"
title = "Reconciling two sources of document metadata"
status = "inapplicable"
note = "How a processor reconciles an XMP stream with the deprecated information dictionary when both are present. A question for a program that *writes* or *displays* metadata, and this one does neither."

[[clause]]
clause = "14.4"
title = "File identifiers"
status = "implemented"
code = ["crates/pdf-syntax/src/document.rs", "crates/pdf-syntax/src/crypt.rs"]
test = ["crates/pdf-syntax/tests/encryption.rs"]
note = "The trailer's `/ID`, \"an array of two byte strings\" — a permanent identifier and a changing one. This tree reads exactly the half §7.6 makes load-bearing: §7.6.4.3.2 step (e) takes \"the first element of the file's file identifier array\" into the file encryption key, so `/ID[0]` decides whether an encrypted document opens at all. The clause's own purpose for the pair — telling whether a reference names the same file and the same version of it — needs a second document to compare against, which nothing here has. §7.5.5's Table 15 carries the rule that makes the encryption use safe: with an `/Encrypt` present the array and both strings \"shall be direct objects and shall be unencrypted\", which is what stops the circularity NOTE 4 describes."

[[clause]]
clause = "14.5"
title = "Page-piece dictionaries"
status = "inapplicable"
note = "Page-piece dictionaries: `/PieceInfo` on a page, a form XObject or the catalog, holding \"private PDF processor data\" keyed by the name of the processor that wrote it. Table 351's `/LastModified` and `/Private` are for the producer to recognise its own work; the clause says outright that such data \"can be ignored by general-purpose PDF processors\". Nothing here writes a PDF, so there is no private data to recognise."

[[clause]]
clause = "14.6"
title = "Marked content"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/optional_content.rs"]
note = "Marked content as a *bracket*, which is all this tree needs of it and is genuinely two things. §8.11.3.3's optional content rides on `BDC`/`EMC`, so the stack has to be maintained exactly; and §12.7.4.3's regeneration has to find the `EMC` matching a `/Tx BMC`, which is the same nesting rule read as an algorithm. What is *not* read is any tag's meaning — a marked-content sequence's `/Tag` is not rolemapped and, as NOTE 3 says, has \"no relationship to Tagged PDF\". `partial` for the semantics of §14.7 and §14.8 that a tag can carry."

[[clause]]
clause = "14.6.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/appearance.rs"]
test = ["crates/pdf-model/tests/optional_content.rs::a_marked_section_belonging_to_a_group_that_is_off_is_not_drawn", "crates/pdf-model/tests/variable_text.rs::need_appearances_rewrites_the_marked_content_region_and_keeps_the_rest"]
note = "Marked content is read for two things and interpreted for neither's semantics. `BDC`/`BMC`/`EMC` maintain the stack §8.11.3.2's optional content needs, which is where the nesting rule 'shall be properly (separately) nested' becomes load-bearing; and §12.7.4.3's splice has to find the `EMC` *matching* a `/Tx BMC`, which is the same rule read as an algorithm — `appearance::spliced` counts depth over `BMC`, `BDC` and `EMC` rather than taking the first `EMC` it meets. `MP` and `DP` are matched and ignored: a point of marked content carries no marks. Nothing here reads a tag's meaning, which is §14.7's structure and §14.8's tagged PDF."

[[clause]]
clause = "14.6.2"
title = "Property lists"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::an_inline_property_lists_booleans_are_not_operators"]
note = "The clause decides which form a producer may use by what the list holds: values that are all direct objects \"may be written inline in the content stream as a direct object\", and a list with an indirect reference in it \"shall be defined as a named resource in the Properties subdictionary\". `content.rs` takes both forms — **the inline one only since the fifty-fifth session; this row claimed both for fifteen sessions while the content lexer flattened an inline dictionary into loose tokens**, which is how two corpus documents came to report `true` and `false` as unknown operators. A name that `/Properties` does not define is *reported* — a name that `/Properties` does not define is *reported*, since it is the route an `/OC` membership dictionary arrives by and drawing hidden content silently is the failure §8.11 exists to prevent. NOTE 2's consequence is worth carrying because it explains the shape of the whole interpreter: \"indirect references of the form of 10 0 R can never occur within content streams\", which is why the content lexer resolves nothing and the resource dictionary is the only door out. `partial` because the property list's *contents* are read for optional content, for §14.7.5.2's `/MCID` and for §14.9's four accessibility entries, and nothing else; §14.3.2's object-level metadata in one is not."

[[clause]]
clause = "14.7"
title = "Logical structure"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::the_structure_tree_reads_its_children_and_maps_their_roles"]
note = "Logical structure: a tree of elements over the content of a document, saying that this run of glyphs is a heading and that one a table cell. **This is the half of clause 14 `CLAUDE.md` puts in scope** — \"tagged PDF as far as accessibility needs it\". The tree is read in both directions (§14.7.2, §14.7.5.4), its types are role mapped in both of the standard's two systems (§14.7.3, §14.8.6.2), its content items are read in all three forms (§14.7.5.1.1), and its attributes and namespaces are read (§14.7.6, §14.7.4). **This row said \"none of it is read\" for two sessions after the seventy-eighth built the tree**, which is the understatement a ledger has no gate against. What is still owed is a *consumer*: nothing in this program hands a structure tree to anybody, and §14.8's vocabulary — what the types and attributes mean — is unread."


[[clause]]
clause = "14.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/src/structure.rs::a_marked_content_identifier_finds_its_element"]
note = "The framing, and the sentence that decides how much of §14.6 has to work first: logical structure \"is independent of the content stream\" but is *attached* to it through marked-content sequences (§14.7.5.2), whose bracketing `content.rs` maintains — for optional content, for §12.7.4.3's splice, and for the `/MCID` that reaches this tree. Both halves exist: the mechanism and the tree."


[[clause]]
clause = "14.7.2"
title = "Structure hierarchy"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::the_structure_tree_reads_its_children_and_maps_their_roles", "crates/pdf-model/src/structure.rs::a_structure_tree_that_points_at_itself_terminates"]
note = "Table 354's `/StructTreeRoot` and Table 355's structure elements are read since the seventy-eighth session: `structure::Tree` walks `/K` from the root, and the root and an element are one function because both tables give `/K` the same meaning — \"[t]he K entry shall specify the immediate children of the structure tree root, which shall be structure elements\". Walked on demand rather than built, because a tagged document has an element per paragraph and nothing here needs all of them at once; the walk is bounded on depth and on fan-out, since `/K` is a reference a document controls and a cycle is reachable. A dictionary with no `/Type` is an element, which Table 355 states outright. `/ParentTree` is §14.7.5.4's and older. Unread: `/IDTree`, which maps `/ID` strings to elements and needs a consumer that names one; `/ParentTreeNextKey`, which addresses a writer; `/Namespaces` (§14.7.4); `/PronunciationLexicon`, which is §14.9.6's text-to-speech hint; and `/AF` (§14.13). `partial` for those and for the same reason Table 99's layer-panel half is: **the data is this crate's and the consumer is not** — nothing in this program yet hands a structure tree to anybody."

[[clause]]
clause = "14.7.3"
title = "Structure types"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::the_structure_tree_reads_its_children_and_maps_their_roles"]
note = "An element's `/S` is read, and `Tree::role` maps it through §14.7.3's `/RoleMap` — \"[w]here names other than the standard ones are used, a role map should be provided in the structure tree root using the RoleMap entry\" — transitively, because a role map may name a type that is itself mapped, and bounded, because it may name itself. An element with no `/S` answers nothing rather than a guess: Table 355 requires the entry, and inventing a type would be a fallback that fills the page in another clause's clothing. `partial`: the `/RoleMapNS` half of the same sentence is §14.7.4's namespaces, which are unread, and nothing checks a mapped name against §14.8.4's standard set."

[[clause]]
clause = "14.7.4"
title = "Namespaces"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_namespaces_own_role_map_is_the_one_that_applies"]
note = "Namespaces (PDF 2.0), which qualify a structure type so that a document may mix vocabularies. Read in both places they are used: `structure::Namespace` is Table 356's dictionary, `Tree::namespace` answers which namespace an element is in, and `Tree::role` maps a type through the namespace's own `/RoleMapNS` — which is §14.8.6.2's rule and not §14.7.3's."


[[clause]]
clause = "14.7.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_role_map_may_lead_into_another_namespace"]
note = "The framing. New in PDF 2.0 and the reason §14.7.3's role map is no longer the only indirection between a document's type names and the standard's: an element states `/NS`, and the map that applies is that namespace's."


[[clause]]
clause = "14.7.4.2"
title = "Namespace dictionary"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_role_map_may_lead_into_another_namespace"]
note = "Table 356's namespace dictionary: `/NS` the identifying name, `/Schema`, `/RoleMapNS`. Two of the three are used — the name identifies the namespace and the role map is followed, including its second form, \"an array where the first value shall be a structure element type name in a target namespace with the second value being an indirect reference to the target namespace dictionary\", which is how one vocabulary maps into another. `/Schema` is read and not fetched: it is a §7.11 file specification, which this reader has no filesystem to open, and NOTE 2 states no required format for it. The name is **not** parsed as a URI, because NOTE 1 says it is \"used for uniqueness\" and \"[i]t is not generally expected that a URI for a namespace name will resolve\"."


[[clause]]
clause = "14.7.5"
title = "Structure content"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::the_structure_tree_reads_its_children_and_maps_their_roles"]
note = "How an element points at the marks on a page, in both directions and in every form the subclauses define: §14.7.5.1.1's three kinds of content item, §14.7.5.2's marked-content sequences, §14.7.5.3's object references and §14.7.5.4's parent tree. See each."


[[clause]]
clause = "14.7.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::the_structure_tree_reads_its_children_and_maps_their_roles"]
note = "The framing: content items \"exist in the document independently of the structure tree but are associated with structure elements\", which is what makes `structure::Child` an enum over the forms rather than a type of its own. §14.7.5.1.1 is where the forms are."


[[clause]]
clause = "14.7.5.1.1"
title = "Content items"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::the_structure_tree_reads_its_children_and_maps_their_roles"]
note = "The two kinds the clause names — marked-content sequences and complete PDF objects — and the three forms they take in a `/K`: a bare integer, Table 357's marked-content reference and Table 358's object reference, each read into `structure::Child`. The clause's restriction is what makes that an enum rather than a recursive type: \"[c]ontent items shall be leaf nodes of the structure tree\". A bare integer takes its page from the element's `/Pg`, which Table 355 requires for exactly that case, and a reference dictionary's own `/Pg` overrides it."

[[clause]]
clause = "14.7.5.2"
title = "Marked-content sequences as content items"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/src/structure.rs::a_marked_content_identifier_finds_its_element", "crates/pdf-model/tests/accessibility.rs::a_structure_element_supplies_the_language_of_its_sequence"]
note = "`BDC` with an `/MCID` in its property list, matched to a structure element by that identifier — `content.rs` reads the identifier as the property list is opened, which is where §8.11.3.3's `/OC` already arrives, and `ParentTree::element` is the match. Table 357's marked-content reference is the other direction and is `structure::Child::MarkedContent`, whose `/Pg` may move the sequence to another page."


[[clause]]
clause = "14.7.5.3"
title = "PDF objects as content items"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::the_structure_tree_reads_its_children_and_maps_their_roles"]
note = "Table 358's object reference dictionary, naming an annotation or an XObject as the content of an element: `/Obj` is the object and `/Pg` the page, and both are read into `structure::Child::Object` with the element's own `/Pg` as the default. What such an item *is* for is the annotation's place in the reading order, which needs the consumer §14.7 owes."


[[clause]]
clause = "14.7.5.4"
title = "Finding structure elements from content items"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_marked_content_identifier_finds_its_element", "crates/pdf-model/tests/structure.rs::a_page_that_states_a_structural_parent_key_resolves_it"]
note = "The last of the four rows the ledger found waiting on one data structure, and the fourth to close on it (ADR 0053). Both hops the clause states are read: the page's `/StructParents` is the key into the structure tree root's `/ParentTree` number tree, and the marked-content identifier is \"a zero-based index into the array\" that comes back — with §14.7.5.3's single-element form accepted too, since an *object* content item's entry is one reference rather than an array. The consumer is §14.9.4's replacement text on a structure element, which 8 corpus documents state on page one. 89 documents have a `/StructTreeRoot`, 76 key the parent tree from page one and 75 name an element; the one that names none states an empty array for its key, which is a document saying its first page belongs to no element and is asserted as that rather than counted."

[[clause]]
clause = "14.7.6"
title = "Structure attributes"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attribute_is_found_through_a_class_and_overridden_by_the_elements_own"]
note = "Layout, list, table and printer's-mark properties hung on an element, read through both routes the clause gives — the element's own `/A` and §14.7.6.2's `/ClassMap` — with both of its precedence rules applied. What an attribute *means* is §14.8.5's and is not read; what is here is which attribute objects are attached and which one wins."


[[clause]]
clause = "14.7.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attribute_is_found_through_a_class_and_overridden_by_the_elements_own"]
note = "Table 360's attribute object dictionaries and the `/O` owner that says which vocabulary an attribute belongs to, with PDF 2.0's `/NS` for an owner that is a namespace. `AttributeObject::get` refuses those two entries and answers every other, because the clause draws exactly that line: \"[o]ther entries, except the NS entry, shall represent the attributes\". An object with no `/O` is refused — a set of attributes whose vocabulary nobody named cannot be interpreted, and Table 360 makes the entry required."


[[clause]]
clause = "14.7.6.2"
title = "Attribute classes"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attribute_is_found_through_a_class_and_overridden_by_the_elements_own"]
note = "`/ClassMap` in the structure tree root, so that a set of attributes can be named once and referred to by many elements: an element's `/C` names classes, each class names an attribute object or an array of them, and both forms are read. The precedence rule is the clause's own — \"[i]f both the A and C entries are present and a given attribute is specified by both, the one specified by the A entry shall take precedence\" — which is why `Tree::attributes` returns the classes first and the element's own after them."


[[clause]]
clause = "14.7.6.3"
title = "Attribute revision numbers"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attribute_is_found_through_a_class_and_overridden_by_the_elements_own"]
note = "Deprecated with PDF 2.0, and **read because it is what makes the `/A` and `/C` arrays parseable**: a revision is \"the second (when present)\" element of a pair inside the same array, so a reader that did not know about it would take an integer for an attribute object. NOTE 3 states that reasoning outright — \"since an attribute object reference is distinct from an integer, that distinction is used to determine whether the attribute object is represented in the array by a single or a pair of entries\". The number itself is a *validity* mechanism for a processor that edits, which this is not; it is carried on `AttributeObject::revision` and used by nothing."


[[clause]]
clause = "14.7.6.4"
title = "User properties"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::user_properties_are_read_with_their_formatting_and_their_hidden_flag"]
note = "Table 361's `/O /UserProperties` and Table 362's `/N`, `/V`, `/F` and `/H`, read as `structure::UserProperty`. The value is kept as the object the file wrote, because the clause tells a processor what to do with the types it does not display — \"they should not treat other values as errors\" — and a reader that coerced everything to a string would have decided that for the consumer. `/F` is kept beside `/V` rather than replacing it, which is the point of the example the clause gives: \"($123.45)\" for the number -123.45."


[[clause]]
clause = "14.7.7"
title = "Example of logical structure"
status = "silent"
note = "A worked example of a structure tree. Nothing normative; recorded so that the family has no gap in it."

[[clause]]
clause = "14.8"
title = "Tagged PDF"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_document_says_it_is_tagged_in_its_mark_information_dictionary"]
note = "Tagged PDF: \"a stylised use of PDF that builds on the logical structure framework described in 14.7\". Of its sixty rows, what is read is the whole of §14.8.4's vocabulary, §14.8.2's artifacts and reversed show strings, §14.8.6's namespaces, and this row's own mark information dictionary. What is left is §14.8.5's attributes — what a `/BBox` or a `/ColSpan` *says* — and §14.8.2.5's ordering, which is a question for a consumer that walks the tree rather than for the reader that builds it."


[[clause]]
clause = "14.8.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_document_says_it_is_tagged_in_its_mark_information_dictionary"]
note = "What a tagged PDF is, and the one requirement stated here rather than in a table: \"A tagged PDF document shall contain a mark information dictionary … with a value of true for the Marked entry.\" `structure::MarkInfo` reads Table 353's three flags, and the distinction it makes is real rather than technical — a document may have a structure tree without claiming to follow §14.8's rules, and `/Marked` is the claim. `/Suspects` is read and deprecated in PDF 2.0; `/UserProperties` is a hint the clause states as one, since `Tree::attributes` finds them either way."


[[clause]]
clause = "14.8.2"
title = "Tagged PDF and page content"
status = "partial"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_artifact_is_recorded_over_its_own_range_and_left_in_the_text"]
note = "What tagged PDF adds to a *page*, as opposed to what §14.7 adds to a document. Of the twelve rows below, the two that decide what `text_extraction.rs` produces are read as of the eighty-third session: §14.8.2.2's artifacts, recorded as spans over the readback, and §14.8.2.5.3's `ReversedChars`, which reverses a show string before it is extracted. What is left is the reading-order half, which needs a consumer of the structure tree rather than a change here."


[[clause]]
clause = "14.8.2.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::a_reversed_chars_sequence_is_read_back_forwards"]
note = "The six rules the rest of the family states, listed. Four are read: artifacts against real content (§14.8.2.2), an unambiguous Unicode mapping (§14.8.2.6.1, through §9.10.2's three methods), word breaks as characters rather than as gaps where a file states them (§14.8.2.6.2), and §14.9's four accessibility entries, which are done (ADR 0063). The two that are not are about *order* — that page content order should coincide with logical content order, and that the logical order be derivable — and both are questions for a consumer that walks the structure tree, which nothing in this program does yet."


[[clause]]
clause = "14.8.2.2"
title = "Real content and Artifacts"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_artifact_is_recorded_over_its_own_range_and_left_in_the_text"]
note = "The division of a page into real content and artifacts, in both of the forms §14.8.2.2.2 gives it. See the two below."


[[clause]]
clause = "14.8.2.2.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_artifact_is_recorded_over_its_own_range_and_left_in_the_text"]
note = "The definition, and what a reader is *permitted* rather than required to do with it: \"[a] text-to-speech engine, for instance, may decide not to speak running heads or page numbers\", and NOTE 3 says the purpose of tagged PDF \"is not to prescribe what the PDF processor does, but to provide sufficient declarative and descriptive information to allow it to make appropriate choices\". So `Interpretation::artifacts` names the ranges and **removes none of them**: dropping an artifact from the text would be this crate making the consumer's choice. What is not implemented is the clause's other test — \"[a]ny content that is not included in the structure tree is an artifact even when not enclosed in a marked-content sequence using the tag Artifact\" — which needs the whole structure tree walked per page and a consumer that would use the answer."


[[clause]]
clause = "14.8.2.2.2"
title = "Specification of Artifacts"
status = "partial"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_artifact_is_recorded_over_its_own_range_and_left_in_the_text"]
note = "Both marked-content forms are read — EXAMPLE 1's `/Artifact BMC` generic artifact and EXAMPLE 2's `/Artifact <<propertyList>> BDC` — with the whole of Table 363: `/Type`'s four kinds, `/Subtype`, `/BBox` and `/Attached`'s four edges. **Reading it found a parser gap**: an inline property list's *array* values were recognised as brackets and discarded, on a comment saying no entry this tree reads is an array, and `/BBox` and `/Attached` both are. 30 of the 953 corpus first pages mark at least one artifact. What is left is the third form, the `Artifact` structure element type (§14.8.4.8.7), which is a type in §14.8.4's vocabulary rather than a mark in a content stream."


[[clause]]
clause = "14.8.2.3"
title = "Soft hyphens"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs::the_text_we_draw_agrees_with_an_independent_extractor"]
note = "A soft hyphen — the one a line break introduced — \"may be represented as a soft hyphen, mapped to the Unicode value U+00AD\", and a writer \"shall distinguish explicitly between soft and hard hyphens\". The reader's half is that a character mapping to U+00AD arrives in the readback as U+00AD and is not turned into a hyphen-minus: §9.10.2's mapping is what produces it and nothing here rewrites it. What is *not* done is the repurposing decision the distinction exists for — removing a soft hyphen when text is rejoined into a line — which belongs to a consumer, and the clause's NOTE 2 warns that in some languages \"hyphenation can change the spelling of words\", where the answer is §14.9.4's `/ActualText` and not a rule about the character."


[[clause]]
clause = "14.8.2.4"
title = "Hidden or invisible page content"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::mode_3_paints_nothing_and_still_extracts_its_text"]
note = "One rule, and this tree already satisfies it: \"page content shall be considered to include all graphics objects in their entirety, regardless of whether they are visible when the document is displayed or printed.\" Text in rendering mode 3 is invisible and is still extracted here — which the oracle records from the other side, in the entry about a page of invisible text over a scanned image that reads back plenty of words and marks the page with no glyph. The NOTE gives the reason and it is this project's own: \"invisible elements can become visible when content is repurposed, or a text-to-speech engine could choose to speak invisible text\"."

[[clause]]
clause = "14.8.2.5"
title = "Page content order and logical content order"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/logical_order.rs::the_logical_order_reorders_what_the_stream_showed", "crates/pdf-model/tests/logical_order.rs::the_two_orders_of_a_tagged_page_mostly_coincide"]
note = "Both orders, and the mapping between them. Page content order is the interpreter's own — \"the sequencing of graphics objects within a page's content stream\" — and `Interpretation::marked` records, per `BDC` … `EMC` carrying an `/MCID`, the range of the readback that sequence covered. `Tree::logical_order` is the other one: \"a depth-first traversal of the document's logical structure hierarchy\", filtered to one page, and `Tree::logical_text` is the page's text put through it. Measured over the corpus: 89 documents have a structure tree, 77 mark content on page one, and the two orders coincide on 72 of those 77 — the clause says they \"should\", and five producers disagree, among them a tax form whose logical order starts with its title and whose stream starts with a margin note."

[[clause]]
clause = "14.8.2.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/logical_order.rs::the_logical_order_reorders_what_the_stream_showed", "crates/pdf-model/tests/logical_order.rs::the_two_orders_of_a_tagged_page_mostly_coincide"]
note = "The two definitions, both executed, and the clause's own exclusion applied: only structure elements are part of the logical content order, so `Tree::logical_text` leaves out every marked-content sequence the tree does not reach — 3 across the corpus — and NOTE 3 states the case that would otherwise be tempting, that \"[a]rtifacts not contained within an Artifact structure element are not considered part of the logical content order\". Nothing reorders what is *drawn*: the two orders are two readings of one page, and the display list is the stream's."

[[clause]]
clause = "14.8.2.5.2"
title = "Sequencing of annotations"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/tests/logical_order.rs::the_two_orders_of_a_tagged_page_mostly_coincide"]
note = "An annotation \"is not interleaved within the page's content stream but [is] listed in the Annots array\", and \"[t]he position of an annotation in the logical content order is determined from the document's logical structure\" — which is §14.7.5.3's object reference, already read as `Child::Object`. `Tree::logical_order` therefore returns annotations *in place* among the marked-content sequences, which is the whole of what this subclause asks a reader to do; 295 annotations across the corpus's tagged first pages are placed that way. `Tree::logical_text` deliberately leaves them out of the string, because an annotation's text is its own `/Contents` or its field's value rather than a range of the page's readback."

[[clause]]
clause = "14.8.2.5.3"
title = "Reverse-order show strings"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::a_reversed_chars_sequence_is_read_back_forwards", "crates/pdf-model/tests/accessibility.rs::the_same_strings_outside_the_tag_are_not_reversed"]
note = "`/ReversedChars`, a marked-content tag saying that the show strings inside it hold their characters in reverse — for right-to-left text set with a font whose glyphs run left to right. \"[T]he sequence of the characters as found in the show string operator shall be reversed before using them. If the sequence encompasses multiple show strings, only the individual characters within each string shall be reversed\", so the readback is reversed per string and per *code* rather than per `char`: a ligature whose `/ToUnicode` says `fi` would come back as `if` from a character-wise reversal. The inferred word breaks are suppressed inside such a string, because the clause states that a break there is a SPACE the file wrote \"at the beginning or end\" rather than a gap a reader measures. **No corpus document writes the tag** — measured over all 953 openable first pages — so the seven right-to-left documents on the text gate's list are painted in visual order and are not this clause. The clause's own EXAMPLE is the test."


[[clause]]
clause = "14.8.2.6"
title = "Unicode mapping in tagged PDF"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/logical_order.rs::the_two_orders_of_a_tagged_page_mostly_coincide"]
note = "The family: every character code in a tagged document should map to Unicode, and word breaks should be in the character stream. The first is §9.10.2's machinery, which this tree implements in full and which its own row records; the second is §14.8.2.6.2's, where the requirement is on the *document* and this reader infers what a document did not state. `partial` for that inference, which is measured rather than assumed."

[[clause]]
clause = "14.8.2.6.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs::the_text_we_draw_agrees_with_an_independent_extractor"]
note = "\"Every character code that belongs to a structure element in the structure tree shall map to Unicode\", by §9.10.2's three methods — which this tree implements in full and in the clause's stated priority, and which is the whole of what a *reader* can do here. What is not read is the exception this clause adds: \"except where an associated Alt or ActualText entry applies\", which is §14.9.3's and §14.9.4's row. The clause's advice about the private use area is a writer's."

[[clause]]
clause = "14.8.2.6.2"
title = "Identifying word breaks"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/logical_order.rs::the_two_orders_of_a_tagged_page_mostly_coincide"]
note = "What the clause asks of a *reader* is done, and what it asks of a *document* is measured. A reader \"may find words by sequentially examining the Unicode character stream\", and the division into show strings \"shall have no semantic significance\" — so nothing here treats a `Tj` boundary as a word boundary, and the readback is one string. What a conforming tagged document owes is the white space itself: \"any white-space characters that would be present to separate words in a pure text representation shall be present in the tagged PDF representation of the text\", whose NOTE 1 then says a processor \"can determine word breaks without having to rely on heuristics based on information such as glyph positioning on the page\". **This reader relies on them anyway, and now counts how often**: `Interpretation::inferred_separators` is the number of separators reconstructed from position, and over the corpus's 77 tagged first pages it is 2392 — only 20 of the 77 need none. So the heuristic is not a departure from the clause but a defence against documents that claim to follow it and do not; removing it would empty the readback of most of its word breaks on 57 of 77 tagged pages."

[[clause]]
clause = "14.8.3"
title = "Basic layout model"
status = "inapplicable"
note = "Aggregate of the three below. The basic layout model is the vocabulary §14.8.5's layout attributes are defined against — reference areas, block and inline progression directions — and it exists so that a processor *reflowing* a document knows what the attributes mean. This program lays nothing out: it draws the page the file describes, at the positions the file states."

[[clause]]
clause = "14.8.3.1"
title = "General"
status = "inapplicable"
note = "The model: content laid out in reference areas, each with a writing direction, block and inline progression. Every term here is an input to reflow, which §14.8.1's NOTE lists as one of tagged PDF's five uses and which is not one this program has."

[[clause]]
clause = "14.8.3.2"
title = "Reference area"
status = "inapplicable"
note = "A reference area is the rectangle a block-level element is laid out in. Read as a definition; nothing here computes one, because nothing here decides where content goes."

[[clause]]
clause = "14.8.3.3"
title = "Progression direction"
status = "inapplicable"
note = "Progression direction — inline and block — for the four writing modes. The one place a *rendering* question hides nearby is §9.7's vertical writing, which is implemented from §9.2.4's metrics rather than from this model, and the two must not be confused: `/W2` places glyphs, this places blocks."

[[clause]]
clause = "14.8.4"
title = "Standard structure types"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "The standard structure types: forty-one names in `structure::StandardType`, which is what `Tree::standard_role` answers after §14.7.3's and §14.8.6.2's role mapping. Every subclause's table is read; what is `partial` is that **nothing does anything with a type yet** — the vocabulary is here and the consumer is not, which is the same debt §14.7 carries. Annex L's nesting rules are not checked, and are a validator's job rather than a reader's."


[[clause]]
clause = "14.8.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_contextual_type_takes_its_category_from_its_parent"]
note = "The four categories, and the rule for a type that is in more than one: \"[i]f the structure element is used inside a block level element, it is an inline level structure element. In all other cases it is a block level structure element.\" `Category::of` is that sentence, taking the parent's category from a caller walking the tree — because this crate walks `/K` on demand and keeps no ancestry. `Category::Internal` is the fifth answer the clause gives without calling it a level: `LI` is \"[i]nternal to L (List) structure elements\" and `TR` \"[i]nternal to a Table structure\", which is a statement about where an element may appear rather than about what it may contain."


[[clause]]
clause = "14.8.4.2"
title = "Nesting of standard structure elements"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_mapped_role_reads_as_its_standard_type"]
note = "Nesting. The clause defers the rules themselves to Annex L and this reader checks none of them: a nesting rule is a statement about whether a *document* is well formed, and nothing here validates documents — the same position §7.11.2.1's path rules and §7.12.4's version ordering are recorded in. What is implemented is the sentence this row shares with §14.8.4.1: a non-standard type nests \"according to the requirements of the structure elements to which they are role mapped\", which is what makes `standard_role` the question a consumer asks rather than `role`."


[[clause]]
clause = "14.8.4.3"
title = "Document level structure types"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Document` and `DocumentFragment`, the two document level types, both read. `DocumentFragment` is one of the eight PDF 2.0 additions `StandardType::since_pdf_2_0` names, which matters because §14.8.6.1's default namespace is PDF 1.7's and cannot mean it."


[[clause]]
clause = "14.8.4.4"
title = "Grouping level structure types"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Part`, `Sect`, `Div`, `Aside` and `NonStruct`, the grouping level types. `Aside` is PDF 2.0's."


[[clause]]
clause = "14.8.4.5"
title = "Block level structure types"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`P`, `H`, `Hn`, `Title` and `FENote`. `Hn` is the one entry that is a *family* rather than a name — Table 372 writes it as `H n` \"with n being a sequence of digits representing an unsigned integer greater than or equal to 1\" — so it is matched before the table and `H17` is as standard as `H1`, while `H0` is not. `Title` and `FENote` are PDF 2.0's and are contextual: the clause gives them two and three categories respectively."


[[clause]]
clause = "14.8.4.6"
title = "Sub-block level structure type"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Sub`, PDF 2.0's sub-block level type, \"a sub-division inside a block level\" element. One row, one name, inline."


[[clause]]
clause = "14.8.4.7"
title = "Inline level structure types"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "The inline level types. See the three below."


[[clause]]
clause = "14.8.4.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "The framing: inline types \"enable structural organisation of content inside block level elements\", which `Category::Inline` is."


[[clause]]
clause = "14.8.4.7.2"
title = "General inline level structure types"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Lbl`, `Span`, `Em`, `Strong`, `Link`, `Annot` and `Form`. `Em` and `Strong` are PDF 2.0's; the last three are contextual, being \"Grouping, Block or Inline\" depending on what they enclose, and each is an *association* between content and an annotation or field rather than a description of the content."


[[clause]]
clause = "14.8.4.7.3"
title = "Ruby and warichu elements"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Ruby`, `RB`, `RT` and `RP`, the ruby assembly's four types, all inline. `RP` is the one with a condition on its use — punctuation \"used only when a PDF processor cannot place the ruby annotation text adjacent to the ruby base text\" — which is a producer's decision and changes nothing a reader does with the type. **This clause number appears twice in `doc/md/`**, once here and once in an annex; the citation checker finds the first, which is this one."


[[clause]]
clause = "14.8.4.7.4"
title = "Ruby and warichu elements"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Warichu`, `WT` and `WP`, the warichu assembly's three types, all inline."


[[clause]]
clause = "14.8.4.8"
title = "Other structure types"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "The other structure types: lists, tables, captions, figures, formulae and the `Artifact` element. See the seven below."


[[clause]]
clause = "14.8.4.8.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "The framing for the types that are neither a level nor an inline: they are structures of their own with internal parts, which is what `Category::Internal` records."


[[clause]]
clause = "14.8.4.8.2"
title = "Standard structure types for lists"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`L`, `LI` and `LBody`. `L` is contextual — block or inline — and the other two are internal to it, which is the clause's own wording rather than a category: `LI` is \"[i]nternal to L (List) structure elements\"."


[[clause]]
clause = "14.8.4.8.3"
title = "Table structure types"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Table`, `TR`, `TH`, `TD`, `THead`, `TBody` and `TFoot`. `Table` is block level and the other six are internal to it. The attributes that make a table *readable* — `/Headers`, `/Scope`, `/RowSpan`, `/ColSpan` — are §14.8.5's and are unread as data, which is where the remaining work in this family is."


[[clause]]
clause = "14.8.4.8.4"
title = "Caption structure type"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Caption`, grouping or block, \"[f]or lists and tables\" and for figures and formulae."


[[clause]]
clause = "14.8.4.8.5"
title = "Figure structure type"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Figure`, which encloses graphical content and is contextual. Its `/BBox` and `/Alt` are §14.8.5's and §14.9.3's respectively; the second is read (ADR 0063) and the first is not."


[[clause]]
clause = "14.8.4.8.6"
title = "Formula structure type"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Formula`, contextual, with the same two attributes as `Figure` and the same split between them."


[[clause]]
clause = "14.8.4.8.7"
title = "Artifact structure type"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_heading_carries_its_level_and_the_table_carries_the_rest"]
note = "`Artifact` as a *structure element*, PDF 2.0's, which is the third of §14.8.2.2.2's three ways to mark one — \"[b]y inclusion in the logical structure tree through the use of the Artifact structure element type\". The marked-content forms are read by `content.rs` (ADR 0073); this is the type that lets an artifact sit in the tree \"in cases that have positional context relative to real content\", which its NOTE 1 gives line numbers as the example of."


[[clause]]
clause = "14.8.5"
title = "Standard structure attributes"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attributes_owner_and_its_ancestry_decide_which_value_applies"]
note = "The attributes a structure element may carry. **How an attribute is found is implemented** — where it lives (§14.8.5.1), whose vocabulary it is in (§14.8.5.2) and which of several values applies (§14.8.5.3) — and **what each attribute means is not, deliberately**: twelve of this family's sixteen rows are `inapplicable`, because a layout attribute describes the layout process that produced an appearance this reader already has. What is left `silent` is §14.8.5.6's `PrintField`, the one family with a rendering-adjacent entry."


[[clause]]
clause = "14.8.5.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attribute_is_found_through_a_class_and_overridden_by_the_elements_own"]
note = "Where an attribute lives: a structure element's `/A`, naming an attribute object or an array of them, or its `/C`, naming a class looked up in the structure tree root's `/ClassMap`. Both are read as of the eighty-second session (ADR 0072), with §14.7.6.3's revision numbers, which is what makes the arrays parseable at all. **This row was `silent` while §14.7.6's rows recorded the same code as implemented** — two clauses describing one mechanism, and the ledger's own way of understating."


[[clause]]
clause = "14.8.5.2"
title = "Standard attribute owners"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attributes_owner_and_its_ancestry_decide_which_value_applies"]
note = "Table 376's owners, read as `structure::Owner`. The distinction that earns the type is the one §14.8.5.3 turns on: five owners are PDF's own vocabulary — `Layout`, `List`, `PrintField`, `Table`, `Artifact` — and everything else is a *format's*, `HTML-4.01` or `CSS-3` or a name registered under Annex E. The thirteen format owners are one arm rather than thirteen, because this reader translates to none of those formats and what it needs from the name is only that it is not one of the five. `UserProperties` and `NSO` are Table 360's two other values and are read with them."


[[clause]]
clause = "14.8.5.3"
title = "Attribute values and inheritance"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::an_attributes_owner_and_its_ancestry_decide_which_value_applies"]
note = "The clause's five-step priority, of which the first four are here. A format-specific owner's value is skipped rather than preferred, which is the clause's own condition — priority 1 applies \"if processing based on the format indicated by the owner value\" and this program processes to no format; priority 2 is the PDF-native owners' `/A`, priority 3 the class map, and priority 4 is `Tree::inherited_attribute` walking `/P`, bounded like §14.9.2.3's language walk. **Priority 5 and the choice between 3 and 4 belong to the attribute rather than to the element**: §14.8.5.4's tables say which attributes are inheritable and what each defaults to, and a reader that inherited every attribute would give a paragraph its table's `/ColSpan`. So the caller picks, and the clause's closing sentence is why the two answers are the same kind — \"[t]here is no semantic distinction between attributes that are specified explicitly and ones that are inherited\"."


[[clause]]
clause = "14.8.5.4"
title = "Layout attributes"
status = "inapplicable"
note = "Aggregate of the seven below. Layout attributes \"specify parameters of the layout process used to produce the appearance described by a document's PDF content\", and the NOTE states the intent outright: \"[t]he intent is that these parameters can be used to repurpose the content or export it to some other document format with at least basic styling preserved.\" The appearance is already drawn; nothing here can change it, and nothing in this program exports."

[[clause]]
clause = "14.8.5.4.1"
title = "General"
status = "inapplicable"
note = "Which attribute objects are layout ones — owner `Layout`, or any owner other than `List`, `Table`, `PrintField` and `Artifact` — and Table 377's map from attribute to the element types it applies to."

[[clause]]
clause = "14.8.5.4.2"
title = "General layout attributes"
status = "inapplicable"
note = "Table 378's attributes common to every structure type: `/Placement`, `/WritingMode`, `/BackgroundColor`, `/BorderColor`, `/BorderStyle`, `/BorderThickness`, `/Padding`, `/Color`. Every one describes what the page already shows; a reader that drew from them would draw the page twice."

[[clause]]
clause = "14.8.5.4.3"
title = "Layout Attributes for BLSEs"
status = "inapplicable"
note = "Table 379's block-level attributes: `/SpaceBefore`, `/SpaceAfter`, `/StartIndent`, `/EndIndent`, `/TextIndent`, `/TextAlign`, `/BBox`, `/Width`, `/Height`, `/BlockAlign`, `/InlineAlign`, `/TBorderStyle`, `/TPadding`. The `/BBox` here is a *description* of where the element was laid out and not a clip — unlike §8.10's form `/BBox` and §8.7.3.1's pattern `/BBox`, which are, and the three should not be confused."

[[clause]]
clause = "14.8.5.4.4"
title = "Layout Attributes for ILSEs"
status = "inapplicable"
note = "Table 380's inline-level attributes: `/BaselineShift`, `/LineHeight`, `/TextDecorationColor`, `/TextDecorationThickness`, `/TextDecorationType`, `/RubyAlign`, `/RubyPosition`, `/GlyphOrientationVertical`, `/TextPosition`. A text decoration described here is one the content stream already drew as a rule or a stroke."

[[clause]]
clause = "14.8.5.4.5"
title = "Content and allocation rectangles"
status = "inapplicable"
note = "How a content rectangle and an allocation rectangle are derived, by structure type: from the bounding box of a cell's graphics objects, from the sum of contained block heights, from `/LineHeight` for text. This is the arithmetic of a layout engine, stated so that two processors reflowing the same file agree."

[[clause]]
clause = "14.8.5.4.6"
title = "Figure, Form and Formula attributes"
status = "inapplicable"
note = "`/BBox`, `/Width` and `/Height` on a `Figure`, `Form` or `Formula`. The same description-not-clip caution as §14.8.5.4.3's."

[[clause]]
clause = "14.8.5.4.7"
title = "Column attributes"
status = "inapplicable"
note = "`/ColumnCount`, `/ColumnGap` and `/ColumnWidths` on a grouping element laid out in columns. A processor reflowing the content needs them; a processor drawing it has the columns already."

[[clause]]
clause = "14.8.5.5"
title = "List attributes"
status = "inapplicable"
note = "Table 381's `/ListNumbering`, which says how a list's labels were numbered — `Decimal`, `UpperRoman`, `Disc` and the rest. The labels themselves are `Lbl` elements holding the marks the page shows; this names the scheme for a processor that intends to renumber. Worth noticing that §12.4.2's page labels use the same vocabulary for a question this tree *does* answer."

[[clause]]
clause = "14.8.5.6"
title = "PrintField attributes"
status = "silent"
note = "Table 382's `/Role`, `/checked` and `/Desc` on a `Form` element — what kind of field the content depicts, and whether the check box shown is on. **This is the one attribute family with a rendering-adjacent question in it**, and the answer is that it has none: §12.7.4's appearance is what a widget draws, and `/checked` here is a *description* of that appearance for a processor exporting the form. If the two disagree the appearance wins, because the appearance is the page."

[[clause]]
clause = "14.8.5.7"
title = "Table attributes"
status = "inapplicable"
note = "Table 383's `/RowSpan`, `/ColSpan`, `/Headers`, `/Scope` and `/Summary` — the table semantics §14.8.4.8.3's header-search algorithm consumes. Nothing here is drawn; a spanned cell was drawn as whatever marks the content stream made."

[[clause]]
clause = "14.8.5.8"
title = "Artifact attributes"
status = "inapplicable"
note = "Table 384's `/Type`, `/BBox` and `/Subtype` on an `Artifact` element, the same four kinds §14.8.2.2.2's property list names. Read and dismissed for the same reason as the rest of §14.8.5: it describes rather than draws."

[[clause]]
clause = "14.8.6"
title = "Standard structure namespaces"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_namespaces_own_role_map_is_the_one_that_applies"]
note = "Which namespace a structure type's name belongs to, which is what makes two documents' tagsets comparable. The three names are constants here and the mapping rule is implemented; what is `silent` is the *requirement* the clause states about them — that in a tagged document every element be in a standard namespace or role mapped into one — which is a validation this reader does not perform. See the three below."


[[clause]]
clause = "14.8.6.1"
title = "Namespaces for standard structure types and attributes"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_namespaces_own_role_map_is_the_one_that_applies"]
note = "Two namespaces, named by URI: PDF 2.0's `http://iso.org/pdf2/ssn` and PDF 1.7's `http://iso.org/pdf/ssn`, with the **default being the older one** — \"[w]hen a namespace is not explicitly specified for a given structure element or attribute, it shall be assumed to be within this default standard structure namespace\". A reader that assumed the newest would misread every untagged-namespace element in every file written before 2020. Both are constants in `structure.rs` and `Tree::namespace` returns the default for an element that states none."


[[clause]]
clause = "14.8.6.2"
title = "Role maps and namespaces"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_namespaces_own_role_map_is_the_one_that_applies", "crates/pdf-model/src/structure.rs::a_role_map_may_lead_into_another_namespace"]
note = "Which map applies to which element, and it is not §14.7.3's: \"if the structure element does not explicitly identify its namespace using an NS entry, it should use the RoleMap entry in the Structure Tree Root dictionary … If the structure element is in an explicit namespace, then … the RoleMapNS entry within that namespace dictionary shall provide the role mapping\". `Tree::role` carries a name *and* a namespace through the walk for that reason, follows a mapping into a target namespace, and is bounded because \"applied transitively\" is an invitation to a cycle. What is not done is the clause's conformance requirement — that every element end in a standard namespace — which is a validator's job rather than a reader's."


[[clause]]
clause = "14.8.6.3"
title = "Other namespaces"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/src/structure.rs::a_role_map_may_lead_into_another_namespace"]
note = "MathML 3.0 is the one namespace this subclause defines — \"MathML is the only domain-specific namespace defined in PDF 2.0\" — and it is a constant here, along with the exemption the clause gives it: a namespace named in this subclause \"[does] not require a RoleMapNS entry\", so an element in it keeps its own type. Any other namespace a document declares is read and carried as its name; what this reader does *not* do is check the requirement that it be role mapped into a standard one."


[[clause]]
clause = "14.9"
title = "Repurposing and accessibility support"
status = "partial"
code = ["crates/pdf-model/src/accessibility.rs", "crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/tests/accessibility.rs"]
note = "Aggregate of the ten below. Accessibility support: a natural language, an alternate description, a replacement text, an expansion and a pronunciation hint. **Four of the five are read, since the sixtieth session** — `/Lang`, `/Alt`, `/ActualText` and `/E`, each in both of the places §14.9 puts it: a `Span` marked-content sequence's property list and, through §14.7.5.4's parent tree, the structure element the sequence belongs to. The fifth, §14.9.6's pronunciation hints, the clause itself excuses. Two things separate the entries and `accessibility.rs` keeps them apart: `/ActualText` is a *character* substitution and belongs to extraction, so it is applied to `Interpretation::text`; `/Alt` and `/E` are phrase substitutions and belong to vocalisation, so they are recorded as spans and applied by `Interpretation::speech`. What is still owed is a *consumer* — `CLAUDE.md` names AccessKit as this project's accessibility layer and nothing hands it these runs yet — and §14.9.3's third location, an annotation's `/Contents`. Measured over the corpus: **89 of the 953 page ones state a document `/Lang`, 35 carry §14.9 spans — 13 `/Alt`, 702 `/Lang`, no `/E`.**"
[[clause]]
clause = "14.9.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/accessibility.rs"]
test = ["crates/pdf-model/tests/accessibility.rs"]
note = "The four facilities, and the reason they exist: \"many computer users with visual impairments use screen readers to read documents aloud\". Three of the four are read and the fourth is §14.9.6's, which the clause does not require. Nothing here reaches a pixel, which is why a page draws identically whether or not any of it is read — and why the debt this row still carries is a consumer rather than a parser."
[[clause]]
clause = "14.9.2"
title = "Natural language specification"
status = "partial"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/accessibility.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::a_span_overrides_the_documents_language"]
note = "Aggregate of the four below. Three of the four locations a `/Lang` may occupy are read and resolved into §14.9.2.3's hierarchy — the catalog's, a structure element's with its ancestry, and a `Span` property list's — and §7.9.2.2.2's escape sequences are still recognised and removed from every text string this tree decodes. `partial` for the fourth location, Table 122's `/Lang` on a CIDFont's font descriptor, which is evidence about which installed face should substitute and is §14.9.2.2's row."
[[clause]]
clause = "14.9.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/structure.rs", "crates/pdf-model/src/accessibility.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::a_structure_element_supplies_the_language_of_its_sequence"]
note = "The hierarchy's inventory, and every item of it is read: `/Lang` in the catalog (`structure::document_language`), in a structure element (`structure::language`, which walks `/P` for the inheritance §14.9.2.3 requires), in a `Span` property list (`content.rs`'s `accessibility`), and the escape sequence inside a Unicode text string that overrides all of them (§7.9.2.2.2, `text_string.rs`, where it is removed). NOTE 2 names the one place a language decides what is *drawn* — an optional content usage dictionary's `/Language`, whose row in §8.11.4.4 records it as a departure this tree measured and declined."
[[clause]]
clause = "14.9.2.2"
title = "Language identifiers"
status = "partial"
code = ["crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_empty_language_identifier_states_nothing"]
note = "What a language identifier is: \"either be the empty text string, to indicate that the language is unknown, or a Language-Tag as defined in BCP 47\", compared case-insensitively, with \"zxx\" for non-linguistic content. The tag is carried as the file writes it and never parsed — a BCP 47 grammar would be a judgement about a registry this program does not hold — but the clause's one *semantic* rule about the value is honoured: an empty identifier states that the language is unknown, which is not a language, so it records nothing and leaves the enclosing statement in force. Three of the four places one may appear are ordinary text strings this tree decodes and now reads. The fourth is the one that could change a *glyph*: Table 122 gives a CIDFont's descriptor a `/Lang`, and where a composite font is not embedded that is evidence about which installed face should stand in — the same debt §9.8.3's `/Style` and `/FD` carry, and the same answer: substitution quality, recorded rather than built."
[[clause]]
clause = "14.9.2.3"
title = "Language specification hierarchy"
status = "implemented"
code = ["crates/pdf-model/src/accessibility.rs", "crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::a_structure_element_inherits_a_language_from_its_ancestry"]
note = "The precedence, in full: the catalog's default, overridden by a structure element's — inherited from the nearest ancestor element that states one, which `structure::language` walks `/P` for — overridden by a nested element's or a marked-content sequence's. The clause's closing rule, that a structure element's specification beats the unstructured content it sits inside, is the *innermost* statement winning rather than a special case, which is what its own EXAMPLE 3 shows and what `accessibility::speech` implements by nesting. The walk is bounded by `MAX_ANCESTRY` because `/P` is a reference a document controls and nothing forbids a cycle; reaching the bound answers \"no language stated\", which is the answer an untagged document gives."
[[clause]]
clause = "14.9.2.4"
title = "Multi-language text arrays"
status = "out-of-scope"
exclusion = "clause-13-multimedia"
note = "Multi-language text arrays — `[(en-US) (My vacation) (fr) (mes vacances) () (default text)]`, matched exactly and then by prefix, with an empty identifier as the default. The clause names exactly two places one may appear, Table 285's media clip data dictionary and Table 288's media clip section dictionary, and both are clause 13 objects — `CLAUDE.md`'s closed exclusion of multimedia and 3D. The matching rule is general and nothing in scope carries an array to match."

[[clause]]
clause = "14.9.3"
title = "Alternate descriptions"
status = "implemented"
code = ["crates/pdf-model/src/accessibility.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_alternate_description_is_spoken_but_not_extracted", "crates/pdf-model/tests/accessibility.rs::an_annotation_with_no_text_is_described_by_its_contents"]
note = "`/Alt`, \"human-readable text that could, for example, be vocalised by a text-to-speech engine\", read from **all three** of the locations the clause names: a `Span` property list, the structure element an `/MCID` names, and — since the sixty-sixth session — an annotation's `/Contents`. The third carries the clause's own condition and it is *checked* rather than assumed: \"any type of annotation … that does not already have a text representation\", so the description is recorded only where the annotation's appearance read back nothing, which a widget laying out its field value does not. It substitutes for the whole span it encloses when the page is *spoken* and changes nothing about what the page *extracts*, which is the distinction §14.9.4's NOTE 2 draws. The clause's word-break rule between consecutive descriptions is implemented by inserting one on each side of every phrase. 13 corpus page ones state an `/Alt` and the shape they take is the clause's own example — `bug1937438_from_word.pdf` describes a summation as \"6 sum from n equals 1 to infinity of 1 over n squared , equals pi squared\". Table 232's `/TU` alternative *field name* is not read: it names a field in a user interface this program does not have, which is §12.7.4.1's row rather than this one's."
[[clause]]
clause = "14.9.4"
title = "Replacement text"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/structure.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::actual_text_replaces_what_a_sequence_reads_back", "crates/pdf-model/tests/accessibility.rs::consecutive_replacement_texts_are_not_separated"]
note = "An `/ActualText` replaces the text its marked-content sequence reads back — \"a replacement, not a description, for the content\", a *character* substitution — which is extraction rather than drawing, so the marks are untouched. Both of the clause's locations are read: the `Span` property list since the fifty-fifth session and the structure element since the fifty-sixth, when §14.7.5.4's parent tree made one reachable. **This row said the structure-element half was owed for four sessions after it landed**, which is the ledger's own failure mode seen from the other side — a note describing what somebody found rather than what is there. The last requirement closed in the sixty-sixth session: \"[i]f each of two (or more) consecutive structure or marked-content sequences has an ActualText entry, they shall be treated as if no word break is present between them\", and the word break in question is not in either sequence — it is what the placement pass inferred from the gap the glyphs left, so it is removed where two replacements are adjacent and kept where anything else was drawn between them. `issue13226.pdf` is the corpus witness and it is §14.8.2.3's soft hyphen written the way the clause describes: a space glyph whose `/ActualText` is U+00AD. The clause's own example is a hyphenated German `Druk-`/`ker` whose `/ActualText` is `c`, and it is the test. 5 corpus documents write one."
[[clause]]
clause = "14.9.5"
title = "Expansion of abbreviations and acronyms"
status = "implemented"
code = ["crates/pdf-model/src/accessibility.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_expansion_is_spoken_in_place_of_its_abbreviation"]
note = "`/E`, an abbreviation's expansion, read from both places the clause names — a `Span` property list and a structure element. \"[A] word or phrase substitution for the tagged text and therefore shall be treated as if a word break separates it from any surrounding text\" — the opposite of §14.9.4's rule, and the distinction is the whole difference between the two entries, so `/E` replaces the span in the *spoken* form with a break on each side while leaving the extracted text alone. The clause's own two-abbreviation example is the test. **No corpus document states one on page one**, which is measured rather than assumed and is why the test is the clause's example rather than a file."
[[clause]]
clause = "14.9.6"
title = "Pronunciation hints"
status = "inapplicable"
note = "Pronunciation hints — `/PhoneticAlphabet` and `/Phoneme` on a structure element, `/PronunciationLexicons` on the structure tree root — and the clause states its own obligation: \"A PDF processor is not required to process pronunciation hints.\" So nothing is owed and nothing is silent, which is the same reading §10.7.2's flatness permission gets. The NOTE says why the omission is usually harmless: a text-to-speech function does well enough \"based on text provided in Unicode encoding combined with an indication of the language that applies to that text\", which is §14.9.2's job and not this one's."

[[clause]]
clause = "14.10"
title = "Web capture"
status = "inapplicable"
note = "Aggregate of the seventeen below. Web capture is bookkeeping about where a page's content came from, and the clause opens by retiring itself: \"The features described in this clause are deprecated with PDF 2.0.\" None of it reaches a pixel — §14.1's opening sentence covers it, and every structure here is a registry a *capturing* application keeps so that it can avoid downloading what it already has. No corpus document writes a `/SpiderInfo`. Two of its structures are name trees this tree could now walk (§7.7.4's `/IDS` and `/URLS`), which is worth recording only because it says the omission is a decision rather than a missing component."

[[clause]]
clause = "14.10.1"
title = "General"
status = "inapplicable"
note = "What the six operations are — save, retrieve, update, find by URL, find by identifier — and the two structures that support them: the information dictionary and the content database. Every one of the six is an operation on a *file*, not on a page, which is why this family owes a renderer nothing even before the deprecation."

[[clause]]
clause = "14.10.2"
title = "Web capture information dictionary"
status = "inapplicable"
note = "The catalog's `/SpiderInfo`: Table 386's `/V`, whose \"version number shall be 1.0 in a conforming PDF file\" and which is \"a single real number, not a major and minor version number\" — so 1.2 exceeds 1.15, which is the one sentence here worth remembering, because §7.5.2's header version and §7.12.4's `/BaseVersion` are the opposite convention. Unread."

[[clause]]
clause = "14.10.3"
title = "Content database"
status = "inapplicable"
note = "Aggregate of the three below: the content database that maps a URL or an MD5 digest to the PDF objects made from it, organised into content sets keyed `SPS` for a page set and `SIS` for an image set."

[[clause]]
clause = "14.10.3.1"
title = "General"
status = "inapplicable"
note = "How the database is organised and where it hangs: the `/URLS` and `/IDS` name trees in §7.7.4's name dictionary, either of which may name a single content set or an array of them, and the arrays may mix the two subtypes."

[[clause]]
clause = "14.10.3.2"
title = "URL strings"
status = "inapplicable"
note = "A seven-step canonicalisation of a URL before it is used as a key — absolute, truncated at the first NUMBER SIGN, lowercased scheme and host, `localhost` removed for `file`, default ports removed, dot segments resolved per RFC 3986. The NOTE is the interesting part and it generalises past this clause: because PERCENT SIGN is both unsafe and the escape character, \"no number of encoding or decoding passes on a URL can ever cause it to reach a stable state\"."

[[clause]]
clause = "14.10.3.3"
title = "Digital identifiers"
status = "inapplicable"
note = "MD5 over the source data, and for a page set over the source followed by the identifiers of each auxiliary file in first-reference order. A page set may also carry a *text* identifier over the text alone, which is how a capturing application tells a changed page from a changed image. RFC 1321's MD5 is already in this tree for §7.6's encryption; nothing calls it from here."

[[clause]]
clause = "14.10.3.4"
title = "Unique name generation"
status = "inapplicable"
note = "How a captured link or form field is given a name that will not collide: the page set's digital identifier is appended to the original name, with Table 387 escaping NUL, PERIOD and REVERSE SOLIDUS — PERIOD because §12.7.4.2 makes it the separator in a field's fully qualified name. A field name gets a second encoding, one source byte to two, each 65 plus a nibble. Writer-side work described in a deprecated clause, and reading a name so constructed needs none of it."

[[clause]]
clause = "14.10.4"
title = "Content sets"
status = "inapplicable"
note = "Aggregate of the two below: Table 388's entries common to every content set."

[[clause]]
clause = "14.10.4.1"
title = "General"
status = "inapplicable"
note = "Table 388: `/S` for the subtype, `/ID` the digital identifier, `/O` the objects the set holds, `/SI` the source information, and `/CT`/`/TS` the MIME type and timestamp. A description of provenance, and a page draws the same with or without it."

[[clause]]
clause = "14.10.4.2"
title = "Page sets"
status = "inapplicable"
note = "A page set, `SPS`: the pages generated from one source \"listed in the O array … in the same order in which they were initially added to the PDF file\", each page in at most one set, with Table 389's `/TID` the optional text identifier."

[[clause]]
clause = "14.10.4.3"
title = "Image sets"
status = "inapplicable"
note = "An image set, `SIS`: the image XObjects made from one source image, with Table 390's `/R` giving each object's reference count so a capturing application knows when an image is no longer used."

[[clause]]
clause = "14.10.5"
title = "Source information"
status = "inapplicable"
note = "Aggregate of the four below: where a captured object came from."

[[clause]]
clause = "14.10.5.1"
title = "General"
status = "inapplicable"
note = "Table 391's source information dictionary — `/AU` the URL or alias, `/TS` when it was retrieved, `/E` when it expires, `/S` the submission method, `/C` the command that produced it. Provenance, not appearance."

[[clause]]
clause = "14.10.5.2"
title = "URL alias dictionaries"
status = "inapplicable"
note = "A URL alias dictionary, which records that several URLs resolved to the same content — `/U` the chain of redirects and `/C` the content sets they reached."

[[clause]]
clause = "14.10.5.3"
title = "Command dictionaries"
status = "inapplicable"
note = "Table 393's command dictionary: the URL a capture was asked for, the flags it ran under, the POST data it sent, and its settings. It is a log of what an application did, which is the clearest statement in this family of what web capture is for."

[[clause]]
clause = "14.10.5.4"
title = "Command settings"
status = "inapplicable"
note = "Table 394's command settings: the conversion engine's own configuration, keyed by MIME type. Explicitly an application's private data — the clause says the settings \"are specific to the conversion engine\" — and nothing in the standard defines their contents."

[[clause]]
clause = "14.10.6"
title = "Object attributes related to web capture"
status = "inapplicable"
note = "The entries web capture adds to objects that are *not* its own: `/ID` and `/SI` on a page, `/PtData` on an XObject or an annotation. This is the one row of the family that touches a page dictionary, and it changes nothing about how the page is drawn — which is the whole family's answer in miniature."

[[clause]]
clause = "14.11"
title = "Prepress support"
status = "partial"
code = ["crates/pdf-model/src/page.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::an_output_intent_says_what_the_documents_device_colours_mean"]
note = "Two of its seven subclauses reach a screen — §14.11.2's page boundaries and §14.11.5's output intents — and both are implemented. The rest are for a press: printer's marks, separation dictionaries, trapping (deprecated in PDF 2.0) and OPI."

[[clause]]
clause = "14.11.1"
title = "General"
status = "inapplicable"
note = "Introductory to the prepress features, which it describes as \"specialised features to support prepress production workflows\". The two entries in it that a viewer reads have rows of their own."

[[clause]]
clause = "14.11.2"
title = "Page boundaries"
status = "partial"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/page_geometry.rs::the_five_page_boundaries_default_and_are_clipped_to_the_medium"]
note = "All five boundaries are read, defaulted and intersected with the medium, and `Page::boundary` is the rectangle one of them names — which is what §12.2's `/ViewArea` and `/ViewClip` need, since those entries name a boundary rather than stating one. What is still owed is §14.11.2.2's guidelines, which are `inapplicable` on their own row. See §14.11.2.1."

[[clause]]
clause = "14.11.2.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/page.rs"]
test = ["crates/pdf-model/tests/render_real_pdf.rs::the_fixture_page_is_modelled_correctly"]
note = "The crop box is honoured: it is inherited down the page tree, defaults to the media box, is refused and replaced when degenerate, and gives the rendered page both its size and its origin — which is also what every reference renderer is asked for, see tools/pdfref. The media box is read as the crop box's default. **The bleed, trim and art boxes are read since the eighty-first session**: each defaults to the crop box, none is inheritable (§7.7.3.4 leaves the four Table 31 marks alone), and each is treated as \"its intersection with the media box\" as this clause requires of all four. They bound a production process rather than a display, so nothing here draws with them — what reaches a screen is §12.2's `/ViewArea` and `/ViewClip`, which may name any of the five. **This row said `/UserUnit` was \"neither applied nor reported\" for thirty-two sessions after the twenty-ninth applied it** — §7.7.3.3's own row records it landing, and this one, four clauses away, was never revisited. Where the crop box's *origin* lands in a raster whose size had to be rounded up is §10.7.4's row, and was a defect until the sixty-first session (ADR 0064)."

[[clause]]
clause = "14.11.2.2"
title = "Display of page boundaries"
status = "inapplicable"
note = "`/BoxColorInfo`, the colours an *interactive* processor draws page-boundary guidelines in. The clause makes both the guidelines and the entry optional — \"interactive PDF processors **may** offer the ability to display guidelines\" — and this one does not offer it, so there is nothing for the entry to colour. It becomes a row to fill the day a viewer grows a prepress view."

[[clause]]
clause = "14.11.3"
title = "Printer's marks"
status = "inapplicable"
note = "Printer's marks — registration targets, colour bars, cut marks — are annotations \"of subtype PrinterMark\" placed \"outside the boundaries of the page's trim box\", which is by construction outside what this viewer draws. Table 167's Print flag governs them and a screen is not a printer (trap 9's second shape, and the same reading §12.5.3 already uses)."

[[clause]]
clause = "14.11.4"
title = "Separation dictionaries"
status = "inapplicable"
note = "A separation dictionary describes \"a single separation of a colour-separated document\" — one plate of a press run. §10.8.1 makes producing separations \"up to the processing software\", and this one produces a screen."

[[clause]]
clause = "14.11.5"
title = "Output intents"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::an_output_intent_says_what_the_documents_device_colours_mean", "crates/pdf-model/tests/colour_paths.rs::a_default_space_outranks_the_output_intent"]
note = "`output_intent_space` reads the catalog's `/OutputIntents` and takes the `/DestOutputProfile` of the first one that has a readable profile, which becomes what the document's device colours mean where it names no `/DefaultCMYK`. That ranking is the clause's own — §8.6.5.7 NOTE 3 sends a reader here for \"the intended meaning\" of a device space, and §8.6.5.6's default spaces are the nearer statement and win. `/S` is not filtered on: the clause's subtypes name the *kind* of press the profile describes, and a profile is a profile whichever it is. §10.3.1 is where this fits in clause 10's picture."

[[clause]]
clause = "14.11.6"
title = "Trapping support"
status = "inapplicable"
note = "\"The features described in this clause are deprecated with PDF 2.0.\" Trapping overlaps adjacent colours to hide misregistration between a press's plates; there is no misregistration on one raster."

[[clause]]
clause = "14.11.6.1"
title = "General"
status = "inapplicable"
note = "See §14.11.6."

[[clause]]
clause = "14.11.6.2"
title = "Trap network annotations"
status = "inapplicable"
note = "A trap network annotation carries the traps as a content stream, one per page, and Table 167's Print flag is what draws it. Deprecated with §14.11.6, and drawing it on a screen would paint the artefact-hiding overlaps *as* artefacts."

[[clause]]
clause = "14.11.6.3"
title = "Trap network appearances"
status = "inapplicable"
note = "See §14.11.6.2."

[[clause]]
clause = "14.11.7"
title = "Open prepress interface (OPI)"
status = "inapplicable"
note = "OPI substitutes a low-resolution proxy image for a high-resolution one held outside the file, for a prepress workflow that swaps them back at output time. Table 402's `/OPI` is a *proxy's* dictionary: a processor that draws the image the file contains — which is what this one does — has already drawn what OPI describes."

[[clause]]
clause = "14.12"
title = "Document parts"
status = "inapplicable"
note = "Aggregate of the six below. Document parts are a *production workflow* structure: a second hierarchy over the same pages, carrying metadata for a job ticket. §14.12.1 states its own purpose — \"[t]he use of a separate job ticket file for specifying page ordering and processing requirements\", targeted at \"a production workflow, digital printing device, or other messaging channel\" — and nothing in the family changes a mark on a page. That is the same reading §14.2's procedure sets and §14.5's page-piece dictionaries got, and it is why this is `inapplicable` rather than owed. **No corpus document states a `/DPartRoot`.** The two rows below it that are `writer-side` rather than `inapplicable` are the ones whose every sentence constrains how a file is built."

[[clause]]
clause = "14.12.1"
title = "General"
status = "inapplicable"
note = "Why document parts exist: a PDF written for one workflow is \"not portable across different production workflows or digital printing devices once they are created\", and a DPart tree lets a job ticket name page ranges without rewriting the file. NOTE 1 is the one sentence with a reader in it — \"a PDF processor can also access page object entries indirectly from the DPart leaf nodes … for structured presentation of pages\" — and it is a NOTE, describing a presentation this program does not offer and the standard does not require."

[[clause]]
clause = "14.12.2"
title = "DPart tree structure"
status = "writer-side"
note = "The tree's shape, and every sentence in it constrains the *file*: the ranges \"shall not overlap and therefore shall not share the same PDF page objects\", each page \"shall be included in the page range defined by one and only one DPart dictionary\", and \"[a] child DPart dictionary shall not be referenced by more than one parent\". A reader implements none of it; it reads whatever tree arrives, if it reads one at all."

[[clause]]
clause = "14.12.3"
title = "Connecting the DPart tree structure to pages"
status = "writer-side"
note = "How the tree connects to pages, and again every requirement is on the writer: each page in a leaf's range \"shall have a DPart key\" pointing back at that leaf, page numbers within a range \"shall be monotonically increasing, as defined by the document's page tree\", and the depth-first order of the DPart tree shall match the page tree's. NOTE 2 states the consequence, which is why a reader owes nothing: \"the pages will be enumerated the same using either mechanism\" — so this tree's page order is already the one the DPart hierarchy would give."

[[clause]]
clause = "14.12.4"
title = "Data structures"
status = "inapplicable"
note = "Aggregate of the two below: Table 408's `DPartRoot` and Table 409's `DPart`. Neither is read, and neither reaches a screen."

[[clause]]
clause = "14.12.4.1"
title = "General"
status = "inapplicable"
note = "Table 408 and Table 409. Two entries touch families this project does read and neither changes that: a `/DPart`'s `/AF` is §14.13.8's associated files, `silent` on their own rows, and its `/Metadata` is §14.3.2's metadata stream, which §14.3 records as interchange. `/DParts` and `/Start`/`/End` are exclusive — the clause's NOTE says only leaf nodes may name pages."

[[clause]]
clause = "14.12.4.2"
title = "Document part metadata"
status = "inapplicable"
note = "Document part metadata: \"application-specific information communicated between the creator of PDF data and a receiving system\". The clause's own definition of the audience, and this program is not it. Two constraints are worth having read for the *shape* they impose rather than for any use here: every key in a DPM dictionary \"shall conform to the rules of an XML name token as well as the rules for PDF name objects\", and the values \"shall only be of type text string, date string, array, dictionary, boolean, integer or real\" — a PDF dictionary restricted to what XML can carry."

[[clause]]
clause = "14.13"
title = "Associated files"
status = "partial"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "Associated files: a file specification carrying an `/AFRelationship`, named by an `/AF` array on the object it belongs to. `attachment::associated` reads such an array from any dictionary, which is what the clause's own shape asks for — it lists seven objects that may carry one and says the same sentence about every one. What is not done is *using* the relationship, and the clause says a processor need not: \"[t]he value of AFRelationship does not explicitly provide any processing instructions for a PDF processor. It is provided for information and semantic purposes\". 7 corpus documents state an `/AF`: 6 on catalogs, 30 on structure elements, with `Supplement` 33, `Source` 4 and `Unspecified` 2."


[[clause]]
clause = "14.13.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "The framing and the list of objects that may carry an `/AF`. All eight of Table 43's relationship values are read, plus Annex E's second-class names, which are kept rather than flattened to `Unspecified` — the table's NOTE 2 says `Unspecified` \"is to be used only when no other value correctly reflects the relationship\", so a producer that registered a name has said something a reader should not throw away."


[[clause]]
clause = "14.13.2"
title = "Embedded associated files"
status = "partial"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "The two forms an associated file may take, and this reader takes the recommended one: \"[b]oth types are allowed for associated files but the embedded form is recommended\", and an external one is §7.11.1's refusal, which no filesystem here can lift. §7.11.4's stream is read with its `/Params` and `/Subtype`; the clause's requirements *on a producer* — a `/ModDate` and a valid MIME type, `application/octet-stream` where it is unknown — are checked by nobody, because this reader does not validate files."


[[clause]]
clause = "14.13.3"
title = "Associated files linked to the PDF document's catalog"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "`/AF` on the document catalog, read by `attachment::associated` against the catalog dictionary. 6 corpus documents state one."


[[clause]]
clause = "14.13.4"
title = "Associated files linked to a page dictionary"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "`/AF` on a page dictionary, which is the same function against `Page::dict`. No corpus document states one; the entry's own NOTE says why a producer would — associated files \"serve not only as alternative to PieceInfo (which is vendor specific) but also enable richer semantic content when doing page/document merging\"."


[[clause]]
clause = "14.13.5"
title = "Associated files linked to graphics objects"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/accessibility.rs::an_af_tagged_section_associates_a_file_with_what_it_draws"]
note = "`/AF` as a marked-content tag, which is the one place in this clause that is not a dictionary entry: a `BDC` whose tag is `AF` and whose property list carries the array associates those files with the graphics objects the section encloses. `Interpretation::associated_files` records it over the same readback range §14.8.2.2's artifacts use. On `BDC` alone, which is the clause's own NOTE 2 — \"[t]he BMC operator does not take properties and therefore cannot be used with the AF key\" — and the property list has to be a *named resource*, since §14.6.2 forbids an inline list from holding the indirect references an `/AF` array is made of."


[[clause]]
clause = "14.13.6"
title = "Associated files linked to structure elements"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "`/AF` on a structure element, read by the same function against the element dictionary — which is where the corpus actually puts them: 30 of the 37 `/AF` arrays in the corpus are on a `/StructElem`, all of them `Supplement`, and all of them MathML from one LaTeX producer. That is the clause's own example: a MathML version of an equation \"associated using a structure element or a form XObject depending on how the equation is rendered\"."


[[clause]]
clause = "14.13.7"
title = "Associated files linked to XObjects"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "`/AF` on a form or image `XObject`'s stream dictionary, read by the same function against that dictionary. No corpus document states one."


[[clause]]
clause = "14.13.8"
title = "Associated files linked to DParts"
status = "partial"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "`/AF` on a `DPart` dictionary. The array reads like any other, and what is missing is §14.12's document part hierarchy to hang it on — which is a `silent` row of its own and is what `DPartInteract` in §12.11's requirement table names."


[[clause]]
clause = "14.13.9"
title = "Associated files linked to an annotation dictionary"
status = "implemented"
code = ["crates/pdf-model/src/attachment.rs"]
test = ["crates/pdf-model/src/attachment.rs::an_associated_file_carries_its_relationship"]
note = "`/AF` on an annotation dictionary, read by the same function against the annotation. Its NOTE names the case that motivates it — a rich media annotation whose data a reader should be able to identify — which is clause 13 and excluded, and the entry is read anyway because the array is the same in every one of the clause's seven places."


[[clause]]
clause = "14.13.10"
title = "Associated file examples"
status = "inapplicable"
note = "Three worked examples — a presentation associated with the catalog, a `.doc` associated with a marked-content sequence, a MathML file associated with a form XObject. Nothing normative that §14.13.1 to §14.13.9 do not state; read and dismissed, which the ledger records rather than leaving blank."
