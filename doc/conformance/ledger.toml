test = ["crates/pdf-model/tests/optional_content.rs::a_base_state_of_off_hides_the_groups_the_on_array_does_not_name"]
note = "Steps a) and b) — the base state over every group, then the array opposite to it — are implemented, and the clause calls their result the initial state used by all PDF processors. The paragraph after it is now half implemented too: \"[t]he user may manipulate optional content group states manually or by triggering set-OCG-state actions\", and since the sixty-second session §12.6.4.13's action does exactly that against a `ViewState` the file cannot see, which is what the same sentence's \"[m]anual changes shall override the states that were set automatically\" requires. Still owed: usage application dictionaries for the Print and Export events, whose changes \"persist only for the duration\" of an operation this program does not perform, and a layer panel for the manual half. See §8.11.4.4."

[[clause]]
clause = "9.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs::the_text_we_draw_agrees_with_an_independent_extractor"]
note = "The clause's own map of itself: a text object, a font, an encoding, a glyph, a position. Every subclause it names is reviewed, and the two families it separates are kept separate in code — `content.rs` owns §9.3's text state and §9.4's operators, `pdf-font` owns §9.6 and §9.7's route from a code to an outline, and neither knows the other's rules. That separation is the clause's rather than a convenience: it puts a glyph's *selection* and its *painting* on opposite sides, which is why §9.3.6's rendering modes belong to the interpreter and §9.6.5's encodings to the font."

[[clause]]
clause = "9.2"
title = "Organisation and use of fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Organisation and metrics. See §9.2.2's font dictionaries, which are clause 9's other families, and §9.2.4's two sets of metrics, both of which this tree now reads."

[[clause]]
clause = "9.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Introductory. Its division — a font is \"a graphical description of a set of glyphs\" and the font *dictionary* is what a content stream names — is the boundary between `pdf-font`, which knows programs and encodings, and `pdf-model`, which knows where a glyph goes."

[[clause]]
clause = "9.2.2"
title = "Basics of showing text"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::mode_3_paints_nothing_and_still_extracts_its_text"]
note = "The four things the clause says showing text requires — the font, the size, the position and the other text state parameters — are §9.3's Table 102 and are all read. `Tf` selects the first two and §8.4.5's Table 57 `/Font` is the other route to them (ADR 0042)."

[[clause]]
clause = "9.2.3"
title = "Achieving special graphical effects"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::mode_7_clips_what_follows_and_paints_nothing"]
note = "The two effects the clause names are both implemented and both belong to §9.3.6's rendering modes: glyphs painted with any colour or pattern the graphics state holds, and glyphs added to the clipping path so that other content shows through them. A Type 3 font, which the clause names as the third route, is §9.6.4."

[[clause]]
clause = "9.2.4"
title = "Glyph positioning and metrics"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics", "crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances"]
note = "Both writing modes, from the thirty-sixth session. Mode 0's displacement is `/Widths` or `/W`; mode 1's is §9.7.4.3's `/W2` and `/DW2`, and the clause's two constraints on the vectors are stated where they are used — `w1`'s horizontal component is 0 and `v`'s horizontal component is half the glyph's width when `/W2` does not give one. \"Glyph space\" is one thousandth of text space for every font but a Type 3, whose `/FontMatrix` says otherwise, and both routes are in `show_text`. The glyph bounding box is read by nobody, which the clause permits: §9.6.4's Table 111 says a processor may make no assumptions from a Type 3 font's, and no other clause asks for one."

[[clause]]
clause = "9.3"
title = "Text state parameters and operators"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs", "crates/pdf-model/tests/text_render_modes.rs"]
note = "Reviewed as a family in the thirteenth session. Eight of Table 102's nine text state parameters are implemented and tested one clause at a time; the ninth, text knockout, is §9.3.8, which was this tree's third `silent` row until the fourteenth session made it report. All seven of Table 103's operators are executed, and the clause's rule that they \"may appear outside text objects, and the values they set are retained across text objects in a single content stream\" falls out of their living in the graphics state rather than in the text object."

[[clause]]
clause = "9.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::zero_sized_text_neither_marks_nor_clips", "crates/pdf-model/tests/text_state.rs::a_negative_font_size_draws_and_reads_normally"]
note = "Table 103's seven operators — Tc, Tw, Tz, TL, Tf, Tr, Ts — are all executed with the initial values the table states, and they sit in the graphics state so that q/Q saves them and a page starts from the defaults. Two sentences here are load-bearing and tested: \"Zero sized text shall not mark or clip any pixels (depending on text render mode)\", which is a guard on both the marking and the clipping path rather than only the first; and the NOTE that \"Negative text font size is permitted\", which draws a flipped glyph advancing leftwards. Partial only because of Tk, whose absence is §9.3.8."

[[clause]]
clause = "9.3.2"
title = "Character spacing"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_the_character_spacing_too"]
note = "Tc is added to each glyph's horizontal displacement and is then scaled by Th, which the clause requires — it is \"specified in unscaled text space units (although it shall be subject to scaling by the Th parameter if the writing mode is horizontal)\". The vertical branch does not exist because no writing mode 1 does; see §9.2.4."

[[clause]]
clause = "9.3.3"
title = "Word spacing"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_state.rs::word_spacing_moves_the_glyph_after_a_simple_fonts_space", "crates/pdf-model/tests/text_state.rs::word_spacing_does_not_reach_a_two_byte_code_32"]
note = "Corrected by this review. The clause states the rule about the code's *encoding*, not its value — word spacing applies to \"every occurrence of the single-byte character code 32 … when using a simple font (including Type 3) or a composite font that defines code 32 as a single-byte code\" and \"shall not apply to occurrences of the byte value 32 in multiple-byte codes\" — and this tree applied it to any code numerically equal to 32, so an Identity-H string containing 00 20 was pushed right by Tw for every one. `LoadedFont::has_single_byte_codes` answers it per font, which is exact for every mapping this crate builds because each is wholly one-byte or wholly two-byte; a general CMap may mix lengths, and when embedded CMap streams land it has to become a property of the code."

[[clause]]
clause = "9.3.4"
title = "Horizontal scaling"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_the_character_spacing_too", "crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_a_tj_adjustment"]
note = "Th is a factor rather than the percentage the operator takes, and it reaches all four things the clause lists: the glyph's shape, its horizontal displacement, the spacing parameters Tc and Tw, and \"any positioning adjustments performed by the TJ operator\". The last three are the ones a plausible implementation misses, which is why each has a test."

[[clause]]
clause = "9.3.5"
title = "Leading"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::leading_moves_the_next_line_downwards"]
note = "Tl is used by exactly the four operators Table 103 names — TD, T*, ' and \" — and by nothing else. TD sets it to the negation of its second operand and T* moves by its negation, which is the sign the clause explains in Table 106: leading is \"expressed as a positive number\" and going to the next line decreases y."

[[clause]]
clause = "9.3.6"
title = "Text rendering mode"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs", "crates/pdf-model/tests/render_real_pdf.rs::a_real_documents_text_clip_reaches_what_it_paints_afterwards"]
note = "All eight of Table 104's modes, thirteenth session, ADR 0022. The three operations are independent: a fill in the non-stroking colour, a stroke in the stroking colour whose parameters are read \"in user space rather than in text space\" — so the outline is moved into user space rather than the width divided by the font size — and an accumulation of outlines that becomes one non-zero-filled clip at ET and lasts until Q. Four of the clause's own exceptions are implemented and tested rather than inferred: an accumulator holding no outlines sets no clip at all (\"If no glyphs are shown or if the only glyphs shown have no outlines … no clipping shall occur\"); modes 2 and 6 fill and stroke glyph by glyph, giving \"the appearance of stacked opaque glyphs\" — and, since the hundred-and-twenty-first session, make that pair one object where §11.7.4.4 asks for it; a Type 3 glyph is rendered for every mode but 3 and 7 and adds nothing to the clipping path; and modes 3 and 7 still advance Tm. A hidden optional-content layer suppresses the marking and not the clip, because §8.11.3.1 puts clipping among the graphics state operations that \"shall still be applied\". A Tr operand outside 0..7 is reported and ignored rather than silently blanking the text object."

[[clause]]
clause = "9.3.7"
title = "Text rise"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::text_rise_is_not_scaled_by_the_font_size"]
note = "Trise is the f component of the glyph-space-to-text-space matrix, so it moves the baseline in unscaled text space units — not multiplied by the font size, which is the reading that would make a superscript's height depend on the point size. It applies to the vertical coordinate regardless of writing mode, which is trivially true here because only mode 0 exists."

[[clause]]
clause = "9.3.8"
title = "Text knockout"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::text_knockout_becomes_a_group_only_where_the_two_models_differ", "crates/pdf-model/tests/text_state.rs::text_knockout_still_reports_where_a_glyph_blends", "crates/pdf-model/tests/text_state.rs::a_text_knockout_set_inside_a_text_object_is_ignored"]
note = "Was this tree's third `silent` row; `reported` from the fourteenth session; drawn since the seventy-second. Tk has no operator and arrives only as /TK in an /ExtGState, which is read — including the clause's rule that a value installed between BT and ET \"shall be ignored\". Its initial value is true, and the clause says what that means: \"the behaviour shall be equivalent to treating the entire text object as if it were a non-isolated knockout transparency group … where each glyph is an individual element in that group's transparency stack\", after which \"the group results shall be composited with the backdrop, using the Normal blend mode and alpha and soft mask values of 1.0\". So a text object becomes one `Command::Group` with `knockout` set, alpha 1, no mask and the Normal blend mode, and its glyphs keep the state they were shown under — the clause's first additional rule, that parameters are inherited and not reset, is the difference from §11.6.6's group XObject and is why nothing is initialised here. The group is built only where both of the older conditions hold — the paint composites at all, and two glyphs of the object overlap — so an ordinary page of opaque text is not wrapped in a buffer for a difference it cannot show. What still reports is the non-isolated half: a glyph that *blends* needs the group's own backdrop, which §11.4.4's NOTE 3 cancels only under Normal. 2 corpus documents drew this and both are complete now."

[[clause]]
clause = "9.4"
title = "Text objects"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs", "crates/pdf-model/tests/text_render_modes.rs"]
note = "Reviewed as a family in the thirteenth session. BT and ET, all four positioning operators and all four showing operators are implemented; §9.4.4 stays partial because the vertical branch of the displacement formula has no writing mode 1 to reach it. The clause's constraints on a *writer* — that text objects shall not be nested, that the showing operators shall only appear within one, and that q…Q must nest separately from BT…ET — are recovered from rather than enforced, which is what a reader owes a malformed file."

[[clause]]
clause = "9.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_render_modes.rs::a_text_clip_survives_et_and_ends_at_q"]
note = "The three parameters the clause says \"may be specified only within a text object and shall not persist from one text object to the next\" are the `TextObject` struct, so BT resets all of them in one line and q/Q cannot save them: Tm and Tlm are fields, and Trm \"is actually just an intermediate result\" recomputed per glyph. Table 105's BT initialises both matrices to the identity. A second BT before an ET is malformed; it restarts the text object, and an ET that never arrives is reported."

[[clause]]
clause = "9.4.2"
title = "Text-positioning operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::leading_moves_the_next_line_downwards"]
note = "All four of Table 106: Td translates Tlm and copies it to Tm, TD does the same after setting the leading to the negation of ty, Tm replaces both rather than concatenating onto either, and T* is 0 -Tl TD. Tlm is tracked separately from Tm, which is what makes a run of Td or T* operators land on evenly spaced lines rather than accumulating the showing operators' advances."

[[clause]]
clause = "9.4.3"
title = "Text-showing operators"
status = "implemented"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/text_state.rs::horizontal_scaling_reaches_a_tj_adjustment", "crates/pdf-model/tests/text_extraction.rs"]
note = "All four of Table 107. TJ's numeric elements are subtracted in thousandths of a unit of text space and scaled by Tfs and Th; ' is T* then Tj; \" sets Tw and Tc first. The clause's \"Showing multiple glyphs with one invocation … shall produce the same results as showing them with a separate invocation for each\" holds because nothing here is per-string except the decoding into codes. A string is split into codes by the font — one byte for a simple font, two for the composite encodings this tree reads — which is §9.6.5 and §9.7 rather than this clause."

[[clause]]
clause = "9.4.4"
title = "Text space details"
status = "partial"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/type3.rs::a_width_advances_through_the_font_matrix"]
note = "The text rendering matrix and the horizontal displacement are implemented for both kinds of font, size and horizontal scaling and rise included, with word spacing applied to a single-byte code 32. The vertical branch is not: ty is always 0, because nothing here reads a vertical writing mode (see §9.2.4)."

[[clause]]
clause = "9.5"
title = "Introduction to font data structures"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cff.rs", "crates/pdf-font/src/type1.rs"]
test = ["crates/pdf-font/src/lib.rs::a_code_for_a_character_means_that_character"]
note = "The introduction to font data structures, and the distinction it draws is the one `pdf-font` is built on: a *font dictionary* is PDF's and a *font program* is not. So Table 124's five program formats are read by `read-fonts` and by this crate's own Type 1 reader, and which reader applies is decided by the program's leading bytes rather than by the dictionary's `/Subtype` — the clause's own separation, taken literally, and the reason a `CIDFont` embedding a bare Type 1 program is read at all (ADR 0049). Every font type the clause lists exists here: Type 1, TrueType, Type 3, Type 0 and the CIDFonts under it."

[[clause]]
clause = "9.6"
title = "Simple fonts"
status = "partial"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances"]
note = "All three of the clause's properties hold: a simple font's codes are single bytes, each glyph has one horizontal set of metrics, and the descriptor is read where there is one. `LoadedFont::load` sends everything that is not Type0 or Type3 down one path and decides by the *program* the descriptor embeds rather than by `/Subtype`, which is what makes an `OpenType`-wrapped CFF in a `/Type1` dictionary work. **This row said `partial` 'only because the bare Type 1 format of /FontFile is not read (reported, and no corpus page one reaches one)', and both halves stopped being true in the thirty-first session**: `type1.rs` reads §9.9's `/FontFile` — a whole Type 1 program, eexec and charstrings — and 57 corpus documents embed one, against the 'no corpus page one' the note claimed. Found by a sweep in the hundred-and-twenty-second session that took every `partial` note claiming an entry is unread and grepped the tree for it. `partial` now for the one thing actually left: §9.6.5's `MacExpertEncoding`, the one name Table 112 permits and Annex D's tables here do not cover. An `/Encoding` name the table does *not* permit is a different case and no longer refuses the font — see §9.6.5."

[[clause]]
clause = "9.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-font/src/cmap.rs::code_length_comes_from_the_codespace_ranges"]
note = "A simple font's codes are one byte each — `Code::single_byte`, against §9.7's variable-length codes — and there is one width per code and no writing mode 1, which is the clause's second property. The third, that a font descriptor is required except for Type 3 and certain standard Type 1 fonts, is why an absent descriptor is not an error but a substitution request."

[[clause]]
clause = "9.6.2"
title = "Type 1 fonts"
status = "implemented"
code = ["crates/pdf-font/src/cff.rs", "crates/pdf-font/src/type1.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_simple_fonts_subtype_selects_nothing", "crates/pdf-model/tests/type1.rs::a_symbolic_type1_program_draws_what_no_substitute_could"]
note = "Type 1 and MMType1 dictionaries are read and their programs drawn in both of the formats §9.9's Table 124 allows for them: the Compact Font Format of `/FontFile3 /Type1C`, and — from the thirtieth session — the original format of `/FontFile`. Both are name-keyed, which is why one encoding algorithm serves both (§9.6.5.2, `crate::name_keyed`)."

[[clause]]
clause = "9.6.2.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/type1.rs"]
test = ["crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances", "crates/pdf-model/tests/type1.rs::an_embedded_type1_program_puts_glyphs_on_the_page"]
note = "Table 109's entries that decide a rendered page: `/BaseFont` (as the substitution request), `/FirstChar` with `/Widths`, `/FontDescriptor`, `/Encoding` and `/ToUnicode`. `/Name` is deprecated in PDF 2.0 and read by nobody, which is what the deprecation asks for. The clause's closing paragraph — that a processor shall supply glyph widths and font descriptor data for the standard 14 when the entries are absent — is `standard_metrics.rs`. NOTE 1's observation that a CFF is a \"functionally equivalent representation of a Type 1 font program\" is load-bearing here rather than incidental: it is the argument for one encoding algorithm over two readers."

[[clause]]
clause = "9.6.2.2"
title = "Standard Type 1 fonts (standard 14 fonts) (PDF 1.0-1.7)"
status = "implemented"
code = ["crates/pdf-font/src/standard.rs", "crates/pdf-font/src/standard_metrics.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/standard_metrics.rs::known_widths_are_what_the_specification_says", "crates/pdf-font/src/standard_metrics.rs::the_metrics_agree_with_an_independently_drawn_metric_clone"]
note = "All fourteen names, with their published metrics compiled in, so a document that omits `/Widths` is laid out from the specification rather than from whichever face this machine happens to install. The clause asks for \"[t]hese fonts, or their font metrics and suitable substitution fonts\", and until the hundred-and-forty-eighth session only the second half was here. **Now both are**: `pdf_font::standard` compiles the fourteen font *programs* into the binary — ten bare CFF faces from PDFium's Foxit set and four Liberation Sans, 804 KB, `include_bytes!`d so they cost nothing at launch — and `substitute::find` consults them first for a `/BaseFont` naming one of the fourteen or a metric-compatible clone. So those pages render identically on every machine, and `substitute.rs` is no longer describable as the only machine-dependent code in the tree: the machine's fonts still serve every *other* non-embedded font, where their broader coverage outweighs reproducibility, with the compiled-in set behind them so that a machine with no fonts at all still draws text. The cost is measured and recorded: six oracle pages became contradicted and one agreed, because the three C references resolve a non-embedded standard-14 font through this machine's fontconfig and we were agreeing with them partly by reading their data. ADRs 0007, 0133. **A second consumer arrived in the hundred-and-sixty-sixth session and it is not a document**: `LoadedFont::standard` loads one of the fourteen against an empty `Document`, so text this program generates for *itself* — the outline panel's titles — is set in the face the clause guarantees rather than in whatever the machine has. The route is `LoadedFont::load` on an assembled `/Type1` dictionary, deliberately, so the encoding and the metrics are the same two answers a file naming `/Helvetica` gets."

[[clause]]
clause = "9.6.2.3"
title = "Multiple master fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_simple_fonts_subtype_selects_nothing"]
note = "Nothing distinguishes an MMType1 dictionary from a Type 1 one here, and the clause is why: an embedded multiple-master instance \"shall be an ordinary Type 1 font program\", a snapshot with the design coordinates already chosen. `/Subtype` is not consulted for a simple font at all, so the entry costs no code. The BaseFont naming convention the clause describes is explicitly \"not prescribed as part of this specification\", so nothing parses design coordinates out of a name."

[[clause]]
clause = "9.6.3"
title = "TrueType fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_symbol_subtable_is_addressed_through_the_high_byte_of_its_range", "crates/pdf-font/src/lib.rs::a_unicode_subtable_is_reached_through_the_adobe_glyph_list"]
note = "Both formats the clause requires — `TrueType` and `OpenType` (ISO/IEC 14496-22) — through `skrifa`, which reads glyf and CFF outlines from an sfnt alike. The clause's own content beyond that is the three differences from Table 109, and the load-bearing one is a pointer to §9.6.5.4. `/BaseFont` is used only as a substitution request, so the two ways the clause says to derive it are the producer's problem rather than a reader's."

[[clause]]
clause = "9.6.4"
title = "Type 3 fonts"
status = "implemented"
code = ["crates/pdf-model/src/type3.rs", "crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/type3.rs::each_shown_code_runs_its_glyph_description", "crates/pdf-model/tests/type3.rs::a_width_advances_through_the_font_matrix", "crates/pdf-model/tests/type3.rs::a_code_with_no_glyph_description_paints_nothing_and_still_advances", "crates/pdf-model/tests/type3.rs::a_glyph_that_shows_itself_reaches_a_bound_and_stops"]
note = "Implemented in the tenth session; before it a Type 3 font was refused. All four of the clause's steps, the CTM it defines for a glyph description, the inherited graphics state, the font's /Resources with the page's as fallback, /Widths read through /FontMatrix, and both of Table 111's operators including d1's colour restriction. /FontBBox is read by nobody, which the clause permits — it says a processor may make no assumptions from it. A glyph description whose marks are an inline image draws nothing yet and reports, which is §8.9.7's gap rather than this one's: 10 corpus documents are in that position."

[[clause]]
clause = "9.6.5"
title = "Character encoding"
status = "partial"
code = ["crates/pdf-font/src/encoding.rs", "crates/pdf-font/src/lib.rs", "crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-font/src/lib.rs::the_pdf_widths_agree_with_the_font_programs_own_advances", "crates/pdf-font/src/lib.rs::a_symbol_subtable_is_addressed_through_the_high_byte_of_its_range"]
note = "The base encodings, /Differences over them, and the symbolic/nonsymbolic distinction the clause turns on. MacExpertEncoding is the one named encoding absent: a font naming it is refused and reported rather than substituted. Every code the /Differences array names is kept even where the name is one no encoding defines, which is what §9.6.5.4's undefined-entry sentence does and does not say."

[[clause]]
clause = "9.6.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/encoding.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/encoding.rs::the_assignments_made_only_in_the_notes_are_present", "crates/pdf-font/src/lib.rs::differences_without_a_base_encoding_layer_over_the_programs_own", "crates/pdf-font/src/lib.rs::a_named_base_encoding_still_wins"]
note = "Table 112's encoding dictionary in full, and Annex D's tables for StandardEncoding, WinAnsiEncoding and MacRomanEncoding, extracted from the standard's own Table D.2 rather than written from memory. The thirtieth session found the *default* base encoding was being taken from the wrong sentence: Table 112 gives it three cases and the first is \"for a font program that is embedded in the PDF file, the default base encoding shall be the font program's built-in encoding\", with the Symbolic flag deciding only among the other two. A name-keyed embedded program was getting StandardEncoding whenever its descriptor was nonsymbolic. MacExpertEncoding is the one named encoding absent: a font naming it is refused and reported rather than substituted."

[[clause]]
clause = "9.6.5.2"
title = "Encodings for Type 1 fonts"
status = "partial"
code = ["crates/pdf-font/src/cff.rs", "crates/pdf-font/src/type1.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::an_uncovered_code_has_no_glyph_rather_than_a_guessed_one", "crates/pdf-font/src/lib.rs::a_font_with_no_encoding_entry_is_its_own", "crates/pdf-model/tests/type1.rs::a_symbolic_type1_program_draws_what_no_substitute_could"]
note = "Implemented for both Type 1 program formats, which since the thirtieth session is both of the ones Table 124 defines. The encoding's names are resolved through the program's charset, the font dictionary's `/Encoding` overrides the program's built-in one, and — the clause's second paragraph — a `/Differences` name is looked up in the charset whether or not any encoding references it. The clause's own sentence about the built-in encoding being \"an 'encoding' array that is part of the font program\" is read from the program in both formats. What is left is the closing sentence: .notdef \"shall be substituted\" when an encoding names a glyph the program lacks, and such a code reaches no glyph here — the same picture wherever .notdef is empty, a blank rather than a box where it is not, and it keeps `no character code maps to a glyph` able to fire. No corpus document distinguishes the two."

[[clause]]
clause = "9.6.5.3"
title = "Encodings for Type 3 fonts"
status = "implemented"
code = ["crates/pdf-model/src/type3.rs"]
test = ["crates/pdf-model/tests/type3.rs::each_shown_code_runs_its_glyph_description", "crates/pdf-model/tests/type3.rs::a_code_with_no_glyph_description_paints_nothing_and_still_advances"]
note = "The mapping is taken entirely from the font's /Encoding, and there is no default glyph name — a code the encoding does not name reaches nothing, as the clause's NOTE requires. /BaseEncoding is read underneath /Differences because Table 112 defines it for any encoding dictionary; there is no built-in encoding to fall back on, since §9.6.5.1 excepts Type 3 fonts from having one."

[[clause]]
clause = "9.6.5.4"
title = "Encodings for TrueType fonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::a_symbol_subtable_is_addressed_through_the_high_byte_of_its_range", "crates/pdf-font/src/lib.rs::a_unicode_subtable_is_reached_through_the_adobe_glyph_list", "crates/pdf-font/src/lib.rs::a_suffixed_glyph_name_reaches_the_program_rather_than_its_base_letter"]
note = "All five routes from a code to a glyph, implemented in the eighth session — see ADR 0015. The predecessor was one line that covered about one and a half of them and was worth 15 contradicted corpus pages. **The last of the five was reached by nothing until the forty-second session**, and both halves of the reason are worth keeping. The clause maps a glyph name to Unicode \"by consulting the Adobe Glyph List and Adobe Glyph List for New Fonts\", which are *lists*, and no entry in either contains a FULL STOP — but `read_fonts` implements the wider Adobe Glyph List *Specification*, whose algorithm for an unlisted name strips everything after the first period, so `o.sc` answered `o` and hid the clause's next sentence behind a real letter. And that next sentence names \"the font program's `post` table (if one is present)\", which a CFF-based OpenType does not have in any useful sense: `issue215.pdf`'s `OTTO` carries a version 3.0 `post`, which by definition holds no names, and names every glyph in its `CFF ` charset instead — the same structure by another name, §9.6.2.1's NOTE 1 again. With both read, the page draws the small capitals its own `/ToUnicode` says it means (ADR 0050). **And the clause's opening sentence binds the substitution path, which it did not reach until the hundred-and-ninety-seventh session.** \"If the font has a named Encoding entry of either MacRomanEncoding or WinAnsiEncoding , or if the font descriptor's Nonsymbolic flag (see \\\"Table 121 -Font flags\\\") is set, the PDF processor shall create a table that maps from character codes to glyph names\" — and a substituted font built its table from the *substitute's* character set instead, because `substitute::Request` picked the standard-14 `Symbol` off a name containing the word and `substitute_code_table` then took its encoding from that family. `issue8697.pdf` drew Greek where the file states WinAnsi and Table 121's Nonsymbolic bit. The two conditions are read in `substitute::states_latin_codes`, and the same statement holds for a Type 1 program by §9.6.5.2's \"An Encoding entry in the PDF font dictionary, if present, shall override a Type 1 font's mapping from character codes to character names\". ADR 0158."

[[clause]]
clause = "9.7"
title = "Composite fonts"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::the_cid_widths_agree_with_the_font_programs_own_advances"]
note = "Aggregate of the seventeen rows below, reviewed as a family in the twentieth session (ADR 0029). A Type 0 font is two independent mappings and both are now read: §9.7.6.2's CMap from codes to CIDs, embedded (§9.7.5.3) or Identity, and §9.7.4.2's CID to glyph index, through a CID-keyed CFF's charset or a /CIDToGIDMap stream. What is left is data rather than code — Table 116's seventy-odd predefined CMaps, refused by name on 15 corpus fonts — and vertical writing, which is §9.2.4's missing /W2 metrics rather than this clause's."

[[clause]]
clause = "9.7.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_utf8_shaped_codespace_yields_codes_of_several_lengths"]
note = "The clause's one requirement of a processor is the sentence that separates a composite font from a simple one: \"for composite fonts, a sequence of one or more bytes are decoded to select a glyph from the descendant CIDFont\". `LoadedFont::decode` returns a `Code` carrying its own byte length for exactly that reason, and the one-descendant limitation the clause states is why only `/DescendantFonts`' first element is read."

[[clause]]
clause = "9.7.2"
title = "CID-Keyed fonts overview"
status = "inapplicable"
note = "Architecture rather than requirement: it introduces CIDs, character collections and the CMap/CIDFont split, and every normative sentence it contains is restated with effect in §9.7.3 to §9.7.6. Its one processor-facing statement — that a CMap's mapping \"yields a font number (which in PDF shall be 0)\" — is §9.7.6.2's, and is honoured there by reading only the first descendant."

[[clause]]
clause = "9.7.3"
title = "CIDSystemInfo dictionaries"
status = "inapplicable"
note = "`/CIDSystemInfo` identifies the character collection a CMap and a CIDFont share, and the clause's requirements are on the *file*: \"In order for a CIDFont and a CMap to be compatible, their Registry and Ordering values shall be the same.\" A renderer that takes both from the same file has nothing to decide — the CIDs it resolves come from that file's own CMap and are looked up in that file's own CIDFont, so a mismatch cannot change which glyph is drawn. It would matter for a *predefined* CMap, where the collection is external; that is §9.7.5.2's gap, and this row will need revisiting with it."

[[clause]]
clause = "9.7.4"
title = "CIDFonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Table 115's `CIDFont` in full for what it decides about a drawn page: both subtypes, both glyph-selection routes (§9.7.4.2), and both sets of metrics (§9.7.4.3). `/CIDSystemInfo` is read only to the extent §9.7.5.2's compatibility rule needs, since an embedded program's own charset is what actually selects the glyph."

[[clause]]
clause = "9.7.4.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::the_cid_widths_agree_with_the_font_programs_own_advances"]
note = "Table 115. `/Subtype`, `/CIDSystemInfo`, `/FontDescriptor`, `/DW`, `/W` and `/CIDToGIDMap` are read; `/DW2` and `/W2` are not, and a font whose CMap asks for vertical writing is refused before they would be needed. The clause's prohibitions are on the file rather than on a reader — a CIDFont \"may not be used as the operand of the Tf operator\" — and are satisfied by construction, because nothing reaches a descendant except through its Type 0 parent."

[[clause]]
clause = "9.7.4.2"
title = "Glyph selection in CIDFonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::the_cid_widths_agree_with_the_font_programs_own_advances"]
note = "All four routes, in the twentieth session (ADR 0029). A CID-keyed CFF goes through its charset; a CFF whose Top DICT has no CIDFont operators, and a TrueType with `/CIDToGIDMap /Identity` or none, take the CID as the glyph index; a `/CIDToGIDMap` stream is read as Table 115's two big-endian bytes at 2c. Two findings. The route is chosen by what the *program* is, not by `/Subtype`, because a CIDFontType0 may arrive as a CFF inside an OpenType wrapper. And an explicit `/CIDToGIDMap` stream outranks \"the CIDs shall be used directly as GID values\": Table 115 conditions the entry's presence on Type 2 and defines its meaning unconditionally, and `issue7901.pdf` — a CIDFontType0 wrapping a name-keyed CFF and carrying such a stream — drew garbage under the other reading where four renderers draw its sentence. The clause's own rule for a non-embedded program is honoured too: the entry \"shall be ignored\", and a substituted font reaches glyphs through `/ToUnicode` instead."

[[clause]]
clause = "9.7.4.3"
title = "Glyph metrics in CIDFonts"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Both arrays and both defaults. `/W` and `/DW` in the twentieth session, `/W2` and `/DW2` in the thirty-sixth — the same two formats one field wider, with Table 122's default `/DW2` of `[880 -1000]` and the clause's rule that `v`'s horizontal component is half the glyph's width. \"Specifying a given CID value more than once should not be done. In the case where it is done, the first specification is the one that shall be used\" holds for both, by `or_insert`."

[[clause]]
clause = "9.7.5"
title = "CMaps"
status = "partial"
code = ["crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_one_byte_codespace_range_makes_one_byte_one_code"]
note = "Aggregate of the four below. An embedded CMap file is read in full; the two Identity CMaps are built; the other predefined names are refused because their data is not in the tree."

[[clause]]
clause = "9.7.5.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/cmap.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_vertical_cmap_takes_the_second_set_of_metrics"]
note = "Both of the two forms the clause names are recognised — a predefined name and a stream — and a CMap yields \"CIDs in a CIDFont\", which is what `CMap::cid` returns. The writing mode is read from the file's own /WMode and from Table 118's, and the clause makes it decide \"which metrics shall be used\" — §9.7.4.3's /W2 and /DW2, which `Vertical::read` has read since the thirty-sixth session, so mode 1 is **drawn** and the row's own named test is what draws it. **This note said /W2 was unread and mode 1 refused for eighty-five sessions after it stopped being**, and so did `composite_cmap`'s own doc comment; both were corrected in the hundred-and-twenty-second, along with two claims in the handover that had inherited it — a retired claim in four places, which is the shape ADR 0101 named. Both of Table 119's forms are now resolved in full: a predefined name reaches `pdf_font::predefined`, which has carried §9.7.5.2's registered data since the hundred-and-fifty-sixth session, and the 13 corpus fonts that named one — of which exactly **one** names a vertical CMap — are drawn rather than refused."

[[clause]]
clause = "9.7.5.2"
title = "Predefined CMaps"
status = "implemented"
code = ["crates/pdf-font/src/cmap.rs", "crates/pdf-font/src/predefined.rs"]
test = ["crates/pdf-font/src/predefined.rs::the_collections_the_clause_requires_are_carried", "crates/pdf-font/src/predefined.rs::every_carried_cmap_states_a_codespace_and_a_mapping"]
note = "Table 116's two Identity CMaps are built here — as one two-byte range rather than 65 536 entries, which is what the table's own sentence describes — and **every other name is data, which this binary has carried since the hundred-and-fifty-sixth session**. `data/cmaps/` holds all 239 files Adobe publishes for the six character collections, `build.rs` deflates each on its own and `pdf_font::predefined` inflates one when a document names it, so the clause's \"A PDF processor shall support Adobe-CNS1-7, Adobe-GB1-5, Adobe-Japan1-7 and Adobe-KR-9 character collections\" is met rather than refused. The `usecmap` chains inside the files are followed by name, which is how a vertical CMap inherits its horizontal twin's mappings. This row was `partial` for a hundred and fifty sessions on the grounds that vendoring was \"a licensing decision rather than a coding one\" — it was, the decision was taken in the hundred-and-thirtieth session and recorded in the handover, and what was left was the work. Thirteen corpus fonts stopped being refused; fifteen documents came off the incomplete list, and the two that draw a non-embedded Japanese face now differ from the references about *which* face rather than about what to draw."

[[clause]]
clause = "9.7.5.3"
title = "Embedded CMap files"
status = "implemented"
code = ["crates/pdf-font/src/cmap.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_one_byte_codespace_range_makes_one_byte_one_code"]
note = "Table 118 in full, in the twentieth session (ADR 0029): the stream's data is parsed by `CMap::parse`, `/WMode` is read and checked against the file's, and `/UseCMap` is followed for a stream and refused for a predefined name whose data the tree lacks. A stream that states no codespace ranges, or no character mappings, is refused and named rather than drawn as a page of .notdef. §9.7.5.4 a)'s companion rule is enforced: a `usecmap` operator with no `/UseCMap` entry beside it names a CMap that cannot be found, so the font is refused."

[[clause]]
clause = "9.7.5.4"
title = "CMap example and operator summary"
status = "partial"
code = ["crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_bfchar_in_an_encoding_cmap_selects_a_cid"]
note = "Four of the clause's five constraints are honoured. a) a usecmap reference with no /UseCMap entry is refused. b) a font number other than 0 cannot arise, since only the first descendant is read. d) notdef mappings are implemented, and a notdefrange gives its whole range one CID rather than consecutive ones — which ISO 32000-2 leaves to Adobe Technical Note #5014 and §9.7.6.3's purpose for the mapping implies. e) `beginrearrangedfont` and `beginusematrix` are not implemented and no corpus CMap writes one; an unrecognised keyword ends the current section, so their operands are discarded rather than misread. The row stays `partial` for c): \"beginbfchar and endbfchar shall not appear in a CMap that is used as the Encoding entry of a Type 0 font\", and `bug920426.pdf` writes an Encoding CMap whose only mappings are bfchar lines. §9.7.6.2's own account of the decoding algorithm names bfchar among the character mappings, so the two subclauses disagree and the one describing what a processor does is followed: the destination is read as a character selector, and the page draws its sentence instead of nothing."

[[clause]]
clause = "9.7.6"
title = "Type 0 font dictionaries"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_one_byte_codespace_range_makes_one_byte_one_code"]
note = "Aggregate of the three below. Table 119's entries are read; the decoding algorithm and its undefined-character rules are implemented; what is missing is the predefined CMap data §9.7.5.2 owns."

[[clause]]
clause = "9.7.6.1"
title = "General"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_predefined_cmap_is_resolved_by_name"]
note = "Table 119. `/Encoding` in both forms, `/DescendantFonts`' single element, and `/ToUnicode`. `/BaseFont` is deliberately unread for a Type 0 font: the clause's own NOTE calls it \"an arbitrary name, since there is no font program associated directly with a Type 0 font dictionary\", so the descendant's descriptor is what substitution is derived from."

[[clause]]
clause = "9.7.6.2"
title = "CMap mapping"
status = "implemented"
code = ["crates/pdf-font/src/cmap.rs"]
test = ["crates/pdf-model/tests/composite_fonts.rs::a_utf8_shaped_codespace_yields_codes_of_several_lengths", "crates/pdf-font/src/cmap.rs::a_codespace_range_is_matched_byte_by_byte"]
note = "The whole algorithm, in the twentieth session (ADR 0029). Codespace ranges decide how many bytes the next code takes, shortest first; a code is matched against a range *byte by byte* rather than on its value, which is what makes a UTF-8-shaped CMap work and which no corpus document can distinguish — the numeric reading changes no page of the 1794 compared, so the synthetic test named above is the only thing holding the clause to its words. A code is then looked up \"in the character code mappings for codes of that length\", so `Code` carries its length and every table is indexed by it; failing that, in the notdef mappings. The font number is 0 by construction."

[[clause]]
clause = "9.7.6.3"
title = "Handling undefined characters"
status = "implemented"
code = ["crates/pdf-font/src/cmap.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/cmap.rs::an_unmatched_first_byte_consumes_the_shortest_code", "crates/pdf-font/src/cmap.rs::a_partial_match_consumes_that_ranges_length"]
note = "All four of the clause's rules. A code with no character mapping falls to the notdef mappings and then to CID 0; a CID whose glyph the CIDFont lacks does the same, which is also the clause's sentence about a /CIDToGIDMap stream too short for the CID. An *invalid* code — one matching no codespace range — skips the character mappings entirely, because the clause sends it straight to a substitute, and the modified algorithm decides how many bytes it consumes: the longest partial match, ties to the shortest codes, and the shortest codes outright where even the first byte matches nothing. That last rule is where two references depart from us: `issue11768_reduced.pdf` writes a one-byte `begincidchar <e0>` under a UTF-8 codespace that admits no one-byte code above 7F, so each `e0` is invalid and consumes the three bytes its partial match implies. mupdf and ghostscript take the mapping's own length and draw three hyphens; poppler and this tree follow the clause. The standard would not have written this recovery algorithm if a mapping's length were meant to override the codespace."

[[clause]]
clause = "9.8"
title = "Font descriptors"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero", "crates/pdf-font/src/lib.rs::the_symbolic_flag_changes_nothing_for_an_embedded_program"]
note = "The descriptor is read for the three things that decide a rendered page — which program is embedded, whether the font is symbolic, and what an uncovered code's width is — and for the four attributes that choose a substitute face. The dimensional metrics are read by nobody, because this tree selects an installed face rather than synthesising one from them. The clause's own restriction, that a descriptor shall not be used with a Type 0 font, is satisfied by construction: `load_composite` reads the *descendant's* descriptor and never the outer dictionary's."

[[clause]]
clause = "9.8.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero", "crates/pdf-font/src/lib.rs::a_stated_missing_width_is_the_width"]
note = "Of Table 120: `/Flags`, `/MissingWidth`, `/FontFile`, `/FontFile2`, `/FontFile3`, `/FontWeight` and `/ItalicAngle` are read. `/MissingWidth` had the wrong default — Table 120 says 0 and this tree assumed half an em, which opened six half-ems of invented space on `issue7439.pdf`, a page the reference consensus contradicted and now agrees with. Unread, and each because this tree picks an installed face rather than building one: `/FontFamily`, `/FontStretch`, `/FontBBox`, `/Ascent`, `/Descent`, `/Leading`, `/CapHeight`, `/XHeight`, `/StemV`, `/StemH`, `/AvgWidth`, `/MaxWidth`. `/CharSet` is deprecated in PDF 2.0 and states nothing a charset does not."

[[clause]]
clause = "9.8.2"
title = "Font descriptor flags"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/lib.rs::the_symbolic_flag_changes_nothing_for_an_embedded_program"]
note = "Table 121's Symbolic bit is the one that decides a rendered page, through §9.6.5.4, and this subclause is what settles a font that sets it *and* Nonsymbolic — which Table 121 forbids in the same sentence and `issue20232.pdf` does anyway: \"A PDF processor should always check the Symbolic flag to determine whether the state is Symbolic or NonSymbolic.\" `is_symbolic` reads bit 3 alone, which is that sentence. FixedPitch, Serif, Italic, ForceBold and — since the hundred-and-ninety-seventh session — **Nonsymbolic** reach `substitute.rs`; Script, AllCap and SmallCap are read by nobody and would only refine a substitute's choice. Nonsymbolic is here because this subclause says outright what it is for: \"This influences the font's default base encoding and may affect a PDF processor's font substitution strategies.\" A `/BaseFont` whose *name* merely contains the word — `/SegoeUISymbol` — was selecting the standard-14 `Symbol`, whose glyphs carry no Latin name, over a descriptor stating bit 6 and an `/Encoding` of `WinAnsiEncoding`; §9.6.5.4 states those two conditions disjunctively and makes the Latin code-to-name table a `shall`. ADR 0158. ForceBold's own rule is a *may* about thickening at small sizes, which this device does not do."

[[clause]]
clause = "9.8.3"
title = "Font descriptors for CIDFonts"
status = "partial"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero"]
note = "A CIDFont's descriptor is read exactly as a simple font's is, for its embedded program and its flags — Table 120 governs both, which is what this subclause says before adding to it. See §9.8.3.1 for Table 122's four additional entries, none of which is read."

[[clause]]
clause = "9.8.3.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-font/src/lib.rs::an_absent_missing_width_is_zero"]
note = "Table 120 applies to a CIDFont's descriptor and is read as far as §9.8.1 records. None of Table 122's four entries is: `/Style` and `/FD` describe glyph classes for building a substitute, `/Lang` is a language tag nothing here consults, and `/CIDSet` is deprecated in PDF 2.0 and states which CIDs a subset holds — which the embedded program already states, by having them. For an embedded CIDFont, which is what every corpus CIDFont that draws is, none of the four can change a glyph."

[[clause]]
clause = "9.8.3.2"
title = "Style"
status = "implemented"
code = ["crates/pdf-font/src/panose.rs", "crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/panose.rs::the_clauses_own_example_classifies_a_light_serif_face", "crates/pdf-font/src/panose.rs::the_digits_boundaries_are_panoses_own", "crates/pdf-model/tests/panose.rs::a_panose_number_changes_the_substitute_for_some_fonts_and_not_others"]
note = "The `/Style` dictionary, of which \"[o]nly the Panose entry is defined\", read as the twelve bytes §9.8.3.2 states — two of OS/2 family class, ten of PANOSE — and applied to substitution. The *meaning* of those ten digits is not in this standard: §9.8.3.2 hands it to Hewlett-Packard's PANOSE Classification Metrics Guide and to Microsoft's TrueType specification, both clause 2 normative references, which is why `panose.rs` cites them by name and reads only the four digits this program can act on — family type, serif style, weight, proportion. Where the classification and Table 121's `/Flags` disagree, **the classification wins**, and the corpus shows why: `noembed-eucjp.pdf` and `noembed-sjis.pdf` name MS-Gothic, a Japanese sans-serif face, with flags claiming serif *and* fixed pitch *and* both Symbolic and Nonsymbolic, while the PANOSE number says Latin Text, Normal Sans. Those two documents are the only ones of the 974 whose substitute the entry changes, measured by deriving each request twice — once with the entry and once with it removed. Serifs decide before proportion, which is a **documented choice**: advances come from `/Widths` or `/W` whenever the file states them, so the shape is what a substitute has to get right. 46 fonts reach a descriptor with a `/Style`; 44 of the values are twelve bytes and two are a producer's own length."

[[clause]]
clause = "9.8.3.3"
title = "FD"
status = "partial"
code = ["crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-model/tests/panose.rs::the_corpuss_one_glyph_class_dictionary_states_what_the_clause_forbids"]
note = "`/FD` is read as the classes it names and their overriding descriptors, and is applied to nothing — the boundary is stated in the clause rather than chosen here. \"[T]he names of the glyph classes depend on the character collection, as identified by the Registry , Ordering , and Supplement entries in the CIDSystemInfo dictionary\", so knowing which *CIDs* a class holds means having the collection itself, which is registered data published outside this standard: the same boundary Table 116's predefined `CMap`s sit behind, and the same licensing decision. What the entry is *for* is building a substitute — \"a more accurate substitution font can be created\" — and this tree selects an installed face instead (ADR 0007). **The clause also contradicts itself, and the corpus's one witness proves it**: such a descriptor \"shall contain entries for metric information only; it shall not include FontFile , FontFile2 , FontFile3 , or any of the entries listed in [Table 120]\", and every metric a descriptor can state is in Table 120. `issue13147.pdf`'s `/FD << /Proportional … >>` — the class the clause itself recommends — holds ten Table 120 entries, because there is nowhere else to put metrics. Nothing here enforces the restriction, and the test records why."

[[clause]]
clause = "9.9"
title = "Embedded font programs"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/type1.rs", "crates/pdf-font/src/cff.rs"]
test = ["crates/pdf-model/tests/type1.rs::a_symbolic_type1_program_draws_what_no_substitute_could", "crates/pdf-font/src/lib.rs::a_simple_fonts_subtype_selects_nothing"]
note = "All three of Table 124's keys are read and every format it lists is drawn: `/FontFile` (bare Type 1, from the thirtieth session), `/FontFile2` (TrueType), and `/FontFile3` in all three of its subtypes. Which reader applies is decided by the program's own leading bytes rather than by the key or by Table 125's `/Subtype`, because a signature cannot be mislabelled by a producer and the clause's pairings can."

[[clause]]
clause = "9.9.1"
title = "General"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/type1.rs"]
test = ["crates/pdf-model/tests/type1.rs::an_embedded_type1_program_puts_glyphs_on_the_page"]
note = "Table 124 in full; see §9.9. **A `ttcf` container in a `/FontFile2` is read since the hundred-and-fifty-seventh session** (`pdf_font::collection`, ADR 0141): Table 127 states \"TrueType font program\" and a collection is not one, so the file is malformed and two corpus documents write one anyway — the face is chosen by Table 122's `/FontName`, which §9.6.2.1 makes \"the PostScript name of the font\" and every face in a collection carries. Two of the clause's rules are satisfied by having nothing that could break them: a Type 1 program's `PaintType` \"shall be ignored\" and the text rendering mode decides filling or stroking, which is where §9.3.6 already puts it; and the `vhea` and `vmtx` tables \"shall never be used by a PDF processor\", which nothing here reads. Table 125's `/Length1`, `/Length2` and `/Length3` are read by nobody: `read-fonts` finds the eexec boundary in the bytes, and the clause's one requirement on a processor — that a `/Length3` of 0 means the 512 zeros and `cleartomark` \"shall be added by the PDF processor\" — is about a fixed-content portion that holds no glyph description, so appending it would change no outline. That is the partial: a stated requirement not executed, with the reason it cannot show written down rather than assumed."

[[clause]]
clause = "9.9.2"
title = "Font subsets"
status = "implemented"
code = ["crates/pdf-font/src/substitute.rs"]
test = ["crates/pdf-font/src/substitute.rs::a_subset_prefix_is_removed_only_when_it_is_one"]
note = "The subset tag is what a `/BaseFont` means to a substitution request, and `strip_subset_prefix` applies the clause's rule exactly — \"exactly six uppercase letters\" followed by a plus sign — rather than splitting on the first `+`, so a face genuinely named with one keeps its name. Nothing else in the clause asks anything of a reader: recognising subsets to merge documents is a writer's job, and `.notdef`'s presence is a requirement on the file."

[[clause]]
clause = "9.10"
title = "Extraction of text content"
status = "partial"
code = ["crates/pdf-font/src/lib.rs", "crates/pdf-font/src/tounicode.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs"]
note = "Text extraction, done here as a *readback of what was drawn*: `Interpretation::text` is accumulated by the same loop that places the glyphs, so it cannot describe a code the page did not show, and `text_extraction.rs` holds it to 100% of the words `pdftotext` finds over the fourteen specification PDFs. All three of §9.10.2's methods are implemented since the hundred-and-fifty-sixth session, the third having waited on Table 116's registered `CMap` data."

[[clause]]
clause = "9.10.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/content.rs", "crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs::the_text_we_draw_agrees_with_an_independent_extractor"]
note = "The information content of text as against its rendered appearance — two questions, and the clause's insistence that they are two is what `Interpretation` follows in carrying `text` and `glyphs` as separate facts. A page can draw perfectly and extract nothing, which is also why the oracle asks the second when choosing a tolerance and got worse answers for eight sessions when it asked the first. The clause names one route this tree does not take: `/ActualText` on a marked-content sequence, which is §14.9.4's and belongs to tagged PDF."

[[clause]]
clause = "9.10.2"
title = "Mapping character codes to Unicode values"
status = "implemented"
code = ["crates/pdf-font/src/lib.rs"]
test = ["crates/pdf-model/tests/text_extraction.rs::the_text_we_draw_agrees_with_an_independent_extractor_across_the_pdfjs_corpus"]
note = "Three methods \"in the priority given\", and `LoadedFont::text` is that list in that order. **Since the sixty-third session the whole pdf.js corpus is the test rather than the 14 specification PDFs**: 974 documents against `pdftotext`, 96.5% of its words found over the pages we draw completely, with 46 named and grouped — 31 of them fonts where all three methods fail and the clause says so in as many words, 7 right-to-left scripts read back in painting order, and 8 nobody has diagnosed. First `/ToUnicode`. Then, for a simple font, the glyph name the encoding selected, looked up in the Adobe Glyph List (`read_fonts::ps::agl`) — which is why `glyph_names` is kept after loading rather than discarded. **The third landed in the hundred-and-fifty-sixth session**, when the registered data arrived (§9.7.5.2): steps a) to e) are `LoadedFont::text`'s middle branch — the font's CMap gives a CID, the descendant's `/CIDSystemInfo` gives a registry and an ordering, and `pdf_font::predefined::cid_to_unicode` reads the `registry-ordering-UCS2` file those name. It applies to an embedded composite font as much as to a substituted one, because the collection says what a CID means whether or not the program defining it is present. The corpus readback went 97.9% to 98.2% and the documents below the 0.90 floor 42 to 36. **The priority is load-bearing and one page shows why.** `issue11740_reduced.pdf`'s `/ToUnicode` records the Windows-1251 *bytes* of its Russian text as Latin-1 code points, so method one returns mojibake where method two would have returned the characters — and the clause still puts the producer's own statement first. That is right for extraction and wrong for *drawing*, which is the distinction §9.10.1 draws and the reason a substitute addressed through `/ToUnicode` is now a last resort behind §9.7.4.2's own glyph route (ADR 0049). Where all three fail the clause does not stop there: it says \"there is no way to determine what the character code represents in which case a PDF processor may choose a character code of their choosing\", and the sixty-fourth session took that permission. `text_from_program` names the glyph the way the *program* does — the `post` table's name through the Adobe Glyph List, or the Unicode `cmap` subtable inverted — which is a choice made from the file's own data rather than a guess, and is the same instrument §9.6.5.4's last resort uses for the forward direction. It cannot invent text: a `post` of version 3.0 holds no names, `issue15910.pdf`'s version 2.0 holds 79 empty ones, and a name outside the list answers nothing. **Measured rather than assumed**: over the pdf.js corpus the readback went 96.5% to 97.8% of `pdftotext`'s words and no document moved the other way, which is what says this is not the fallback-that-fills-the-page. Three documents left the text gate's list. All three of the clause's methods and its permission are now implemented; what remains below 100% is named in the gate's own output rather than by an unbuilt method. **And the third method is only half of reaching a substitute, which the hundred-and-eighty-second and -third sessions found together.** A character it produces has to be *drawn*, and `substitute::installed` ranks faces by the generic family a descriptor implies, which cannot say \"this one must have Chinese in it\": ten corpus documents got a Latin face with no glyph for anything they show, eight of them blank pages, and nothing reported it. `LoadedFont::uncovered_character` reports it now, per font and only where the face drew none of what it was asked for (ADR 0152); `substitute::installed_covering` then chooses the widest-repertoire face on the machine that can draw a character of the collection's own script, which is a **choice** in the one place §9.10.2 leaves for it — the clause says how to learn what a code means and nothing about which face to draw it with (ADR 0153). Eight of the ten now draw and seven more oracle pages agree. **And the condition the code applied was not the condition ADR 0152 stated, which the hundred-and-ninety-third session found and corrected.** The tally counted a *hit* for every code that reached no outline and was not one of §9.10.2's uncovered characters — a space, in practice — so the rule it actually applied was \"this font misses a character and shows no space\", and the rule it claimed was \"the face drew none of what it was asked for\". Correcting it costs the two documents that were left on this list — `issue11555.pdf` and `issue2128r.pdf` draw most of their text, and both pages **agree with the reference consensus**, so what they carried was an overstatement — and it buys four documents whose text is genuinely absent, which `silent_fonts.rs` holds by name. A font that draws *some* of its characters and misses others is still not reported, which is the trap-11 trade ADR 0152 argued and the gap \"a font is reported as a whole\" names."

[[clause]]
clause = "9.10.3"
title = "ToUnicode CMaps"
status = "implemented"
code = ["crates/pdf-font/src/tounicode.rs"]
test = ["crates/pdf-font/src/tounicode.rs::ranges_map_to_consecutive_characters", "crates/pdf-font/src/tounicode.rs::surrogate_pairs_decode_to_one_character", "crates/pdf-font/src/tounicode.rs::a_huge_range_is_stored_as_a_range_rather_than_expanded"]
note = "`/ToUnicode` as a `CMap`: `beginbfchar` and `beginbfrange` in both of the latter's forms — a consecutive span and an explicit array — with values decoded as UTF-16BE including surrogate pairs, and each code's length taken from the codespace ranges, which the clause requires to be \"consistent with the encoding that the font uses\". Table 118's `/UseCMap` is read, and the clause calls it \"[t]he only pertinent entry\" in the stream dictionary. A `bfrange` is kept **as a range** rather than expanded, deliberately: one `<0000> <FFFF>` line would otherwise allocate sixty-five thousand strings from a few bytes, which is a decompression bomb wearing a font's clothes. A malformed `CMap` yields what was read before the damage, so extraction degrades to missing characters rather than to silence."

[[clause]]
clause = "10.1"
title = "General"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs", "crates/render-cpu/src/lib.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "Introductory, and its four steps are the map of this clause: convert to the device's native space (§10.3, §10.4), apply transfer functions (§10.5, deprecated and inapplicable here), scan-convert (§10.7), halftone if the device does (§10.6, inapplicable). Three of the four are answered in the rows below; the one this tree does is the first and the third."

[[clause]]
clause = "10.2"
title = "Raster output device native colour"
status = "implemented"
code = ["crates/pdf-model/src/colour.rs"]
test = ["crates/pdf-model/tests/colour_paths.rs::a_cmyk_colour_is_the_same_however_it_is_drawn"]
note = "This device's native colour space is RGB and it has no spot colourants, which is the fact §8.6.7 and §11.7.4's Table 146 are read against — see ADR 0028, where it makes overprinting Normal rather than a gap. \"Colours specified in any device or CIE-based colour space shall be rendered as process colours\" is `ColourSpace::to_rgb`, the one route from any space to a pixel."

[[clause]]
