[[clause]]
clause = "8.9.6"
title = "Masked images"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "Aggregate of the four below. The image's own /ImageMask (stencil masking) and /SMask are implemented; /Mask in either of its forms is not, and is reported."

[[clause]]
clause = "8.9.6.1"
title = "General"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs"]
note = "Names four masking mechanisms. Two are implemented — /ImageMask (§8.9.6.2) and, from the transparent imaging model, /SMask and /SMaskInData — and two are not: /Mask as an explicit mask (§8.9.6.3) and as a colour-key range (§8.9.6.4)."

[[clause]]
clause = "8.9.6.2"
title = "Stencil masking"
status = "partial"
code = ["crates/pdf-model/src/image.rs"]
test = ["crates/pdf-model/tests/image_masks.rs::a_zero_sample_paints_the_current_colour_and_a_one_leaves_the_page_alone", "crates/pdf-model/tests/image_masks.rs::a_decode_array_of_one_zero_reverses_the_stencil"]
note = "The three differences the clause states are implemented: no /ColorSpace is consulted, /BitsPerComponent is forced to 1, and /Decode [0 1] against [1 0] decides which sample value marks the page. What is not implemented is the last sentence: interpolation (§8.9.5.3) should smooth a low-resolution stencil's edges, and /Interpolate is read nowhere in this tree."

[[clause]]
clause = "8.9.6.3"
title = "Explicit masking"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/render_real_pdf.rs::an_image_mask_we_do_not_apply_is_reported"]
note = "Not implemented. An image carrying /Mask is reported as `Image { name: \"<name>: /Mask\" }` and its base image is drawn unmasked, so the page is visibly wrong but says so. 5 corpus first pages."

[[clause]]
clause = "8.9.6.4"
title = "Colour key masking"
status = "reported"
code = ["crates/pdf-model/src/content.rs"]
test = ["crates/pdf-model/tests/render_real_pdf.rs::an_image_mask_we_do_not_apply_is_reported"]
note = "Not implemented, reported by the same check as §8.9.6.3 — the interpreter reports /Mask without distinguishing the stream form from the array form. The range test is against the samples *before* decoding, so implementing it means reaching into the unpacker rather than post-processing the RGBA it produces."

