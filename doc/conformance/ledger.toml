code = ["crates/pdf-model/src/annotation.rs"]
test = ["crates/pdf-model/tests/annotations.rs::the_hidden_and_no_view_flags_draw_nothing_and_report_nothing"]
note = "Table 167's three flags that decide whether a screen shows the annotation are honoured: Hidden and NoView suppress it, and Invisible suppresses it only for a subtype outside Table 171, which is the condition the flag's own wording places on it. Print is a printing decision this viewer does not yet make. NoZoom and NoRotate make an appearance's size or orientation depend on the view, which a resolution-independent display list cannot express — neither is applied nor reported. ReadOnly, Locked, ToggleNoView and LockedContents constrain user interaction, which does not exist yet."

