[package]
name = "pdf-viewer-fuzz"
description = "Fuzz targets for the PDF parser."
version = "0.0.0"
edition = "2024"
publish = false

# Not a workspace member: cargo-fuzz builds this with its own profile and sanitiser
# settings, and including it would apply those to the whole workspace.
[workspace]

# The tree's lint levels, restated rather than inherited — `[lints] workspace = true` resolves
# against *this* workspace, and cargo has no way for one workspace to take another's table. So the
# copy is unavoidable and the drift it invites is what `tools/conformance/tests/workspaces.rs`
# closes: it parses both manifests and fails on any lint the two tables state differently. ADR
# 0742; until the eight-hundred-and-tenth session `clippy` had never judged a fuzz target at all.
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdf-syntax = { path = "../crates/pdf-syntax" }
pdf-font = { path = "../crates/pdf-font" }
pdf-model = { path = "../crates/pdf-model" }
# ADR 0607's payload is a `pdf_render::DisplayList`, so the target that fuzzes its decoder needs
# the vocabulary to state what a decoded list must satisfy — see `display_list.rs`.
pdf-render = { path = "../crates/pdf-render" }
# The confined viewer's transport, whose *decoders* this fuzzes. A fuzz target cannot reach a
# private module, which is why `viewer_confined::wire` is public — see that module.
viewer-confined = { path = "../crates/viewer-confined" }
viewer-core = { path = "../crates/viewer-core" }

[profile.release]
debug = true
# Overflow checks stay on: an arithmetic bug that wraps silently is exactly what fuzzing
# should surface, and in a release profile it would otherwise pass unnoticed.
overflow-checks = true

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

