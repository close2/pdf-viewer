[package]
name = "pdf-media-worker"
description = "A sound's samples decoded in a confined process of its own, started at the first sound played (RFC 0015 section 5)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The wire under the worker, shared with every other confined worker: a kind byte, a length, a
# greeting that carries what the kernel granted, and the supervision that can kill the child (ADR
# 0846). What crosses it is this crate's vocabulary and nobody else's.
confined-transport.workspace = true
# `Profile::Media`, the confinement the worker applies to itself, and the processor-time allowance
# the host waits for each request under (ADRs 3133, 3297).
pdf-sandbox.workspace = true
thiserror.workspace = true
# ISO/IEC 14496-3's AAC decoder, the scalar build, for a rendition's MP4 clip (ADR 3382). It is
# reached only from the worker's half; the host's half reads no byte of the stream.
rusty_aac.workspace = true
# ITU-T H.264's decoder, the scalar build, for an MP4 clip's video track (ADR 3526). It is reached only
# from the worker's half, like the AAC decoder.
rusty_h264-decoder.workspace = true
# The first statement of the program this crate builds closes the descriptors it inherited; the
# close and its one `unsafe` are that crate's, so the program has none of its own (ADRs 1945, 3361).
inherited-descriptors.workspace = true

[[bin]]
name = "pdf-media-worker"
path = "src/bin/pdf-media-worker.rs"

[lints]
workspace = true
