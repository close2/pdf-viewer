[package]
name = "viewer-core"
description = "Toolkit-independent application logic."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pdf-model.workspace = true
pdf-render.workspace = true
pdf-syntax.workspace = true

[dev-dependencies]
render-cpu.workspace = true
test-scenes.workspace = true
# The accessibility census walks every page of every document this project holds; rule 4 forbids
# this crate threads it was not handed, and a test that runs it over a corpus is not the crate.
rayon.workspace = true
# The selection census asks poppler where the words are, through the same cached invocation
# `pdf-model`'s geometry instrument uses (ADR 0333), so the two share every cache entry. A
# *reference* is what makes a drag's endpoints independent of the code the drag is testing.
pdfref.workspace = true

[lints]
workspace = true
