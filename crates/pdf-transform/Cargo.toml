[package]
name = "pdf-transform"
description = "Derives files from documents this tree can read — pages as images, embedded images, embedded files — over one plan-and-sinks seam, and the command-line program that is its first consumer."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The readers, the display list, the correctness-oracle rasteriser, and the one PNG encoder the
# tree already ships. `viewer-core` is here for exactly one type, `Secret` — §7.6.4.1's password
# held so that it cannot be printed — because a second password type would be a second buffer to
# clear and a second `Debug` to audit (RFC 0002 section 5, ADR 0800). Nothing else of the viewer's
# vocabulary crosses: a transform is a batch job over documents no window has open.
#
# No argument-parsing dependency, following `tools/pdf-retrieve`: the argument grammar is small,
# stated in one place, and a dependency taken for it would be a dependency on the *shape* of argv
# rather than on anything hard (doc/third-party-data.md's rule). No serialisation dependency
# either, for the same reason `pdf-retrieve` gives: the report is a fixed shape this crate writes
# and never parses.
#
# `pdf-archive` is the one dependency here that is not a reader: it is the *judgement*. The
# `archive` verb converts a document to a part and level of ISO 19005, and every decision it
# takes is about a requirement that crate states, cites and checks — so a converter holding its
# own copy of the rules would be a second reading of a standard `CLAUDE.md` principle 5 says has
# one. It validates the input, decides one requirement at a time, and validates what it wrote.
#
# `pdf-font` is here for one thing and it is the same argument one crate over: converting a
# document to Level U means writing a `/ToUnicode` CMap derived from a font's own encoding, and
# what a character code selects — ISO 32000-2 §9.6.5's encoding, §9.10.2's
# glyph-name route to a character — is a reading this tree has already made once. A
# converter deriving it a second time would be a second reading of the same clauses.
[dependencies]
# The suite's own process split (ADR 2140, `doc/questions/A02`): the worker binary talks to its
# broker over `confined-transport`'s wire and confines itself with `pdf-sandbox`'s lockdown (named
# below), the two crates `pdf-vfs`'s worker already stands on.
confined-transport.workspace = true
pdf-archive.workspace = true
pdf-font.workspace = true
pdf-model.workspace = true
# §12.8 was extracted from `pdf-model` into its own crate in the thousandth session (ADR 1020);
# this crate reads signatures, so it names it directly.
pdf-signature.workspace = true
pdf-render.workspace = true
pdf-syntax.workspace = true
render-cpu.workspace = true
viewer-core.workspace = true
png.workspace = true
# §12.5.6.23's removal is geometric where a redaction meets a painted path, and two of its
# operations are this tree's own geometry vocabulary rather than a new one: expanding §8.5.3.2's
# stroke into the outline it marks, and splitting a §8.5.2.2 cubic at the parameter where it
# crosses the region's edge. `render-raster` already holds this library for the first of the two,
# so what is taken here is a reading this tree has made once rather than a dependency (ADR 1236).
kurbo.workspace = true
# The descriptor a standard font stated by name alone is given (ADR 2146) is read off the shipped
# face's own program — its bounding box, italic angle, stem and the extents its outlines reach —
# through the one font reader this tree already holds under `pdf-font`, rather than a second.
skrifa.workspace = true
rayon.workspace = true
# `doc/rfc/0007` section 4.4 asks a tool-invoking conversion to record "a digest of what it
# returned — so that a re-run can be *checked* even though it cannot be *guaranteed*". The same
# hash stack `pdf-syntax`, `pdf-model` and `pdf-signature` already take, rather than a second
# one: a fingerprint an auditor cannot reproduce with a standard command is not evidence.
sha2.workspace = true
thiserror.workspace = true
# The DCT encoder, reached through the confined worker that holds it: `optimize --images` and
# `render --format jpeg` ask it for a JPEG, and only those two, because nothing is re-encoded unless a
# format is explicitly requested (doc/questions/A01, ADR 2138). The `redact` verb's codec-image test
# (`tests/redact.rs`) names it too, selecting `Isolation::InProcess` so that it needs no worker
# binary beside it while running the same `decode::here` routine the worker runs.
pdf-sandbox.workspace = true
# A cleared `JPXDecode` component deeper than Table 87's sixteen bits is written back as
# JPEG 2000 by the tree's own lossless writer (ADR 2470).
pdf-jpx-write.workspace = true

# The oracle's own comparison, for one gate: RFC 0002 section 9 asks for "the
# rotation-transformed comparison for rotate", and a page rotated a quarter turn is rasterised on
# a different grid, so the measure it is held to is the tree's own rather than a second one
# written here (`tests/pages_corpus.rs`).
# And the harness that invokes the reference renderers, for one more: RFC 0002 section 9's
# foreign readback (`tests/foreign_corpus.rs`) shows what the four writers produce to poppler and
# mupdf, and how those two are spawned — the flags, the budget, the version probe — is a reading
# this tree has already paid for once (trap 3).
[dev-dependencies]
pdfref.workspace = true
raster-compare.workspace = true

[lints]
workspace = true
