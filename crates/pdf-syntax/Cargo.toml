[package]
name = "pdf-syntax"
description = "PDF lexer, object parser and cross-reference resolution."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2.workspace = true
thiserror.workspace = true
# ISO 32000-2 §7.6's standard security handler; see the workspace manifest for why each.
aes.workspace = true
cbc.workspace = true
rc4.workspace = true
md-5.workspace = true
sha2.workspace = true
# §7.6.5.3 derives a public-key handler's key of 128 bits or fewer with SHA-1, the one digest
# `sha2` and `md-5` do not carry.
sha1.workspace = true
# §7.6.5's recipient lists are RFC 5652 enveloped data and the reader's key an RSA key, read by
# the crate below this one and `pdf-signature` (ADR 2801).
pdf-pki.workspace = true
stringprep.workspace = true
getrandom.workspace = true

[dev-dependencies]
# Decodes the corpus witness of the `stream` keyword recovery (ADR 1365); a leaf crate with no
# dependencies of its own, so no cycle.
pdf-ccitt.workspace = true
test-scenes.workspace = true

[lints]
workspace = true
