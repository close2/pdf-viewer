[package]
name = "viewer-ui"
description = "Window, input, dialogs and accessibility."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
pdf-font.workspace = true
pdf-model.workspace = true
pdf-render.workspace = true
pdf-sandbox.workspace = true
# §8.11's groups are named by object identity, which is what `Command::SetGroup` carries,
# and §7.9.4's date is what §14.3.3's `/CreationDate` parses to.
pdf-syntax.workspace = true
render-cpu.workspace = true
render-quorra.workspace = true
# The typed refusals the presenter surfaces (swapchain states a host reacts to
# rather than reports), named directly for the match arms.
quorra-gpu.workspace = true
# A `quorra_gpu::Layer`'s placement and filter are `quorra-scene`'s `Affine` and `ImageFilter`,
# and `quorra-gpu` re-exports `wgpu` but not the scene crate — so a host that presents its own
# finished rasters names them itself. No scene is built here and none can be: this crate has no
# `SceneBuilder` and `render-quorra` remains the only translator in the tree.
quorra-scene.workspace = true
viewer-core.workspace = true
# The confined boundary, for the one binary here that sits on it: `pdf-viewer-confined` spawns
# `pdf-view-worker` and takes its pages over a pipe (ADR 0713). `pdf-viewer` names nothing from
# this crate, so the flagship's launch path still links no transport — an unused dependency is
# compiled beside a binary, never into it.
viewer-confined.workspace = true
# The host-side decisions that are not this window's: §O.2.1 says a processor may decline to open
# an embedded file a URI named, and that choice belongs beside §12.7.6.4's import policy rather
# than in each of the three hosts separately. Toolkit-free, so this costs no widget (ADR 0310).
viewer-host.workspace = true
# ISO 32000-2 §14.7's tree, handed to AccessKit and so to AT-SPI. The crate that owns the one
# asynchronous runtime in this tree, and the reason it is a crate: nothing on the launch path,
# the render path or the parse path may reach it. ADR 0214.
viewer-accessibility.workspace = true
winit.workspace = true
# The window with no graphics device behind it, which is what `--cpu` now means. See the
# workspace manifest's note for what it costs and ADR 0221 for why it is taken.
softbuffer.workspace = true
# The software path's refusals are typed, like every other error in this tree.
thiserror.workspace = true
# §14.8.2.5's text leaving the program. The one platform surface this host cannot reach through
# something it already links: `winit` offers no clipboard and `softbuffer` offers pixels. The two
# native hosts ask their own toolkits and name nothing here (ADR 0519); the workspace manifest
# prices the dependency and says why its two optional halves are off.
arboard.workspace = true

# The interactive spike example needs a scene, a target and a device. These are
# dev-dependencies because the shell itself will drive rendering through `viewer-core`
# rather than reaching for a backend directly.
[dev-dependencies]
test-scenes.workspace = true
# `examples/chrome_ladder` writes the frames it measured, so a person can look at the one the
# numbers accuse (trap 1).
png.workspace = true
# For `tests/notices.rs`, which checks the vendored fonts against the digests committed beside
# them. Already in the tree for ISO 32000-2 §7.6.4.3.4's Algorithm 2.B.
sha2.workspace = true

[lints]
workspace = true
