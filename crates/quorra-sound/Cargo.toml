[package]
name = "quorra-sound"
description = "The audio output a window plays §13.3's sounds on, in a helper program of its own started at the first sound, so that no window links an audio library (ADR 3317)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The helper program and its device. A window depends on this crate with no default features and
# so gets the wire and the client alone: neither `cpal` nor the C library under it reaches a
# window's graph, which is what keeps `libasound` out of the window's `NEEDED` list (ADR 3317).
default = ["device"]
device = ["dep:cpal", "dep:inherited-descriptors"]

[dependencies]
thiserror.workspace = true
# The audio output, for the helper program alone (`doc/stack.md`, ADR 3317); the workspace manifest
# prices it.
cpal = { workspace = true, optional = true }
# The helper's first statement closes the descriptors it inherited; the close and its one `unsafe`
# are that crate's, so the helper has none of its own (ADRs 1945, 3361).
inherited-descriptors = { workspace = true, optional = true }

[[bin]]
name = "quorra-sound"
path = "src/bin/quorra-sound.rs"
required-features = ["device"]

[lints]
workspace = true
