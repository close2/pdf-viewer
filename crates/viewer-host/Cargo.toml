[package]
name = "viewer-host"
description = "The half of a native host that is not the toolkit: three answers as one row shape, a field as a control, §12.7.6.4's file policy, and a launch timeline."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The boundary these mappings consume. Nothing else in this manifest is a host's.
viewer-core.workspace = true
# §12.7.5's `Control`, §7.9.4's date behind an attachment's `/ModDate`, and §12.3.3's outline.
pdf-model.workspace = true
# §12.5.6.5's link targets and §8.11's groups are named by object identity.
pdf-syntax.workspace = true
# §12.4.4.1's clock shapes a transition's frames, and a frame is a `DisplayList` over two
# `Image`s in a `Rect`; `Interrupt` is what takes a drawing thread back.
pdf-render.workspace = true
# `drawing` puts a tier-1 host's rasterisation on a thread of its own, and this is what draws
# there. Named rather than taken behind a `Rasterizer` parameter: it is the only backend in the
# tree that can be interrupted at all, which is ADR 0650's decision and not a preference.
render-cpu.workspace = true
# §12.8.1's third question is a host's to answer: this crate reads certificates off a disk and
# hands them in as RFC 5280 section 6.1.1's input (d). The crate is named for `Supply` and
# `Acceptance` and for nothing else — no signature is read here (ADR 1039, ADR 1076).
pdf-signature.workspace = true
# Every refusal in this crate is a typed error, as everywhere else in the tree.
thiserror.workspace = true
# §12.7.6.2's verb: the one HTTP client in the tree, blocking and without an async runtime, on
# `rustls` over `ring` with this machine's own trust store — no OpenSSL anywhere. The owner's
# answer to `doc/questions/Q98`, and ADR 1291 prices every package it brings.
ureq.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true

[lints]
workspace = true
