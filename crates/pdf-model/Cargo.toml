[package]
name = "pdf-model"
description = "Document and page-tree model built over parsed PDF objects."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Table 45's `/CheckSum` is an MD5 of an embedded file's bytes, and ICC.1 section 7.2.18's
# profile identifier is a second one; §7.6's algorithms already brought the crate into the tree.
md-5.workspace = true
pdf-colour.workspace = true
pdf-font.workspace = true
pdf-render.workspace = true
pdf-sandbox.workspace = true
# §12.8.2.2's `/DocMDP` level and §12.8.6's usage rights: what a document says may be changed
# without invalidating its author's signature, which `restriction.rs` and `view.rs` collect
# alongside Table 22's `/P` flags. That is the whole of this crate's reach into §12.8, and it is
# why the twelve cryptographic packages are still in this graph after the extraction — ADR 1020
# names the two call sites and what removing them would cost.
pdf-signature.workspace = true
pdf-spec.workspace = true
pdf-syntax.workspace = true
# §8.9.5's per-sample colour conversion, on a photograph, is embarrassingly parallel; see
# `image::rows_per_band` for the measurement that decided the threshold.
rayon.workspace = true
thiserror.workspace = true
# §14.3.2's metadata stream, read by `xmp.rs`. See the workspace manifest for why this
# tokenizer and doc/adr/0186 for the decision.
xmlparser.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
criterion.workspace = true
# The bounds `tests/corpus.rs`, `tests/dates.rs`, `tests/xmp.rs`, `tests/text_extraction.rs` and
# `tests/save_round_trip.rs` hold, each printed beside the population it bounds (ADR 1075).
gate-ratchet.workspace = true
flate2.workspace = true
iai-callgrind.workspace = true
pdfref.workspace = true
png.workspace = true
raster-compare.workspace = true
read-fonts.workspace = true
render-cpu.workspace = true
# `tests/raster_golden.rs` names each page by a SHA-256 of its pixels (ADR 1016). A test's hash,
# so a dev-dependency: nothing this crate ships computes one.
sha2.workspace = true
test-scenes.workspace = true

[lints]
workspace = true

[[bench]]
name = "interpret"
harness = false

[[bench]]
name = "instructions"
harness = false
