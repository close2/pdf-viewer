[package]
name = "pdf-model"
description = "Document and page-tree model built over parsed PDF objects."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The integration tests are grouped by subject into the `*_suite` binaries below, each file under
# `tests/` a module of one, and Cargo would otherwise make every file a binary of its own; ADR
# 3086 has the measurement. `tools/conformance/tests/test_targets.rs` fails on a file no target
# names, which is the one thing turning discovery off could hide.
autotests = false

[dependencies]
# Table 45's `/CheckSum` is an MD5 of an embedded file's bytes, and ICC.1 section 7.2.18's
# profile identifier is a second one; §7.6's algorithms already brought the crate into the tree.
md-5.workspace = true
pdf-colour.workspace = true
pdf-font.workspace = true
pdf-render.workspace = true
pdf-sandbox.workspace = true
# §12.8.2.2's `/DocMDP` level and §12.8.6's usage rights: what a document says may be changed
# without invalidating its author's signature, which `restriction.rs` and `view.rs` collect
# alongside Table 22's `/P` flags. That is the whole of this crate's reach into §12.8, and it is
# why the twelve cryptographic packages are still in this graph after the extraction — ADR 1020
# names the two call sites and what removing them would cost.
pdf-signature.workspace = true
pdf-syntax.workspace = true
# §8.9.5's per-sample colour conversion, on a photograph, is embarrassingly parallel; see
# `image::rows_per_band` for the measurement that decided the threshold.
rayon.workspace = true
thiserror.workspace = true
# §14.3.2's metadata stream, read by `xmp.rs`. See the workspace manifest for why this
# tokenizer and doc/adr/0186 for the decision.
xmlparser.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
criterion.workspace = true
# `examples/ccitt_decoder_census.rs` decodes every corpus fax stream with both decoders and
# compares them bit for bit — the measurement ADR 1349 rests on. The old decoder is evidence
# there, and a dev-dependency because nothing this crate ships decodes with it.
hayro-ccitt.workspace = true
pdf-ccitt.workspace = true
# `examples/integer_entry_census.rs` reads the Arlington model's integer entries; nothing this
# crate ships consults it.
pdf-spec.workspace = true
# The bounds `tests/corpus.rs`, `tests/dates.rs`, `tests/xmp.rs`, `tests/text_extraction.rs` and
# `tests/save_round_trip.rs` hold, each printed beside the population it bounds (ADR 1075).
gate-ratchet.workspace = true
flate2.workspace = true
iai-callgrind.workspace = true
pdfref.workspace = true
png.workspace = true
raster-compare.workspace = true
read-fonts.workspace = true
render-cpu.workspace = true
# `tests/raster_golden.rs` names each page by a SHA-256 of its pixels (ADR 1016). A test's hash,
# so a dev-dependency: nothing this crate ships computes one.
sha2.workspace = true
test-scenes.workspace = true

[lints]
workspace = true

# The walks the tier-2 gates name by `--test` (`doc/todo/02` section 2, `tools/state.sh`), each a
# binary of its own so that its name and its command do not change.

[[test]]
name = "actions"

[[test]]
name = "corpus"

[[test]]
name = "dates"

[[test]]
name = "drawn_while_read"

[[test]]
name = "fixed_documents"

[[test]]
name = "jpeg2000"

[[test]]
name = "oracle"

[[test]]
name = "raster_golden"

[[test]]
name = "save_round_trip"

[[test]]
name = "script_corpus"

[[test]]
name = "text_extraction"

[[test]]
name = "xmp"

# The subject suites: each a root whose `mod` lines name the files of one subject.

[[test]]
name = "annotations_suite"

[[test]]
name = "colour_suite"

[[test]]
name = "content_suite"

[[test]]
name = "forms_suite"

[[test]]
name = "images_suite"

[[test]]
name = "navigation_suite"

[[test]]
name = "syntax_suite"

[[test]]
name = "text_suite"

[[test]]
name = "transparency_suite"

[[bench]]
name = "interpret"
harness = false

[[bench]]
name = "instructions"
harness = false
