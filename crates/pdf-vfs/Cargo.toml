[package]
name = "pdf-vfs"
description = "RFC 0003's shared core: one declarative layout table over a document, the generation cache that answers it, and the broker side of the confined-worker protocol the file-system faces sit on."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The readers, reached the way RFC 0003 section 7 requires: `pdf-transform` for every derived
# *file* — a page taken out, a page drawn, an image, an embedded file — so that nothing here is a
# second implementation of a verb the transform suite already states, and `pdf-model` for the three
# answers no verb covers: a page's text, §14.3.3's information dictionary and §14.3.2's metadata
# stream. `pdf-syntax` for the bytes and for `FileBytes`, which is how a descriptor a broker opened
# reaches a reader (ADR 0812).
#
# No FUSE and no Qt: this crate is the core, and RFC 0003 section 7 puts both faces outside it.
# `fuser` is the FUSE face's dependency when that face is written and is deliberately not taken
# here, so the core builds and is tested with no kernel interface anywhere near it.
[dependencies]
# RFC 0003 section 6's confinement, and the wire under it. `pdf-sandbox` installs the seccomp
# filter, the Landlock domain and the address-space ceiling — the *same* `Profile::Interpreter`
# the viewer's worker uses, because the vfs worker does the same work and needs not one system
# call more (ADR 0847). `confined-transport` is the frame, the greeting, the descriptor-passing
# socket and the supervision of the child, shared with `viewer-confined` rather than written twice
# (ADR 0846). `rayon` for the same reason `viewer-confined` takes it: the confined process must
# *state* how many threads to rasterise with, because asking the machine reads `/proc/self/cgroup`.
confined-transport.workspace = true
# A confined process may not read the machine's font files, and has to say so before the
# confinement rather than discover it afterwards: `openat` is off the seccomp allow-list, whose
# action is a kill, so the substitution walk over `/usr/share/fonts` is fatal rather than empty
# (ADR 0870). `pdf_font::substitute::no_machine_fonts` is that statement.
pdf-font.workspace = true
pdf-model.workspace = true
pdf-sandbox.workspace = true
pdf-syntax.workspace = true
pdf-transform.workspace = true
rayon.workspace = true
thiserror.workspace = true

# The confinement probes need signal numbers to tell "killed by the seccomp filter" apart from
# every other way a process can end — which is a question only the platform with a filter can be
# asked.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
