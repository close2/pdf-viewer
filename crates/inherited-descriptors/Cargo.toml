[package]
name = "inherited-descriptors"
description = "A helper program's first statement: close every descriptor it inherited past the standard three, the tree's one such unsafe call (ADRs 1945, 3361)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The close is by number, from 3 to the last, which only `libc::close_range` can say: no safe
# wrapper closes a descriptor no object owns, because that is exactly what I/O safety forbids
# (ADR 1945). Linux's call, so Linux's dependency.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[lints]
workspace = true
