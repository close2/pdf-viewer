[package]
name = "pdf-sandbox"
description = "Process isolation for untrusted image decoding, and for the one image encoder."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pdf-ccitt.workspace = true
hayro-jbig2.workspace = true
hayro-jpeg2000.workspace = true
# The one encoder, for the transform suite's explicit JPEG requests: here and nowhere else, so that
# the samples a document's image decoded to reach its SIMD dependencies only inside the worker (ADR 2138).
mozjpeg-rs.workspace = true
thiserror.workspace = true
# The first statement of the program this crate builds closes the descriptors it inherited; the
# close and its one `unsafe` are that crate's, so the program has none of its own (ADRs 1945, 3361).
inherited-descriptors.workspace = true

# The confinement itself. seccomp-BPF and Landlock are Linux interfaces and `libc` is here
# for its system-call *numbers*, which are constants, so all three are Linux-only rather than
# dependencies with Linux-only call sites: a `cfg` inside the code would still make every
# other platform build them, and `seccompiler` is exactly what stopped compiling for Windows.
# What this crate does where they do not exist is `lockdown.rs`'s subject.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true

# `poll` on the worker's pipe, which is what gives a request a deadline. POSIX, so every unix
# has it; Windows reads on a thread instead and the reason is written in `lib.rs`.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# The confinement tests need signal numbers to tell "killed by the seccomp filter" apart
# from every other way a process can end — which is a question only the platform with a
# filter can be asked.
[dev-dependencies]
# A private directory for the program-location plant (`src/beside.rs`).
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true
# The script worker's probe asks for executable memory through a safe call, which is what a test
# of a crate that forbids `unsafe` needs (ADR 1608).
memmap2.workspace = true

[lints]
workspace = true
