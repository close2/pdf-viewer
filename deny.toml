# Supply-chain policy, enforced by `cargo deny check` in CI.
#
# A PDF viewer parses hostile input, so its dependency tree is part of its attack
# surface. Every addition should be a decision, not a convenience.

[advisories]
version = 2
yanked = "deny"
# An accepted advisory is recorded here with a comment explaining why it does not apply,
# so that the exception is reviewable rather than invisible.
ignore = [
    # Both reach the tree only through `iai-callgrind`, which is a dev-dependency of
    # `pdf-model` used to count instructions for the performance gates. Neither appears in
    # the shipped dependency graph at all — `cargo tree -e normal --workspace` finds no
    # occurrence of either — so no code a user runs contains them.
    #
    # Both advisories are "unmaintained" rather than a vulnerability: no exploit, no fix to
    # take. The exposure is limited to a developer or CI machine running `cargo bench`, and
    # the alternative is to give up deterministic performance measurement, which the
    # startup and page-turn gates in CLAUDE.md depend on.
    #
    # Revisit when iai-callgrind updates: `bincode` has several maintained replacements and
    # `proc-macro-error2` is only used by its macro crate.
    "RUSTSEC-2025-0141", # bincode 1.x unmaintained, via iai-callgrind
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained, via iai-callgrind-macros
]

[licenses]
version = 2
# Permissive licences only. This project is Apache-2.0, and everything it links is MIT,
# Apache-2.0 or another of the list below: a file-level copyleft such as MPL-2.0 would be
# compatible but is not needed by anything in the graph, and leaving it out keeps the answer
# to "what may I do with a build of this?" a single sentence.
#
# **The project's own licence is not on this list and does not need to be.** `cargo deny`
# reads the dependency graph, and the workspace members are in it — but Apache-2.0 is the
# first entry below for reasons that predate the relicensing, so nothing had to be added when
# the tree moved off MIT.
#
# **This list governs crates, not data.** `cargo deny` reads Cargo metadata, so the
# third-party font programs and character maps under `data/` are invisible to it — their
# terms are in `NOTICE` and are checked by `viewer-ui`'s own test instead.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # Public-domain dedication, so strictly more permissive than the rest of this list.
    # Reached via hexf-parse, a hex-float parser used by naga (wgpu's shader compiler).
    "CC0-1.0",
]
confidence-threshold = 0.93

# The ECMAScript engine, read against this list before anything else about it was measured
# (`doc/habits/measuring.md` habit 67). Of the 57 packages it adds, nine are `Unlicense OR MIT` —
# `boa_engine`, its six sibling crates, `small_btree` and `tag_ptr` — and satisfied by `MIT`; the
# fourteen Unicode tables beneath them (`icu_*`, `zerovec`, `zerotrie`, `tinystr`, `writeable`,
# `litemap`, `potential_utf`) are `Unicode-3.0`; `ryu-js` is `Apache-2.0 OR BSL-1.0`, satisfied by
# `Apache-2.0`; the other 33 are `MIT`, `Apache-2.0` or either. So the engine needs no line here,
# and this paragraph is the record that the absence is a decision rather than an oversight. It
# reaches a build only through `pdf-script`'s `engine` feature (ADR 1590).

# Two crates, one licence, and a narrow exception rather than a line in `allow` above.
#
# `BSL-1.0` is the Boost Software License: OSI-approved, permissive, and — unlike every entry
# above — it requires no notice in a **binary** distribution at all, so it is strictly less
# demanding than either MIT or this project's own Apache-2.0. It is not in `allow` because
# nothing in this tree is under it and a licence
# on that list is a standing permission; these two are named instead, which is the reviewable form.
#
# Both arrive through `arboard`, the clipboard `viewer-ui` reaches the platform with (ADR 0519),
# and **neither is ever compiled here**: `clipboard-win` is that crate's Windows backend and
# `error-code` is its dependency, both `cfg`-gated to `windows`. `cargo deny` reads the lockfile
# rather than a target's build plan, which is correct — a Windows build of this program *would*
# link them, and that is exactly the question this file is for.
exceptions = [
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
]

[bans]
# Two versions of the same crate usually means a dependency needs updating; it also
# inflates compile time and binary size. Warn rather than deny, because a transitive
# duplicate is often outside our control in the short term.
multiple-versions = "warn"
wildcards = "deny"

# Crates that must never appear in the tree, with the reason recorded.
deny = [
    # No colour-management engine may reach the rasteriser under `raster/`, which is
    # handed device RGB and has no profile parser to reach — its
    # `no_colour_management.rs` asserts that structurally and reads this list to check
    # the names are banned here too. The four came in with that sub-project on
    # 2026-09-06; the ban lives at the workspace root because that is where
    # `cargo deny` reads, and a ban in a nested file is a ban nothing enforces.
    { crate = "lcms2", reason = "no colour management in the rasteriser: it is handed device RGB" },
    { crate = "lcms2-sys", reason = "as lcms2" },
    # `moxcms` arrives in this graph through `hayro`, the reference implementation
    # `tools/hayro-compare` drives for the oracle, and through `image` beneath it. That
    # route is named rather than the ban dropped: nothing this project *ships* may reach a
    # colour-management engine, and a reference renderer we run for comparison is not
    # something we ship. Any other route fails the build, which is what the ban is for.
    { crate = "moxcms", reason = "as lcms2, in pure Rust", wrappers = ["hayro-interpret", "image"] },
    { crate = "qcms", reason = "as lcms2" },
    # Unmaintained; its successors are `zune-*` and the `image` crate family.
    { crate = "stb_image", reason = "unmaintained C image decoder" },
    # Text shaping must not enter the render path: PDF glyphs arrive pre-positioned,
    # so shaping them again moves them off the coordinates the document specifies.
    # If shaping is ever needed for text we generate ourselves, this entry is removed
    # in the same commit that documents why.
    { crate = "rustybuzz", reason = "see CLAUDE.md — shaping would break PDF text fidelity" },
    { crate = "harfbuzz-sys", reason = "as rustybuzz, and adds a C dependency" },
    # §12.7.6.2's submission is sent by `ureq` over `rustls` (the owner's answer to
    # `doc/questions/Q98`; ADR 1291 prices it). OpenSSL is the TLS stack that choice declines —
    # a C library of its own, linked from the system, with a history this program does not need
    # to inherit — and a ban is what keeps a later feature flag from bringing it in quietly.
    # `ring` is the one C and assembly package the choice does bring, built from source by `cc`
    # and reached only from `viewer-host`; ADR 1291 states that cost against CLAUDE.md principle 3.
    { crate = "openssl", reason = "the TLS stack ADR 1291 declined: rustls is the one this tree uses" },
    { crate = "openssl-sys", reason = "as openssl" },
    { crate = "native-tls", reason = "as openssl: it is OpenSSL on Linux" },
    # Mozilla's roots, under CDLA-Permissive-2.0, which the licence list above does not hold; the
    # roots are this machine's own trust store instead, through `rustls-native-certs` (ADR 1291).
    { crate = "webpki-roots", reason = "the machine's own trust store is used (ADR 1291)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The git dependencies, each pinned by revision through Cargo.lock: the commissioned document
# renderer (see the workspace manifest), first-party, and the codecs below.
allow-git = [
    "https://github.com/close2/quorra",
    # The second, third-party: upstream's repository of the JBIG2, JPEG 2000 and CCITT codecs, at
    # the commit their crates.io releases `hayro-jbig2` 0.3.1, `hayro-jpeg2000` 0.4.1 and
    # `hayro-ccitt` 0.4.0 were published from, whose `src/` each is byte for byte. A git source
    # rather than crates.io for one reason: it is a different package from the crates.io copy the
    # reference renderer `tools/hayro-compare` reaches through `hayro-syntax`, whose `unsafe`
    # feature turns on `simd`, and Cargo unifies a package's features over a build — so the
    # worker's codecs would otherwise be compiled with `fearless_simd` by any build that also
    # selects the reference renderer (ADR 1714). The owner's fork `close2/hayro` takes this
    # entry's place the day it carries `doc/patches/hayro-jbig2-*.patch` and the manifest pins it.
    "https://github.com/LaurenzV/hayro",
    # The third, the owner's fork of the JPEG codec: `zune-jpeg` 0.5.15's own commit `31d81fed`
    # with `doc/patches/zune-jpeg-*.patch` applied and nothing else, `zune-core` coming from the
    # same revision because `zune-jpeg` names it by path (doc/questions/A227, ADR 1730). It gives
    # this entry back the day a crates.io release carries both patches.
    "https://github.com/close2/zune-image",
]
