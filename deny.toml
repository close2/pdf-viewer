# Supply-chain policy, enforced by `cargo deny check` in CI.
#
# A PDF viewer parses hostile input, so its dependency tree is part of its attack
# surface. Every addition should be a decision, not a convenience.

[advisories]
version = 2
yanked = "deny"
# No ignores. An accepted advisory must be recorded here with a comment explaining
# why it does not apply, so that the exception is reviewable rather than invisible.
ignore = []

[licenses]
version = 2
# Permissive licences plus MPL-2.0 (this project's own licence, file-level copyleft).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # Public-domain dedication, so strictly more permissive than the rest of this list.
    # Reached via hexf-parse, a hex-float parser used by naga (wgpu's shader compiler).
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
# Two versions of the same crate usually means a dependency needs updating; it also
# inflates compile time and binary size. Warn rather than deny, because a transitive
# duplicate is often outside our control in the short term.
multiple-versions = "warn"
wildcards = "deny"

# Crates that must never appear in the tree, with the reason recorded.
deny = [
    # Unmaintained; its successors are `zune-*` and the `image` crate family.
    { crate = "stb_image", reason = "unmaintained C image decoder" },
    # Text shaping must not enter the render path: PDF glyphs arrive pre-positioned,
    # so shaping them again moves them off the coordinates the document specifies.
    # If shaping is ever needed for text we generate ourselves, this entry is removed
    # in the same commit that documents why.
    { crate = "rustybuzz", reason = "see CLAUDE.md — shaping would break PDF text fidelity" },
    { crate = "harfbuzz-sys", reason = "as rustybuzz, and adds a C dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
